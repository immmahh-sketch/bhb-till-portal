<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Black Friday Event | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--green-d:#364438;--brown:#3F2F28;--olive:#CCCDB4;--grey:#F8F8F8;--ink:#fff;--soft:rgba(255,255,255,.72);--black:#0b0c0b;--panel:#151716;--line:rgba(255,255,255,.12);
 --alert:#F0B8AE;--good:#BFE0C1;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
a{color:var(--olive)}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* hero */
.hero{position:relative;isolation:isolate;text-align:center;padding:54px 18px 60px;background:#000 url(img/hero.jpg) center 35%/cover;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.66) 45%,rgba(11,12,11,.98) 100%)}
.hero .logo{height:44px;width:auto;margin:0 auto 22px}
.kicker{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--olive);border:1px solid rgba(204,205,180,.5);border-radius:999px;padding:7px 16px 7px 20px}
.hero h1{font-size:clamp(46px,10vw,104px);line-height:.95;margin:18px 0 0;text-transform:uppercase;letter-spacing:.02em}
.hero h1 span{display:block;font-size:.42em;letter-spacing:.34em;color:var(--olive);margin-top:10px}
.hero .sub{max-width:620px;margin:20px auto 0;font-size:18px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.8)}
.hero .until{margin:14px auto 0;font-size:17px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.8)}.hero .until b{color:var(--olive)}
.burst{display:inline-grid;place-items:center;text-align:center;margin:26px auto 0;width:150px;height:150px;border-radius:50%;background:var(--olive);color:#111;position:relative;box-shadow:0 0 0 6px rgba(204,205,180,.25),0 12px 40px rgba(0,0,0,.5);transform:rotate(-6deg)}
.burst b{display:block;font-family:var(--display);font-size:54px;line-height:.9}
.burst small{display:block;font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.burst em{font-style:normal;display:block;font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:2px}
.cta{display:inline-block;margin-top:26px;background:var(--olive);color:#111;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:16px 30px;border-radius:999px;border:0;text-decoration:none;cursor:pointer;font-family:inherit}
.cta:hover{background:#fff}
.cta:disabled{opacity:.45;cursor:default}
.state{margin:22px auto 0;display:inline-flex;gap:9px;align-items:center;font-weight:700;font-size:14px;letter-spacing:.04em;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(4px)}
.state i{width:10px;height:10px;border-radius:50%;background:#7fd68a;box-shadow:0 0 0 4px rgba(127,214,138,.25)}
.state.off i{background:#e3b45c;box-shadow:0 0 0 4px rgba(227,180,92,.25)}

/* trust strip */
.strip{background:var(--green);color:#fff}
.strip .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 34px;padding-top:14px;padding-bottom:14px;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.strip span::before{content:"";display:inline-block;width:7px;height:7px;background:var(--olive);transform:rotate(45deg);margin:0 10px 1px 0}

/* vouchers */
section{padding:56px 0 8px}
.head{text-align:center;max-width:640px;margin:0 auto 30px}
.head h2{font-size:clamp(32px,6vw,46px);line-height:1.05}
.head p{color:var(--soft);margin:12px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:rgba(204,205,180,.5);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.card .pic{position:relative;aspect-ratio:4/3;overflow:hidden;background:#222}
.card .pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .pic img{transform:scale(1.04)}
.card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.save{position:absolute;z-index:2;left:14px;top:14px;background:var(--olive);color:#111;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.save b{font-size:15px}
.tag{position:absolute;z-index:2;right:14px;top:14px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border-radius:999px;backdrop-filter:blur(3px)}
.card .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:25px;line-height:1.12}
.card .subt{color:var(--olive);font-weight:600;font-size:14px;margin:6px 0 0}
.card ul{margin:14px 0 0;padding:0;list-style:none;color:var(--soft);font-size:15px}
.card li{padding:0 0 5px 22px;position:relative}
.card li::before{content:"";position:absolute;left:3px;top:9px;width:7px;height:7px;background:var(--olive);transform:rotate(45deg)}
.valid{margin:12px 0 0;font-size:13px;color:var(--soft);padding-top:12px;border-top:1px solid var(--line)}
.valid b{color:#fff}
.buy{margin-top:auto;padding-top:16px}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.price .now{font-family:var(--display);font-size:46px;line-height:1;font-weight:700}
.price .was{color:var(--soft);font-size:15px;text-decoration:line-through}
.price .yousave{margin-left:auto;font-size:13px;font-weight:700;color:var(--good);letter-spacing:.04em}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.qty button{width:42px;height:46px;background:transparent;color:#fff;border:0;font-size:22px;cursor:pointer;font-family:inherit}
.qty button:hover:not(:disabled){background:rgba(255,255,255,.1)}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{min-width:30px;text-align:center;font-weight:700}
.btn{flex:1;min-height:48px;border:0;border-radius:999px;background:var(--green);color:#fff;font:800 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0 18px;transition:background .15s}
.btn:hover:not(:disabled){background:#5f7661}
.btn:disabled{background:#2c322d;color:rgba(255,255,255,.5);cursor:default}
.btn.big{display:block;width:100%;min-height:56px;font-size:14px;background:var(--olive);color:#111}
.btn.big:hover:not(:disabled){background:#fff}
/* the featured stay */
.feature{grid-column:1/-1;flex-direction:row}
.feature .pic{aspect-ratio:auto;flex:1 1 52%;min-height:420px}
.feature .body{flex:1 1 48%;padding:30px 30px 28px}
.feature h3{font-size:34px}
.feature .price .now{font-size:62px}
.feature.rev{flex-direction:row-reverse}
.feature .pic img{position:absolute;inset:0}

/* basket bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,11,10,.96);border-top:1px solid rgba(204,205,180,.4);backdrop-filter:blur(8px);transform:translateY(110%);transition:transform .25s}
.bar.on{transform:none}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.bar .sum{flex:1;font-weight:700}
.bar .sum small{display:block;color:var(--soft);font-weight:500;font-size:13px}
.bar .cta{margin:0;padding:14px 26px}

/* checkout */
#checkout{background:var(--panel);border:1px solid rgba(204,205,180,.35);border-radius:var(--radius);padding:28px 24px;max-width:640px;margin:0 auto}
#checkout h2{font-size:34px;text-align:center}
.lines{width:100%;border-collapse:collapse;margin:18px 0 6px}
.lines td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
.lines td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.lines tr.t td{border-bottom:0;font-family:var(--display);font-size:28px;padding-top:14px}
label.f{display:block;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin:16px 0 6px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:14px 14px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:#0c0d0c;color:#fff}
input:focus{outline:2px solid var(--olive);outline-offset:1px}
.chk{display:flex;gap:11px;align-items:flex-start;margin:18px 0 4px;font-size:14px;color:var(--soft)}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--olive);flex:0 0 auto}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.err{background:rgba(240,184,174,.12);border:1px solid rgba(240,184,174,.5);color:var(--alert);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.fine{font-size:13px;color:var(--soft);text-align:center;margin:12px 0 0}
.link{background:none;border:0;color:var(--olive);text-decoration:underline;cursor:pointer;font:inherit;padding:0}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;text-align:center}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--green);font-family:var(--display);font-size:26px;margin:0 auto 12px}
.step h3{font-size:22px}
.step p{color:var(--soft);margin:8px 0 0;font-size:15px}
.step a{color:#fff;font-weight:800;text-decoration:none;font-size:20px}

/* place band */
.band{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-top:6px}
.band figure{margin:0;position:relative;border-radius:var(--radius);overflow:hidden;min-height:260px;background:#222}
.band img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.band figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}

/* terms */
.terms{max-width:760px;margin:0 auto;color:var(--soft);font-size:15px}
.terms ul{padding-left:20px}.terms li{margin:0 0 7px}
.terms h2{font-size:30px;color:#fff;text-align:center;margin-bottom:14px}
footer{padding:44px 18px 60px;text-align:center;color:var(--soft);font-size:14px}
footer b{color:#fff}

/* paid page */
.thanks{max-width:720px;margin:0 auto;text-align:center;padding:34px 18px 10px}
.thanks h1{font-size:clamp(36px,7vw,56px);line-height:1}
.thanks p{color:var(--soft)}
.v{background:#fff;color:#1a1a1a;border-radius:var(--radius);margin:0 0 18px;overflow:hidden;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.5)}
.v .top{background:var(--green);color:#fff;padding:12px;font-weight:800;font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.v .mid{padding:24px 18px}
.v h3{color:var(--brown);font-size:28px;line-height:1.1}
.v .lab{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#6B786C;margin-top:18px;font-weight:700}
.v .code{font-family:"Courier New",monospace;font-size:clamp(26px,7vw,40px);font-weight:700;letter-spacing:.12em;color:var(--green);margin-top:2px}
.v .when{margin-top:14px;font-size:15px;color:#444}
.v.used{opacity:.55}
.howto{background:rgba(204,205,180,.12);border:1px solid rgba(204,205,180,.4);border-radius:var(--radius);padding:18px;margin:6px 0 18px;text-align:left}
.howto a{color:#fff;font-weight:800}
.spin{display:inline-block;width:30px;height:30px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--olive);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

body.embed .logo,body.embed footer .brandline{display:none}
body.embed .hero{padding-top:36px}
body.embed footer{padding-bottom:24px}

@media (max-width:820px){.feature,.feature.rev{flex-direction:column}.feature .pic{min-height:0;aspect-ratio:4/3;flex:none}.feature .pic img{position:static}.feature .body{padding:22px}.feature h3{font-size:28px}.feature .price .now{font-size:52px}.band{grid-template-columns:1fr}.band figure{min-height:200px}.steps{grid-template-columns:1fr}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.hero{padding-bottom:44px}.hero .sub{font-size:16px}.burst{width:128px;height:128px}.burst b{font-size:44px}.bar .cta{padding:13px 18px}#checkout{padding:22px 16px}.price .now{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.spin{animation-duration:3s}}
@media print{body{background:#fff;color:#000}.hero,.strip,.bar,footer,.noprint{display:none!important}.v{box-shadow:none;border:2px solid #000;break-inside:avoid}.thanks p{color:#333}}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:90px 0"><span class="spin"></span></div></div>
<div class="bar" id="bar"><div class="wrap"><div class="sum" id="barsum"></div><button class="cta" id="barbtn" type="button">Checkout</button></div></div>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/voucher-api";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const Q = new URLSearchParams(location.search);
const ORDER = Q.get("o") || "";
const EMBED = Q.get("embed") === "1";      // shown inside the website: tells the page around it how tall it is
if (EMBED) document.body.classList.add("embed");
const tellHeight = () => { if (EMBED && parent !== window) parent.postMessage({ bhbHeight: document.documentElement.scrollHeight }, "*"); };
if (EMBED && window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const gbp = n => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: Math.round(Number(n) * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 });
const PHONE = "01207 232 569", TEL = "tel:01207232569";
const POS = { stay:"50% 62%", tea:"50% 38%", steak:"50% 50%", sunday:"50% 66%", money:"50% 45%", money50:"50% 50%", hottub:"50% 55%" };
const tagFor = p => p.key === "stay" ? "Best saving" : p.key === "hottub" ? "Romantic stay" : p.kind === "money" ? "Gift voucher" : "For two";
let I = null, BASKET = {}, BUSY = false;

async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const open = () => I && I.sale.state === "open";
const total = () => I.products.reduce((t, p) => t + (BASKET[p.key] || 0) * p.price, 0);
const count = () => Object.values(BASKET).reduce((t, n) => t + n, 0);

function card(p, feat, rev){
  const left = Math.round((p.normal_price - p.price) * 100) / 100, q = BASKET[p.key] || 0, max = I.max_per_voucher;
  return '<article class="card' + (feat ? " feature" : "") + (rev ? " rev" : "") + '" id="c-' + p.key + '">' +
    '<div class="pic"><img src="img/' + esc(p.photo) + '" style="object-position:' + (POS[p.key] || "50% 50%") + '" alt="' + esc(p.title) + '" loading="lazy"><span class="save">Save up to <b>' + p.save_pct + '%</b></span><span class="tag">' + tagFor(p) + '</span></div>' +
    '<div class="body"><h3>' + esc(p.title) + '</h3><div class="subt">' + esc(p.subtitle) + '</div>' +
    '<ul>' + p.includes.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' +
    '<div class="valid"><b>' + esc(p.valid_text) + '</b>. Buy online first, then phone us to book.</div>' +
    '<div class="buy"><div class="price"><span class="now">' + gbp(p.price) + '</span><span class="was">Normally ' + gbp(p.normal_price) + '</span><span class="yousave">You save ' + gbp(left) + '</span></div>' +
    '<div class="actions"><div class="qty"><button type="button" data-q="-" data-k="' + p.key + '" aria-label="One fewer"' + (q <= 0 ? " disabled" : "") + '>&minus;</button><output id="q-' + p.key + '">' + q + '</output><button type="button" data-q="+" data-k="' + p.key + '" aria-label="One more"' + (q >= max || !open() ? " disabled" : "") + '>+</button></div>' +
    '<button class="btn" type="button" data-buy="' + p.key + '"' + (open() ? "" : " disabled") + '>' + (open() ? "Buy now" : "Not on sale yet") + '</button></div></div></div></article>';
}
function render(){
  const ps = I.products, maxSave = I.max_save, feat = ps[0], rest = ps.slice(1);
  $("#app").innerHTML =
  '<header class="hero">' + (EMBED ? "" : '<a href="https://www.blackhorsebeamish.co.uk" target="_top"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"></a>') +
    '<span class="kicker">Black Horse Beamish</span><h1>Black Friday<span>Event</span></h1>' +
    '<p class="sub">Overnight stays, dinner, afternoon tea and gift vouchers for less. Buy your voucher online and we email it to you straight away. Once you have it, phone us to book.</p>' +
    (open() && I.sale.closes_text ? '<p class="until">The Black Friday Event runs until the end of <b>' + esc(I.sale.closes_text) + '</b>. Buy before it ends.</p>' : "") +
    '<div class="burst"><div><em>Save up to</em><b>' + maxSave + '%</b><small>Black Friday</small></div></div><br>' +
    '<span class="state' + (open() ? "" : " off") + '"><i></i>' + (open() ? "On sale now" + (I.sale.closes_text ? " until " + esc(I.sale.closes_text) : "") : esc(I.sale.message)) + '</span><br>' +
    (open() ? '<a class="cta" href="#vouchers">See the vouchers</a>' : "") + '</header>' +
  '<div class="strip"><div class="wrap"><span>Buy online by card</span><span>Voucher emailed to you</span><span>Then phone to book</span>' + (open() && I.sale.closes_text ? '<span>Ends ' + esc(I.sale.closes_text) + '</span>' : '') + '</div></div>' +
  '<section id="vouchers"><div class="wrap"><div class="head"><h2>The Black Friday vouchers</h2><p>Seven ways to treat yourself, or someone you love. The gift vouchers can be spent on anything at Black Horse Beamish.</p></div>' +
    '<div class="grid">' + card(feat, true) + rest.map(p => card(p, false)).join("") + '</div></div></section>' +
  '<section id="pay" style="display:none"><div class="wrap"><div id="checkout"></div></div></section>' +
  '<section><div class="wrap"><div class="head"><h2>How it works</h2></div><div class="steps">' +
    '<div class="step"><h3>Buy your voucher online</h3><p>Choose your voucher and pay securely by card on this page. It takes a couple of minutes.</p></div>' +
    '<div class="step"><h3>We email it to you</h3><p>Your voucher and its voucher number arrive by email as soon as your payment is confirmed.</p></div>' +
    '<div class="step"><h3>Then phone us to book</h3><p>Once you have your voucher, ring us on<br><a href="' + TEL + '">' + PHONE + '</a><br>and quote your voucher number to make your booking.</p></div></div><p class="fine" style="margin-top:16px">You need to have bought your voucher first: the voucher number is what we ask for when you call.</p></div></section>' +
  '<section><div class="wrap"><div class="band"><figure><img src="img/house.jpg" alt="The Red Row cottages at Black Horse Beamish" loading="lazy"><figcaption>Red Row, Beamish</figcaption></figure><figure><img src="img/hero.jpg" alt="Afternoon tea board beside the fire" loading="lazy"><figcaption>By the fire</figcaption></figure><figure><img src="img/bath.jpg" alt="Copper bath in a Red Row room" loading="lazy" style="object-position:50% 70%"><figcaption>Your room awaits</figcaption></figure></div></div></section>' +
  '<section><div class="wrap terms"><h2>Good to know</h2><ul>' +
    '<li><b>Buy your voucher online first. Once you have it, phone us on <a href="' + TEL + '">' + PHONE + '</a> to book and quote your voucher number.</b> Bookings are made by phone only.</li>' +
    '<li>The overnight stay is available to book until <b>' + esc(longDate(I.stay_book_by)) + '</b>.</li>' +
    '<li>All other vouchers are valid for <b>' + I.expiry_months + ' months</b> from the day you buy them.</li>' +
    '<li>Gift vouchers must be used in one transaction.</li>' +
    '<li>Vouchers can only be used at Black Horse Beamish.</li>' +
    (I.terms_extra ? I.terms_extra.split(/\n+/).map(t => '<li>' + esc(t) + '</li>').join("") : "") + '</ul></div></section>' +
  '<footer><div class="brandline"><b>Black Horse Beamish</b><br>Red Row Estate, Beamish, Co. Durham DH9 0RW</div>Questions? Phone <a href="' + TEL + '">' + PHONE + '</a> or email <a href="mailto:stay@blackhorsebeamish.co.uk">stay@blackhorsebeamish.co.uk</a>.</footer>';
  bar(); tellHeight();
}
const longDate = ymd => new Intl.DateTimeFormat("en-GB", { timeZone:"UTC", day:"numeric", month:"long", year:"numeric" }).format(new Date(ymd + "T12:00:00Z"));

function bar(){
  const n = count();
  $("#bar").classList.toggle("on", n > 0 && open() && !$("#pay").style.display.includes("block"));
  $("#barsum").innerHTML = n ? n + " voucher" + (n === 1 ? "" : "s") + "<small>Total " + gbp(total()) + "</small>" : "";
}
function setQty(k, d){
  const max = I.max_per_voucher, q = Math.max(0, Math.min(max, (BASKET[k] || 0) + d)); BASKET[k] = q; if (!q) delete BASKET[k];
  const out = $("#q-" + k); if (out) out.textContent = q;
  const c = $("#c-" + k); if (c){ c.querySelector('[data-q="-"]').disabled = q <= 0; c.querySelector('[data-q="+"]').disabled = q >= max; }
  bar();
}
function checkout(){
  if (!count()) return;
  const lines = I.products.filter(p => BASKET[p.key]).map(p => '<tr><td>' + BASKET[p.key] + ' &times; ' + esc(p.title) + '</td><td>' + gbp(BASKET[p.key] * p.price) + '</td></tr>').join("");
  $("#checkout").innerHTML = '<h2>Your order</h2><table class="lines">' + lines + '<tr class="t"><td>Total</td><td>' + gbp(total()) + '</td></tr></table>' +
    '<form id="form" novalidate><label class="f" for="nm">Your name</label><input id="nm" type="text" autocomplete="name" maxlength="80">' +
    '<label class="f" for="em">Email address</label><input id="em" type="email" autocomplete="email" maxlength="120"><div class="fine" style="text-align:left;margin:6px 0 0">Your voucher number is emailed here.</div>' +
    '<label class="f" for="ph">Phone number</label><input id="ph" type="tel" autocomplete="tel" maxlength="30">' +
    '<div class="hp" aria-hidden="true"><label>Website<input id="web" type="text" tabindex="-1" autocomplete="off"></label></div>' +
    '<label class="chk"><input id="ok" type="checkbox"><span>I am happy for Black Horse Beamish to use these details to look after my order.</span></label>' +
    '<div id="msg"></div><button class="btn big" id="go" type="submit">Pay ' + gbp(total()) + ' by card</button>' +
    '<p class="fine">You will be taken to SumUp\'s secure payment page. Nothing is charged until you pay there.<br><button class="link" type="button" id="back">Change my order</button></p></form>';
  $("#pay").style.display = "block"; bar();
  $("#form").addEventListener("submit", e => { e.preventDefault(); pay(); });
  $("#back").addEventListener("click", () => { $("#pay").style.display = "none"; bar(); $("#vouchers").scrollIntoView(); });
  $("#pay").scrollIntoView({ behavior:"smooth", block:"start" }); if (EMBED && parent !== window) parent.postMessage({ bhbTop:true }, "*");
  tellHeight();
}
async function pay(){
  if (BUSY) return; const msg = $("#msg"); msg.innerHTML = "";
  const name = $("#nm").value.trim(), email = $("#em").value.trim(), phone = $("#ph").value.trim();
  const bad = t => { msg.innerHTML = '<div class="err">' + esc(t) + '</div>'; tellHeight(); };
  if (!name) return bad("Please tell us your name.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return bad("That email address doesn't look right.");
  if (phone.replace(/\D/g, "").length < 10) return bad("Please enter a phone number we can reach you on, including the area code.");
  if (!$("#ok").checked) return bad("Please tick the box to say we may use your details to look after your order.");
  BUSY = true; const go = $("#go"); go.disabled = true; go.textContent = "Taking you to the secure payment page...";
  try {
    const r = await call("start", { name, email, phone, consent:true, website:$("#web").value, items:BASKET });
    if (!r.url) throw new Error("Something went wrong. Please try again.");
    if (EMBED && parent !== window) parent.postMessage({ bhbTop:true, bhbPay:r.url }, "*"); else location.href = r.url;
  } catch (e) { BUSY = false; go.disabled = false; go.textContent = "Pay " + gbp(total()) + " by card"; bad(e.message); }
}

document.addEventListener("click", e => {
  const q = e.target.closest("[data-q]"); if (q) { setQty(q.dataset.k, q.dataset.q === "+" ? 1 : -1); return; }
  const b = e.target.closest("[data-buy]"); if (b && !b.disabled) { if (!BASKET[b.dataset.buy]) setQty(b.dataset.buy, 1); checkout(); return; }
  if (e.target.id === "barbtn") checkout();
});

/* ---------------- the page the buyer comes back to after SumUp, and from the link in the email */
async function paidPage(tries){
  const app = $("#app");
  if (!tries) app.innerHTML = '<div class="thanks"><span class="spin"></span><p>Checking your payment...</p></div>';
  let d; try { d = await call("check", { t: ORDER }); } catch (e) { app.innerHTML = '<div class="thanks"><h1>Order not found</h1><p>' + esc(e.message) + '</p></div>'; tellHeight(); return; }
  if (d.status === "pending" && d.pay_url && (tries || 0) < 8) { setTimeout(() => paidPage((tries || 0) + 1), 2500); return; }
  if (d.status === "paid") {
    const many = d.vouchers.length > 1;
    app.innerHTML = '<header class="hero" style="padding-bottom:30px">' + (EMBED ? "" : '<img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish">') + '<span class="kicker">Black Friday Event</span></header>' +
      '<div class="thanks"><h1>Thank you, ' + esc(d.first) + '</h1><p>Your payment of ' + gbp(d.amount) + ' has been received. ' + (d.email ? 'We have emailed your ' + (many ? "vouchers" : "voucher") + ' to <b>' + esc(d.email) + '</b>.' : "") + ' Keep ' + (many ? "these numbers" : "this number") + ' safe.</p>' +
      '<div class="howto"><b>What happens next</b><br>Now that you have your ' + (many ? "vouchers" : "voucher") + ', phone us on <a href="' + TEL + '">' + d.phone + '</a> to make your booking, and quote your voucher number.</div></div>' +
      '<div class="wrap" style="max-width:720px">' + d.vouchers.map(v =>
        '<div class="v' + (v.status === "redeemed" || v.status === "voided" ? " used" : "") + '"><div class="top">Black Friday voucher</div><div class="mid"><h3>' + esc(v.title) + '</h3><div class="lab">Voucher number</div><div class="code">' + esc(v.code) + '</div><div class="when">' + esc(v.expires_text) +
        (v.kind === "money" ? '<br>Worth ' + gbp(v.face_value) + ' to spend on anything at Black Horse Beamish, in one transaction' : "") +
        (v.status === "redeemed" ? '<br><b>Used</b>' : v.status === "voided" ? '<br><b>Cancelled</b>' : "") + '</div></div></div>').join("") +
      '<p style="text-align:center" class="noprint"><button class="cta" type="button" onclick="window.print()">Print ' + (many ? "vouchers" : "voucher") + '</button></p>' +
      '<div class="terms" style="margin:20px auto 40px"><ul><li>Vouchers can only be used at Black Horse Beamish. Bookings are made by phone, quoting your voucher number.</li>' + (d.vouchers.some(v => v.kind === "stay") ? '<li>The overnight stay is available to book until ' + esc(longDate(d.stay_book_by)) + '.</li>' : "") +
        (d.vouchers.some(v => v.kind !== "stay") ? '<li>Other vouchers are valid for ' + d.expiry_months + ' months from the day they were bought.</li>' : "") + (d.terms_extra ? d.terms_extra.split(/\n+/).map(t => '<li>' + esc(t) + '</li>').join("") : "") + '</ul></div></div>';
  } else if (d.status === "pending" && d.pay_url) {
    app.innerHTML = '<div class="thanks"><h1>Waiting for your payment</h1><p>We have not had confirmation of your payment yet. If you have just paid, give it a minute and look again. Otherwise you can finish paying now.</p><p><a class="cta" href="' + esc(d.pay_url) + '" target="_top">Pay ' + gbp(d.amount) + '</a> <button class="cta" style="background:transparent;color:#fff;border:1px solid #fff" onclick="paidPage(0)">Look again</button></p></div>';
  } else {
    app.innerHTML = '<div class="thanks"><h1>This order was not completed</h1><p>We did not receive a payment, so nothing has been bought and your card has not been charged.</p><p><a class="cta" href="' + esc(location.pathname + (EMBED ? "?embed=1" : "")) + '">Start again</a></p><p>If you think you were charged, phone us on <a href="' + TEL + '">' + d.phone + '</a> and we will sort it out.</p></div>';
  }
  window.scrollTo({ top:0 }); tellHeight();
}

(async function(){
  if (ORDER) return paidPage(0);
  try { I = await call("info"); render(); }
  catch (e) { $("#app").innerHTML = '<div class="thanks"><h1>Black Friday Event</h1><p>We could not load the vouchers just now. Please try again in a moment, or phone us on <a href="' + TEL + '">' + PHONE + '</a>.</p></div>'; tellHeight(); }
})();
</script>
</body>
</html>
