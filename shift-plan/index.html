<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift plan — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --good:#4F6B4F; --good-bg:#EDF2ED; --blue:#34546F; --blue-bg:#E7EEF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:760px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:20px 0 14px}
.bar h2{font-size:26px; color:var(--sage); margin-right:auto}
.btn{border:1px solid var(--sage); background:var(--white); color:var(--sage); border-radius:8px; padding:6px 14px; cursor:pointer; font-size:14px; font-weight:600; min-height:40px}
.btn:hover{background:var(--sage-10)} .btn:disabled{opacity:.45; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.hero{border-top:5px solid var(--sage)}
.hero h3{font-size:14px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-family:var(--body); font-weight:700}
.mine{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.myrole{border-radius:10px; background:var(--good-bg); padding:14px 16px; font-family:var(--display); font-size:30px; line-height:1.1; color:var(--sage)}
.myrole.m{background:var(--blue-bg); color:var(--blue)}
.myrole .tt{display:block; font-family:var(--body); font-size:20px; font-weight:700; margin-bottom:2px}
.now{display:inline-block; margin-left:8px; font-family:var(--body); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; background:var(--sage); color:#fff; border-radius:999px; padding:2px 10px; vertical-align:middle}
.myrole small{display:block; font-family:var(--body); font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75; margin-top:4px}
.none{font-size:17px; color:var(--sage-70); padding:6px 0}
.shift{margin-top:12px; font-size:14px; color:var(--sage-70)}
.sect h3{font-size:22px; color:var(--sage); margin-bottom:8px}
.row{display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--mist); align-items:baseline}
.row:first-of-type{border-top:0}
.row .r{flex:0 0 46%; font-weight:600; font-size:14px}
.row .p{flex:1; font-size:14px}
.row .p b{color:var(--sage); background:var(--good-bg); border-radius:6px; padding:0 6px}
.muted{color:var(--sage-70)} .empty-msg{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin{padding-left:12px;padding-right:12px} .bar h2{font-size:22px} .row .r{flex-basis:44%} .myrole{font-size:26px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Shift plan</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Shift plan<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <div class="shell"><div id="views"></div></div>
</div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { me:null, d:null };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = v => String(v ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const fmtDay = d => { try { return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"long", day:"numeric", month:"long" }); } catch(e){ return d; } };
const addDays = (d, n) => { const t = new Date(d+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/shiftplan-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
function render(){
  const d = S.d, label = k => (d.roles.find(r => r.key === k) || {}).label || k, area = k => (d.roles.find(r => r.key === k) || {}).area;
  const isToday = d.date === d.today, rel = isToday ? "today" : d.date === addDays(d.today, 1) ? "tomorrow" : d.date === addDays(d.today, -1) ? "yesterday" : "that day";
  const ukNow = new Intl.DateTimeFormat("en-GB", { timeZone:"Europe/London", hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date());
  const span = a => (a.start || a.start_time || a.end || a.end_time) ? `${a.start || a.start_time || ""}–${a.end || a.end_time || ""}` : "";
  const isNow = a => isToday && (!(a.start || a.start_time) || (a.start || a.start_time) <= ukNow) && (!(a.end || a.end_time) || ukNow < (a.end || a.end_time));
  const mine = d.mine.map(m => ({ ...m, role: d.roles.find(r => r.key === m.role_key) })).filter(m => m.role).sort((x, y) => (x.start || "").localeCompare(y.start || ""));
  const groups = ["restaurant", "marquee"].map(a => ({ a, rows: d.roles.filter(r => r.area === a).map(r => ({ r, people: d.assignments.filter(x => x.role_key === r.key) })).filter(x => x.people.length) })).filter(g => g.rows.length);
  const meOn = a => (a.person_email && a.person_email.toLowerCase() === d.me.email) || (!a.person_email && norm(a.person_name) === norm(d.me.name));
  $("#views").innerHTML = `
    <div class="bar"><h2>${esc(fmtDay(d.date))}</h2>
      <button class="btn" data-act="prev" aria-label="Day before">&lsaquo;</button>
      <button class="btn" data-act="today"${isToday ? " disabled" : ""}>Today</button>
      <button class="btn" data-act="next" aria-label="Day after">&rsaquo;</button></div>
    <div class="card hero"><h3>Your role${mine.length === 1 ? "" : "s"} ${esc(rel)}</h3>
      ${mine.length ? `<div class="mine">${mine.map(m => `<div class="myrole${m.role.area === "marquee" ? " m" : ""}">${span(m) ? `<span class="tt">${esc(span(m))}</span>` : ""}${esc(m.role.label)}${isNow(m) && mine.length > 1 ? `<span class="now">now</span>` : ""}<small>${m.role.area === "marquee" ? "Marquee" : "Restaurant"}${span(m) ? "" : mine.length > 1 ? " · whole shift" : ""}</small></div>`).join("")}</div>` : `<div class="none">Nothing has been given to you ${esc(rel)} yet.${d.assignments.length ? "" : " The plan has not been made yet."} Ask your manager if you are unsure.</div>`}
      ${d.shift ? `<div class="shift">Your shift ${esc(rel)}: <b>${esc(d.shift)}</b></div>` : ""}</div>
    ${groups.length ? groups.map(g => `<div class="card sect"><h3>${g.a === "marquee" ? "Marquee" : "Restaurant"}</h3>${g.rows.map(x => `<div class="row"><div class="r">${esc(x.r.label)}</div><div class="p">${x.people.map(a => { const t = span(a); const nm = esc(a.person_name) + (t ? ` <span class="muted">${esc(t)}</span>` : ""); return meOn(a) ? `<b>${esc(a.person_name)}</b>${t ? ` <span class="muted">${esc(t)}</span>` : ""}` : nm; }).join(", ")}</div></div>`).join("")}</div>`).join("") : `<div class="card"><div class="muted">No plan has been made for ${esc(rel)} yet.</div></div>`}`;
}
async function load(date){
  $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  try { S.d = await call("mine", { date }); } catch(e){ $("#views").innerHTML = `<div class="empty-msg">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = S.d.me; $("#whoname").textContent = S.me.name; render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled || !S.d) return;
  if (b.dataset.act === "prev") load(addDays(S.d.date, -1)); else if (b.dataset.act === "next") load(addDays(S.d.date, 1)); else if (b.dataset.act === "today") load("");
});
function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", ()=>{ try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
(function(){ if (staffEmail()) { $("#gate").hidden = true; $("#app").hidden = false; load(""); } else openGate(); })();
</script>
</body>
</html>
