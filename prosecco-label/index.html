<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prosecco Labels - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C; --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --red:#B3261E; --good:#2F5B31; --good-bg:#EDF2ED; --attn:#B08D57; --attn-bg:#F7F0E4;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1100px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important} a{color:var(--sage)}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15} .gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 80px}
header.top{background:var(--sage); color:var(--white)} .topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1} .brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9} .who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)} .tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 14px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.pagehead{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin:22px 0 8px} .pagehead h2{font-size:30px; color:var(--sage)}
.lead{color:var(--sage-70); margin:0 0 16px; max-width:70ch}
.card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px}
.card h3{font-size:22px; color:var(--sage); margin:0 0 8px}
.muted{color:var(--sage-70)} .small{font-size:13px}
.btn{display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--sage); background:var(--sage); color:#fff; border-radius:10px; padding:0 18px; min-height:46px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
.btn.ghost{background:#fff; color:var(--sage)} .btn.small{min-height:34px; padding:0 12px; font-size:11px} .btn.danger{background:#fff; border-color:var(--alert); color:var(--alert)} .btn:disabled{opacity:.55; cursor:default}
.grid{display:grid; gap:12px 16px} .g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))} .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f label{display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--sage-70); margin:0 0 4px}
.f input,.f select{width:100%; min-height:42px; font-size:15px; padding:6px 10px; border:1px solid var(--celadon); border-radius:8px; background:#fff}
.f input[type=color]{padding:2px; min-height:42px}
table.t{border-collapse:collapse; width:100%} table.t th{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70); text-align:left; padding:6px 8px; border-bottom:2px solid var(--mist)} table.t td{padding:8px; border-bottom:1px solid var(--mist); vertical-align:middle} .tw{overflow-x:auto}
table.lines input,table.lines select{min-height:38px; width:100%; min-width:62px; border:1px solid var(--celadon); border-radius:6px; padding:4px 8px; background:#fff} table.lines td{padding:6px 5px}
.pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--sage-10); color:var(--sage-70)} .pill.ok{background:var(--good-bg); color:var(--good)} .pill.bad{background:var(--alert-bg); color:var(--alert)} .pill.warn{background:var(--attn-bg); color:#7a5f36}
.notice{padding:10px 12px; border-radius:8px; font-size:14px; background:var(--sage-10)} .notice.bad{background:var(--alert-bg); color:var(--alert)} .notice.ok{background:var(--good-bg); color:var(--good)} .notice.warn{background:var(--attn-bg); color:#7a5f36}
.sheetprev{max-width:260px; margin:0 auto}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(30px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; opacity:0; pointer-events:none; transition:.2s; z-index:900; font-size:14px} .toast.on{opacity:1; transform:translateX(-50%)} .toast.bad{background:var(--red)}
.two-col{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start} @media(max-width:820px){.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Prosecco Labels</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="notice bad" id="gerr" style="display:none;margin-top:12px"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Prosecco Labels<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span><button id="signout" type="button">Sign out</button></div></div></header>
  <nav class="tabs" aria-label="Sections"><div class="tabsin" id="tabs"></div></nav>
  <main class="shell" id="views"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="label-core.js?v=20261019"></script>
<script>
(function () {
"use strict";
var L = window.BHBLabel;
var TABS = [["print", "Print a label"], ["history", "Sent to print"], ["settings", "Settings"]];
var S = { me: null, tab: null, cfg: null, hist: null, agent: null, watch: null };
function $(s) { return document.querySelector(s); }
var esc = L.esc;
function toast(msg, bad) { var t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = "toast"; }, bad ? 6000 : 2600); }
function staffEmail() { try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch (e) { return ""; } }
function openGate(msg) { $("#gate").style.display = "flex"; $("#app").hidden = true; if (msg) { var g = $("#gerr"); g.textContent = msg; g.style.display = ""; } }
$("#signout").addEventListener("click", function () { try { sessionStorage.removeItem("bhb_staff_email"); } catch (e) {} openGate(); });

function tabs() {
  $("#tabs").innerHTML = TABS.filter(function (t) { return S.me.tabs.indexOf(t[0]) > -1; }).map(function (t) { return '<button class="tabbtn" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>'; }).join("");
}
async function show(tab) {
  S.tab = tab; tabs();
  var v = $("#views");
  if (!tab) { v.innerHTML = '<div class="card">You do not have any tabs on Prosecco Labels yet. Ask the GM.</div>'; return; }
  if (tab === "print") return showPrint(v);
  if (tab === "history") return showHistory(v);
  if (tab === "settings") return showSettings(v);
}
document.addEventListener("click", function (e) { var t = e.target.closest("[data-tab]"); if (t) show(t.dataset.tab); });

/* ------------------------------------------------------------- print */
function agentNote(a) {
  if (!a) return "";
  return a.online ? '<span class="pill ok">Office printer connected</span>'
    : '<span class="pill warn">Office print agent not running</span>';
}
function showPrint(v) {
  v.innerHTML = '<div class="pagehead"><h2>Print a label</h2><span id="agent">' + agentNote(L.state.agent) + '</span></div>' +
    '<p class="lead">The personalised congratulations label for the bottle of prosecco a couple is given when they book. Add their names and the wedding date, tap the space on the label paper that is free, and print.</p>' +
    '<div class="card"><div id="mount"></div></div>';
  L.mount($("#mount"), { source: "app" });
}

/* ------------------------------------------------------------- sent to print */
async function showHistory(v) {
  v.innerHTML = '<div class="pagehead"><h2>Sent to print</h2></div><p class="muted">Loading…</p>';
  try {
    var d = await L.api("job.list"); S.hist = d.jobs; L.state.agent = d.agent;
    var pill = { queued: ["warn", "Waiting"], printing: ["warn", "Printing"], printed: ["ok", "Printed"], failed: ["bad", "Failed"], cancelled: ["", "Cancelled"] };
    var rows = d.jobs.map(function (j) {
      var p = pill[j.status] || ["", j.status];
      return '<tr><td>' + esc(new Date(j.created_at).toLocaleString("en-GB", { timeZone: "Europe/London", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) + '</td><td><b>' + esc(j.names) + '</b>' + (j.kind === "test" ? ' <span class="pill">Test</span>' : '') + '</td><td>' + esc(j.wedding_date ? L.formatDate(j.wedding_date, "long") : "") + '</td><td>' + j.position + '</td><td><span class="pill ' + p[0] + '">' + p[1] + '</span>' + (j.error ? '<div class="small muted">' + esc(j.error) + '</div>' : '') + '</td><td>' + esc(j.created_by) + '</td><td>' +
        (j.status === "queued" ? '<button class="btn small danger" data-act="cancel" data-id="' + j.id + '">Cancel</button>' : '') +
        ((j.status === "printed" || j.status === "failed") && j.has_image ? '<button class="btn small ghost" data-act="reprint" data-id="' + j.id + '">Print again</button>' : '') + '</td></tr>';
    }).join("");
    v.innerHTML = '<div class="pagehead"><h2>Sent to print</h2>' + agentNote(d.agent) + '</div>' +
      (d.agent.online ? '' : '<div class="notice warn" style="margin-bottom:14px">The print agent on the office PC has not been seen for a while. Labels wait in the queue and print when it is back. See Settings for how it is installed.</div>') +
      '<div class="card"><div class="tw"><table class="t"><thead><tr><th>When</th><th>Couple</th><th>Wedding</th><th>Position</th><th>Status</th><th>By</th><th></th></tr></thead><tbody>' + (rows || '<tr><td colspan="7" class="muted">Nothing has been sent to print yet.</td></tr>') + '</tbody></table></div></div>';
  } catch (e) { v.innerHTML = '<div class="card"><b>' + esc(e.message) + '</b></div>'; }
}
document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return; var a = b.dataset.act;
  try {
    if (a === "cancel") { await L.api("job.cancel", { id: b.dataset.id }); toast("Cancelled."); return showHistory($("#views")); }
    if (a === "reprint") { b.disabled = true; await L.api("job.reprint", { id: b.dataset.id }); toast("Sent to print again."); return showHistory($("#views")); }
  } catch (err) { toast(err.message, true); b.disabled = false; }
});

/* ------------------------------------------------------------- settings */
function getPath(o, p) { return p.split(".").reduce(function (x, k) { return x == null ? x : x[k]; }, o); }
function setPath(o, p, val) { var ks = p.split("."), last = ks.pop(), t = ks.reduce(function (x, k) { return x[k]; }, o); t[last] = val; }
function numField(label, path, step, hint) {
  return '<div class="f"><label for="s_' + path.replace(/\./g, "_") + '">' + label + '</label><input id="s_' + path.replace(/\./g, "_") + '" type="number" step="' + (step || "0.01") + '" data-path="' + path + '" value="' + esc(getPath(S.cfg, path)) + '">' + (hint ? '<div class="small muted">' + hint + '</div>' : '') + '</div>';
}
var SAMPLE = { names: "Jody & Dan", dateIso: "2026-10-13", venue: "Orchard Marquee" };
function settingsPreview() {
  var c = $("#sp_label"); if (c) L.renderLabelOnly(c, S.cfg, L.state.bg, SAMPLE, 760);
  var sh = $("#sp_sheet"); if (sh) sh.innerHTML = L.pickerHtml(S.cfg, [], 0);
}
function linesTable() {
  var fonts = L.NAME_FONTS, wts = [400, 500, 600, 700];
  return '<div class="tw"><table class="t lines"><thead><tr><th style="min-width:200px">Text ({names} and {date} fill in)</th><th>Font</th><th>Size pt</th><th>Weight</th><th>Colour</th><th>Baseline mm</th><th>CAPS</th><th></th></tr></thead><tbody>' +
    S.cfg.design.lines.map(function (l, i) {
      return '<tr data-line="' + i + '"><td><input data-lf="text" value="' + esc(l.text) + '"></td><td><select data-lf="font">' + fonts.map(function (f) { return '<option' + (f === l.font ? " selected" : "") + '>' + f + '</option>'; }).join("") + '</select></td><td><input data-lf="size" type="number" step="0.5" value="' + esc(l.size) + '" style="width:74px"></td><td><select data-lf="weight">' + wts.map(function (w) { return '<option' + (+w === +l.weight ? " selected" : "") + '>' + w + '</option>'; }).join("") + '</select></td><td><input data-lf="color" type="color" value="' + esc(l.color || "#FFFFFF") + '" style="width:54px;padding:2px"></td><td><input data-lf="y" type="number" step="0.1" value="' + esc(l.y) + '" style="width:84px"></td><td><input data-lf="caps" type="checkbox"' + (l.caps ? " checked" : "") + ' style="min-width:0;width:20px;min-height:20px"></td><td><button class="btn small danger" data-sact="delline" data-i="' + i + '">Remove</button></td></tr>';
    }).join("") + '</tbody></table></div>';
}
function showSettings(v) {
  S.cfg = L.clone(L.state.settings);
  var dfm = [["long", "13th October 2026"], ["weekday", "Tuesday 13th October 2026"], ["short", "13 Oct 2026"], ["dots", "13.10.2026"]];
  v.innerHTML = '<div class="pagehead"><h2>Settings</h2></div>' +
    '<p class="lead">Everything that decides where the label lands on the sheet, and what it looks like. Print the alignment test on plain paper first, then change the numbers until it matches the label paper.</p>' +
    '<div class="card"><h3>Label sheet</h3><p class="muted small" style="margin:0 0 10px">Measured from the top-left corner of the A4 sheet, in millimetres. Labels are numbered across, then down (1 top left, 2 top right, 3 next row left…).</p>' +
    '<div class="two-col"><div><div class="grid g4">' + numField("Labels across", "sheet.cols", "1") + numField("Labels down", "sheet.rows", "1") + numField("Label width", "sheet.labelW") + numField("Label height", "sheet.labelH") + numField("First label, from left", "sheet.firstX") + numField("First label, from top", "sheet.firstY") + numField("Across: start to next", "sheet.pitchX", "0.01", "Left edge to the next label's left edge") + numField("Down: start to next", "sheet.pitchY", "0.01", "Top edge to the next row's top edge") + '</div></div><div><div class="sheetprev"><div id="sp_sheet"></div></div></div></div></div>' +
    '<div class="card"><h3>Print adjustment</h3><p class="muted small" style="margin:0 0 10px">If everything prints a little off, correct it here instead of changing the sheet. Positive moves the print right and down.</p><div class="grid g4">' + numField("Move right (mm)", "adjust.offsetX") + numField("Move down (mm)", "adjust.offsetY") + numField("Size (%)", "adjust.scale", "0.1", "100 = exactly as designed") + '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn ghost" data-sact="testsheet">Print alignment test</button><button class="btn ghost" data-sact="testlabel">Print a sample label in position 1</button></div><div id="testmsg" style="margin-top:10px"></div></div>' +
    '<div class="card"><h3>Printer</h3><div class="grid g4">' + '<div class="f"><label for="s_printer_name">Printer name</label><input id="s_printer_name" data-path="printer.name" value="' + esc(S.cfg.printer.name) + '"><div class="small muted">As it is named on the office PC that does the printing</div></div>' + numField("Copies of each label", "printer.copies", "1") + '</div>' +
    '<p class="small muted" style="margin:12px 0 0">Printing is done by a small program on an office PC that is always on and can see the printer. Phones and tablets send the label to it over the internet, so no laptop needs to be on the network. <span id="agentnow">' + agentNote(L.state.agent) + '</span></p></div>' +
    '<div class="card"><h3>Design</h3><div class="two-col"><div><canvas id="sp_label" style="width:100%;height:auto;border-radius:3px;box-shadow:var(--shadow)"></canvas><p class="small muted">A sample (Jody &amp; Dan).</p></div><div>' +
    '<p style="margin:0 0 8px"><b>Background:</b> ' + (L.state.design ? esc(L.state.design.name) : 'the built-in Black Horse design') + '</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-sact="upload">Upload a new background</button>' + (L.state.design ? '<button class="btn danger" data-sact="resetbg">Go back to the built-in design</button>' : '') + '</div><input type="file" id="bgpick" accept="image/png,image/jpeg" hidden>' +
    '<p class="small muted" style="margin:10px 0 0">Upload a PNG or JPEG of the label artwork without the changing text, at least 1200 pixels wide, in the same shape as the label (' + esc(S.cfg.sheet.labelW) + ' × ' + esc(S.cfg.sheet.labelH) + ' mm). It is stretched to the label size.</p>' +
    '<div class="f" style="margin-top:12px"><label for="s_df">Date style</label><select id="s_df" data-path="design.dateFormat">' + dfm.map(function (d) { return '<option value="' + d[0] + '"' + (S.cfg.design.dateFormat === d[0] ? " selected" : "") + '>' + d[1] + '</option>'; }).join("") + '</select></div>' + numField("Longest a line may be (mm)", "design.maxTextW", "1", "Longer names shrink to fit") + '</div></div>' +
    '<div class="f" style="margin-top:14px"><label for="s_venues">Venue names offered when printing (one per line)</label><textarea id="s_venues" rows="3" style="width:100%;border:1px solid var(--celadon);border-radius:8px;padding:8px 10px;font-size:15px">' + esc((S.cfg.design.venues || []).join("\n")) + '</textarea><div class="small muted">Use {venue} in a line below to print the one chosen.</div></div>' +
    '<h4 style="margin:18px 0 6px;font-size:19px;color:var(--sage)">Text on the label</h4><div id="lines">' + linesTable() + '</div><div style="margin-top:10px"><button class="btn ghost" data-sact="addline">Add a line</button></div></div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" data-sact="save">Save settings</button><span class="muted small">Saved settings apply to every label from now on.</span></div>';
  settingsPreview();
}
document.addEventListener("input", function (e) {
  var t = e.target; if (S.tab !== "settings" || !S.cfg) return;
  if (t.id === "s_venues") { S.cfg.design.venues = t.value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean); return; }
  if (t.dataset && t.dataset.path) { var val = t.type === "number" ? Number(t.value) : t.value; if (t.type === "number" && t.value === "") return; setPath(S.cfg, t.dataset.path, val); settingsPreview(); return; }
  var tr = t.closest("tr[data-line]"); if (tr && t.dataset.lf) { var line = S.cfg.design.lines[+tr.dataset.line], k = t.dataset.lf; line[k] = t.type === "checkbox" ? t.checked : (t.type === "number" ? Number(t.value) : t.value); settingsPreview(); }
});
document.addEventListener("change", function (e) { var t = e.target; if (t.id === "bgpick" && t.files && t.files[0]) uploadBg(t.files[0]); var tr = t.closest && t.closest("tr[data-line]"); if (tr && t.dataset.lf && (t.tagName === "SELECT" || t.type === "checkbox")) { var line = S.cfg.design.lines[+tr.dataset.line]; line[t.dataset.lf] = t.type === "checkbox" ? t.checked : (t.dataset.lf === "weight" ? Number(t.value) : t.value); L.loadFonts(S.cfg).then(settingsPreview); } if (t.dataset && t.dataset.path === "design.dateFormat") settingsPreview(); });
async function uploadBg(file) {
  try {
    var url = await new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file); });
    var im = await new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { rej(new Error("That image could not be opened.")); }; i.src = url; });
    var w = Math.min(im.width, 3000), h = Math.round(im.height * w / im.width), c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
    var b64 = c.toDataURL("image/png").split(",")[1];
    await L.api("design.save", { data: b64, name: file.name }); L.state.design = { name: file.name }; await L.setDesignImage("data:image/png;base64," + b64);
    toast("New background saved."); showSettings($("#views"));
  } catch (err) { toast(err.message, true); }
}
document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-sact]"); if (!b || b.disabled) return; var a = b.dataset.sact;
  try {
    if (a === "upload") return $("#bgpick").click();
    if (a === "resetbg") { await L.api("design.reset"); L.state.design = null; L.state.loaded = null; await L.load(true); toast("Back to the built-in design."); return showSettings($("#views")); }
    if (a === "addline") { S.cfg.design.lines.push({ text: "New line", font: "Raleway", size: 10, weight: 400, color: "#FFFFFF", y: 50 }); $("#lines").innerHTML = linesTable(); return settingsPreview(); }
    if (a === "delline") { S.cfg.design.lines.splice(+b.dataset.i, 1); $("#lines").innerHTML = linesTable(); return settingsPreview(); }
    if (a === "save") { b.disabled = true; await L.api("settings.save", { settings: S.cfg }); L.state.settings = L.merge(L.DEFAULTS, Object.assign({}, S.cfg, { used: L.state.settings.used })); L.state.loaded = null; await L.load(true); toast("Settings saved."); b.disabled = false; return; }
    if (a === "testsheet" || a === "testlabel") {
      b.disabled = true; var msg = $("#testmsg"); msg.innerHTML = '<div class="notice">Sending… (this uses the settings as they are saved, so save first if you have changed them)</div>';
      var r;
      if (a === "testsheet") r = await L.testPrint(1);
      else { var page = L.renderSheet(S.cfg, L.state.bg, SAMPLE, 1, "label", 300); r = await L.api("job.create", { names: SAMPLE.names, date: SAMPLE.dateIso, position: 1, page_png: L.pngBase64(page), kind: "test", source: "app" }); }
      msg.innerHTML = '<div class="notice ok">Sent to the office printer' + (r.agent_online ? '' : ', but the print agent has not been seen for a while') + '. Check Sent to print for its progress.</div>'; b.disabled = false; return;
    }
  } catch (err) { toast(err.message, true); b.disabled = false; }
});

async function boot() {
  $("#app").hidden = false; $("#views").innerHTML = '<p class="muted" style="margin-top:24px">Loading…</p>';
  try { await L.load(true); } catch (e) { $("#views").innerHTML = '<div class="card"><b>' + esc(e.message) + '</b><p class="muted">Open this from the Staff Portal so it knows who you are.</p></div>'; return; }
  S.me = L.state.me; $("#whoname").textContent = S.me.name;
  await show((TABS.find(function (t) { return S.me.tabs.indexOf(t[0]) > -1; }) || [])[0] || null);
}
if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate();
})();
</script>
