<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedding Quote Config - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --attention-ink:#6d5320;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --red:#B3261E; --red-bg:#FCECEA; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1180px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important} .off{display:none!important}
a{color:var(--sage)}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 64px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:42px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2}
.btn:hover{background:var(--sage-dark)} .btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.small{min-height:34px; padding:6px 12px; font-size:11px} .btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger:hover{background:var(--alert-bg)}
.btn.solid-danger{background:var(--red); border-color:var(--red)} .btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px; min-height:34px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 10px} .toolrow .sp{margin-left:auto}
.pagehead{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:22px 0 4px} .pagehead h2{font-size:30px; color:var(--sage); line-height:1.1; margin-right:auto}
.lead{color:var(--sage-70); font-size:14px; margin:2px 0 12px; max-width:760px}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0}
.field label,.lbl{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)}
.field input,.field select,.field textarea{border:1px solid var(--celadon); border-radius:8px; padding:10px 11px; background:#fff; width:100%; min-height:42px}
.field textarea{min-height:110px; resize:vertical; line-height:1.5} .field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--sage-10); color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px} .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:0 14px}
.hint{font-size:12px; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:900; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto}
.modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:640px; padding:20px 22px 18px} .modal h3{font-size:26px; color:var(--sage); margin-bottom:10px}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.notice{background:var(--attention-bg); border-left:4px solid var(--attention); color:var(--attention-ink); padding:10px 14px; border-radius:6px; font-size:13px; margin:0 0 12px}

/* the price grid */
.gridwrap{overflow:auto; max-height:72vh; border:1px solid var(--mist); border-radius:var(--radius); background:var(--white)}
table.pg{border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed}
table.pg th,table.pg td{border-bottom:1px solid var(--mist); border-right:1px solid var(--mist); padding:0; background:var(--white)}
table.pg thead th{position:sticky; top:0; z-index:3; background:var(--sage-10); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); padding:9px 8px; text-align:right}
table.pg thead th:first-child,table.pg td.nm{position:sticky; left:0; z-index:2; text-align:left}
table.pg thead th:first-child{z-index:4}
table.pg td.nm{padding:7px 10px; width:360px; min-width:360px; background:#fff; line-height:1.3}
table.pg td.nm .tp{display:inline-flex; gap:3px; margin-left:6px; vertical-align:middle}
.tag{font-size:9px; letter-spacing:.08em; font-weight:700; padding:1px 5px; border-radius:4px; background:var(--sage-10); color:var(--sage-70); text-transform:uppercase}
table.pg tr.cat td{background:var(--sage-10); font-family:var(--display); font-size:17px; color:var(--sage); padding:7px 10px; position:sticky; left:0}
table.pg tr.inactive td.nm{color:var(--sage-70); font-style:italic}
table.pg td.pc{width:104px; min-width:104px}
table.pg td.pc input{width:100%; border:0; background:transparent; padding:8px 9px; text-align:right; min-height:34px; font-variant-numeric:tabular-nums}
table.pg td.pc input:focus{background:var(--attention-bg); outline:2px solid var(--gold); outline-offset:-2px}
table.pg td.pc.saved input{background:var(--good-bg)} table.pg td.pc.bad input{background:var(--red-bg)} table.pg td.pc input::placeholder{color:#b9b9b9}
table.pg td.pc input:disabled{color:var(--ink)}
.ratewrap table.pg td.nm{width:120px; min-width:120px} .ratewrap table.pg td.pc{width:92px; min-width:92px}
table.pg th .x{background:none; border:0; color:var(--alert); cursor:pointer; font-size:14px; padding:0 0 0 4px}

/* items list */
.itemrow{display:flex; gap:10px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--mist); flex-wrap:wrap}
.itemrow:last-child{border-bottom:0} .itemrow .nm{flex:1 1 320px; min-width:0} .itemrow .nm b{font-weight:600}
.itemrow .meta{font-size:12px; color:var(--sage-70)} .catlabel{font-family:var(--display); font-size:22px; color:var(--sage); margin:18px 0 2px}
.opts{display:grid; gap:6px; margin:4px 0 12px} .opt{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border:1px solid var(--mist); border-radius:8px; background:var(--white); font-size:14px; cursor:pointer; line-height:1.35}
.opt input{margin-top:3px; flex:none; width:18px; height:18px} .opt:has(input:checked){border-color:var(--sage); background:var(--sage-10)}
.yrgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px 10px}
table.log{width:100%; border-collapse:collapse; font-size:13px} table.log th{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); text-align:left; padding:8px; background:var(--sage-10)}
table.log td{padding:8px; border-bottom:1px solid var(--mist); vertical-align:top} table.log td.d{color:var(--sage-70); font-size:12px; word-break:break-word}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr} table.pg td.nm{width:210px; min-width:210px} .modal{padding:16px 14px 14px}}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Wedding Quote Config</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Wedding Quote Config<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span><button id="signout" type="button">Sign out</button></div></div></header>
  <nav class="tabs" aria-label="Sections"><div class="tabsin" id="tabs"></div></nav>
  <main class="shell" id="views"></main>
</div>
<div id="modalroot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const TABS = [["prices", "Prices"], ["items", "Package items"], ["venue", "Venue rates"], ["texts", "Wording"], ["history", "History"]];
const QT = { WEDDING:"Wedding", DRY_HIRE:"Dry hire", PRIVATE_EVENT:"Private event" }, QT_SHORT = { WEDDING:"W", DRY_HIRE:"DH", PRIVATE_EVENT:"PE" };
const QTY = { FIXED_1:"One, or a set number (starts at 1)", FIXED_0:"A number you type in (starts at 0)", DAYTIME_GUESTS:"Per daytime guest", EVENING_GUESTS:"Per evening guest", DISCOUNT_POUNDS:"A discount in pounds (typed as the quantity)" };
const TEXT_KEYS = [["includedInVenueHire", "What is included in the venue hire"], ["nextSteps", "Next steps (once they are happy with the quote)"], ["closing", "Closing paragraph"]];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const S = { me:null, d:null, tab:"prices", cat:"", find:"", inactive:false, rq:"Wedding", rv:"Marquee", rt:"MinimumSpend", edit:null, texts:{}, log:null };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 5600 : 2200); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/quote-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const fmtDT = v => { try { return new Date(v).toLocaleString("en-GB", { timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }).replace("Sept", "Sep"); } catch(e){ return String(v); } };
const canEdit = () => !!(S.me && S.me.edit);
const monthIdx = m => { const [mm, yy] = String(m).split("-"); return (2000 + Number(yy)) * 12 + MONTHS.indexOf(mm); };
const priceText = v => v === null || v === undefined ? "" : String(+(+v).toFixed(2));

/* ------------------------------------------------------------- modal */
function openModal(html){ closeModal(); const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); }); $("#modalroot").appendChild(bg); const f = bg.querySelector("input,select,textarea,button"); if (f) f.focus(); }
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalbg")) closeModal(); });

/* ------------------------------------------------------------- data */
async function reload(){ S.d = await call("load", { config:true }); S.me = S.d.me; }
const itemsSorted = () => S.d.items.slice().sort((a, b) => a.sort - b.sort);
const categories = () => { const out = []; itemsSorted().forEach(i => { if (!out.includes(i.category)) out.push(i.category); }); return out; };
const priceOf = (item, y) => item.prices[y];

/* ------------------------------------------------------------- tabs */
function setTabs(){
  const mine = TABS.filter(([k]) => !S.me.tabs.length || S.me.tabs.includes(k));
  if (!mine.some(([k]) => k === S.tab)) S.tab = mine[0] ? mine[0][0] : "prices";
  $("#tabs").innerHTML = mine.map(([k, l]) => `<button class="tabbtn" data-tab="${k}" aria-current="${k === S.tab ? "page" : "false"}">${l}</button>`).join("");
}
function render(){
  setTabs();
  const ro = canEdit() ? "" : `<div class="notice">You can look at everything here but not change it. Ask the GM for edit rights on Wedding Quote Config.</div>`;
  const v = { prices:pricesHtml, items:itemsHtml, venue:venueHtml, texts:textsHtml, history:historyHtml }[S.tab]();
  const keep = window.scrollY;
  $("#views").innerHTML = ro + v;
  window.scrollTo(0, keep);
  if (S.tab === "history" && !S.log) loadLog();
}

/* ------------------------------------------------------------- prices */
function pricesHtml(){
  const d = S.d, years = d.years, cats = categories(), term = S.find.trim().toLowerCase();
  const rows = itemsSorted().filter(i => (S.inactive || i.active) && (!S.cat || i.category === S.cat) && (!term || i.name.toLowerCase().includes(term)));
  let html = "", last = null;
  const ro = canEdit() ? "" : " disabled";
  for (const i of rows) {
    if (i.category !== last) { html += `<tr class="cat"><td colspan="${years.length + 1}">${esc(i.category)}</td></tr>`; last = i.category; }
    html += `<tr class="${i.active ? "" : "inactive"}"><td class="nm">${esc(i.name)}<span class="tp">${i.types.map(t => `<span class="tag" title="${esc(QT[t])}">${QT_SHORT[t]}</span>`).join("")}</span></td>${years.map(y => `<td class="pc"><input inputmode="decimal" data-price="${esc(i.name)}" data-year="${y}" value="${esc(priceText(priceOf(i, y)))}" placeholder="-" aria-label="${esc(i.name)} ${y}"${ro}></td>`).join("")}</tr>`;
  }
  return `<div class="pagehead"><h2>Prices</h2>${canEdit() ? `<button class="btn" data-act="addyear">Add a year</button>` : ""}</div>
    <p class="lead">One price per item for each year of the event. Click a price, type the new one and click away: it saves straight away and the quote tool uses it next time it opens. Leave a price empty to mean "price on request". Prices for years after the last one are carried forward from the last year.</p>
    <div class="toolrow"><button class="chip" data-act="cat" data-k="" aria-pressed="${!S.cat}">All</button>${cats.map(c => `<button class="chip" data-act="cat" data-k="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join("")}</div>
    <div class="toolrow" style="margin-top:0"><input id="find" type="search" placeholder="Find an item" value="${esc(S.find)}" style="border:1px solid var(--celadon);border-radius:8px;padding:9px 11px;min-width:240px" aria-label="Find an item"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showinactive"${S.inactive ? " checked" : ""}> Show items hidden from quotes</label>
      <span class="sp tiny muted">${rows.length} item${rows.length === 1 ? "" : "s"}. W = wedding, DH = dry hire, PE = private event.</span></div>
    <div class="gridwrap"><table class="pg"><thead><tr><th>Item</th>${years.map(y => `<th>${y}${canEdit() && years.length > 1 ? `<button class="x" data-act="delyear" data-y="${y}" title="Remove ${y}" aria-label="Remove ${y}">&times;</button>` : ""}</th>`).join("")}</tr></thead><tbody>${html || `<tr><td class="nm" colspan="${years.length + 1}">Nothing matches.</td></tr>`}</tbody></table></div>`;
}
async function savePrice(inp){
  const name = inp.dataset.price, y = +inp.dataset.year, txt = inp.value.trim().replace(/[£,\s]/g, "");
  const item = S.d.items.find(i => i.name === name); if (!item) return;
  const cur = priceOf(item, y), td = inp.closest("td");
  const nv = txt === "" ? null : Number(txt);
  if (nv !== null && !isFinite(nv)) { td.className = "pc bad"; return toast("That is not a number.", true); }
  if ((cur === undefined || cur === null ? null : +cur) === (nv === null ? null : Math.round(nv * 100) / 100)) { inp.value = priceText(cur); return; }
  td.className = "pc";
  try { await call("price.set", { item_name:name, year:y, price:nv }); if (nv === null) delete item.prices[y]; else item.prices[y] = Math.round(nv * 100) / 100; inp.value = priceText(item.prices[y]); td.className = "pc saved"; setTimeout(() => { td.classList.remove("saved"); }, 1400); }
  catch(e){ td.className = "pc bad"; toast(e.message, true); inp.value = priceText(cur); }
}
function addYearModal(){
  const ys = S.d.years, last = ys[ys.length - 1];
  openModal(`<h3>Add a year</h3><p class="small muted" style="margin:0 0 12px">Starts every item's price for the new year from an existing year, then applies the rise you choose. You can change any price afterwards.</p>
    <div class="grid2"><div class="field"><label for="ay_year">New year</label><input id="ay_year" type="number" value="${last + 1}" min="2020" max="2100"></div>
    <div class="field"><label for="ay_from">Start from the prices of</label><select id="ay_from">${ys.slice().reverse().map(y => `<option value="${y}">${y}</option>`).join("")}</select></div></div>
    <div class="grid2"><div class="field"><label for="ay_pct">Price rise (%)</label><input id="ay_pct" type="number" step="0.1" value="0"><div class="hint">0 copies the prices as they are. 3 adds 3% to every price.</div></div>
    <div class="field"><label for="ay_round">Round to</label><select id="ay_round"><option value="0">Leave as calculated</option><option value="0.05">Nearest 5p</option><option value="0.5">Nearest 50p</option><option value="1">Nearest £1</option></select></div></div>
    <div class="row-actions"><button class="btn" data-act="addyearyes">Add the year</button><button class="btn ghost" data-act="closemodal">Cancel</button></div>`);
}
function delYearModal(y){ openModal(`<h3>Remove ${esc(y)}?</h3><p class="small">Every item's ${esc(y)} price is deleted. Quotes for events in ${esc(y)} would then use the nearest earlier year's prices. This cannot be undone, but it is recorded in the History.</p><div class="row-actions"><button class="btn solid-danger" data-act="delyearyes" data-y="${esc(y)}">Yes, remove ${esc(y)}</button><button class="btn ghost" data-act="closemodal">Keep it</button></div>`); }

/* ------------------------------------------------------------- items */
function itemsHtml(){
  const cats = categories(), groups = cats.map(c => itemsSorted().filter(i => i.category === c));
  return `<div class="pagehead"><h2>Package items</h2>${canEdit() ? `<button class="btn" data-act="newitem">Add an item</button>` : ""}</div>
    <p class="lead">Everything that can go in a quote. Choose which quote types offer each item, how it is counted, and which ones start ticked on every new wedding quote. Hiding an item takes it out of the quote tool but keeps its prices. Prices are set in the Prices tab.</p>
    ${groups.map((g, n) => `<div class="catlabel">${esc(cats[n])}</div><div class="card" style="padding:4px 14px">${g.map(i => `<div class="itemrow"><div class="nm"><b>${esc(i.name)}</b><div class="meta">${esc(QTY[i.qty] || i.qty)}</div></div>
      <div>${i.types.map(t => `<span class="tag">${esc(QT[t])}</span>`).join(" ")}${i.default_on ? ` <span class="tag" style="background:var(--good-bg);color:var(--good)">Starts ticked</span>` : ""}${i.active ? "" : ` <span class="tag" style="background:var(--alert-bg);color:var(--alert)">Hidden</span>`}</div>
      ${canEdit() ? `<button class="btn small ghost" data-act="edititem" data-n="${esc(i.name)}">Change</button>` : ""}</div>`).join("")}</div>`).join("")}`;
}
function itemModal(name){
  const it = name ? S.d.items.find(i => i.name === name) : null, ys = S.d.years;
  const f = it || { name:"", category:"", qty:"FIXED_1", types:["WEDDING", "DRY_HIRE"], default_on:false, active:true, prices:{} };
  S.edit = { orig: it ? it.name : "" };
  openModal(`<h3>${it ? "Change this item" : "Add an item"}</h3>
    <div class="field"><label for="it_name">Name as it appears in the quote</label><input id="it_name" value="${esc(f.name)}" maxlength="200"><div class="hint">Start with the category and a dash, like the others: "Drinks - Gin station".</div></div>
    <div class="grid2"><div class="field"><label for="it_cat">Category</label><input id="it_cat" list="catlist" value="${esc(f.category)}" maxlength="60"><datalist id="catlist">${categories().map(c => `<option value="${esc(c)}">`).join("")}</datalist><div class="hint">Pick one, or type a new category.</div></div>
    <div class="field"><label for="it_qty">How it is counted</label><select id="it_qty">${Object.entries(QTY).map(([k, l]) => `<option value="${k}"${f.qty === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div></div>
    <div class="field"><label>Offered in</label><div class="opts">${Object.entries(QT).map(([k, l]) => `<label class="opt"><input type="checkbox" data-qt="${k}"${f.types.includes(k) ? " checked" : ""}><span>${esc(l)} quotes</span></label>`).join("")}</div></div>
    <label class="opt" style="margin-bottom:8px"><input type="checkbox" id="it_def"${f.default_on ? " checked" : ""}><span>Starts ticked on every new wedding quote</span></label>
    <label class="opt" style="margin-bottom:12px"><input type="checkbox" id="it_act"${f.active ? " checked" : ""}><span>Show it in the quote tool (untick to hide it without losing its prices)</span></label>
    ${it ? "" : `<div class="field"><label>Price for each year</label><div class="yrgrid">${ys.map(y => `<input data-yp="${y}" inputmode="decimal" placeholder="${y}" aria-label="Price for ${y}" style="border:1px solid var(--celadon);border-radius:8px;padding:9px 10px">`).join("")}</div><div class="hint">Leave empty for "price on request". A year with no price uses the nearest earlier year's price.</div></div>`}
    <div class="row-actions"><button class="btn" data-act="saveitem">${it ? "Save the changes" : "Add the item"}</button><button class="btn ghost" data-act="closemodal">Cancel</button>${it ? `<button class="btn danger" style="margin-left:auto" data-act="delitem" data-n="${esc(it.name)}">Delete it</button>` : ""}</div>
    <div class="hint" id="it_err" style="color:var(--red);margin-top:8px"></div>`);
}
async function saveItem(btn){
  const types = $$("[data-qt]").filter(c => c.checked).map(c => c.dataset.qt), prices = {};
  $$("[data-yp]").forEach(i => { const v = i.value.trim().replace(/[£,\s]/g, ""); if (v !== "") prices[i.dataset.yp] = v; });
  const body = { original_name:S.edit.orig, item_name:$("#it_name").value.trim(), category:$("#it_cat").value.trim(), qty_type:$("#it_qty").value, quote_types:types, default_on:$("#it_def").checked, active:$("#it_act").checked, prices };
  btn.disabled = true;
  try { await call("item.save", body); closeModal(); await reload(); render(); toast(S.edit.orig ? "Item saved." : "Item added."); }
  catch(e){ $("#it_err").textContent = e.message; btn.disabled = false; }
}

/* ------------------------------------------------------------- venue rates */
function ratesFor(qt, venue, rt){ const m = {}, months = new Set(); S.d.rates.forEach(r => { if (r[0] === qt && r[1] === venue && r[2] === rt) { (m[r[3]] = m[r[3]] || {})[r[4]] = r[5]; months.add(r[4]); } }); return { m, months:[...months].sort((a, b) => monthIdx(a) - monthIdx(b)) }; }
function venueHtml(){
  const { m, months } = ratesFor(S.rq, S.rv, S.rt), ro = canEdit() ? "" : " disabled";
  const chips = (key, opts) => opts.map(([k, l]) => `<button class="chip" data-act="rset" data-f="${key}" data-k="${k}" aria-pressed="${S[key] === k}">${l}</button>`).join("");
  return `<div class="pagehead"><h2>Venue rates</h2>${canEdit() ? `<button class="btn" data-act="addmonth">Add a month</button>` : ""}</div>
    <p class="lead">Minimum spend and venue hire for each day of the week and month, for weddings and for dry hire. Private events have no rates here: venue hire is a price in the Prices tab. Click an amount, type the new one and click away to save.</p>
    <div class="toolrow"><span class="lbl">Quote</span>${chips("rq", [["Wedding", "Wedding"], ["DryHire", "Dry hire"]])}<span class="lbl" style="margin-left:12px">Venue</span>${chips("rv", [["Marquee", "Marquee"], ["GeorgeRidley", "George Ridley Suite"]])}<span class="lbl" style="margin-left:12px">Rate</span>${chips("rt", [["MinimumSpend", "Minimum spend"], ["VenueHire", "Venue hire"]])}</div>
    <div class="gridwrap ratewrap"><table class="pg"><thead><tr><th>Day</th>${months.map(mo => `<th>${esc(mo)}</th>`).join("")}</tr></thead><tbody>${S.d.weekdays.map(d => `<tr><td class="nm">${d}</td>${months.map(mo => `<td class="pc"><input inputmode="decimal" data-rate="${d}" data-month="${mo}" value="${esc(priceText((m[d] || {})[mo]))}" aria-label="${d} ${mo}"${ro}></td>`).join("")}</tr>`).join("")}
      ${canEdit() ? `<tr><td class="nm tiny muted">Remove a month</td>${months.map(mo => `<td class="pc" style="text-align:center"><button class="btn small danger" data-act="delmonth" data-mo="${esc(mo)}" style="min-height:26px;padding:2px 8px" aria-label="Remove ${esc(mo)}">&times;</button></td>`).join("")}</tr>` : ""}</tbody></table></div>
    <p class="tiny muted" style="margin-top:8px">${months.length} months, ${esc(months[0] || "")} to ${esc(months[months.length - 1] || "")}. A quote for a date past the last month cannot work out these rates, so add months ahead of time.</p>`;
}
async function saveRate(inp){
  const d = inp.dataset.rate, mo = inp.dataset.month, td = inp.closest("td"), txt = inp.value.trim().replace(/[£,\s]/g, "");
  const cur = (ratesFor(S.rq, S.rv, S.rt).m[d] || {})[mo], nv = Number(txt);
  if (txt === "" || !isFinite(nv) || nv < 0) { inp.value = priceText(cur); if (txt !== "") toast("Enter an amount.", true); return; }
  if (Math.round(nv * 100) / 100 === cur) { inp.value = priceText(cur); return; }
  try {
    await call("rate.set", { quote_type:S.rq, venue:S.rv, rate_type:S.rt, weekday:d, month_year:mo, amount:nv });
    const row = S.d.rates.find(r => r[0] === S.rq && r[1] === S.rv && r[2] === S.rt && r[3] === d && r[4] === mo); const val = Math.round(nv * 100) / 100;
    if (row) row[5] = val; else S.d.rates.push([S.rq, S.rv, S.rt, d, mo, val]);
    inp.value = priceText(val); td.className = "pc saved"; setTimeout(() => { td.classList.remove("saved"); }, 1400);
  } catch(e){ td.className = "pc bad"; toast(e.message, true); inp.value = priceText(cur); }
}
function addMonthModal(){
  const { months } = ratesFor(S.rq, S.rv, S.rt), last = months[months.length - 1] || "Dec-26";
  let ni = monthIdx(last) + 1; const nm = MONTHS[ni % 12], ny = String(Math.floor(ni / 12)).slice(2);
  openModal(`<h3>Add a month to ${S.rq === "Wedding" ? "wedding" : "dry hire"} rates</h3><p class="small muted" style="margin:0 0 12px">Adds the month for both venues, both minimum spend and venue hire, every day of the week, starting from the rates of a month you choose.</p>
    <div class="grid3"><div class="field"><label for="am_m">Month</label><select id="am_m">${MONTHS.map(x => `<option${x === nm ? " selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="am_y">Year</label><input id="am_y" type="number" value="20${ny}" min="2020" max="2100"></div>
    <div class="field"><label for="am_from">Start from</label><select id="am_from">${months.slice().reverse().map(x => `<option>${x}</option>`).join("")}</select></div></div>
    <div class="grid2"><div class="field"><label for="am_pct">Rate rise (%)</label><input id="am_pct" type="number" step="0.1" value="0"><div class="hint">For example start from the same month a year earlier and add 3.</div></div>
    <div class="field"><label for="am_round">Round to</label><select id="am_round"><option value="0">Leave as calculated</option><option value="0.05">Nearest 5p</option><option value="0.5">Nearest 50p</option><option value="1">Nearest £1</option></select></div></div>
    <div class="row-actions"><button class="btn" data-act="addmonthyes">Add the month</button><button class="btn ghost" data-act="closemodal">Cancel</button></div><div class="hint" id="am_err" style="color:var(--red);margin-top:8px"></div>`);
}

/* ------------------------------------------------------------- wording */
function textsHtml(){
  const ro = canEdit() ? "" : " disabled";
  return `<div class="pagehead"><h2>Wording</h2></div><p class="lead">The standard paragraphs printed on every quote of each type. Start a line with a bullet (•) and it prints as a bullet. Changes apply the next time the quote tool is opened.</p>
    ${Object.keys(QT).map(qt => `<div class="card"><h3 style="font-size:24px;color:var(--sage);margin-bottom:8px">${QT[qt]} quotes</h3>${TEXT_KEYS.map(([k, l]) => { const c = (S.d.content[qt] || {})[k] || {}, v = S.texts[qt + "/" + k] !== undefined ? S.texts[qt + "/" + k] : (c.body || "");
      return `<div class="field"><label for="tx_${qt}_${k}">${l}</label><textarea id="tx_${qt}_${k}" data-text="${qt}/${k}" rows="${k === "nextSteps" ? 7 : 4}"${ro}>${esc(v)}</textarea><div class="hint">${c.by ? "Last changed by " + esc(c.by) + (c.at ? " on " + esc(fmtDT(c.at)) : "") + ". " : ""}</div>${canEdit() ? `<div class="row-actions" style="margin-top:0"><button class="btn small" data-act="savetext" data-t="${qt}/${k}">Save this</button></div>` : ""}</div>`; }).join("")}</div>`).join("")}`;
}

/* ------------------------------------------------------------- history */
async function loadLog(){ try { const r = await call("log.list", { limit:300 }); S.log = r.log; } catch(e){ S.log = []; toast(e.message, true); } if (S.tab === "history") render(); }
function detailText(d){ if (!d || typeof d !== "object") return ""; if ("from" in d || "to" in d) return `${d.from === null || d.from === undefined ? "none" : "£" + d.from} to ${d.to === null || d.to === undefined ? "none" : "£" + d.to}`; return Object.entries(d).map(([k, v]) => `${k.replace(/_/g, " ")}: ${Array.isArray(v) ? v.join(", ") : v}`).join("; "); }
function historyHtml(){
  if (!S.log) return `<div class="pagehead"><h2>History</h2></div><p class="muted">Loading…</p>`;
  return `<div class="pagehead"><h2>History</h2></div><p class="lead">Every change made here, newest first.</p>
    <div class="card" style="padding:0;overflow:auto"><table class="log"><thead><tr><th>When</th><th>Who</th><th>What</th><th>Detail</th></tr></thead><tbody>${S.log.map(l => `<tr><td>${esc(fmtDT(l.at))}</td><td>${esc(l.who)}</td><td>${esc(l.what)}</td><td class="d">${esc(detailText(l.detail))}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Nothing changed yet.</td></tr>`}</tbody></table></div>`;
}

/* ------------------------------------------------------------- events */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab]"); if (t) { S.tab = t.dataset.tab; if (S.tab === "history") S.log = null; return render(); }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  try {
    if (a === "closemodal") return closeModal();
    if (a === "cat") { S.cat = b.dataset.k; return render(); }
    if (a === "rset") { S[b.dataset.f] = b.dataset.k; return render(); }
    if (a === "addyear") return addYearModal();
    if (a === "addyearyes") {
      b.disabled = true;
      try { const r = await call("year.add", { year:+$("#ay_year").value, copy_from:+$("#ay_from").value, uplift_pct:+$("#ay_pct").value || 0, round_to:+$("#ay_round").value }); closeModal(); await reload(); render(); toast(`Year added: ${r.items} prices created.`); }
      catch(err){ b.disabled = false; toast(err.message, true); } return;
    }
    if (a === "delyear") return delYearModal(b.dataset.y);
    if (a === "delyearyes") { b.disabled = true; try { await call("year.delete", { year:+b.dataset.y }); closeModal(); await reload(); render(); toast("Year removed."); } catch(err){ b.disabled = false; toast(err.message, true); } return; }
    if (a === "newitem") return itemModal("");
    if (a === "edititem") return itemModal(b.dataset.n);
    if (a === "saveitem") return saveItem(b);
    if (a === "delitem") { const n = b.dataset.n; openModal(`<h3>Delete this item?</h3><p class="small"><b>${esc(n)}</b> and all its prices will be deleted. Saved quotes that already include it keep their figures. To keep the prices, hide it instead.</p><div class="row-actions"><button class="btn solid-danger" data-act="delitemyes" data-n="${esc(n)}">Yes, delete it</button><button class="btn ghost" data-act="closemodal">Keep it</button></div>`); return; }
    if (a === "delitemyes") { b.disabled = true; try { await call("item.delete", { item_name:b.dataset.n }); closeModal(); await reload(); render(); toast("Item deleted."); } catch(err){ b.disabled = false; toast(err.message, true); } return; }
    if (a === "addmonth") return addMonthModal();
    if (a === "addmonthyes") {
      b.disabled = true; const my = $("#am_m").value + "-" + String($("#am_y").value).slice(-2);
      try { const r = await call("month.add", { quote_type:S.rq, month_year:my, copy_from:$("#am_from").value, uplift_pct:+$("#am_pct").value || 0, round_to:+$("#am_round").value }); closeModal(); await reload(); render(); toast(`${my} added (${r.rows} rates).`); }
      catch(err){ b.disabled = false; $("#am_err").textContent = err.message; } return;
    }
    if (a === "delmonth") { const mo = b.dataset.mo; openModal(`<h3>Remove ${esc(mo)}?</h3><p class="small">All ${S.rq === "Wedding" ? "wedding" : "dry hire"} rates for ${esc(mo)} (both venues, minimum spend and venue hire) are deleted. A quote for that month could then not work out its rates.</p><div class="row-actions"><button class="btn solid-danger" data-act="delmonthyes" data-mo="${esc(mo)}">Yes, remove it</button><button class="btn ghost" data-act="closemodal">Keep it</button></div>`); return; }
    if (a === "delmonthyes") { b.disabled = true; try { await call("month.delete", { quote_type:S.rq, month_year:b.dataset.mo }); closeModal(); await reload(); render(); toast("Month removed."); } catch(err){ b.disabled = false; toast(err.message, true); } return; }
    if (a === "savetext") {
      const [qt, k] = b.dataset.t.split("/"), ta = $(`[data-text="${b.dataset.t}"]`); b.disabled = true;
      try { await call("content.save", { quote_type:qt, key:k, body:ta.value }); delete S.texts[b.dataset.t]; await reload(); render(); toast("Wording saved."); } catch(err){ toast(err.message, true); } b.disabled = false; return;
    }
  } catch(err){ toast(err.message || "Something went wrong.", true); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.price) return savePrice(t);
  if (t.dataset.rate) return saveRate(t);
  if (t.id === "showinactive") { S.inactive = t.checked; render(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "find") { S.find = t.value; const pos = t.selectionStart; render(); const n = $("#find"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  if (t.dataset.text) S.texts[t.dataset.text] = t.value;
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && (e.target.dataset.price || e.target.dataset.rate)) e.target.blur(); });
function openGate(msg){ $("#gate").style.display = "flex"; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<p class="muted" style="margin-top:24px">Loading…</p>`;
  try { await reload(); } catch(e){ $("#views").innerHTML = `<div class="card"><b>${esc(e.message)}</b><p class="muted">Open this from the Staff Portal so it knows who you are.</p></div>`; return; }
  if (!S.me.can_config) { $("#views").innerHTML = `<div class="card">You do not have access to the quote configuration. Ask the GM.</div>`; return; }
  $("#whoname").textContent = S.me.name; render();
}
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate(); })();
</script>
</body>
</html>
