/* ============================ BULK ADD ============================
   A column of event references pasted out of a spreadsheet, turned into
   the ones that still need adding and a form for each.

   The references alone cannot create anything: the Guestline API is
   authenticated by the token in each event's portal link, so a link still
   has to be pasted per wedding. What this saves is working out which of
   fifty-eight are already in, and then holding fifty-eight separate trips
   through Add a wedding in your head.

   Pasting a link looks it up there and then — names filled in from the
   event title, the date shown, and a loud warning if the link turns out to
   be for a different wedding than the row it was pasted on. That last part
   is the whole reason this is not simply a spreadsheet import.
   ================================================================ */

var BK = { known: [], rows: [], busy: false, checked: false };

function bulkCheck(){
  var text = $("bulkPaste").value || "";
  var lines = text.split(/[\r\n,;\t]+/);
  if (!lines.filter(function(l){ return l.trim(); }).length) {
    showErr("Paste the event references first."); return;
  }
  var btn = $("bulkCheckBtn");
  btn.disabled = true; btn.textContent = "Checking…";
  call("bulk.check", { refs: lines })
    .then(function(out){
      BK.known = out.known || [];
      BK.checked = true;
      BK.rows = (out.unknown || []).map(function(ref){
        return { ref: ref, link: "", p1: "", p2: "", email: "", phone: "",
                 state: "", message: "" };
      });
      $("views").innerHTML = viewBulk();
      clearErr();
    })
    .catch(function(e){
      showErr(e.message);
      btn.disabled = false; btn.textContent = "Check them";
    });
}

function bulkRow(ref){
  return BK.rows.filter(function(r){ return r.ref === ref; })[0];
}

/* Typed values go straight into the model and nothing is redrawn — redraw
   on a keystroke and the caret jumps out of whatever is being filled in. */
function bulkSet(ref, field, value){
  var r = bulkRow(ref);
  if (r) r[field] = value;
}

function bulkRemove(ref){
  BK.rows = BK.rows.filter(function(r){ return r.ref !== ref; });
  $("views").innerHTML = viewBulk();
}

function bulkStartAgain(){
  BK = { known: [], rows: [], busy: false, checked: false };
  $("views").innerHTML = viewBulk();
}

/* Look a link up the moment it is pasted, so a wrong one is caught while
   the person is still looking at it rather than after another fifty. */
async function bulkLookup(ref){
  var r = bulkRow(ref);
  var note = document.getElementById("bk_note_" + ref);
  if (!r || !r.link.trim() || !note) return;
  note.innerHTML = '<span class="muted">Looking it up…</span>';
  try {
    var out = await call("preview", { link: r.link.trim() });
    var ev = out.event || {};

    if (out.alreadyExists) {
      note.innerHTML = '<span style="color:var(--alert)">Already in the app as ' +
        esc(out.alreadyExists.salutation) + ' (' + esc(out.alreadyExists.event_id) + ').</span>';
      return;
    }
    if (ev.eventId && ev.eventId !== ref) {
      note.innerHTML = '<span style="color:var(--alert)"><strong>This link is for ' +
        esc(ev.eventId) + ', not ' + esc(ref) + '.</strong> Check you have the right one.</span>';
      return;
    }
    /* The names come off the event title, so they are a suggestion to check
       rather than an answer — which is why they land in editable boxes. */
    if (out.suggestedNames) {
      var p1 = document.getElementById("bk_p1_" + ref);
      var p2 = document.getElementById("bk_p2_" + ref);
      if (p1 && !r.p1) { r.p1 = out.suggestedNames.partner1; p1.value = r.p1; }
      if (p2 && !r.p2) { r.p2 = out.suggestedNames.partner2; p2.value = r.p2; }
    }
    note.innerHTML = '<strong>' + esc(ev.name || "") + '</strong> &middot; ' +
      esc(ukDate(ev.startDate)) + ' &middot; ' + esc(ev.eventStatusDescription || "");
  } catch (e) {
    note.innerHTML = '<span style="color:var(--alert)">' + esc(e.message) + '</span>';
  }
}

function bulkReady(){
  return BK.rows.filter(function(r){
    return r.state !== "added" && r.link.trim() && r.p1.trim() && r.p2.trim() && r.email.trim();
  });
}

async function bulkAddAll(){
  var ready = bulkReady();
  if (!ready.length) {
    showErr("Nothing is filled in enough yet — each one needs a link, both names and an email.");
    return;
  }
  if (!confirm("Add " + ready.length + " wedding" + (ready.length === 1 ? "" : "s") +
               " to the app?\n\nAnything not filled in is left alone.")) return;

  BK.busy = true;
  var btn = $("bulkAddBtn");
  btn.disabled = true;

  for (var i = 0; i < ready.length; i++) {
    var r = ready[i];
    btn.textContent = "Adding " + (i + 1) + " of " + ready.length + "…";
    var cell = document.getElementById("bk_state_" + r.ref);
    if (cell) cell.innerHTML = '<span class="muted">Adding…</span>';
    try {
      await call("create", {
        link: r.link.trim(),
        // The row already says which wedding this is meant to be, so the
        // server refuses a link that turns out to be a different one.
        expect_event_id: r.ref,
        partner1_name: r.p1.trim(),
        partner2_name: r.p2.trim(),
        primary_email: r.email.trim(),
        mobile: r.phone.trim() || null
      });
      r.state = "added"; r.message = "";
    } catch (e) {
      r.state = "failed"; r.message = e.message;
    }
  }

  BK.busy = false;
  $("views").innerHTML = viewBulk();
  try { await refreshPending(); } catch (e) {}
  clearErr();
}

function viewBulk(){
  var h = '<h1 style="margin-bottom:6px">Bulk add</h1>';

  if (!BK.checked) {
    h += '<p class="muted" style="margin:0 0 18px">' +
      'Paste a column of event references — straight out of a spreadsheet is fine, ' +
      'blank lines and repeats and all. We will say which are already in the app, and ' +
      'give you a form for the rest.</p>' +
      '<div class="card">' +
      '<div class="field"><span class="label">Event references</span>' +
      '<textarea id="bulkPaste" rows="12" ' +
        'placeholder="EVNT002665&#10;EVNT002666&#10;EVNT002669&#10;…"></textarea></div>' +
      '<button class="btn btn--primary" id="bulkCheckBtn" onclick="bulkCheck()">Check them</button>' +
      '</div>';
    return h;
  }

  var added = BK.rows.filter(function(r){ return r.state === "added"; }).length;
  var left = BK.rows.length - added;

  h += '<p class="muted" style="margin:0 0 18px">' +
    '<strong>' + BK.known.length + '</strong> already in the app, ' +
    '<strong>' + BK.rows.length + '</strong> to add' +
    (added ? ', <strong>' + added + '</strong> added just now' : '') + '. ' +
    '<button class="linkish" onclick="bulkStartAgain()">Start again</button></p>';

  if (BK.known.length) {
    h += '<details class="card" style="margin-bottom:16px">' +
      '<summary style="cursor:pointer">The ' + BK.known.length + ' already here</summary>' +
      '<p class="muted" style="margin:12px 0 0;font-size:.875rem">' +
      BK.known.map(function(w){
        return esc(w.salutation) + ' (' + esc(w.event_id) + ')';
      }).join(' &middot; ') + '</p></details>';
  }

  if (!BK.rows.length) {
    h += '<div class="card empty">Nothing left to add.</div>';
    return h;
  }

  BK.rows.forEach(function(r){
    var done = r.state === "added";
    var ref = esc(r.ref);
    h += '<div class="card bkcard' + (done ? " bkcard--done" : "") +
         (r.state === "failed" ? " bkcard--failed" : "") + '">' +
      '<div class="split" style="margin-bottom:10px">' +
        '<h3 style="margin:0"><code>' + ref + '</code></h3>' +
        '<span id="bk_state_' + ref + '">' +
          (done ? '<span class="pill pill--ok">Added</span>'
                : (r.state === "failed"
                    ? '<span class="pill pill--late">Not added</span>'
                    : '<button class="btn btn--sm udel" onclick="bulkRemove(\'' + ref + '\')">Remove</button>')) +
        '</span></div>';

    if (r.message) h += '<p class="err" style="margin:0 0 12px">' + esc(r.message) + '</p>';

    if (!done) {
      h += '<div class="field"><span class="label">Guestline event link</span>' +
        '<input id="bk_link_' + ref + '" value="' + esc(r.link) + '" ' +
          'placeholder="https://event.eu.guestline.app/e/…" ' +
          'oninput="bulkSet(\'' + ref + '\',\'link\',this.value)" ' +
          'onchange="bulkLookup(\'' + ref + '\')"></div>' +
        '<p class="muted" id="bk_note_' + ref + '" style="margin:-10px 0 14px;font-size:.8125rem">' +
          'Paste the link and we will check it is the right wedding.</p>' +
        '<div class="row">' +
          '<div class="field"><span class="label">Partner 1</span>' +
            '<input id="bk_p1_' + ref + '" value="' + esc(r.p1) + '" ' +
            'oninput="bulkSet(\'' + ref + '\',\'p1\',this.value)"></div>' +
          '<div class="field"><span class="label">Partner 2</span>' +
            '<input id="bk_p2_' + ref + '" value="' + esc(r.p2) + '" ' +
            'oninput="bulkSet(\'' + ref + '\',\'p2\',this.value)"></div>' +
        '</div>' +
        '<div class="row">' +
          '<div class="field"><span class="label">Email *</span>' +
            '<input id="bk_em_' + ref + '" type="email" value="' + esc(r.email) + '" ' +
            'oninput="bulkSet(\'' + ref + '\',\'email\',this.value)"></div>' +
          '<div class="field"><span class="label">Phone</span>' +
            '<input id="bk_ph_' + ref + '" value="' + esc(r.phone) + '" ' +
            'oninput="bulkSet(\'' + ref + '\',\'phone\',this.value)"></div>' +
        '</div>';
    }
    h += '</div>';
  });

  if (left) {
    h += '<div class="bkbar">' +
      '<button class="btn btn--primary" id="bulkAddBtn" onclick="bulkAddAll()">' +
        'Add the ones that are filled in</button>' +
      '<span class="muted" style="font-size:.8125rem">' +
        'Each needs a link, both names and an email. The rest can wait.</span>' +
    '</div>';
  }
  return h;
}

/* ============================ BONUS TRACKER ============================

   The bonus spreadsheet, with room for the rest of what a booking needs
   before it can become a wedding in the app.

   Two gates on top of the back-office password, and both are checked on the
   server rather than here. What each booking is worth, and what each person
   earned on it, is not something every staff login should open by wandering
   into the wrong tab — and a gate that exists only in JavaScript is one
   anybody opens with the developer tools. The passwords live in Supabase
   secrets; this page asks for one, it never holds one.
   ===================================================================== */

/* inApp maps a booking reference to the wedding in the app that has it, so
   a tracker line can open that wedding rather than only knowing it exists. */
var BT = { level:null, pass:"", rows:[], inApp:{}, open:null,
           scope:"all", query:"", type:"", from:"", to:"", month:null };

/* Weddings, everything else, or the lot.

   The tracker holds both, and most of the time the question is about one of
   them: how the wedding book is filling up, or what the wakes and the
   corporate days added up to. Everything on the tab follows it — the four
   figures, both reports and the list — so there is never a number on screen
   counting something different from the one beside it. */
var BT_SCOPES = [
  ["all", "Weddings and events"],
  ["weddings", "Weddings only"],
  ["events", "Events only"],
];

function inScope(r){
  if (BT.scope === "weddings") return isWedding(r.event_type);
  if (BT.scope === "events") return !isWedding(r.event_type);
  return true;
}

/** Every row the tab is currently about, before any searching or filtering. */
function bonusScoped(){ return BT.rows.filter(inScope); }

function bonusSetScope(v){
  BT.scope = v;
  // A type picked under the old scope can be one the new scope has none of,
  // which would show an empty list and no way to see why.
  BT.type = "";
  BT.open = null;
  $("views").innerHTML = viewBonus();
}

/** The wedding in the app this tracker line became, if it became one. */
function bonusApp(r){
  return (r && r.event_ref && BT.inApp[r.event_ref]) || null;
}

/* Who is on the bonus scheme.

   The scheme is for the co-ordinators. The GM picks up a show-round when
   nobody else can and takes the odd booking off the back of it, and is paid
   nothing for either — so no figure is ever shown against his name, and
   nothing of his is counted into the totals. The bookings themselves stay
   exactly where they are: on the tracker, in the revenue, and on the line of
   whoever worked them. It is only the money that comes off.

   The spreadsheet this was imported from does carry a figure on those lines.
   It is not kept: the bonus is worked out from the revenue now, so the stored
   columns are the working rather than the record, and his come out at nil
   like everything else the scheme does not pay. */
var BONUS_NOT_TEAM = ["Paul Riley"];

/* The co-ordinators the scheme pays. Typing a name into a box is how
   "Rebecca Thraves" and "Rebecca thraves" end up as two people on a report,
   so a booking is put against somebody from this list instead. */
var BONUS_TEAM = ["Katie Oliver", "Rebecca Thraves", "Richard Speckman", "Rebecca Airey",
                  "Calli Hogarth", "Caitlin Bainbridge", "Millie Bates"];

/* Everyone who can be put against a booking, split into those the bonus is
   paid to and those it is not.

   The list is not only BONUS_TEAM: anybody already named on the tracker is
   offered too, so a name that predates this list — somebody who has since
   left — is not quietly wiped off a booking the first time it is opened. The
   row's own current value is always in there for the same reason. */
function bonusWhoOptions(current){
  var names = BONUS_TEAM.concat(BONUS_NOT_TEAM);
  BT.rows.forEach(function(r){
    if (r.showround_by) names.push(r.showround_by);
    if (r.secured_by) names.push(r.secured_by);
  });
  if (current) names.push(current);
  names = names.filter(function(n, i, a){ return a.indexOf(n) === i; }).sort();
  return { paid: names.filter(coordinator), unpaid: names.filter(function(n){ return !coordinator(n); }) };
}
function coordinator(name){ return !!name && BONUS_NOT_TEAM.indexOf(name) < 0; }

/* A dry hire is a wedding as far as this app is concerned: a couple hires the
   place for their day and brings their own caterer. They want a countdown, a
   guest list and a table plan the same as anybody else, so they are counted
   with the weddings and offered the same button. */
function isWedding(type){
  var t = String(type || "").trim().toLowerCase();
  return t === "wedding" || t.replace(/[^a-z]/g, "") === "dryhire";
}

/* The rule.

   Every booking type, on anything over a thousand pounds. One per cent of the
   booked revenue rounded down to the last thousand first, so £4,700 pays on
   £4,000. One per cent for doing the show-round and another for securing the
   booking, which is two if the same person did both.

   Worked out from the revenue rather than typed in. Checked against all sixty
   lines of the spreadsheet this came from: it agrees with fifty-seven of them
   and fills in the three that had been left blank. */
/** Money without the pennies when there are none, which is most of the time. */
function tidy(n){ return money(n).replace(/\.00$/, ""); }

function bonusDue(revenue){
  var r = Number(revenue) || 0;
  if (r <= 1000) return 0;
  return Math.floor(r / 1000) * 1000 * 0.01;
}

/* A booking is secured when the contract is signed and the deposit is in.
   Until both, it is on the tracker but nothing is payable on it.

   Overridable per booking, because the exception is real: a wake booked on
   the Tuesday for the Friday pays in full and never sees a contract, and
   somebody earned the bonus on it. The override goes the other way too — a
   deposit that bounced is not a deposit. */
function bonusSecured(r){
  if (r.secured_override === true) return true;
  if (r.secured_override === false) return false;
  return !!(r.contract_signed_date && r.deposit_paid_date);
}

/** What is still wanted before it counts, in the order anybody would say it. */
function bonusWanting(r){
  if (bonusSecured(r)) return "";
  if (r.secured_override === false) return "held back";
  var want = [];
  if (!r.contract_signed_date) want.push("a contract");
  if (!r.deposit_paid_date) want.push("a deposit");
  return want.length ? "waiting on " + want.join(" and ") : "";
}

/** What is actually paid to this person for this booking, which may be nothing. */
function bonusPaid(name, row){
  if (!row || !bonusSecured(row) || !coordinator(name)) return 0;
  return bonusDue(row.revenue);
}

async function bonusUnlock(){
  var btn = $("btGo");
  btn.disabled = true; btn.textContent = "Checking…";
  try {
    var typed = $("btPass").value || "";
    var out = await call("bonus.unlock", { pass: typed });
    BT.level = out.level; BT.pass = typed;
    clearErr();
    $("views").innerHTML = '<div class="empty"><span class="spin"></span></div>';
    await loadBonus();
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = "Open";
  }
}

async function loadBonus(){
  var want = S.view, cur = S.current;
  try {
    var out = await call("bonus.list", { pass: BT.pass });
    if (!stillWanted(want, cur)) return;
    BT.level = out.level; BT.rows = out.rows || []; BT.inApp = out.inApp || {};

    /* Open on this month. It is the one being asked about nine times in ten
       — what has come in since the last bonus run — and a table of eighteen
       months of everything is not an answer to it. Only if there are
       bookings in it: an empty month would show a picker with nothing
       selected, which reads as broken. */
    if (BT.month === null) {
      var now = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" })
        .format(new Date()).slice(0, 7);
      BT.month = BT.rows.some(function(r){ return bonusMonthOf(r) === now; }) ? now : "";
    }

    $("views").innerHTML = viewBonus();
  } catch (e) {
    if (!stillWanted(want, cur)) return;
    showErr(e.message); $("views").innerHTML = viewBonus();
  }
}

/* Locking is a real lock rather than a hidden panel: the password goes with
   it, so the next person has to know it too. */
function bonusLock(){
  // Everything the unlocked view holds, so a relock and unlock starts clean
  // rather than leaving the filters as undefined.
  BT = { level:null, pass:"", rows:[], inApp:{}, open:null,
         scope:"all", query:"", type:"", from:"", to:"", month:null };
  $("views").innerHTML = viewBonus();
}

function bonusSearch(v){ BT.query = v; $("views").innerHTML = viewBonus(); keepCaret("btSearch"); }
function bonusFilter(field, v){ BT[field] = v; BT.open = null; $("views").innerHTML = viewBonus(); }
/* The month picker sits over the by-person table only. It does not touch the
   list below it: somebody checking what a co-ordinator earned in July has no
   reason to lose the booking they were looking at. */
function bonusMonth(v){ BT.month = v; $("views").innerHTML = viewBonus(); }
function bonusClearFilters(){
  BT.query = ""; BT.type = ""; BT.from = ""; BT.to = ""; BT.open = null;
  $("views").innerHTML = viewBonus();
}
function bonusFiltersOn(){ return !!(BT.query || BT.type || BT.from || BT.to); }

/* In the order they went onto the tracker, newest at the top.

   Not by the date a booking was secured: a booking with no contract and no
   deposit yet has no such date, and sorting on one dropped every enquiry
   still to be closed to the bottom of a sixty-line page. Those are the ones
   somebody is chasing, so they belong where they can be seen.

   Falls back to the secured date for anything older than the column — the
   tracker was imported before it existed. */
function bonusNewestFirst(a, b){
  var ac = a.created_at || "", bc = b.created_at || "";
  if (ac !== bc) return ac && bc ? (ac < bc ? 1 : -1) : (ac ? -1 : 1);
  var am = a.booking_month || "", bm = b.booking_month || "";
  if (am !== bm) return am && bm ? (am < bm ? 1 : -1) : (am ? -1 : 1);
  return String(b.booking_name || "").localeCompare(String(a.booking_name || ""));
}

/* Everything the list is narrowed by, in one place, so the count above the
   table and the rows in it can never disagree. */
function bonusFiltered(){
  var words = String(BT.query || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
  return bonusScoped().filter(function(r){
    // "Wake" and "wake" are one thing that somebody typed twice.
    if (BT.type && String(r.event_type || "").toLowerCase() !== BT.type) return false;
    // On the date of the function, which is what anybody looking for one has
    // in their head. A booking with no date on it is not in any range.
    var d = ymd(r.event_date);
    if (BT.from && (!d || d < BT.from)) return false;
    if (BT.to && (!d || d > BT.to)) return false;
    if (!words.length) return true;
    var blob = [r.booking_name, r.event_ref, r.secured_by, r.showround_by, r.event_type,
                r.event_date, r.booking_month, r.primary_email, r.partner1_name,
                r.partner2_name].filter(Boolean).join(" ").toLowerCase();
    return words.every(function(w){ return blob.indexOf(w) >= 0; });
  }).sort(bonusNewestFirst);
}
function bonusOpen(id){ BT.open = (BT.open === id) ? null : id; $("views").innerHTML = viewBonus(); }

function bonusRow(id){ return BT.rows.filter(function(r){ return r.id === id; })[0]; }
function bonusSet(id, field, value){ var r = bonusRow(id); if (r) r[field] = value; }

/* Who did it decides whether there is a bonus box at all, so the panel is
   redrawn. Everything typed into it is already in BT.rows, so nothing typed
   is lost by the redraw. */
function bonusSetWho(id, field, value){
  bonusSet(id, field, value);
  $("views").innerHTML = viewBonus();
}

/* Three states out of a box that can only hold text, so "" has to mean the
   rule rather than false. */
function bonusSetSecured(id, value){
  bonusSet(id, "secured_override", value === "yes" ? true : value === "no" ? false : null);
  $("views").innerHTML = viewBonus();
}

/* Money typed by a person, read by a database. "£12,500" and "12500.00" and
   a stray space all mean the same thing, and an empty box means nothing
   rather than zero. */
function bonusNum(v){
  if (v === "" || v == null) return null;
  var n = parseFloat(String(v).replace(/[^0-9.-]/g, ""));
  return isFinite(n) ? n : null;
}
function bonusDate(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v || "")) ? v : null; }

async function bonusSave(id){
  var r = bonusRow(id); if (!r) return;

  /* The server checks this too, and the database after it. Checked here as
     well because the answer is already in hand, and being told instantly
     which booking holds it beats a round trip to be told the same. */
  var ref = (r.event_ref || "").trim().toUpperCase();
  if (ref) {
    var held = BT.rows.filter(function(x){ return x.id !== id && x.event_ref === ref; })[0];
    if (held) {
      showErr(ref + " is already on " + (held.booking_name || "another booking") +
        ". Two bookings cannot share a reference, so one of them has the wrong one.");
      return;
    }
  }
  var btn = document.getElementById("btsave_" + id);
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    await call("bonus.save", {
      pass: BT.pass, id: r.id,
      booking_month: bonusDate(r.booking_month), event_date: bonusDate(r.event_date),
      event_type: r.event_type || null, booking_name: r.booking_name || null,
      event_ref: (r.event_ref || "").trim().toUpperCase() || null,
      revenue: bonusNum(r.revenue),
      deposit_paid_date: bonusDate(r.deposit_paid_date),
      contract_signed_date: bonusDate(r.contract_signed_date),
      secured_override: r.secured_override === true ? true
                      : r.secured_override === false ? false : null,
      // Written back worked out, not as typed, so anything reading these
      // columns directly sees the same figures the page does.
      showround_by: r.showround_by || null,
      showround_bonus: bonusPaid(r.showround_by, r),
      secured_by: r.secured_by || null,
      booking_bonus: bonusPaid(r.secured_by, r),
      guestline_link: (r.guestline_link || "").trim() || null,
      partner1_name: (r.partner1_name || "").trim() || null,
      partner2_name: (r.partner2_name || "").trim() || null,
      primary_email: (r.primary_email || "").trim() || null,
      mobile: (r.mobile || "").trim() || null,
      notes: r.notes || null
    });
    clearErr();
    if (btn) {
      btn.textContent = "Saved";
      setTimeout(function(){
        if (btn.isConnected) { btn.textContent = "Save"; btn.disabled = false; }
      }, 1400);
    }
  } catch (e) {
    showErr(e.message);
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
  }
}

/* A new line on the tracker.

   Made on the server first so it comes back with an id, then opened with the
   cursor in it. Dated today and called a wedding because that is what four
   out of five of them are — both are the first things on the form, and
   neither is a guess anybody has to live with. */
async function bonusAdd(){
  var btn = $("btAdd");
  if (btn) { btn.disabled = true; btn.textContent = "Adding\u2026"; }
  try {
    var today = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date());
    var out = await call("bonus.save", {
      pass: BT.pass, booking_month: today, event_type: "Wedding",
      booking_name: "New booking"
    });
    clearErr();
    // Cleared, so the new line is not hidden behind a filter the moment it
    // is made — which is exactly what would happen on any narrowed view.
    BT.query = ""; BT.type = ""; BT.from = ""; BT.to = "";
    await loadBonus();
    if (out && out.row) {
      BT.open = out.row.id;
      $("views").innerHTML = viewBonus();
      var el = document.querySelector(".btdetail");
      if (el) el.scrollIntoView({ block: "center" });
    }
  } catch (e) {
    showErr(e.message);
    if (btn) { btn.disabled = false; btn.textContent = "Add a booking"; }
  }
}

/* Taking one off. Typing the name is deliberately more work than clicking
   yes, because there is nothing behind this to undo it with. */
async function bonusDelete(id){
  var r = bonusRow(id); if (!r) return;
  var name = r.booking_name || r.event_ref || "this booking";
  if (prompt('Remove "' + name + '" from the bonus tracker?\n\n' +
             'This only takes it off the tracker. A wedding already in the app ' +
             'is not touched.\n\nType REMOVE to confirm.') !== "REMOVE") return;
  try {
    await call("bonus.delete", { pass: BT.pass, id: id });
    BT.open = null;
    clearErr();
    await loadBonus();
  } catch (e) { showErr(e.message); }
}

/* Turning a line of the tracker into a wedding, through exactly the same
   create that Add a wedding uses — including the check that the link really
   does belong to the reference on this row. */
async function bonusToApp(id){
  var r = bonusRow(id); if (!r) return;

  var missing = [];
  if (!(r.guestline_link || "").trim()) missing.push("the Guestline link");
  if (!(r.partner1_name || "").trim() || !(r.partner2_name || "").trim()) missing.push("both names");
  if (!(r.primary_email || "").trim()) missing.push("an email address");
  if (missing.length) {
    BT.open = id;
    $("views").innerHTML = viewBonus();
    // "a, b and c" rather than "a and b and c".
    var needs = missing.length > 1
      ? missing.slice(0, -1).join(", ") + " and " + missing[missing.length - 1]
      : missing[0];
    showErr("This one still needs " + needs + " — it is open below.");
    return;
  }

  var btn = document.getElementById("btadd_" + id);
  if (btn) { btn.disabled = true; btn.textContent = "Adding…"; }
  try {
    await call("create", {
      link: r.guestline_link.trim(),
      expect_event_id: (r.event_ref || "").trim().toUpperCase() || undefined,
      partner1_name: r.partner1_name.trim(),
      partner2_name: r.partner2_name.trim(),
      primary_email: r.primary_email.trim(),
      mobile: (r.mobile || "").trim() || null
    });
    clearErr();
    BT.open = null;
    await loadBonus();
    try { await refreshPending(); } catch (e) {}
  } catch (e) {
    /* The app has just said which wedding this is. That is exactly the
       reference the tracker line is missing, so offer to write it on rather
       than leaving somebody to copy it across by hand. */
    var clash = e.data && e.data.alreadyExists;
    if (clash && clash.event_id && !r.event_ref &&
        confirm("The app already has this as " + clash.salutation + " (" +
                clash.event_id + ").\n\nPut that reference on this tracker line?")) {
      try {
        await call("bonus.save", { pass: BT.pass, id: r.id, event_ref: clash.event_id });
        await loadBonus();
        clearErr();
        return;
      } catch (e2) { showErr(e2.message); }
    } else {
      showErr(e.message);
    }
    if (btn) { btn.disabled = false; btn.textContent = "Add to wedding app"; }
  }
}

/* ---------- what the tracker adds up to ---------- */
/* Who did what, over whichever bookings are handed in.

   Every booking is counted against whoever took it. What is not counted is
   money to anybody off the scheme — the bookings are the venue's, the bonus
   is only for the people it is paid to. */
function bonusTally(rows){
  var secured = {}, shown = {}, earned = {};
  /* A name or nothing. Money with nobody's name against it is not a person
     and does not get a line in a bonus run — it is a booking somebody has
     not finished filling in, which the note under the table says plainly. */
  rows.forEach(function(r){
    if (r.secured_by) {
      // Counted only once it actually is secured. A booking somebody is
      // still chasing a contract for is not one they have won.
      if (bonusSecured(r)) secured[r.secured_by] = (secured[r.secured_by] || 0) + 1;
      earned[r.secured_by] = (earned[r.secured_by] || 0) + bonusPaid(r.secured_by, r);
    }
    if (r.showround_by) {
      shown[r.showround_by] = (shown[r.showround_by] || 0) + 1;
      earned[r.showround_by] = (earned[r.showround_by] || 0) + bonusPaid(r.showround_by, r);
    }
  });
  return { secured: secured, shown: shown, earned: earned };
}

/** The month a booking was secured, or "" if it has no date on it yet. */
function bonusMonthOf(r){
  var m = String(r.booking_month || "").slice(0, 7);
  return /^\d{4}-\d{2}$/.test(m) ? m : "";
}

function monthName(m){
  return (MONTHS[+m.slice(5, 7) - 1] || "") + " " + m.slice(0, 4);
}

function bonusStats(){
  var scoped = bonusScoped();

  /* Counted per person as well as per month, because the chart draws a
     block for every name it knows about and the axis has to be the height of
     what is actually drawn. Deriving both from the same pass is what keeps
     them in step. */
  var byMonth = {}, taken = {};
  scoped.forEach(function(r){
    var m = bonusMonthOf(r);
    if (!m || !r.secured_by) return;
    byMonth[m] = byMonth[m] || {};
    byMonth[m][r.secured_by] = (byMonth[m][r.secured_by] || 0) + 1;
    taken[r.secured_by] = (taken[r.secured_by] || 0) + 1;
  });

  var all = bonusTally(scoped);
  var secured = all.secured, shown = all.shown, earned = all.earned;

  var weddings = scoped.filter(function(r){ return isWedding(r.event_type); });

  return {
    scoped: scoped,
    total: scoped.length,
    weddings: weddings.length,
    // Of the weddings on the tracker, the ones the couple can already log into.
    onApp: weddings.filter(bonusApp).length,
    revenue: scoped.reduce(function(s, r){ return s + (Number(r.revenue) || 0); }, 0),
    bonus: Object.keys(earned).reduce(function(s, k){ return s + earned[k]; }, 0),
    months: Object.keys(byMonth).sort(),
    byMonth: byMonth, secured: secured, shown: shown, earned: earned,
    // Busiest first, so the legend reads in the order the blocks stack.
    people: Object.keys(taken).sort(function(a, b){ return taken[b] - taken[a]; })
  };
}

var BT_COLOURS = ["#4E5F4F", "#C9A56B", "#A3B0A4", "#8C4A3F", "#C1C8B4", "#6E7F70", "#D8C6A6"];

/* Bookings taken each month, stacked by whoever secured them. Drawn as SVG
   rather than pulled in from a charting library: it is two dozen rectangles,
   and this page already loads behind a password on a venue's wifi. */
function bonusMonthChart(st){
  if (!st.months.length) return "";
  var people = st.people.slice(0, BT_COLOURS.length);
  var tall = 0;
  st.months.forEach(function(m){
    var t = 0; for (var k in st.byMonth[m]) t += st.byMonth[m][k];
    if (t > tall) tall = t;
  });
  if (!tall) return "";

  var step = 46, W = 34 + st.months.length * step, H = 212, base = H - 36, top = 24;
  var yOf = function(n){ return base - (n / tall) * (base - top); };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" ' +
    'role="img" aria-label="Bookings taken each month, by who secured them">';

  var grid = Math.max(1, Math.ceil(tall / 4));
  for (var g = 0; g <= tall; g += grid) {
    svg += '<line x1="30" y1="' + yOf(g).toFixed(1) + '" x2="' + W + '" y2="' + yOf(g).toFixed(1) +
      '" stroke="#E7E7E7"/><text x="24" y="' + (yOf(g) + 4).toFixed(1) +
      '" text-anchor="end" font-size="10" fill="#7B887C">' + g + '</text>';
  }

  st.months.forEach(function(m, i){
    var x = 34 + i * step, y = base, total = 0;
    people.forEach(function(p, pi){
      var n = (st.byMonth[m] || {})[p] || 0;
      if (!n) return;
      total += n;
      var hgt = (n / tall) * (base - top);
      y -= hgt;
      svg += '<rect x="' + x + '" y="' + y.toFixed(1) + '" width="30" height="' + hgt.toFixed(1) +
        '" fill="' + BT_COLOURS[pi % BT_COLOURS.length] + '"><title>' + esc(p) + ' — ' + n +
        ' in ' + esc((MONTHS[+m.slice(5, 7) - 1] || "") + " " + m.slice(0, 4)) + '</title></rect>';
    });
    svg += '<text x="' + (x + 15) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" ' +
        'font-size="11" fill="#4E5F4F">' + total + '</text>' +
      '<text x="' + (x + 15) + '" y="' + (base + 15) + '" text-anchor="middle" font-size="10" ' +
        'fill="#7B887C">' + esc(MONTHS[+m.slice(5, 7) - 1] || "") + '</text>' +
      '<text x="' + (x + 15) + '" y="' + (base + 27) + '" text-anchor="middle" font-size="9" ' +
        'fill="#A3B0A4">' + esc(m.slice(2, 4)) + '</text>';
  });
  svg += '</svg>';

  return '<div class="card"><h2 style="margin-bottom:4px">Bookings taken each month</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    'By the month the booking came in, not the month of the event, and coloured by who ' +
    'secured it.</p>' +
    '<div class="tw">' + svg + '</div>' +
    '<div class="btkey">' + people.map(function(p, i){
      return '<span><i style="background:' + BT_COLOURS[i % BT_COLOURS.length] + '"></i>' +
        esc(p) + '</span>';
    }).join("") + '</div></div>';
}

/* Who did what. A show-round and a booking are two different jobs earning
   two different bonuses, so they get two columns rather than one total that
   hides which is which. */
function bonusPeopleChart(st){
  if (!BT.rows.length) return "";
  /* Whichever month is picked, or the lot. The picker's own options come from
     the whole tracker, so choosing a quiet month never empties the list you
     would use to get back out of it. */
  var rows = BT.month
    ? st.scoped.filter(function(r){ return bonusMonthOf(r) === BT.month; })
    : st.scoped;
  var tally = BT.month ? bonusTally(rows) : st;

  var picker = '<select class="btmonth" onchange="bonusMonth(this.value)">' +
    '<option value=""' + (BT.month ? "" : " selected") + '>Every month</option>' +
    st.months.slice().reverse().map(function(m){
      return '<option value="' + esc(m) + '"' + (BT.month === m ? " selected" : "") + '>' +
        esc(monthName(m)) + '</option>';
    }).join("") + '</select>';

  var total = Object.keys(tally.earned).reduce(function(a, k){ return a + tally.earned[k]; }, 0);

  return bonusPeopleTable(tally, picker, total, rows.length);
}

function bonusPeopleTable(st, picker, total, bookings){
  /* This table is the bonus run. Anybody the scheme does not pay has no
     business being in it with a dash where the money goes — their bookings
     are still counted everywhere else, which is where they belong. */
  var people = Object.keys(st.secured).concat(Object.keys(st.shown), Object.keys(st.earned))
    .filter(function(p, i, a){ return a.indexOf(p) === i && coordinator(p); })
    // By the work, not the money: the bonus column is now blank for anybody
    // off the scheme, and sorting on it buried them under people who took no
    // bookings at all.
    .sort(function(a, b){
      return (st.secured[b] || 0) - (st.secured[a] || 0) ||
             (st.shown[b] || 0) - (st.shown[a] || 0) ||
             (st.earned[b] || 0) - (st.earned[a] || 0);
    });

  /* Everyone the scheme does not pay, gathered into one line.

     Without it the table counted ten bookings in a month that took twelve,
     which makes it a bonus run pretending to be a record of the month. The
     bookings are the venue's however they were taken; the money is the only
     part that belongs to a person. */
  var other = { secured: 0, shown: 0 };
  Object.keys(st.secured).forEach(function(p){
    if (!coordinator(p)) other.secured += st.secured[p];
  });
  Object.keys(st.shown).forEach(function(p){
    if (!coordinator(p)) other.shown += st.shown[p];
  });
  var hasOther = other.secured > 0 || other.shown > 0;

  var head = '<div class="card">' +
    '<div class="split" style="margin-bottom:14px"><h2>By person</h2>' + picker + '</div>' +
    (BT.month
      ? '<p class="muted" style="margin:-4px 0 14px;font-size:.8125rem">' +
        'Bookings secured in ' + esc(monthName(BT.month)) + ', and the bonus on them. ' +
        (bookings ? bookings + ' booking' + (bookings === 1 ? "" : "s") + ' that month.'
                  : 'Nothing was booked that month.') + '</p>'
      : "");

  // Only reachable if a month somehow holds no bookings, which the picker
  // does not offer. Cheaper than a crash out of Math.max on an empty list.
  if (!people.length) return head + '</div>';
  var most = Math.max.apply(null,
    people.map(function(p){ return st.secured[p] || 0; }).concat(other.secured)) || 1;

  return head +
    '<table><thead><tr><th>Who</th><th>Bookings secured</th>' +
    '<th class="num">Show-rounds</th><th class="money">Bonus earned</th></tr></thead><tbody>' +
    people.map(function(p){
      var n = st.secured[p] || 0;
      return '<tr><td><strong>' + esc(p) + '</strong></td>' +
        '<td><span class="btbar"><i style="width:' + Math.round(n / most * 100) + '%"></i></span>' +
          '<span class="num">' + n + '</span></td>' +
        '<td class="num">' + (st.shown[p] || 0) + '</td>' +
        '<td class="money num">' + money(st.earned[p] || 0) + '</td></tr>';
    }).join("") +
    (hasOther
      ? '<tr><td><strong>Other</strong><br>' +
          '<span class="muted" style="font-size:.8125rem">not on the bonus scheme</span></td>' +
        '<td><span class="btbar"><i style="width:' +
          Math.round(other.secured / most * 100) + '%;background:var(--sage-70)"></i></span>' +
          '<span class="num">' + other.secured + '</span></td>' +
        '<td class="num">' + other.shown + '</td>' +
        '<td class="money num"><span class="muted">&mdash;</span></td></tr>'
      : '') +
    '<tr class="bttotal"><td><strong>Total</strong></td>' +
      '<td class="num">' +
        (people.reduce(function(a, p){ return a + (st.secured[p] || 0); }, 0) + other.secured) + '</td>' +
      '<td class="num">' +
        (people.reduce(function(a, p){ return a + (st.shown[p] || 0); }, 0) + other.shown) + '</td>' +
      '<td class="money num"><strong>' + money(total) + '</strong></td></tr>' +
    '</tbody></table>' + bonusWaitingNote() + bonusNamelessNote() + '</div>';
}

/* Show-round bonus with nobody down as having done the show-round.

   Nobody earns it as things stand, and nobody would ever find out: a bonus
   run lists people, and this belongs to no one. So it is said in words under
   the table instead. Somebody did those show-rounds and is owed for them,
   and the only fix is putting the name on the booking. */
function bonusNamelessNote(){
  var half = function(field, what){
    var rows = bonusScoped().filter(function(r){
      return !r[field] && bonusSecured(r) && bonusDue(r.revenue);
    });
    if (!rows.length) return "";
    var owed = rows.reduce(function(a, r){ return a + bonusDue(r.revenue); }, 0);
    return '<p class="muted" style="margin:10px 0 0;font-size:.8125rem">' +
      tidy(owed) + ' of ' + what + ' bonus has no name against it, across ' +
      rows.length + ' booking' + (rows.length === 1 ? "" : "s") + ': ' +
      rows.map(function(r){ return esc(r.booking_name || r.event_ref || "one"); }).join(", ") +
      '. Put the name on the booking and it goes to them.</p>';
  };
  return half("showround_by", "show-round") + half("secured_by", "booking");
}

/* The bookings nothing is payable on yet, and what each is waiting for.

   Without this the table is quietly short and nobody can see why. It is the
   same count whichever month is picked, because a contract signed in October
   settles a booking taken in July. */
function bonusWaitingNote(){
  var waiting = bonusScoped().filter(function(r){ return !bonusSecured(r); });
  if (!waiting.length) return "";
  var owed = waiting.reduce(function(a, r){ return a + bonusDue(r.revenue) * 2; }, 0);
  return '<p class="muted" style="margin:14px 0 0;font-size:.8125rem">' +
    waiting.length + ' booking' + (waiting.length === 1 ? " is" : "s are") +
    ' not secured yet' + (owed ? ', holding back ' + money(owed) : '') +
    '. ' + waiting.map(function(r){
      return esc(r.booking_name || r.event_ref || "one") + ' (' + esc(bonusWanting(r)) + ')';
    }).join(", ") + '.</p>';
}

/* ---------- the page ---------- */
function viewBonus(){
  if (!BT.level) {
    return '<h1 style="margin-bottom:6px">Bonus tracker</h1>' +
      '<p class="muted" style="margin:0 0 18px">Every booking taken, who secured it, and ' +
        'what it is worth. Behind its own password.</p>' +
      '<div class="card" style="max-width:400px">' +
        '<div class="field"><span class="label">Password</span>' +
          '<input id="btPass" type="password" autocomplete="off" ' +
            'onkeydown="if(event.key===\'Enter\'){event.preventDefault();bonusUnlock()}"></div>' +
        '<button class="btn btn--primary" id="btGo" onclick="bonusUnlock()">Open</button>' +
        '<p class="muted" style="margin:14px 0 0;font-size:.8125rem">' +
          'There are two. One opens the tracker to read; the other lets you change it.</p>' +
      '</div>';
  }

  var st = bonusStats();
  var h = '<div class="split" style="margin-bottom:6px"><h1>Bonus tracker</h1>' +
    '<span class="label">' + (BT.level === "edit" ? "You can edit this" : "Read only") + '</span></div>' +
    '<p class="muted" style="margin:0 0 12px">' + st.total + ' booking' + (st.total === 1 ? "" : "s") +
      (BT.scope === "all" ? "" : " of " + BT.rows.length) +
      ' on the tracker. Click any line to open it. ' +
      '<button class="linkish" onclick="bonusLock()">Lock it again</button></p>';

  h += '<div class="btscope">' + BT_SCOPES.map(function(sc){
    return '<button class="' + (BT.scope === sc[0] ? "on" : "") + '" ' +
      'onclick="bonusSetScope(\'' + sc[0] + '\')">' + sc[1] + '</button>';
  }).join("") + '</div>';

  if (!st.total) {
    return h + '<div class="card empty">Nothing on the tracker is ' +
      (BT.scope === "weddings" ? "a wedding or a dry hire" : "an event") + '.<br><br>' +
      '<button class="btn" onclick="bonusSetScope(\'all\')">Show everything</button></div>';
  }

  var tile = function(n, label){
    return '<div class="ufilter ufilter--still"><span class="un">' + n +
      '</span><span class="ul">' + label + '</span></div>';
  };
  /* The first two figures depend on what is being counted. Under events
     there are no weddings to be in the wedding app, and a tile reading
     "0 of 0" is worse than no tile. */
  h += '<div class="ufilters">' +
    tile(st.total, BT.scope === "weddings" ? "Weddings and dry hires"
                 : BT.scope === "events" ? "Events" : "Bookings") +
    (BT.scope === "events" ? "" :
      tile(st.onApp + " of " + st.weddings, "In the wedding app")) +
    tile(tidy(st.revenue), "Revenue booked") +
    tile(tidy(st.bonus), "Bonus earned") +
  '</div>';

  h += bonusMonthChart(st) + bonusPeopleChart(st);

  /* The two reports above are always the whole tracker. Narrowing them with
     the list would make the four figures at the top mean something different
     every time somebody looked for a booking. */
  h += searchBox("btSearch", BT.query, "bonusSearch",
                 "Search by name, reference or person");
  h += bonusFilterBar();

  var rows = bonusFiltered();

  if (!rows.length) {
    return h + '<div class="card empty">Nothing on the tracker matches that.<br><br>' +
      '<button class="btn" onclick="bonusClearFilters()">Clear the search and filters</button>' +
      '</div>';
  }

  h += '<div class="split" style="margin:0 0 12px">' +
    '<span class="muted" style="font-size:.8125rem">' +
      (bonusFiltersOn()
        ? 'Showing ' + rows.length + ' of ' + st.total + ', newest added first. ' +
          '<button class="linkish" onclick="bonusClearFilters()">Show them all</button>'
        : rows.length + ' booking' + (rows.length === 1 ? "" : "s") +
          ', newest added first') + '</span>' +
    (BT.level === "edit"
      ? '<button class="btn btn--sm btn--primary" id="btAdd" onclick="bonusAdd()">' +
        'Add a booking</button>'
      : '') +
  '</div>';

  h += '<div class="card card--flush"><table><thead><tr>' +
    '<th>Booking</th><th>Secured</th><th>Event</th><th class="money">Revenue</th>' +
    '<th>Show-round</th><th>Secured by</th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r){
    var added = !!bonusApp(r);
    var wedding = isWedding(r.event_type);
    h += '<tr class="urow' + (BT.open === r.id ? " btopen" : "") +
        '" onclick="bonusOpen(\'' + esc(r.id) + '\')">' +
      '<td data-label="Booking"><strong>' + esc(r.booking_name || "—") + '</strong>' +
        (r.event_ref ? '<br><span class="muted" style="font-size:.8125rem"><code>' +
          esc(r.event_ref) + '</code></span>' : '') + '</td>' +
      // What the list is ordered by, so the order is not a mystery.
      '<td data-label="Secured" class="num">' +
        (bonusSecured(r)
          ? (r.booking_month ? esc(ukDate(r.booking_month)) : "—")
          : '<span class="pill pill--prov">' + esc(bonusWanting(r) || "not yet") + '</span>') +
        '</td>' +
      '<td data-label="Event" class="num">' + (r.event_date ? esc(ukDate(r.event_date)) : "—") +
        '<br><span class="muted" style="font-size:.8125rem">' + esc(r.event_type || "") + '</span></td>' +
      '<td data-label="Revenue" class="money num">' + (r.revenue ? money(r.revenue) : "—") + '</td>' +
      '<td data-label="Show-round">' + esc(r.showround_by || "—") +
        (bonusPaid(r.showround_by, r)
          ? '<br><span class="muted" style="font-size:.8125rem">' +
            money(bonusPaid(r.showround_by, r)) + '</span>' : '') + '</td>' +
      '<td data-label="Secured by">' + esc(r.secured_by || "—") +
        (bonusPaid(r.secured_by, r)
          ? '<br><span class="muted" style="font-size:.8125rem">' +
            money(bonusPaid(r.secured_by, r)) + '</span>' : '') + '</td>' +
      '<td class="money">' + bonusButton(r, added, wedding) + '</td>' +
    '</tr>';
    if (BT.open === r.id) h += bonusDetail(r, added, wedding);
  });

  h += '</tbody></table></div>' +
    '<div class="center" style="margin-top:16px">' +
    '<button class="btn" onclick="exportBonus()">Download the tracker</button></div>';
  return h;
}

/* Event type and a date range, next to the search box.

   The types are read off the tracker rather than listed here: the venue takes
   wakes and baby showers and whatever else comes along, and a list written
   into the page would be out of date by the first booking that is none of
   them. */
function bonusFilterBar(){
  /* Counted by the lower-cased type, labelled by the tidiest spelling of it
     on the tracker, so "Wake" and "wake" are one line rather than two. */
  var counts = {}, label = {};
  bonusScoped().forEach(function(r){
    var t = String(r.event_type || "").trim();
    if (!t) return;
    var k = t.toLowerCase();
    counts[k] = (counts[k] || 0) + 1;
    // A capital first letter wins; otherwise whichever came first.
    if (!label[k] || (t[0] === t[0].toUpperCase() && label[k][0] !== label[k][0].toUpperCase())) {
      label[k] = t;
    }
  });
  var types = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; });

  return '<div class="btfilters">' +
    '<label><span class="label">Function type</span>' +
      '<select onchange="bonusFilter(\'type\', this.value)">' +
        '<option value=""' + (BT.type ? "" : " selected") + '>' +
          'Everything (' + bonusScoped().length + ')</option>' +
        types.map(function(t){
          return '<option value="' + esc(t) + '"' + (BT.type === t ? " selected" : "") + '>' +
            esc(label[t]) + ' (' + counts[t] + ')</option>';
        }).join("") +
      '</select></label>' +
    '<label><span class="label">Function on or after</span>' +
      '<input type="date" value="' + esc(BT.from) + '" ' +
        'onchange="bonusFilter(\'from\', this.value)"></label>' +
    '<label><span class="label">On or before</span>' +
      '<input type="date" value="' + esc(BT.to) + '" ' +
        'onchange="bonusFilter(\'to\', this.value)"></label>' +
    (bonusFiltersOn()
      ? '<button class="btn btn--sm btfclear" onclick="bonusClearFilters()">Clear</button>'
      : '') +
  '</div>';
}

/* The override, spelled out rather than left as a tick nobody can read.

   Left alone it says what the two dates say, so the usual booking needs
   nothing doing to it and the rule is visible on every line. */
function securedBox(r, ro){
  var now = r.secured_override === true ? "yes"
          : r.secured_override === false ? "no" : "";
  var opt = function(v, text){
    return '<option value="' + v + '"' + (now === v ? " selected" : "") + '>' + text + '</option>';
  };
  return '<div class="field"><span class="label">Counts as secured</span>' +
    '<select' + (ro ? " disabled" : "") +
      ' onchange="bonusSetSecured(\'' + esc(r.id) + '\', this.value)">' +
      opt("", "When the contract is signed and the deposit is in") +
      opt("yes", "Yes \u2014 whatever the dates say") +
      opt("no", "No \u2014 whatever the dates say") +
    '</select></div>';
}

/* Read a Guestline portal link and take the reference off it.

   The same preview the Add a wedding page uses. Nothing is assumed from it
   beyond the reference and, where the line is still blank, the names it
   suggests — those come off the event title and are a guess to check, which
   is why they land in boxes rather than being saved. */
async function bonusLookup(id){
  var r = bonusRow(id); if (!r) return;
  var note = document.getElementById("btnote_" + id);
  var btn = document.getElementById("btread_" + id);
  var link = (r.guestline_link || "").trim();
  if (!link) { if (note) note.innerHTML = "Paste the link first."; return; }

  if (btn) { btn.disabled = true; btn.textContent = "Reading\u2026"; }
  if (note) note.innerHTML = '<span class="muted">Asking Guestline\u2026</span>';
  try {
    var out = await call("preview", { link: link });
    var ev = (out && out.event) || {};
    var ref = out.alreadyExists ? out.alreadyExists.event_id : ev.eventId;
    if (!ref) throw new Error("That link came back without a booking reference on it.");

    var held = BT.rows.filter(function(x){ return x.id !== id && x.event_ref === ref; })[0];
    if (held) {
      if (note) {
        note.innerHTML = '<span style="color:var(--alert)">' + esc(ref) +
          ' is already on ' + esc(held.booking_name || "another booking") +
          '. One of the two has the wrong link.</span>';
      }
      if (btn) { btn.disabled = false; btn.textContent = "Read the link"; }
      return;
    }

    var save = { pass: BT.pass, id: r.id, event_ref: ref, guestline_link: link };
    if (!r.partner1_name && out.suggestedNames) save.partner1_name = out.suggestedNames.partner1;
    if (!r.partner2_name && out.suggestedNames) save.partner2_name = out.suggestedNames.partner2;
    if (!r.event_date && ev.startDate) save.event_date = String(ev.startDate).slice(0, 10);
    await call("bonus.save", save);
    await loadBonus();
    BT.open = id;
    $("views").innerHTML = viewBonus();
    clearErr();
  } catch (e) {
    if (note) note.innerHTML = '<span style="color:var(--alert)">' + esc(e.message) + '</span>';
    if (btn) { btn.disabled = false; btn.textContent = "Read the link"; }
  }
}

/* What this booking pays, and how that number was arrived at.

   Shown rather than typed. The bonus follows the revenue, so a revenue
   corrected on this form corrects the bonus with it, and there is no second
   number to remember to change. */
function bonusWorking(r){
  var rev = Number(r.revenue) || 0;
  var each = bonusDue(rev);

  var line = function(did, nobody, name){
    if (!name) return '<li>' + nobody + ', so that half is not paid.</li>';
    if (!coordinator(name)) {
      return '<li><strong>' + esc(name) + '</strong> ' + did +
        ', and is not on the bonus scheme.</li>';
    }
    return '<li><strong>' + esc(name) + '</strong> ' + did +
      ': <strong>' + tidy(each) + '</strong></li>';
  };

  var body;
  if (!bonusSecured(r)) {
    body = '<p style="margin:0">Nothing yet \u2014 ' + esc(bonusWanting(r)) +
      '. Nothing is payable until a booking is secured.</p>';
  } else if (!rev) {
    body = '<p style="margin:0">Put the booked revenue in and the bonus works itself out.</p>';
  } else if (!each) {
    body = '<p style="margin:0">Nothing \u2014 ' + tidy(rev) +
      ' is not over £1,000.</p>';
  } else {
    body = '<p style="margin:0 0 8px">One per cent of <strong>' +
        tidy(Math.floor(rev / 1000) * 1000) + '</strong> each \u2014 ' + tidy(rev) +
        ' rounded down to the last £1,000.</p>' +
      '<ul style="margin:0;padding-left:18px">' +
        line("did the show-round", "Nobody is down as having done the show-round",
             r.showround_by) +
        line("secured it", "Nobody is down as having secured it", r.secured_by) +
      '</ul>';
  }

  return '<div class="field btworking"><span class="label">Bonus on this booking</span>' +
    body + '</div>';
}

/* Only a wedding gets the button. A dry hire or a wake has no couple to
   invite, and offering it would be an invitation to make an account that
   nobody ever logs into. */
function bonusButton(r, added, wedding){
  if (!wedding) return '<span class="muted" style="font-size:.8125rem">Not a wedding</span>';

  // In the app, and the reference says which one — so go there.
  var app = bonusApp(r);
  if (app) {
    return '<button class="btn btn--sm btlink" ' +
      'onclick="event.stopPropagation();open_(\'' + esc(app.id) + '\')" ' +
      'title="Open ' + esc(app.salutation || r.event_ref) + ' in the app">Open in app</button>';
  }

  /* Whether a booking is in the app is answered by its reference. Without
     one there is no answer — and a button reading "Add to wedding app" is an
     answer. It offered to add a wedding that was already there. */
  if (!r.event_ref) return '<span class="pill pill--prov">Needs a reference</span>';

  return '<button class="btn btn--sm btn--primary" id="btadd_' + esc(r.id) + '" ' +
    'onclick="event.stopPropagation();bonusToApp(\'' + esc(r.id) + '\')">Add to wedding app</button>';
}

function bonusDetail(r, added, wedding){
  var ro = BT.level !== "edit";
  var box = function(label, field, attrs){
    return '<div class="field"><span class="label">' + label + '</span>' +
      '<input value="' + esc(r[field] == null ? "" : r[field]) + '"' + (ro ? " disabled" : "") +
      (attrs || "") + ' oninput="bonusSet(\'' + esc(r.id) + '\',\'' + field + '\',this.value)"></div>';
  };

  var who = function(label, field){
    var now = r[field] || "";
    var opts = bonusWhoOptions(now);
    var group = function(title, names){
      return names.length
        ? '<optgroup label="' + title + '">' + names.map(function(n){
            return '<option' + (n === now ? " selected" : "") + '>' + esc(n) + '</option>';
          }).join("") + '</optgroup>'
        : "";
    };
    return '<div class="field"><span class="label">' + label + '</span>' +
      '<select' + (ro ? " disabled" : "") +
        ' onchange="bonusSetWho(\'' + esc(r.id) + '\',\'' + field + '\',this.value)">' +
        '<option value=""' + (now ? "" : " selected") + '>Nobody recorded</option>' +
        group("Gets a bonus", opts.paid) +
        group("No bonus", opts.unpaid) +
      '</select></div>';
  };

  var h = '<tr class="btdetail"><td colspan="7"><div class="btpanel" onclick="event.stopPropagation()">';

  var app = bonusApp(r);
  if (app) {
    h += '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
      'In the wedding app as <strong>' + esc(app.salutation || "") + '</strong>' +
      (app.wedding_date ? ', ' + esc(ukDate(app.wedding_date)) : '') + '. ' +
      '<button class="linkish" onclick="open_(\'' + esc(app.id) + '\')">Open it</button></p>';
  } else if (wedding && !r.event_ref) {
    /* No reference, so nothing can be checked and nothing offered. The
       reference is in Guestline and Guestline will not be asked for it by
       name — its API authenticates one event at a time, with the token in
       that event's own portal link. So: paste the link, and it tells us. */
    h += '<p class="muted" style="margin:0 0 12px;font-size:.875rem">' +
      'This one has no booking reference, so there is no way to tell whether it is ' +
      'already in the app. Paste its Guestline event link and press ' +
      '<strong>Read the link</strong> &mdash; the reference comes back with it.</p>' +
      '<div class="field"><span class="label">Guestline event link</span>' +
        '<input id="btlook_' + esc(r.id) + '" value="' + esc(r.guestline_link || "") + '"' +
        (ro ? " disabled" : "") + ' placeholder="https://event.eu.guestline.app/\u2026" ' +
        'oninput="bonusSet(\'' + esc(r.id) + '\',\'guestline_link\',this.value)"></div>' +
      (ro ? '' :
        '<button class="btn btn--sm btn--primary" id="btread_' + esc(r.id) + '" ' +
          'onclick="bonusLookup(\'' + esc(r.id) + '\')">Read the link</button>') +
      '<p class="muted" id="btnote_' + esc(r.id) + '" ' +
        'style="margin:10px 0 14px;font-size:.8125rem"></p>';
  } else if (wedding) {
    h += '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
      'What this booking still needs before it can go into the wedding app. The portal ' +
      'link is the only one we cannot work out for ourselves &mdash; it is on the booking ' +
      'confirmation Guestline sent them.' + (ro ? ' You are reading, not editing.' : '') + '</p>' +
      '<div class="field"><span class="label">Guestline event link</span>' +
        '<input value="' + esc(r.guestline_link || "") + '"' + (ro ? " disabled" : "") +
        ' placeholder="https://event.eu.guestline.app/…" ' +
        'oninput="bonusSet(\'' + esc(r.id) + '\',\'guestline_link\',this.value)"></div>' +
      '<div class="row">' + box("Partner 1", "partner1_name") + box("Partner 2", "partner2_name") + '</div>' +
      '<div class="row">' + box("Email", "primary_email", ' type="email"') +
        box("Phone", "mobile") + '</div>';
  }

  h += '<div class="row">' + box("Secured on", "booking_month", ' type="date"') +
      box("Event date", "event_date", ' type="date"') + '</div>' +
    '<div class="row">' + box("Booking name", "booking_name") + box("Reference", "event_ref") + '</div>' +
    '<div class="row">' + box("Event type", "event_type") + box("Revenue", "revenue") + '</div>' +
    // The bonus box only appears where there is somebody on the scheme to pay
    // it to. On a line the GM worked there is no bonus, so there is no box.
    '<div class="row">' + box("Deposit paid", "deposit_paid_date", ' type="date"') +
      box("Contract signed", "contract_signed_date", ' type="date"') + '</div>' +
    securedBox(r, ro) +
    '<div class="row">' + who("Show-round by", "showround_by") +
      who("Secured by", "secured_by") + '</div>' +
    bonusWorking(r) +
    box("Notes", "notes");

  if (!ro) {
    h += '<div class="split">' +
      '<button class="btn btn--primary btn--sm" id="btsave_' + esc(r.id) + '" ' +
        'onclick="bonusSave(\'' + esc(r.id) + '\')">Save</button>' +
      '<button class="btn btn--sm btn--danger" ' +
        'onclick="bonusDelete(\'' + esc(r.id) + '\')">Remove from tracker</button>' +
    '</div>';
  }

  return h + '</div></td></tr>';
}

function exportBonus(){
  csvRaw("bonus-tracker",
    ["Secured on", "Event type", "Event date", "Booking name", "Reference", "Revenue",
     "Show-round by", "Show-round bonus", "Secured by", "Booking bonus", "In the wedding app"],
    // What is on the screen, in the order it is on the screen. Downloading
    // the whole tracker after narrowing it to eleven lines is never what
    // anybody meant.
    bonusFiltered().map(function(r){
      return [ymd(r.booking_month), r.event_type || "", ymd(r.event_date), r.booking_name || "",
              r.event_ref || "", r.revenue == null ? "" : r.revenue,
              r.showround_by || "", bonusPaid(r.showround_by, r) || "",
              r.secured_by || "", bonusPaid(r.secured_by, r) || "",
              bonusApp(r) ? "Yes" : "No"];
    }));
}

/* ============================ RECONCILE QUEUE ============================ */
function viewReconcile(){
  var h = '<h1 style="margin-bottom:6px">Payments to post</h1>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Card payments taken in the app. They don\'t reach Guestline on their own — post each one in Rezlynx, ' +
    'then mark it here so the app stops counting it separately.</p>';

  if (!S.pending.length) {
    h += '<div class="card empty">Nothing waiting. Everything\'s posted.</div>';
    return h;
  }

  var total = S.pending.reduce(function(s,p){ return s + Number(p.amount); }, 0);
  h += '<div class="notice notice--due"><strong>' + money(total) + '</strong> across ' +
    S.pending.length + ' payment' + (S.pending.length===1?"":"s") + ' waiting to be posted.</div>';

  h += '<div class="card card--flush"><table><thead><tr>' +
    '<th>Paid</th><th>Couple</th><th>Reference</th><th class="money">Amount</th><th></th>' +
    '</tr></thead><tbody>';
  S.pending.forEach(function(p){
    var w = p.wedding || {};
    h += '<tr><td class="num">' + esc(ukDate(p.paid_at)) + '</td>' +
      '<td><strong>' + esc(w.salutation||"—") + '</strong><br>' +
      '<span class="muted" style="font-size:.8125rem">wedding ' + esc(ukDate(w.wedding_date)) + '</span></td>' +
      '<td class="num" style="font-size:.8125rem"><code>' + esc(w.event_id||"—") + '</code><br>' +
      '<span class="muted">' + esc(p.payment_reference||"") + '</span></td>' +
      '<td class="money num"><strong>' + money(p.amount) + '</strong></td>' +
      '<td class="money"><button class="btn btn--sm" onclick="reconcileFromQueue(\'' + p.id + '\')">Mark posted</button>' +
      '<br><button class="btn btn--sm" style="border:0;padding:4px 0" onclick="open_(\'' + p.wedding_id + '\')">Open wedding</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

async function reconcileFromQueue(id){
  var by = prompt("Posted to Rezlynx by whom?", "");
  if (by === null) return;
  try { await call("payments.reconcile", { id:id, by: by || "events team" });
        await refreshPending(); render(); clearErr(); }
  catch (e) { showErr(e.message); }
}

/* ============================ ADD A WEDDING ============================ */
function viewAdd(){
  var h = '<h1 style="margin-bottom:6px">Add a wedding</h1>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Paste the couple\'s Guestline event portal link. Everything else comes from it.</p>';

  h += '<div class="card"><div class="field"><span class="label">Guestline event link</span>' +
    '<input id="glLink" placeholder="https://event.eu.guestline.app/e/..."></div>' +
    '<button class="btn btn--primary" id="previewBtn" onclick="doPreview()">Look it up</button></div>';

  h += '<div id="previewBox"></div>';
  return h;
}

async function doPreview(){
  var link = $("glLink").value.trim();
  if (!link) return;
  var btn = $("previewBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    S.preview = await call("preview", { link: link });
    clearErr();
    $("previewBox").innerHTML = previewHtml();
  } catch (e) {
    showErr(e.message);
    $("previewBox").innerHTML = "";
  } finally {
    btn.disabled = false; btn.textContent = "Look it up";
  }
}

function previewHtml(){
  var p = S.preview, ev = p.event;

  if (p.alreadyExists) {
    return '<div class="notice notice--late">This event is already set up as <strong>' +
      esc(p.alreadyExists.salutation) + '</strong> (' + esc(p.alreadyExists.event_id) + '). ' +
      '<button class="btn btn--sm" onclick="open_(\'' + p.alreadyExists.id + '\')">Open it</button></div>';
  }

  /* Both names, read off the event title by namesFromEventTitle, or null
     where the title could not be read as two people. Either way the
     coordinator checks them before anything is created. */
  var sug = p.suggestedNames || null;

  var h = '<div class="card"><h2 style="margin-bottom:12px">Is this the right wedding?</h2>' +
    '<table>' +
    '<tr><th>Event</th><td><strong>' + esc(ev.name) + '</strong></td></tr>' +
    '<tr><th>Date</th><td>' + esc(ukDate(ev.startDate)) + '</td></tr>' +
    '<tr><th>Reference</th><td><code>' + esc(ev.eventId) + '</code></td></tr>' +
    '<tr><th>Status</th><td>' + esc(ev.eventStatusDescription) + '</td></tr>' +
    '<tr><th>Guests</th><td class="num">' + esc(guestSplitText(p.functions, ev.guests)) + '</td></tr>' +
    '<tr><th>Total</th><td class="num">' + money(ev.totalCost) + '</td></tr>' +
    '<tr><th>Outstanding</th><td class="num">' + money(p.balance.outstanding) + '</td></tr>' +
    '<tr><th>Coordinator</th><td>' + esc(ev.coordinatorName||"—") + '</td></tr>' +
    '<tr><th>Booking refs</th><td class="num">' + p.bookingRefs.map(esc).join(", ") + '</td></tr>' +
    '</table></div>';

  h += '<div class="notice notice--ok">Their login will be reference <code>' + esc(ev.eventId) +
    '</code> with password <code>' + esc(ddmmyyyy(ev.startDate)) + '</code>.</div>';

  var firstNames = sug
    ? sug.partner1.split(" ")[0] + " & " + sug.partner2.split(" ")[0]
    : "";

  h += '<div class="card"><h2 style="margin-bottom:6px">Who are they?</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    (sug
      ? 'We have read these off the event name &mdash; <strong>please check them</strong>, ' +
        'then add an email address. The event link carries no contact details at all, so that ' +
        'part has to come from you.'
      : 'The event name could not be read as two names, so pop them in here. This is how the ' +
        'app greets them and where their receipts go.') +
    '</p>' +
    '<div class="row"><div class="field"><span class="label">Partner 1</span>' +
      '<input id="n_p1" value="' + esc(sug ? sug.partner1 : "") + '"></div>' +
    '<div class="field"><span class="label">Partner 2</span>' +
      '<input id="n_p2" value="' + esc(sug ? sug.partner2 : "") + '"></div></div>' +
    '<div class="field"><span class="label">How to address them</span>' +
      '<input id="n_sal" value="' + esc(firstNames) + '" ' +
      'placeholder="Leave blank and we\'ll use their first names"></div>' +
    '<div class="row"><div class="field"><span class="label">Primary email *</span><input id="n_em1" type="email"></div>' +
    '<div class="field"><span class="label">Second email</span><input id="n_em2" type="email"></div></div>' +
    '<div class="field"><span class="label">Mobile</span><input id="n_mob"></div>' +
    '<button class="btn btn--primary" id="createBtn" onclick="doCreate()">Create their account</button></div>';

  return h;
}

async function doCreate(){
  var btn = $("createBtn");
  var p1 = $("n_p1").value.trim(), p2 = $("n_p2").value.trim(), em = $("n_em1").value.trim();
  if (!p1 || !p2 || !em) { showErr("Both names and a primary email are needed — the receipts have to go somewhere."); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    var res = await call("create", {
      link: $("glLink").value.trim(),
      partner1_name: p1, partner2_name: p2,
      salutation: $("n_sal").value.trim(),
      primary_email: em,
      secondary_email: $("n_em2").value.trim(),
      mobile: $("n_mob").value.trim()
    });
    clearErr();
    S.preview = null;
    open_(res.wedding.id);
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = "Create their account";
  }
}

/* ---------- exports ---------- */
function csv(name, head, rows){
  var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var body = [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n");
  var blob = new Blob(["﻿"+body], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-" + S.detail.wedding.event_id + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function exportGuests(){
  csv("guest-list",
    ["First name","Surname","Household","Email","Address","Invited to","Age group","RSVP","Dietary","Accessibility"],
    S.detail.guests.map(function(g){
      return [g.first_name,g.surname,g.household,g.email,g.address,g.invited_to,g.age_group,g.rsvp,g.dietary,g.accessibility];
    }));
}

function exportSuppliers(){
  csv("supplier-schedule", ["Arrives","Supplier","Category","Contact","Phone","Email","Notes"],
    S.detail.suppliers.slice().sort(function(a,b){
      return String(a.arrival_time||"99").localeCompare(String(b.arrival_time||"99"));
    }).map(function(s){
      return [s.arrival_time?String(s.arrival_time).slice(0,5):"", s.name, s.category, s.contact_name, s.phone, s.email, s.notes];
    }));
}
