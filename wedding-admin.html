<!--
  Black Horse Beamish — Wedding App, back-office portal.

  Deployed to bhb-till-portal/wedding-admin.html -> GitHub Pages at
  app.blackhorsebeamish.co.uk/wedding-admin.html, and iframed by the
  password-protected Squarespace page at
  blackhorsebeamish.co.uk/wedding-app-config.
  Same arrangement as /till-reports -> index.html.

  Staff only. Couples never see this page — they go to
  blackhorsebeamish.co.uk/wedding-app and log in with their event reference
  and wedding date.

  Everything goes through the wedding-admin edge function, which holds the
  service role. The password below is checked here for the UI and again
  server-side on every call, so a reader of this source still can't do
  anything without it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --sage:#4E5F4F; --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff;
  --sage-70:#7B887C; --sage-10:#EDEFED;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --display:orpheus-pro,"Cormorant Garamond",Georgia,serif;
  --body:Raleway,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--sage);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin:0}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1rem}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hide{display:none!important}
.label{font-size:.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--sage-70)}
.center{text-align:center}

header{background:var(--sage);color:var(--bone);padding:16px 0;
  padding-top:max(env(safe-area-inset-top,0px), 16px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.0625rem;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--celadon);
  padding:9px 14px;cursor:pointer;font:500 .6875rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase}
nav button[aria-current="page"]{color:var(--bone);border-bottom-color:var(--celadon)}
main{padding:26px 0 70px;padding-bottom:max(env(safe-area-inset-bottom,0px), 70px)}

.btn{display:inline-block;background:transparent;color:var(--sage);border:1px solid currentColor;
  border-radius:0;padding:11px 22px;font:500 .75rem/1 var(--body);letter-spacing:.17em;
  text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .16s,color .16s}
.btn:hover{background:var(--sage);color:var(--bone)}
.btn--primary{background:var(--sage);color:var(--bone)}
.btn--sm{padding:7px 12px;font-size:.6875rem}
.btn--danger{color:var(--alert)}
.btn--danger:hover{background:var(--alert);color:var(--bone)}
.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{width:100%;background:var(--bone);color:var(--sage);border:1px solid var(--mist);
  border-radius:0;padding:10px 12px;font-family:var(--body);font-size:.9375rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage)}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:13px}
.field .label{display:block;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.row,.row3{grid-template-columns:1fr}}

.card{background:var(--white);border:1px solid var(--mist);padding:20px;margin-bottom:16px}
.card--flush{padding:0}
table{width:100%;border-collapse:collapse}
th{font-size:.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70);
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--mist)}
td{padding:12px 14px;border-bottom:1px solid var(--mist);vertical-align:top}
td.money,th.money{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sage-10)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.pill--ok{background:var(--sage-10);color:var(--sage)}
.pill--due{background:var(--attention-bg);color:var(--attention)}
.pill--late{background:var(--alert-bg);color:var(--alert)}
.pill--prov{background:var(--mist);color:var(--sage-70)}

.notice{padding:13px 16px;font-size:.9375rem;border:1px solid;margin-bottom:16px}
.notice--due{background:var(--attention-bg);border-color:var(--attention);color:#7a5f36}
.notice--late{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.notice--ok{background:var(--sage-10);border-color:var(--celadon)}
.err{background:var(--alert-bg);border:1px solid var(--alert);color:var(--alert);padding:11px 14px;
  font-size:.875rem;margin-bottom:14px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{padding:34px 20px;text-align:center;color:var(--sage-70)}
.sheet{white-space:pre-wrap;font-size:.875rem;line-height:1.7;background:var(--bone);
  border:1px solid var(--mist);padding:14px;max-height:340px;overflow:auto}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--mist);border:1px solid var(--mist)}
.stat div{background:var(--white);padding:14px 12px;text-align:center}
.stat .v{font-size:1.1875rem;font-variant-numeric:tabular-nums;margin-top:3px}
@media(max-width:700px){.stat{grid-template-columns:repeat(2,1fr)}}

/* ---- on a phone ----
   The back end is a desk tool that people now open on the floor, mid-wedding,
   to check a balance or a guest number. Nothing here is a phone-first
   redesign; it is making the desk tool legible one-handed. */
@media(max-width:760px){
  body{font-size:15px}
  .wrap{padding:0 14px}
  h1{font-size:1.375rem}
  h2{font-size:1.125rem}
  main{padding-top:18px}

  /* The section nav scrolls sideways rather than wrapping to three rows. */
  nav{flex-wrap:nowrap;overflow-x:auto;margin:10px -14px 0;padding:0 14px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{white-space:nowrap;padding:9px 11px;letter-spacing:.14em}

  header .wrap{gap:8px}
  .brand{font-size:.9375rem;letter-spacing:.1em}

  .card{padding:14px}
  .stat div{padding:11px 8px}
  .stat .v{font-size:1.0625rem}

  /* A wide table is turned on its side rather than made to scroll. Reading
     a table by dragging it sideways means the row you are reading loses the
     name it belongs to — on the forward book the couple went off the left
     edge, which is the one column that matters. Each row becomes a small
     block instead, every value labelled. */
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:auto}
  table.stack thead{display:none}
  table.stack tr{padding:11px 0;border-bottom:1px solid var(--mist)}
  table.stack tr:last-child{border-bottom:0}
  table.stack tbody tr:hover{background:transparent}
  table.stack td{border:0;padding:3px 0;text-align:left}
  table.stack td.money,table.stack td.num{text-align:left}
  table.stack td[data-label]:not([data-label=""]):before{
    content:attr(data-label);display:inline-block;min-width:104px;
    font-size:.625rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sage-70);vertical-align:baseline}
  /* A blank cell says nothing worth a line of its own on a phone. */
  table.stack td.is-empty{display:none}
  .card--flush table.stack tr{padding:11px 14px}

  /* Anything not stacked — the label-and-value tables — still scrolls. */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:9px 10px}

  .btn{padding:10px 16px}
  .btn--sm{padding:7px 10px}
  .split{align-items:flex-start}
  .sheet{max-height:240px}
  .login{margin:36px auto}
}
@media(max-width:420px){
  .stat{grid-template-columns:1fr 1fr}
  .btn{letter-spacing:.12em}
}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--mist);border-top-color:var(--sage);
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
code{font-family:ui-monospace,"SF Mono",monospace;font-size:.875em;background:var(--sage-10);padding:1px 5px}
.login{max-width:360px;margin:70px auto;padding:0 20px}
</style>

<script>
"use strict";

var CFG = {
  SUPABASE_URL: "https://safcrtrfdzsnftghibot.supabase.co",
  SUPABASE_KEY: "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU",
  PASSWORD: "BlackH0rse#",
  KEY: "bhb_wedding_admin"
};

var S = { pw:null, view:"overview", list:[], pending:[], current:null, preview:null,
          outstanding:null, forecast:null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n){ return "£" + (Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ymd(iso){ return String(iso||"").slice(0,10); }
function hhmm(iso){ return String(iso||"").slice(11,16); }
function ukDate(iso){
  var p = ymd(iso).split("-"); if (p.length!==3) return "";
  return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})
    .format(new Date(Date.UTC(+p[0],+p[1]-1,+p[2])));
}
function ddmmyyyy(iso){ var p = ymd(iso).split("-"); return p.length===3 ? p[2]+p[1]+p[0] : ""; }

/* Daytime and evening are different bookings with different numbers, and the
   event-level figure matches neither. Read them off the functions, and never
   add them up — an evening number usually already includes the day guests. */
function guestSplit(functions){
  var isEve = function(f){ return /evening|party|disco/i.test(f.name); };
  var most = function(list){
    return list.reduce(function(m,f){ return Math.max(m, Number(f.numberOfGuests)||0); }, 0);
  };
  var fns = functions || [];
  return { day: most(fns.filter(function(f){ return !isEve(f); })), evening: most(fns.filter(isEve)) };
}

function guestSplitText(functions, fallback){
  var g = guestSplit(functions);
  if (g.day && g.evening) return g.day + " day \u00b7 " + g.evening + " evening";
  if (g.day || g.evening) return String(g.day || g.evening);
  return fallback != null ? String(fallback) : "\u2014";
}
function daysToGo(iso){
  var t = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()).split("-");
  var p = ymd(iso).split("-");
  return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2]) - Date.UTC(+t[0],+t[1]-1,+t[2]))/86400000);
}

async function call(action, payload){
  var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/wedding-admin", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
    body: JSON.stringify({ password:S.pw, action:action, payload:payload||{} })
  });
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || ("Request failed ("+r.status+")"));
  return data;
}

/* ---------- the couple's invitation email ----------
   Preview and send both come from one builder on the server, so what is
   checked here is exactly what is sent. Sending reports back what Brevo
   did with it rather than just claiming success. */
async function callWelcome(action, extra){
  var body = { password:S.pw, action:action,
               id: (S.detail && S.detail.wedding) ? S.detail.wedding.id : null };
  for (var k in (extra||{})) body[k] = extra[k];
  var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/send-couple-welcome", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
    body: JSON.stringify(body)
  });
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || ("Request failed ("+r.status+")"));
  return data;
}

function welcomeBusy(msg){
  var box = $("welcomeBox");
  if (box) box.innerHTML = '<p class="muted" style="margin:12px 0 0">' + esc(msg) + '</p>';
}

function closeWelcomePreview(){ var b = $("welcomeBox"); if (b) b.innerHTML = ""; }

async function previewWelcome(){
  welcomeBusy("Building the preview…");
  try {
    var d = await callWelcome("preview");
    /* srcdoc, not innerHTML: it is a whole email document, and it must not
       inherit this page's styles or leak its own into it. */
    $("welcomeBox").innerHTML =
      '<div style="margin-top:12px">' +
        '<p class="muted" style="margin:0 0 8px;font-size:.8125rem">' +
          '<strong>To</strong> ' + esc((d.to||[]).join(", ") || "nobody — add an email address first") +
          ' &middot; <strong>From</strong> ' + esc(d.from) +
          ' &middot; <strong>Replies go to</strong> ' + esc(d.replyTo) + '<br>' +
          '<strong>Subject</strong> ' + esc(d.subject) +
        '</p>' +
        '<iframe title="Email preview" style="width:100%;height:620px;border:1px solid var(--mist);background:#fff" ' +
          'srcdoc="' + esc(d.html) + '"></iframe>' +
        '<p style="margin:8px 0 0">' +
          '<button class="btn btn--sm" onclick="closeWelcomePreview()">Close preview</button></p>' +
      '</div>';
  } catch (e) { welcomeBusy(""); showErr(e.message); }
}

async function sendWelcome(){
  var w = (S.detail && S.detail.wedding) || {};
  var who = [w.primary_email, w.secondary_email].filter(Boolean).join(" and ");
  if (!who) { showErr("There's no email address on this wedding yet — add one first."); return; }
  var again = w.welcome_sent_at
    ? "\n\nThey were already sent this on " + ukDate(w.welcome_sent_at) + "."
    : "";
  if (!confirm("Send " + (w.salutation || "the couple") + " their app details?"
             + "\n\nTo: " + who + again)) return;

  welcomeBusy("Sending, then checking it went…");
  try {
    var d = await callWelcome("send");
    var state = (d.delivery && d.delivery.state) || "accepted";
    var line, cls;
    if (state === "delivered") {
      line = "Sent and delivered to " + d.to.join(", ") + ".";  cls = "notice--ok";
    } else if (state === "sent") {
      line = "Sent to " + d.to.join(", ") + " and accepted for delivery.";  cls = "notice--ok";
    } else if (state === "failed") {
      line = "It was sent but came back as " + (d.delivery.event || "a failure") +
             (d.delivery.reason ? " — " + d.delivery.reason : "") +
             ". Check the address and try again.";  cls = "notice--late";
    } else {
      line = "Handed to Brevo for " + d.to.join(", ") + ". Delivery hadn't been confirmed " +
             "within a few seconds, which is normal — check Brevo if it doesn't arrive.";  cls = "notice--due";
    }
    $("welcomeBox").innerHTML = '<div class="notice ' + cls + '" style="margin:12px 0 0">' +
      esc(line) + (d.message_id ? '<br><span class="muted" style="font-size:.75rem">Brevo id ' +
        esc(d.message_id) + '</span>' : '') + '</div>';
    /* Keep the "last sent" line honest without a full reload. */
    if (S.detail && S.detail.wedding) {
      S.detail.wedding.welcome_sent_at = d.sent_at;
      S.detail.wedding.welcome_sent_to = d.to.join(", ");
    }
  } catch (e) { welcomeBusy(""); showErr(e.message); }
}

function showErr(m){ var e=$("err"); e.textContent=m; e.classList.remove("hide"); window.scrollTo({top:0}); }
function clearErr(){ $("err").classList.add("hide"); }

/* ---------- gate ---------- */
function lock(){
  try { sessionStorage.removeItem(CFG.KEY); } catch(e){}
  S.pw = null; $("app").classList.add("hide"); $("gate").classList.remove("hide");
}

$("gateForm").onsubmit = function(ev){
  ev.preventDefault();
  if ($("pw").value !== CFG.PASSWORD) {
    $("gateErr").textContent = "That password isn't right.";
    $("gateErr").classList.remove("hide");
    return;
  }
  S.pw = $("pw").value;
  try { sessionStorage.setItem(CFG.KEY, S.pw); } catch(e){}

$("nav").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-view]"); if (!b) return;
  S.view = b.dataset.view; S.current = null;
  [].forEach.call($("nav").children, function(x){
    if (x.dataset.view === S.view) x.setAttribute("aria-current","page"); else x.removeAttribute("aria-current");
  });
  clearErr(); render(); window.scrollTo({top:0});
});

async function boot(){ await refreshPending(); render(); }

async function refreshPending(){
  try {
    S.pending = await call("payments.pending");
    var badge = $("recBadge");
    badge.innerHTML = S.pending.length
      ? ' <span class="pill pill--late" style="letter-spacing:.1em">' + S.pending.length + '</span>' : "";
  } catch (e) { /* the badge is a nicety; a failure here shouldn't block the page */ }
}

/* Prepare every table to stack on a phone, rather than each of the thirty-odd
   tables in this file having to carry labels of its own.

   The labels come from the table's own headings, so they cannot drift out of
   step with the columns. A table with no headings — a list of functions, a
   couple of deposits — still stacks, just without them. A label-and-value
   table is left alone: it is two columns wide and already fits. */
function adaptTables(root){
  var el = root || document;
  [].forEach.call(el.querySelectorAll("table"), function(t){
    if (t.getAttribute("data-adapted")) return;
    t.setAttribute("data-adapted", "1");

    var heads = t.querySelectorAll("thead th");

    // "Couple | Smith & Jones" down the left — already narrow, leave it.
    if (!heads.length && t.querySelector("tr > th:first-child")) {
      wrapTable(t);
      return;
    }

    var labels = [].map.call(heads, function(h){ return h.textContent.trim(); });

    [].forEach.call(t.rows, function(tr){
      if (tr.querySelector("th")) return;                       // a heading row
      var spans = [].some.call(tr.cells, function(c){ return c.colSpan > 1; });
      if (spans) return;                                        // "nothing here yet"
      [].forEach.call(tr.cells, function(td, i){
        if (labels.length && !td.hasAttribute("data-label")) {
          td.setAttribute("data-label", labels[i] || "");
        }
        var txt = (td.textContent || "").replace(/\s+/g, " ").trim();
        if (!txt || txt === "\u2014" || txt === "-" || txt === "\u00b7") {
          td.classList.add("is-empty");
        }
      });
    });

    t.classList.add("stack");
  });
}

function wrapTable(t){
  if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains("tw")) return;
  var w = document.createElement("div");
  w.className = "tw";
  t.parentNode.insertBefore(w, t);
  w.appendChild(t);
}

/* innerHTML is set in a couple of dozen places; patching the setter once is
   far safer than finding every one of them. */
(function(){
  var views = null;
  var observer = new MutationObserver(function(){ adaptTables(views); });
  document.addEventListener("DOMContentLoaded", function(){
    views = document.getElementById("views");
    if (!views) return;
    adaptTables(views);
    observer.observe(views, { childList: true, subtree: true });
  });
})();

function render(){
  var v = $("views");
  if (S.current) { v.innerHTML = '<div class="empty"><span class="spin"></span></div>'; loadWedding(S.current); return; }
  switch (S.view) {
    case "overview":    v.innerHTML = '<div class="empty"><span class="spin"></span>' +
                          '<p style="margin-top:14px">Reading the forward book from Guestline…</p></div>';
                        loadForecast(); break;
    case "weddings":    v.innerHTML = '<div class="empty"><span class="spin"></span></div>'; loadList(); break;
    case "outstanding": v.innerHTML = '<div class="empty"><span class="spin"></span>' +
                          '<p style="margin-top:14px">Checking every couple\'s balance…</p></div>';
                        loadOutstanding(); break;
    case "reconcile":   v.innerHTML = viewReconcile(); break;
    case "add":         v.innerHTML = viewAdd(); break;
  }
}

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

async function loadForecast(){

function viewOverview(){
  var f = S.forecast;
  var years = f.years;

    '<span class="label">' + f.totalRegistered + ' wedding' + (f.totalRegistered===1?"":"s") + ' in the app</span></div>' +
    '<p class="muted" style="margin:0 0 20px">' +
    'Everything below counts couples registered in this app, with numbers read live from Guestline. ' +
    'A wedding in the diary but not yet set up here won\'t appear.</p>';

  if (!f.totalRegistered) {
    h += '<div class="card empty">No weddings registered yet.<br><br>' +
      '<button class="btn btn--primary" onclick="goto(\'add\')">Add the first</button></div>';
    return h;
  }

  /* ---- five-year headline ---- */
  var total5 = years.reduce(function(s,y){ return s + y.weddings; }, 0);
  var guests5 = years.reduce(function(s,y){ return s + y.guests; }, 0);
  var value5 = years.reduce(function(s,y){ return s + y.value; }, 0);

    '<div><span class="label">Value</span><div class="v">' + money(value5) + '</div></div>' +
    '<div><span class="label">Avg. guests</span><div class="v">' +
      (total5 ? Math.round(guests5/total5) : 0) + '</div></div>' +

    h += '<div class="notice notice--ok">' + f.beyond + ' further wedding' + (f.beyond===1?" is":"s are") +

  /* ---- year by year, with a simple bar so the shape is readable ---- */
  h += '<div class="card"><h2 style="margin-bottom:14px">By year</h2>' +
    '<table><thead><tr><th>Year</th><th>Weddings</th><th class="money">Guests</th>' +
    '<th class="money">Value</th><th style="width:34%"></th></tr></thead><tbody>';

    h += '<tr><td><strong>' + y.year + '</strong></td>' +

      '<td class="money num">' + (y.guests || "—") + '</td>' +
      '<td class="money num">' + (y.value ? money(y.value) : "—") + '</td>' +
      '<td><div style="background:var(--mist);height:10px">' +
        '<div style="background:var(--sage);height:10px;width:' + pct + '%"></div></div></td></tr>';
  });
  h += '</tbody></table></div>';

  /* ---- month grid: where the gaps are ---- */
  h += '<div class="card"><h2 style="margin-bottom:6px">By month</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    'Weddings per month. Blank months are the ones worth selling into.</p>' +
    '<table><thead><tr><th>Year</th>' +
    MONTHS.map(function(m){ return '<th class="money">' + m + '</th>'; }).join("") +
    '<th class="money">Total</th></tr></thead><tbody>';
  years.forEach(function(y){
    h += '<tr><td><strong>' + y.year + '</strong></td>' +
      y.months.map(function(m){

          (m.weddings ? ' style="background:var(--sage-10);font-weight:600"' : '') + '>' +
          (m.weddings || "·") + '</td>';
      }).join("") +
      '<td class="money num"><strong>' + (y.weddings || "·") + '</strong></td></tr>';

  /* ---- what's next ---- */
  var todayIso = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date());
  var upcoming = f.weddings.filter(function(x){ return x.wedding_date >= todayIso; }).slice(0, 8);
  if (upcoming.length) {

/* ============================ OUTSTANDING PAYMENTS ============================ */
async function loadOutstanding(){
  try { S.outstanding = await call("report.outstanding"); $("views").innerHTML = viewOutstanding(); }
  catch (e) { showErr(e.message); $("views").innerHTML = ""; }
}

function viewOutstanding(){
  var all = S.outstanding || [];
  var errors = all.filter(function(r){ return r.error; });
  var live = all.filter(function(r){ return !r.error; });

  /* Behind schedule first — that's the chase list. Then everyone else who
     still owes, so the full picture is there without two reports. */
  var behind = live.filter(function(r){ return r.behind; })
                   .sort(function(a,b){ return b.shortfall - a.shortfall; });
  var owing = live.filter(function(r){ return !r.behind && r.outstanding > 0.005 && !r.past; })
                  .sort(function(a,b){ return a.daysToGo - b.daysToGo; });
  var pastDue = live.filter(function(r){ return r.past && r.outstanding > 0.005; });
  var clear = live.filter(function(r){ return r.outstanding <= 0.005; });

  var chaseTotal = behind.reduce(function(s,r){ return s + r.shortfall; }, 0);
  var owedTotal = live.reduce(function(s,r){ return s + r.outstanding; }, 0);

  var h = '<div class="split" style="margin-bottom:6px"><h1>Outstanding payments</h1>' +
    '<button class="btn btn--sm" onclick="loadOutstanding()">Refresh</button></div>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Balances read live from Guestline, plus any app payment not yet posted to Rezlynx. ' +
    'The schedule is 25% at nine months, 50% at six, 75% at three, and the full balance a month before.</p>';

  h += '<div class="stat" style="margin-bottom:18px">' +
    '<div><span class="label">To chase now</span><div class="v" style="color:' +
      (chaseTotal > 0 ? "var(--alert)" : "inherit") + '">' + money(chaseTotal) + '</div></div>' +
    '<div><span class="label">Couples behind</span><div class="v">' + behind.length + '</div></div>' +
    '<div><span class="label">Total still owed</span><div class="v">' + money(owedTotal) + '</div></div>' +
    '<div><span class="label">Fully paid</span><div class="v">' + clear.length + '</div></div>' +
  '</div>';

  if (errors.length) {
    h += '<div class="notice notice--late"><strong>' + errors.length + ' wedding' +
      (errors.length===1?"":"s") + ' couldn\'t be read from Guestline</strong> — ' +
      errors.map(function(r){ return esc(r.salutation); }).join(", ") +
      '. Their balance isn\'t included in the totals above.</div>';
  }

  if (pastDue.length) {
    h += '<div class="notice notice--late"><strong>' + pastDue.length + ' past wedding' +
      (pastDue.length===1?"":"s") + ' still showing a balance.</strong> ' +
      'Usually means a final payment was never posted in Rezlynx.</div>';
  }

  h += chaseTable("Behind the payment schedule", behind, true,
    "Nobody is behind. Genuinely worth a moment.");

  if (owing.length) {
    h += chaseTable("On track, balance still to come", owing, false, "");
  }
  if (pastDue.length) {
    h += chaseTable("Past weddings with a balance", pastDue, true, "");
  }

  if (behind.length) {
    h += '<div class="center"><button class="btn" onclick="exportChase()">Download the chase list</button></div>';
  }
  return h;
}

    '<th class="money">Paid</th><th class="money">' +

    h += '<tr><td><strong>' + esc(r.salutation) + '</strong><br>' +
      '<span class="muted" style="font-size:.8125rem">' +
        '<a href="mailto:' + esc(r.primary_email) + '?subject=' +
        encodeURIComponent("Your wedding balance — " + r.salutation) + '&body=' +
        encodeURIComponent(
          "Hello " + r.salutation + ",\n\n" +
          "We hope you're well and that the planning is going smoothly.\n\n" +
          "A quick note about your wedding balance. Of your total of £" + r.total.toFixed(2) +
          ", we've received £" + r.paid.toFixed(2) + ", leaving £" + r.outstanding.toFixed(2) + " to pay.\n\n" +
          (r.shortfall > 0
            ? "At this stage we'd normally have received £" + r.dueNow.toFixed(2) +
              ", so there's £" + r.shortfall.toFixed(2) + " to catch up.\n\n"
            : "") +
          "You can pay any amount at any time in your wedding app:\n" +
          "https://www.blackhorsebeamish.co.uk/wedding-app\n\n" +
          "Your reference is " + r.event_id + " and your password is your wedding date.\n\n" +
          "Any questions at all, just give us a ring on 01207 232 569.\n\n" +
          "Best wishes,\nThe events team\nBlack Horse Beamish"
        ) + '">' + esc(r.primary_email) + '</a>' +
        (r.mobile ? '<br>' + esc(r.mobile) : '') +
        (r.last_login_at ? '' : '<br><span class="pill pill--prov">Never logged in</span>') +
      '</span></td>' +
      '<td class="num">' + esc(ukDate(r.wedding_date)) + '<br>' +
      '<span class="muted" style="font-size:.8125rem">' +
        (r.daysToGo >= 0 ? r.daysToGo + " days to go" : Math.abs(r.daysToGo) + " days ago") + '</span></td>' +
      '<td>' + esc(r.stage) + '<br><span class="muted" style="font-size:.8125rem">' +
        money(r.dueNow) + ' due by now</span></td>' +
      '<td class="money num">' + money(r.paid) + '<br>' +
        '<span class="muted" style="font-size:.8125rem">of ' + money(r.total) + '</span>' +
        (r.unreconciled ? '<br><span class="pill pill--late">' + money(r.unreconciled) + ' unposted</span>' : '') +

        money(showShortfall ? r.shortfall : r.outstanding) + '</strong></td>' +
      '<td class="money"><button class="btn btn--sm" onclick="open_(\'' + r.id + '\')">Open</button></td></tr>';
  });
  return h + '</tbody></table></div>';
}

function exportChase(){
  var rows = (S.outstanding||[]).filter(function(r){ return r.behind; })
    .sort(function(a,b){ return b.shortfall - a.shortfall; })
    .map(function(r){
      return [r.salutation, r.event_id, r.wedding_date, r.daysToGo, r.stage,
              r.total, r.paid, r.dueNow, r.shortfall, r.outstanding,
              r.primary_email, r.mobile || "", r.last_login_at ? "Yes" : "No"];
    });
  csvRaw("payments-to-chase",
    ["Couple","Reference","Wedding date","Days to go","Stage","Total","Paid",
     "Due by now","Behind by","Outstanding","Email","Mobile","Has logged in"], rows);
}

function daysToGo(iso){
  var t = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()).split("-");
  var p = String(iso||"").slice(0,10).split("-");
  return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2]) - Date.UTC(+t[0],+t[1]-1,+t[2]))/86400000);
}

/* A CSV download that doesn't depend on a wedding being open. */
function csvRaw(name, head, rows){
  var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var body = [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n");
  var blob = new Blob(["﻿"+body], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-" + new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()) + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

          (p.status === "succeeded" && !p.reconciled
            ? '<button class="btn btn--sm" onclick="reconcile(\'' + p.id + '\')">Mark posted</button>' : '') +
          (p.reconciled ? '<button class="btn btn--sm" onclick="unreconcile(\'' + p.id + '\')">Undo</button>' : '') +
          (p.method === "sumup" && p.status === "succeeded"
            ? '<br><button class="btn btn--sm" style="border:0;padding:4px 0" onclick="resend(\'' + p.id + '\')">Resend emails</button>' : '') +
        '</td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '</div>';

  /* ---- Guestline deposits, for matching against ---- */
  if (d.bill && d.bill.deposits && d.bill.deposits.length) {
    h += '<div class="card"><h2 style="margin-bottom:6px">Deposits in Guestline</h2>' +
      '<p class="muted" style="margin:0 0 12px;font-size:.875rem">What Rezlynx is reporting. Match app payments against these.</p><table>';
    d.bill.deposits.forEach(function(dep){
      h += '<tr><td>' + esc(dep.description) + '</td>' +
        '<td class="num muted">' + esc(ukDate(dep.depositDate)) + '</td>' +
        '<td class="money num">' + money(-dep.amount) + '</td></tr>';
    });
    h += '</table></div>';
  }

  /* ---- couple details ---- */
  h += '<div class="card"><h2 style="margin-bottom:14px">Couple details</h2>' +
    '<div class="row"><div class="field"><span class="label">Partner 1</span>' +
      '<input id="e_p1" value="' + esc(w.partner1_name) + '"></div>' +
      '<div class="field"><span class="label">Partner 2</span>' +
      '<input id="e_p2" value="' + esc(w.partner2_name) + '"></div></div>' +
    '<div class="field"><span class="label">How to address them</span>' +
      '<input id="e_sal" value="' + esc(w.salutation) + '"></div>' +
    '<div class="row"><div class="field"><span class="label">Primary email (receipts go here)</span>' +
      '<input id="e_em1" value="' + esc(w.primary_email) + '"></div>' +
      '<div class="field"><span class="label">Second email</span>' +
      '<input id="e_em2" value="' + esc(w.secondary_email||"") + '"></div></div>' +
    '<div class="row"><div class="field"><span class="label">Mobile</span>' +
      '<input id="e_mob" value="' + esc(w.mobile||"") + '"></div>' +
      '<div class="field"><span class="label">Status</span><select id="e_status">' +
        ['active','draft','completed','cancelled'].map(function(s){
          return '<option value="'+s+'"'+(w.status===s?' selected':'')+'>'+s+'</option>'; }).join("") +
      '</select></div></div>' +
    '<div class="row">' +
      roomField("e_ceremony", "Ceremony room (on day invitations)", w.ceremony_room) +
      roomField("e_evening", "Evening reception room (on evening invitations)", w.evening_room) +
    '</div>' +
    '<p class="muted" style="font-size:.8125rem;margin:-8px 0 16px">' +
      'These name the room a guest is told to arrive at. Rezlynx calls most rooms ' +
      '&quot;Function&quot;, so set them here \u2014 left blank, the invitation gives the ' +
      'time and leaves the room out rather than guessing.</p>' +
    '<div class="field"><span class="label">What\'s included (shown to the couple)</span>' +
      '<textarea id="e_inc">' + esc(w.whats_included||"") + '</textarea></div>' +
    '<div class="field"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">' +
      '<input type="checkbox" id="e_menu" style="width:17px;height:17px" ' + (w.allow_menu_choices ? "checked" : "") + '>' +
      '<span>Let guests choose their meal when they RSVP</span></label>' +
      '<p class="muted" style="font-size:.8125rem;margin:5px 0 0">' +
      'Off, and guests are asked for dietary requirements and allergies only. ' +
      'On, they pick from the menu below, so put the dishes in first.</p></div>' +
    '<div class="field"><label style="display:flex;gap:8px;align-items:center;cursor:pointer">' +
      '<input type="checkbox" id="e_sheet" style="width:17px;height:17px" ' + (w.show_function_sheet ? "checked" : "") + '>' +
      '<span>Show the function sheet to the couple</span></label>' +
      '<p class="muted" style="font-size:.8125rem;margin:5px 0 0">' +
      'The Guestline notes below, shown under Your Details — the same running order they get on paper. ' +
      'Untick if this wedding\'s notes aren\'t ready to share.</p></div>' +
    '<div class="field"><span class="label">Internal notes (never shown to the couple)</span>' +
      '<textarea id="e_int">' + esc(w.internal_notes||"") + '</textarea></div>' +
    '<button class="btn btn--primary" onclick="saveWedding()">Save details</button>' +
  '</div>';

  /* ---- the function sheet as Guestline holds it ---- */
  if (d.event && d.event.notes) {
    h += '<div class="card"><h2 style="margin-bottom:6px">Function sheet, from Guestline</h2>' +
      '<p class="muted" style="margin:0 0 12px;font-size:.875rem">' +
      'Read-only here — edit it in Rezlynx. ' + (w.show_function_sheet
        ? 'The couple can see this.' : '<strong>Currently hidden from the couple.</strong>') + '</p>' +
      '<div class="sheet">' + esc(d.event.notes) + '</div></div>';
  }

  /* ---- the menu guests choose from ---- */
  h += '<div class="card"><div class="split" style="margin-bottom:6px"><h2>Menu choices</h2>' +
    '<span class="label num">' + (S.detail.menu || []).length + ' dishes</span></div>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    'What guests pick from when they reply. The couple can see this but cannot change it. ' +
    (w.allow_menu_choices ? '' :
      '<strong>Choices are switched off</strong>, so guests are asked about dietary needs only.') +
    '</p>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
      '<button class="btn btn--sm" onclick="addDish()">Add a dish</button>' +
      '<button class="btn btn--sm" onclick="importMenu()">Import from the portal</button>' +
    '</div>';

  if (!(S.detail.menu || []).length) {
    h += '<p class="muted" style="margin:0">Nothing yet. ' +
      '<strong>Import from the portal</strong> pulls the starters, mains and desserts ' +
      'already booked against this event in Rezlynx.</p>';
  } else {
    COURSES.forEach(function(c){
      var opts = S.detail.menu.filter(function(m){ return m.course === c[0]; });
      if (!opts.length) return;
      h += '<h3 style="margin:14px 0 6px;font-size:.8125rem;letter-spacing:.14em">' + esc(c[1]) + '</h3><table>';
      opts.forEach(function(o){
        h += '<tr><td>' + esc(o.label) +
          (o.is_child ? ' <span class="pill pill--prov">Children</span>' : '') +
          (o.description ? '<br><span class="muted" style="font-size:.8125rem">' + esc(o.description) + '</span>' : '') +
          '</td><td class="money">' +
          '<button class="btn btn--sm" onclick="addDish(&quot;' + o.id + '&quot;)">Edit</button> ' +
          '<button class="btn btn--sm" style="border:0" onclick="deleteDish(&quot;' + o.id + '&quot;)">Remove</button>' +
          '</td></tr>';
      });
      h += '</table>';
    });
  }
  h += '</div>';

  /* ---- what the couple has built ---- */
  h += '<div class="card"><div class="split" style="margin-bottom:12px"><h2>Their guest list</h2>' +
    '<span class="label">' + d.guests.length + ' on the list</span></div>';
  if (!d.guests.length) {
    h += '<p class="muted">They haven\'t started their guest list yet.</p>';
  } else {
    var att = d.guests.filter(function(g){ return g.rsvp === "attending"; });
    var diet = d.guests.filter(function(g){ return g.dietary; });
    var acc = d.guests.filter(function(g){ return g.accessibility; });
    h += '<div class="stat" style="margin-bottom:14px">' +
      '<div><span class="label">Attending</span><div class="v">' + att.length + '</div></div>' +
      '<div><span class="label">Adults</span><div class="v">' + att.filter(function(g){return g.age_group==="adult";}).length + '</div></div>' +
      '<div><span class="label">Children</span><div class="v">' + att.filter(function(g){return g.age_group==="child";}).length + '</div></div>' +
      '<div><span class="label">Evening</span><div class="v">' + att.filter(function(g){return g.invited_to!=="day";}).length + '</div></div>' +
    '</div>';
    if (diet.length) {
      h += '<h3 style="margin:14px 0 6px;font-size:.8125rem;letter-spacing:.14em">Dietary requirements</h3><table>';
      diet.forEach(function(g){ h += '<tr><td>' + esc(g.first_name+" "+(g.surname||"")) + '</td><td>' + esc(g.dietary) + '</td></tr>'; });
      h += '</table>';
    }
    if (acc.length) {
      h += '<h3 style="margin:14px 0 6px;font-size:.8125rem;letter-spacing:.14em">Accessibility needs</h3><table>';
      acc.forEach(function(g){ h += '<tr><td>' + esc(g.first_name+" "+(g.surname||"")) + '</td><td>' + esc(g.accessibility) + '</td></tr>'; });
      h += '</table>';
    }
    h += '<p style="margin:14px 0 0"><button class="btn btn--sm" onclick="exportGuests()">Download full list</button></p>';
  }
  h += '</div>';

  h += '<div class="card"><div class="split" style="margin-bottom:12px"><h2>Their suppliers</h2>' +
    '<span class="label">' + d.suppliers.length + '</span></div>';
  if (!d.suppliers.length) {
    h += '<p class="muted">No suppliers added yet.</p>';
  } else {
    h += '<table><thead><tr><th>Arrives</th><th>Supplier</th><th>Contact</th></tr></thead><tbody>';
    d.suppliers.forEach(function(s){
      h += '<tr><td class="num">' + esc(s.arrival_time ? String(s.arrival_time).slice(0,5) : "—") + '</td>' +
        '<td><strong>' + esc(s.name) + '</strong><br><span class="muted" style="font-size:.8125rem">' + esc(s.category) + '</span></td>' +
        '<td>' + esc(s.contact_name||"") + (s.phone ? '<br>' + esc(s.phone) : '') + '</td></tr>';
    });
    h += '</tbody></table>' +
      '<p style="margin:14px 0 0"><button class="btn btn--sm" onclick="exportSuppliers()">Download day schedule</button></p>';
  }
  h += '</div>';

  h += '<div class="card"><h3 style="margin-bottom:8px;color:var(--alert)">Danger zone</h3>' +
    '<p class="muted" style="margin:0 0 12px;font-size:.875rem">' +
    'Deleting removes the account and everything the couple has built — guest list, suppliers, budget, payment records. ' +
    'This is what satisfies a "delete my data" request, and it cannot be undone.</p>' +
    '<button class="btn btn--danger btn--sm" onclick="deleteWedding()">Delete this wedding</button></div>';

  return h;
}

function toggleManual(){ $("manual").classList.toggle("hide"); }

/* ---------- menu ---------- */
var COURSES = [["starter","To start"],["main","Main course"],["dessert","Pudding"]];

function addDish(id){
  var o = (S.detail.menu || []).filter(function(m){ return m.id === id; })[0] || {};
  closeDish();
  var box = $("views");
  var panel = document.createElement("div");
  panel.className = "card";
  panel.id = "dishForm";
  panel.style.borderColor = "var(--sage)";
  panel.innerHTML = '<div class="split" style="margin-bottom:12px"><h2>' +
      (id ? "Edit dish" : "Add a dish") + '</h2>' +
      '<button class="btn btn--sm" onclick="closeDish()">Cancel</button></div>' +
    '<div class="row"><div class="field"><span class="label">Course</span><select id="d_course">' +
      COURSES.map(function(c){
        return '<option value="' + c[0] + '"' + (o.course === c[0] ? " selected" : "") + '>' + c[1] + '</option>';
      }).join("") + '</select></div>' +
      '<div class="field"><span class="label">Menu</span><select id="d_child">' +
      '<option value="no"' + (o.is_child ? "" : " selected") + '>Main menu</option>' +
      '<option value="yes"' + (o.is_child ? " selected" : "") + '>Children&rsquo;s menu</option>' +
      '</select></div></div>' +
    '<div class="field"><span class="label">Dish</span>' +
      '<input id="d_label" value="' + esc(o.label || "") + '" placeholder="Featherblade of beef"></div>' +
    '<div class="field"><span class="label">Description (optional)</span>' +
      '<textarea id="d_desc">' + esc(o.description || "") + '</textarea></div>' +
    '<button class="btn btn--primary" onclick="saveDish(&quot;' + (id || "") + '&quot;)">Save</button>';
  box.insertBefore(panel, box.firstChild);
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeDish(){ var e = $("dishForm"); if (e) e.remove(); }

async function saveDish(id){
  var label = $("d_label").value.trim();
  if (!label) { showErr("Give the dish a name."); return; }
  try {
    await call("menu.save", {
      id: id || undefined, wedding_id: S.current,
      course: $("d_course").value, label: label,
      description: $("d_desc").value.trim(),
      is_child: $("d_child").value === "yes",
      sort_order: (S.detail.menu || []).length
    });
    closeDish(); await loadWedding(S.current); clearErr();
  } catch (e) { showErr(e.message); }
}

async function deleteDish(id){
  if (!confirm("Remove this dish? Guests who already chose it keep their choice.")) return;
  try { await call("menu.delete", { id: id, wedding_id: S.current }); await loadWedding(S.current); }
  catch (e) { showErr(e.message); }
}

/* Pulls the starters, mains and desserts already booked against this event
   in the portal, so the menu isn't typed out a second time. */
async function importMenu(){
  if (!confirm("Import the dishes booked against this event in the portal?")) return;
  try {
    var r = await call("menu.importFromPortal", { id: S.current });
    await loadWedding(S.current);
    if (r.message) { showErr(r.message); return; }
    clearErr();
    alert("Imported " + r.imported + " dish" + (r.imported === 1 ? "" : "es") +
      (r.skipped ? "\n" + r.skipped + " were already on the menu." : "") +
      "\n\nWorth reading through: the portal lists section headings as items too, " +
      "so delete anything that isn't actually a dish.");
  } catch (e) { showErr(e.message); }
}

/* The two rooms guests get sent to. A list, because there are two of them
   and typing "George Ridley Sweet" onto ninety invitations is a bad day —
   but free text as well, because the venue will add a space eventually. */
var INVITE_ROOMS = ["Orchard Marquee", "George Ridley Suite"];

function roomField(id, label, value){
  var v = value || "";
  var known = INVITE_ROOMS.indexOf(v) > -1;
  return '<div class="field"><span class="label">' + esc(label) + '</span>' +
    '<input id="' + id + '" list="' + id + '_list" value="' + esc(v) + '" ' +
      'placeholder="Not set">' +
    '<datalist id="' + id + '_list">' +
      INVITE_ROOMS.map(function(r){ return '<option value="' + esc(r) + '">'; }).join("") +
    '</datalist></div>';
}

async function saveWedding(){
  try {
    await call("update", {
      id: S.detail.wedding.id,
      partner1_name: $("e_p1").value.trim(),
      partner2_name: $("e_p2").value.trim(),
      salutation: $("e_sal").value.trim(),
      primary_email: $("e_em1").value.trim(),
      secondary_email: $("e_em2").value.trim(),
      mobile: $("e_mob").value.trim(),
      status: $("e_status").value,
      whats_included: $("e_inc").value.trim(),
      show_function_sheet: $("e_sheet").checked,
      allow_menu_choices: $("e_menu").checked,
      ceremony_room: $("e_ceremony").value.trim(),
      evening_room: $("e_evening").value.trim(),
      internal_notes: $("e_int").value.trim()
    });
    clearErr(); await loadWedding(S.current);
  } catch (e) { showErr(e.message); }
}

async function resync(){
  try { await call("resync", { id:S.current }); await loadWedding(S.current); clearErr(); }
  catch (e) { showErr(e.message); }
}

async function reconcile(id){
  var by = prompt("Posted to Rezlynx by whom?", "");
  if (by === null) return;
  try { await call("payments.reconcile", { id:id, by: by || "events team" });
        await refreshPending(); await loadWedding(S.current); clearErr(); }
  catch (e) { showErr(e.message); }
}

async function unreconcile(id){
  if (!confirm("Mark this as NOT posted? The app will start counting it against their balance again.")) return;
  try { await call("payments.unreconcile", { id:id }); await refreshPending(); await loadWedding(S.current); }
  catch (e) { showErr(e.message); }
}

async function resend(id){
  try { var r = await call("payments.resendEmails", { id:id });
        alert("Receipt: " + (r.receipt||"—") + "\nAlert: " + (r.alert||"—")); }
  catch (e) { showErr(e.message); }
}

async function addManual(){
  var amt = String($("mAmt").value).replace(/[^0-9.]/g,"");
  if (!amt || Number(amt) <= 0) { showErr("Enter an amount."); return; }
  try {
    await call("payments.manual", {
      wedding_id: S.current, amount: Number(amt),
      method: $("mMethod").value, reference: $("mRef").value.trim()
    });
    await loadWedding(S.current); clearErr();
  } catch (e) { showErr(e.message); }
}

async function deleteWedding(){
  var w = S.detail.wedding;
  if (prompt('Type the reference "' + w.event_id + '" to confirm deletion.') !== w.event_id) return;
  try { await call("delete", { id:w.id }); S.current = null; await refreshPending(); goto("weddings"); }
  catch (e) { showErr(e.message); }
}

/* ============================ RECONCILE QUEUE ============================ */
function viewReconcile(){
  var h = '<h1 style="margin-bottom:6px">Payments to post</h1>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Card payments taken in the app. They don\'t reach Guestline on their own — post each one in Rezlynx, ' +
    'then mark it here so the app stops counting it separately.</p>';

  if (!S.pending.length) {
    h += '<div class="card empty">Nothing waiting. Everything\'s posted.</div>';
    return h;
  }

  var total = S.pending.reduce(function(s,p){ return s + Number(p.amount); }, 0);
  h += '<div class="notice notice--due"><strong>' + money(total) + '</strong> across ' +
    S.pending.length + ' payment' + (S.pending.length===1?"":"s") + ' waiting to be posted.</div>';

  h += '<div class="card card--flush"><table><thead><tr>' +
    '<th>Paid</th><th>Couple</th><th>Reference</th><th class="money">Amount</th><th></th>' +
    '</tr></thead><tbody>';
  S.pending.forEach(function(p){
    var w = p.wedding || {};
    h += '<tr><td class="num">' + esc(ukDate(p.paid_at)) + '</td>' +
      '<td><strong>' + esc(w.salutation||"—") + '</strong><br>' +
      '<span class="muted" style="font-size:.8125rem">wedding ' + esc(ukDate(w.wedding_date)) + '</span></td>' +
      '<td class="num" style="font-size:.8125rem"><code>' + esc(w.event_id||"—") + '</code><br>' +
      '<span class="muted">' + esc(p.payment_reference||"") + '</span></td>' +
      '<td class="money num"><strong>' + money(p.amount) + '</strong></td>' +
      '<td class="money"><button class="btn btn--sm" onclick="reconcileFromQueue(\'' + p.id + '\')">Mark posted</button>' +
      '<br><button class="btn btn--sm" style="border:0;padding:4px 0" onclick="open_(\'' + p.wedding_id + '\')">Open wedding</button></td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

async function reconcileFromQueue(id){
  var by = prompt("Posted to Rezlynx by whom?", "");
  if (by === null) return;
  try { await call("payments.reconcile", { id:id, by: by || "events team" });
        await refreshPending(); render(); clearErr(); }
  catch (e) { showErr(e.message); }
}

/* ============================ ADD A WEDDING ============================ */
function viewAdd(){
  var h = '<h1 style="margin-bottom:6px">Add a wedding</h1>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Paste the couple\'s Guestline event portal link. Everything else comes from it.</p>';

  h += '<div class="card"><div class="field"><span class="label">Guestline event link</span>' +
    '<input id="glLink" placeholder="https://event.eu.guestline.app/e/..."></div>' +
    '<button class="btn btn--primary" id="previewBtn" onclick="doPreview()">Look it up</button></div>';

  h += '<div id="previewBox"></div>';
  return h;
}

async function doPreview(){
  var link = $("glLink").value.trim();
  if (!link) return;
  var btn = $("previewBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    S.preview = await call("preview", { link: link });
    clearErr();
    $("previewBox").innerHTML = previewHtml();
  } catch (e) {
    showErr(e.message);
    $("previewBox").innerHTML = "";
  } finally {
    btn.disabled = false; btn.textContent = "Look it up";
  }
}

function previewHtml(){
  var p = S.preview, ev = p.event;

  if (p.alreadyExists) {
    return '<div class="notice notice--late">This event is already set up as <strong>' +
      esc(p.alreadyExists.salutation) + '</strong> (' + esc(p.alreadyExists.event_id) + '). ' +
      '<button class="btn btn--sm" onclick="open_(\'' + p.alreadyExists.id + '\')">Open it</button></div>';
  }

  /* The event name has no consistent format across events, so it is shown
     for the coordinator to read rather than parsed into two names. */
  var h = '<div class="card"><h2 style="margin-bottom:12px">Is this the right wedding?</h2>' +
    '<table>' +
    '<tr><th>Event</th><td><strong>' + esc(ev.name) + '</strong></td></tr>' +
    '<tr><th>Date</th><td>' + esc(ukDate(ev.startDate)) + '</td></tr>' +
    '<tr><th>Reference</th><td><code>' + esc(ev.eventId) + '</code></td></tr>' +
    '<tr><th>Status</th><td>' + esc(ev.eventStatusDescription) + '</td></tr>' +
    '<tr><th>Guests</th><td class="num">' + esc(guestSplitText(p.functions, ev.guests)) + '</td></tr>' +
    '<tr><th>Total</th><td class="num">' + money(ev.totalCost) + '</td></tr>' +
    '<tr><th>Outstanding</th><td class="num">' + money(p.balance.outstanding) + '</td></tr>' +
    '<tr><th>Coordinator</th><td>' + esc(ev.coordinatorName||"—") + '</td></tr>' +
    '<tr><th>Booking refs</th><td class="num">' + p.bookingRefs.map(esc).join(", ") + '</td></tr>' +
    '</table></div>';

  h += '<div class="notice notice--ok">Their login will be reference <code>' + esc(ev.eventId) +
    '</code> with password <code>' + esc(ddmmyyyy(ev.startDate)) + '</code>.</div>';

  var firstNames = sug
    ? sug.partner1.split(" ")[0] + " & " + sug.partner2.split(" ")[0]
    : "";

  h += '<div class="card"><h2 style="margin-bottom:6px">Who are they?</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    (sug
      ? 'We have read these off the event name &mdash; <strong>please check them</strong>, ' +
        'then add an email address. The event link carries no contact details at all, so that ' +
        'part has to come from you.'
      : 'The event name could not be read as two names, so pop them in here. This is how the ' +
        'app greets them and where their receipts go.') +
    '</p>' +
    '<div class="row"><div class="field"><span class="label">Partner 1</span>' +
      '<input id="n_p1" value="' + esc(sug ? sug.partner1 : "") + '"></div>' +
    '<div class="field"><span class="label">Partner 2</span>' +
      '<input id="n_p2" value="' + esc(sug ? sug.partner2 : "") + '"></div></div>' +
    '<div class="field"><span class="label">How to address them</span>' +
      '<input id="n_sal" value="' + esc(firstNames) + '" ' +
      'placeholder="Leave blank and we\'ll use their first names"></div>' +
    '<div class="row"><div class="field"><span class="label">Primary email *</span><input id="n_em1" type="email"></div>' +
    '<div class="field"><span class="label">Second email</span><input id="n_em2" type="email"></div></div>' +
    '<div class="field"><span class="label">Mobile</span><input id="n_mob"></div>' +
    '<button class="btn btn--primary" id="createBtn" onclick="doCreate()">Create their account</button></div>';

  return h;
}

async function doCreate(){
  var btn = $("createBtn");
  var p1 = $("n_p1").value.trim(), p2 = $("n_p2").value.trim(), em = $("n_em1").value.trim();
  if (!p1 || !p2 || !em) { showErr("Both names and a primary email are needed — the receipts have to go somewhere."); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    var res = await call("create", {
      link: $("glLink").value.trim(),
      partner1_name: p1, partner2_name: p2,
      salutation: $("n_sal").value.trim(),
      primary_email: em,
      secondary_email: $("n_em2").value.trim(),
      mobile: $("n_mob").value.trim()
    });
    clearErr();
    S.preview = null;
    open_(res.wedding.id);
  } catch (e) {
    showErr(e.message);
    btn.disabled = false; btn.textContent = "Create their account";
  }
}

/* ---------- exports ---------- */
function csv(name, head, rows){
  var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var body = [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n");
  var blob = new Blob(["﻿"+body], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-" + S.detail.wedding.event_id + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function exportGuests(){
  csv("guest-list",
    ["First name","Surname","Household","Email","Address","Invited to","Age group","RSVP","Dietary","Accessibility"],
    S.detail.guests.map(function(g){
      return [g.first_name,g.surname,g.household,g.email,g.address,g.invited_to,g.age_group,g.rsvp,g.dietary,g.accessibility];
    }));
}

function exportSuppliers(){
  csv("supplier-schedule", ["Arrives","Supplier","Category","Contact","Phone","Email","Notes"],
    S.detail.suppliers.slice().sort(function(a,b){
      return String(a.arrival_time||"99").localeCompare(String(b.arrival_time||"99"));
    }).map(function(s){
      return [s.arrival_time?String(s.arrival_time).slice(0,5):"", s.name, s.category, s.contact_name, s.phone, s.email, s.notes];
    }));
}

  try { saved = sessionStorage.getItem(CFG.KEY); } catch(e){}
  if (saved === CFG.PASSWORD) {
    S.pw = saved;
    $("gate").classList.add("hide"); $("app").classList.remove("hide");
    boot();
  }
})();
</script>
