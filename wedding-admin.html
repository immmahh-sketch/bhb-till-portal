<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<!-- Saved to a phone's home screen this runs full screen, like the couple's
     app. Its own manifest and name, so the two do not sit on a home screen
     looking identical. -->
<link rel="manifest" href="/wedding/admin.webmanifest">
<meta name="theme-color" content="#4E5F4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wedding Admin">
<link rel="apple-touch-icon" href="/wedding/icons/icon-180.png">
<link rel="icon" href="/wedding/icons/favicon-32.png" sizes="32x32">
<title>Wedding Admin — Black Horse Beamish</title>

<!--
  Black Horse Beamish — Wedding App, back-office portal.

  Deployed to bhb-till-portal/wedding-admin.html -> GitHub Pages at
  app.blackhorsebeamish.co.uk/wedding-admin.html, and iframed by the
  password-protected Squarespace page at
  blackhorsebeamish.co.uk/wedding-app-config.
  Same arrangement as /till-reports -> index.html.

  Staff only. Couples never see this page — they go to
  blackhorsebeamish.co.uk/wedding-app and log in with their event reference
  and wedding date.

  Everything goes through the wedding-admin edge function, which holds the
  service role. The password below is checked here for the UI and again
  server-side on every call, so a reader of this source still can't do
  anything without it.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --sage:#4E5F4F; --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff;
  --sage-70:#7B887C; --sage-10:#EDEFED;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --display:orpheus-pro,"Cormorant Garamond",Georgia,serif;
  --body:Raleway,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bone);color:var(--sage);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.06em;text-transform:uppercase;margin:0}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1rem}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hide{display:none!important}
.label{font-size:.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--sage-70)}
.center{text-align:center}

header{background:var(--sage);color:var(--bone);padding:16px 0;
  padding-top:max(env(safe-area-inset-top,0px), 16px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.0625rem;letter-spacing:.14em;text-transform:uppercase}
header .hdr{display:flex;align-items:center;gap:12px}
.burger{display:none;background:none;border:0;padding:8px 6px;margin-left:-6px;cursor:pointer;
  flex-direction:column;justify-content:center;gap:5px;flex:0 0 auto}
.burger span{display:block;width:21px;height:2px;background:var(--celadon);
  transition:transform .18s,opacity .18s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.hdr .where{display:none;font-family:var(--display);font-size:1rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bone);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto}
.hdr .brand{flex:1 1 auto}

nav{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--celadon);
  padding:9px 14px;cursor:pointer;font:500 .6875rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase}
nav button[aria-current="page"]{color:var(--bone);border-bottom-color:var(--celadon)}
main{padding:26px 0 70px;padding-bottom:max(env(safe-area-inset-bottom,0px), 70px)}

.btn{display:inline-block;background:transparent;color:var(--sage);border:1px solid currentColor;
  border-radius:0;padding:11px 22px;font:500 .75rem/1 var(--body);letter-spacing:.17em;
  text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .16s,color .16s}
.btn:hover{background:var(--sage);color:var(--bone)}
.btn--primary{background:var(--sage);color:var(--bone)}
.btn--sm{padding:7px 12px;font-size:.6875rem}
.btn--danger{color:var(--alert)}
.btn--danger:hover{background:var(--alert);color:var(--bone)}
.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{width:100%;background:var(--bone);color:var(--sage);border:1px solid var(--mist);
  border-radius:0;padding:10px 12px;font-family:var(--body);font-size:.9375rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sage)}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:13px}
.field .label{display:block;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.row,.row3{grid-template-columns:1fr}}

.card{background:var(--white);border:1px solid var(--mist);padding:20px;margin-bottom:16px}
.card--flush{padding:0}
table{width:100%;border-collapse:collapse}
th{font-size:.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70);
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--mist)}
td{padding:12px 14px;border-bottom:1px solid var(--mist);vertical-align:top}
td.money,th.money{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sage-10)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:.6875rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.pill--ok{background:var(--sage-10);color:var(--sage)}
.pill--due{background:var(--attention-bg);color:var(--attention)}
.pill--late{background:var(--alert-bg);color:var(--alert)}
.pill--prov{background:var(--mist);color:var(--sage-70)}

.notice{padding:13px 16px;font-size:.9375rem;border:1px solid;margin-bottom:16px}
.notice--due{background:var(--attention-bg);border-color:var(--attention);color:#7a5f36}
.notice--late{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.notice--ok{background:var(--sage-10);border-color:var(--celadon)}
.err{background:var(--alert-bg);border:1px solid var(--alert);color:var(--alert);padding:11px 14px;
  font-size:.875rem;margin-bottom:14px}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{padding:34px 20px;text-align:center;color:var(--sage-70)}
.sheet{white-space:pre-wrap;font-size:.875rem;line-height:1.7;background:var(--bone);
  border:1px solid var(--mist);padding:14px;max-height:340px;overflow:auto}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--mist);border:1px solid var(--mist)}
.stat div{background:var(--white);padding:14px 12px;text-align:center}
.stat .v{font-size:1.1875rem;font-variant-numeric:tabular-nums;margin-top:3px}
@media(max-width:700px){.stat{grid-template-columns:repeat(2,1fr)}}

/* ---- on a phone ----
   The back end is a desk tool that people now open on the floor, mid-wedding,
   to check a balance or a guest number. Nothing here is a phone-first
   redesign; it is making the desk tool legible one-handed. */
@media(max-width:760px){
  body{font-size:15px}
  .wrap{padding:0 14px}
  h1{font-size:1.375rem}
  h2{font-size:1.125rem}
  main{padding-top:18px}

  /* The tabs become a dropdown. Anchored under the header rather than
     floating, so it cannot end up somewhere off the top of the view. */
  header{position:relative}
  .burger{display:flex}
  .hdr .where{display:block}
  .hdr .brand{display:none}
  /* header .wrap sets display:flex and is the more specific selector, so a
     bare .navwrap loses to it and the dropdown shrinks to fit its longest
     button. Matching both classes wins. */
  header .wrap.navwrap{display:block;position:absolute;left:0;right:0;top:100%;
    padding:0;z-index:40}

  nav{display:none;flex-direction:column;gap:0;margin:0;background:var(--sage);
    border-top:1px solid rgba(247,247,247,.16);box-shadow:0 10px 24px rgba(38,38,38,.24)}
  nav.open{display:flex}
  nav button{width:100%;text-align:left;border-bottom:1px solid rgba(247,247,247,.1);
    border-left:3px solid transparent;padding:15px 18px;letter-spacing:.16em}
  nav button:last-child{border-bottom:0}
  nav button[aria-current="page"]{border-bottom-color:rgba(247,247,247,.1);
    border-left-color:var(--celadon);color:var(--bone)}

  /* Tapping anywhere else closes it. */
  .navscrim{position:fixed;inset:0;z-index:30}

  header .wrap{gap:10px}

  .card{padding:14px}
  .stat div{padding:11px 8px}
  .stat .v{font-size:1.0625rem}

  /* A wide table is turned on its side rather than made to scroll. Reading
     a table by dragging it sideways means the row you are reading loses the
     name it belongs to — on the forward book the couple went off the left
     edge, which is the one column that matters. Each row becomes a small
     block instead, every value labelled. */
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:auto}
  table.stack thead{display:none}
  table.stack tr{padding:11px 0;border-bottom:1px solid var(--mist)}
  table.stack tr:last-child{border-bottom:0}
  table.stack tbody tr:hover{background:transparent}
  table.stack td{border:0;padding:3px 0;text-align:left}
  table.stack td.money,table.stack td.num{text-align:left}
  table.stack td[data-label]:not([data-label=""]):before{
    content:attr(data-label);display:inline-block;min-width:104px;
    font-size:.625rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--sage-70);vertical-align:baseline}
  /* A blank cell says nothing worth a line of its own on a phone. */
  table.stack td.is-empty{display:none}
  .card--flush table.stack tr{padding:11px 14px}

  th,td{padding:9px 10px}

  .btn{padding:10px 16px}
  .btn--sm{padding:7px 10px}
  .split{align-items:flex-start}
  .sheet{max-height:240px}
  .login{margin:36px auto}
}
@media(max-width:420px){
  .stat{grid-template-columns:1fr 1fr}
  .btn{letter-spacing:.12em}
}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--mist);border-top-color:var(--sage);
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
code{font-family:ui-monospace,"SF Mono",monospace;font-size:.875em;background:var(--sage-10);padding:1px 5px}
.login{max-width:360px;margin:70px auto;padding:0 20px}

/* ---- app usage ---- */
/* ---- bulk add ---- */
.bkcard{border-left:3px solid var(--mist)}
.bkcard--done{border-left-color:var(--sage);opacity:.75}
.bkcard--failed{border-left-color:var(--alert)}
.bkcard textarea,.bkcard input{font-size:.9375rem}
/* Stays in reach at the foot of a long column of cards. */
.bkbar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  background:var(--bone);border-top:1px solid var(--mist);padding:14px 0;margin-top:8px}
details summary::-webkit-details-marker{color:var(--sage-70)}

/* ---- search ---- */
.searchbox{position:relative;margin:0 0 16px}
.searchbox input{width:100%;padding:13px 40px 13px 15px;border:1px solid var(--mist);
  background:var(--white);color:var(--sage);font:400 1rem/1.3 var(--body);
  letter-spacing:.02em;border-radius:0;-webkit-appearance:none}
.searchbox input:focus{outline:none;border-color:var(--sage)}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchclear{position:absolute;right:1px;top:1px;bottom:1px;width:38px;border:0;
  background:transparent;color:var(--sage-70);font-size:1.25rem;line-height:1;cursor:pointer}
.searchclear:hover{color:var(--sage)}

.ufilters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.ufilter{flex:1 1 130px;text-align:left;padding:12px 14px;background:var(--white);
  border:1px solid var(--mist);cursor:pointer;color:var(--sage)}
.ufilter .un{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.ufilter .ul{display:block;font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sage-70);margin-top:3px}
.ufilter:hover{border-color:var(--celadon)}
.ufilter.on{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.ufilter--warn .un{color:var(--alert)}
.ufilter--ok .un{color:var(--sage)}
.urow{cursor:pointer}
.urow:hover{background:var(--sage-10)}
.udel{border-color:var(--mist);color:var(--sage-70)}
.udel:hover{background:var(--alert);border-color:var(--alert);color:#fff}

/* A table that cannot be made narrower scrolls inside its own card rather
   than taking the page sideways with it. At every width, not just on a
   phone: the by-month grid is fourteen columns and was hanging off the side
   of a tablet, where nothing stacks. */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

/* ---- bonus tracker ---- */
.btmonth{max-width:190px}
.btscope{display:flex;flex-wrap:wrap;gap:0;margin:0 0 16px;border:1px solid var(--mist);
  background:var(--white);width:fit-content;max-width:100%}
.btscope button{background:none;border:0;border-right:1px solid var(--mist);cursor:pointer;
  padding:9px 16px;font:inherit;font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--sage-70)}
.btscope button:last-child{border-right:0}
.btscope button:hover{color:var(--sage);background:var(--sage-10)}
.btscope button.on{background:var(--sage);color:var(--bone)}
@media(max-width:520px){
  .btscope{width:100%}
  .btscope button{flex:1 1 100%;border-right:0;border-bottom:1px solid var(--mist);text-align:left}
  .btscope button:last-child{border-bottom:0}
}
.btlink{border-color:var(--mist);color:var(--sage)}
.btlink:hover{background:var(--sage);border-color:var(--sage);color:var(--bone)}
.btworking{background:var(--sage-10);padding:12px 14px;font-size:.875rem}
.btworking .label{margin-bottom:6px}
.btworking li{margin-bottom:3px}
.bttotal td{border-top:1px solid var(--sage);padding-top:11px}
.bttotal td:first-child{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase}
.btfilters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:0 0 16px}
.btfilters label{display:block}
.btfilters .label{display:block;margin-bottom:4px}
.btfilters select,.btfilters input{min-width:170px}
.btfclear{align-self:flex-end}
@media(max-width:600px){
  .btfilters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btfilters label:first-child{grid-column:1/-1}
  .btfilters select,.btfilters input{min-width:0;width:100%}
  .btfclear{grid-column:1/-1}
}
/* Two date boxes will not fit side by side on a 320px phone: Chrome gives
   each one an intrinsic width for the calendar button that no amount of
   width:100% will go under, and the pair took the whole page sideways. */
@media(max-width:460px){
  .btfilters{grid-template-columns:1fr}
  .btfilters label{grid-column:1/-1}
}
/* A button that reads as a link. Used here and by Bulk add, which asked for
   the class long before anything defined it. */
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--sage);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkish:hover{color:var(--attention)}
/* The four figures at the top are a summary, not a filter, so they lose the
   pointer and the hover the usage tabs have. */
.ufilter--still{cursor:default}
.ufilter--still:hover{border-color:var(--mist)}
.ufilter--still .un{font-size:1.25rem}
.btkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;
  font-size:.75rem;color:var(--sage-70)}
.btkey span{display:inline-flex;align-items:center;gap:6px}
.btkey i{width:11px;height:11px;flex:0 0 11px}
.btbar{display:inline-block;width:110px;height:8px;background:var(--sage-10);
  margin-right:9px;vertical-align:middle}
.btbar i{display:block;height:100%;background:var(--sage)}
.btopen{background:var(--sage-10)}
.btdetail td{background:var(--bone);border-top:0}
/* A table inside an expanded row scrolls in its own box rather than taking
   the page sideways with it. At tablet width nothing stacks, and couple,
   date, stage, amount and a button do not fit across 768px. */
.btpanel{padding:16px 2px 18px;cursor:auto}
/* A table inside an expanded row is laid out to the cell it is in, not to
   its own content. Left to size itself it made the cell wide, the cell made
   the outer table wide, and the page went sideways — which no amount of
   overflow on the panel fixes, because the panel had no width to overflow. */
.btpanel > table{width:100%;table-layout:fixed}
.btpanel > table td{word-break:break-word}
@media(max-width:720px){
  .btbar{width:70px}
  .btdetail td{padding:0 14px 14px!important}
}

/* ---- photo album ---- */
.linkrow{border:1px solid var(--mist);background:var(--bone);padding:10px 12px}
.linkrow code{background:transparent;padding:0;overflow-wrap:anywhere;font-size:.8125rem}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.atile{margin:0;border:1px solid var(--mist);background:var(--bone);position:relative}
.atile img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.atile figcaption{padding:5px 7px;font-size:.6875rem;color:var(--sage-70);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atile--offered{border-color:var(--attention)}
.atile--cleared{border-color:var(--sage);box-shadow:inset 0 0 0 1px var(--sage)}
.amark{position:absolute;top:4px;left:4px;padding:2px 6px;font-size:.5625rem;
  letter-spacing:.1em;text-transform:uppercase;background:var(--attention);color:#fff}
.atile--cleared .amark{background:var(--sage)}
.aacts{display:flex;gap:4px;padding:0 5px 6px}
.aacts .btn{flex:1;padding:5px 4px;font-size:.5625rem;letter-spacing:.08em}
</style>
</head>
<body>

<section id="gate" class="login">
  <div class="center" style="margin-bottom:24px">
    <h1>Wedding Admin</h1>
    <p class="muted">Black Horse Beamish</p>
  </div>
  <form id="gateForm" class="card">
    <div id="gateErr" class="err hide"></div>
    <div class="field"><span class="label">Password</span>
      <input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn btn--primary" style="width:100%" type="submit">Enter</button>
  </form>
</section>

<div id="app" class="hide">
  <!--
    Two navigations, one list of sections.

    On a desk this is a row of tabs, which is what a tool like this should
    look like. On a phone the same buttons become a dropdown under a burger,
    the way the couple's app does it — a nav you have to drag sideways is a
    nav you have to hunt through.
  -->
  <header>
    <div class="wrap hdr">
      <button id="burger" class="burger" aria-label="Menu" aria-expanded="false"
              aria-controls="nav" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </button>
      <span class="brand">Wedding Admin</span>
      <span class="where" id="whereAmI">Overview</span>
      <button class="btn btn--sm" style="color:var(--celadon)" onclick="lock()">Lock</button>
    </div>
    <div class="wrap navwrap">
      <nav id="nav">
        <button data-view="overview" aria-current="page">Overview</button>
        <button data-view="weddings">Weddings</button>
        <button data-view="usage">App usage</button>
        <button data-view="outstanding">Outstanding</button>
        <button data-view="reconcile">Payments to post <span id="recBadge"></span></button>
        <button data-view="add">Add a wedding</button>
        <button data-view="bulk">Bulk add</button>
        <button data-view="bonus">Bonus tracker</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <div id="err" class="err hide"></div>
    <div id="views"></div>
  </main>
</div>

<script>
"use strict";

var CFG = {
  SUPABASE_URL: "https://safcrtrfdzsnftghibot.supabase.co",

  PASSWORD: "BlackH0rse#",
  KEY: "bhb_wedding_admin"
};

var S = { pw:null, view:"overview", list:[], pending:[], current:null, preview:null,
          outstanding:null, forecast:null, listQuery:"" };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n){ return "£" + (Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function ymd(iso){ return String(iso||"").slice(0,10); }
function hhmm(iso){ return String(iso||"").slice(11,16); }
function ukDate(iso){
  var p = ymd(iso).split("-"); if (p.length!==3) return "";
  return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})
    .format(new Date(Date.UTC(+p[0],+p[1]-1,+p[2])));
}
function ddmmyyyy(iso){ var p = ymd(iso).split("-"); return p.length===3 ? p[2]+p[1]+p[0] : ""; }

/* Daytime and evening are different bookings with different numbers, and the
   event-level figure matches neither. Read them off the functions, and never
   add them up — an evening number usually already includes the day guests. */
function guestSplit(functions){
  var isEve = function(f){ return /evening|party|disco/i.test(f.name); };
  var most = function(list){
    return list.reduce(function(m,f){ return Math.max(m, Number(f.numberOfGuests)||0); }, 0);
  };
  var fns = functions || [];
  return { day: most(fns.filter(function(f){ return !isEve(f); })), evening: most(fns.filter(isEve)) };
}

function guestSplitText(functions, fallback){
  var g = guestSplit(functions);
  if (g.day && g.evening) return g.day + " day \u00b7 " + g.evening + " evening";
  if (g.day || g.evening) return String(g.day || g.evening);
  return fallback != null ? String(fallback) : "\u2014";
}
function daysToGo(iso){
  var t = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()).split("-");
  var p = ymd(iso).split("-");
  return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2]) - Date.UTC(+t[0],+t[1]-1,+t[2]))/86400000);
}

async function call(action, payload){
  var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/wedding-admin", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
    body: JSON.stringify({ password:S.pw, action:action, payload:payload||{} })
  });
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) {
    // The body often carries more than a sentence — which wedding clashed,
    // for one — and a caller that can act on that should be able to.
    var err = new Error(data.error || ("Request failed ("+r.status+")"));
    err.data = data; err.status = r.status;
    throw err;
  }
  return data;
}

/* ---------- the couple's invitation email ----------
   Preview and send both come from one builder on the server, so what is
   checked here is exactly what is sent. Sending reports back what Brevo
   did with it rather than just claiming success. */
async function callWelcome(action, extra){
  var body = { password:S.pw, action:action,
               id: (S.detail && S.detail.wedding) ? S.detail.wedding.id : null };
  for (var k in (extra||{})) body[k] = extra[k];
  var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/send-couple-welcome", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
    body: JSON.stringify(body)
  });
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || ("Request failed ("+r.status+")"));
  return data;
}

/* Prepare every table to stack on a phone, rather than each of the thirty-odd
   tables in this file having to carry labels of its own.

   The labels come from the table's own headings, so they cannot drift out of
   step with the columns. A table with no headings — a list of functions, a
   couple of deposits — still stacks, just without them. A label-and-value
   table is left alone: it is two columns wide and already fits. */
function adaptTables(root){
  var el = root || document;
  [].forEach.call(el.querySelectorAll("table"), function(t){
    if (t.getAttribute("data-adapted")) return;
    t.setAttribute("data-adapted", "1");

    var heads = t.querySelectorAll("thead th");

    // "Couple | Smith & Jones" down the left — already narrow, leave it.
    if (!heads.length && t.querySelector("tr > th:first-child")) {
      wrapTable(t);
      return;
    }

    var labels = [].map.call(heads, function(h){ return h.textContent.trim(); });

    [].forEach.call(t.rows, function(tr){
      if (tr.querySelector("th")) return;                       // a heading row
      var spans = [].some.call(tr.cells, function(c){ return c.colSpan > 1; });
      if (spans) return;                                        // "nothing here yet"
      [].forEach.call(tr.cells, function(td, i){
        if (labels.length && !td.hasAttribute("data-label")) {
          td.setAttribute("data-label", labels[i] || "");
        }
        var txt = (td.textContent || "").replace(/\s+/g, " ").trim();
        if (!txt || txt === "\u2014" || txt === "-" || txt === "\u00b7") {
          td.classList.add("is-empty");
        }
      });
    });

    t.classList.add("stack");
  });

  /* Stacking handles most of it, but some tables cannot stack and still mean
     anything — the by-month grid is a year against twelve months, and a
     stacked version of that is a list of numbers. Anything still wider than
     the space it has gets its own scroller, so the page itself never moves
     sideways. Measured rather than guessed, because it depends on the window
     as much as the table. */
  [].forEach.call(el.querySelectorAll("table"), function(t){
    var host = t.parentNode;
    if (!host || (host.classList && host.classList.contains("tw"))) return;
    if (t.scrollWidth > host.clientWidth + 2) wrapTable(t);
  });
}

function wrapTable(t){
  if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains("tw")) return;
  var w = document.createElement("div");
  w.className = "tw";
  t.parentNode.insertBefore(w, t);
  w.appendChild(t);
}

/* innerHTML is set in a couple of dozen places; patching the setter once is
   far safer than finding every one of them. */
(function(){
  var views = null;
  var observer = new MutationObserver(function(){ adaptTables(views); });
  document.addEventListener("DOMContentLoaded", function(){
    views = document.getElementById("views");
    if (!views) return;
    adaptTables(views);
    observer.observe(views, { childList: true, subtree: true });
  });
})();

/* ============================ OVERVIEW / FORWARD BOOK ============================ */
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* Did the screen change while we were waiting?

   The forward book takes a good fifteen seconds to come back from Guestline,
   and anybody sensible clicks something else in the meantime. Without this
   the slow answer lands last and drags them back to a page they had already
   left. Every loader records where it was going and writes nothing if that
   is no longer where we are. */
function stillWanted(view, current){
  return S.view === view && (S.current || null) === (current || null);
}

async function loadForecast(){
  var want = S.view, cur = S.current;
  try {
    S.forecast = await call("report.forecast");
    if (!stillWanted(want, cur)) return;
    $("views").innerHTML = viewOverview(); showAlbumBeat();
  } catch (e) { if (!stillWanted(want, cur)) return; showErr(e.message); $("views").innerHTML = ""; }
}

function viewOverview(){
  var f = S.forecast;
  var years = f.years;
  var peak = Math.max(1, Math.max.apply(null, years.map(function(y){ return y.weddings; })));

  var h = '<div class="split" style="margin-bottom:6px"><h1>Overview</h1>' +
    '<span class="label">' + f.onTheBooks + ' still to come</span></div>' +
    '<p class="muted" style="margin:0 0 20px">' +
    'What is left on the books: weddings still ahead of us, counting couples registered ' +
    'in this app, with numbers read live from Guestline. ' +
    (f.alreadyHeld
      ? f.alreadyHeld + ' already held ' + (f.alreadyHeld === 1 ? 'is' : 'are') +
        ' left out of every figure below. '
      : '') +
    'A wedding in the diary but not yet set up here won\'t appear.</p>';

  if (!f.onTheBooks) {
    h += '<div class="card empty">' +
      (f.alreadyHeld
        ? 'Nothing left on the books. ' + f.alreadyHeld + ' wedding' +
          (f.alreadyHeld === 1 ? ' has' : 's have') + ' been held.'
        : 'No weddings registered yet.') + '<br><br>' +
      '<button class="btn btn--primary" onclick="goto(\'add\')">Add one</button></div>';
    return h;
  }

  /* ---- five-year headline ---- */
  var total5 = years.reduce(function(s,y){ return s + y.weddings; }, 0);
  var guests5 = years.reduce(function(s,y){ return s + y.guests; }, 0);
  var value5 = years.reduce(function(s,y){ return s + y.value; }, 0);

  h += '<div class="stat" style="margin-bottom:18px">' +
    '<div><span class="label">Still to come, next 5 years</span><div class="v">' + total5 + '</div></div>' +
    '<div><span class="label">Guests to come</span><div class="v">' + guests5.toLocaleString("en-GB") + '</div></div>' +
    '<div><span class="label">Value to come</span><div class="v">' + money(value5) + '</div></div>' +
    '<div><span class="label">Avg. guests</span><div class="v">' +
      (total5 ? Math.round(guests5/total5) : 0) + '</div></div>' +
  '</div>';

  if (f.beyond) {
    h += '<div class="notice notice--ok">' + f.beyond + ' further wedding' + (f.beyond===1?" is":"s are") +
      ' booked beyond ' + years[years.length-1].year + ', so they sit outside the five years above.</div>';
  }

  /* ---- year by year, with a simple bar so the shape is readable ---- */
  h += '<div class="card"><h2 style="margin-bottom:14px">By year</h2>' +
    '<table><thead><tr><th>Year</th><th>Weddings</th><th class="money">Guests</th>' +
    '<th class="money">Value</th><th style="width:34%"></th></tr></thead><tbody>';
  years.forEach(function(y){
    var pct = Math.round(y.weddings / peak * 100);
    h += '<tr><td><strong>' + y.year + '</strong></td>' +
      '<td class="num"><strong>' + y.weddings + '</strong></td>' +
      '<td class="money num">' + (y.guests || "—") + '</td>' +
      '<td class="money num">' + (y.value ? money(y.value) : "—") + '</td>' +
      '<td><div style="background:var(--mist);height:10px">' +
        '<div style="background:var(--sage);height:10px;width:' + pct + '%"></div></div></td></tr>';
  });
  h += '</tbody></table></div>';

  /* ---- month grid: where the gaps are ---- */
  h += '<div class="card"><h2 style="margin-bottom:6px">By month</h2>' +
    '<p class="muted" style="margin:0 0 14px;font-size:.875rem">' +
    'Weddings per month, from this month on. Blank months are the ones worth selling ' +
    'into; a dash is a month already gone.</p>' +
    '<table><thead><tr><th>Year</th>' +
    MONTHS.map(function(m){ return '<th class="money">' + m + '</th>'; }).join("") +
    '<th class="money">Total</th></tr></thead><tbody>';
  years.forEach(function(y){
    h += '<tr><td><strong>' + y.year + '</strong></td>' +
      y.months.map(function(m){
        /* Past months hold no weddings here, because the figures are
           forward only. Left as a blank they would read as a gap to sell
           into. This month counts as gone: nobody is booking a wedding into
           the month they are standing in, and a month with weddings left in
           it shows the number rather than either mark. */
        var gone = (y.year + "-" + String(m.month).padStart(2, "0")) <= (f.today || "").slice(0, 7);
        return '<td class="money num' + (m.weddings ? '' : ' muted') + '"' +
          (m.weddings ? ' style="background:var(--sage-10);font-weight:600"' : '') + '>' +
          (m.weddings || (gone ? '<span style="opacity:.45">&mdash;</span>' : "·")) + '</td>';
      }).join("") +
      '<td class="money num"><strong>' + (y.weddings || "·") + '</strong></td></tr>';
  });
  h += '</tbody></table></div>';

  /* ---- what's next ---- */
  // The whole forward book is upcoming now, so this is simply the front of it.
  var upcoming = f.weddings.slice(0, 8);
  if (upcoming.length) {
    h += '<div class="card"><h2 style="margin-bottom:12px">Coming up</h2>' +
      '<table><thead><tr><th>Couple</th><th>Date</th>' +
      '<th class="money">Guests</th><th class="money"></th></tr></thead><tbody>';
    upcoming.forEach(function(x){
      h += '<tr><td><strong>' + esc(x.salutation) + '</strong><br>' +
        '<span class="muted" style="font-size:.8125rem"><code>' + esc(x.event_id) + '</code></span></td>' +
        '<td class="num">' + esc(ukDate(x.wedding_date)) + '<br>' +
        '<span class="muted" style="font-size:.8125rem">' + daysToGo(x.wedding_date) + ' days</span></td>' +
        '<td class="money num">' +
          (x.guestsDay || x.guestsEvening
            ? (x.guestsDay ? x.guestsDay + ' day' : '') +
              (x.guestsDay && x.guestsEvening ? '<br>' : '') +
              (x.guestsEvening ? x.guestsEvening + ' evening' : '')
            : (x.guests != null ? x.guests + ' guests' : '—')) + '</td>' +
        '<td class="money"><button class="btn btn--sm" onclick="open_(\'' + x.id + '\')">Open</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  h += '<div class="center" style="margin-bottom:16px">' +
    '<button class="btn" onclick="exportForecast()">Download the forward book</button></div>';

  /* The album emails go out on their own at eight each morning. This is
     only here for the morning they don't. */
  h += '<div class="card"><h2 style="margin-bottom:6px">Photo album emails</h2>' +
    '<p class="muted" style="margin:0 0 12px;font-size:.875rem">' +
    'Every guest is emailed the photo album link two days before their wedding and again on the ' +
    'morning, automatically at 8am. Run it by hand only if something has gone wrong, or if a ' +
    'wedding was added the day before. Nobody is emailed the same thing twice.</p>' +
    '<p class="muted" id="albumBeat" style="margin:0 0 12px;font-size:.8125rem">Checking…</p>' +
    '<button class="btn btn--sm" onclick="runAlbumEmails(this)">Run today’s album emails</button>' +
  '</div>';
  return h;
}

function exportForecast(){
  var rows = S.forecast.weddings.map(function(x){
    return [x.wedding_date, x.salutation, x.event_id,
            x.guestsDay || "", x.guestsEvening || "", x.value, x.status];
  });
  csvRaw("forward-book",
    ["Date","Couple","Reference","Daytime guests","Evening guests","Value","Status"], rows);
}

/* ============================ OUTSTANDING PAYMENTS ============================ */
async function loadOutstanding(){
  var want = S.view, cur = S.current;
  try {
    S.outstanding = await call("report.outstanding");
    if (!stillWanted(want, cur)) return;
    $("views").innerHTML = viewOutstanding();
  } catch (e) { if (!stillWanted(want, cur)) return; showErr(e.message); $("views").innerHTML = ""; }
}

function viewOutstanding(){
  var all = S.outstanding || [];
  var errors = all.filter(function(r){ return r.error; });
  var live = all.filter(function(r){ return !r.error; });

  /* Behind schedule first — that's the chase list. Then everyone else who
     still owes, so the full picture is there without two reports. */
  var behind = live.filter(function(r){ return r.behind; })
                   .sort(function(a,b){ return b.shortfall - a.shortfall; });
  var owing = live.filter(function(r){ return !r.behind && r.outstanding > 0.005 && !r.past; })
                  .sort(function(a,b){ return a.daysToGo - b.daysToGo; });
  var pastDue = live.filter(function(r){ return r.past && r.outstanding > 0.005; });
  var clear = live.filter(function(r){ return r.outstanding <= 0.005; });

  var chaseTotal = behind.reduce(function(s,r){ return s + r.shortfall; }, 0);
  var owedTotal = live.reduce(function(s,r){ return s + r.outstanding; }, 0);

  var h = '<div class="split" style="margin-bottom:6px"><h1>Outstanding payments</h1>' +
    '<button class="btn btn--sm" onclick="loadOutstanding()">Refresh</button></div>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Balances read live from Guestline, plus any app payment not yet posted to Rezlynx. ' +
    'The schedule is 25% at nine months, 50% at six, 75% at three, and the full balance a month before.</p>';

  h += '<div class="stat" style="margin-bottom:18px">' +
    '<div><span class="label">To chase now</span><div class="v" style="color:' +
      (chaseTotal > 0 ? "var(--alert)" : "inherit") + '">' + money(chaseTotal) + '</div></div>' +
    '<div><span class="label">Couples behind</span><div class="v">' + behind.length + '</div></div>' +
    '<div><span class="label">Total still owed</span><div class="v">' + money(owedTotal) + '</div></div>' +
    '<div><span class="label">Fully paid</span><div class="v">' + clear.length + '</div></div>' +
  '</div>';

  if (errors.length) {
    h += '<div class="notice notice--late"><strong>' + errors.length + ' wedding' +
      (errors.length===1?"":"s") + ' couldn\'t be read from Guestline</strong> — ' +
      errors.map(function(r){ return esc(r.salutation); }).join(", ") +
      '. Their balance isn\'t included in the totals above.</div>';
  }

  if (pastDue.length) {
    h += '<div class="notice notice--late"><strong>' + pastDue.length + ' past wedding' +
      (pastDue.length===1?"":"s") + ' still showing a balance.</strong> ' +
      'Usually means a final payment was never posted in Rezlynx.</div>';
  }

  h += chaseTable("Behind the payment schedule", behind, true,
    "Nobody is behind. Genuinely worth a moment.");

  if (owing.length) {
    h += chaseTable("On track, balance still to come", owing, false, "");
  }
  if (pastDue.length) {
    h += chaseTable("Past weddings with a balance", pastDue, true, "");
  }

  h += viewDueByMonth(live);

  if (behind.length) {
    h += '<div class="center"><button class="btn" onclick="exportChase()">Download the chase list</button></div>';
  }
  return h;
}

/* ---------- when the money is due ----------

   The schedule is four instalments of a quarter each: nine months before the
   wedding, six, three, and the last a month before. Turning that into dates
   rather than day counts is what makes a month-by-month forecast possible —
   "273 days out" is a state, "12 March" is a month you can add up.

   Whole months back from the wedding day, keeping the day of the month where
   the shorter month allows it: nine months before 31 December is 31 March,
   and one month before 31 March is 28 February, not 3 March. */
function monthsBefore(iso, n){
  var p = ymd(iso).split("-");
  if (p.length !== 3) return "";
  var t = new Date(Date.UTC(+p[0], +p[1] - 1 - n, 1));
  var lastDay = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(+p[2], lastDay));
  return t.toISOString().slice(0, 10);
}

var SCHEDULE = [[9, 0.25, "25%"], [6, 0.50, "50%"], [3, 0.75, "75%"], [1, 1, "Balance"]];

/* The instalments still to be paid on one wedding.

   What has already been paid comes off the front, which is how the schedule
   works: a couple who paid half up front owes nothing at nine months and
   nothing at six. */
function instalments(w){
  var total = Number(w.total) || 0;
  if (!total || !w.wedding_date) return [];
  var paid = Number(w.paid) || 0;
  var out = [], floor = 0;
  SCHEDULE.forEach(function(step){
    var target = total * step[1];
    var expected = Math.max(0, target - Math.max(paid, floor));
    floor = target;
    if (expected > 0.005) {
      out.push({
        wedding: w, due: monthsBefore(w.wedding_date, step[0]),
        stage: step[2], amount: Math.round(expected * 100) / 100,
      });
    }
  });

  /* Four quarters of an odd number do not come to the odd number. Rounding
     each one on its own left the forecast eleven pence away from the balance
     it is a forecast of, which is the kind of gap somebody spends an
     afternoon on. The last instalment takes the difference, as it does in
     real life — the final bill is whatever is left. */
  if (out.length) {
    var owed = Number(w.outstanding);
    if (!isFinite(owed)) owed = Math.max(0, total - paid);
    var counted = out.reduce(function(a, i){ return a + i.amount; }, 0);
    var last = out[out.length - 1];
    last.amount = Math.round((last.amount + (owed - counted)) * 100) / 100;
    if (last.amount <= 0.005) out.pop();
  }
  return out;
}

/** Every instalment still owed on a wedding still to come, oldest first. */
function allInstalments(live){
  var out = [];
  (live || []).forEach(function(w){
    if (w.past) return;                       // held, and any balance is a debt
    instalments(w).forEach(function(i){ out.push(i); });
  });
  return out.sort(function(a, b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
}

/* The month arrears are expected to land in.

   Anything already due is taken as collected this month, unless there is not
   enough of the month left to collect it in: under ten days and it goes into
   the next one. Chasing a payment on the twenty-ninth and banking it by the
   thirtieth is not a forecast, it is a wish. */
function collectionMonth(today){
  var y = +today.slice(0, 4), m = +today.slice(5, 7), d = +today.slice(8, 10);
  var lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  if (lastDay - d >= 10) return today.slice(0, 7);
  return new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 7);
}

function dueByMonth(live){
  var today = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date());
  var collect = collectionMonth(today);
  var months = {}, overdue = [];
  var put = function(m, i){
    months[m] = months[m] || { month: m, amount: 0, items: [], arrears: 0 };
    months[m].amount += i.amount;
    months[m].items.push(i);
    if (i.overdue) months[m].arrears += i.amount;
  };
  allInstalments(live).forEach(function(i){
    if (i.due < today) {
      i.overdue = true; i.lands = collect;
      overdue.push(i); put(collect, i);
    } else {
      i.overdue = false; i.lands = i.due.slice(0, 7);
      put(i.lands, i);
    }
  });
  return {
    today: today, collect: collect, overdue: overdue,
    overdueAmount: overdue.reduce(function(a, i){ return a + i.amount; }, 0),
    months: Object.keys(months).sort().map(function(k){ return months[k]; }),
  };
}

function monthLabel(m){
  return (MONTHS[+m.slice(5, 7) - 1] || "") + " " + m.slice(0, 4);
}

function daysToGo(iso){
  var t = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()).split("-");
  var p = String(iso||"").slice(0,10).split("-");
  return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2]) - Date.UTC(+t[0],+t[1]-1,+t[2]))/86400000);
}

/* A CSV download that doesn't depend on a wedding being open. */
function csvRaw(name, head, rows){
  var q = function(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; };
  var body = [head.map(q).join(",")].concat(rows.map(function(r){ return r.map(q).join(","); })).join("\r\n");
  var blob = new Blob(["﻿"+body], { type:"text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + "-" + new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()) + ".csv";
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

/* ---------- finding one wedding among forty-seven ----------

   Whatever is to hand: a name, a date, a reference. Nobody remembers which
   of the three the box wants, so it takes all of them and does not ask.

   Each wedding is flattened once into a line of text holding every way it
   could reasonably be written — both names, the salutation, the email, the
   reference, and the date as an ISO string, as 24/10/2026, as 24102026, as
   "24 Oct 2026", as "24 October 2026", and as the weekday. Then the words
   typed have to appear somewhere in it, which is what lets "andrew oct"
   and "booth 2026" both work.

   Recomputed per keystroke rather than cached: forty-seven rows is nothing,
   and a cache is one more thing to go stale when a wedding is edited. */
function searchBlob(w){
  if (!w.__blob) {
    var d = ymd(w.wedding_date), p = d.split("-");
    var parts = [w.salutation, w.partner1_name, w.partner2_name, w.primary_email,
                 w.event_id, w.status, d];
    if (p.length === 3) {
      var dt = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
      var fmt = function(o){
        try {
          return new Intl.DateTimeFormat("en-GB",
            Object.assign({ timeZone: "UTC" }, o)).format(dt);
        } catch (e) { return ""; }
      };
      parts.push(p[2] + "/" + p[1] + "/" + p[0], p[2] + p[1] + p[0],
                 fmt({ day:"numeric", month:"short", year:"numeric" }),
                 fmt({ day:"numeric", month:"long", year:"numeric" }),
                 fmt({ weekday:"long" }), p[0]);
    }
    w.__blob = parts.filter(Boolean).join(" ").toLowerCase();
  }
  return w.__blob;
}

/** Every word typed has to appear somewhere, in any order. */
function matchesSearch(w, query){
  var words = String(query || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  var blob = searchBlob(w);
  return words.every(function(word){ return blob.indexOf(word) >= 0; });
}

function searchBox(id, value, fn, placeholder){

/* The box is redrawn with the view, so the caret has to be put back or it
   jumps to the front of what they are still typing. */
function keepCaret(id){
  var el = document.getElementById(id);
  if (!el) return;
  var at = el.value.length;
  el.focus();
  try { el.setSelectionRange(at, at); } catch (e) {}
}

      '<button class="btn" onclick="listSearch(\'\')">Show them all</button></div>';

    past.forEach(function(w){ h += listRow(w, true); });

function albumTile(p){
  var state = p.cleared ? "cleared" : (p.consented ? "offered" : "private");

  return '<figure class="atile atile--' + state + '" data-id="' + esc(p.id) + '">' +
    '<img loading="lazy" src="' + esc(p.thumb) + '" alt="">' +
    (mark ? '<span class="amark">' + mark + '</span>' : '') +

/* Gate three, asked out loud.
   Neither of the other two gates can speak for the people in the picture, so
   this is where somebody actually looks — and the two things worth looking
   for are said rather than assumed. */
function clearPhoto(id, on){
  var p = (S.albumPhotos || []).filter(function(x){ return x.id === id; })[0];
  if (!p) return;

  if (!on) {
    call("photos.clear", { id: S.detail.wedding.id, photo_id: id, cleared: false })
      .then(loadAlbumPhotos).catch(function(e){ alert(e.message); });
    return;
  }

  var ok = window.confirm(
    "Clear this photograph for our own marketing?\n\n" +
    (p.uploader ? p.uploader + " took it and " : "Whoever took it ") +
    "has agreed we may use it, and the couple has agreed to us asking.\n\n" +
    "Before you say yes, look at it and check:\n" +
    "  • there is no child in it who can be recognised\n" +
    "  • nobody is in it who would not expect to be\n\n" +
    "Only you can judge those two, and the guest who ticked the box could not.");
  if (!ok) return;

  var by = window.prompt("Your name, for the record:", "") || "";
  call("photos.clear", {
    id: S.detail.wedding.id, photo_id: id, cleared: true,
    confirm_checked: true, by: by.trim()
  }).then(loadAlbumPhotos).catch(function(e){ alert(e.message); });
}

function removeAlbumPhoto(id){
  var p = (S.albumPhotos || []).filter(function(x){ return x.id === id; })[0];
  if (!p) return;
  // Somebody else's photograph, and there is no undo, so say whose.
  if (!window.confirm("Delete this photograph" +
      (p.uploader ? " from " + p.uploader : "") + "? It cannot be undone.")) return;
  call("photos.delete", { id: S.detail.wedding.id, ids: [id] })
    .then(loadAlbumPhotos)
    .catch(function(e){ alert(e.message); });
}

/* A job nobody watches is a job that quietly stops. This one only matters
   on two mornings per wedding, so the overview says when it last ran and
   goes amber if that was not recently. */
async function showAlbumBeat(){
  var el = document.getElementById("albumBeat");
  if (!el) return;
  try {
    var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/wedding-photos", {
      method:"POST",
      headers:{ "Content-Type":"application/json",
                Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
      body: JSON.stringify({ action:"diag", password:S.pw })
    });
    var d = await r.json();
    if (!d.lastRunAt) {
      el.innerHTML = '<strong style="color:var(--alert)">It has never run.</strong> ' +
        'It is scheduled for 8am daily — if this still says so tomorrow, tell whoever looks after the app.';
      return;
    }
    var when = new Date(d.lastRunAt);
    var hours = (Date.now() - when.getTime()) / 3600000;
    el.innerHTML = 'Last run ' + esc(ukDate(d.lastRunAt)) + ' at ' +
      esc(String(when.getHours()).padStart(2,"0") + ":" + String(when.getMinutes()).padStart(2,"0")) +
      ' — ' + esc(d.lastRunSummary || "nothing due") + '.' +
      (hours > 30 ? ' <strong style="color:var(--alert)">That is more than a day ago.</strong>' : '');
  } catch (e) {
    el.textContent = "Couldn't check when it last ran.";
  }
}

/* The same job pg_cron runs at eight each morning. Here for the morning it
   does not — a failed run, or a wedding added the day before. */
async function runAlbumEmails(btn){
  if (!window.confirm("Send the album email to every guest whose wedding is in two days " +
      "or today, and take down any album that is out of time?\n\nGuests who have already " +
      "had that email will not get it twice.")) return;
  btn.disabled = true;
  var was = btn.textContent;
  btn.textContent = "Running…";
  try {
    var out = await call("album.run", {});
    var ran = out.ran || [];
    var sent = ran.reduce(function(s, r){ return s + (r.sent || 0); }, 0);
    alert(ran.length
      ? sent + " email" + (sent === 1 ? "" : "s") + " sent across " + ran.length + " wedding" +
        (ran.length === 1 ? "" : "s") + ".\n\n" +
        ran.map(function(r){ return r.event_id + " — " + r.stage + ": " + (r.sent || 0); }).join("\n")
      : "Nothing was due today.");
  } catch (e) { alert(e.message); }
  btn.textContent = was;
  btn.disabled = false;
}

/* ============================ APP USAGE ============================
   Who has been handed the app and who has actually opened it.

   Two different questions, and the gap between them is the only number
   that says whether any of this is working. A couple who was never sent
   their invitation has not ignored the app; a couple who was sent it three
   months ago and has never logged in has.
   ================================================================== */

var U = { rows: [], filter: "all", query: "" };

async function loadUsage(){
  var want = S.view, cur = S.current;
  try {
    S.list = await call("list");
    U.rows = S.list;
    if (!stillWanted(want, cur)) return;
    $("views").innerHTML = viewUsage();
  } catch (e) { if (!stillWanted(want, cur)) return; showErr(e.message); $("views").innerHTML = ""; }
}

function usageFilter(f){
  U.filter = f;
  $("views").innerHTML = viewUsage();
}

function usageSearch(v){
  U.query = v;
  $("views").innerHTML = viewUsage();
  keepCaret("usageSearch");
}

function usageRows(){
  var rows = U.rows.filter(function(w){ return matchesSearch(w, U.query); });
  if (U.filter === "waiting") {
    rows = rows.filter(function(r){ return !r.welcome_sent_at; });
  } else if (U.filter === "never") {
    rows = rows.filter(function(r){ return r.welcome_sent_at && !r.last_login_at; });
  } else if (U.filter === "using") {
    rows = rows.filter(function(r){ return r.last_login_at; });
  }
  // Soonest wedding first: the ones where it still matters.
  return rows.sort(function(a, b){ return a.wedding_date < b.wedding_date ? -1 : 1; });
}

function daysSince(iso){
  if (!iso) return null;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

/* A wedding that has already happened still belongs on this sheet — it is
   where "we sent it and they never opened it" is most worth knowing. So the
   date has to read properly in both directions rather than "-3 days". */
function whenText(iso){
  var d = daysToGo(iso);
  if (d === 0) return "today";
  if (d === 1) return "tomorrow";
  if (d === -1) return "yesterday";
  return d > 0 ? d + " days to go" : Math.abs(d) + " days ago";
}

function agoText(iso){
  var d = daysSince(iso);
  if (d === null) return "";
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  if (d < 31) return d + " days ago";
  if (d < 365) return Math.round(d / 30) + " months ago";
  return "over a year ago";
}

function viewUsage(){
  var all = U.rows;
  /* Counted the same way each list is filtered, not by subtracting one from
     another. These four do not partition the weddings: a couple who never
     had an invitation but has logged in anyway appears in two of them, and
     that is exactly the case worth seeing — it is almost always us. */
  var sent    = all.filter(function(r){ return r.welcome_sent_at; }).length;
  var used    = all.filter(function(r){ return r.last_login_at; }).length;
  var waiting = all.filter(function(r){ return !r.welcome_sent_at; }).length;
  var ignored = all.filter(function(r){ return r.welcome_sent_at && !r.last_login_at; }).length;

  var h = '<div class="split" style="margin-bottom:6px"><h1>App usage</h1>' +
    '<span class="label">' + all.length + ' wedding' + (all.length === 1 ? "" : "s") + '</span></div>' +
    '<p class="muted" style="margin:0 0 18px">' +
    'Who has been sent their invitation, and who has actually opened the app. ' +
    'Click any row to open that wedding.</p>';

  /* The four states, as buttons, because each one is a different job:
     send the invitation, chase the ones ignoring it, or leave well alone. */
  var tab = function(key, label, n, tone){
    return '<button class="ufilter' + (U.filter === key ? " on" : "") +
      (tone ? " ufilter--" + tone : "") + '" onclick="usageFilter(\'' + key + '\')">' +
      '<span class="un">' + n + '</span><span class="ul">' + label + '</span></button>';
  };
  h += '<div class="ufilters">' +
    tab("all", "All weddings", all.length, "") +
    tab("waiting", "Not sent yet", waiting, waiting ? "warn" : "") +
    tab("never", "Sent, never opened", ignored, ignored ? "warn" : "") +
    tab("using", "Using the app", used, "ok") +
  '</div>';

  h += searchBox("usageSearch", U.query, "usageSearch",
                 "Search by name, date or reference");

  var rows = usageRows();
  if (!rows.length) {
    h += '<div class="card empty">' +
      (U.query ? 'Nothing matches &ldquo;' + esc(U.query) + '&rdquo; in this list.<br><br>' +
                 '<button class="btn" onclick="usageSearch(\'\')">Clear the search</button>'
               : 'Nothing in this list.') + '</div>';
    return h;
  }

  h += '<div class="card card--flush"><table class="usage"><thead><tr>' +
    '<th>Couple</th><th>Wedding date</th><th>Invitation sent</th>' +
    '<th>Logged in</th><th>Last log in</th><th>We looked</th><th></th>' +
    '</tr></thead><tbody>';

  rows.forEach(function(r){
    var openIt = 'onclick="open_(\'' + esc(r.id) + '\')"';
    h += '<tr class="urow" ' + openIt + '>' +
      '<td data-label="Couple"><strong>' + esc(r.salutation) + '</strong><br>' +
        '<span class="muted" style="font-size:.8125rem"><code>' + esc(r.event_id) + '</code></span></td>' +
      '<td data-label="Wedding date" class="num">' + esc(ukDate(r.wedding_date)) + '<br>' +
        '<span class="muted" style="font-size:.8125rem">' + whenText(r.wedding_date) + '</span></td>' +
      '<td data-label="Invitation sent">' +
        (r.welcome_sent_at
          ? '<span class="pill pill--ok">Sent</span><br><span class="muted" style="font-size:.8125rem">' +
            esc(ukDate(r.welcome_sent_at)) + '</span>'
          : '<span class="pill pill--prov">Not yet</span>') + '</td>' +
      '<td data-label="Logged in">' +
        (r.last_login_at
          ? '<span class="pill pill--ok">Yes</span>' +
            // A login from before the BHBADMIN- prefix existed may well have
            // been one of us. This moves it across rather than deleting a
            // real wedding to tidy the sheet.
            '<br><button class="btn btn--sm udel" style="margin-top:5px" ' +
            'onclick="event.stopPropagation();notThem(\'' + esc(r.id) + '\')">Wasn\'t them</button>'
          : (r.welcome_sent_at
              ? '<span class="pill pill--late">Never</span>'
              : '<span class="muted">&mdash;</span>')) + '</td>' +
      '<td data-label="Last log in" class="num">' +
        (r.last_login_at
          ? esc(ukDate(r.last_login_at)) + '<br><span class="muted" style="font-size:.8125rem">' +
            esc(agoText(r.last_login_at)) + '</span>'
          : '<span class="muted">&mdash;</span>') + '</td>' +
      // Our own visits, so the two are never confused for one another.
      '<td data-label="We looked" class="num">' +
        (r.staff_login_at
          ? esc(ukDate(r.staff_login_at)) +
            (r.staff_login_count > 1
              ? '<br><span class="muted" style="font-size:.8125rem">' +
                r.staff_login_count + ' times</span>' : '')
          : '<span class="muted">&mdash;</span>') + '</td>' +
      '<td class="money">' +
        '<button class="btn btn--sm udel" onclick="event.stopPropagation();removeWedding(\'' +
        esc(r.id) + '\')">Delete</button></td>' +
    '</tr>';
  });

  h += '</tbody></table></div>' +
    '<p class="muted" style="margin:14px 0 0;font-size:.8125rem">' +
    'Deleting removes the account and everything the couple has built. It is here for ' +
    'clearing out anything that was only ever us testing — for a real couple, ' +
    'use the danger zone on their own page, where you can see what you are about to lose.</p>' +
    '<div class="center" style="margin-top:16px">' +
    '<button class="btn" onclick="exportUsage()">Download this sheet</button></div>';

  return h;
}

/* Deleting from the list, rather than from the wedding's own page. Same
   confirmation either way: typing the reference is deliberately more work
   than clicking Yes, because there is no undo behind it. */
async function removeWedding(id){
  var r = (U.rows || []).filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  var typed = prompt(
    'Delete ' + r.salutation + ' (' + r.event_id + ')?\n\n' +
    'This removes the account and everything on it — guest list, suppliers, ' +
    'budget, payment records, photographs. It cannot be undone.\n\n' +
    'Type the reference "' + r.event_id + '" to confirm.');

    await call("delete", { id: id });
    await refreshPending();
    await loadUsage();

function exportUsage(){
  var rows = usageRows().map(function(r){
