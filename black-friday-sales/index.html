<style>
:root{--sage:#4D604F;--sage-70:#7B887C;--sage-10:#EDEFED;--sage-dark:#3F2F28;--bone:#F8F8F8;--celadon:#CCCDB4;--mist:#E7E7E7;--white:#fff;--ink:#262626;--olive:#CCCDB4;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#2F5B31;--good-bg:#EDF2ED;--attn:#8a6a2c;--attn-bg:#F7F0E4;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:10px;--shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);--maxw:1100px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--bone);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}a{color:var(--sage)}
#gate{position:fixed;inset:0;background:var(--sage);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:380px;padding:32px 28px;text-align:center}
.gatecard h1{font-size:26px;color:var(--sage)}.gatecard .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage-70);margin:6px 0 22px}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 16px 80px}
header.top{background:#000;color:#fff}.topin{max-width:var(--maxw);margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;line-height:1.1}.brand small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;opacity:.9}
nav.tabs{background:var(--sage)}.tabsin{max-width:var(--maxw);margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tabbtn{background:transparent;border:0;cursor:pointer;color:rgba(255,255,255,.75);padding:12px 14px;font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.14em;text-transform:uppercase;border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:#fff;border-bottom-color:var(--olive)}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:22px 0 8px}.pagehead h2{font-size:30px;color:var(--sage)}
.lead{color:var(--sage-70);margin:0 0 16px;max-width:70ch}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:22px;color:var(--sage);margin:0 0 8px}
.muted{color:var(--sage-70)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--sage);background:var(--sage);color:#fff;border-radius:10px;padding:0 16px;min-height:44px;font-size:13px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.btn.ghost{background:#fff;color:var(--sage)}.btn.sm{min-height:34px;padding:0 12px;font-size:12px}.btn.danger{background:#fff;border-color:var(--alert);color:var(--alert)}.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:12px 16px}.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f label{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-70);margin:0 0 4px}
.f input,.f select,.f textarea{width:100%;min-height:42px;font-size:15px;padding:6px 10px;border:1px solid var(--celadon);border-radius:8px;background:#fff}
.f textarea{min-height:90px}
.stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}.stat b{display:block;font-family:var(--display);font-size:32px;color:var(--sage);line-height:1.1}.stat span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-70)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sage-10);color:var(--sage-70)}
.pill.ok{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--attn-bg);color:var(--attn)}.pill.bad{background:var(--alert-bg);color:var(--alert)}.pill.dark{background:#000;color:#fff}
.notice{padding:11px 14px;border-radius:8px;font-size:14px;background:var(--sage-10);margin-bottom:14px}.notice.bad{background:var(--alert-bg);color:var(--alert)}.notice.ok{background:var(--good-bg);color:var(--good)}.notice.warn{background:var(--attn-bg);color:var(--attn)}
table.t{border-collapse:collapse;width:100%}table.t th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-70);text-align:left;padding:6px 8px;border-bottom:2px solid var(--mist);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--mist);vertical-align:top}
.code{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tw{overflow-x:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.bar .f{flex:1 1 200px}
.qrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--mist)}.qrow .n{flex:1}.qrow .n small{display:block;color:var(--sage-70)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--celadon);border-radius:999px;overflow:hidden}.qty button{width:38px;height:38px;border:0;background:#fff;font-size:20px;cursor:pointer}.qty output{min-width:28px;text-align:center;font-weight:700}
.sw{display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;background:var(--sage-10)}
.sw input{width:28px;height:28px;accent-color:var(--sage)}.sw label{font-weight:700;font-size:17px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.modal h3{font-size:24px;color:var(--sage);margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:600;max-width:90vw}.toast.on{opacity:1;transform:translateX(-50%)}.toast.bad{background:var(--alert)}
@media(max-width:700px){table.t.cards thead{display:none}table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}table.t.cards tr{border:1px solid var(--mist);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:#fff}table.t.cards td{border:0;padding:4px 8px}}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Black Friday vouchers</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:700">Open the Staff Portal</a>
  <div class="notice bad hide" id="gerr" style="margin-top:12px"></div></div></div>
<div id="app" class="hide">
  <header class="top"><div class="topin"><div class="brand">Black Friday vouchers<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span></div></div></header>
  <nav class="tabs" aria-label="Sections"><div class="tabsin" id="tabs"></div></nav>
  <main class="shell" id="views"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
"use strict";
var API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/voucher-api";
var KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
var TABS = [["vouchers", "Vouchers"], ["record", "Record a sale"], ["settings", "Settings"]];
var S = { me: null, tab: null, rows: [], totals: null, q: "", st: "all", test: false, products: [], cart: {}, settings: null };
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function gbp(n) { n = Number(n || 0); return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: Math.round(n * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 }); }
function staffEmail() { try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch (e) { return ""; } }
function toast(msg, bad) { var t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = "toast"; }, bad ? 6000 : 2600); }
function when(iso) { return iso ? new Date(iso).toLocaleString("en-GB", { timeZone: "Europe/London", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; }
function day(ymd) { return ymd ? new Date(ymd + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", day: "numeric", month: "short", year: "numeric" }) : ""; }
async function api(action, payload) {
  var r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY, apikey: KEY }, body: JSON.stringify(Object.assign({ action: action, staff_email: staffEmail() }, payload || {})) });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
function openGate(msg) { $("#gate").style.display = "flex"; $("#app").classList.add("hide"); if (msg) { var g = $("#gerr"); g.textContent = msg; g.classList.remove("hide"); } }

function tabs() { $("#tabs").innerHTML = TABS.filter(function (t) { return S.me.tabs.indexOf(t[0]) > -1; }).map(function (t) { return '<button class="tabbtn" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + "</button>"; }).join(""); }
async function show(tab) {
  S.tab = tab; tabs(); var v = $("#views");
  if (!tab) { v.innerHTML = '<div class="card">You do not have any tabs on Black Friday vouchers yet. Ask the GM.</div>'; return; }
  if (tab === "vouchers") return showVouchers(v);
  if (tab === "record") return showRecord(v);
  if (tab === "settings") return showSettings(v);
}

/* ------------------------------------------------------------- modal */
function modal(html, onMount) {
  var m = document.createElement("div"); m.className = "modal"; m.innerHTML = '<div class="box">' + html + "</div>"; document.body.appendChild(m);
  m.addEventListener("click", function (e) { if (e.target === m || e.target.closest("[data-close]")) m.remove(); });
  if (onMount) onMount(m); return m;
}

/* ------------------------------------------------------------- vouchers */
function statusPill(v) {
  if (v.status === "voided") return '<span class="pill bad">Void</span>';
  if (v.status === "redeemed") return '<span class="pill dark">Redeemed</span>';
  if (v.status === "part_used") return '<span class="pill warn">Part used</span>' + (v.expired ? ' <span class="pill bad">Expired</span>' : "");
  return '<span class="pill ok">Not used</span>' + (v.expired ? ' <span class="pill bad">Expired</span>' : "");
}
function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9@.]/g, ""); }
function filtered() {
  var q = norm(S.q), qc = String(S.q || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^BF/, "");
  return S.rows.filter(function (v) {
    if (S.st === "unused" && !(v.status === "valid" || v.status === "part_used")) return false;
    if (S.st === "redeemed" && v.status !== "redeemed") return false;
    if (S.st === "voided" && v.status !== "voided") return false;
    if (!q) return true;
    return (qc && v.code.replace(/[^A-Z0-9]/g, "").slice(2).indexOf(qc) > -1) || norm(v.buyer).indexOf(q) > -1 || norm(v.email).indexOf(q) > -1 || norm(v.phone).indexOf(q) > -1 || norm(v.title).indexOf(q) > -1;
  });
}
function rowsHtml() {
  var rows = filtered(); if (!rows.length) return '<tr><td colspan="6" class="muted">' + (S.rows.length ? "Nothing matches that search." : "No vouchers have been sold yet.") + "</td></tr>";
  return rows.map(function (v) {
    var acts = "";
    if (S.me.edit) {
      if (v.status === "valid" || v.status === "part_used") acts += '<button class="btn sm" data-act="redeem" data-id="' + v.id + '">Mark redeemed</button> ';
      if (v.status === "redeemed" || v.status === "part_used" || v.status === "voided") acts += '<button class="btn sm ghost" data-act="undo" data-id="' + v.id + '">Put back</button> ';
      if (v.status === "valid" || v.status === "part_used") acts += '<button class="btn sm danger" data-act="void" data-id="' + v.id + '">Void</button> ';
      if (v.email) acts += '<button class="btn sm ghost" data-act="resend" data-id="' + v.id + '">Resend email</button> ';
    }
    acts += '<button class="btn sm ghost" data-act="history" data-id="' + v.id + '">History</button>';
    return "<tr><td><span class=\"code\">" + esc(v.code) + "</span>" + (v.is_test ? ' <span class="pill warn">Test</span>' : "") + "<br>" + statusPill(v) + "</td>" +
      "<td><b>" + esc(v.title) + "</b><br><span class=\"muted small\">" + gbp(v.price) + (v.kind === "money" ? " for a " + gbp(v.face_value) + " voucher" : "") + "</span></td>" +
      "<td>" + esc(v.buyer) + "<br><span class=\"muted small\">" + esc(v.phone) + (v.email ? "<br>" + esc(v.email) : "") + "</span></td>" +
      "<td class=\"small\">" + esc(when(v.paid_at || v.created_at)) + "<br><span class=\"muted\">" + (v.source === "staff" ? "By " + esc(v.recorded_by) + " (" + esc(String(v.pay_method).replace(/_/g, " ")) + ")" : "Online") + "</span></td>" +
      "<td class=\"small\">" + (v.kind === "stay" ? "Stays until " : "Until ") + esc(day(v.expires_on)) + (v.redeemed_at ? "<br><span class=\"muted\">Used " + esc(when(v.redeemed_at)) + " by " + esc(v.redeemed_by) + "</span>" : "") + "</td>" +
      "<td>" + acts + "</td></tr>";
  }).join("");
}
async function showVouchers(v) {
  v.innerHTML = '<div class="pagehead"><h2>Vouchers</h2></div><p class="muted">Loading…</p>';
  try {
    var d = await api("admin.list", { include_test: S.test }); S.rows = d.vouchers; S.totals = d.totals;
    var t = d.totals;
    v.innerHTML = '<div class="pagehead"><h2>Vouchers</h2><span class="muted small">Black Friday sales, online and recorded by staff</span></div>' +
      '<div class="grid g5" style="margin-bottom:16px">' +
        '<div class="stat"><b>' + t.vouchers + '</b><span>Sold</span></div><div class="stat"><b>' + gbp(t.takings) + '</b><span>Takings</span></div>' +
        '<div class="stat"><b>' + t.redeemed + '</b><span>Redeemed</span></div><div class="stat"><b>' + t.outstanding + '</b><span>Still to use</span></div>' +
        '<div class="stat"><b>' + gbp(t.outstanding_value) + '</b><span>Value still to use</span></div></div>' +
      '<div class="card"><div class="bar"><div class="f"><label for="q">Search by voucher code, name, email or phone</label><input id="q" type="search" value="' + esc(S.q) + '" placeholder="e.g. K7M2 or Smith" autocomplete="off"></div>' +
        '<div class="f" style="flex:0 0 180px"><label for="st">Show</label><select id="st"><option value="all">All vouchers</option><option value="unused">Not fully used</option><option value="redeemed">Redeemed</option><option value="voided">Void</option></select></div>' +
        '<button class="btn ghost" id="csv" type="button">Export CSV</button></div>' +
      '<label class="small muted" style="display:inline-flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="tst"' + (S.test ? " checked" : "") + '> Show test sales</label>' +
      '<div class="tw"><table class="t cards"><thead><tr><th>Code</th><th>Voucher</th><th>Buyer</th><th>Bought</th><th>Expires / used</th><th></th></tr></thead><tbody id="rows">' + rowsHtml() + '</tbody></table></div></div>' +
      '<div class="card"><h3>By voucher</h3><div class="tw"><table class="t"><thead><tr><th>Voucher</th><th>Sold</th><th>Takings</th><th>Redeemed</th><th>Part used</th><th>Void</th></tr></thead><tbody>' +
        (t.by_product.map(function (b) { return "<tr><td>" + esc(b.title) + "</td><td>" + b.sold + "</td><td>" + gbp(b.takings) + "</td><td>" + b.redeemed + "</td><td>" + b.part_used + "</td><td>" + b.voided + "</td></tr>"; }).join("") || '<tr><td colspan="6" class="muted">Nothing sold yet.</td></tr>') + "</tbody></table></div>" +
        '<p class="small muted" style="margin:10px 0 0">' + t.online + " sold online and " + t.by_staff + " recorded by staff. Voided vouchers are not counted. Test sales are never counted.</p></div>";
    $("#st").value = S.st;
  } catch (e) { v.innerHTML = '<div class="card"><b>' + esc(e.message) + "</b></div>"; }
}
document.addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value; var r = $("#rows"); if (r) r.innerHTML = rowsHtml(); } });
document.addEventListener("change", function (e) {
  if (e.target.id === "st") { S.st = e.target.value; $("#rows").innerHTML = rowsHtml(); }
  if (e.target.id === "tst") { S.test = e.target.checked; showVouchers($("#views")); }
});
function csvCell(x) { var s = String(x == null ? "" : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCsv() {
  var head = ["Code", "Voucher", "Status", "Paid", "Normal price", "Face value", "Spent", "Balance", "Expires", "Buyer", "Email", "Phone", "Bought", "Sold", "Payment", "Recorded by", "Redeemed at", "Redeemed by", "Test"];
  var lines = [head].concat(filtered().map(function (v) { return [v.code, v.title, v.status, v.price, v.normal_price, v.face_value == null ? "" : v.face_value, v.kind === "money" ? v.used : "", v.balance == null ? "" : v.balance, v.expires_on, v.buyer, v.email, v.phone, when(v.paid_at || v.created_at), v.source === "staff" ? "staff" : "online", v.pay_method, v.recorded_by, when(v.redeemed_at), v.redeemed_by, v.is_test ? "test" : ""]; }));
  var blob = new Blob(["﻿" + lines.map(function (l) { return l.map(csvCell).join(","); }).join("\r\n")], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "black-friday-vouchers-" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function byId(id) { return S.rows.filter(function (x) { return x.id === id; })[0]; }
async function doAct(a, id) {
  var v = byId(id); if (!v) return;
  if (a === "redeem") {
    var money = false;
    modal("<h3>" + (money ? "Spend from this voucher" : "Mark as redeemed") + '</h3><p><span class="code">' + esc(v.code) + "</span><br>" + esc(v.title) + "<br>" + esc(v.buyer) + "</p>" +
      (v.expired ? '<div class="notice warn">This voucher ' + (v.kind === "stay" ? "is past its book-by date" : "has expired") + " (" + esc(day(v.expires_on)) + "). Only carry on if the GM has agreed.</div>" : "") +
      (money ? '<div class="f"><label for="amt">How much has been spent (balance ' + gbp(v.balance) + ')</label><input id="amt" type="number" min="0.01" step="0.01" max="' + v.balance + '" value="' + v.balance + '" inputmode="decimal"></div>' : "") +
      '<div class="f" style="margin-top:10px"><label for="nt">Note (optional)</label><input id="nt" maxlength="200" placeholder="e.g. Table 12, Sunday lunch"></div>' +
      '<p class="small muted">It will be recorded against ' + esc(S.me.name) + " now.</p>" +
      '<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" id="ok" type="button">' + (money ? "Record spend" : "Mark redeemed") + '</button><button class="btn ghost" data-close type="button">Cancel</button></div>',
      function (m) { m.querySelector("#ok").onclick = async function () { this.disabled = true; try { var r = await api("admin.redeem", { id: id, amount: money ? Number(m.querySelector("#amt").value) : undefined, note: m.querySelector("#nt").value }); m.remove(); toast(r.status === "redeemed" ? "Marked redeemed." : "Recorded. " + gbp(r.balance) + " left."); showVouchers($("#views")); } catch (e) { this.disabled = false; toast(e.message, true); } }; });
  } else if (a === "undo" || a === "void") {
    var undo = a === "undo";
    modal("<h3>" + (undo ? "Put this voucher back" : "Void this voucher") + '</h3><p><span class="code">' + esc(v.code) + "</span><br>" + esc(v.title) + "</p>" +
      '<div class="notice warn">' + (undo ? "This changes a voucher that has already been marked used. " : "A void voucher can no longer be used. Use this for a refund or a voucher issued in error. ") + "A reason is needed and is kept.</div>" +
      '<div class="f"><label for="nt">Reason</label><input id="nt" maxlength="300"></div>' +
      '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn danger" id="ok" type="button">' + (undo ? "Put back" : "Void voucher") + '</button><button class="btn ghost" data-close type="button">Cancel</button></div>',
      function (m) { m.querySelector("#ok").onclick = async function () { var n = m.querySelector("#nt").value.trim(); if (!n) { toast("Please give a reason.", true); return; } this.disabled = true; try { var rr = await api(undo ? "admin.undo" : "admin.void", { id: id, note: n }); m.remove(); toast(undo ? "Put back." : "Voided."); if (rr && rr.code_note) modal('<h3>Please note</h3><p>' + esc(rr.code_note) + '</p><div style="margin-top:14px"><button class="btn" data-close type="button">OK</button></div>'); showVouchers($("#views")); } catch (e) { this.disabled = false; toast(e.message, true); } }; });
  } else if (a === "resend") {
    if (!confirm("Email " + (v.is_test ? "the GM" : v.email) + " this voucher again?")) return;
    try { var r2 = await api("admin.resend", { id: id }); toast("Sent to " + r2.to + "."); } catch (e) { toast(e.message, true); }
  } else if (a === "history") {
    try {
      var d = await api("admin.history", { id: id });
      var rows = d.log.map(function (l) { return "<tr><td class=\"small\">" + esc(when(l.at)) + "</td><td>" + esc(l.action === "redeem" ? "Redeemed" : l.action === "undo" ? "Put back" : l.action === "void" ? "Voided" : l.action) + (l.amount != null ? " " + gbp(l.amount) : "") + (l.undone_at ? ' <span class="pill">put back</span>' : "") + "</td><td>" + esc(l.by_name) + "</td><td class=\"small\">" + esc(l.note) + "</td></tr>"; }).join("");
      modal("<h3>History</h3><p><span class=\"code\">" + esc(v.code) + "</span><br>" + esc(v.title) + "<br>Bought by " + esc(v.buyer) + " on " + esc(when(v.paid_at || v.created_at)) + "</p><div class=\"tw\"><table class=\"t\"><tbody>" + (rows || '<tr><td class="muted">Nothing has happened to this voucher since it was sold.</td></tr>') + '</tbody></table></div><div style="margin-top:14px"><button class="btn ghost" data-close type="button">Close</button></div>');
    } catch (e) { toast(e.message, true); }
  }
}
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab]"); if (t) { show(t.dataset.tab); return; }
  var b = e.target.closest("[data-act]"); if (b && !b.disabled) { doAct(b.dataset.act, b.dataset.id); return; }
  if (e.target.id === "csv") exportCsv();
});

/* ------------------------------------------------------------- record a sale */
async function showRecord(v) {
  v.innerHTML = '<div class="pagehead"><h2>Record a sale</h2></div><p class="muted">Loading…</p>';
  try { if (!S.products.length) S.products = (await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY, apikey: KEY }, body: JSON.stringify({ action: "info" }) }).then(function (r) { return r.json(); })).products; } catch (e) { v.innerHTML = '<div class="card"><b>' + esc(e.message) + "</b></div>"; return; }
  S.cart = {};
  v.innerHTML = '<div class="pagehead"><h2>Record a sale</h2></div><p class="lead">For a voucher bought by phone or in person. Take the payment first (cash, the card machine or a bank transfer), then record it here. The voucher number is made straight away. This works even when the website sale is switched off.</p>' +
    '<div class="card"><h3>What are they buying?</h3>' + S.products.map(function (p) { return '<div class="qrow"><div class="n"><b>' + esc(p.title) + "</b><small>" + gbp(p.price) + " &middot; save up to " + p.save_pct + '%</small></div><div class="qty"><button type="button" data-rq="-" data-k="' + p.key + '">&minus;</button><output id="rq-' + p.key + '">0</output><button type="button" data-rq="+" data-k="' + p.key + '">+</button></div></div>'; }).join("") +
      '<p style="font-size:20px;margin:12px 0 0"><b>Total <span id="rtotal">£0</span></b></p></div>' +
    '<div class="card"><h3>Who is buying?</h3><div class="grid g2"><div class="f"><label for="rn">Name</label><input id="rn" maxlength="80"></div><div class="f"><label for="rp">Phone</label><input id="rp" type="tel" maxlength="30"></div>' +
      '<div class="f"><label for="re">Email (so we can send the voucher)</label><input id="re" type="email" maxlength="120"></div><div class="f"><label for="rm">How did they pay?</label><select id="rm"><option value="">Choose…</option><option value="card_machine">Card machine</option><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="other">Other</option></select></div></div>' +
      '<div class="f" style="margin-top:12px"><label for="rt">Note (optional)</label><input id="rt" maxlength="300"></div>' +
      '<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="rs" checked> Email the voucher to the buyer (only if an email address is given)</label>' +
      '<div class="notice hide" id="rmsg" style="margin-top:12px"></div><div style="margin-top:14px"><button class="btn" id="rgo" type="button">Record sale and make voucher</button></div></div>';
}
function cartTotal() { return S.products.reduce(function (t, p) { return t + (S.cart[p.key] || 0) * p.price; }, 0); }
document.addEventListener("click", async function (e) {
  var b = e.target.closest("[data-rq]");
  if (b) { var k = b.dataset.k, n = Math.max(0, Math.min(10, (S.cart[k] || 0) + (b.dataset.rq === "+" ? 1 : -1))); S.cart[k] = n; if (!n) delete S.cart[k]; $("#rq-" + k).textContent = n; $("#rtotal").textContent = gbp(cartTotal()); return; }
  if (e.target.id !== "rgo") return;
  var msg = $("#rmsg"), go = e.target; msg.className = "notice bad"; msg.classList.remove("hide");
  var name = $("#rn").value.trim(), method = $("#rm").value;
  if (!Object.keys(S.cart).length) { msg.textContent = "Please choose at least one voucher."; return; }
  if (!name) { msg.textContent = "Please enter the buyer's name."; return; }
  if (!method) { msg.textContent = "Please say how they paid."; return; }
  if (!confirm("Record a sale of " + gbp(cartTotal()) + " to " + name + " (" + $("#rm").selectedOptions[0].textContent + ")?\nOnly do this once the payment has been taken.")) { msg.classList.add("hide"); return; }
  go.disabled = true;
  try {
    var r = await api("admin.record_sale", { name: name, phone: $("#rp").value, email: $("#re").value, pay_method: method, note: $("#rt").value, send_email: $("#rs").checked, items: S.cart });
    $("#views").innerHTML = '<div class="pagehead"><h2>Sale recorded</h2></div><div class="card"><div class="notice ok">' + gbp(r.amount) + " recorded for " + esc(name) + ". " + (r.emailed_buyer ? "The voucher has been emailed to them." : "No voucher email was sent to the buyer.") + (r.emailed_staff ? " The sale email has gone to the GM and stay@." : "") + "</div>" +
      r.vouchers.map(function (x) { return '<p style="margin:0 0 12px"><b>' + esc(x.title) + '</b><br><span class="code" style="font-size:26px;color:var(--sage)">' + esc(x.code) + "</span></p>"; }).join("") +
      '<p class="muted">Give the buyer the voucher number to quote when they phone to book.</p><button class="btn" data-tab="record" type="button">Record another sale</button> <button class="btn ghost" data-tab="vouchers" type="button">See all vouchers</button></div>';
  } catch (err) { go.disabled = false; msg.textContent = err.message; }
});

/* ------------------------------------------------------------- settings */
function ukParts(iso) {
  if (!iso) return { d: "", t: "" };
  var p = {}; new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso)).forEach(function (x) { p[x.type] = x.value; });
  return { d: p.year + "-" + p.month + "-" + p.day, t: p.hour + ":" + p.minute };
}
function ukToIso(d, t) {
  if (!d) return "";
  var a = d.split("-").map(Number), b = (t || "00:00").split(":").map(Number), guess = Date.UTC(a[0], a[1] - 1, a[2], b[0], b[1]);
  var p = ukParts(new Date(guess).toISOString()), g = p.d.split("-").map(Number), h = p.t.split(":").map(Number), shown = Date.UTC(g[0], g[1] - 1, g[2], h[0], h[1]);
  return new Date(guess - (shown - guess)).toISOString();
}
function astonCard(p, cl, ed) {
  var st = { free: '<span class="pill ok">Free</span>', held: '<span class="pill warn">Held while paying</span>', used: '<span class="pill dark">Sold</span>' };
  var rows = cl.codes.map(function (c) {
    return "<tr><td>" + c.position + '</td><td><span class="code">' + esc(c.code) + "</span></td><td>" + (st[c.status] || esc(c.status)) + (c.voucher_status === "voided" ? ' <span class="pill bad">Void</span>' : "") + (c.is_test ? ' <span class="pill warn">Test</span>' : "") + "</td><td>" + esc(c.buyer) + "</td><td>" +
      (ed && c.status === "free" ? '<button class="btn sm ghost" data-codefix="' + esc(c.code) + '" type="button">Correct</button>' : "") + "</td></tr>";
  }).join("");
  return '<div class="card"><h3>' + esc(p.title) + '</h3><div class="notice ' + (p.active ? "ok" : "warn") + '">' + (p.active ? "On sale on the website (when the website sale is on)." : "Not on sale yet. Check the codes below against the email from Aston Workshop, correct any that are wrong, then switch it on.") + " " + cl.remaining + " of " + cl.codes.length + " codes left.</div>" +
    '<div class="sw"><input type="checkbox" id="pon" data-pkey="' + esc(p.key) + '"' + (p.active ? " checked" : "") + (ed ? "" : " disabled") + '><label for="pon">The Aston Workshop tour voucher is on sale</label></div>' +
    '<p class="small muted">Each voucher sold takes the next free code, from the top of this list. A code is held for about 50 minutes while a buyer pays, and goes back on the list if they do not. A voided sale does not put its code back: check with Aston Workshop whether to cancel it. When the codes run out the voucher shows as sold out.</p>' +
    '<div class="tw"><table class="t"><thead><tr><th>#</th><th>Code</th><th>Status</th><th>Sold to</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div></div>";
}
async function showSettings(v) {
  v.innerHTML = '<div class="pagehead"><h2>Settings</h2></div><p class="muted">Loading…</p>';
  try {
    var d = await api("admin.settings_get"), s = d.settings; S.settings = s; var o = ukParts(s.opens_at), c = ukParts(s.closes_at), ed = S.me.edit;
    var pool = d.products.filter(function (p) { return p.code_pool; })[0], cl = pool ? await api("admin.codes_list", { product_key: pool.key }) : null;
    v.innerHTML = '<div class="pagehead"><h2>Settings</h2></div>' +
      '<div class="card"><h3>The website sale</h3><div class="notice ' + (d.sale.state === "open" ? "ok" : "warn") + '" id="state">' + (d.sale.state === "open" ? "The vouchers are on sale on the website now." : esc(d.sale.message)) + "</div>" +
      '<div class="sw"><input type="checkbox" id="son"' + (s.sale_on ? " checked" : "") + (ed ? "" : " disabled") + '><label for="son">Vouchers are on sale on the website</label></div>' +
      '<p class="small muted">Tick this when you are ready. If a start time is set below, selling begins at that time; clear it to sell straight away. Untick it at any time to stop sales. Sales recorded by staff are not affected.</p>' +
      '<div class="grid g2"><div class="f"><label>Start selling (UK time, optional)</label><div style="display:flex;gap:8px"><input type="date" id="od" value="' + o.d + '"><input type="time" id="ot" value="' + o.t + '"></div></div>' +
      '<div class="f"><label>Stop selling (UK time, optional)</label><div style="display:flex;gap:8px"><input type="date" id="cd" value="' + c.d + '"><input type="time" id="ct" value="' + c.t + '"></div></div></div></div>' +
      '<div class="card"><h3>Vouchers and emails</h3><div class="grid g2"><div class="f"><label for="em">How long non-stay vouchers last (months)</label><input id="em" type="number" min="1" max="60" value="' + s.expiry_months + '"></div>' +
      '<div class="f"><label for="nt">Sale emails go to</label><input id="nt" value="' + esc((s.notify_to || []).join(", ")) + '"></div></div>' +
      '<p class="small muted">Stay vouchers (the overnight stay and the hot tub suite night) are valid for stays until <b>' + esc(day(s.stay_book_by)) + '</b> (the stay itself must be on or before this date). A change to the months only affects vouchers sold from now on.</p>' +
      '<div class="f" style="margin-top:12px"><label for="tx">Extra terms (shown on the page and in the voucher email)</label><textarea id="tx" placeholder="Leave blank until the wording is agreed. For example refunds, passing a voucher to someone else, dates it cannot be used.">' + esc(s.terms_extra || "") + '</textarea></div>' +
      (ed ? '<div style="margin-top:14px"><button class="btn" id="ssave" type="button">Save settings</button></div>' : "") + "</div>" +
      '<div class="card"><h3>Prices</h3><table class="t"><thead><tr><th>Voucher</th><th>Price</th><th>Normally</th><th>Shown as</th></tr></thead><tbody>' + d.products.map(function (p) { return "<tr><td>" + esc(p.title) + "</td><td>" + gbp(p.price) + "</td><td>" + gbp(p.normal_price) + "</td><td>Save up to " + p.save_pct + "%</td></tr>"; }).join("") + '</tbody></table><p class="small muted" style="margin:10px 0 0">The percentage is worked out from the two prices and rounded down. To change a price, ask for it to be changed.</p></div>' +
      (pool ? astonCard(pool, cl, ed) : "") +
      '<div class="card"><h3>Links</h3><p style="margin:0">Website page: <a href="' + esc(d.page_url) + '" target="_blank" rel="noopener">' + esc(d.page_url) + '</a><br>The page the website shows: <a href="' + esc(d.app_page_url) + '" target="_blank" rel="noopener">' + esc(d.app_page_url) + "</a></p></div>";
  } catch (e) { v.innerHTML = '<div class="card"><b>' + esc(e.message) + "</b></div>"; }
}
document.addEventListener("change", async function (e) {
  if (e.target.id !== "pon") return; var box = e.target;
  try { await api("admin.product_set", { key: box.dataset.pkey, active: box.checked }); toast(box.checked ? "Switched on." : "Switched off."); showSettings($("#views")); } catch (err) { box.checked = !box.checked; toast(err.message, true); }
});
document.addEventListener("click", async function (e) {
  var f = e.target.closest("[data-codefix]"); if (!f) return;
  var nc = prompt("The correct code for " + f.dataset.codefix + ":", f.dataset.codefix); if (!nc || nc.trim().toUpperCase() === f.dataset.codefix) return;
  try { await api("admin.code_set", { code: f.dataset.codefix, new_code: nc }); toast("Code changed."); showSettings($("#views")); } catch (err) { toast(err.message, true); }
});
document.addEventListener("click", async function (e) {
  if (e.target.id !== "ssave") return; var b = e.target; b.disabled = true;
  try {
    var od = $("#od").value, cd = $("#cd").value;
    await api("admin.settings_set", { sale_on: $("#son").checked, opens_at: od ? ukToIso(od, $("#ot").value || "00:00") : "", closes_at: cd ? ukToIso(cd, $("#ct").value || "23:59") : "", expiry_months: Number($("#em").value), notify_to: $("#nt").value, terms_extra: $("#tx").value });
    toast("Settings saved."); showSettings($("#views"));
  } catch (err) { toast(err.message, true); } b.disabled = false;
});

async function boot() {
  $("#gate").style.display = "none"; $("#app").classList.remove("hide"); $("#views").innerHTML = '<p class="muted" style="margin-top:24px">Loading…</p>';
  try { S.me = await api("admin.me"); } catch (e) { $("#views").innerHTML = '<div class="card"><b>' + esc(e.message) + '</b><p class="muted">Open this from the Staff Portal so it knows who you are.</p></div>'; return; }
  $("#whoname").textContent = S.me.name;
  show((TABS.filter(function (t) { return S.me.tabs.indexOf(t[0]) > -1; })[0] || [])[0] || null);
}
if (staffEmail()) boot(); else openGate();
})();
