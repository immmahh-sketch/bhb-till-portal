<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your visit | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--sage:#4D604F;--sage-dark:#3F2F28;--sage-70:#6b6f66;--sage-10:#EEF1EC;--bone:#F8F8F8;--celadon:#CCCDB4;--mist:#E3E5DE;--white:#fff;--ink:#262626;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#3F6A47;--good-bg:#EDF2ED;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2{font-family:var(--display);font-weight:600;margin:0;color:var(--sage-dark);letter-spacing:.01em}
header.top{background:var(--sage);color:var(--white);padding:22px 16px 26px;text-align:center;border-bottom:5px solid var(--celadon)}
header.top img.logo{display:block;margin:0 auto 8px;height:46px;width:auto}
header.top .brand{font-family:var(--display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--celadon)}
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.06);padding:22px 20px;margin:0 0 18px}
.hello{font-size:36px;margin:2px 0 8px;color:var(--sage)}
.pill{display:inline-block;background:var(--sage-10);color:var(--sage-dark);border:1px solid var(--celadon);border-radius:999px;padding:4px 13px;font-size:14px;font-weight:600;margin:2px 6px 2px 0}
.lead{margin:0 0 6px;color:var(--sage-70)}
label.f{display:block;font-weight:600;margin:20px 0 6px}
label.f .req{color:var(--alert);margin-left:4px}
.hint{font-size:14px;color:var(--sage-70);margin:-2px 0 6px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;background:var(--white);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--celadon);border-radius:9px;margin:0 0 8px;cursor:pointer;background:var(--white)}
.opt.on{border-color:var(--sage);background:var(--sage-10)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sage);flex:0 0 auto}
.btn{background:var(--sage);color:var(--white);border:0;border-radius:9px;padding:14px 26px;font:inherit;font-weight:700;letter-spacing:.05em;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.bad label.f{color:var(--alert)}
.bad input,.bad textarea{border-color:var(--alert)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--celadon);border-top-color:var(--sage);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{max-width:720px;margin:0 auto;padding:0 16px 36px;font-size:14px;color:var(--sage-70);text-align:center}
</style>
</head>
<body>
<header class="top"><a href="https://www.blackhorsebeamish.co.uk" target="_blank" rel="noopener" style="display:block"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"></a><div class="brand">Black Horse Beamish</div></header>
<main id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></main>
<footer id="foot"></footer>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/showround-form";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const T = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let D = null;

async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action, t:T }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
function foot(){
  const c = (D && D.contact) || { phone:"01207 232 569", email:"events@blackhorsebeamish.co.uk" };
  $("#foot").innerHTML = 'Need a hand? Phone ' + esc(c.phone) + ' or email <a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>.<br>Black Horse Beamish, Red Row, Beamish, DH9 0RW';
}
function field(q){
  const id = "q_" + q.key, star = q.required ? '<span class="req" aria-hidden="true">*</span>' : "";
  let h = '<div class="qrow" data-key="' + esc(q.key) + '"><label class="f" for="' + id + '">' + esc(q.label) + star + '</label>' + (q.hint ? '<div class="hint">' + esc(q.hint) + '</div>' : "");
  if (q.type === "long") h += '<textarea id="' + id + '" data-key="' + esc(q.key) + '" maxlength="2000">' + esc(q.answer) + '</textarea>';
  else if (q.type === "choice") {
    h += '<div role="radiogroup" aria-label="' + esc(q.label) + '">' + q.options.map((o, i) => '<label class="opt' + (q.answer === o ? " on" : "") + '"><input type="radio" name="' + id + '" value="' + esc(o) + '"' + (q.answer === o ? " checked" : "") + ' data-key="' + esc(q.key) + '"><span>' + esc(o) + '</span></label>').join("") + '</div>';
    if (q.key === "hear") h += '<div id="hearOther" style="display:' + (q.answer === "Other" ? "block" : "none") + '"><input type="text" id="hear_other" maxlength="200" placeholder="Tell us where" value="' + esc(q.other) + '" aria-label="Where did you hear about us?"></div>';
  } else h += '<input type="' + (q.type === "tel" ? "tel" : "text") + '" id="' + id + '" data-key="' + esc(q.key) + '" maxlength="300" value="' + esc(q.answer) + '"' + (q.type === "tel" ? ' inputmode="tel" autocomplete="tel"' : "") + '>';
  return h + '</div>';
}
function render(){
  const d = D;
  const head = '<div class="card"><h1 class="hello">Hello ' + esc(d.first || "there") + '</h1>' +
    '<p style="margin:6px 0 0"><span class="pill">' + esc(d.kind_label) + '</span>' + (d.when ? '<span class="pill">' + esc(d.when) + '</span>' : "") + '</p>';
  if (d.cancelled) { $("#app").innerHTML = head + '<div class="err">This visit has been cancelled. Please contact us if you would like to arrange another.</div></div>'; return; }
  if (d.passed) { $("#app").innerHTML = head + '<p class="lead">This visit has already taken place, so the form is now closed. Thank you.</p></div>'; return; }
  const what = d.kind === "event_showaround" ? "the kind of event you have in mind" : "the day you have in mind";
  $("#app").innerHTML = head + '<p class="lead" style="margin-top:12px">We are looking forward to showing you around. A few questions about ' + what + ' will help us make the most of your visit. It takes about five minutes' +
    (d.submitted_at ? ', and you can change your answers below until your visit.' : ".") + '</p>' +
    (d.submitted_at ? '<div class="ok">Thank you, we have your answers. You can still change them below.</div>' : "") + '<div id="topMsg"></div></div>' +
    '<form class="card" id="form" novalidate>' + d.questions.map(field).join("") + '<div id="msg"></div><p style="margin:24px 0 0"><button type="submit" class="btn" id="go">' + (d.submitted_at ? "Save my changes" : "Send my answers") + '</button></p></form>';
  $("#form").addEventListener("change", e => { const t = e.target; if (t.type === "radio") { t.closest("[role=radiogroup]").querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.contains(t))); if (t.dataset.key === "hear") $("#hearOther").style.display = t.value === "Other" ? "block" : "none"; } });
  $("#form").addEventListener("submit", submit);
}
async function submit(ev){
  ev.preventDefault();
  const answers = {}; let firstBad = null;
  D.questions.forEach(q => {
    let v = "";
    if (q.type === "choice") { const c = document.querySelector('input[name="q_' + q.key + '"]:checked'); v = c ? c.value : ""; }
    else v = ($("#q_" + q.key).value || "").trim();
    answers[q.key] = v;
    const row = document.querySelector('.qrow[data-key="' + q.key + '"]'); const bad = q.required && !v;
    row.classList.toggle("bad", bad); if (bad && !firstBad) firstBad = row;
  });
  if (answers.hear === "Other") answers.hear_other = ($("#hear_other").value || "").trim();
  const msg = $("#msg"); msg.innerHTML = "";
  if (firstBad) { msg.innerHTML = '<div class="err">Please answer the questions marked with a star.</div>'; firstBad.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Sending...";
  try {
    await call("form.save", { answers });
    D.submitted_at = new Date().toISOString();
    D.questions.forEach(q => { q.answer = answers[q.key] || ""; if (q.key === "hear") q.other = answers.hear_other || ""; });
    window.scrollTo({ top:0, behavior:"smooth" }); render();
    $("#topMsg").innerHTML = '<div class="ok">Thank you, we have your answers. We look forward to seeing you on ' + esc(D.when) + '.</div>';
  } catch (e) { msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; btn.disabled = false; btn.textContent = D.submitted_at ? "Save my changes" : "Send my answers"; }
}
(async function(){
  if (!T) { $("#app").innerHTML = '<div class="card"><div class="err">This link is incomplete. Please use the link in your email.</div></div>'; foot(); return; }
  try { D = await call("form.get"); render(); }
  catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; }
  foot();
})();
</script>
</body>
</html>
