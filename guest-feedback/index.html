<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Feedback — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28;
  --bone:#F8F8F8; --celadon:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --olive:#CCCDB4; --brown:#3F2F28;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1040px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; font-size:12px; opacity:.9}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--olive)}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 14px}
.pagehead h2{font-size:26px; color:var(--sage)} .pagehead .hint{font-size:13px; color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px} .btn:disabled{opacity:.5; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.card h4{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:16px 0 8px; font-family:var(--body)}
.card p{margin:0 0 10px}
.sechead{font-family:var(--display); font-size:28px; color:var(--sage); margin:26px 0 10px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap} .sechead small{font-family:var(--body); font-size:13px; color:var(--sage-70)}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:8px 16px; cursor:pointer; font-size:13px; min-height:40px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.filters select{padding:9px 12px; border:1px solid var(--mist); border-radius:8px; background:var(--white)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.kpi .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.kpi .v{font-family:var(--display); font-size:36px; color:var(--sage); line-height:1.1} .kpi .s{font-size:12px; color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px} .grid2 > .card{margin-bottom:0}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:90px; resize:vertical} .field input[type=number]{max-width:140px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.sw{display:flex; align-items:center; gap:10px; margin-bottom:14px} .sw input{width:22px; height:22px; margin:0} .sw label{font-weight:600}
.note{background:var(--attention-bg); color:#6d5320; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:12px}
.muted{color:var(--sage-70)} .empty{padding:36px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.good{background:var(--good-bg); color:var(--good)} .tag.bad{background:var(--alert-bg); color:var(--alert)} .tag.gold{background:var(--attention-bg); color:#6d5320}
.resp{border-left:4px solid var(--celadon)} .resp.low{border-left-color:var(--alert)} .resp.high{border-left-color:var(--good)}
.resp .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap} .resp .when{font-size:12px; color:var(--sage-70)}
.resp .qa{padding:7px 0; border-top:1px solid var(--mist); white-space:pre-wrap} .resp .qa b{display:block; font-size:12.5px; color:var(--sage-70); font-weight:600}
details{margin-top:8px} summary{cursor:pointer; font-weight:600; color:var(--sage)}
.quote{padding:10px 0; border-top:1px solid var(--mist); white-space:pre-wrap} .quote:first-child{border-top:0} .quote small{display:block; color:var(--sage-70); font-size:11.5px}
table.t{width:100%; border-collapse:collapse; font-size:13.5px} .t th,.t td{padding:8px; text-align:left; border-bottom:1px solid var(--mist); vertical-align:top}
.t th{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:600} .tw{overflow-x:auto}
.linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--sage-10); border-radius:8px; padding:10px 12px; margin:10px 0; word-break:break-all; font-size:14px}
.qe{border:1px solid var(--mist); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--bone)}
.qe .head{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:720px){ .grid2,.row2{grid-template-columns:1fr} }
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .btn{width:100%} .btn.small{width:auto} .pagehead h2{font-size:22px} }
.kpi.click{cursor:pointer;transition:box-shadow .15s,transform .15s}.kpi.click:hover{box-shadow:0 6px 18px rgba(0,0,0,.14);transform:translateY(-1px)}.kpi.click .s b{color:#8A1C2B;text-decoration:underline}
.sechead small.click{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.rbg{position:fixed;inset:0;background:rgba(38,38,38,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
.rbox{background:#fff;border-radius:14px;border-top:3px solid #C1A51D;max-width:780px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(38,38,38,.35);color:#262626}
.rbox h3{margin:0 0 4px;font-size:26px}
.rbox .sum{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.rbox table{width:100%;border-collapse:collapse;font-size:14px}.rbox th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B5B5B;padding:6px 8px;border-bottom:2px solid #C1A51D}
.rbox td{padding:9px 8px;border-bottom:1px solid #E3E5DE;vertical-align:top}.rbox tr.rr{cursor:pointer}.rbox tr.rr:hover td{background:#F7F4EA}
.rbox .sc{display:inline-block;min-width:32px;text-align:center;border-radius:999px;padding:2px 9px;font-weight:700;font-size:13px}
.rbox .sc.good{background:#DCE9DC;color:#2F5B31}.rbox .sc.gold{background:#F4EFD3;color:#6B5B20}.rbox .sc.bad{background:#F3DAD6;color:#8C2F2F}.rbox .sc.none{background:#EEE;color:#777}
.rbox .qa{margin:0 0 8px}.rbox .qa b{display:block;font-weight:600;font-size:13px;color:#6B5B5B}.rbox .qa .a{font-size:15px}
.rbox .catb{margin:14px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A1C2B;font-weight:700;border-bottom:1px solid #E3E5DE;padding-bottom:2px}
.rbox .cm{background:#F7F4EA;border-left:4px solid #C1A51D;border-radius:6px;padding:8px 12px;margin:0 0 8px;white-space:pre-wrap}
.rbox .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Guest Feedback</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Guest Feedback<small>Black Horse Beamish</small></div><div class="who" id="whoname"></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist">
    <button class="tabbtn" data-view="dashboard" hidden>Dashboard</button>
    <button class="tabbtn" data-view="responses" hidden>Responses</button>
    <button class="tabbtn" data-view="send" hidden>Send a form</button>
    <button class="tabbtn" data-view="stays" hidden>Stays</button>
    <button class="tabbtn" data-view="reviews" hidden>Reviews</button>
    <button class="tabbtn" data-view="settings" hidden>Settings</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/shared/insights.js"></script>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { editBase:null, scores:null, me:null, view:"dashboard", data:null, formUrl:"", src:"all", range:"90", respKind:"all", respFlag:"all", forms:null, fk:"mystery", settings:null, qs:null, reqs:null };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = Viz.esc;
const KIND_NAME = { mystery:"Mystery guest", showround:"Wedding showround", guest:"Guest feedback", noshow:"Showround no-show", stay:"Hotel stay" };
const SRC = [["all","Everything"],["mystery","Mystery guests"],["showround","Wedding showrounds"],["guest","Guest feedback"],["stay","Hotel stays"],["noshow","No-shows"],["reviews","All reviews"],["tripadvisor","TripAdvisor"],["google","Google"]];
const fmtDT = iso => { try { return new Date(iso).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }).replace(",",""); } catch(e){ return String(iso||"").slice(0,16); } };
const fmtD = d => { if(!d) return "Undated"; try { return new Date(String(d).slice(0,10)+"T12:00:00Z").toLocaleDateString("en-GB",{ timeZone:"UTC", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return d; } };
const monthKey = iso => String(iso).slice(0,7);
const monthLab = k => { const [y,m] = k.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1] + " " + y.slice(2); };
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/feedback-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
function copy(text, ok){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok || "Copied."), () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast(ok || "Copied."); } catch(e){ toast("Could not copy. Select the text and copy it.", true); } t.remove(); }); }
const can = tab => S.me && (S.me.isAdmin || S.me.tabs.includes(tab));

/* =========================================================== dashboard */
const isFormSrc = s => ["mystery","showround","guest","noshow","stay"].includes(s);
function rangeFrom(){ if (S.range === "all") return ""; const d = new Date(); d.setDate(d.getDate() - +S.range); return d.toISOString().slice(0,10); }
async function viewDashboard(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  try { S.data = await call("data.load", {}); } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  paintDashboard();
}
function paintDashboard(){
  const d = S.data, from = rangeFrom(), v = $("#views");
  const resp = d.responses.filter(r => (S.src === "all" ? r.kind !== "noshow" : r.kind === S.src) && (!from || String(r.submitted_at).slice(0,10) >= from));
  const revs = d.reviews.filter(r => (S.src === "all" || S.src === "reviews" || r.platform === S.src) && (!from || (r.reviewed_on && r.reviewed_on >= from) || (!r.reviewed_on && S.range === "all")));
  const showForms = S.src === "all" || isFormSrc(S.src), showRevs = S.src === "all" || S.src === "reviews" || S.src === "tripadvisor" || S.src === "google";
  let h = `<div class="pagehead"><h2>Dashboard</h2><span class="hint">What guests tell us, and what they say about us online.</span></div>
  <div class="chips">${SRC.map(([k,l]) => `<button class="chip" data-src="${k}" aria-pressed="${S.src===k}">${l}</button>`).join("")}</div>
  <div class="filters"><label class="muted" for="rng">Period</label><select id="rng">${[["30","Last 30 days"],["90","Last 90 days"],["365","Last 12 months"],["all","All time"]].map(([k,l]) => `<option value="${k}" ${S.range===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
  if (showForms) h += formsBlock(resp, d);
  if (showRevs) h += reviewsBlock(revs);
  v.innerHTML = h;
  $$(".chip[data-src]").forEach(b => b.onclick = () => { S.src = b.dataset.src; paintDashboard(); });
  $("#rng").onchange = e => { S.range = e.target.value; paintDashboard(); };
  // the response count opens the responses: each one, the Net Promoter Score, then the full answers
  const sentFor = (S.src === "all" ? ["mystery","showround","stay"] : (S.src === "guest" ? [] : [S.src])).reduce((t,k) => t + ((d.requests[k]||{}).sent||0), 0);
  const openList = () => respOpen(resp, (S.src === "all" ? "Feedback forms" : KIND_NAME[S.src]) + ": responses", (S.src === "stay" || S.src === "showround") && sentFor ? sentFor + " email" + (sentFor === 1 ? "" : "s") + " sent" : "");
  ["#openResp", "#kpiResp"].forEach(sel => { const el = $(sel); if (el) { el.onclick = openList; el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openList(); } }; } });
}
function ratingValues(r){ return (r.questions || []).filter(q => q.type === "rating").map(q => ({ q, v:Number(r.answers[q.id]) })).filter(x => x.v >= 1 && x.v <= 5); }
function textAnswers(r){ return (r.questions || []).filter(q => q.type === "text").map(q => ({ q, t:String(r.answers[q.id] || "").trim() })).filter(x => x.t); }
/* ---- click the response count: the responses, the Net Promoter Score, then each full response */
const stayD = d => d ? fmtD(d) : "";
const stayLine = r => { const s = r.stay; if (!s) return ""; return [s.room ? "Room " + esc(s.room) : "", s.arrival ? "checked in " + esc(stayD(s.arrival)) : "", s.departure ? "checked out " + esc(stayD(s.departure)) : ""].filter(Boolean).join(" &middot; "); };
const scClass = n => n == null ? "none" : n >= 9 ? "good" : n <= 6 ? "bad" : "gold";
function npsOfList(list){ const v = list.map(r => r.nps).filter(n => n != null), pro = v.filter(n => n >= 9).length, det = v.filter(n => n <= 6).length; return { n:v.length, pro, det, pas:v.length - pro - det, score:v.length ? Math.round((pro - det) / v.length * 100) : null }; }
function respClose(){ const m = $("#rbg"); if (m) m.remove(); document.removeEventListener("keydown", respKey); }
function respKey(e){ if (e.key === "Escape") respClose(); }
function respOpen(list, title, sentNote){
  respClose();
  const m = document.createElement("div"); m.className = "rbg"; m.id = "rbg"; document.body.appendChild(m);
  m.addEventListener("click", e => { if (e.target === m) respClose(); }); document.addEventListener("keydown", respKey);
  const rows = list.slice().sort((a, b) => String(b.submitted_at).localeCompare(String(a.submitted_at)));
  const listView = () => {
    const n = npsOfList(rows);
    m.innerHTML = `<div class="rbox"><h3>${esc(title)}</h3><div class="muted">${rows.length} response${rows.length === 1 ? "" : "s"}${sentNote ? " &middot; " + sentNote : ""}. Press a response to read it in full.</div>
      <div class="sum"><span class="tag ${n.score == null ? "" : n.score >= 50 ? "good" : n.score >= 0 ? "gold" : "bad"}">Net Promoter Score ${n.score == null ? "&ndash;" : (n.score > 0 ? "+" : "") + n.score}</span><span class="tag good">Promoters ${n.pro}</span><span class="tag gold">Passives ${n.pas}</span><span class="tag bad">Detractors ${n.det}</span><span class="muted">from ${n.n} recommend score${n.n === 1 ? "" : "s"} (promoters 9 or 10, detractors 6 or less)</span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>When</th><th>Guest</th>${rows.some(r => r.stay) ? "<th>Room</th><th>In</th><th>Out</th>" : ""}<th>Recommend</th><th>Average</th><th>Comment</th></tr></thead><tbody>${rows.map((r, i) => { const t = textAnswers(r)[0]; return `<tr class="rr" data-i="${i}"><td class="small">${esc(fmtDT(r.submitted_at))}</td><td><b>${esc(r.guest_name || "No name given")}</b></td>${rows.some(x => x.stay) ? `<td><b>${esc((r.stay || {}).room || "")}</b></td><td class="small">${esc(stayD((r.stay || {}).arrival))}</td><td class="small">${esc(stayD((r.stay || {}).departure))}</td>` : ""}<td><span class="sc ${scClass(r.nps)}">${r.nps == null ? "&ndash;" : r.nps}</span></td><td>${r.avg == null ? "&ndash;" : Viz.f1(r.avg) + " / 5"}</td><td class="small muted">${t ? esc(t.t.length > 90 ? t.t.slice(0, 90) + "…" : t.t) : ""}</td></tr>`; }).join("")}</tbody></table></div>
      <div class="acts"><button class="btn ghost" id="rclose">Close</button></div></div>`;
    $("#rclose").onclick = respClose; m.querySelectorAll("tr.rr").forEach(tr => tr.onclick = () => detail(rows[Number(tr.dataset.i)]));
  };
  const detail = r => {
    const cats = []; (r.questions || []).forEach(q => { const a = r.answers[q.id]; if (a == null || a === "") return; const k = q.category || "General"; let c = cats.find(x => x.k === k); if (!c) cats.push(c = { k, items:[] }); c.items.push({ q, a }); });

function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === "\t") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
function parseDate(s){

    <p class="muted" style="font-size:13px">Always left out: function rooms, a second room for the same guest on the same day, and anyone with no email address.</p>
    <button class="btn" id="y_save">Save</button> <button class="btn ghost" id="y_test">Email me a test</button>
    <p class="muted" style="font-size:13px;margin-top:8px">The test goes only to you, with a link that shows the form but saves nothing.</p></div>`;
  h += `<div class="card"><h3>Alert for a low score</h3><div class="sw"><input type="checkbox" id="a_on" ${s.alert_on ? "checked" : ""}><label for="a_on">Email me when someone scores us low</label></div>
    <div class="field"><label>Send it to</label><input id="a_to" value="${esc(s.alert_email || "")}" placeholder="name@blackhorsebeamish.co.uk"></div><button class="btn" id="a_save">Save</button></div>`;
  $("#views").innerHTML = h;
  $$("[data-fk]").forEach(b => b.onclick = () => { S.fk = b.dataset.fk; S.qs = JSON.parse(JSON.stringify(S.forms.find(x => x.kind === S.fk).questions || [])); paintSettings(); });
  $("#qlist").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; readQs(); const i = +b.closest(".qe").dataset.i, a = b.dataset.act; if (a === "del") S.qs.splice(i, 1); else if (a === "up" && i > 0) [S.qs[i-1], S.qs[i]] = [S.qs[i], S.qs[i-1]]; else if (a === "down" && i < S.qs.length - 1) [S.qs[i+1], S.qs[i]] = [S.qs[i], S.qs[i+1]]; $("#qlist").innerHTML = qEditor(); });
  $("#qlist").addEventListener("change", e => { if (e.target.dataset.f === "type") { readQs(); const q = S.qs[+e.target.closest(".qe").dataset.i]; if (q.type === "choice" && !(q.options || []).length) q.options = ["Yes", "No"]; $("#qlist").innerHTML = qEditor(); } });
  $("#addq").onclick = () => { readQs(); S.qs.push({ type:"rating", label:"", category:"General", required:true }); $("#qlist").innerHTML = qEditor(); };
  $("#saveform").onclick = async () => {
    readQs(); const b = $("#saveform"); b.disabled = true;
    try { const r = await call("forms.save", ((o) => { if (isNo) { delete o.high_message; delete o.low_message; delete o.tripadvisor_url; delete o.google_url; delete o.high_nps; delete o.high_avg; } return o; })({ kind:S.fk, title:$("#f_title").value, opening:$("#f_open").value, thanks:$("#f_thanks").value, high_message:(($("#f_high")||{}).value), low_message:(($("#f_low")||{}).value), tripadvisor_url:(($("#f_ta")||{}).value), google_url:(($("#f_g")||{}).value), high_nps:+(($("#f_hn")||{}).value), high_avg:+(($("#f_ha")||{}).value), questions:S.qs.filter(q => String(q.label || "").trim()) })); const i = S.forms.findIndex(x => x.kind === S.fk); S.forms[i] = r.form; S.qs = JSON.parse(JSON.stringify(r.form.questions)); toast("Saved."); paintSettings(); } catch(e){ toast(e.message, true); } finally { b.disabled = false; }
  };
  const saveS = async (patch, msg) => { try { const r = await call("settings.save", patch); S.settings = r.settings; toast(msg || "Saved."); paintSettings(); } catch(e){ toast(e.message, true); } };
  if ($("#e_save")) {
    $("#e_save").onclick = () => saveS({ auto_showround:$("#e_on").checked, delay_hours:+$("#e_h").value, email_subject:$("#e_sub").value, email_heading:$("#e_head").value, email_body:$("#e_body").value }, $("#e_on").checked ? "Saved. The automatic email is ON." : "Saved. The automatic email is OFF.");
    $("#e_test").onclick = async () => { const b = $("#e_test"); b.disabled = true; try { const r = await call("showround.test"); toast("Test sent to " + r.sent_to + "."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  }
  if ($("#n_save")) {
    $("#n_save").onclick = () => saveS({ auto_noshow:$("#n_on").checked, noshow_subject:$("#n_sub").value, noshow_heading:$("#n_head").value, noshow_body:$("#n_body").value, noshow_wedding_url:$("#n_wed").value, noshow_event_url:$("#n_evt").value }, $("#n_on").checked ? "Saved. The no-show email is ON." : "Saved. The no-show email is OFF.");
    $("#n_test").onclick = async () => { const b = $("#n_test"); b.disabled = true; try { const r = await call("noshow.test"); toast("Test sent to " + r.sent_to + "."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  }
  if ($("#y_save")) {
    $("#y_save").onclick = () => saveS({ auto_stay:$("#y_on").checked, stay_subject:$("#y_sub").value, stay_heading:$("#y_head").value, stay_body:$("#y_body").value, stay_skip_relay:$("#y_relay").checked, stay_skip_wedding:$("#y_wed").checked, stay_repeat_days:+$("#y_rep").value }, $("#y_on").checked ? "Saved. The stay email is ON." : "Saved. The stay email is OFF.");
    $("#y_test").onclick = async () => { const b = $("#y_test"); b.disabled = true; try { const r = await call("stay.test"); toast("Test sent to " + r.sent_to + "."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  }
  $("#a_save").onclick = () => saveS({ alert_on:$("#a_on").checked, alert_email:$("#a_to").value });
}

/* =========================================================== stays */
/* Two Rezlynx reports, read here in the browser (nothing is uploaded as a file): the Reservations report (.xls) and the Sales and Marketing query (.csv). */
function loadScript(src){ return new Promise((ok, bad) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Could not load the spreadsheet reader. Check your connection and try again.")); document.head.appendChild(s); }); }
function parseCsv(text){
  const rows = []; let row = [], cur = "", q = false;
  text = String(text).replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); cur = ""; if (row.some(x => x !== "")) rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); if (row.some(x => x !== "")) rows.push(row); }
  return rows;
}
const MON = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
function isoDay(t){ const m = /^(\d{1,2})\/([A-Za-z]{3})[a-z]*\/(\d{4})/.exec(String(t || "").trim()); if (!m || !MON[m[2].toLowerCase()]) return ""; return m[3] + "-" + String(MON[m[2].toLowerCase()]).padStart(2,"0") + "-" + m[1].padStart(2,"0"); }
/* The reservations report is one block per booking: "BookRef: | BK027380/1 | Ref:", then rows of "Label: | value" pairs. */
function parseReservations(rows){
  const out = []; let cur = null; const keys = { "Guest:":"guest", "Room Type:":"room_type", "Arrival:":"arrival", "Departure:":"departure", "Package:":"package", "Status:":"status" };
  rows.forEach(r => {
    const f = r.map(c => c == null ? "" : String(c).trim()).filter(Boolean); if (!f.length) return;
    if (f[0] === "BookRef:") { cur = { ref: (f[1] || "").split("/")[0] }; out.push(cur); return; }
    if (!cur) return;
    f.forEach((x, i) => { const k = keys[x]; if (k && !(k in cur) && f[i+1] != null && !/:$/.test(f[i+1])) cur[k] = f[i+1]; });
  });
  return out.map(b => ({ ref:b.ref, guest:b.guest || "", room_type:b.room_type || "", package:b.package || "", arrival:isoDay(b.arrival), departure:isoDay(b.departure), status:b.status || "" })).filter(b => b.ref);
}
function parseEmails(text){
  const rows = parseCsv(text); if (rows.length < 2) return [];
  const h = rows[0].map(x => x.trim().toLowerCase()), ix = n => h.indexOf(n), iRef = ix("bookref"), iE = ix("email"), iF = ix("forename"), iS = ix("surname"), iN = h.findIndex(x => /stays/.test(x));
  if (iRef < 0 || iE < 0) throw new Error("That does not look like the email list. It needs the columns BookRef and Email.");
  return rows.slice(1).map(r => ({ ref:(r[iRef] || "").trim(), email:(r[iE] || "").trim(), forename:iF >= 0 ? (r[iF] || "").trim() : "", surname:iS >= 0 ? (r[iS] || "").trim() : "", stays:iN >= 0 ? (r[iN] || "").trim() : "" })).filter(x => x.ref);
}
const STAY_STATE = { queued:["Waiting to send", "gold"], sent:["Emailed", "good"], skipped:["Not emailed", ""] };
async function viewStays(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  let d; try { d = await call("stays.list"); } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  S.stays = d; paintStays();
}
function paintStays(msg){
  const d = S.stays, s = d.settings || {}, rows = d.stays || [];
  const next = dep => fmtD(new Date(new Date(dep + "T12:00:00Z").getTime() + 864e5).toISOString().slice(0,10));
  const nQ = rows.filter(r => r.status === "queued").length, nS = rows.filter(r => r.status === "sent").length, nA = rows.filter(r => r.answered).length;
  let h = `<div class="pagehead"><h2>Hotel stays</h2><span class="hint">Who checked out, and who is emailed to ask how it went.</span></div>
  <div class="note">${s.auto_stay ? "The automatic email is ON. Each guest below marked “Waiting to send” is emailed at " + (s.send_hour || 10) + "am the morning after they check out." : "The automatic email is OFF, so nothing below is sent. Switch it on in Settings, under Hotel stay form, once you have sent yourself a test."}</div>
  <div class="card"><h3>Add today's reports</h3>
    <p class="muted" style="font-size:13.5px;margin-top:0">From Rezlynx, once a day: the <b>Reservations report</b> (the departures report, with Checked Out in the statuses, saved as .xls) and the <b>Sales and Marketing query</b> (the .csv with BookRef, Forename, Surname, Email). The two are matched on the booking reference. Adding the same reports twice does no harm.</p>
    <div class="row2"><div class="field"><label>Reservations report (.xls)</label><input type="file" id="st_xls" accept=".xls,.xlsx"></div><div class="field"><label>Sales and Marketing query (.csv)</label><input type="file" id="st_csv" accept=".csv,text/csv"></div></div>
    <button class="btn" id="st_go">Add to the list</button>
    ${msg ? `<div class="note" style="margin-top:12px">${msg}</div>` : ""}</div>
  <div class="card"><h3>The last 45 days</h3>
    <p class="muted" style="margin-top:0">${rows.length} stays · ${nQ} waiting · ${nS} emailed · ${nA} answered</p>
    ${rows.length ? `<div class="tw"><table class="t"><thead><tr><th>Left</th><th>Guest</th><th>Email</th><th>Rate</th><th>Stays</th><th>What happens</th><th></th></tr></thead><tbody>${rows.map(r => { const st = STAY_STATE[r.status] || [r.status, ""];
      return `<tr><td>${fmtD(r.departure)}</td><td>${esc(r.guest_name || "")}</td><td>${esc(r.email || "")}</td><td>${esc(r.package || "")}</td><td>${r.stays_count == null ? "" : r.stays_count}</td>
      <td><span class="tag ${st[1]}">${st[0]}</span> ${r.status === "queued" ? `<span class="muted">${s.auto_stay ? "on " + next(r.departure) : "(automatic email is off)"}</span>` : r.status === "sent" ? `<span class="muted">${fmtDT(r.sent_at)}</span>${r.answered ? ` <span class="tag good">Answered</span>` : ""}` : `<span class="muted">${esc(r.skip_reason || "")}</span>`}</td>
      <td>${r.status === "queued" ? `<button class="btn ghost small" data-skip="${esc(r.book_ref)}">Do not send</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">No stays yet. Add the two reports above.</div>`}</div>`;
  $("#views").innerHTML = h;
  $$("[data-skip]").forEach(b => b.onclick = async () => { b.disabled = true; try { await call("stays.skip", { book_ref:b.dataset.skip }); toast("Taken off the list."); viewStays(); } catch(e){ toast(e.message, true); b.disabled = false; } });
  $("#st_go").onclick = async () => {
    const x = $("#st_xls").files[0], c = $("#st_csv").files[0]; if (!x || !c) { toast("Choose both files first.", true); return; }
    const b = $("#st_go"); b.disabled = true; b.textContent = "Reading…";
    try {
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb = XLSX.read(await x.arrayBuffer(), { type:"array" }), sheet = wb.Sheets[wb.SheetNames[0]];
      const departures = parseReservations(XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:"" }));
      if (!departures.length) throw new Error("No bookings were found in the reservations report. Is it the right file?");
      const emails = parseEmails(await c.text());
      const r = await call("stays.import", { departures, emails });
      const sk = Object.entries(r.skipped || {}).map(([k, n]) => `${n} ${esc(k)}`).join(", ");
      const m = `Read ${departures.length} bookings, ${r.checked_out} checked out. <b>${r.queued}</b> added to the list to be emailed${sk ? "; not emailed: " + sk : ""}${r.already_known ? "; " + r.already_known + " already on the list" : ""}.`;
      S.stays = await call("stays.list"); paintStays(m);
    } catch(e){ toast(e.message, true); b.disabled = false; b.textContent = "Add to the list"; }
  };
}

/* =========================================================== shell */
function goView(v){
  S.view = v; $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  ({ dashboard:viewDashboard, responses:viewResponses, send:viewSend, stays:viewStays, reviews:viewReviews, settings:viewSettings }[v] || viewDashboard)();
  window.scrollTo(0, 0);
}
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.formUrl = d.form_url; $("#whoname").textContent = S.me.name;
  const tabs = $$(".tabbtn").filter(b => can(b.dataset.view)); $$(".tabbtn").forEach(b => { b.hidden = !tabs.includes(b); b.addEventListener("click", () => goView(b.dataset.view)); });

  goView(tabs[0].dataset.view);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
