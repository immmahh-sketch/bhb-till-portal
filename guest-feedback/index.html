<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest Feedback — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1040px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; font-size:12px; opacity:.9}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 14px}
.pagehead h2{font-size:26px; color:var(--sage)} .pagehead .hint{font-size:13px; color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px} .btn:disabled{opacity:.5; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.card h4{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:16px 0 8px; font-family:var(--body)}
.card p{margin:0 0 10px}
.sechead{font-family:var(--display); font-size:28px; color:var(--sage); margin:26px 0 10px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap} .sechead small{font-family:var(--body); font-size:13px; color:var(--sage-70)}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:8px 16px; cursor:pointer; font-size:13px; min-height:40px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.filters select{padding:9px 12px; border:1px solid var(--mist); border-radius:8px; background:var(--white)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.kpi .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.kpi .v{font-family:var(--display); font-size:36px; color:var(--sage); line-height:1.1} .kpi .s{font-size:12px; color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px} .grid2 > .card{margin-bottom:0}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:90px; resize:vertical} .field input[type=number]{max-width:140px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.sw{display:flex; align-items:center; gap:10px; margin-bottom:14px} .sw input{width:22px; height:22px; margin:0} .sw label{font-weight:600}
.note{background:var(--attention-bg); color:#6d5320; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:12px}
.muted{color:var(--sage-70)} .empty{padding:36px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.good{background:var(--good-bg); color:var(--good)} .tag.bad{background:var(--alert-bg); color:var(--alert)} .tag.gold{background:var(--attention-bg); color:#6d5320}
.resp{border-left:4px solid var(--celadon)} .resp.low{border-left-color:var(--alert)} .resp.high{border-left-color:var(--good)}
.resp .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap} .resp .when{font-size:12px; color:var(--sage-70)}
.resp .qa{padding:7px 0; border-top:1px solid var(--mist); white-space:pre-wrap} .resp .qa b{display:block; font-size:12.5px; color:var(--sage-70); font-weight:600}
details{margin-top:8px} summary{cursor:pointer; font-weight:600; color:var(--sage)}
.quote{padding:10px 0; border-top:1px solid var(--mist); white-space:pre-wrap} .quote:first-child{border-top:0} .quote small{display:block; color:var(--sage-70); font-size:11.5px}
table.t{width:100%; border-collapse:collapse; font-size:13.5px} .t th,.t td{padding:8px; text-align:left; border-bottom:1px solid var(--mist); vertical-align:top}
.t th{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:600} .tw{overflow-x:auto}
.linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--sage-10); border-radius:8px; padding:10px 12px; margin:10px 0; word-break:break-all; font-size:14px}
.qe{border:1px solid var(--mist); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--bone)}
.qe .head{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:720px){ .grid2,.row2{grid-template-columns:1fr} }
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .btn{width:100%} .btn.small{width:auto} .pagehead h2{font-size:22px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Guest Feedback</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Guest Feedback<small>Black Horse Beamish</small></div><div class="who" id="whoname"></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist">
    <button class="tabbtn" data-view="dashboard" hidden>Dashboard</button>
    <button class="tabbtn" data-view="responses" hidden>Responses</button>
    <button class="tabbtn" data-view="send" hidden>Send a form</button>
    <button class="tabbtn" data-view="reviews" hidden>Reviews</button>
    <button class="tabbtn" data-view="settings" hidden>Settings</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/shared/insights.js"></script>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { me:null, view:"dashboard", data:null, formUrl:"", src:"all", range:"90", respKind:"all", respFlag:"all", forms:null, fk:"mystery", settings:null, qs:null, reqs:null };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = Viz.esc;
const KIND_NAME = { mystery:"Mystery guest", showround:"Wedding showround", guest:"Guest feedback", noshow:"Showround no-show" };
const SRC = [["all","Everything"],["mystery","Mystery guests"],["showround","Wedding showrounds"],["guest","Guest feedback"],["noshow","No-shows"],["reviews","All reviews"],["tripadvisor","TripAdvisor"],["google","Google"]];
const fmtDT = iso => { try { return new Date(iso).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }).replace(",",""); } catch(e){ return String(iso||"").slice(0,16); } };
const fmtD = d => { if(!d) return "Undated"; try { return new Date(String(d).slice(0,10)+"T12:00:00Z").toLocaleDateString("en-GB",{ timeZone:"UTC", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return d; } };
const monthKey = iso => String(iso).slice(0,7);
const monthLab = k => { const [y,m] = k.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1] + " " + y.slice(2); };
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/feedback-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
function copy(text, ok){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast(ok || "Copied."), () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast(ok || "Copied."); } catch(e){ toast("Could not copy. Select the text and copy it.", true); } t.remove(); }); }
const can = tab => S.me && (S.me.isAdmin || S.me.tabs.includes(tab));

/* =========================================================== dashboard */
const isFormSrc = s => ["mystery","showround","guest","noshow"].includes(s);
function rangeFrom(){ if (S.range === "all") return ""; const d = new Date(); d.setDate(d.getDate() - +S.range); return d.toISOString().slice(0,10); }
async function viewDashboard(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  try { S.data = await call("data.load", {}); } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  paintDashboard();
}
function paintDashboard(){
  const d = S.data, from = rangeFrom(), v = $("#views");
  const resp = d.responses.filter(r => (S.src === "all" ? r.kind !== "noshow" : r.kind === S.src) && (!from || String(r.submitted_at).slice(0,10) >= from));
  const revs = d.reviews.filter(r => (S.src === "all" || S.src === "reviews" || r.platform === S.src) && (!from || (r.reviewed_on && r.reviewed_on >= from) || (!r.reviewed_on && S.range === "all")));
  const showForms = S.src === "all" || isFormSrc(S.src), showRevs = S.src === "all" || S.src === "reviews" || S.src === "tripadvisor" || S.src === "google";
  let h = `<div class="pagehead"><h2>Dashboard</h2><span class="hint">What guests tell us, and what they say about us online.</span></div>
  <div class="chips">${SRC.map(([k,l]) => `<button class="chip" data-src="${k}" aria-pressed="${S.src===k}">${l}</button>`).join("")}</div>
  <div class="filters"><label class="muted" for="rng">Period</label><select id="rng">${[["30","Last 30 days"],["90","Last 90 days"],["365","Last 12 months"],["all","All time"]].map(([k,l]) => `<option value="${k}" ${S.range===k?"selected":""}>${l}</option>`).join("")}</select></div>`;
  if (showForms) h += formsBlock(resp, d);
  if (showRevs) h += reviewsBlock(revs);
  v.innerHTML = h;
  $$(".chip[data-src]").forEach(b => b.onclick = () => { S.src = b.dataset.src; paintDashboard(); });
  $("#rng").onchange = e => { S.range = e.target.value; paintDashboard(); };
}
function ratingValues(r){ return (r.questions || []).filter(q => q.type === "rating").map(q => ({ q, v:Number(r.answers[q.id]) })).filter(x => x.v >= 1 && x.v <= 5); }
function textAnswers(r){ return (r.questions || []).filter(q => q.type === "text").map(q => ({ q, t:String(r.answers[q.id] || "").trim() })).filter(x => x.t); }
function formsBlock(resp, d){
  let h = `<div class="sechead">${S.src === "all" ? "Feedback forms" : esc(KIND_NAME[S.src])} <small>${resp.length} response${resp.length===1?"":"s"}</small></div>`;
  if (!resp.length) return h + `<div class="card"><div class="empty">${S.src === "noshow" ? "No one has answered the no-show email yet." : "No responses in this period yet." + (can("send") ? " Use “Send a form” to give someone a link." : "")}</div></div>`;
  if (S.src === "noshow") return h + noshowBlock(resp, d);
  const npsVals = resp.map(r => r.nps).filter(n => n != null), pro = npsVals.filter(n => n >= 9).length, det = npsVals.filter(n => n <= 6).length, pas = npsVals.length - pro - det;
  const avgs = resp.map(r => r.avg).filter(a => a != null), highN = resp.filter(r => r.high).length;
  const kinds = S.src === "all" ? ["mystery","showround"] : (S.src === "guest" ? [] : [S.src]);
  const sent = kinds.reduce((t,k) => t + ((d.requests[k]||{}).sent||0), 0), done = kinds.reduce((t,k) => t + ((d.requests[k]||{}).done||0), 0);
  h += `<div class="kpis">
    <div class="kpi"><div class="l">Responses</div><div class="v">${resp.length}</div><div class="s">${sent ? `${done} of ${sent} links sent were used (${Math.round(done/sent*100)}%)` : "in this period"}</div></div>
    <div class="kpi"><div class="l">Net Promoter Score</div><div class="v">${npsVals.length ? ((pro-det)/npsVals.length*100 > 0 ? "+" : "") + Math.round((pro-det)/npsVals.length*100) : "–"}</div><div class="s">${npsVals.length ? `${npsVals.length} recommend scores` : "no recommend scores"}</div></div>
    <div class="kpi"><div class="l">Average rating</div><div class="v">${Viz.f1(Viz.avg(avgs))}<span style="font-size:16px"> / 5</span></div><div class="s">across all rating questions</div></div>
    <div class="kpi"><div class="l">Scored us highly</div><div class="v">${Math.round(highN/resp.length*100)}%</div><div class="s">${highN} sent on to TripAdvisor</div></div></div>`;
  h += `<div class="grid2"><div class="card"><h3>Would they recommend us?</h3><p class="muted">0 to 10. Promoters score 9 or 10, detractors 6 or less.</p>${Viz.npsBar(pro, pas, det)}</div>`;
  const dist = [1,2,3,4,5].map(n => resp.reduce((t,r) => t + ratingValues(r).filter(x => x.v === n).length, 0));
  h += `<div class="card"><h3>Every rating given</h3><p class="muted">How many times each score from 1 to 5 was chosen.</p>${Viz.hist(dist)}</div></div>`;
  // multiple-choice questions (for example "was this a stay, a meal or a drink?")
  const choiceIds = []; resp.forEach(r => (r.questions || []).forEach(x => { if (x.type === "choice" && !choiceIds.some(c => c.id === x.id)) choiceIds.push({ id:x.id, label:x.label }); }));
  h += choiceIds.slice(0, 3).map(c => choiceCard(resp, c.id, c.label)).join("");
  // by area
  const cat = {}; resp.forEach(r => ratingValues(r).forEach(x => { const k = x.q.category || "General"; (cat[k] ||= []).push(x.v); }));
  const areas = Object.keys(cat).map(k => ({ label:k, value:Viz.avg(cat[k]), note:cat[k].length + " ratings" })).sort((a,b) => a.value - b.value);
  if (areas.length) {
    h += `<div class="card" style="margin-top:14px"><h3>How each area scored</h3><p class="muted">Average out of 5, lowest first.</p>${Viz.bars(areas, { max:5, lo:3.5, hi:4.3 })}`;
    if (areas.length > 1) h += `<p style="margin-top:12px"><b>Strongest:</b> ${esc(areas[areas.length-1].label)} (${Viz.f1(areas[areas.length-1].value)}). <b>Needs most attention:</b> ${esc(areas[0].label)} (${Viz.f1(areas[0].value)}).</p>`;
    h += `</div>`;
  }
  // trend
  const byM = {}; resp.forEach(r => { (byM[monthKey(r.submitted_at)] ||= []).push(r); });
  const months = Object.keys(byM).sort();
  if (months.length > 1) {
    h += `<div class="card"><h3>Over time</h3><p class="muted">By month.</p>${Viz.line([{ name:"Average rating", color:"#4E5F4F", values:months.map(m => Viz.avg(byM[m].map(r => r.avg).filter(a => a != null))) }], months.map(monthLab), { min:1, max:5, ticks:4, label:"Average rating by month" })}
      ${npsVals.length ? `<h4>Net Promoter Score by month</h4>${Viz.line([{ name:"NPS", color:"#C9A56B", values:months.map(m => { const n = byM[m].map(r => r.nps).filter(x => x != null); return n.length ? (n.filter(x => x>=9).length - n.filter(x => x<=6).length)/n.length*100 : null; }) }], months.map(monthLab), { min:-100, max:100, ticks:4, fmt:x => (x>0?"+":"")+Math.round(x), label:"NPS by month" })}` : ""}</div>`;
  }
  // words
  const texts = resp.flatMap(r => textAnswers(r).map(x => x.t));
  if (texts.length) {
    const m = Viz.mood(texts), tw = Viz.topWords(texts, 12);
    h += `<div class="card"><h3>What guests wrote</h3><p class="muted">${texts.length} comments. Clearly positive words: ${m.pos}. Clearly negative words: ${m.neg}.</p>${Viz.cloud(texts, { max:60 })}
      ${tw.length ? `<h4>Most mentioned</h4><div class="chips">${tw.map(x => `<span class="tag">${esc(x.w)} · ${x.n}</span>`).join("")}</div>` : ""}</div>`;
    const recent = resp.flatMap(r => textAnswers(r).map(x => ({ r, x }))).slice(0, 8);
    h += `<div class="card"><h3>Latest comments</h3>${recent.map(({r,x}) => `<div class="quote">${esc(x.t)}<small>${esc(x.q.label)} · ${esc(KIND_NAME[r.kind])}${r.guest_name ? " · " + esc(r.guest_name) : ""} · ${fmtD(r.submitted_at)}</small></div>`).join("")}</div>`;
  }
  return h;
}
/** Counts of each answer to a multiple-choice question, as bars. */
function choiceCard(resp, qid, title, help){
  const counts = {}; let n = 0;
  resp.forEach(r => { const a = r.answers && r.answers[qid]; if (a) { counts[a] = (counts[a] || 0) + 1; n++; } });
  const rows = Object.keys(counts).map(k => ({ label:k, value:counts[k], note:Math.round(counts[k] / n * 100) + "%", tone:"n" })).sort((a, b) => b.value - a.value);
  if (!rows.length) return "";
  return `<div class="card"><h3>${esc(title)}</h3>${help ? `<p class="muted">${esc(help)}</p>` : ""}${Viz.bars(rows, { max:rows[0].value, fmt:v => String(v) })}</div>`;
}
function noshowBlock(resp, d){
  const q = (d.requests && d.requests.noshow) || { sent:0, done:0 };
  const again = resp.filter(r => /^yes/i.test(String((r.answers || {}).rebook || ""))).length;

/* =========================================================== reviews */
function parseCsv(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === "\t") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim()));
}
function parseDate(s){
  s = String(s || "").trim(); if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) return `${m[3].length === 2 ? "20" + m[3] : m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const t = Date.parse(s + " 12:00 UTC"); return isNaN(t) ? "" : new Date(t).toISOString().slice(0,10);
}
function readReviews(text, platform){
  const rows = parseCsv(text); if (!rows.length) return [];
  const head = rows[0].map(x => String(x).trim().toLowerCase()), hasHead = head.some(x => /^(rating|stars?|score|text|review|body|date|title)$/.test(x));
  const col = (...names) => head.findIndex(x => names.includes(x));
  const iR = hasHead ? col("rating","stars","star","score") : 0, iT = hasHead ? col("title","headline") : -1, iB = hasHead ? col("text","review","body","comment","content") : -1, iD = hasHead ? col("date","reviewed_on","reviewed","published") : -1, iA = hasHead ? col("author","name","reviewer") : -1, iP = hasHead ? col("platform","site","source") : -1;
  return (hasHead ? rows.slice(1) : rows).map(r => {
    // without a header the order is: rating, date, title, text
    const get = (i, fallback) => String((hasHead ? (i >= 0 ? r[i] : "") : r[fallback]) ?? "").trim();
    const rating = parseInt(String(get(iR, 0)).replace(/[^0-9.]/g, ""), 10);
    const body = hasHead ? get(iB, 3) : (r.slice(3).join(", ").trim());
    const p = hasHead && iP >= 0 ? (/google/i.test(r[iP]) ? "google" : /trip/i.test(r[iP]) ? "tripadvisor" : platform) : platform;
    return { platform:p, rating, title:get(iT, 2), body, reviewed_on:parseDate(get(iD, 1)), author:get(iA, -1) };
  }).filter(x => x.rating >= 1 && x.rating <= 5 && x.body);
}

    <h4>Questions</h4><div id="qlist">${qEditor()}</div>
    <button class="btn ghost small" id="addq">Add a question</button>
    <p class="muted" style="font-size:13px;margin-top:10px">Changing a question here does not alter answers already received. They keep the wording they were given.</p>
    <p><button class="btn" id="saveform">Save this form</button></p></div>`;
  if (S.fk === "showround") h += `<div class="card"><h3>Automatic email after a wedding showround</h3>
    <div class="note">${s.auto_showround ? "This is ON. " : "This is OFF. "}When it is on, anyone who had a wedding showround booked through Calendly is emailed the feedback form once, about ${s.delay_hours} hours afterwards. It only covers showrounds after the moment you switch it on, so nobody from the past is emailed.${S.emailOk ? "" : " Email is not set up on the server yet (Brevo key missing)."}</div>
    <div class="sw"><input type="checkbox" id="e_on" ${s.auto_showround ? "checked" : ""}><label for="e_on">Send the email automatically</label></div>
    <div class="field"><label>Send it this many hours after the showround</label><input type="number" id="e_h" min="2" max="96" value="${s.delay_hours}"></div>
    <div class="field"><label>Subject</label><input id="e_sub" value="${esc(s.email_subject)}"></div>
    <div class="field"><label>Message (use {first_name} for their first name; the button with their personal link is added underneath)</label><textarea id="e_body" rows="9">${esc(s.email_body)}</textarea></div>
    <button class="btn" id="e_save">Save</button> <button class="btn ghost" id="e_test">Email me a test</button>
    <p class="muted" style="font-size:13px;margin-top:8px">The test goes only to you, with a link that shows the form but saves nothing.</p></div>`;
  if (S.fk === "noshow") h += `<div class="card"><h3>Automatic email to a no-show</h3>
    <div class="note">${s.auto_noshow ? "This is ON. " : "This is OFF. "}When it is on, anyone you mark as a no-show in Calendly on a Wedding Tour or Event Show around is emailed once, between 9am and 8pm. It only covers no-shows marked after the moment you switch it on. Nobody is emailed who has already booked another visit, and meetings with couples who are already booked never get it.${S.emailOk ? "" : " Email is not set up on the server yet (Brevo key missing)."}</div>
    <p class="muted" style="font-size:13px">Mark no-shows in Calendly the same evening, or before 10am the next day. The showround feedback email goes out about ${s.delay_hours} hours after a visit and is not sent to anyone marked as a no-show first.</p>
    <div class="sw"><input type="checkbox" id="n_on" ${s.auto_noshow ? "checked" : ""}><label for="n_on">Send the email automatically</label></div>
    <div class="field"><label>Subject</label><input id="n_sub" value="${esc(s.noshow_subject)}"></div>
    <div class="field"><label>Message (use {first_name} for their first name; the two buttons are added underneath, above your sign-off)</label><textarea id="n_body" rows="11">${esc(s.noshow_body)}</textarea></div>
    <div class="row2"><div class="field"><label>Booking page for a Wedding Tour</label><input id="n_wed" value="${esc(s.noshow_wedding_url)}"></div><div class="field"><label>Booking page for an Event Show around</label><input id="n_evt" value="${esc(s.noshow_event_url)}"></div></div>
    <button class="btn" id="n_save">Save</button> <button class="btn ghost" id="n_test">Email me a test</button>
    <p class="muted" style="font-size:13px;margin-top:8px">The test goes only to you. The booking button opens the real booking page, and the form button shows the form but saves nothing.</p></div>`;
  h += `<div class="card"><h3>Alert for a low score</h3><div class="sw"><input type="checkbox" id="a_on" ${s.alert_on ? "checked" : ""}><label for="a_on">Email me when someone scores us low</label></div>
    <div class="field"><label>Send it to</label><input id="a_to" value="${esc(s.alert_email || "")}" placeholder="name@blackhorsebeamish.co.uk"></div><button class="btn" id="a_save">Save</button></div>`;
  $("#views").innerHTML = h;
  $$("[data-fk]").forEach(b => b.onclick = () => { S.fk = b.dataset.fk; S.qs = JSON.parse(JSON.stringify(S.forms.find(x => x.kind === S.fk).questions || [])); paintSettings(); });
  $("#qlist").addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (!b) return; readQs(); const i = +b.closest(".qe").dataset.i, a = b.dataset.act; if (a === "del") S.qs.splice(i, 1); else if (a === "up" && i > 0) [S.qs[i-1], S.qs[i]] = [S.qs[i], S.qs[i-1]]; else if (a === "down" && i < S.qs.length - 1) [S.qs[i+1], S.qs[i]] = [S.qs[i], S.qs[i+1]]; $("#qlist").innerHTML = qEditor(); });
  $("#qlist").addEventListener("change", e => { if (e.target.dataset.f === "type") { readQs(); const q = S.qs[+e.target.closest(".qe").dataset.i]; if (q.type === "choice" && !(q.options || []).length) q.options = ["Yes", "No"]; $("#qlist").innerHTML = qEditor(); } });
  $("#addq").onclick = () => { readQs(); S.qs.push({ type:"rating", label:"", category:"General", required:true }); $("#qlist").innerHTML = qEditor(); };
  $("#saveform").onclick = async () => {
    readQs(); const b = $("#saveform"); b.disabled = true;
    try { const r = await call("forms.save", ((o) => { if (isNo) { delete o.high_message; delete o.low_message; delete o.tripadvisor_url; delete o.google_url; delete o.high_nps; delete o.high_avg; } return o; })({ kind:S.fk, title:$("#f_title").value, opening:$("#f_open").value, thanks:$("#f_thanks").value, high_message:(($("#f_high")||{}).value), low_message:(($("#f_low")||{}).value), tripadvisor_url:(($("#f_ta")||{}).value), google_url:(($("#f_g")||{}).value), high_nps:+(($("#f_hn")||{}).value), high_avg:+(($("#f_ha")||{}).value), questions:S.qs.filter(q => String(q.label || "").trim()) })); const i = S.forms.findIndex(x => x.kind === S.fk); S.forms[i] = r.form; S.qs = JSON.parse(JSON.stringify(r.form.questions)); toast("Saved."); paintSettings(); } catch(e){ toast(e.message, true); } finally { b.disabled = false; }
  };
  const saveS = async (patch, msg) => { try { const r = await call("settings.save", patch); S.settings = r.settings; toast(msg || "Saved."); paintSettings(); } catch(e){ toast(e.message, true); } };
  if ($("#e_save")) {
    $("#e_save").onclick = () => saveS({ auto_showround:$("#e_on").checked, delay_hours:+$("#e_h").value, email_subject:$("#e_sub").value, email_body:$("#e_body").value }, $("#e_on").checked ? "Saved. The automatic email is ON." : "Saved. The automatic email is OFF.");
    $("#e_test").onclick = async () => { const b = $("#e_test"); b.disabled = true; try { const r = await call("showround.test"); toast("Test sent to " + r.sent_to + "."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  }
  if ($("#n_save")) {
    $("#n_save").onclick = () => saveS({ auto_noshow:$("#n_on").checked, noshow_subject:$("#n_sub").value, noshow_body:$("#n_body").value, noshow_wedding_url:$("#n_wed").value, noshow_event_url:$("#n_evt").value }, $("#n_on").checked ? "Saved. The no-show email is ON." : "Saved. The no-show email is OFF.");
    $("#n_test").onclick = async () => { const b = $("#n_test"); b.disabled = true; try { const r = await call("noshow.test"); toast("Test sent to " + r.sent_to + "."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  }
  $("#a_save").onclick = () => saveS({ alert_on:$("#a_on").checked, alert_email:$("#a_to").value });
}

/* =========================================================== shell */
function goView(v){
  S.view = v; $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  ({ dashboard:viewDashboard, responses:viewResponses, send:viewSend, reviews:viewReviews, settings:viewSettings }[v] || viewDashboard)();
  window.scrollTo(0, 0);
}
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.formUrl = d.form_url; $("#whoname").textContent = S.me.name;
  const tabs = $$(".tabbtn").filter(b => can(b.dataset.view)); $$(".tabbtn").forEach(b => { b.hidden = !tabs.includes(b); b.addEventListener("click", () => goView(b.dataset.view)); });
  if (!tabs.length) { $("#views").innerHTML = `<div class="empty">You do not have any tabs in Guest Feedback yet.</div>`; return; }
  goView(tabs[0].dataset.view);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
</script>
</body>
</html>
