<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu Decider</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28; --bone:#F8F8F8; --mist:#E7E7E7; --white:#fff; --ink:#262626; --olive:#CCCDB4;
  --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1100px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body);color:var(--ink);background:var(--bone);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;font-style:normal}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}
button,input,textarea,select{font:inherit;color:inherit}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px 64px}
#gate{position:fixed;inset:0;background:var(--sage);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:380px;padding:32px 28px;text-align:center}
.gatecard h1{font-size:26px;color:var(--sage)}
header.top{background:var(--sage);color:var(--white)}
.topin{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.08em}
.who{margin-left:auto;font-size:12px;opacity:.9}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tabbtn{background:transparent;border:0;cursor:pointer;color:rgba(255,255,255,.72);padding:12px 16px;font-size:12px;font-weight:600;white-space:nowrap;letter-spacing:var(--track);text-transform:uppercase;border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white);border-bottom-color:var(--olive)}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:24px 0 14px}
.pagehead h2{font-size:26px;color:var(--sage)} .hint{font-size:13px;color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage);background:var(--sage);color:var(--white);border-radius:8px;padding:10px 18px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;min-height:44px}
.btn.ghost{background:var(--white);color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white);color:var(--alert);border-color:var(--alert)}
.btn.small{min-height:34px;padding:5px 12px;font-size:11px} .btn:disabled{opacity:.5;cursor:default}
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.card h3{font-size:22px;color:var(--sage);margin-bottom:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{padding:9px 12px;border:1px solid var(--mist);border-radius:8px;background:var(--white)}
.field{margin-bottom:12px} .field label{display:block;font-size:10px;letter-spacing:var(--track);text-transform:uppercase;color:var(--sage-70);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--mist);border-radius:8px;font-size:15px;background:var(--white)}
textarea{min-height:90px;resize:vertical}
.note{background:var(--attention-bg);color:#6d5320;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.muted{color:var(--sage-70)} .empty{padding:36px 20px;text-align:center;color:var(--sage-70)} .loading{padding:60px;text-align:center;color:var(--sage-70)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sage-10);color:var(--sage);white-space:nowrap;margin:1px 2px 1px 0}
.tag.good{background:var(--good-bg);color:var(--good)} .tag.bad{background:var(--alert-bg);color:var(--alert)} .tag.warn{background:var(--attention-bg);color:#6d5320}
table.t{width:100%;border-collapse:collapse;font-size:13.5px} .t th,.t td{padding:8px;text-align:left;border-bottom:1px solid var(--mist);vertical-align:top}
.t th{font-size:10px;letter-spacing:var(--track);text-transform:uppercase;color:var(--sage-70);font-weight:600} .t .r{text-align:right;white-space:nowrap} .tw{overflow-x:auto}
.thumb{width:54px;height:54px;border-radius:8px;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--mist);background:var(--white);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--white);font-weight:600}
.chip.al[aria-pressed="true"]{background:var(--alert);border-color:var(--alert)}
.grp{font-size:10px;letter-spacing:var(--track);text-transform:uppercase;color:var(--sage-70);margin:12px 0 5px}
#ov{position:fixed;inset:0;background:rgba(38,38,38,.7);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.ovcard{background:var(--white);border-radius:12px;max-width:760px;width:100%;padding:24px 24px;margin:auto}
.ovcard h3{font-size:24px;color:var(--sage);margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:8px;z-index:200;opacity:0;transition:.2s;pointer-events:none;font-size:14px;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:640px){.shell{padding:0 12px 48px}.topin,.tabsin{padding-left:12px;padding-right:12px}.two{grid-template-columns:1fr}.btn{width:100%}.btn.small{width:auto}}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Menu Decider</h1><p style="margin:12px 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;font-size:12px">Open the Staff Portal</a></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Menu Decider</div><div class="who" id="whoname"></div></div></header>
  <nav class="tabs"><div class="tabsin">
    <button class="tabbtn" data-view="dishes" hidden>Dishes</button><button class="tabbtn" data-view="upload" hidden>Upload menu</button>
    <button class="tabbtn" data-view="tags" hidden>Tags</button><button class="tabbtn" data-view="settings" hidden>Page &amp; QR</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CFG = { URL:"https://safcrtrfdzsnftghibot.supabase.co", KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU", PAGE:"https://app.blackhorsebeamish.co.uk/dinner-decider/" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const money = n => n == null || n === "" ? "" : "£" + Number(n).toFixed(2);
const S = { me:null, allergens:[], dishes:[], tags:[], settings:{}, q:"", menu:"", course:"", only:"" };
function toast(m, bad){ const t = $("#toast"); t.textContent = m; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", bad ? 5200 : 2600); }
const staffEmail = () => { try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } };
async function call(action, payload){
  const r = await fetch(CFG.URL + "/functions/v1/menu-decider-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.KEY, apikey:CFG.KEY }, body:JSON.stringify(Object.assign({ action, staff_email:staffEmail() }, payload || {})) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const can = tab => S.me && (S.me.isAdmin || S.me.tabs.includes(tab));
const alLabel = k => (S.allergens.find(a => a.key === k) || {}).label || k;
const tagLabel = k => (S.tags.find(t => t.key === k) || {}).label || k;
function ov(html){ let o = $("#ov"); if (!o) { o = document.createElement("div"); o.id = "ov"; document.body.appendChild(o); } o.innerHTML = `<div class="ovcard">${html}</div>`; o.hidden = false; o.onmousedown = e => { if (e.target === o) ovClose(); }; }
function ovClose(){ const o = $("#ov"); if (o) o.hidden = true; }
function csvDownload(rows, name){ const body = rows.map(r => r.map(c => { const s = String(c == null ? "" : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + body], { type:"text/csv" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

/* =========================================================== dishes */
async function loadDishes(){ const d = await call("dishes.list"); S.dishes = d.dishes; S.tags = d.tags; S.settings = d.settings; }
async function viewDishes(){
  $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  try { await loadDishes(); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  paintDishes();
}
function paintDishes(){
  const menus = [...new Set(S.dishes.map(d => d.menu))], courses = [...new Set(S.dishes.map(d => d.course))];
  const q = S.q.toLowerCase(), rows = S.dishes.filter(d => (!S.menu || d.menu === S.menu) && (!S.course || d.course === S.course) && (!S.only || (S.only === "assumed" ? d.assumed : S.only === "hidden" ? !d.active : S.only === "nophoto" ? !d.photo_url : true)) && (!q || (d.name + " " + (d.description || "")).toLowerCase().includes(q)));
  const nAssumed = S.dishes.filter(d => d.assumed).length;
  $("#views").innerHTML = `<div class="pagehead"><h2>Dishes</h2><span class="hint">${S.dishes.length} dishes · ${S.dishes.filter(d => d.active).length} shown to guests</span><span class="spacer"></span>
    ${can("dishes") ? `<button class="btn ghost small" id="csvx">Download CSV</button> <button class="btn" id="add">Add a dish</button>` : ""}</div>
    ${nAssumed ? `<div class="note"><b>${nAssumed} dish${nAssumed === 1 ? " has" : "es have"} tags and allergens that are a first guess.</b> Check each against the kitchen's allergen information before the page goes live. Saving a dish marks it as checked.${can("dishes") ? ` <button class="btn small ghost" id="confirmAll" style="margin-left:8px">Mark all as checked</button>` : ""}</div>` : ""}
    <div class="filters"><input id="q" type="search" placeholder="Search" value="${esc(S.q)}">
      <select id="fm"><option value="">All menus</option>${menus.map(m => `<option ${S.menu === m ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
      <select id="fc"><option value="">All courses</option>${courses.map(m => `<option ${S.course === m ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
      <select id="fo"><option value="">Everything</option><option value="assumed" ${S.only === "assumed" ? "selected" : ""}>Not yet checked</option><option value="nophoto" ${S.only === "nophoto" ? "selected" : ""}>No photo</option><option value="hidden" ${S.only === "hidden" ? "selected" : ""}>Hidden from guests</option></select></div>
    <div class="card"><div class="tw"><table class="t"><tr><th></th><th>Dish</th><th>Tags</th><th>Contains</th><th class="r"></th></tr>
    ${rows.map(d => `<tr><td><div class="thumb">${d.photo_url ? `<img src="${esc(d.photo_url)}" alt="" loading="lazy">` : esc(d.name.charAt(0).toUpperCase())}</div></td>
      <td><b>${esc(d.name)}</b> ${d.price != null ? `<span class="muted">${money(d.price)}</span>` : ""}<br><span class="muted">${esc(d.menu)} · ${esc(d.course)}</span>${d.description ? `<br><span class="muted">${esc(d.description)}</span>` : ""}
        <br>${d.assumed ? `<span class="tag warn">Not yet checked</span>` : `<span class="tag good">Checked</span>`}${d.active ? "" : `<span class="tag bad">Hidden</span>`}${d.photo_credit ? `<span class="tag warn" title="${esc(d.photo_credit)}">Stock photo</span>` : ""}</td>
      <td>${d.tags.map(t => `<span class="tag">${esc(tagLabel(t))}</span>`).join("") || `<span class="muted">none</span>`}</td>
      <td>${d.allergens.map(a => `<span class="tag bad">${esc(alLabel(a))}</span>`).join("") || `<span class="muted">none</span>`}</td>
      <td class="r">${can("dishes") ? `<button class="btn small ghost" data-edit="${esc(d.id)}">Edit</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No dishes match.</td></tr>`}</table></div></div>`;
  $("#q").oninput = e => { S.q = e.target.value; const p = e.target.selectionStart; paintDishes(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $("#fm").onchange = e => { S.menu = e.target.value; paintDishes(); }; $("#fc").onchange = e => { S.course = e.target.value; paintDishes(); }; $("#fo").onchange = e => { S.only = e.target.value; paintDishes(); };
  $$("[data-edit]").forEach(b => b.onclick = () => editDish(S.dishes.find(d => d.id === b.dataset.edit)));
  if ($("#add")) $("#add").onclick = () => editDish(null);
  if ($("#confirmAll")) $("#confirmAll").onclick = async () => { const b = $("#confirmAll"); if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? Press again"; return; } try { await call("dishes.confirm", { all:true }); toast("All dishes marked as checked."); viewDishes(); } catch(e){ toast(e.message, true); } };
  if ($("#csvx")) $("#csvx").onclick = () => csvDownload([["Name","Description","Menu","Course","Price","Tags","Contains","Shown","Checked"]].concat(S.dishes.map(d => [d.name, d.description || "", d.menu, d.course, d.price == null ? "" : Number(d.price).toFixed(2), d.tags.map(tagLabel).join("; "), d.allergens.map(alLabel).join("; "), d.active ? "Yes" : "No", d.assumed ? "No" : "Yes"])), "menu-decider-dishes.csv");
}
function editDish(d){
  const isNew = !d, x = d || { name:"", description:"", menu:S.menu || "A la carte", course:S.course || "Mains", price:null, tags:[], allergens:[], active:true, photo_url:null };
  const menus = [...new Set(S.dishes.map(z => z.menu).concat(["A la carte"]))], courses = [...new Set(S.dishes.map(z => z.course).concat(["Starters", "Mains", "Sides", "Desserts"]))];
  const groups = {}; S.tags.forEach(t => (groups[t.grp] = groups[t.grp] || []).push(t));
  const tags = new Set(x.tags), als = new Set(x.allergens); let photo = x.photo_url;
  ov(`<h3>${isNew ? "Add a dish" : "Edit dish"}</h3>
    ${!isNew && x.assumed ? `<div class="note">The tags and allergens below are a first guess. Check them, then save.</div>` : ""}
    <div class="two"><div class="field"><label>Name</label><input id="e_name" maxlength="120" value="${esc(x.name)}"></div><div class="field"><label>Price (£, optional)</label><input id="e_price" type="number" step="0.01" min="0" value="${x.price == null ? "" : Number(x.price).toFixed(2)}"></div></div>
    <div class="field"><label>Description (what guests read)</label><textarea id="e_desc" maxlength="600" style="min-height:64px">${esc(x.description || "")}</textarea></div>
    <div class="two"><div class="field"><label>Menu</label><input id="e_menu" list="dl_m" value="${esc(x.menu)}"><datalist id="dl_m">${menus.map(m => `<option value="${esc(m)}">`).join("")}</datalist></div>
      <div class="field"><label>Course</label><input id="e_course" list="dl_c" value="${esc(x.course)}"><datalist id="dl_c">${courses.map(m => `<option value="${esc(m)}">`).join("")}</datalist></div></div>
    <div class="grp">Photo</div><div class="chips" style="align-items:center"><div class="thumb" id="e_ph" style="width:84px;height:84px">${photo ? `<img src="${esc(photo)}" alt="">` : esc((x.name || "?").charAt(0).toUpperCase())}</div>
      ${isNew ? `<span class="muted">Save the dish first, then add its photo.</span>` : `<input type="file" id="e_file" accept="image/jpeg,image/png,image/webp" hidden><button class="btn small ghost" id="e_pick">${photo ? "Change photo" : "Add photo"}</button>${photo ? `<button class="btn small danger" id="e_nophoto">Remove photo</button>` : ""}<span class="muted" id="e_phs"></span>`}</div>${x.photo_credit ? `<p class="muted" style="font-size:12px;margin:6px 0 0">Stock photo from the internet (${esc(x.photo_credit)}). Replace it with your own photo of the dish when you have one.</p>` : ""}
    ${Object.keys(groups).map(g => `<div class="grp">Tags: ${esc(g)}</div><div class="chips">${groups[g].map(t => `<button type="button" class="chip" data-t="${esc(t.key)}" aria-pressed="${tags.has(t.key)}">${esc(t.label)}</button>`).join("")}</div>`).join("")}
    <div class="grp">Contains these allergens (tick every one that is in the dish)</div><div class="chips">${S.allergens.map(a => `<button type="button" class="chip al" data-a="${esc(a.key)}" aria-pressed="${als.has(a.key)}">${esc(a.label)}</button>`).join("")}</div>
    <div class="field" style="margin-top:14px"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="e_active" style="width:20px;height:20px" ${x.active ? "checked" : ""}> Show this dish to guests</label></div>
    <div class="chips" style="margin-top:6px"><button class="btn" id="e_save">${isNew ? "Add dish" : "Save and mark as checked"}</button>${isNew ? "" : `<button class="btn ghost" id="e_sug" title="Replaces the tags and allergens with a new first guess">Guess the tags again</button><button class="btn danger" id="e_del">Delete</button>`}<button class="btn ghost" id="e_x">Cancel</button></div>`);
  $("#e_x").onclick = ovClose;
  $$("#ov [data-t]").forEach(b => b.onclick = () => { const k = b.dataset.t; tags.has(k) ? tags.delete(k) : tags.add(k); b.setAttribute("aria-pressed", tags.has(k)); });
  $$("#ov [data-a]").forEach(b => b.onclick = () => { const k = b.dataset.a; als.has(k) ? als.delete(k) : als.add(k); b.setAttribute("aria-pressed", als.has(k)); });
  $("#e_save").onclick = async () => { const b = $("#e_save"); b.disabled = true; try { const r = await call("dish.save", { id:isNew ? undefined : x.id, name:$("#e_name").value, description:$("#e_desc").value, menu:$("#e_menu").value, course:$("#e_course").value, price:$("#e_price").value, tags:[...tags], allergens:[...als], active:$("#e_active").checked }); toast(isNew ? "Added. Open it again to add a photo." : "Saved."); ovClose(); viewDishes(); } catch(e){ toast(e.message, true); b.disabled = false; } };
  if (!isNew) {
    $("#e_del").onclick = async () => { const b = $("#e_del"); if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? Press again"; return; } try { await call("dish.delete", { id:x.id }); toast("Deleted."); ovClose(); viewDishes(); } catch(e){ toast(e.message, true); } };
    $("#e_sug").onclick = async () => { try { await call("dishes.suggest", { ids:[x.id] }); toast("Guessed again. Reopening."); ovClose(); await loadDishes(); editDish(S.dishes.find(z => z.id === x.id)); paintDishes(); } catch(e){ toast(e.message, true); } };
    $("#e_pick").onclick = () => $("#e_file").click();
    $("#e_file").onchange = async e => { const f = e.target.files[0]; if (!f) return; const st = $("#e_phs"); try { st.textContent = "Resizing…"; const blob = await shrink(f); st.textContent = "Uploading…"; const u = await call("photo.url", { dish_id:x.id, type:"image/jpeg", size:blob.size }); const put = await fetch(u.upload_url, { method:"PUT", headers:{ "Content-Type":"image/jpeg", "x-upsert":"false" }, body:blob }); if (!put.ok) throw new Error("The upload was refused (error " + put.status + ")."); const r = await call("photo.set", { dish_id:x.id, path:u.path }); $("#e_ph").innerHTML = `<img src="${esc(r.photo_url)}" alt="">`; st.textContent = "Photo saved."; loadDishes().then(paintDishes); } catch(err){ st.textContent = ""; toast(err.message, true); } };
    if ($("#e_nophoto")) $("#e_nophoto").onclick = async () => { try { await call("photo.remove", { dish_id:x.id }); toast("Photo removed."); ovClose(); viewDishes(); } catch(e){ toast(e.message, true); } };
  }
}
// pictures are shrunk before upload (guests load these on their phones): at most 1000 px on the long side, JPEG
function shrink(file){
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file); img.onload = () => { const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("That picture could not be read.")), "image/jpeg", .82); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That picture could not be read.")); }; img.src = url; });
}

/* =========================================================== upload menu */
function parseTable(text){
  // comma separated (with quotes) or tab separated (pasted from Excel); first line is the headings
  const t = String(text).replace(/^﻿/, ""), tab = t.split("\n", 1)[0].includes("\t"), sep = tab ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && !cell) q = true; else if (c === sep) { row.push(cell); cell = ""; } else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; } else if (c !== "\r") cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase()), ix = n => head.findIndex(h => h === n || h.startsWith(n));
  const iN = ix("name"), iD = ix("desc"), iM = ix("menu"), iC = ix("course"), iP = ix("price");
  if (iN < 0) throw new Error("The first line must be headings, including Name. Download the template to see the layout.");
  return rows.filter(r => (r[iN] || "").trim()).map(r => ({ name:r[iN].trim(), description:iD < 0 ? "" : (r[iD] || "").trim(), menu:iM < 0 ? "" : (r[iM] || "").trim() || "A la carte", course:iC < 0 ? "" : (r[iC] || "").trim() || "Mains", price:iP < 0 ? "" : (r[iP] || "").trim() }));
}
function viewUpload(){
  $("#views").innerHTML = `<div class="pagehead"><h2>Upload menu</h2><span class="hint">Add a new menu or update the dishes you already have</span></div>
    <div class="card"><h3>1. Get the dishes in</h3><p class="muted" style="margin-top:0">A spreadsheet saved as CSV, or copied straight from Excel. Columns: <b>Name, Description, Menu, Course, Price</b>. Menu is for example "A la carte" or "Sunday Lunch"; Course is Starters, Mains, Sides or Desserts. Codes in descriptions such as (V), (VG), (GF), (GFA), (N) are read as tags and allergens, then removed from the wording.</p>
      <div class="filters"><input type="file" id="u_file" accept=".csv,.txt,text/csv"> <button class="btn small ghost" id="u_tpl">Download the template</button></div>
      <div class="field"><label>Or paste it here</label><textarea id="u_text" style="min-height:130px" placeholder="Name&#9;Description&#9;Menu&#9;Course&#9;Price"></textarea></div>
      <button class="btn ghost" id="u_read">Read it</button></div>
    <div id="u_out"></div>`;
  $("#u_tpl").onclick = () => csvDownload([["Name","Description","Menu","Course","Price"],["Soup of the Day","Served with sourdough and butter (V)","A la carte","Starters","8.00"],["Fish & Chips","Chips, mushy peas, tartare (GFA)","A la carte","Mains","19.00"]], "menu-template.csv");
  $("#u_file").onchange = async e => { const f = e.target.files[0]; if (f) { $("#u_text").value = await f.text(); readIt(); } };
  $("#u_read").onclick = readIt;
}
function readIt(){
  let rows; try { rows = parseTable($("#u_text").value); if (!rows.length) throw new Error("No dishes were found in that."); } catch(e){ $("#u_out").innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
  const menus = [...new Set(rows.map(r => r.menu))];
  $("#u_out").innerHTML = `<div class="card"><h3>2. Check it</h3><p>${rows.length} dish${rows.length === 1 ? "" : "es"} found across ${menus.length} menu${menus.length === 1 ? "" : "s"}: ${menus.map(esc).join(", ")}.</p>
    <div class="tw"><table class="t"><tr><th>Name</th><th>Description</th><th>Menu</th><th>Course</th><th class="r">Price</th></tr>${rows.slice(0, 12).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.description)}</td><td>${esc(r.menu)}</td><td>${esc(r.course)}</td><td class="r">${esc(r.price)}</td></tr>`).join("")}${rows.length > 12 ? `<tr><td colspan="5" class="muted">…and ${rows.length - 12} more</td></tr>` : ""}</table></div>
    <h3 style="margin-top:16px">3. How to add them</h3>
    <div class="field"><label style="text-transform:none;letter-spacing:0;font-size:14px;display:flex;gap:8px;align-items:flex-start"><input type="radio" name="u_mode" value="add" checked style="margin-top:4px"> <span><b>Add to the dishes I have.</b> Dishes with the same name, menu and course are updated; nothing is hidden.</span></label></div>
    <div class="field"><label style="text-transform:none;letter-spacing:0;font-size:14px;display:flex;gap:8px;align-items:flex-start"><input type="radio" name="u_mode" value="replace" style="margin-top:4px"> <span><b>This is the new menu.</b> Update the matching dishes (their photos and checked tags stay) and hide every dish that is not in this list. Nothing is deleted.</span></label></div>
    <button class="btn" id="u_go">Import ${rows.length} dish${rows.length === 1 ? "" : "es"}</button></div>`;
  $("#u_go").onclick = async () => { const b = $("#u_go"); b.disabled = true; try { const r = await call("dishes.import", { rows, mode:document.querySelector('input[name="u_mode"]:checked').value }); toast(`Done: ${r.added} added, ${r.updated} updated${r.switched_off ? `, ${r.switched_off} hidden` : ""}.`); $("#u_out").innerHTML = `<div class="note">${r.added} added, ${r.updated} updated${r.switched_off ? `, ${r.switched_off} hidden` : ""}. New dishes have a first guess at their tags and allergens: open the Dishes tab, filter by "Not yet checked", and check each one.</div>`; } catch(e){ toast(e.message, true); b.disabled = false; } };
}

/* =========================================================== tags */
async function viewTags(){
  $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  try { await loadDishes(); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const used = {}; S.dishes.forEach(d => d.tags.forEach(t => used[t] = (used[t] || 0) + 1));
  const groups = [...new Set(S.tags.map(t => t.grp))];
  $("#views").innerHTML = `<div class="pagehead"><h2>Tags</h2><span class="hint">The words guests can pick from ("What are you in the mood for?"). Allergens are fixed: the 14 the law requires.</span></div>
    <datalist id="gl">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist>
    <div class="card"><h3>Add a tag</h3><div class="filters"><input id="n_label" placeholder="Name, e.g. Zesty" maxlength="40"><input id="n_grp" list="gl" placeholder="Group" value="Flavour"><button class="btn" id="n_add">Add</button></div></div>
    <div class="card"><div class="tw"><table class="t"><tr><th>Tag</th><th>Group</th><th>Order</th><th class="r">Dishes</th><th class="r"></th></tr>${S.tags.map(t => `<tr data-k="${esc(t.key)}"><td><input data-f="label" value="${esc(t.label)}" maxlength="40"></td><td><input data-f="grp" list="gl" value="${esc(t.grp)}"></td><td><input data-f="sort_order" type="number" value="${t.sort_order}" style="width:80px"></td><td class="r">${used[t.key] || 0}</td><td class="r"><button class="btn small" data-save>Save</button> <button class="btn small danger" data-del>Delete</button></td></tr>`).join("")}</table></div></div>`;
  $("#n_add").onclick = async () => { try { await call("tags.save", { label:$("#n_label").value, grp:$("#n_grp").value }); toast("Added."); viewTags(); } catch(e){ toast(e.message, true); } };
  $$("tr[data-k]").forEach(tr => { const k = tr.dataset.k, g = f => tr.querySelector(`[data-f="${f}"]`).value;
    tr.querySelector("[data-save]").onclick = async () => { try { await call("tags.save", { key:k, label:g("label"), grp:g("grp"), sort_order:g("sort_order") }); toast("Saved."); viewTags(); } catch(e){ toast(e.message, true); } };
    tr.querySelector("[data-del]").onclick = async e => { const b = e.target; if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? Press again"; return; } try { const r = await call("tags.delete", { key:k }); toast(`Deleted${r.removed_from ? `, and taken off ${r.removed_from} dish${r.removed_from === 1 ? "" : "es"}` : ""}.`); viewTags(); } catch(err){ toast(err.message, true); } }; });
}

/* =========================================================== page + QR */
async function viewSettings(){
  $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  try { S.settings = (await call("settings.get")).settings; } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const s = S.settings;
  $("#views").innerHTML = `<div class="pagehead"><h2>Page &amp; QR code</h2><span class="hint">What guests see when they scan the code</span></div>
    <div class="grid2 two">
    <div class="card"><h3>The page</h3>
      <div class="field"><label>Heading</label><input id="s_title" maxlength="120" value="${esc(s.title)}"></div>
      <div class="field"><label>Introduction</label><textarea id="s_intro" maxlength="400" style="min-height:70px">${esc(s.intro)}</textarea></div>
      <div class="field"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="s_prices" style="width:20px;height:20px" ${s.show_prices ? "checked" : ""}> Show prices</label></div>
      <div class="field"><label style="display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14px"><input type="checkbox" id="s_demo" style="width:20px;height:20px;margin-top:2px" ${s.demo ? "checked" : ""}> <span>Demonstration menu: show a banner saying the dishes are examples. <b>Untick this only when the real menu is loaded and every dish has been checked.</b></span></label></div>
      <button class="btn" id="s_save">Save</button></div>
    <div class="card"><h3>The QR code</h3><p class="muted" style="margin-top:0">Print this on the menu. It opens the page on the guest's phone: <b id="s_url">${esc(CFG.PAGE)}</b></p>
      <div id="qr" style="display:inline-block;padding:12px;background:#fff;border:1px solid var(--mist);border-radius:8px"></div>
      <div class="filters" style="margin-top:12px"><button class="btn small ghost" id="s_png">Download QR (PNG)</button><button class="btn small ghost" id="s_copy">Copy the link</button></div>
      <p class="muted" style="font-size:13px">To open one menu straight away (for example a Sunday lunch menu card) add <code>?menu=Sunday Lunch</code> to the link. Leave it off for the main menu.</p></div></div>`;
  $("#s_save").onclick = async () => { const b = $("#s_save"); b.disabled = true; try { await call("settings.save", { title:$("#s_title").value, intro:$("#s_intro").value, show_prices:$("#s_prices").checked, demo:$("#s_demo").checked }); toast("Saved. Guests see it within a minute."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  try { new QRCode($("#qr"), { text:CFG.PAGE, width:220, height:220, colorDark:"#3F2F28", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M }); } catch(e){ $("#qr").textContent = "The QR code could not be drawn (no connection to the code library)."; }
  $("#s_png").onclick = () => { const c = $("#qr canvas"); if (!c) { toast("The QR code is not ready.", true); return; } const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "dinner-decider-qr.png"; document.body.appendChild(a); a.click(); a.remove(); };
  $("#s_copy").onclick = async () => { try { await navigator.clipboard.writeText(CFG.PAGE); toast("Link copied."); } catch(e){ toast(CFG.PAGE); } };
}

/* =========================================================== shell */
function goView(v){ $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false")); ({ dishes:viewDishes, upload:viewUpload, tags:viewTags, settings:viewSettings }[v] || viewDishes)(); window.scrollTo(0, 0); }
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d; try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.allergens = d.allergens; $("#whoname").textContent = S.me.name;
  const tabs = $$(".tabbtn").filter(b => can(b.dataset.view)); $$(".tabbtn").forEach(b => { b.hidden = !tabs.includes(b); b.addEventListener("click", () => goView(b.dataset.view)); });
  if (!tabs.length) { $("#views").innerHTML = `<div class="empty">You do not have any tabs here yet.</div>`; return; }
  goView(tabs[0].dataset.view);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
