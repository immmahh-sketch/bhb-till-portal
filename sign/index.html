<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your contract | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/nzu1hbj.css" onerror="this.remove()">
<style>
:root{--sage:#4D604F;--brown:#3F2F28;--sage-70:#6b6f66;--sage-10:#EEF1EC;--bone:#F8F8F8;--celadon:#CCCDB4;--white:#fff;--ink:#262626;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#3F6A47;--good-bg:#EDF2ED;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;font-style:normal}
h1,h2{font-family:var(--display);font-weight:600;margin:0;color:var(--brown);letter-spacing:.01em}
header.top{background:var(--sage);color:var(--white);padding:18px 16px 20px;text-align:center;border-bottom:5px solid var(--celadon)}
header.top img.logo{display:block;margin:0 auto 6px;height:40px;width:auto}
header.top .brand{font-family:var(--display);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--celadon)}
main{max-width:760px;margin:0 auto;padding:18px 12px 120px}
.card{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.06);padding:20px 18px;margin:0 0 16px}
.lead{margin:6px 0 0;color:var(--sage-70)}
.steps{margin:12px 0 0;padding-left:20px}
.steps li{margin:3px 0}
.pagewrap{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);width:100%}
.pagewrap canvas{display:block;width:100%;height:auto}
.pageno{font-size:13px;color:var(--sage-70);text-align:center;margin:0 0 4px}
.fld{position:absolute;border:2px dashed var(--sage);background:rgba(204,205,180,.45);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:clamp(9px,2.4vw,13px);font-weight:700;color:var(--sage);padding:0;font-family:var(--body);line-height:1}
.fld.done{border:2px solid var(--good);background:rgba(255,255,255,.7)}
.fld img{max-width:100%;max-height:100%;display:block}
.fld.active{outline:3px solid var(--brown);outline-offset:1px;animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{background:rgba(204,205,180,.95)}}
.fld input[type=text]{width:100%;height:100%;border:0;background:transparent;font:inherit;font-weight:500;color:var(--ink);padding:0 4px;min-width:0}
.fld.auto{cursor:default;border-style:solid;border-color:var(--celadon);background:rgba(255,255,255,.6);color:var(--ink);font-weight:500}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--celadon);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bar .msg{font-size:14px;color:var(--sage-70);flex:1 1 auto}
.btn{background:var(--sage);color:var(--white);border:0;border-radius:9px;padding:13px 22px;font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer;min-height:46px}
.btn.ghost{background:var(--white);color:var(--sage);border:1.5px solid var(--sage)}
.btn:disabled{opacity:.55;cursor:default}
label.f{display:block;font-weight:600;margin:16px 0 6px}
input[type=text].big{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--sage);outline-offset:1px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;margin:14px 0 6px;background:#fff;cursor:pointer}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--sage);flex:0 0 auto}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--celadon);border-top-color:var(--sage);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* the signature box */
.modal{position:fixed;inset:0;background:rgba(38,38,38,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--celadon);background:#fff;border-radius:9px;font:inherit;font-weight:600;color:var(--sage);cursor:pointer}
.tabs button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.pad{border:1.5px dashed var(--sage);border-radius:10px;background:#fff;touch-action:none;width:100%;display:block}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.hint{font-size:14px;color:var(--sage-70);margin:6px 0 0}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;font-size:14px;color:var(--sage-70);text-align:center}
</style>
</head>
<body>
<header class="top"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"><div class="brand">Your contract</div></header>
<main id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></main>
<footer>Black Horse Beamish Ltd &middot; 01207 232 569 &middot; events@blackhorsebeamish.co.uk</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
var API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/contract-sign";
var KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
var T = new URLSearchParams(location.search).get("t") || "";
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var D = null;                                  // what the server sent
var V = { sig1: "", ini1: "", sig2: "", texts: {} };   // what the signer has done so far
var activeId = null;

function api(action, extra) {
  return fetch(API, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + KEY, apikey: KEY }, body: JSON.stringify(Object.assign({ action: action, token: T }, extra || {})) })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || "Something went wrong. Please try again."); e.status = r.status; throw e; } return j; }); });
}
function ukToday() { var p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date()); return p; }
function showMsg(html) { $("#app").innerHTML = '<div class="card">' + html + "</div>"; }

/* ------------------------------------------------------------------ boot */
(function boot() {
  if (!/^[0-9a-f]{64}$/.test(T)) { showMsg("<h1>This link isn't valid</h1><p class='lead'>Please use the link in the email we sent you, or call us on 01207 232 569.</p>"); return; }
  api("open").then(function (d) {
    D = d;
    if (d.state === "signed") {
      showMsg("<h1>Already signed</h1><p class='lead'>" + esc(d.title) + " was signed on " + esc(new Date(d.signed_at).toLocaleDateString("en-GB", { timeZone: "Europe/London", day: "numeric", month: "long", year: "numeric" })) + ". Your signed copy was emailed to you.</p>" + (d.url ? "<p><a class='btn' style='display:inline-block;text-decoration:none' href='" + esc(d.url) + "'>Open your signed contract</a></p>" : ""));
      return;
    }
    render();
  }).catch(function (e) { showMsg("<h1>We can't open this contract</h1><p class='lead'>" + esc(e.message) + "</p>"); });
})();

/* ------------------------------------------------------------------ the contract */
function render() {
  var two = !!D.signer2_name || D.fields.some(function (f) { return f.signer === 2; });
  $("#app").innerHTML =
    '<div class="card"><h1>' + esc(D.title) + '</h1>' +
    '<p class="lead">Please read your contract all the way through. The boxes that need something from you are shaded green.</p>' +
    '<ol class="steps"><li>Scroll down and read every page.</li><li>Tap each green box to sign or initial. You draw once and it fills in the rest.</li><li>Press <strong>Finish and sign</strong> at the bottom.</li></ol></div>' +
    '<div id="pages"><div class="card" style="text-align:center"><span class="spin"></span><p class="lead">Loading your contract&hellip;</p></div></div>' +
    '<div class="card" id="finish" style="display:none"></div>' +
    '<div class="bar"><div class="msg" id="barmsg"></div><button class="btn" id="next">Start</button></div>';
  $("#next").onclick = goNext;
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  // A cross-origin worker is refused by browsers, so it is fetched and run from a local blob.
  fetch(pdfjsLib.GlobalWorkerOptions.workerSrc).then(function (r) { return r.text(); }).then(function (t) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: "text/javascript" }));
  }).catch(function () {}).then(function () { return pdfjsLib.getDocument({ url: D.url }).promise; }).then(drawPages).catch(function () {
    $("#pages").innerHTML = '<div class="err">The contract could not be shown. Please refresh, or call us on 01207 232 569.</div>';
  });
  function drawPages(pdf) {
    var host = $("#pages"); host.innerHTML = "";
    var chain = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) (function (n) {
      var wrap = document.createElement("div");
      wrap.innerHTML = '<div class="pageno">Page ' + n + ' of ' + pdf.numPages + '</div><div class="pagewrap" data-page="' + n + '"><canvas></canvas></div>';
      host.appendChild(wrap);
      chain = chain.then(function () { return pdf.getPage(n); }).then(function (page) {
        var cw = Math.min(host.clientWidth, 760), base = page.getViewport({ scale: 1 }), s = (cw * Math.min(window.devicePixelRatio || 1, 2.5)) / base.width;
        var vp = page.getViewport({ scale: s }), cv = wrap.querySelector("canvas");
        cv.width = vp.width; cv.height = vp.height;
        return page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise.then(function () { addFields(wrap.querySelector(".pagewrap"), n); });
      });
    })(n);
    chain.then(function () { refresh(); });
  }
}

function addFields(box, pageNo) {
  D.fields.filter(function (f) { return f.page === pageNo; }).forEach(function (f) {
    var el = document.createElement("div");
    el.className = "fld"; el.dataset.id = f.id;
    el.style.left = f.x * 100 + "%"; el.style.top = f.y * 100 + "%"; el.style.width = f.w * 100 + "%"; el.style.height = f.h * 100 + "%";
    box.appendChild(el);
    paintField(f, el);
  });
}

function paintField(f, el) {
  el.onclick = null; el.classList.remove("done", "auto");
  if (f.type === "signature" || f.type === "initials") {
    var img = V[(f.type === "signature" ? "sig" : "ini") + f.signer];
    if (img) { el.classList.add("done"); el.innerHTML = '<img alt="" src="' + img + '">'; }
    else el.textContent = f.type === "signature" ? "Tap to sign" : "Initial";
    el.onclick = function () { capture(f.type, f.signer); };
  } else if (f.type === "date") {
    el.classList.add("auto"); el.textContent = ukToday();
  } else if (f.type === "text") {
    el.innerHTML = '<input type="text" maxlength="200" aria-label="' + esc(f.label || "Your answer") + '" placeholder="' + esc(f.label || "Type here") + '">';
    var inp = el.querySelector("input"); inp.value = V.texts[f.id] || "";
    inp.oninput = function () { V.texts[f.id] = inp.value; el.classList.toggle("done", !!inp.value.trim()); refresh(); };
    el.classList.toggle("done", !!(V.texts[f.id] || "").trim());
  } else if (f.type === "check") {
    var on = V.texts[f.id] === true;
    el.classList.toggle("done", on); el.textContent = on ? "✓" : "Tap to tick";
    el.onclick = function () { V.texts[f.id] = !(V.texts[f.id] === true); paintField(f, el); refresh(); };
  }
}

function todo() {
  return D.fields.filter(function (f) {
    if (f.required === false) return false;
    if (f.type === "signature") return !V["sig" + f.signer];
    if (f.type === "initials") return !V["ini" + f.signer];
    if (f.type === "text") return !(V.texts[f.id] || "").trim();
    if (f.type === "check") return V.texts[f.id] !== true;
    return false;
  });
}

function refresh() {
  document.querySelectorAll(".fld").forEach(function (el) {
    var f = D.fields.filter(function (x) { return x.id === el.dataset.id; })[0];
    if (f && (f.type === "signature" || f.type === "initials" || f.type === "check")) paintField(f, el);
  });
  var left = todo(), bar = $("#barmsg"), nx = $("#next");
  if (!nx) return;
  if (left.length) {
    var sigs = left.filter(function (f) { return f.type === "signature"; }).length, ini = left.filter(function (f) { return f.type === "initials"; }).length, oth = left.length - sigs - ini, parts = [];
    if (sigs) parts.push(sigs + " signature" + (sigs > 1 ? "s" : ""));
    if (ini) parts.push(ini + " initial" + (ini > 1 ? "s" : ""));
    if (oth) parts.push(oth + " box" + (oth > 1 ? "es" : ""));
    bar.textContent = parts.join(", ").replace(/, ([^,]*)$/, " and $1") + " to do";
    nx.textContent = "Next"; nx.disabled = false; nx.onclick = goNext;
    $("#finish").style.display = "none";
  } else {
    bar.textContent = "Everything is filled in.";
    nx.textContent = "Finish and sign"; nx.disabled = false; nx.onclick = openFinish;
    showFinish();
  }
}

function goNext() {
  var left = todo();
  if (!left.length) { openFinish(); return; }
  var f = left[0], el = document.querySelector('.fld[data-id="' + f.id + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("active"); void el.offsetWidth; el.classList.add("active");
  if (f.type === "signature" || f.type === "initials") setTimeout(function () { capture(f.type, f.signer); }, 450);
  else if (f.type === "text") { var i = el.querySelector("input"); if (i) setTimeout(function () { i.focus(); }, 450); }
}

/* ------------------------------------------------------------------ the finish form */
function showFinish() {
  var box = $("#finish");
  if (box.dataset.built) { box.style.display = "block"; return; }
  box.dataset.built = "1"; box.style.display = "block";
  var two = !!D.signer2_name || D.fields.some(function (f) { return f.signer === 2; });
  box.innerHTML = '<h2>Finish and sign</h2>' +
    '<label class="f" for="n1">Your full name</label><input class="big" type="text" id="n1" maxlength="100" autocomplete="name" value="' + esc(D.signer1_name) + '">' +
    (two ? '<label class="f" for="n2">Second person\'s full name</label><input class="big" type="text" id="n2" maxlength="100" value="' + esc(D.signer2_name) + '">' : "") +
    '<label class="opt"><input type="checkbox" id="agree"><span>I have read this contract and I agree to it. I understand my signature, the date and time, and details of my device are recorded.</span></label>' +
    '<div id="ferr"></div><div class="row"><button class="btn" id="go">Finish and sign</button></div>' +
    '<p class="hint">We will email you a signed copy straight away.</p>';
  $("#go").onclick = submit;
}
function openFinish() { showFinish(); $("#finish").scrollIntoView({ behavior: "smooth", block: "center" }); }

function submit() {
  var err = $("#ferr"); err.innerHTML = "";
  var n1 = $("#n1").value.trim(), n2 = $("#n2") ? $("#n2").value.trim() : "";
  if (!n1) { err.innerHTML = '<div class="err">Please type your full name.</div>'; return; }
  if ($("#n2") && !n2) { err.innerHTML = '<div class="err">Please type the second person\'s full name.</div>'; return; }
  if (!$("#agree").checked) { err.innerHTML = '<div class="err">Please tick the box to say you have read and agree to the contract.</div>'; return; }
  var b = $("#go"); b.disabled = true; b.textContent = "Signing…";
  api("submit", { sig1: V.sig1, ini1: V.ini1, sig2: V.sig2, name1: n1, name2: n2, agree: true, texts: V.texts }).then(function (r) {
    $("#app").innerHTML = '<div class="card"><h1>Thank you, it\'s signed</h1>' +
      '<div class="ok">' + (r.emailed ? "We have emailed you a signed copy." : "Your contract is signed. If a copy does not reach your inbox, please check your junk folder or contact us.") + '</div>' +
      (r.url ? '<p><a class="btn" style="display:inline-block;text-decoration:none" href="' + esc(r.url) + '">Open your signed contract</a></p>' : "") +
      '<p class="lead">If you have any questions, call us on 01207 232 569 or reply to the email we sent.</p></div>';
    window.scrollTo(0, 0);
  }).catch(function (e) { b.disabled = false; b.textContent = "Finish and sign"; err.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

/* ------------------------------------------------------------------ drawing or uploading a signature */
function capture(kind, signer) {
  var title = kind === "signature" ? "Your signature" : "Your initials";
  var h = kind === "signature" ? 200 : 140;
  var m = document.createElement("div"); m.className = "modal";
  m.innerHTML = '<div class="sheet" role="dialog" aria-label="' + title + '"><h2>' + title + '</h2>' +
    '<div class="tabs"><button class="on" data-t="draw">Draw</button><button data-t="up">Upload a picture</button></div>' +
    '<div id="p-draw"><canvas class="pad" height="' + h + '"></canvas><p class="hint">Use your finger or the mouse.</p></div>' +
    '<div id="p-up" style="display:none"><input type="file" accept="image/*" id="file"><canvas class="pad" id="uppv" height="' + h + '" style="margin-top:10px"></canvas><p class="hint">A photo of your signature on white paper works well.</p></div>' +
    '<div id="merr"></div><div class="row"><button class="btn ghost" id="clr">Clear</button><button class="btn ghost" id="cx">Cancel</button><button class="btn" id="use">Use this</button></div></div>';
  document.body.appendChild(m);
  var pad = m.querySelector("#p-draw canvas"), up = m.querySelector("#uppv"), mode = "draw", drawn = false, uploaded = false;
  function size(c) { var w = c.parentNode.clientWidth || 500; c.width = Math.round(w * 2); c.height = Math.round(h * 2); c.style.height = h + "px"; }
  size(pad);
  var ctx = pad.getContext("2d"); ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 5; ctx.strokeStyle = "#111";
  var down = false, last = null;
  function pt(e) { var r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height }; }
  pad.addEventListener("pointerdown", function (e) { down = true; last = pt(e); pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 2.5, 0, 6.3); ctx.fillStyle = "#111"; ctx.fill(); e.preventDefault(); });
  pad.addEventListener("pointermove", function (e) { if (!down) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; drawn = true; e.preventDefault(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { pad.addEventListener(ev, function () { down = false; }); });
  m.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      mode = b.dataset.t;
      m.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
      m.querySelector("#p-draw").style.display = mode === "draw" ? "" : "none";
      m.querySelector("#p-up").style.display = mode === "up" ? "" : "none";
      if (mode === "up") size(up);
    };
  });
  m.querySelector("#clr").onclick = function () { if (mode === "draw") { ctx.clearRect(0, 0, pad.width, pad.height); drawn = false; } else { up.getContext("2d").clearRect(0, 0, up.width, up.height); uploaded = false; m.querySelector("#file").value = ""; } };
  m.querySelector("#cx").onclick = function () { m.remove(); };
  m.addEventListener("click", function (e) { if (e.target === m) m.remove(); });
  m.querySelector("#file").onchange = function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      size(up); var c = up.getContext("2d"); c.clearRect(0, 0, up.width, up.height);
      var s = Math.min(up.width / img.width, up.height / img.height); c.drawImage(img, (up.width - img.width * s) / 2, (up.height - img.height * s) / 2, img.width * s, img.height * s);
      uploaded = true; URL.revokeObjectURL(url);
    };
    img.onerror = function () { m.querySelector("#merr").innerHTML = '<div class="err">That picture could not be read. Try another.</div>'; };
    img.src = url;
  };
  m.querySelector("#use").onclick = function () {
    var src = mode === "draw" ? pad : up;
    if (mode === "draw" ? !drawn : !uploaded) { m.querySelector("#merr").innerHTML = '<div class="err">Please ' + (mode === "draw" ? "draw" : "choose") + ' your ' + (kind === "signature" ? "signature" : "initials") + ' first.</div>'; return; }
    var out = tidy(src, mode === "up");
    if (!out) { m.querySelector("#merr").innerHTML = '<div class="err">Nothing could be seen. Please try again.</div>'; return; }
    V[(kind === "signature" ? "sig" : "ini") + signer] = out;
    m.remove(); refresh();
  };
}

/* Crops to the ink, turns a pale background transparent, and limits the size, so the picture sits neatly on the page. */
function tidy(src, whiten) {
  var w = src.width, h = src.height, ctx = src.getContext("2d"), d = ctx.getImageData(0, 0, w, h), px = d.data;
  if (whiten) for (var i = 0; i < px.length; i += 4) { var lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]; if (lum > 215 || px[i + 3] < 20) px[i + 3] = 0; else { px[i] = Math.min(px[i], 40); px[i + 1] = Math.min(px[i + 1], 40); px[i + 2] = Math.min(px[i + 2], 60); px[i + 3] = 255; } }
  var minx = w, miny = h, maxx = -1, maxy = -1;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 40) { if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
  if (maxx < 0) return null;
  var pad = 6; minx = Math.max(0, minx - pad); miny = Math.max(0, miny - pad); maxx = Math.min(w - 1, maxx + pad); maxy = Math.min(h - 1, maxy + pad);
  var cw = maxx - minx + 1, ch = maxy - miny + 1, tmp = document.createElement("canvas"); tmp.width = w; tmp.height = h; tmp.getContext("2d").putImageData(d, 0, 0);
  var sc = Math.min(1, 700 / cw), out = document.createElement("canvas"); out.width = Math.max(1, Math.round(cw * sc)); out.height = Math.max(1, Math.round(ch * sc));
  out.getContext("2d").drawImage(tmp, minx, miny, cw, ch, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}
