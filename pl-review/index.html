<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P&amp;L Review — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --blue:#34546F; --blue-bg:#E7EEF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1180px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--gold); color:var(--ink); font-size:10px; line-height:18px; text-align:center; letter-spacing:0}
.badge.off{display:none}
body.clean header.top, body.clean nav.tabs{display:none}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 16px}
.pagehead h2{font-size:26px; color:var(--sage)}
.pagehead .hint{font-size:13px; color:var(--sage-70)}
.spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger.sure{background:var(--alert); color:var(--white)}
.btn.sure:not(.danger){background:var(--gold); border-color:var(--gold); color:var(--ink)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn:disabled{opacity:.5; cursor:default}
.linkbtn{background:none; border:0; padding:0; color:var(--sage); cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline; min-height:36px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:12px}
.opts{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:84px; resize:vertical}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.draft{background:var(--attention-bg); color:#6d5320}
.tag.final{background:var(--good-bg); color:var(--good)}
.tag.open{background:var(--gold); color:var(--ink)}
.tag.res{background:var(--good-bg); color:var(--good)}
.tag.mon{background:var(--blue-bg); color:var(--blue)}
.muted{color:var(--sage-70)} .empty{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:400; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.err{color:var(--alert); font-size:13px}
.note{font-size:13px; color:var(--sage-70); margin:0 0 14px}
.neg{color:var(--alert)}

/* ---- upload ---- */
.drop{border:2px dashed var(--celadon); border-radius:var(--radius); padding:26px 18px; text-align:center; background:var(--bone); transition:.12s}
.drop.over{border-color:var(--sage); background:var(--sage-10)}
.drop p{margin:0 0 12px; color:var(--sage-70); font-size:14px}
.drop input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.prev{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:4px 0 16px}
.prev .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.prev .v{font-family:var(--display); font-size:24px; color:var(--sage); line-height:1.15}
.prev .v.sm{font-family:var(--body); font-size:15px; color:var(--ink)}
.row2{display:grid; grid-template-columns:1fr 130px; gap:12px}
.choice{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--mist); border-radius:8px; margin-bottom:8px; cursor:pointer; background:var(--white)}
.choice input{width:20px; height:20px; accent-color:var(--sage); margin:2px 0 0; flex:0 0 auto}
.choice:has(input:checked){border-color:var(--sage); background:var(--sage-10)}
.choice small{display:block; color:var(--sage-70)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin:0 0 12px; font-size:14px}

/* ---- lists ---- */
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px}
.filters .field{margin:0} .filters .field select{min-width:170px}
.pcard{display:block; width:100%; text-align:left; border:0; cursor:pointer; padding:16px 20px; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px}
.pcard:hover{background:#fbfbf9}
.pcard .t{font-family:var(--display); font-size:24px; color:var(--sage); line-height:1.15; overflow-wrap:anywhere}
.pcard .tl1{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px}
.pcard .m{font-size:12px; color:var(--sage-70); margin-top:3px}
.pcard .nums{display:flex; gap:10px 28px; flex-wrap:wrap; margin-top:12px}
.pcard .nums div{min-width:110px} .pcard .nums .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.pcard .nums .v{font-size:17px; font-weight:600}

/* ---- review ---- */
.rvhead h2{font-size:30px; color:var(--sage); line-height:1.1; overflow-wrap:anywhere}
.rvhead .meta{font-size:13px; color:var(--sage-70); margin-top:6px}
.rvhead .tl1{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.rvhead .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.backrow{margin:18px 0 -6px}
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px}
.kpi .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.kpi .v{font-family:var(--display); font-size:28px; color:var(--sage); line-height:1.1; margin:2px 0}
.kpi .v.neg{color:var(--alert)}
.kpi .sub{font-size:12px; color:var(--sage-70)}
.kpi .ytdl{font-size:12px; margin-top:6px; padding-top:6px; border-top:1px solid var(--mist); color:var(--sage-70)} .kpi .ytdl b{color:var(--ink)} .kpi .ytdl b.neg{color:var(--alert)}
.kpi .chg{font-size:12px; margin-top:4px; color:var(--sage-70)}
.kpi .chg.good{color:var(--good)} .kpi .chg.bad{color:var(--alert)}
.sevgrp{margin-bottom:10px}
.sevgrp > summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:40px; font-weight:600}
.sevgrp > summary::-webkit-details-marker{display:none}
.sevgrp > summary::before{content:"\25B8"; color:var(--sage-70); width:12px}
.sevgrp[open] > summary::before{content:"\25BE"}
.chip{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap}
.chip.high{background:var(--alert); color:#fff} .chip.medium{background:var(--attention); color:#fff} .chip.low{background:var(--mist); color:var(--sage)} .chip.info{background:var(--blue-bg); color:var(--blue)}
.find{border-left:4px solid var(--mist); padding:8px 0 8px 12px; margin:6px 0 10px}
.find.high{border-left-color:var(--alert)} .find.medium{border-left-color:var(--attention)} .find.info{border-left-color:var(--blue)}
.find .ft{font-weight:600} .find .fd{font-size:14px; color:#444; margin-top:2px}
.find .fb{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.tbar{display:flex; gap:10px 18px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.tbar .tick{display:flex; align-items:center; gap:8px; cursor:pointer; min-height:36px; font-size:14px}
.tbar .tick input{width:20px; height:20px; accent-color:var(--sage); margin:0}
.plwrap{overflow:auto; border:1px solid var(--mist); border-radius:var(--radius); background:var(--white); position:relative}
@media (min-width:900px){ .plwrap{max-height:78vh} }
table.pl{border-collapse:separate; border-spacing:0; font-size:13px; min-width:100%}
table.pl th, table.pl td{padding:6px 10px; border-bottom:1px solid #f0f0ee; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; background:var(--white)}
table.pl thead th{position:sticky; top:0; z-index:3; background:var(--sage-10); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); font-weight:700; border-bottom:1px solid var(--celadon)}
table.pl th.ln, table.pl td.ln{position:sticky; left:0; z-index:2; text-align:left; min-width:150px; max-width:210px; width:190px; white-space:normal; border-right:1px solid var(--mist)}
table.pl thead th.ln{z-index:4}
table.pl td.ln{display:table-cell}
.lnin{display:flex; align-items:center; gap:6px; justify-content:space-between}
.lnin .nm{overflow-wrap:anywhere; line-height:1.25}
table.pl th.cur, table.pl td.cur{background:#f5f2ea; font-weight:600}
table.pl thead th.cur{background:var(--attention-bg); box-shadow:inset 0 -3px 0 var(--gold)}
table.pl th.plan, table.pl td.plan{font-style:italic; color:var(--sage-70); min-width:58px}
table.pl td.ytd{background:#eef3ee; font-weight:700}
table.pl thead th.ytd{background:#dfe8df}
table.pl tr.total td.ytd, table.pl tr.gp td.ytd, table.pl tr.op td.ytd{background:#dfe8df}
table.pl th.sep, table.pl td.sep{border-left:1px solid var(--mist)}
table.pl tr.sec td{background:var(--sage); color:#fff; font-family:var(--display); font-size:17px; font-weight:600; text-align:left; padding:5px 10px; cursor:pointer}
table.pl tr.sec td.ln{background:var(--sage)}
table.pl tr.total td{font-weight:700; border-top:1px solid var(--celadon); background:#fafaf8}
table.pl tr.total td.cur{background:#efe9d8}
table.pl tr.gp td, table.pl tr.op td{font-weight:700; background:var(--sage-10); border-top:2px solid var(--sage-70); border-bottom:2px solid var(--sage-70)}
table.pl tr.gp td.cur, table.pl tr.op td.cur{background:#e4e3d6}
table.pl tr.line:hover td{background:#fbfbf6} table.pl tr.line:hover td.cur{background:#f0ecdf}
table.pl td.f-low{background:#fbf6e6 !important; box-shadow:inset 0 0 0 1px rgba(176,141,87,.35)}
table.pl td.f-medium{background:#f5e3bd !important; box-shadow:inset 0 0 0 1px rgba(176,141,87,.8)}
table.pl td.f-high{background:#efc6bf !important; box-shadow:inset 0 0 0 1px rgba(140,74,63,.7); font-weight:700}
table.pl tr.pulse td{animation:plpulse 1.5s ease 2}
@keyframes plpulse{40%{background-color:#e8cf9a}}
table.pl tr.thr td{padding:0; background:var(--bone); text-align:left; white-space:normal}
.thread{position:sticky; left:0; width:min(680px, var(--wrapw, calc(100vw - 64px))); padding:12px 14px 14px}
.bub{flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; border:0; background:transparent; cursor:pointer; color:var(--sage-70); padding:4px 6px; border-radius:6px; min-width:32px; min-height:32px; justify-content:center; font-size:11px; font-weight:700}
.bub:hover{background:var(--sage-10); color:var(--sage)}
.bub.has{color:var(--sage)} .bub.hasopen{color:#6d5320; background:var(--attention-bg)}
.bub svg{width:16px; height:16px}
.spk{display:block; margin-left:auto}
.cm{padding:9px 0; border-bottom:1px solid var(--mist)} .cm:last-of-type{border-bottom:0}
.cm .h{font-size:12px; color:var(--sage-70); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.cm .h b{color:var(--ink)}
.cm .b{white-space:pre-wrap; margin-top:3px; overflow-wrap:anywhere}
.cm.done .b{color:var(--sage-70)}
.cm .ca{display:flex; gap:12px; margin-top:4px}
.compose{margin-top:10px}
.compose textarea{min-height:70px; width:100%; padding:10px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
.compose textarea:focus{outline:2px solid var(--gold); outline-offset:0}
.compose .cmrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px}
.compose select{padding:8px 10px; border:1px solid var(--mist); border-radius:8px; font-size:14px; background:var(--white)}
.gen textarea{min-height:120px; font-size:16px}
.callbox{text-align:center; padding:30px 22px}
.callbox .field{max-width:520px; margin:0 auto 14px; text-align:left}
.cleanfoot{text-align:center; margin-top:18px}
.tag.xl{background:var(--good-bg); color:var(--good)}
.rvpane.off{display:none}
body.wide .shell{max-width:none}
.swrow{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; margin:0 0 14px}
.seg{display:inline-flex; border:1px solid var(--sage); border-radius:8px; overflow:hidden; background:var(--white)}
.seg button{border:0; background:var(--white); color:var(--sage); padding:9px 20px; min-height:44px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:12px; cursor:pointer}
.seg button + button{border-left:1px solid var(--sage)}
.seg button[aria-pressed="true"]{background:var(--sage); color:#fff}
.wbbar{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.wbbar .findbox{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.wbbar input[type=search]{padding:9px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white); width:220px; max-width:100%}
.wbbar .cnt{font-size:13px; color:var(--sage-70); min-width:70px}
.wbnote{font-size:13px; color:var(--sage-70); margin:10px 0 0}
.xgwrap{overflow:auto; max-height:72vh; border:1px solid var(--mist); border-radius:var(--radius); background:#fff; position:relative}
@media (min-width:900px){ .xgwrap{max-height:calc(100vh - 250px); min-height:360px} }
table.xg{border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed}
table.xg th{background:#f1f1ee; color:var(--sage-70); font-weight:600; font-size:11px; text-align:center; border-right:1px solid #dcdcd8; border-bottom:1px solid #dcdcd8; padding:2px 4px; position:sticky; top:0; z-index:3; overflow:hidden}
table.xg th.rn{left:0; top:auto; z-index:2; text-align:right; width:46px; min-width:46px; padding-right:6px}
table.xg thead th.rn{top:0; z-index:5}
table.xg td{border-right:1px solid #ececea; border-bottom:1px solid #ececea; padding:2px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; height:23px; background:#fff; position:relative}
table.xg td.n{text-align:right}
table.xg td.ng{color:var(--alert)}
table.xg td.b{font-weight:700}
table.xg td.hasf::after{content:"\0192"; position:absolute; top:0; right:2px; font-size:8px; line-height:1; color:var(--sage-70); font-style:italic; opacity:.8}
table.xg td.fz{position:sticky; left:46px; z-index:1; border-right:2px solid #cfcfca}
table.xg td.hit{background:#fff0a8 !important}
table.xg td.hitcur{background:#ffc94d !important; box-shadow:inset 0 0 0 2px #b08d57}
.shtabs{position:relative; display:flex; gap:4px; overflow-x:auto; padding:8px 2px 2px; margin-top:6px; border-top:1px solid var(--mist)}
.shtabs button{flex:0 0 auto; border:1px solid var(--mist); border-top:0; border-radius:0 0 8px 8px; background:#f3f3f1; padding:8px 14px; min-height:40px; cursor:pointer; font-size:13px; white-space:nowrap; color:var(--ink)}
.shtabs button[aria-pressed="true"]{background:var(--white); color:var(--sage); font-weight:700; box-shadow:inset 0 -3px 0 var(--gold)}
.shtabs button.hid{font-style:italic; color:var(--sage-70)}
.shtabs .tgl{margin-left:auto; flex:0 0 auto; align-self:center; padding-left:10px}

@media (max-width:640px){
  .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .pagehead h2{font-size:22px}
  .btn{width:100%} .btn.small{width:auto}
  .card{padding:16px 14px}
  .rvhead h2{font-size:25px}
  .filters .field,.filters .field select{width:100%}
  .pcard{padding:14px}
  .row2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)} .kpi .v{font-size:24px}
  table.pl th.ln, table.pl td.ln{min-width:140px; width:144px; max-width:150px} .lnin .nm{font-size:12px; overflow-wrap:break-word}
  table.pl th, table.pl td{padding:6px 8px}
  .thread{padding:10px 10px 12px}
  .rvhead .acts .btn{width:100%}
}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>P&amp;L Review</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">P&amp;L Review<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>

    let t = "";
    if (w) { w.location.href = url; t = present ? "The call and the P&L have opened in new windows. In the call, press Share your screen and choose the P&L window." : "The call has opened in a new window."; msg.textContent = t; }
    else msg.innerHTML = `Your browser blocked the new window. <a href="${esc(url)}" target="_blank" rel="noopener">Open the call</a>.`;
    if (present && !wp) msg.innerHTML += ` Your browser also blocked the P&amp;L window. <a href="${esc(plUrl)}" target="_blank" rel="noopener">Open the P&amp;L</a>.`;
  } catch(e){ if (w) w.close(); if (wp) wp.close(); msg.textContent = ""; toast(e.message, true); }
  [b1, b2].forEach(b => { if (b) b.disabled = false; });
}

/* ------------------------------------------------------------- events */
document.addEventListener("dragover", e => { e.preventDefault(); const z = e.target.closest && e.target.closest("[data-drop]"); $$("[data-drop]").forEach(x => x.classList.toggle("over", x === z)); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) $$("[data-drop]").forEach(x => x.classList.remove("over")); });
document.addEventListener("drop", e => {
  e.preventDefault(); $$("[data-drop]").forEach(x => x.classList.remove("over"));
  if (e.target.closest && e.target.closest("[data-drop]")) { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); }
});
document.addEventListener("toggle", e => { const d = e.target; if (d && d.dataset && d.dataset.sev) S.sevOpen[d.dataset.sev] = d.open; }, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "afile") { const f = t.files && t.files[0]; t.value = ""; if (f) startAttach(f); }
  else if (t.id === "pfile") { const f = t.files && t.files[0]; t.value = ""; if (f) handleFile(f); }
  else if (t.dataset && t.dataset.fy !== undefined) { S.fy = t.value; renderList("final"); }
  else if (t.dataset && t.dataset.onlycm !== undefined) { S.onlyCommented = t.checked; keepState(renderTable); }
  else if (t.dataset && t.dataset.upmode !== undefined) { S.up.mode = t.value; if (!("up:title" in S.drafts)) S.up.title = (t.value === "replace" && S.up.existing) ? S.up.existing.title : S.up.parsedTitle; renderUpload(); }
  else if (t.id === "pickpl") { S.pickPresent = t.value; fillPickShow(); }
  else if (t.id === "pickshow") S.pickShow = t.value;
});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-retry],[data-back],[data-pick],[data-upsave],[data-upcancel],[data-upclose],[data-sure],[data-replace],[data-thread],[data-post],[data-resolve],[data-cdel],[data-show],[data-fcomment],[data-sec],[data-gotodisc],[data-unclean],[data-rvview],[data-attach],[data-attachcancel],[data-wbretry],[data-wbdl],[data-wbprev],[data-wbnext],[data-sheet],[data-wbhidden],#calljoin,#callpresent");
  if (!t) return;
  const d = t.dataset;
  if (d.open) return openReview(d.open);
  if (d.rvview) return setRvView(d.rvview);
  if (d.attach !== undefined) { const f = $("#afile"); if (f) f.click(); return; }
  if (d.attachcancel !== undefined) { S.att = null; S.sure = null; renderAttach(); renderSwitch(); return; }
  if (d.wbretry !== undefined) return loadWorkbook(true);
  if (d.wbdl !== undefined) return downloadWorkbook();
  if (d.wbprev !== undefined) return stepHit(-1);
  if (d.wbnext !== undefined) return stepHit(1);
  if (d.sheet !== undefined) { if (S.wb) { S.wb.sheet = d.sheet; S.wb.hitIdx = -1; S.wb.jump = true; renderWorkbook(); } return; }
  if (d.wbhidden !== undefined) { if (S.wb) { S.wb.showHidden = !S.wb.showHidden; if (!S.wb.showHidden && (S.wb.sheets.find(s => s.name === S.wb.sheet) || {}).hidden) S.wb.sheet = (S.wb.sheets.find(s => !s.hidden) || S.wb.sheets[0]).name; renderWorkbook(); } return; }
  if (d.retry) return viewList(d.retry);
  if (d.back !== undefined) return closeReview();
  if (d.pick !== undefined) { const f = $("#pfile"); if (f) f.click(); return; }
  if (d.upsave !== undefined) return saveUpload(t);
  if (d.upcancel !== undefined) { if (S.up && S.up.replaceId) S.up = { phase:"idle", replaceId:S.up.replaceId }; else S.up = null; delete S.drafts["up:title"]; delete S.drafts["up:fy"]; return renderUpload(); }
  if (d.upclose !== undefined) { S.up = null; const h = $("#rv_replace"); if (h) h.innerHTML = ""; return; }
  if (d.replace !== undefined) { S.up = { phase:"idle", replaceId:S.rv.review.id }; renderUpload(); const h = $("#rv_replace"); if (h) h.scrollIntoView({ block:"nearest", behavior:"smooth" }); return; }
  if (d.sure) return doSure(d.sure);
  if (d.thread !== undefined) { S.openThreads[d.thread] = !S.openThreads[d.thread]; if (S.openThreads[d.thread]) return openThread(d.thread); return keepState(renderTable); }
  if (d.post !== undefined) return postComment(d.post, t);
  if (d.resolve) return resolveComment(d.resolve, d.v === "1");
  if (d.cdel) return deleteComment(d.cdel);
  if (d.show) return showRow(d.show);
  if (d.fcomment) return commentOnFinding(d.fcomment);
  if (d.sec) { S.secClosed[d.sec] = !S.secClosed[d.sec]; return keepState(renderTable); }
  if (d.gotodisc !== undefined) { const el = $("#discussion"); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
  if (d.unclean !== undefined) { S.clean = false; document.body.classList.remove("clean"); setRvUrl(); return renderReview(); }
  if (t.id === "calljoin") return joinCall(false);
  if (t.id === "callpresent") return joinCall(true);
});
document.addEventListener("keydown", e => { if ((e.key === "Enter") && (e.ctrlKey || e.metaKey) && e.target.dataset && e.target.dataset.draft && e.target.tagName === "TEXTAREA") { const b = e.target.closest(".compose").querySelector("[data-post]"); if (b) b.click(); } });

/* ------------------------------------------------------------- shell */
function markTab(){ $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false")); }
async function goView(v){
  S.view = v; S.rv = null; S.an = null; S.up = null; S.wb = null; S.att = null; document.body.classList.remove("wide"); stopPoll(); markTab(); window.scrollTo(0, 0);
  if (v === "call") return viewCall();
  return viewList(v);
}
function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  const q = new URLSearchParams(location.search), openId = q.get("open"), clean = q.get("clean") === "1";
  if (openId && clean) { S.clean = true; document.body.classList.add("clean"); }
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.tabs = Array.isArray(d.tabs) ? d.tabs : null; $("#whoname").textContent = S.me.name;
  if (S.tabs) $$(".tabbtn").forEach(b => { if (!S.tabs.includes(b.dataset.view)) b.remove(); });
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => { if (S.clean) { S.clean = false; document.body.classList.remove("clean"); } if (S.rv) { try { history.replaceState(null, "", location.pathname); } catch(e){} } goView(b.dataset.view); }));
  const c = d.counts || {}; setBadge("draft", c.draft); setBadge("final", c.final);
  if (openId) { S.direct = true; return openReview(openId, { clean, view:q.get("view") || undefined }); }
  const first = $(".tabbtn"); goView(first ? first.dataset.view : "draft");
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
</body>
