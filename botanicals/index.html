<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black Horse Botanicals</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28;
  --bone:#F8F8F8; --mist:#E7E7E7; --white:#fff; --ink:#262626; --olive:#CCCDB4;
  --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1040px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; font-style:normal}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1; text-transform:uppercase; letter-spacing:.08em}
.who{margin-left:auto; font-size:12px; opacity:.9}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--olive)}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 14px}
.pagehead h2{font-size:26px; color:var(--sage)} .pagehead .hint{font-size:13px; color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px} .btn:disabled{opacity:.5; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.card p{margin:0 0 10px}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:8px 16px; cursor:pointer; font-size:13px; min-height:40px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.filters input,.filters select{padding:9px 12px; border:1px solid var(--mist); border-radius:8px; background:var(--white)}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.kpi{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.kpi .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.kpi .v{font-family:var(--display); font-size:36px; color:var(--sage); line-height:1.1} .kpi .s{font-size:12px; color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px} .grid2 > .card{margin-bottom:0}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:90px; resize:vertical}
.sw{display:flex; align-items:center; gap:10px; margin-bottom:14px} .sw input{width:22px; height:22px; margin:0} .sw label{font-weight:600}
.note{background:var(--attention-bg); color:#6d5320; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:12px}
.muted{color:var(--sage-70)} .empty{padding:36px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.good{background:var(--good-bg); color:var(--good)} .tag.bad{background:var(--alert-bg); color:var(--alert)}
table.t{width:100%; border-collapse:collapse; font-size:13.5px} .t th,.t td{padding:8px; text-align:left; border-bottom:1px solid var(--mist); vertical-align:middle}
.t th{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:600} .t .r{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums} .tw{overflow-x:auto}
.t input[type=text],.t input[type=number]{width:100%; min-width:70px; padding:8px 9px; border:1px solid var(--mist); border-radius:6px; font-size:14px; background:var(--white)}
.t input[type=number]{max-width:96px}
.bar{height:8px; border-radius:4px; background:var(--sage-10); min-width:60px} .bar i{display:block; height:100%; border-radius:4px; background:var(--sage)}
details{margin-top:4px} summary{cursor:pointer; color:var(--sage); font-weight:600}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:720px){ .grid2{grid-template-columns:1fr} }
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .btn{width:100%} .btn.small{width:auto} .pagehead h2{font-size:22px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Black Horse Botanicals</h1><div class="sub">Reports and products</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand" id="brandname">Black Horse Botanicals</div><div class="who" id="whoname"></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist">
    <button class="tabbtn" data-view="reports" hidden>Reports</button>
    <button class="tabbtn" data-view="products" hidden>Products</button>
    <button class="tabbtn" data-view="settings" hidden>Receipt</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/shared/insights.js"></script>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { me:null, view:"reports", range:"7", from:"", to:"", data:null, products:null, settings:null, byProduct:false };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = Viz.esc;
const money = n => { n = Number(n) || 0; return (n < 0 ? "-" : "") + "£" + Math.abs(n).toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 }); };
const ukDay = iso => new Date(iso).toLocaleDateString("en-CA", { timeZone:"Europe/London" });
const ukHour = iso => +new Date(iso).toLocaleTimeString("en-GB", { timeZone:"Europe/London", hour:"2-digit", hour12:false }).slice(0,2);
const fmtDT = iso => { try { return new Date(iso).toLocaleString("en-GB", { timeZone:"Europe/London", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).replace(",", ""); } catch(e){ return ""; } };
const fmtD = d => { try { return new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"short", day:"numeric", month:"short" }); } catch(e){ return d; } };
const addDays = (d, n) => new Date(new Date(d + "T12:00:00Z").getTime() + n * 864e5).toISOString().slice(0,10);
const today = () => ukDay(new Date().toISOString());
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/botanicals-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify(Object.assign({ action, staff_email: staffEmail() }, payload || {})) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const can = tab => S.me && (S.me.isAdmin || S.me.tabs.includes(tab));

/* =========================================================== reports */
function rangeDates(){
  const t = today();
  switch (S.range) {
    case "0": return [t, t];
    case "1": return [addDays(t, -1), addDays(t, -1)];
    case "7": return [addDays(t, -6), t];
    case "month": return [t.slice(0,8) + "01", t];
    case "last": { const first = t.slice(0,8) + "01", end = addDays(first, -1); return [end.slice(0,8) + "01", end]; }
    case "custom": return [S.from || addDays(t, -6), S.to || t];
    default: return [addDays(t, -6), t];
  }
}
async function viewReports(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  const [from, to] = rangeDates();
  try { S.data = await call("reports.load", { from, to }); } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  paintReports();
}
const lineValue = (s, l) => (s.is_refund ? -1 : 1) * Math.abs(Number(l.qty) || 0) * (Number(l.unitPrice) || 0);
const lineQty = (s, l) => (s.is_refund ? -1 : 1) * Math.abs(Number(l.qty) || 0);
function paintReports(){
  const [from, to] = rangeDates(), d = S.data;
  const sales = d.sales.filter(s => ukDay(s.ts) >= from && ukDay(s.ts) <= to);
  const voids = d.voids.filter(x => ukDay(x.ts) >= from && ukDay(x.ts) <= to);
  const gross = sales.filter(s => !s.is_refund).reduce((t, s) => t + Math.abs(Number(s.total)), 0);
  const refunds = sales.filter(s => s.is_refund).reduce((t, s) => t + Math.abs(Number(s.total)), 0);
  const nSales = sales.filter(s => !s.is_refund).length;
  const agg = (keyFn) => { const m = new Map(); sales.forEach(s => (s.lines || []).forEach(l => { const k = keyFn(l, s); const o = m.get(k) || { qty:0, value:0 }; o.qty += lineQty(s, l); o.value += lineValue(s, l); m.set(k, o); })); return [...m.entries()].map(([k, o]) => ({ k, ...o })).sort((a, b) => b.value - a.value); };
  const prods = agg(l => l.name || "Unnamed"), cats = agg(l => l.category || "Products");
  const bar = (v, max) => `<div class="bar"><i style="width:${max > 0 ? Math.max(2, Math.round(Math.max(v, 0) / max * 100)) : 0}%"></i></div>`;
  const days = [...new Set(sales.map(s => ukDay(s.ts)))].sort();
  const perDay = days.map(day => ({ day, v: sales.filter(s => ukDay(s.ts) === day).reduce((t, s) => t + Number(s.total), 0), n: sales.filter(s => ukDay(s.ts) === day && !s.is_refund).length }));
  const hours = Array.from({ length:24 }, (_, h) => sales.filter(s => !s.is_refund && ukHour(s.ts) === h).reduce((t, s) => t + Number(s.total), 0));
  const team = new Map(); sales.forEach(s => { const k = s.team_member || "Not given", o = team.get(k) || { n:0, sales:0, refunds:0 }; if (s.is_refund) o.refunds += Math.abs(Number(s.total)); else { o.n++; o.sales += Number(s.total); } team.set(k, o); });
  const bySession = new Map(); d.sales.forEach(s => { const o = bySession.get(s.session_id) || { n:0, v:0 }; o.n++; o.v += Number(s.total); bySession.set(s.session_id, o); });
  const sessions = d.sessions.filter(x => { const k = ukDay(x.first_sale_at || x.opened_at); return k >= from && k <= to && bySession.has(x.id); });

  let h = `<div class="pagehead"><h2>Reports</h2><span class="hint">${esc(d.business_name)} · gross takings, no VAT</span><span class="spacer"></span><button class="btn ghost small" id="csv">Download CSV</button></div>
  <div class="chips">${[["0","Today"],["1","Yesterday"],["7","Last 7 days"],["month","This month"],["last","Last month"],["custom","Choose dates"]].map(([k, l]) => `<button class="chip" data-range="${k}" aria-pressed="${S.range === k}">${l}</button>`).join("")}</div>
  ${S.range === "custom" ? `<div class="filters"><label>From <input type="date" id="rf" value="${esc(from)}"></label><label>To <input type="date" id="rt" value="${esc(to)}"></label><button class="btn small" id="rgo">Show</button></div>` : ""}
  <div class="kpis"><div class="kpi"><div class="l">Sales</div><div class="v">${money(gross)}</div><div class="s">${nSales} sale${nSales === 1 ? "" : "s"}</div></div>
    <div class="kpi"><div class="l">Refunds</div><div class="v">${money(refunds)}</div><div class="s">${sales.filter(s => s.is_refund).length} refund${sales.filter(s => s.is_refund).length === 1 ? "" : "s"}</div></div>
    <div class="kpi"><div class="l">Net takings</div><div class="v">${money(gross - refunds)}</div><div class="s">${fmtD(from)}${from === to ? "" : " to " + fmtD(to)}</div></div>
    <div class="kpi"><div class="l">Average sale</div><div class="v">${money(nSales ? gross / nSales : 0)}</div><div class="s">per transaction</div></div></div>`;
  if (!sales.length) return $("#views").innerHTML = h + `<div class="card"><div class="empty">No sales in this period.</div></div>`, bindReports(sales);
  const maxP = Math.max(...prods.map(p => p.value), 0), maxC = Math.max(...cats.map(p => p.value), 0);
  h += `<div class="grid2"><div class="card"><h3>By product</h3><div class="tw"><table class="t"><tr><th>Product</th><th class="r">Qty</th><th class="r">Takings</th><th></th></tr>${prods.map(p => `<tr><td>${esc(p.k)}</td><td class="r">${p.qty}</td><td class="r">${money(p.value)}</td><td style="width:90px">${bar(p.value, maxP)}</td></tr>`).join("")}</table></div></div>
    <div class="card"><h3>By category</h3><div class="tw"><table class="t"><tr><th>Category</th><th class="r">Qty</th><th class="r">Takings</th><th></th></tr>${cats.map(p => `<tr><td>${esc(p.k)}</td><td class="r">${p.qty}</td><td class="r">${money(p.value)}</td><td style="width:90px">${bar(p.value, maxC)}</td></tr>`).join("")}</table></div></div></div>`;
  if (perDay.length > 1) { const mx = Math.max(...perDay.map(x => x.v)); h += `<div class="card" style="margin-top:14px"><h3>By day</h3><div class="tw"><table class="t"><tr><th>Day</th><th class="r">Sales</th><th class="r">Takings</th><th></th></tr>${perDay.map(x => `<tr><td>${fmtD(x.day)}</td><td class="r">${x.n}</td><td class="r">${money(x.v)}</td><td style="width:140px">${bar(x.v, mx)}</td></tr>`).join("")}</table></div></div>`; }
  const mh = Math.max(...hours); const used = hours.map((v, i) => [i, v]).filter(x => x[1] > 0);
  if (used.length) h += `<div class="card" style="margin-top:14px"><h3>By hour of the day</h3><div class="tw"><table class="t">${used.map(([i, v]) => `<tr><td style="width:70px">${String(i).padStart(2, "0")}:00</td><td>${bar(v, mh)}</td><td class="r" style="width:100px">${money(v)}</td></tr>`).join("")}</table></div></div>`;
  h += `<div class="card" style="margin-top:14px"><h3>Team</h3><div class="tw"><table class="t"><tr><th>Team member</th><th class="r">Sales</th><th class="r">Takings</th><th class="r">Refunds</th></tr>${[...team.entries()].map(([k, o]) => `<tr><td>${esc(k)}</td><td class="r">${o.n}</td><td class="r">${money(o.sales)}</td><td class="r">${money(o.refunds)}</td></tr>`).join("")}</table></div></div>`;
  if (sessions.length) h += `<div class="card"><h3>Sessions (the till's Z-reads)</h3><div class="tw"><table class="t"><tr><th>Opened</th><th>Closed</th><th>Tablet</th><th class="r">Transactions</th><th class="r">Takings</th></tr>${sessions.map(x => { const o = bySession.get(x.id); return `<tr><td>${fmtDT(x.opened_at)}</td><td>${x.closed ? fmtDT(x.closed_at) : `<span class="tag good">Open</span>`}</td><td>${esc(x.device_label || "")}</td><td class="r">${o.n}</td><td class="r">${money(o.v)}</td></tr>`; }).join("")}</table></div></div>`;
  h += `<div class="card"><h3>Sales</h3><p class="muted">Latest ${Math.min(sales.length, 150)} of ${sales.length}.</p><div class="tw"><table class="t"><tr><th>Time</th><th>No.</th><th>Team member</th><th class="r">Total</th><th>Items</th></tr>${sales.slice(0, 150).map(s => `<tr><td>${fmtDT(s.ts)}</td><td>${s.seq}</td><td>${esc(s.team_member || "")}</td><td class="r">${s.is_refund ? `<span class="tag bad">Refund</span> ` : ""}${money(s.total)}</td><td>${(s.lines || []).map(l => esc(`${l.qty} × ${l.name}`)).join(", ")}</td></tr>`).join("")}</table></div></div>`;
  if (voids.length) h += `<div class="card"><h3>Items removed before payment</h3><div class="tw"><table class="t"><tr><th>Time</th><th>Team member</th><th>Item</th><th class="r">Qty</th><th class="r">Value</th></tr>${voids.map(x => `<tr><td>${fmtDT(x.ts)}</td><td>${esc(x.team_member || "")}</td><td>${esc(x.item_name)}</td><td class="r">${x.qty}</td><td class="r">${money(x.qty * x.unit_price)}</td></tr>`).join("")}</table></div></div>`;
  $("#views").innerHTML = h; bindReports(sales);
}
function bindReports(sales){
  $$("[data-range]").forEach(b => b.onclick = () => { S.range = b.dataset.range; if (S.range === "custom") { const [f, t] = rangeDates(); S.from = f; S.to = t; paintReports(); } else viewReports(); });
  if ($("#rgo")) $("#rgo").onclick = () => { S.from = $("#rf").value; S.to = $("#rt").value; if (!S.from || !S.to || S.from > S.to) { toast("Choose a start date that is not after the end date.", true); return; } viewReports(); };
  if ($("#csv")) $("#csv").onclick = () => {
    const out = [["Date","Time","Receipt no.","Team member","Refund","Product","Category","Qty","Unit price","Line value"]];
    sales.forEach(s => (s.lines || []).forEach(l => out.push([ukDay(s.ts), new Date(s.ts).toLocaleTimeString("en-GB", { timeZone:"Europe/London", hour:"2-digit", minute:"2-digit" }), s.seq, s.team_member || "", s.is_refund ? "Yes" : "", l.name, l.category || "", lineQty(s, l), Number(l.unitPrice) || 0, lineValue(s, l).toFixed(2)])));
    const [f, t] = rangeDates(); Viz.csv(out, `botanicals-sales-${f}-to-${t}.csv`);
  };
}

/* =========================================================== products */
async function viewProducts(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  try { S.products = (await call("products.list")).products; } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  paintProducts();
}
function paintProducts(){
  const ps = S.products, cats = [...new Set(ps.map(p => p.category))].sort();
  const row = p => `<tr data-id="${p ? esc(p.id) : ""}"><td><input type="text" data-f="name" value="${p ? esc(p.name) : ""}" placeholder="Product name"></td><td><input type="text" data-f="category" list="catlist" value="${p ? esc(p.category) : ""}" placeholder="Products"></td>
    <td><input type="number" step="0.01" min="0" data-f="price" value="${p ? Number(p.price).toFixed(2) : ""}" placeholder="0.00"></td><td><input type="number" step="1" data-f="sort_order" value="${p ? p.sort_order : ""}" placeholder="auto"></td>
    <td style="text-align:center"><input type="checkbox" data-f="active" ${!p || p.active ? "checked" : ""} style="width:20px;height:20px"></td>
    <td class="r"><button class="btn small" data-save>${p ? "Save" : "Add"}</button>${p ? ` <button class="btn danger small" data-del>Delete</button>` : ""}</td></tr>`;
  $("#views").innerHTML = `<div class="pagehead"><h2>Products</h2><span class="hint">What appears on the till screen. Tablets pick up changes within a few minutes, or press Sync now on the till.</span></div>
  <div class="note">Products that are not ticked “Shown on till” are hidden from the till but kept here. Lower numbers appear first within a category.</div>
  <datalist id="catlist">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
  <div class="card"><h3>Add a product</h3><div class="tw"><table class="t"><tr><th>Name</th><th>Category</th><th>Price (£)</th><th>Order</th><th>Shown on till</th><th></th></tr>${row(null)}</table></div></div>
  <div class="card"><h3>${ps.length} product${ps.length === 1 ? "" : "s"}</h3>${ps.length ? `<div class="tw"><table class="t"><tr><th>Name</th><th>Category</th><th>Price (£)</th><th>Order</th><th>Shown on till</th><th></th></tr>${ps.map(row).join("")}</table></div>` : `<div class="empty">No products yet. Add the first one above.</div>`}</div>`;
  $$("tr [data-save]").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr"), g = f => tr.querySelector(`[data-f="${f}"]`), body = { id: tr.dataset.id || undefined, name: g("name").value, category: g("category").value, price: g("price").value, sort_order: g("sort_order").value, active: g("active").checked };
    b.disabled = true;
    try { await call("products.save", body); toast(tr.dataset.id ? "Saved." : "Added."); viewProducts(); } catch(e){ toast(e.message, true); b.disabled = false; }
  });
  $$("tr [data-del]").forEach(b => b.onclick = async () => {
    const tr = b.closest("tr"), name = tr.querySelector('[data-f="name"]').value;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? Press again"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "Delete"; }, 4000); return; }
    b.disabled = true;
    try { await call("products.delete", { id: tr.dataset.id }); toast(`Deleted ${name}.`); viewProducts(); } catch(e){ toast(e.message, true); b.disabled = false; }
  });
}

/* =========================================================== receipt settings */
async function viewSettings(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  try { S.settings = (await call("settings.get")).settings; } catch(e){ v.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const s = S.settings;
  v.innerHTML = `<div class="pagehead"><h2>Receipt</h2><span class="hint">What is printed on the receipt and at the top of the tablet's reports.</span></div>
  <div class="card"><h3>Receipt wording</h3>
    <div class="field"><label>Business name</label><input id="s_name" value="${esc(s.business_name || "")}"></div>
    <div class="field"><label>Address and contact lines (one per line, printed under the name)</label><textarea id="s_addr" rows="4">${esc(s.address_lines || "")}</textarea></div>
    <div class="field"><label>Message at the bottom</label><input id="s_foot" value="${esc(s.footer || "")}"></div>
    <div class="sw"><input type="checkbox" id="s_print" ${s.print_receipts ? "checked" : ""}><label for="s_print">Print a receipt automatically after every sale (there is always a Print receipt button on the till)</label></div>
    <button class="btn" id="s_save">Save</button> <button class="btn ghost" id="s_test">Print a test receipt</button>
    <p class="muted" style="font-size:13px;margin-top:10px">Receipts print on the bar printer. The test receipt is marked TEST and shows your wording. This business is not VAT registered, so receipts carry no VAT details.</p></div>`;
  $("#s_save").onclick = async () => { const b = $("#s_save"); b.disabled = true; try { await call("settings.save", { business_name:$("#s_name").value, address_lines:$("#s_addr").value, footer:$("#s_foot").value, print_receipts:$("#s_print").checked }); toast("Saved. Tablets pick it up within a few minutes."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
  $("#s_test").onclick = async () => { const b = $("#s_test"); b.disabled = true; try { await call("print.test"); toast("Sent to the bar printer."); } catch(e){ toast(e.message, true); } finally { b.disabled = false; } };
}

/* =========================================================== shell */
function goView(v){
  S.view = v; $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  ({ reports:viewReports, products:viewProducts, settings:viewSettings }[v] || viewReports)();
  window.scrollTo(0, 0);
}
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; $("#whoname").textContent = S.me.name;
  const tabs = $$(".tabbtn").filter(b => can(b.dataset.view)); $$(".tabbtn").forEach(b => { b.hidden = !tabs.includes(b); b.addEventListener("click", () => goView(b.dataset.view)); });
  if (!tabs.length) { $("#views").innerHTML = `<div class="empty">You do not have any tabs here yet.</div>`; return; }
  goView(tabs[0].dataset.view);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
</script>
</body>
</html>
