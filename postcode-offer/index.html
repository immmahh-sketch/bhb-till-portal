<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Postcode offer - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#6c796d; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --attention-ink:#6d5320; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#2f6a3d; --good-bg:#E4F0E6;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:12px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:760px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0}
button,input{font:inherit; color:inherit}
.off{display:none!important}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 56px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)} .tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex}
.tabbtn{background:transparent; border:0; color:var(--white); padding:12px 16px; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid var(--gold)}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:11px 20px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:46px}
.btn:hover{background:var(--sage-dark)} .btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin:14px 0}
.dayline{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:700; margin:20px 2px 0}
.pcrow{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 0; border-bottom:1px solid var(--mist)}
.pcrow:last-child{border-bottom:0}
.pct{flex:none; width:92px; text-align:center; border-radius:10px; padding:8px 0; font-family:var(--display); font-size:34px; font-weight:700; line-height:1}
.pct small{display:block; font-family:var(--body); font-size:10px; letter-spacing:.14em; text-transform:uppercase; margin-top:3px; font-weight:700}
.p50{background:var(--good-bg); color:var(--good)} .p25{background:var(--attention-bg); color:var(--attention-ink)}
.pcode{font-family:var(--display); font-size:44px; font-weight:700; letter-spacing:.03em; line-height:1.05}
.parea{font-size:13.5px; color:var(--sage-70)}
.none{color:var(--sage-70); font-style:italic}
.rules{background:var(--alert-bg); border-left:5px solid var(--alert); border-radius:8px; padding:12px 16px; margin:14px 0}
.rules b{color:var(--alert); display:block; margin-bottom:4px; letter-spacing:.04em}
.rules ul{margin:0; padding-left:20px} .rules li{margin:3px 0}
.field{display:flex; gap:10px; flex-wrap:wrap}
.field input{flex:1 1 180px; min-width:0; border:1px solid var(--celadon); border-radius:8px; padding:10px 12px; font-size:20px; text-transform:uppercase; letter-spacing:.06em; min-height:48px}
.result{margin-top:12px; border-radius:8px; padding:12px 14px; font-weight:600}
.result.r50{background:var(--good-bg); color:var(--good)} .result.r25{background:var(--attention-bg); color:var(--attention-ink)} .result.r0{background:var(--mist); color:#555}
.big{font-family:var(--display); font-size:28px; text-align:center; padding:26px 12px; color:var(--sage)}
@media (max-width:520px){ .pcode{font-size:38px} .pct{width:80px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Postcode offer</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a></div></div>
<div id="app" class="off">
  <header class="top"><div class="topin"><div class="brand">Postcode offer<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout" type="button">Sign out</button></div></div></header>
  <nav class="tabs" aria-label="Sections"><div class="tabsin"><button class="tabbtn" type="button" data-view="today" aria-current="page">Today</button></div></nav>
  <div class="shell"><main id="main"></main></div>
</div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  let r;
  try { r = await fetch(CFG.SUPABASE_URL + "/functions/v1/postcode-offer-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) }); }
  catch(e){ throw new Error("Could not reach the server. Check your connection."); }
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `That did not work (error ${r.status}).`);
  return d;
}
const longDay = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" });
let S = null;
function render(){
  const d = S, el = $("#main");
  if (d.status === "before") { el.innerHTML = `<div class="card big">The postcode offer starts on ${esc(longDay(d.start))}.</div>`; return; }
  if (d.status === "over") { el.innerHTML = `<div class="card big">The postcode offer has finished.</div>`; return; }
  const row = (cls, pct, p, none) => `<div class="pcrow"><div class="pct ${cls}">${pct}%<small>off food</small></div><div>${p ? `<div class="pcode">${esc(p.postcode)}</div>${p.area ? `<div class="parea">${esc(p.area)}</div>` : ""}` : `<div class="none">${esc(none)}</div>`}</div></div>`;
  el.innerHTML = `<div class="dayline">Today's postcodes &middot; ${esc(longDay(d.day))}</div>
    <div class="card">${row("p50", 50, d.fifty, "No postcode has been set for today yet. Ask marketing.")}${row("p25", 25, d.twentyfive, d.day === d.start ? "The offer starts today, so there is no 25% postcode yet. From tomorrow, today's postcode gets 25%." : "No 25% postcode today (yesterday had none set).")}</div>
    <div class="rules"><b>BEFORE GIVING THE DISCOUNT</b><ul>${d.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
    <div class="card"><h3 style="font-size:24px;color:var(--sage);margin-bottom:8px">Check a customer's postcode</h3>
      <form class="field" id="chk" autocomplete="off"><input id="pc" placeholder="e.g. DH9 2RB" maxlength="9" aria-label="Customer's postcode" inputmode="text" autocapitalize="characters" spellcheck="false"><button class="btn" type="submit">Check</button></form>
      <div id="res" role="status" aria-live="polite"></div></div>`;
  $("#chk").onsubmit = async e => {
    e.preventDefault(); const v = $("#pc").value.trim(); if (!v) return;
    const res = $("#res"); res.innerHTML = "";
    try { const r = await call("check", { postcode:v }); res.innerHTML = `<div class="result r${r.percent}">${esc(r.message)}${r.percent ? " Still check their proof of address, that they pre-booked, and that it is food only for up to 4." : ""}</div>`; }
    catch(err){ res.innerHTML = `<div class="result r0">${esc(err.message)}</div>`; }
  };
}
async function boot(){
  $("#app").classList.remove("off");
  try { S = await call("today"); } catch(e){ $("#main").innerHTML = `<div class="card big" style="color:var(--alert)">${esc(e.message)}</div>`; return; }
  $("#whoname").textContent = (S.me && S.me.name) || "";
  render();
}
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} $("#gate").style.display = "flex"; $("#app").classList.add("off"); });
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && S) { try { S = await call("today"); render(); } catch(e){} } });
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else $("#gate").style.display = "flex"; })();
</script>
</body>
</html>
