name: Deploy web till to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Repo secret holding the Firebase service-account JSON (named "SECRET").
          firebaseServiceAccount: ${{ secrets.SECRET }}
          projectId: black-horse-till
          channelId: live
