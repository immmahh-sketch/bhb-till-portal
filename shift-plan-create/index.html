<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift plan - create — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED; --blue:#34546F; --blue-bg:#E7EEF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1100px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:20px 0 14px}
.bar h2{font-size:26px; color:var(--sage); margin-right:6px}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn:disabled{opacity:.5; cursor:default}
.dateinp{padding:9px 10px; border:1px solid var(--mist); border-radius:8px; background:var(--white); font-size:15px; min-height:44px}
.grid{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px; align-items:start}
@media (max-width:860px){ .grid{grid-template-columns:minmax(0,1fr)} .side{order:-1} }
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px}
.role{border-left:4px solid var(--celadon)}
.role.empty{border-left-color:var(--attention)}
.role h3{font-size:21px; color:var(--sage); line-height:1.15; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.role .n{font-family:var(--body); font-size:11px; color:var(--sage-70); font-weight:600}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.chip{display:inline-flex; align-items:center; gap:6px; background:var(--sage-10); border-radius:999px; padding:5px 6px 5px 12px; font-size:14px}
.chip.drafted{background:var(--attention-bg)}
.chip small{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#6d5320; font-weight:700}
.chip button{border:0; background:rgba(0,0,0,.08); width:24px; height:24px; border-radius:50%; cursor:pointer; line-height:1; font-size:15px; color:var(--ink)}
.chip button:hover{background:var(--alert); color:#fff}
.add{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px}
.add select,.add input{padding:9px 10px; border:1px solid var(--mist); border-radius:8px; background:var(--white); font-size:15px; min-height:42px; max-width:100%}
.add select{min-width:210px}
.add input{min-width:190px}
.panel h3{font-size:22px; color:var(--sage); margin-bottom:4px}
.panel .sub{font-size:12.5px; color:var(--sage-70); margin-bottom:10px}
.pp{padding:9px 0; border-top:1px solid var(--mist)}
.pp:first-of-type{border-top:0}
.pp .nm{font-weight:600}
.pp .meta{font-size:12px; color:var(--sage-70)}
.pp .rl{display:flex; gap:5px; flex-wrap:wrap; margin-top:5px}
.tag{display:inline-block; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600; background:var(--good-bg); color:var(--good)}
.tag.m{background:var(--blue-bg); color:var(--blue)}
.tag.none{background:var(--attention-bg); color:#6d5320}
.tag.dr{background:var(--attention-bg); color:#6d5320; font-size:10px; letter-spacing:.06em; text-transform:uppercase}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px}
.muted{color:var(--sage-70)} .empty-msg{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .bar h2{font-size:22px} .add select,.add input{width:100%} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Shift plan - create</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Shift plan - create<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist">
    <button class="tabbtn" data-view="restaurant">Restaurant</button>
    <button class="tabbtn" data-view="marquee">Marquee</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const AREA_NAME = { restaurant:"Restaurant", marquee:"Marquee" };
const S = { me:null, date:"", today:"", area:"restaurant", roles:[], assigns:[], onShift:[], staff:[], planday:{ ok:true }, typing:{}, busy:false };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = v => String(v ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const fmtDay = d => { try { return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"long", day:"numeric", month:"long" }); } catch(e){ return d; } };
const addDays = (d, n) => { const t = new Date(d+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2200); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/shiftplan-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

/* ---- the people: who is on shift, and who has which roles today */
const roleOf = key => S.roles.find(r => r.key === key);
const sameP = (a, b) => (a.planday_id && b.planday_id && a.planday_id === b.planday_id) || norm(a.person_name || a.name) === norm(b.person_name || b.name);
function peopleToday(){
  const list = S.onShift.map(p => ({ name:p.name, planday_id:p.planday_id, email:p.email, shift:p.shift, draft:p.draft, job:p.job, clocked_in:p.clocked_in, clocked_out:p.clocked_out, drafted:false }));
  for (const a of S.assigns) {                                       // someone given a role who is not on the rota: typed in, or picked from the wider F&B list
    if (!list.some(p => sameP({ planday_id:a.planday_id, person_name:a.person_name }, { planday_id:p.planday_id, name:p.name }))) list.push({ name:a.person_name, planday_id:a.planday_id, email:a.person_email, shift:null, drafted:true });
  }
  return list.map(p => ({ ...p, roles: S.assigns.filter(a => sameP(a, p)).map(a => a.role_key) }));
}

/* ---- drawing */
function roleCard(r){
  const as = S.assigns.filter(a => a.role_key === r.key);
  const used = new Set(as.map(a => norm(a.person_name)));
  const typing = !!S.typing[r.key];
  const onOpts = S.onShift.filter(p => !used.has(norm(p.name))).map(p => `<option value="p:${p.planday_id}">${esc(p.name)} (${esc(p.shift || "not on the rota")}${p.draft ? ", draft" : ""}${p.clocked_in ? (p.clocked_out ? ", clocked out " + esc(p.clocked_out) : ", clocked in " + esc(p.clocked_in)) : ""})</option>`).join("");
  const stOpts = S.staff.filter(p => !used.has(norm(p.name))).map(p => `<option value="p:${p.planday_id}">${esc(p.name)}</option>`).join("");
  return `<div class="card role${as.length ? "" : " empty"}" data-role="${esc(r.key)}">
    <h3>${esc(r.label)}<span class="n">${as.length ? as.length + (as.length === 1 ? " person" : " people") : "nobody yet"}</span></h3>
    <div class="chips">${as.map(a => `<span class="chip${a.drafted ? " drafted" : ""}">${esc(a.person_name)}${a.drafted ? ` <small>drafted in</small>` : ""}<button type="button" data-act="rm" data-id="${esc(a.id)}" aria-label="Take ${esc(a.person_name)} off ${esc(r.label)}">&times;</button></span>`).join("")}</div>
    <div class="add">${typing
      ? `<input type="text" id="ty_${esc(r.key)}" maxlength="80" placeholder="Type their name" autocomplete="off"><button class="btn small" type="button" data-act="addtyped" data-role="${esc(r.key)}">Add</button><button class="btn small ghost" type="button" data-act="canceltyped" data-role="${esc(r.key)}">Cancel</button>`
      : `<select data-addsel="${esc(r.key)}" aria-label="Add someone to ${esc(r.label)}"><option value="">+ Add a person</option>
          ${onOpts ? `<optgroup label="On shift today">${onOpts}</optgroup>` : ""}${stOpts ? `<optgroup label="Other FOH staff (not working or clocked in that day)">${stOpts}</optgroup>` : ""}<option value="__type">Someone else: type a name…</option></select>`}</div></div>`;
}
function sidePanel(){
  const ppl = peopleToday(), without = ppl.filter(p => !p.roles.length && !p.drafted).length;
  return `<div class="card panel"><h3>On shift ${S.date === S.today ? "today" : "that day"}</h3>
    <div class="sub">${S.planday.ok ? `${S.onShift.length} on the FOH rota or clocked in${without ? `, <b>${without} without a role yet</b>` : ", everyone has a role"}.` : esc(S.planday.error || "Planday could not be read.")}</div>
    ${ppl.length ? ppl.map(p => `<div class="pp"><div class="nm">${esc(p.name)} ${p.drafted ? `<span class="tag dr">drafted in</span>` : ""}</div>
      <div class="meta">${p.shift ? esc(p.shift) : (p.clocked_in ? "not on the rota" : "")}${p.draft ? " (draft shift)" : ""}${p.clocked_in ? ` · <b>${p.clocked_out ? "clocked out " + esc(p.clocked_out) : "clocked in " + esc(p.clocked_in)}</b>` : ""}${p.job ? (p.shift || p.clocked_in ? " · " : "") + esc(p.job) : ""}</div>
      <div class="rl">${p.roles.length ? p.roles.map(k => { const r = roleOf(k); return r ? `<span class="tag${r.area === "marquee" ? " m" : ""}">${esc(r.label)}</span>` : ""; }).join("") : `<span class="tag none">No role yet</span>`}</div></div>`).join("") : `<div class="muted" style="padding:8px 0">Nobody on the rota for this day yet.</div>`}</div>`;
}
function render(){
  const roles = S.roles.filter(r => r.area === S.area), keep = window.scrollY;
  $("#views").innerHTML = `
    <div class="bar"><h2>${esc(AREA_NAME[S.area])}</h2>
      <button class="btn ghost small" data-act="prev" aria-label="Day before">&lsaquo;</button>
      <input class="dateinp" type="date" id="dsel" value="${esc(S.date)}">
      <button class="btn ghost small" data-act="next" aria-label="Day after">&rsaquo;</button>
      <button class="btn ghost small" data-act="today"${S.date === S.today ? " disabled" : ""}>Today</button>
      <span style="flex:1"></span>
      <button class="btn ghost small" data-act="copy" title="Add the roles from the day before; nothing is removed">Copy the day before</button></div>
    <p class="muted" style="margin:-4px 0 12px;font-size:13px">${esc(fmtDay(S.date))}. Pick a person under a role to give it to them. A person can have more than one role, and a role can have more than one person. Drafted in at the last minute? Choose "Someone else" and type their name. The team see their roles on the Shift plan tile straight away.</p>
    <div class="grid"><div>${roles.map(roleCard).join("") || `<div class="empty-msg">No roles set up.</div>`}</div><div class="side">${sidePanel()}</div></div>`;
  window.scrollTo(0, keep);
}

/* ---- actions */
async function load(date){
  $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap", { date }); } catch(e){ $("#views").innerHTML = `<div class="empty-msg">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.date = d.date; S.today = d.today; S.roles = d.roles; S.assigns = d.assignments; S.onShift = d.on_shift || []; S.staff = d.staff || []; S.planday = d.planday || { ok:true }; S.typing = {};
  if (!S.me.canEdit) { $("#views").innerHTML = `<div class="empty-msg">Only the F&amp;B managers can create the shift plan.<br><span class="muted">You can see your own roles on the Shift plan tile.</span></div>`; return; }
  render();
}
async function assign(roleKey, person){
  if (S.busy) return; S.busy = true;
  try {
    const d = await call("assign", { date:S.date, role_key:roleKey, name:person.name, email:person.email || undefined, planday_id:person.planday_id || undefined, drafted:!!person.drafted });
    if (!d.already) S.assigns.push(d.assignment);
    S.typing = {}; render(); toast(d.already ? `${person.name} already has that role.` : `${person.name}: ${roleOf(roleKey).label}`);
  } catch(e){ toast(e.message, true); render(); }
  S.busy = false;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dsel") { if (t.value) load(t.value); return; }
  if (t.dataset && t.dataset.addsel) {
    const role = t.dataset.addsel, v = t.value; if (!v) return;
    if (v === "__type") { S.typing[role] = true; render(); const i = $("#ty_" + role); if (i) i.focus(); return; }
    const id = Number(v.slice(2)), p = S.onShift.find(x => x.planday_id === id) || S.staff.find(x => x.planday_id === id);
    if (p) assign(role, { name:p.name, email:p.email, planday_id:p.planday_id, drafted:!S.onShift.some(x => x.planday_id === id) });
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id && e.target.id.startsWith("ty_")) { e.preventDefault(); const b = e.target.parentElement.querySelector('[data-act="addtyped"]'); if (b) b.click(); } });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "prev") return load(addDays(S.date, -1));
  if (a === "next") return load(addDays(S.date, 1));
  if (a === "today") return load(S.today);
  if (a === "rm") {
    try { await call("unassign", { id:b.dataset.id }); S.assigns = S.assigns.filter(x => x.id !== b.dataset.id); render(); toast("Taken off."); } catch(err){ toast(err.message, true); }
    return;
  }
  if (a === "addtyped") {
    const role = b.dataset.role, inp = $("#ty_" + role), name = inp ? inp.value.trim() : "";
    if (!name) { toast("Type a name first.", true); if (inp) inp.focus(); return; }
    const match = S.onShift.find(x => norm(x.name) === norm(name)) || S.staff.find(x => norm(x.name) === norm(name));        // typed a name that is on the list: use the real person
    return assign(role, match ? { name:match.name, email:match.email, planday_id:match.planday_id, drafted:!S.onShift.includes(match) } : { name, drafted:true });
  }
  if (a === "canceltyped") { delete S.typing[b.dataset.role]; render(); return; }
  if (a === "copy") {
    try { const d = await call("copy", { date:S.date, from:addDays(S.date, -1) }); await load(S.date); toast(d.copied ? `Copied ${d.copied} role${d.copied === 1 ? "" : "s"} from the day before.` : "Nothing new to copy from the day before."); } catch(err){ toast(err.message, true); }
  }
});
function markTab(){ $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.area ? "page" : "false")); }
function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", ()=>{ try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false;
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => { S.area = b.dataset.view; markTab(); if (S.me) { S.typing = {}; render(); window.scrollTo(0, 0); } }));
  markTab();
  await load("");
  if (S.me) $("#whoname").textContent = S.me.name;
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
</body>
</html>
