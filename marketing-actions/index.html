<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Actions — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --blue:#34546F; --blue-bg:#E7EEF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1100px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:6px; border-radius:999px; background:var(--gold); color:var(--ink); font-size:10px; line-height:18px; text-align:center; letter-spacing:0}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 16px}
.pagehead h2{font-size:26px; color:var(--sage)}
.pagehead .hint{font-size:13px; color:var(--sage-70)}
.refbar{display:flex; align-items:center; gap:10px}
.refbar .when{font-size:12px; color:var(--sage-70); white-space:nowrap}
.spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)}
.btn:disabled{opacity:.5; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:12px}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.opt{border:1px solid var(--mist); background:var(--bone); border-radius:999px; padding:9px 16px; cursor:pointer; font-size:14px; min-height:44px}
.opt:hover{background:var(--sage-10)}
.opt[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.opt.s-outstanding[aria-pressed="true"]{background:var(--attention); border-color:var(--attention)}
.opt.s-in_progress[aria-pressed="true"]{background:var(--blue); border-color:var(--blue)}
.opt.s-parked[aria-pressed="true"]{background:var(--sage-70); border-color:var(--sage-70)}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
.field input[type=date]{max-width:200px}
textarea{min-height:84px; resize:vertical}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.outstanding{background:var(--attention-bg); color:#6d5320}
.tag.in_progress{background:var(--blue-bg); color:var(--blue)}
.tag.completed{background:var(--good-bg); color:var(--good)}
.tag.parked{background:var(--mist); color:var(--sage-70)}
.tag.late{background:var(--alert-bg); color:var(--alert)}
.muted{color:var(--sage-70)} .empty{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.sum{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.sum .pill{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 16px; min-width:110px}
.sum .pill b{display:block; font-family:var(--display); font-size:28px; line-height:1; color:var(--sage)}
.sum .pill.late b{color:var(--alert)}
.sum .pill span{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px}
.filters .field{margin:0}
.filters .field select,.filters .field input:not([type=checkbox]){min-width:170px}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:400; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}

/* objectives and actions */
.obj{padding:0; overflow:hidden}
.objhead{display:flex; align-items:flex-start; gap:12px; padding:16px 20px; cursor:pointer}
.objhead .caret{font-size:12px; color:var(--sage-70); margin-top:9px; width:12px}
.objhead .t{font-family:var(--display); font-size:24px; color:var(--sage); line-height:1.15}
.objhead .d{font-size:13px; color:var(--sage-70); margin-top:2px; white-space:pre-wrap}
.objhead .meta{margin-left:auto; text-align:right; font-size:12px; color:var(--sage-70); white-space:nowrap}
.bar{height:6px; background:var(--mist); border-radius:99px; overflow:hidden; margin-top:6px; min-width:140px}
.bar i{display:block; height:100%; background:var(--good)}
.objbody{border-top:1px solid var(--mist)}
.acols,.arow{display:grid; grid-template-columns:minmax(200px,1.6fr) minmax(120px,.9fr) minmax(220px,2fr) 150px; gap:14px; padding:12px 20px; align-items:start}
.acols{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); background:var(--bone); padding-top:8px; padding-bottom:8px}
.arow{border-top:1px solid var(--mist); cursor:pointer}
.arow:hover{background:#fbfbf9}
.arow.done{opacity:.7}
.arow .at{font-weight:600}
.arow .due{font-size:12px; color:var(--sage-70); margin-top:2px}
.arow .due.late{color:var(--alert); font-weight:600}
.chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{display:inline-block; background:var(--sage-10); color:var(--sage); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600}
.chip.none{background:transparent; color:var(--sage-70); font-weight:400; padding-left:0}
.upd{white-space:pre-wrap; font-size:14px}
.upd small{display:block; color:var(--sage-70); font-size:11px; margin-top:2px}
.stsel{width:100%; border-radius:999px; border:1px solid var(--mist); padding:8px 12px; font-size:13px; font-weight:700; background:var(--bone); cursor:pointer; min-height:38px}
.stsel.outstanding{background:var(--attention-bg); color:#6d5320; border-color:#e6d6b6}
.stsel.in_progress{background:var(--blue-bg); color:var(--blue); border-color:#c7d6e4}
.stsel.completed{background:var(--good-bg); color:var(--good); border-color:#cbdccb}
.stsel.parked{background:var(--mist); color:var(--sage-70)}
.addrow{padding:12px 20px; border-top:1px solid var(--mist); display:flex; gap:10px; flex-wrap:wrap}
.myobj{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:18px 0 8px}

/* modal */
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:300; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto}
.modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:640px; padding:22px 22px 18px}
.modal h3{font-size:24px; color:var(--sage); margin-bottom:12px}
.pick{display:flex; gap:6px; flex-wrap:wrap}
.pick label{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--mist); background:var(--bone); border-radius:999px; padding:7px 12px; cursor:pointer; font-size:14px; letter-spacing:0; text-transform:none; color:var(--ink); margin:0}
.pick label:has(input:checked){background:var(--sage); color:#fff; border-color:var(--sage)}
.pick input{width:auto; margin:0}
.tl{border-top:1px solid var(--mist); margin-top:6px}
.ev{padding:10px 0; border-bottom:1px solid var(--mist)} .ev:last-child{border-bottom:0}
.ev .h{font-size:12px; color:var(--sage-70)} .ev .b{white-space:pre-wrap; margin-top:2px}
.ev.sys .b{color:var(--sage-70); font-style:italic}

/* ticket sales */
.tkevent{padding:0; overflow:hidden}
.tkevent .hd{display:flex; align-items:baseline; gap:12px; padding:16px 20px 8px; flex-wrap:wrap}
.tkevent .hd h3{margin:0}
table.tk{width:100%; border-collapse:collapse; font-size:14px}
table.tk th{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); text-align:left; padding:8px 20px; background:var(--bone); font-weight:600}
table.tk td{padding:10px 20px; border-top:1px solid var(--mist); vertical-align:top}
table.tk .n{text-align:right}
table.tk tr.show{cursor:pointer} table.tk tr.show:hover{background:#fbfbf9}
table.tk tr.det td{background:var(--bone)}
.tkcap{width:76px; text-align:right; padding:6px 8px; border:1px solid var(--mist); border-radius:6px}
.tkbar{height:5px; background:var(--mist); border-radius:99px; margin-top:5px; overflow:hidden; min-width:90px} .tkbar i{display:block; height:100%; background:var(--gold)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:14px}
.tablewrap{overflow-x:auto}

/* chat */
.topic{padding:0; overflow:hidden}
.thead{display:flex; align-items:center; gap:12px; padding:14px 20px; cursor:pointer}
.thead .tt{font-family:var(--display); font-size:21px; color:var(--sage); line-height:1.15}
.thead .tp{font-size:13px; color:var(--sage-70); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60vw}
.thead .tm{margin-left:auto; text-align:right; font-size:12px; color:var(--sage-70); white-space:nowrap; flex:none}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--gold); margin-right:6px}
.tagged{background:var(--gold); color:var(--ink); border-radius:999px; padding:2px 8px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-left:6px}
.tbody{border-top:1px solid var(--mist); padding:14px 20px 18px; background:#fcfcfa}
.msgs{max-height:60vh; overflow-y:auto; margin-bottom:12px}
.msg{padding:8px 0}
.msg .h{font-size:12px; color:var(--sage-70)} .msg .h b{color:var(--ink)}
.msg .b{white-space:pre-wrap; margin-top:2px; background:var(--white); border:1px solid var(--mist); border-radius:10px; padding:9px 12px; display:inline-block; max-width:100%}
.msg.me .b{background:var(--sage-10)}
.msg.tagme .b{border-color:var(--gold); box-shadow:inset 3px 0 0 var(--gold)}
.mention{color:var(--blue); font-weight:700; background:var(--blue-bg); border-radius:4px; padding:0 3px}
.mention.me{background:var(--gold); color:var(--ink)}
.compose{position:relative}
.compose textarea{min-height:64px}
.sugg{position:absolute; left:0; bottom:100%; margin-bottom:4px; background:var(--white); border:1px solid var(--mist); border-radius:8px; box-shadow:var(--shadow); z-index:50; min-width:200px; max-height:200px; overflow-y:auto}
.sugg div{padding:9px 14px; cursor:pointer; font-size:14px} .sugg div small{color:var(--sage-70); margin-left:6px}
.sugg div.on,.sugg div:hover{background:var(--sage-10)}

@media (max-width:760px){
  .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .pagehead h2{font-size:22px}
  .btn{width:100%} .btn.small{width:auto} .opt{flex:1 1 auto}
  .filters .field,.filters .field select,.filters .field input:not([type=checkbox]){width:100%}
  .acols{display:none}
  .arow{grid-template-columns:1fr; gap:8px; padding:14px 16px}
  .objhead{padding:14px 16px; flex-wrap:wrap} .objhead .meta{margin-left:24px; text-align:left; width:calc(100% - 24px); white-space:normal}
  .addrow{padding:12px 16px}
  .tkcols{display:none}
  table.tk th,table.tk td{padding:8px 10px}
  .thead{padding:12px 14px} .tbody{padding:12px 14px 16px}
  .modal{padding:18px 16px 14px}
}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Marketing Actions</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Marketing Actions<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist">
    <button class="tabbtn" data-view="plan">Action plan</button>
    <button class="tabbtn" data-view="mine">My actions<span class="badge" id="b_mine" hidden></span></button>
    <button class="tabbtn" data-view="tickets">Ticket sales</button>
    <button class="tabbtn" data-view="chat">Chat<span class="badge" id="b_chat" hidden></span></button>
    <button class="tabbtn" data-view="files">File share<span class="badge" id="b_files" hidden></span></button>
    <button class="tabbtn" data-view="social">Social Posts</button>
    <button class="tabbtn" data-view="analytics">Analytics</button>
    <button class="tabbtn" data-view="call">Marketing Call</button>
  </div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div id="modalroot"></div>
<div class="toast" id="toast"></div>
<script src="../shared/fileshare.js?v=2"></script>
<script src="social.js?v=5"></script>
<script src="analytics.js?v=1"></script>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const STATUSES = [["outstanding","Outstanding"],["in_progress","In Progress"],["completed","Completed"],["parked","Parked"]];
const SL = Object.fromEntries(STATUSES);
const S = { me:null, people:[], view:"plan", objectives:[], actions:[], filt:{ who:"", status:"open", q:"", archived:false },
            mine:[], mineObj:{}, mineStatus:"open", collapsed:new Set(), chat:{ topics:[], open:null, msgs:{}, filter:"all", timer:null, newOpen:false, ntObj:"" } };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDT = iso => { if(!iso) return ""; try { return new Date(iso).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).replace(",",""); } catch(e){ return String(iso).slice(0,16); } };
const fmtDay = d => { try { return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"short", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return d; } };
const today = () => new Intl.DateTimeFormat("en-CA",{ timeZone:"Europe/London", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
const money = n => "£" + Number(n || 0).toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 });
const isOpen = a => a.status === "outstanding" || a.status === "in_progress";
const isLate = a => isOpen(a) && !!a.due_date && a.due_date < today();
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function post(fn, body){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/" + fn, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const call = (action, payload) => post("marketing-api", { action, staff_email: staffEmail(), ...(payload||{}) });
const callTickets = (action, payload) => post("ticketsource-api", { action, payload:{ staff_email: staffEmail(), ...(payload||{}) } });
const nameOf = email => (S.people.find(p => p.email === email) || {}).name || email;
const handleOf = email => (S.people.find(p => p.email === email) || {}).handle || "";
try { S.collapsed = new Set(JSON.parse(localStorage.getItem("mk_collapsed") || "[]")); } catch(e){}
const saveCollapsed = () => { try { localStorage.setItem("mk_collapsed", JSON.stringify([...S.collapsed])); } catch(e){} };

/* ============================================================ modal */
function openModal(html){
  closeModal();
  const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); });
  $("#modalroot").appendChild(bg);
  document.documentElement.style.overflow = "hidden";
  return bg;
}
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); document.documentElement.style.overflow = ""; S.modalAction = null; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalbg")) closeModal(); });
function peoplePick(selected){
  const list = S.people.concat(selected.filter(e => !S.people.some(p => p.email === e)).map(e => ({ email:e, name:e })));
  if (!list.length) return `<div class="muted">No one else has this tile yet.</div>`;
  return `<div class="pick" id="m_who">${list.map(p => `<label><input type="checkbox" value="${esc(p.email)}"${selected.includes(p.email) ? " checked" : ""}>${esc(p.name)}</label>`).join("")}</div>`;
}
const pickedWho = () => $$("#m_who input:checked").map(i => i.value);

/* ============================================================ action plan */
const objActions = o => S.actions.filter(a => a.objective_id === o.id);
function passes(a){
  const f = S.filt;
  if (f.who && !(a.assignees || []).includes(f.who)) return false;
  if (f.status === "open" ? !isOpen(a) : f.status === "late" ? !isLate(a) : (f.status !== "all" && a.status !== f.status)) return false;
  if (f.q) { const hay = (a.title + " " + a.latest_update + " " + (a.assignees||[]).map(nameOf).join(" ")).toLowerCase(); if (!hay.includes(f.q.toLowerCase())) return false; }
  return true;
}
function stSelect(a){

async function quickStatus(id, status, sel){
  sel.disabled = true;
  try { const d = await call("action.respond", { id, status }); replaceAction(d.action); toast("Status updated."); }
  catch(e){ toast(e.message, true); }
  if (S.view === "plan") renderPlan(); else if (S.view === "mine") renderMine();
  refreshBadges();
}
function replaceAction(a){ const i = S.actions.findIndex(x => x.id === a.id); if (i >= 0) S.actions[i] = a; else S.actions.push(a); const j = S.mine.findIndex(x => x.id === a.id); if (j >= 0) S.mine[j] = a; }

function objectiveModal(o){

  openModal(`<h3>${edit ? "Action" : "New action"}</h3>

      }

/* ============================================================ ticket sales */
const TK = { data:null, tab:"upcoming", timer:null, open:null, detail:{} };
const tkWhen = iso => iso ? new Intl.DateTimeFormat("en-GB", { weekday:"short", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", timeZone:"Europe/London" }).format(new Date(iso)) : "";
function tkStop(){ if (TK.timer) { clearTimeout(TK.timer); TK.timer = null; } }
async function viewTickets(){
  tkStop();
  if (!TK.data) $("#views").innerHTML = `<div class="loading">Reading ticket sales…</div>`;
  try {
    const d = await callTickets("tickets.list");
    if (S.view !== "tickets") return;
    TK.data = d;
    if (TK.open) await tkLoadDetail(TK.open);
    if (S.view !== "tickets") return;
    const ae = document.activeElement;
    if (!(ae && ae.classList && ae.classList.contains("tkcap"))) renderTickets();
    if (d.working) TK.timer = setTimeout(() => { if (S.view === "tickets") viewTickets(); }, 8000);
  } catch(e){ if (S.view === "tickets") $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function tkLoadDetail(id){
  try { TK.detail[id] = { rows:(await callTickets("tickets.date", { date_id:id })).bookings || [] }; } catch(e){ TK.detail[id] = { error:e.message }; }
}
function tkRows(){
  const cut = Date.now() - 6 * 3600 * 1000, up = TK.tab === "upcoming";
  const rows = ((TK.data && TK.data.dates) || []).filter(r => { const t = r.starts_at ? new Date(r.starts_at).getTime() : Infinity; return up ? t >= cut : t < cut; });
  rows.sort((a, b) => { const x = new Date(a.starts_at || 0).getTime(), y = new Date(b.starts_at || 0).getTime(); return up ? x - y : y - x; });
  return rows;
}
function tkDetailHtml(id){
  const d = TK.detail[id] || {};
  if (d.error) return `<div class="muted">${esc(d.error)}</div>`;
  if (!d.rows) return `<div class="muted">Loading…</div>`;
  if (!d.rows.length) return `<div class="muted">No bookings counted for this show yet.</div>`;
  const live = d.rows.filter(b => b.tickets > 0 || Number(b.gross) > 0);
  const tk = live.reduce((s, b) => s + (b.tickets || 0), 0), paid = live.reduce((s, b) => s + (Number(b.gross) || 0), 0);
  return `<div class="muted" style="margin-bottom:8px">${live.length} booking${live.length === 1 ? "" : "s"} · ${tk} ticket${tk === 1 ? "" : "s"} · ${money(paid)}</div>
    <div class="tablewrap"><table class="tk"><thead><tr><th>Booked by</th><th>Booked</th><th class="n">Tickets</th><th class="n">Paid</th></tr></thead><tbody>
    ${d.rows.map(b => { const gone = !(b.tickets > 0 || Number(b.gross) > 0);
      return `<tr style="${gone ? "opacity:.55" : ""}"><td>${b.customer_name ? esc(b.customer_name) : `<span class="muted">Name not read yet</span>`}${b.customer_email ? `<div class="muted" style="font-size:12px">${esc(b.customer_email)}</div>` : ""}</td>
      <td>${esc(fmtDT(b.booked_at))}</td><td class="n">${gone ? "Cancelled" : b.tickets}</td><td class="n">${money(b.gross)}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function renderTickets(){
  const d = TK.data || {};
  if (!d.configured) {
    $("#views").innerHTML = `<div class="pagehead"><h2>Ticket sales</h2></div><div class="card"><h3>Not connected yet</h3>
      <p style="margin:0">Live ticket numbers come from TicketSource, which has not been connected yet. Ask the General Manager to add the TicketSource key; once it is saved the numbers fill in within a minute or two.</p></div>`;
    return;
  }
  const rows = tkRows(), up = TK.tab === "upcoming";
  const live = rows.filter(r => !r.cancelled);
  const events = new Set(live.map(r => r.event_id));
  const sold = live.reduce((s, r) => s + (Number(r.tickets_sold) || 0), 0), value = live.reduce((s, r) => s + (Number(r.gross) || 0), 0);
  const groups = [], by = {};
  rows.forEach(r => { if (!by[r.event_id]) { by[r.event_id] = { id:r.event_id, name:r.event_name, rows:[] }; groups.push(by[r.event_id]); } by[r.event_id].rows.push(r); });
  $("#views").innerHTML = `<div class="pagehead"><h2>Ticket sales</h2><span class="hint">Tickets sold per show, counted from TicketSource bookings. Cancelled tickets and refunds are left out.</span><span class="spacer"></span>
      <button class="btn ghost small" id="tk_csv">Export CSV</button> <button class="btn ghost small" id="tk_refresh">Refresh from TicketSource</button></div>
    ${d.error ? `<div class="notice">TicketSource said: ${esc(d.error)}</div>` : ""}
    ${d.working ? `<div class="notice">Still counting${d.pending ? ` - ${d.pending} date${d.pending === 1 ? "" : "s"} left` : ""}. This page updates by itself.</div>` : ""}
    <div class="opts" style="margin-bottom:14px"><button class="opt" data-tab="upcoming" aria-pressed="${up}">Upcoming</button><button class="opt" data-tab="past" aria-pressed="${!up}">Past 30 days</button></div>
    <div class="sum"><div class="pill"><b>${events.size}</b><span>${up ? "Upcoming events" : "Events"}</span></div><div class="pill"><b>${sold.toLocaleString("en-GB")}</b><span>Tickets sold</span></div>
      <div class="pill"><b>${money(value)}</b><span>Booked value</span></div><div class="pill"><b>${live.length}</b><span>Shows</span></div></div>
    ${groups.length ? groups.map(g => {
      const gs = g.rows.filter(r => !r.cancelled).reduce((s, r) => s + (Number(r.tickets_sold) || 0), 0);
      return `<div class="card tkevent"><div class="hd"><h3>${esc(g.name)}</h3><span class="muted">${gs.toLocaleString("en-GB")} sold</span></div>
        <div class="tablewrap"><table class="tk"><thead class="tkcols"><tr><th>Show</th><th class="n">Sold</th><th class="n">Capacity</th><th class="n">Bookings</th><th class="n">Value</th><th>Status</th></tr></thead><tbody>
        ${g.rows.map(r => {
          const cap = r.capacity, n = Number(r.tickets_sold) || 0, left = (cap != null && !r.cancelled) ? cap - n : null;
          const st = r.cancelled ? `<span class="tag late">Cancelled</span>` : (r.on_sale === false ? `<span class="tag parked">Off sale</span>` : (left !== null && left <= 0 ? `<span class="tag outstanding">Sold out</span>` : `<span class="tag completed">On sale</span>`));
          const pct = cap ? Math.min(100, Math.round(n / cap * 100)) : 0;
          return `<tr class="show" data-id="${esc(r.date_id)}"><td>${TK.open === r.date_id ? "&#9662;" : "&#9656;"} ${esc(tkWhen(r.starts_at))}${cap ? `<div class="tkbar"><i style="width:${pct}%"></i></div>` : ""}</td>
            <td class="n"><b>${n.toLocaleString("en-GB")}</b>${r.bookings_synced_at ? "" : `<div class="muted" style="font-size:11px">counting...</div>`}</td>
            <td class="n"><input class="tkcap" type="number" min="0" inputmode="numeric" data-id="${esc(r.date_id)}" value="${cap == null ? "" : cap}" placeholder="-">${left !== null ? `<div class="muted" style="font-size:12px">${left >= 0 ? left + " left" : (-left) + " over"}</div>` : ""}</td>
            <td class="n">${Number(r.bookings) || 0}</td><td class="n">${money(r.gross)}</td><td>${st}</td></tr>
            ${TK.open === r.date_id ? `<tr class="det"><td colspan="6">${tkDetailHtml(r.date_id)}</td></tr>` : ""}`; }).join("")}
        </tbody></table></div></div>`; }).join("")
      : `<div class="card empty">${d.working ? "Reading TicketSource…" : (up ? "No upcoming shows found." : "Nothing in the last 30 days.")}</div>`}`;
  $$("[data-tab]").forEach(b => b.onclick = () => { TK.tab = b.dataset.tab; renderTickets(); });
  $$("tr.show").forEach(r => r.onclick = async e => { if (e.target.closest("input")) return; const id = r.dataset.id; if (TK.open === id) { TK.open = null; renderTickets(); return; } TK.open = id; TK.detail[id] = {}; renderTickets(); await tkLoadDetail(id); if (S.view === "tickets" && TK.open === id) renderTickets(); });
  $$(".tkcap").forEach(inp => inp.onchange = async () => {
    const row = (TK.data.dates || []).find(x => x.date_id === inp.dataset.id); if (!row) return;
    const raw = inp.value.trim(), cap = raw === "" ? null : Math.max(0, Math.round(Number(raw)));
    if (cap !== null && !isFinite(cap)) return toast("Capacity must be a whole number.", true);
    try { await callTickets("tickets.capacity", { date_id:inp.dataset.id, capacity:cap }); row.capacity = cap; } catch(e){ toast(e.message, true); }
    renderTickets();
  });
  $("#tk_refresh").onclick = async e => { e.target.disabled = true; e.target.textContent = "Asking TicketSource…"; try { await callTickets("tickets.refresh"); } catch(err){ toast(err.message, true); } viewTickets(); };
  $("#tk_csv").onclick = () => {
    const cell = v => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const out = [["Event","Show","Tickets sold","Capacity","Bookings","Value","Status"]];
    tkRows().forEach(r => out.push([r.event_name, tkWhen(r.starts_at), r.tickets_sold, r.capacity == null ? "" : r.capacity, r.bookings, Number(r.gross || 0).toFixed(2), r.cancelled ? "Cancelled" : (r.on_sale === false ? "Off sale" : "On sale")]));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + out.map(r => r.map(cell).join(",")).join("\r\n")], { type:"text/csv" }));
    a.download = "ticket-sales-" + TK.tab + "-" + today() + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ============================================================ chat */
function bodyHtml(text){
  const known = new Map(S.people.map(p => [p.handle.toLowerCase(), p]));
  return esc(text).replace(/@([A-Za-z0-9_]+)/g, (m, h) => { const p = known.get(h.toLowerCase()); return p ? `<span class="mention${p.email === S.me.email ? " me" : ""}">@${esc(p.handle)}</span>` : m; });
}
function chatStop(){ if (S.chat.timer) { clearInterval(S.chat.timer); S.chat.timer = null; } }
async function viewChat(){
  chatStop();
  if (!S.chat.topics.length) $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  if (!S.objectives.length) { try { S.objectives = (await call("plan.list", {})).objectives || []; } catch(e){} }
  await loadTopics();
  S.chat.timer = setInterval(async () => {
    if (S.view !== "chat") return chatStop();
    const ae = document.activeElement; if (ae && (ae.tagName === "TEXTAREA" || ae.tagName === "INPUT")) return;
    await loadTopics(true);
    if (S.chat.open) await loadTopic(S.chat.open, true);
  }, 12000);
}
async function loadTopics(quiet){
  try { S.chat.topics = (await call("topics.list")).topics || []; }
  catch(e){ if (!quiet) $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (S.view === "chat") renderChat();
  setBadge("#b_chat", S.chat.topics.filter(t => t.tagged_you).length);
}
async function loadTopic(id, quiet){
  try {
    const d = await call("topic.get", { id });
    const before = (S.chat.msgs[id] || []).length;
    S.chat.msgs[id] = d.messages || [];
    if (S.view === "chat" && S.chat.open === id && (!quiet || S.chat.msgs[id].length !== before)) renderChat(true);
    const t = S.chat.topics.find(x => x.id === id); if (t) { t.unread = false; t.tagged_you = false; }
    setBadge("#b_chat", S.chat.topics.filter(x => x.tagged_you).length);
  } catch(e){ if (!quiet) toast(e.message, true); }
}
function topicBody(t){
  const msgs = S.chat.msgs[t.id];
  if (!msgs) return `<div class="tbody"><div class="muted">Loading…</div></div>`;
  return `<div class="tbody"><div class="msgs" id="msgs_${esc(t.id)}">${msgs.length ? msgs.map(m => {
      const me = m.by_email === S.me.email, tag = (m.mentions || []).includes(S.me.email);
      return `<div class="msg${me ? " me" : ""}${tag ? " tagme" : ""}"><div class="h"><b>${esc(m.by_name)}</b> · ${esc(fmtDT(m.at))}${tag ? ` <span class="tagged">Tagged you</span>` : ""}</div><div class="b">${bodyHtml(m.body)}</div></div>`; }).join("")
      : `<div class="muted">No messages yet.</div>`}</div>
    <div class="compose"><textarea class="mentionable" id="reply_${esc(t.id)}" maxlength="4000" placeholder="Write a message. Type @ to tag someone."></textarea>
      <div class="opts" style="margin-top:8px"><button class="btn small" data-send="${esc(t.id)}">Send</button>
      ${(S.me.isAdmin || t.created_by_email === S.me.email) ? `<span class="spacer"></span><button class="btn ghost small" data-archive="${esc(t.id)}">Archive topic</button>` : ""}</div></div></div>`;
}
function newTopicForm(){
  const c = S.chat, objs = S.objectives.filter(o => o.status === "active");
  const picked = objs.find(o => o.id === c.ntObj), other = c.ntObj === "__other";
  const existing = picked && c.topics.find(t => t.objective_id === picked.id);
  return `<div class="card"><h3>New topic</h3>
    <div class="field"><label>What is it about?</label><select id="nt_obj"><option value="">Choose…</option>
      ${objs.map(o => `<option value="${esc(o.id)}">${esc(o.title)}</option>`).join("")}<option value="__other">Other - start your own topic</option></select></div>
    ${other ? `<div class="field"><label>Topic</label><input id="nt_title" maxlength="200" placeholder="e.g. Christmas party leaflets"></div>` : ""}
    ${picked ? `<p class="muted" style="margin:-4px 0 14px;font-size:13px">${existing ? "This objective already has a topic. Your message is added to it." : "Everything about this objective is kept in one topic."}</p>` : ""}
    ${(picked || other) ? `<div class="field compose"><label>${existing ? "Message" : "First message (optional)"}</label><textarea class="mentionable" id="nt_body" maxlength="4000" placeholder="Start the discussion. Type @ to tag someone."></textarea></div>
      <div class="opts"><button class="btn" id="nt_go">${existing ? "Add to topic" : "Start topic"}</button></div>` : ""}</div>`;
}
function renderChat(keepScroll){
  const c = S.chat, f = c.filter;
  const draft = {}; $$(".compose textarea").forEach(t => { draft[t.id] = t.value; });
  const newDraft = { t:($("#nt_title") || {}).value || "", b:($("#nt_body") || {}).value || "" };
  const list = c.topics.filter(t => f === "all" ? true : f === "tagged" ? t.tagged_you : t.unread);
  const scrollTop = window.scrollY;
  $("#views").innerHTML = `<div class="pagehead"><h2>Chat</h2><span class="hint">One topic per conversation. Tag someone with @name and they get an email</span><span class="spacer"></span>${refreshBar()}<button class="btn" id="newtopic">${c.newOpen ? "Close" : "New topic"}</button></div>
    ${c.newOpen ? newTopicForm() : ""}
    <div class="opts" style="margin-bottom:14px"><button class="opt" data-f="all" aria-pressed="${f === "all"}">All topics</button><button class="opt" data-f="unread" aria-pressed="${f === "unread"}">Unread</button><button class="opt" data-f="tagged" aria-pressed="${f === "tagged"}">Tagged me</button></div>
    ${list.length ? list.map(t => `<div class="card topic" data-topic="${esc(t.id)}"><div class="thead" data-open="${esc(t.id)}">
        <div style="min-width:0"><div class="tt">${t.unread ? `<span class="dot"></span>` : ""}${esc(t.title)}${t.tagged_you ? `<span class="tagged">Tagged you</span>` : ""}</div>
          <div class="tp">${t.last_message_preview ? `${esc(t.last_message_by_name || "")}: ${esc(t.last_message_preview)}` : "No messages yet"}</div></div>
        <div class="tm">${esc(fmtDT(t.last_message_at))}<br>${t.message_count} message${t.message_count === 1 ? "" : "s"} ${c.open === t.id ? "&#9662;" : "&#9656;"}</div></div>
        ${c.open === t.id ? topicBody(t) : ""}</div>`).join("")
      : `<div class="empty">${c.topics.length ? "No topics match that filter." : "No topics yet. Start one with New topic."}</div>`}`;
  if (newDraft.t && $("#nt_title")) $("#nt_title").value = newDraft.t; if (newDraft.b && $("#nt_body")) $("#nt_body").value = newDraft.b;
  if ($("#nt_obj")) { $("#nt_obj").value = c.ntObj; $("#nt_obj").onchange = e => { c.ntObj = e.target.value; renderChat(); const t = $("#nt_title") || $("#nt_body"); if (t) t.focus(); }; }
  Object.entries(draft).forEach(([id, v]) => { const el = document.getElementById(id); if (el && v) el.value = v; });
  $("#newtopic").onclick = () => { c.newOpen = !c.newOpen; if (!c.newOpen) c.ntObj = ""; renderChat(); }; wireRefresh();
  $$("[data-f]").forEach(b => b.onclick = () => { c.filter = b.dataset.f; renderChat(); });
  $$("[data-open]").forEach(h => h.onclick = async () => { const id = h.dataset.open; if (c.open === id) { c.open = null; renderChat(); return; } c.open = id; renderChat(); await loadTopic(id); });
  $$("[data-send]").forEach(b => b.onclick = async () => {
    const id = b.dataset.send, ta = document.getElementById("reply_" + id), text = ta.value.trim(); if (!text) return;
    b.disabled = true;
    try { await call("message.post", { topic_id:id, body:text }); ta.value = ""; await loadTopic(id); await loadTopics(true); const m = document.getElementById("msgs_" + id); if (m) m.scrollTop = m.scrollHeight; }
    catch(e){ toast(e.message, true); b.disabled = false; }
  });
  $$("[data-archive]").forEach(b => b.onclick = async () => { if (!confirm("Archive this topic? It leaves the list.")) return; try { await call("topic.archive", { id:b.dataset.archive }); c.open = null; toast("Archived."); loadTopics(); } catch(e){ toast(e.message, true); } });
  if ($("#nt_go")) $("#nt_go").onclick = async () => {
    const btn = $("#nt_go"); btn.disabled = true;
    try {
      const body = $("#nt_body").value, payload = c.ntObj === "__other" ? { title:($("#nt_title").value || ""), body } : { objective_id:c.ntObj, title:((S.objectives.find(o => o.id === c.ntObj) || {}).title || ""), body };
      if (c.ntObj === "__other" && !payload.title.trim()) throw new Error("Give the topic a title.");
      const d = await call("topic.create", payload);
      c.newOpen = false; c.ntObj = ""; c.open = d.topic.id; await loadTopics(true); await loadTopic(d.topic.id);
      toast(d.existing ? "Added to the existing topic." : "Topic started.");
    } catch(e){ toast(e.message, true); btn.disabled = false; }
  };
  $$("textarea.mentionable").forEach(attachMentions);
  $$("textarea.mentionable").forEach(t => t.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { const b = t.closest(".compose").querySelector("[data-send]"); if (b) b.click(); } }));
  if (c.open) { const m = document.getElementById("msgs_" + c.open); if (m) m.scrollTop = m.scrollHeight; }
  window.scrollTo(0, scrollTop);
}
function attachMentions(ta){
  let box = null, items = [], idx = 0, start = -1;
  const hide = () => { if (box) { box.remove(); box = null; } items = []; };
  const show = () => {
    if (!items.length) return hide();
    if (!box) { box = document.createElement("div"); box.className = "sugg"; ta.closest(".compose").appendChild(box); }
    box.innerHTML = items.map((p, i) => `<div data-i="${i}" class="${i === idx ? "on" : ""}">@${esc(p.handle)}<small>${esc(p.name)}</small></div>`).join("");
    box.querySelectorAll("div").forEach(d => d.onmousedown = e => { e.preventDefault(); pick(Number(d.dataset.i)); });
  };
  const pick = i => {
    const p = items[i]; if (!p) return;
    const v = ta.value, caret = ta.selectionStart;
    ta.value = v.slice(0, start) + "@" + p.handle + " " + v.slice(caret);
    const pos = start + p.handle.length + 2; ta.setSelectionRange(pos, pos); hide(); ta.focus();
  };
  ta.addEventListener("input", () => {
    const before = ta.value.slice(0, ta.selectionStart), m = /(^|\s)@([A-Za-z0-9_]*)$/.exec(before);
    if (!m) return hide();
    start = before.length - m[2].length - 1;
    const term = m[2].toLowerCase();
    items = S.people.filter(p => !term || p.handle.toLowerCase().startsWith(term) || p.name.toLowerCase().includes(term)).slice(0, 6);
    idx = 0; show();
  });
  ta.addEventListener("keydown", e => {
    if (!box) return;
    if (e.key === "ArrowDown") { e.preventDefault(); idx = (idx + 1) % items.length; show(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; show(); }
    else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); e.stopPropagation(); pick(idx); }
    else if (e.key === "Escape") { e.stopPropagation(); hide(); }
  }, true);
  ta.addEventListener("blur", () => setTimeout(hide, 150));
}

async function joinCall(){

  btn.disabled = true; msg.textContent = "Opening the call…";

/* ============================================================ refresh */
// The plan, My actions and Chat refresh themselves every 30 seconds while the page is on screen (and the moment you come back to
// the tab), and "Refresh now" does it on demand. A refresh never reloads the page: it fetches the latest and redraws in place,
// keeping your scroll position, filters, collapsed objectives and anything half-typed. An automatic refresh waits while you are
// typing in, or choosing from, a box on the page, so it never gets in the way.
S.lastRefresh = ""; S.refreshing = false; S.sig = { plan:"", mine:"" };
const clockNow = () => new Date().toLocaleTimeString("en-GB", { timeZone:"Europe/London", hour:"2-digit", minute:"2-digit" });
function refreshBar(){ return `<span class="refbar"><span class="when" id="reftime">${S.lastRefresh ? "Updated " + esc(S.lastRefresh) : ""}</span><button class="btn ghost small" id="refnow" type="button">Refresh now</button></span>`; }
function wireRefresh(){ const b = $("#refnow"); if (b) b.onclick = () => refreshNow(true); }
const busyTyping = () => { const ae = document.activeElement; return !!(ae && $("#views").contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)); };
async function refreshModalHistory(){
  const id = S.modalAction; if (!id || !$("#m_hist")) return;
  try { const d = await call("action.get", { id }); if (S.modalAction === id && $("#m_hist")) $("#m_hist").innerHTML = (d.events || []).map(evHtml).join("") || `<div class="muted">Nothing yet.</div>`; } catch(e){ /* keep what is showing */ }
}
async function refreshNow(manual){
  if (S.refreshing || !S.me) return;
  // Only the plan, My actions and Chat refresh here; Analytics (like Social Posts) runs its own five-minute refresh.
  const view = S.view; if (!["plan", "mine", "chat"].includes(view)) { if (!manual) refreshBadges(); return; }
  S.refreshing = true;
  const btn = $("#refnow"); if (btn && manual) { btn.disabled = true; btn.textContent = "Refreshing…"; }
  let changed = false;
  try {
    const y = window.scrollY;
    if (view === "plan") {
      const d = await call("plan.list", { include_archived: S.filt.archived });
      const sig = JSON.stringify(d); changed = sig !== S.sig.plan; S.sig.plan = sig;
      S.objectives = d.objectives || []; S.actions = d.actions || [];
      if (S.view === "plan" && (changed || manual) && (manual || !busyTyping())) { renderPlan(); window.scrollTo(0, y); }
    } else if (view === "mine") {
      const d = await call("actions.mine");
      const sig = JSON.stringify(d); changed = sig !== S.sig.mine; S.sig.mine = sig;
      S.mine = d.actions || []; S.mineObj = Object.fromEntries((d.objectives || []).map(o => [o.id, o]));
      if (S.view === "mine" && (changed || manual) && (manual || !busyTyping())) { renderMine(); window.scrollTo(0, y); }
    } else {
      await loadTopics(true); if (S.chat.open) await loadTopic(S.chat.open, true);
      changed = true;
    }
    await refreshModalHistory();
    refreshBadges();
    S.lastRefresh = clockNow();
    if (manual) toast(changed ? "Updated." : "Already up to date.");
  } catch(e){ if (manual) toast(e.message, true); }
  S.refreshing = false;
  const t = $("#reftime"); if (t) t.textContent = S.lastRefresh ? "Updated " + S.lastRefresh : "";
  const b2 = $("#refnow"); if (b2) { b2.disabled = false; b2.textContent = "Refresh now"; }
}
function startAutoRefresh(){
  setInterval(() => { if (!document.hidden) refreshNow(false); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshNow(false); });
}

function setBadge(sel, n){ const b = $(sel); if (!b) return; b.hidden = !n; b.textContent = n || ""; }

function goView(v){
  chatStop(); tkStop(); fsStop(); socialStop(); analyticsStop();
  S.view = v; markTab(); closeModal();
  if (v === "plan") viewPlan(); else if (v === "mine") viewMine(); else if (v === "tickets") viewTickets(); else if (v === "files") viewFiles(); else if (v === "call") viewCall(); else if (v === "social") viewSocial(); else if (v === "analytics") viewAnalytics(); else viewChat();
  window.scrollTo(0, 0);
}

$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.people = d.people || []; $("#whoname").textContent = S.me.name;
  setBadge("#b_mine", d.myOpen); setBadge("#b_chat", d.chatTagged);
