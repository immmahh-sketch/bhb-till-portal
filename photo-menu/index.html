<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Winter Menu in pictures | The Black Horse Beamish</title>
<meta name="description" content="Every dish on our Winter Menu, with a photograph. Download the A5 print version.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--brown:#3F2F28;--olive:#CCCDB4;--grey:#F8F8F8}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--grey)}
body{font-family:"Raleway",system-ui,sans-serif;color:var(--brown);background:var(--grey)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--green)}
.bar a{display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:40px;border:1px solid rgba(255,255,255,.6);color:#fff;text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.2em;text-transform:uppercase}
.bar a:hover{background:rgba(255,255,255,.14);border-color:#fff}
.bar a.primary{background:#fff;color:var(--green);border-color:#fff}
.bar a.primary:hover{background:var(--olive);border-color:var(--olive)}
.bar a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
main{max-width:640px;margin:0 auto;padding:22px 14px 40px}
.pg{display:block;width:100%;height:auto;background:#fff;box-shadow:0 4px 22px rgba(63,47,40,.16);margin:0 0 22px}
.end{text-align:center;padding:6px 0 0}
.end a{display:inline-flex;align-items:center;justify-content:center;margin:6px;padding:14px 26px;border-radius:40px;border:1px solid var(--green);color:var(--green);text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.2em;text-transform:uppercase}
.end a.primary{background:var(--green);color:#fff}
.end p{font-size:12px;line-height:1.7;margin-top:14px;color:var(--brown)}
@media(max-width:480px){.bar a{padding:11px 14px;font-size:10px;letter-spacing:.14em}}
</style>
</head>
<body>
<nav class="bar" aria-label="Menu">
  <a class="primary" href="Black-Horse-Beamish-Winter-Menu-2026-A5.pdf" target="_blank" rel="noopener">Download A5 PDF</a>
  <a href="https://www.blackhorsebeamish.co.uk/" target="_top">Homepage</a>
  <a href="https://www.blackhorsebeamish.co.uk/booking" target="_top">Book a table</a>
</nav>
<main>
  <img class="pg" src="pages/p01.webp" alt="The Black Horse Beamish Winter Menu 2026, cover">
  <img class="pg" src="pages/p02.webp" alt="Lunch menu: hot sandwiches and sides" loading="lazy">
  <img class="pg" src="pages/p03.webp" alt="Lunch menu: cold sandwiches" loading="lazy">
  <img class="pg" src="pages/p04.webp" alt="While you wait" loading="lazy">
  <img class="pg" src="pages/p05.webp" alt="Starters" loading="lazy">
  <img class="pg" src="pages/p06.webp" alt="Pub classics" loading="lazy">
  <img class="pg" src="pages/p07.webp" alt="Burgers and winter warmers" loading="lazy">
  <img class="pg" src="pages/p08.webp" alt="Winter warmers" loading="lazy">
  <img class="pg" src="pages/p09.webp" alt="Our steaks" loading="lazy">
  <img class="pg" src="pages/p10.webp" alt="Sides and sauces" loading="lazy">
  <img class="pg" src="pages/p11.webp" alt="Desserts" loading="lazy">
  <img class="pg" src="pages/p12.webp" alt="Welcome, allergen information and service charge" loading="lazy">
  <div class="end">
    <a class="primary" href="Black-Horse-Beamish-Winter-Menu-2026-A5.pdf" target="_blank" rel="noopener">Download A5 PDF</a>
    <a href="https://www.blackhorsebeamish.co.uk/booking" target="_top">Book a table</a>
    <p>Print at 100% (actual size) on A5 paper.</p>
  </div>
</main>
</body>
</html>
