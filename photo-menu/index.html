:root{--green:#4D604F;--brown:#3F2F28;--olive:#CCCDB4;--grey:#F8F8F8}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--green)}

main{max-width:640px;margin:0 auto;padding:22px 14px 40px}

.pg{display:block;width:100%;height:auto}
.hs{position:absolute;appearance:none;border:0;background:transparent;cursor:zoom-in;padding:0}
.hs:hover{outline:2px solid var(--green);outline-offset:-2px;background:rgba(77,96,79,.10)}
.hs:focus-visible{outline:3px solid var(--green);outline-offset:-3px}
.end{text-align:center;padding:6px 0 0}
.end a{display:inline-flex;align-items:center;justify-content:center;margin:6px;padding:14px 26px;border-radius:40px;border:1px solid var(--green);color:var(--green);text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.2em;text-transform:uppercase}
.end a.primary{background:var(--green);color:#fff}
.end p{font-size:12px;line-height:1.7;margin-top:14px;color:var(--brown)}
@media(max-width:480px){.bar a{padding:11px 14px;font-size:10px;letter-spacing:.14em}}
/* full-screen viewer */
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.on{display:flex}
.lb img{max-width:100vw;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.lb .cap{height:70px;display:flex;align-items:center;justify-content:center;padding:0 70px;text-align:center;color:#fff;font:500 13px/1.4 "Raleway",sans-serif;letter-spacing:.18em;text-transform:uppercase}
.lb button{appearance:none;position:absolute;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.lb button:hover{background:rgba(255,255,255,.18);border-color:#fff}
.lb button:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.lb .x{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
.lb .pv{left:max(10px,env(safe-area-inset-left));top:50%;margin-top:-24px}
.lb .nx{right:max(10px,env(safe-area-inset-right));top:50%;margin-top:-24px}
.lb svg{width:20px;height:20px}
@media(max-width:600px){.lb .cap{font-size:11px;padding:0 20px}.lb .pv,.lb .nx{top:auto;bottom:11px;margin:0}.lb .pv{left:10px}.lb .nx{right:10px}}

<script>
(function(){
  var hs=[].slice.call(document.querySelectorAll('.hs')),i=0,lb=document.getElementById('lb'),im=document.getElementById('lbi'),cp=document.getElementById('lbc'),last=null;
  function show(k){i=(k+hs.length)%hs.length;var b=hs[i];im.src='photos/'+b.dataset.p+'.jpg';im.alt=b.dataset.n;cp.textContent=b.dataset.n;
    [1,-1].forEach(function(d){var n=hs[(i+d+hs.length)%hs.length];var pre=new Image();pre.src='photos/'+n.dataset.p+'.jpg'})}
  function open(k){last=document.activeElement;show(k);lb.classList.add('on');document.documentElement.style.overflow='hidden';document.getElementById('lbx').focus()}
  function close(){lb.classList.remove('on');document.documentElement.style.overflow='';im.removeAttribute('src');if(last&&last.focus)last.focus()}
  hs.forEach(function(b,k){b.addEventListener('click',function(){open(k)})});
  document.getElementById('lbx').onclick=close;document.getElementById('lbp').onclick=function(){show(i-1)};document.getElementById('lbn').onclick=function(){show(i+1)};
  lb.addEventListener('click',function(e){if(e.target===lb||e.target===cp)close()});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(i-1);else if(e.key==='ArrowRight')show(i+1)});
  var sx=null;lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)show(i+(dx<0?1:-1))},{passive:true});
})();
</script>
