<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treat yourself to an upgrade | Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --bone:#F8F8F8; --olive:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --brown:#3F2F28;
  --gold:#B08D57; --gold-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --radius:12px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%}
header{background:var(--sage); border-bottom:4px solid var(--olive); text-align:center; padding:22px 16px 18px}
header img{width:210px; max-width:70%; height:auto; display:block; margin:0 auto}
main{max-width:640px; margin:0 auto; padding:26px 16px 140px}
h1,h2{font-family:var(--display); font-weight:600; color:var(--sage); margin:0; line-height:1.15}
h1{font-size:32px; margin-bottom:8px} h2{font-size:25px; margin:30px 0 6px}
.lead{margin:0 0 18px; color:var(--ink)}
.stay{background:var(--white); border-radius:var(--radius); border-left:6px solid var(--sage); box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.06); padding:14px 18px; margin:0 0 6px; font-size:15px}
.stay b{color:var(--sage)}
.banner{background:var(--gold-bg); color:#6d5320; border-radius:10px; padding:11px 14px; font-size:14px; margin:0 0 16px}
.bad{background:var(--alert-bg); color:var(--alert); border-radius:10px; padding:12px 14px; font-size:15px; margin:14px 0}
.opt{display:block; position:relative; background:var(--white); border:2px solid var(--mist); border-radius:var(--radius); padding:18px 18px 16px 52px; margin:0 0 12px; cursor:pointer; transition:border-color .15s, box-shadow .15s}
.opt:hover{border-color:var(--olive)} .opt.on{border-color:var(--sage); box-shadow:0 6px 20px rgba(77,96,79,.18)}
.opt input[type=radio]{position:absolute; left:18px; top:22px; width:22px; height:22px; accent-color:var(--sage); margin:0}
.opt .tag{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
.opt .name{font-family:var(--display); font-size:25px; color:var(--sage); line-height:1.2; margin:2px 0 4px}
.opt .blurb{font-size:15px; margin:0 0 10px}
.opt .was{font-size:14px; color:var(--sage-70)} .opt .was s{color:var(--sage-70)}
.opt .price{font-family:var(--display); font-size:34px; color:var(--sage); line-height:1.1}
.opt .price small{font-family:var(--body); font-size:14px; color:var(--ink)}
.opt .per{font-size:13px; color:var(--sage-70)}
.ex{display:flex; align-items:center; gap:14px; background:var(--white); border:2px solid var(--mist); border-radius:var(--radius); padding:14px 16px; margin:0 0 10px}
.ex.on{border-color:var(--sage)}
.ex .t{flex:1; min-width:0} .ex .t b{display:block} .ex .t span{font-size:14px; color:var(--sage-70)}
.ex .p{font-weight:700; color:var(--sage); white-space:nowrap; text-align:right}
.ex .p small{display:block; font-weight:400; color:var(--sage-70); font-size:12px}
.step{display:flex; align-items:center; gap:4px}
.step button{width:40px; height:40px; border-radius:50%; border:1.5px solid var(--sage); background:var(--white); color:var(--sage); font-size:22px; line-height:1; cursor:pointer}
.step button:disabled{opacity:.35; cursor:default}
.step output{min-width:26px; text-align:center; font-weight:700}
.field{margin:16px 0 0} .field label{display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage-70); margin-bottom:4px; font-weight:600}
.field textarea{width:100%; min-height:70px; padding:11px 12px; border:1.5px solid var(--mist); border-radius:10px; font:inherit; font-size:16px; background:var(--white); resize:vertical}
.small{font-size:13px; color:var(--sage-70); margin-top:22px}
.bar{position:fixed; left:0; right:0; bottom:0; background:var(--white); border-top:1px solid var(--mist); box-shadow:0 -6px 24px rgba(38,38,38,.08); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.barin{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px}
.barin .tot{flex:1; font-size:13px; color:var(--sage-70); line-height:1.25} .barin .tot b{display:block; font-family:var(--display); font-size:28px; color:var(--sage); font-weight:600}
.go{border:0; background:var(--sage); color:#fff; border-radius:10px; padding:15px 22px; font:inherit; font-weight:700; letter-spacing:.06em; font-size:14px; text-transform:uppercase; cursor:pointer; min-height:50px}
.go:disabled{opacity:.45; cursor:default}
.done{background:var(--white); border-radius:var(--radius); border-top:6px solid var(--sage); padding:26px 22px; text-align:center; box-shadow:0 8px 24px rgba(38,38,38,.08)}
.done .tick{width:62px; height:62px; border-radius:50%; background:var(--good-bg); color:var(--good); font-size:34px; line-height:62px; margin:0 auto 12px}
.done ul{list-style:none; padding:0; margin:14px 0; text-align:left}
.done li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--mist)}
.loading{text-align:center; padding:60px 10px; color:var(--sage-70)}
.bidrow{margin-top:14px;border-top:1px solid var(--mist);padding-top:12px}
.bidrow label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-70);margin-bottom:6px;font-weight:600}
.bidin{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bidin span{font-family:var(--display);font-size:28px;color:var(--sage)}
.bidin input{width:120px;padding:11px 12px;border:1.5px solid var(--mist);border-radius:10px;font:inherit;font-size:20px;background:var(--white)}
.bidin input:focus{outline:none;border-color:var(--sage)}
.bidgo{flex:1;min-width:150px}
.bidmsg .bad{margin:10px 0 0}
@media (max-width:480px){ h1{font-size:27px} .opt .price{font-size:30px} .go{padding:14px 16px} }
</style>
</head>
<body>
<header><a href="https://www.blackhorsebeamish.co.uk"><img src="https://app.blackhorsebeamish.co.uk/app/logo-light.png" alt="Black Horse Beamish"></a></header>
<main id="main"><div class="loading">One moment…</div></main>
<div class="bar" id="bar" hidden><div class="barin"><div class="tot"><span id="tl">Your extras</span><b id="tv">£0</b></div><button class="go" id="go" disabled>Pay by card</button></div></div>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/upsell-api", KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const P = new URLSearchParams(location.search), T = P.get("t") || "", PREVIEW = P.get("preview") === "1", PAID = P.get("paid") || "", WANT = P.get("o") || "";
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const gbp = n => "£" + (Number.isInteger(Math.round(n * 100) / 100) ? String(Math.round(n * 100) / 100) : (Math.round(n * 100) / 100).toFixed(2));
async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body: JSON.stringify(Object.assign({ action, t:T }, payload || {})) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || "Something went wrong. Please try again.");
  return d;
}
const S = { d:null, qty:{}, busy:false };
function total(){
  let t = 0; const d = S.d;
  d.extras.forEach(e => { const q = S.qty[e.id] || 0; if (q) t += e.price * q * (e.per === "night" ? d.nights : 1); });
  return Math.round(t * 100) / 100;
}
function paint(){
  const d = S.d, t = total();
  $("#tv").textContent = gbp(t);
  $("#go").disabled = !(t >= 1) || S.busy || PREVIEW;
  $("#go").textContent = PREVIEW ? "Preview only" : S.busy ? "One moment…" : t >= 1 ? "Pay " + gbp(t) + " by card" : "Choose something";
  d.extras.forEach(e => { const el = document.querySelector('.ex[data-id="' + e.id + '"]'); if (!el) return; const q = S.qty[e.id] || 0; el.classList.toggle("on", q > 0); el.querySelector("output").textContent = q; el.querySelector(".minus").disabled = q < 1; el.querySelector(".plus").disabled = q >= e.max_qty; });
}
function bidBanner(d){
  const b = d.open_bid; if (!b || d.upgraded) return "";
  if (b.status === "review") return `<div class="done" style="margin:16px 0;text-align:left;border-top-color:var(--gold)"><b>Your offer of ${gbp(b.bid)} for the ${esc(b.title)} is with our team.</b><br>We will email you as soon as we have looked at it. You are welcome to put in a different offer below.</div>`;
  const amt = b.status === "countered" ? b.counter : b.bid;
  return `<div class="done" id="bidbox" style="margin:16px 0;text-align:left"><b>${b.status === "countered" ? `We would love to upgrade you to the ${esc(b.title)} for ${gbp(amt)}.` : `Good news! Your offer of ${gbp(amt)} for the ${esc(b.title)} has been accepted.`}</b><br>${b.status === "countered" ? "That is very close to your offer. You can accept it here, or put in a different offer below." : "We are keeping it for you. Pay securely by card to confirm it."}${b.expires_at ? `<br><span style="font-size:13px;color:var(--sage-70)">Kept for you until ${esc(new Date(b.expires_at).toLocaleString("en-GB", { weekday:"long", day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" }))}.</span>` : ""}
    <div style="margin-top:12px"><button class="go" id="paybid" ${PREVIEW ? "disabled" : ""}>${PREVIEW ? "Preview only" : "Pay " + gbp(amt) + " and confirm my upgrade"}</button></div><div id="biderr"></div></div>`;
}
function render(){
  const d = S.d, stayLine = `<div class="stay">Your stay: <b>${esc(d.arrival_day)}</b> to <b>${esc(d.departure_day)}</b> (${d.nights} night${d.nights === 1 ? "" : "s"}) in a <b>${esc(d.room)}</b><br><span style="color:var(--sage-70);font-size:13px">Booking ${esc(d.ref)}</span></div>`;
  let h = (PREVIEW ? `<div class="banner">This is a preview of the page your guests see. Offers and payment are switched off.</div>` : "") + `<h1>Hello ${esc(d.first_name)}</h1>`;
  if (d.gone || d.started) { $("#main").innerHTML = h + `<p class="lead">Thank you for looking. This offer is only for stays that are still to come, and we cannot find an open one on this booking. If you think that is a mistake, please email <a href="mailto:stay@blackhorsebeamish.co.uk">stay@blackhorsebeamish.co.uk</a> and we will help.</p>`; return; }
  h += stayLine + bidBanner(d);
  if (d.upgraded) h += `<div class="done" style="margin-top:16px"><div class="tick">&#10003;</div><h2 style="margin-top:0">You are already upgraded</h2><p>Thank you, your room upgrade is booked and we cannot wait to welcome you.</p></div>`;
  if (d.unavailable) h += `<div class="bad">We cannot check which rooms are free just now. Please try again in a few minutes, or email <a href="mailto:stay@blackhorsebeamish.co.uk">stay@blackhorsebeamish.co.uk</a>.</div>`;
  if (d.options.length) {
    h += `<h2>${esc(d.upgrades_heading || "Which room would you like?")}</h2><p class="lead">${esc(d.upgrades_intro || "")}</p>`;
    h += d.options.map(o => `<div class="opt" data-id="${esc(o.id)}" style="padding-left:18px;cursor:default"><div class="tag">Name your own price</div><div class="name">${esc(o.title)}</div>${o.blurb ? `<div class="blurb">${esc(o.blurb)}</div>` : ""}<div class="was">Usual price for the extra over your ${o.nights === 1 ? "night" : o.nights + " nights"}</div><div class="price">${gbp(o.price)}</div>${o.nights > 1 ? `<div class="per">About ${gbp(o.per_night)} a night</div>` : ""}
      <div class="bidrow"><label for="b_${esc(o.id)}">Your offer</label><div class="bidin"><span>£</span><input id="b_${esc(o.id)}" type="number" inputmode="decimal" min="1" max="${o.price}" step="0.01" placeholder="Your price"><button class="go bidgo" data-bid="${esc(o.id)}" ${PREVIEW || d.bids_left < 1 ? "disabled" : ""}>Make my offer</button></div>
      <div class="bidmsg" id="m_${esc(o.id)}"></div><div class="per" style="margin-top:6px">${d.bids_left < 1 ? "You have made the most offers we can take online. Please email stay@blackhorsebeamish.co.uk." : `Or <a href="#" data-full="${esc(o.id)}">pay the usual ${gbp(o.price)} now</a> and it is yours.`}</div></div></div>`).join("");
  } else if (!d.upgraded && !d.unavailable && !d.open_bid) h += `<div class="banner" style="margin-top:16px">There is no higher room free for all of your nights at the moment. Rooms do change, so it is worth looking again nearer the time.</div>`;
  if (d.extras.length) {
    h += `<h2>${esc(d.extras_heading || "Little extras")}</h2><p class="lead">${esc(d.extras_intro || "")}</p>`;
    h += d.extras.map(e => `<div class="ex" data-id="${esc(e.id)}"><div class="t"><b>${esc(e.title)}</b>${e.blurb ? `<span>${esc(e.blurb)}</span>` : ""}</div><div class="p">${gbp(e.price)}<small>${e.per === "night" ? "a night" : e.per === "each" ? "each" : ""}</small></div><div class="step"><button type="button" class="minus" aria-label="Fewer">&minus;</button><output>0</output><button type="button" class="plus" aria-label="More">+</button></div></div>`).join("");
    h += `<div class="field"><label for="note">Anything we should know? (the occasion, a time, a message)</label><textarea id="note" maxlength="300"></textarea></div>`;
  }
  h += `<p class="small">${esc(d.small_print || "")}</p><div id="err"></div>`;
  $("#main").innerHTML = h;
  $("#bar").hidden = !d.extras.length;
  d.extras.forEach(e => { const el = document.querySelector('.ex[data-id="' + e.id + '"]'); el.querySelector(".minus").onclick = () => { S.qty[e.id] = Math.max(0, (S.qty[e.id] || 0) - 1); paint(); }; el.querySelector(".plus").onclick = () => { S.qty[e.id] = Math.min(e.max_qty, (S.qty[e.id] || 0) + 1); paint(); }; });
  document.querySelectorAll("[data-bid]").forEach(b => b.onclick = () => bid(b.dataset.bid, +document.getElementById("b_" + b.dataset.bid).value));
  document.querySelectorAll("[data-full]").forEach(a => a.onclick = ev => { ev.preventDefault(); if (PREVIEW) return; const o = d.options.find(x => x.id === a.dataset.full); bid(o.id, o.price); });
  const pb = $("#paybid"); if (pb) pb.onclick = payBid;
  paint();
  if (WANT) { const i = document.getElementById("b_" + WANT); if (i) i.scrollIntoView({ block:"center" }); } else if (P.get("bid") && $("#bidbox")) $("#bidbox").scrollIntoView({ block:"center" });
}
async function bid(id, amount){
  if (S.busy || PREVIEW) return; const msg = document.getElementById("m_" + id);
  if (!(amount >= 1)) { msg.innerHTML = `<div class="bad">Please enter an amount in pounds, for example 45.</div>`; return; }
  S.busy = true; document.querySelectorAll("[data-bid]").forEach(b => b.disabled = true); msg.innerHTML = `<div class="per">One moment…</div>`;
  try {
    const r = await call("offer.bid", { offer_id:id, amount });
    if (r.decision === "accepted") { msg.innerHTML = `<div class="done" style="padding:14px;margin-top:10px"><b>Yes! We would love to upgrade you for ${gbp(r.amount)}.</b><br>Taking you to our secure payment page…</div>`; location.href = r.url; return; }
    if (r.decision === "declined") { msg.innerHTML = `<div class="bad">Thank you for your offer. ${gbp(r.amount)} is a little lower than we can do for this room. Please try a higher offer${r.left > 0 ? "" : ", or email stay@blackhorsebeamish.co.uk"}.</div>`; }
    else { $("#main").innerHTML = `<div class="done" style="margin-top:6px"><div class="tick">&#10003;</div><h1>Thank you!</h1><p>We have your offer of <b>${gbp(r.amount)}</b>. Our team will look at it and email you very soon, and if we can say yes you will have a link to confirm it. You do not need to do anything else.</p><p><a href="?t=${encodeURIComponent(T)}">Back to the page</a></p></div>`; $("#bar").hidden = true; window.scrollTo(0, 0); }
  } catch (e) { msg.innerHTML = `<div class="bad">${esc(e.message)}</div>`; }
  S.busy = false; document.querySelectorAll("[data-bid]").forEach(b => b.disabled = PREVIEW || S.d.bids_left < 1);
}
async function payBid(){
  const b = S.d.open_bid; const btn = $("#paybid"); btn.disabled = true; btn.textContent = "One moment…";
  try { const r = await call("offer.pay", { bid_id:b.id }); location.href = r.url; }
  catch (e) { $("#biderr").innerHTML = `<div class="bad">${esc(e.message)}</div>`; btn.disabled = false; btn.textContent = "Try again"; }
}
$("#go").onclick = async () => {
  if (S.busy || PREVIEW) return; S.busy = true; paint(); $("#err").innerHTML = "";
  try {
    const extras = S.d.extras.filter(e => S.qty[e.id] > 0).map(e => ({ id:e.id, qty:S.qty[e.id] }));
    const d = await call("offer.pay", { picks:{ extras, note:($("#note") || {}).value || "" } });
    location.href = d.url;
  } catch (e) { S.busy = false; $("#err").innerHTML = `<div class="bad">${esc(e.message)}</div>`; paint(); window.scrollTo({ top:document.body.scrollHeight, behavior:"smooth" }); }
};
async function back(){
  $("#main").innerHTML = `<div class="loading">Confirming your payment…</div>`;
  for (let i = 0; i < 6; i++) {
    try {
      const d = await call("offer.check", { id:PAID });
      if (d.status === "paid") { $("#main").innerHTML = `<div class="done"><div class="tick">&#10003;</div><h1>Thank you!</h1><p>Your payment of <b>${gbp(d.total)}</b> has been received and we are delighted you have treated yourself.</p><ul>${d.lines.map(l => `<li><span>${esc(l.text)}</span><b>${gbp(l.amount)}</b></li>`).join("")}</ul><p>Our team will add this to your booking, and a confirmation is on its way to your inbox. We cannot wait to welcome you.</p></div>`; return; }
      if (d.status === "failed") { $("#main").innerHTML = `<div class="done"><h1>Payment not completed</h1><p>Nothing has been taken from your card. You are welcome to try again, or email <a href="mailto:stay@blackhorsebeamish.co.uk">stay@blackhorsebeamish.co.uk</a> and we will help.</p><p><a href="?t=${encodeURIComponent(T)}">Back to the offer</a></p></div>`; return; }
    } catch (e) { /* try again */ }
    await new Promise(r => setTimeout(r, 2500));
  }
  $("#main").innerHTML = `<div class="done"><h1>We are confirming your payment</h1><p>This is taking a little longer than usual. If your card was charged you will receive an email from us shortly. If you do not, please email <a href="mailto:stay@blackhorsebeamish.co.uk">stay@blackhorsebeamish.co.uk</a> and we will sort it out.</p></div>`;
}
(async function(){
  if (!T) { $("#main").innerHTML = `<p class="lead">This link needs its full address. Please use the button in your email.</p>`; return; }
  if (PAID) return back();
  try { S.d = await call("offer.get", PREVIEW ? { preview:true } : {}); render(); }
  catch (e) { $("#main").innerHTML = `<div class="bad">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
