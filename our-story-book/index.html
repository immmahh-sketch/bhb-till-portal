<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Story of the Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--olive:#CCCDB4;--bar:92px}
*{box-sizing:border-box;margin:0;padding:0;font-style:normal}
html,body{height:100%;background:#120f0c;color:#fff;font-family:"Raleway",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;background:radial-gradient(120% 90% at 50% 38%,#2a221b 0%,#120f0c 70%)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 14px 0;position:relative}
.stage{position:relative;aspect-ratio:2400/1680;width:min(100%,calc((100vh - var(--bar) - 14px) * 1.4286));width:min(100%,calc((100dvh - var(--bar) - 14px) * 1.4286));transform-origin:50% 50%;will-change:transform;filter:drop-shadow(0 22px 50px rgba(0,0,0,.6))}
#book{width:100%;height:100%;min-width:0!important;min-height:0!important;transition:transform 1.4s cubic-bezier(.45,.05,.25,1)}
#book.front{transform:translateX(-25%)}#book.back{transform:translateX(25%)}
@media(max-width:700px) and (orientation:portrait){#book.front,#book.back{transform:none}}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--olive)}
.hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:9px 18px;border-radius:30px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;transition:opacity .6s;white-space:nowrap;font-weight:500}
.hint.off{opacity:0}
.bar{height:var(--bar);display:flex;align-items:center;justify-content:center;gap:14px;padding:0 14px;transition:opacity .6s}
.bar a,.bar .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:150px;padding:15px 24px;border-radius:40px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;transition:background .2s,border-color .2s}
.bar a:hover,.bar .btn:hover{background:rgba(255,255,255,.14);border-color:#fff}
.bar .primary{background:var(--green);border-color:var(--green)}
.bar .primary:hover{background:#5d735f;border-color:#5d735f}
.bar .arrow{appearance:none;flex:none;width:48px;height:48px;min-width:48px;padding:0;border-radius:50%}
.bar .arrow:disabled{opacity:.3;cursor:default}
.bar :focus-visible{outline:2px solid var(--olive);outline-offset:3px}
@media(max-width:760px){.bar{gap:8px}.bar a,.bar .btn{min-width:0;padding:13px 14px;font-size:9.5px;letter-spacing:.16em}.bar .hide-s{display:none}}
/* story mode: bar hidden, captions take its place */
.cap{position:absolute;left:0;right:0;bottom:0;height:var(--bar);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw;pointer-events:none}
.cap p{font:600 clamp(15px,1.9vw,32px)/1.45 "Raleway",sans-serif;letter-spacing:.04em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.9);opacity:0;transition:opacity .9s ease;max-width:1250px}
.cap p.on{opacity:1}
body.story .bar{opacity:0;pointer-events:none}
.sbar{position:fixed;top:14px;right:16px;display:none;gap:10px;z-index:5}
body.story .sbar{display:flex}
.sbar button{appearance:none;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);color:#fff;font:600 10px/1 "Raleway",sans-serif;letter-spacing:.22em;text-transform:uppercase;padding:11px 16px;border-radius:30px;cursor:pointer}
.sbar button:hover{background:rgba(255,255,255,.16)}
body.rec *{transition:none!important}
body.rec .sbar,body.rec .hint,body.story .hint{display:none!important}
.prog{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--olive);opacity:.7;z-index:4}
body:not(.story) .prog,body.rec .prog{display:none}
.end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:26px;background:rgba(10,8,6,.86);z-index:6;text-align:center;padding:30px}
.end.on{display:flex}
.end h2{font:500 clamp(22px,3vw,44px)/1.2 "Raleway",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.end p{font:500 12px/1.9 "Raleway",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--olive)}
.end .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.end a,.end button{appearance:none;display:inline-flex;padding:15px 26px;border-radius:40px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.24em;text-transform:uppercase;cursor:pointer}
.end a.primary{background:var(--green);border-color:var(--green)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <div id="book" aria-label="The Story of the Black Horse Beamish, a flip book of 24 pages"></div>
    <div class="loading" id="loading">Opening the book</div>
    <div class="hint" id="hint">Click or drag a page corner to turn</div>
  </div>
</main>
<div class="cap" id="cap" aria-live="polite"><p id="c1"></p><p id="c2" style="position:absolute"></p></div>
<nav class="bar" id="bar" aria-label="Story controls">
  <button id="prev" class="btn arrow" type="button" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="play" class="btn primary" type="button"><svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><path d="M0 0l12 7-12 7z"/></svg>Play the story</button>
  <a class="hide-s" href="https://www.blackhorsebeamish.co.uk/" target="_top">Homepage</a>
  <a class="hide-s" href="https://www.blackhorsebeamish.co.uk/booking" target="_top">Book a table</a>
  <button id="next" class="btn arrow" type="button" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
<div class="sbar" id="sbar"><button id="mute" type="button">Sound on</button><button id="stop" type="button">Stop</button></div>
<audio id="aud" src="music.mp3" preload="auto"></audio>
<div class="prog" id="prog"></div>
<div class="end" id="end"><div><h2>The story continues</h2></div><p>Red Row Estate &nbsp;·&nbsp; Beamish &nbsp;·&nbsp; County Durham<br><span style="opacity:.6;font-size:10px;letter-spacing:.16em">Music: Sweet Home, Ambience of the Past</span></p>
  <div class="row"><button id="again" type="button">Watch again</button><a href="https://www.blackhorsebeamish.co.uk/" target="_top">Homepage</a><a class="primary" href="https://www.blackhorsebeamish.co.uk/booking" target="_top">Book a table</a></div></div>
<ol class="sr" id="alts"></ol>
<script src="page-flip.browser.js?v=2"></script>
<script>
const Q = new URLSearchParams(location.search);
const REC = Q.has("rec");               // recording mode: no controls, starts by itself, no YouTube player
const SPEED = +Q.get("speed") || 1;     // testing only
if (REC) document.body.classList.add("rec");

const PAGES = ["Cover: The Story of the Black Horse Beamish",
 "Causey Arch, built 1725 to 1726", "A valley that worked", "Red Row, near Causey: an archive photograph", "Red Row",
 "The Black Horse", "Outside the Black Horse: an archive photograph", "Adding to the matchbox beams", "The matchbox pub",
 "A DB5 and an obsession", "The farmhouse and the early workshop", "The courtyard", "The pub brought back to life, 2006 to 2010",
 "Workshop and Car Barn Beamish", "The workshop, then and now", "The Orchard Marquee among the lavender", "The Orchard Marquee, 2016",
 "Field to plate", "Sunset over the lavender and the pub in summer", "Huckleberry Cottage", "Rooms in the valley",
 "Red Row Estate from the air", "Red Row Estate today", "Back cover"];
const N = PAGES.length;
const url = i => "pages/p" + String(i + 1).padStart(2, "0") + ".webp";
document.getElementById("alts").innerHTML = PAGES.map((t, i) => "<li>Page " + (i + 1) + " of " + N + ". " + t + "</li>").join("");

/* the story: which spread to show, for how long (seconds), and the lines read out as captions */
const STEPS = [
 {pg:0,  d:8,  c:["The Story of the Black Horse Beamish","From a row of cottages in a Durham valley, to Red Row Estate."]},
 {pg:1,  d:17, c:["Long before the pub, this valley worked.","Coal came down the Tanfield wagonway, over Causey Arch in 1726,","and Beamish Colliery opened in 1763."]},
 {pg:3,  d:17, c:["Close to Causey, a short row of cottages stood on Red Row.","The Black Horse says its building began in the 1700s as the first cottage in that row,","and it is said to be over three hundred years old."]},
 {pg:5,  d:17, c:["By the middle of the 1800s, the cottage was a licensed pub.","The 1851 census is said to list twenty-eight people living under its roof,","and Causey's first Primitive Methodists met in a room at the Red Row Inn."]},
 {pg:7,  d:15, c:["Landlords came and went, and each hung matchboxes from the beams.","Hundreds of souvenirs from across the world made it the matchbox pub,","and in 2025 the collection grew again."]},
 {pg:9,  d:17, c:["In the 1980s Bob Fountain bought the land at Red Row.","In the sheds by his farmhouse he restored an Aston Martin DB5,","and in 1988 that obsession became Aston Workshop."]},
 {pg:11, d:17, c:["Next door, the old pub had closed and fallen into disrepair.","In 2006 Bob bought it. Where better to have a pub than at the end of your garden?","After years of restoration it re-opened in 2010, creating thirty jobs."]},
 {pg:13, d:17, c:["Aston Workshop grew from a few sheds into a 45,000 square foot workshop.","In 2012 came Beamish Morgan, which became Car Barn Beamish,","and since 2022 its free Drivers' Club meets have drawn hundreds of cars."]},
 {pg:15, d:15, c:["In 2016 a permanent marquee opened among the grounds.","Weddings, parties and celebrations followed,","and in 2025 the Orchard Marquee won a Certificate of Excellence."]},
 {pg:17, d:15, c:["The kitchen grows what it cooks: herbs, fruit and vegetables from the estate.","Red Row Organics brings the estate onto the plate,","and the lavender field is there for everyone to wander through."]},
 {pg:19, d:15, c:["Stay a while: the Old Red Row Rooms, Red Row Retreat and Huckleberry Cottage.","Rooms named Rosemary, Lovage, Sage and Thyme,","with space for up to forty-seven guests."]},
 {pg:21, d:17, c:["Today, Red Row Estate stretches across thirty-seven acres of Beamish countryside.","A pub, a workshop, Car Barn Beamish, a marquee, rooms, lavender and gardens.","One estate, one story, still being written."]},
 {pg:23, d:9,  c:["Come and be part of the next chapter.","Black Horse Beamish, Red Row Estate."]},
];
const FLIP_MS = 1500;

const $ = id => document.getElementById(id);
const flip = new St.PageFlip($("book"), {
  width: 1200, height: 1680, size: "stretch",
  minWidth: 300, maxWidth: 3000, minHeight: 400, maxHeight: 3400,
  usePortrait: true, showCover: true, drawShadow: true, maxShadowOpacity: .5,
  flippingTime: FLIP_MS, showPageCorners: !REC, mobileScrollSupport: false, swipeDistance: 24, autoSize: true
});
flip.loadFromImages(PAGES.map((_, i) => url(i)));
function tween(ms, fn, done) { const t0 = performance.now(); (function step() { const p = Math.min(1, (performance.now() - t0) / ms); fn(p); if (p < 1) requestAnimationFrame(step); else if (done) done(); })(); }
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
let bookX = 0;
function setBookX(target) {   // REC only: slide the book so a lone cover sits centred
  const from = bookX; if (from === target) return; bookX = target;
  tween(1400, p => { $("book").style.transform = "translateX(" + (from + (target - from) * ease(p)) + "%)"; });
}
const upd = () => { const i = flip.getCurrentPageIndex(); if (REC) setBookX(i === 0 ? -25 : (i >= flip.getPageCount() - 1 ? 25 : 0)); else { $("book").classList.toggle("front", i === 0); $("book").classList.toggle("back", i >= flip.getPageCount() - 1); } $("prev").disabled = i <= 0; $("next").disabled = i >= flip.getPageCount() - 1; };
let ready = false;
flip.on("init", () => { ready = true; $("loading").remove(); setTimeout(() => $("hint").classList.add("off"), 6000); upd(); });
flip.on("flip", () => { $("hint").classList.add("off"); upd(); });
$("prev").onclick = () => flip.flipPrev();
$("next").onclick = () => flip.flipNext();
addEventListener("keydown", e => { if (story) { if (e.key === "Escape") stop(); return; } if (e.key === "ArrowRight") flip.flipNext(); if (e.key === "ArrowLeft") flip.flipPrev(); });

/* ---------- music: the track plays from this page, started by the click on Play ---------- */
const aud = $("aud"); let muted = false, fadeT = null;
function setVol(v) { try { aud.volume = Math.max(0, Math.min(1, v)); } catch (e) {} }
function musicStart() {
  if (REC) return; clearInterval(fadeT); aud.currentTime = 0; aud.muted = muted; setVol(0);
  const p = aud.play(); if (p && p.catch) p.catch(() => {});
  let v = 0; fadeT = setInterval(() => { v += .03; setVol(Math.min(v, .6)); if (v >= .6) clearInterval(fadeT); }, 100);
}
function musicStop() { clearInterval(fadeT); try { aud.pause(); } catch (e) {} }
function musicFade(ms) { clearInterval(fadeT); let v = aud.volume; const step = v / (ms / 100); fadeT = setInterval(() => { v -= step; if (v <= 0) { clearInterval(fadeT); musicStop(); } else setVol(v); }, 100); }
$("mute").onclick = () => { muted = !muted; aud.muted = muted; $("mute").textContent = muted ? "Sound off" : "Sound on"; };

/* ---------- the story ---------- */
let story = false, token = 0, zoomTimer = null;
const sleep = ms => new Promise(r => setTimeout(r, ms / SPEED));
const capEls = [$("c1"), $("c2")]; let capIdx = 0;
function showCap(text) {
  if (REC) {
    const nx = capEls[capIdx ^ 1], cu = capEls[capIdx]; nx.textContent = text; capIdx ^= 1;
    tween(900, p => { nx.style.opacity = p; cu.style.opacity = 1 - p; }); return;
  }
  const next = capEls[capIdx ^ 1], cur = capEls[capIdx];
  cur.classList.remove("on");
  next.textContent = text; void next.offsetWidth; next.classList.add("on"); capIdx ^= 1;
}
function hideCap() { if (REC) { capEls.forEach(c => { const o = +c.style.opacity || 0; tween(600, p => { c.style.opacity = o * (1 - p); }); }); return; } capEls.forEach(c => c.classList.remove("on")); }
function drift(ms, k) {   // a slow push-in on the open book, different corner each time
  if (REC) { const st = $("stage"); st.style.transformOrigin = ["45% 55%", "55% 45%", "40% 50%", "60% 52%"][k % 4]; tween(ms, p => { st.style.transform = "scale(" + (1 + .06 * p) + ")"; }); return; }
  const st = $("stage"); const o = ["45% 55%", "55% 45%", "40% 50%", "60% 52%"][k % 4];
  st.style.transition = "none"; st.style.transformOrigin = o; st.style.transform = "scale(1)"; void st.offsetWidth;
  st.style.transition = "transform " + (ms / SPEED) + "ms linear"; st.style.transform = "scale(1.06)";
}
async function play() {
  if (!ready || story) return;
  story = true; const my = ++token; window.STORY_T0 = performance.now();
  document.body.classList.add("story"); $("end").classList.remove("on");
  flip.turnToPage(0); await sleep(500);
  musicStart();
  const total = STEPS.reduce((a, s) => a + s.d, 0); const t0 = performance.now();
  const prog = $("prog"); const pt = setInterval(() => { prog.style.width = Math.min(100, (performance.now() - t0) * SPEED / (total * 10)) + "%"; }, 200);
  for (let k = 0; k < STEPS.length; k++) {
    const s = STEPS[k]; if (my !== token) break;
    if (k > 0) { hideCap(); flip.flip(s.pg); await sleep(FLIP_MS + 350); if (my !== token) break; }
    drift(s.d * 1000, k);
    const remain = (s.d * 1000) - (k > 0 ? FLIP_MS + 350 : 0);
    const slot = remain / s.c.length;
    for (let j = 0; j < s.c.length; j++) { if (my !== token) break; showCap(s.c[j]); await sleep(slot); }
  }
  clearInterval(pt);
  if (my === token) {
    hideCap(); if (!REC) { musicFade(3000); await sleep(3000); }
    $("stage").style.transition = "none"; $("stage").style.transform = "scale(1)";
    story = false; if (!REC) { document.body.classList.remove("story"); $("end").classList.add("on"); } window.STORY_DONE = true;
  }
}
function stop() {
  token++; story = false; hideCap(); musicStop();
  document.body.classList.remove("story"); $("end").classList.remove("on");
  $("stage").style.transition = "none"; $("stage").style.transform = "scale(1)";
}
$("play").onclick = () => play();
$("again").onclick = () => play();
$("stop").onclick = stop;
</script>
</body>
</html>
