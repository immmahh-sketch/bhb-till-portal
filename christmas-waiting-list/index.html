<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Christmas Day waiting list | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--berry:#8A1C2B;--brown:#3F2F28;--muted:#7A6A68;--soft:#F6EBEC;--bone:#F8F8F8;--celadon:#CCCDB4;--white:#fff;--ink:#262626;--gold:#C1A51D;--gold-soft:#F4EFD3;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#4F6B4F;--good-bg:#EDF2ED;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2{font-family:var(--display);font-weight:600;margin:0;color:var(--brown);letter-spacing:.01em}
header.top{position:relative;background:var(--berry);color:var(--white);padding:22px 16px 30px;text-align:center;overflow:hidden}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--berry) 10px 24px,#fff 24px 34px,var(--berry) 34px 48px,var(--celadon) 48px 58px,var(--berry) 58px 72px)}
header.top img.logo{display:block;margin:0 auto 10px;height:46px;width:auto}
header.top .brand{font-family:var(--display);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
header.top .sub{font-family:var(--display);font-size:30px;line-height:1.15;margin-top:6px}
main{max-width:720px;margin:0 auto;padding:22px 14px 90px}
.card{background:var(--white);border-radius:var(--radius);border-top:3px solid var(--gold);box-shadow:0 1px 2px rgba(38,38,38,.06),0 10px 28px rgba(38,38,38,.07);padding:22px 20px;margin:0 0 18px}
.card h2{font-size:28px;margin-bottom:6px}
.lead{margin:0 0 8px;color:var(--muted)}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:13px 15px;font-size:15px;margin:14px 0}
label.f{display:block;font-weight:600;margin:18px 0 6px}
.req{color:var(--alert);margin-left:3px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;background:var(--white);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--berry);outline-offset:1px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--celadon);border-radius:9px;margin:0 0 8px;cursor:pointer;background:var(--white)}
.opt.on{border-color:var(--berry);background:var(--soft)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--berry);flex:0 0 auto}
.chk{display:flex;gap:10px;align-items:flex-start;margin:20px 0 4px}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--berry);flex:0 0 auto}
.btn{display:inline-block;background:var(--berry);color:var(--white);border:0;border-radius:9px;padding:14px 28px;font:inherit;font-weight:700;letter-spacing:.05em;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6;cursor:default}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.bad label.f{color:var(--alert)}
.bad input,.bad select{border-color:var(--alert)}
.pop{position:absolute;left:0;right:0;top:0;z-index:50;display:flex;justify-content:center;align-items:flex-start}
.pop .bk{position:fixed;inset:0;background:rgba(38,38,38,.45)}
.pop .bx{position:relative;margin:0 14px;max-width:420px;width:100%;background:var(--white);border-radius:var(--radius);border-top:3px solid var(--gold);box-shadow:0 14px 40px rgba(38,38,38,.3);padding:20px 20px 18px}
.pop h3{font-size:22px;margin:0 0 8px}
.pop p{margin:0 0 16px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--celadon);border-top-color:var(--berry);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body{position:relative}
body.embed header.top,body.embed footer{display:none}
body.embed main{padding-top:4px;padding-bottom:20px}
footer{max-width:720px;margin:0 auto;padding:0 14px 36px;font-size:14px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header class="top"><a href="https://www.blackhorsebeamish.co.uk" target="_blank" rel="noopener" style="display:block"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"></a><div class="brand">Christmas at Black Horse Beamish</div><div class="sub">Christmas Day waiting list</div></header>
<main id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></main>
<footer id="foot">Need a hand? Phone 01207 232 569 or email <a href="mailto:events@blackhorsebeamish.co.uk">events@blackhorsebeamish.co.uk</a>.<br>Black Horse Beamish, Red Row, Beamish, DH9 0RW</footer>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/xmas-api";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const PAID = new URLSearchParams(location.search).get("paid") || "";
const EMBED = new URLSearchParams(location.search).get("embed") === "1";      // shown inside the website: no header or footer, and it tells the page around it how tall it is
if (EMBED) document.body.classList.add("embed");
const tellHeight = () => { if (EMBED && parent !== window) parent.postMessage({ bhbHeight: document.documentElement.scrollHeight }, "*"); };
if (EMBED && window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const gbp = n => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
let I = null;

async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const timeLabel = t => { const [h, m] = t.split(":").map(Number); return (h > 12 ? h - 12 : h) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); };
const nums = (lo, hi, sel) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).map(n => '<option value="' + n + '"' + (n === sel ? " selected" : "") + '>' + n + '</option>').join("");

function formHtml(){
  return '<div class="card"><h2>Join the waiting list</h2>' +
    '<p class="lead">Christmas Day is fully booked at the moment, while we finish arranging tables for the guests who have already booked. If a table becomes available we will email you a link to pay for your booking in full (' + gbp(I.prices.adult) + ' per adult, ' + gbp(I.prices.child) + ' per child). You will then have <b>' + I.hours + ' hours</b> to pay, or the table will be offered to someone else.</p>' +
    '<div class="note"><b>Joining the list is not a booking</b> and you pay nothing now.</div>' +
    '<div class="note"><b>Please be aware:</b> if a table becomes available, arrival times will be extremely limited. We will do what we can to give you the time you ask for, but it is unlikely to be exactly when and/or where you want it.</div></div>' +
    '<form class="card" id="form" novalidate><h2>Your details</h2>' +
    '<div class="qrow"><label class="f" for="name">Your name<span class="req">*</span></label><input type="text" id="name" maxlength="80" autocomplete="name"></div>' +
    '<div class="qrow"><label class="f" for="email">Email address<span class="req">*</span></label><input type="email" id="email" maxlength="120" autocomplete="email"></div>' +
    '<div class="qrow"><label class="f" for="phone">Phone number<span class="req">*</span></label><input type="tel" id="phone" maxlength="30" autocomplete="tel" inputmode="tel"></div>' +
    '<label class="f">Who is coming?</label><div class="cols">' +
      '<div><label for="adults" style="font-size:14px">Adults</label><select id="adults">' + nums(1, 40, 2) + '</select></div>' +
      '<div><label for="children" style="font-size:14px">Children (under 12)</label><select id="children">' + nums(0, 40, 0) + '</select></div>' +
      '<div><label for="under3" style="font-size:14px">Under 3s</label><select id="under3">' + nums(0, 10, 0) + '</select></div></div>' +
    '<p class="hint" style="margin-top:6px">Under 3s are free when eating from adults&#39; plates. We will tell you if one needs their own meal.</p>' +
    '<label class="f" for="time">When would you like to arrive?</label><p class="hint">Arrival times will be extremely limited. We will do what we can, but it is unlikely to be exactly the time you ask for.</p><select id="time"><option value="any">Any time between 12pm and 4pm</option>' + I.times.map(t => '<option value="' + t + '">' + timeLabel(t) + '</option>').join("") + '</select>' +
    '<label class="f">Where would you like to sit?</label><p class="hint">Tables of more than 6 are mainly in the Marquee. We will do what we can, but it is unlikely to be exactly where you ask for.</p>' +
    [["", "No preference"], ["restaurant", "The Restaurant"], ["marquee", "The Marquee"]].map(([v, l], i) => '<label class="opt' + (i === 0 ? " on" : "") + '"><input type="radio" name="area" value="' + v + '"' + (i === 0 ? " checked" : "") + '><span>' + l + '</span></label>').join("") +
    '<label class="f" for="notes">Anything else we should know?</label><p class="hint">For example accessibility needs, high chairs, or a special occasion.</p><textarea id="notes" maxlength="600"></textarea>' +
    '<div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>' +
    '<label class="chk"><input type="checkbox" id="consent"><span>I am happy for Black Horse Beamish to use these details to contact me about a Christmas Day table. They will not be used for anything else.</span></label>' +
    '<div id="msg"></div><p style="margin:20px 0 0"><button type="submit" class="btn" id="go">Join the waiting list</button></p></form>';
}
function render(){
  if (!I.open) { $("#app").innerHTML = '<div class="card"><h2>The waiting list is closed</h2><p class="lead">We are not taking any more names at the moment. Please phone us on ' + esc(I.contact.phone) + ' or email ' + esc(I.contact.email) + '.</p></div>'; return; }
  $("#app").innerHTML = formHtml();
  $("#form").addEventListener("change", e => {
    if (e.target.name === "area") document.querySelectorAll(".opt").forEach(o => o.classList.toggle("on", o.contains(e.target)));
    if (e.target.id === "time" && e.target.value !== "any") askNicely("time", e.target);
    if (e.target.name === "area" && e.target.value) askNicely("area", e.target);
  });
  $("#form").addEventListener("submit", submit);
}
// a pop-up, set beside the control that was just changed (the page may sit in a tall frame on the website, so it is not centred on the screen)
function askNicely(kind, from){
  const old = $("#pop"); if (old) old.remove();
  const what = kind === "time" ? "the arrival time" : "the area";
  const top = Math.max(10, from.getBoundingClientRect().top + window.scrollY - 150);
  const d = document.createElement("div"); d.className = "pop"; d.id = "pop"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-labelledby", "pophead");
  d.style.top = top + "px";
  d.innerHTML = '<div class="bk"></div><div class="bx"><h3 id="pophead">We will do our best</h3><p>It is unlikely that we will be able to give you exactly ' + what + ' you have asked for, but we will do our best to get as close as we can.</p><button type="button" class="btn" id="popok">OK, I understand</button></div>';
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener("keydown", esc2); try { from.focus({ preventScroll:true }); } catch (e) {} };
  const esc2 = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esc2);
  d.querySelector(".bk").addEventListener("click", close);
  $("#popok").addEventListener("click", close);
  $("#popok").focus({ preventScroll:true });
  tellHeight();
}
async function submit(ev){
  ev.preventDefault();
  const v = id => ($("#" + id).value || "").trim();
  const need = [["name", v("name")], ["email", v("email")], ["phone", v("phone")]];
  document.querySelectorAll(".qrow").forEach(r => r.classList.remove("bad"));
  let firstBad = null; need.forEach(([k, val]) => { if (!val) { const r = $("#" + k).closest(".qrow"); r.classList.add("bad"); if (!firstBad) firstBad = r; } });
  const msg = $("#msg"); msg.innerHTML = "";
  if (firstBad) { msg.innerHTML = '<div class="err">Please fill in your name, email address and phone number.</div>'; firstBad.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  if (!$("#consent").checked) { msg.innerHTML = '<div class="err">Please tick the box to say we may contact you.</div>'; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Sending...";
  try {
    const area = (document.querySelector('input[name="area"]:checked') || {}).value || "";
    await call("waiting.join", { name:v("name"), email:v("email"), phone:v("phone"), adults:Number($("#adults").value), children:Number($("#children").value), under3:Number($("#under3").value), pref_time:$("#time").value, area_pref:area, notes:v("notes"), website:v("website"), consent:true });
    window.scrollTo({ top:0, behavior:"smooth" }); if (EMBED && parent !== window) parent.postMessage({ bhbTop:true }, "*");
    $("#app").innerHTML = '<div class="card"><h2>You are on the waiting list</h2><div class="ok">Thank you, ' + esc(v("name").split(/\s+/)[0]) + '. We have emailed you a confirmation.</div>' +
      '<p class="lead"><b>This is not a booking.</b> If a table becomes available we will email you a link to pay for your booking in full. You will then have ' + I.hours + ' hours to pay, or the table will be offered to someone else.</p>' +
      '<p class="lead"><b>Arrival times will be extremely limited.</b> We will do what we can to give you the time you asked for, but it is unlikely to be exactly when and/or where you want it.</p>' +
      '<p class="lead">Nothing more to do for now. If your plans change, reply to our email and we will take you off the list.</p></div>';
  } catch (e) { msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; btn.disabled = false; btn.textContent = "Join the waiting list"; }
}
async function paidView(){
  $("#app").innerHTML = '<div class="card" style="text-align:center"><span class="spin"></span><p class="lead">Checking your payment...</p></div>';
  let d; try { d = await call("waiting.check", { t:PAID }); } catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; return; }
  const summary = '<p class="lead">' + esc(d.party) + (d.time ? ', arriving ' + esc(d.time) : "") + (d.where ? ' in ' + esc(d.where) : "") + (d.amount ? ', ' + gbp(d.amount) : "") + '.</p>';
  if (d.status === "paid") $("#app").innerHTML = '<div class="card"><h2>Thank you, ' + esc(d.first) + '</h2><div class="ok">Your payment has been received and your Christmas Day booking is secured.</div>' + summary + '<p class="lead">We have emailed you a confirmation, and our events team will be in touch shortly about your meal choices.</p></div>';
  else if (d.status === "offered") $("#app").innerHTML = '<div class="card"><h2>Your payment has not gone through yet</h2>' + summary + '<p class="lead">Please pay by <b>' + esc(d.expires) + '</b> to secure your table. After that it will be offered to someone else.</p>' + (d.pay_url ? '<p><a class="btn" href="' + esc(d.pay_url) + '">Try the payment again</a></p>' : "") + '<p class="lead">If your card is declined, phone us on ' + esc(d.contact.phone) + ' and we will help.</p></div>';
  else if (d.status === "expired") $("#app").innerHTML = '<div class="card"><h2>This offer has expired</h2><p class="lead">We are sorry, the ' + I.hours + ' hours to pay have passed and the table has been released. Please phone us on ' + esc(d.contact.phone) + ' and we will see what we can do.</p></div>';
  else $("#app").innerHTML = '<div class="card"><h2>You are on the waiting list</h2><p class="lead">We will email you if a table becomes available.</p></div>';
}
(async function(){
  try { I = await call("waiting.info"); if (PAID) await paidView(); else render(); }
  catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; }
})();
</script>
</body>
</html>
