<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28; --bone:#F8F8F8; --celadon:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C1A51D;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --red:#B3261E; --good:#2F5B31; --good-bg:#EDF2ED; --attn:#B08D57; --attn-bg:#F7F0E4; --berry:#8C2F2F;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1000px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important} a{color:var(--sage)}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15} .gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 80px}
header.top{background:var(--berry); color:var(--white)} .topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:23px; line-height:1.1} .brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.8}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
nav.tabs{background:#6f2424} .tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.75); padding:12px 14px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:#fff; border-bottom-color:var(--gold)}
.pagehead{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin:22px 0 14px} .pagehead h2{font-size:28px; color:var(--berry)} .hint{font-size:13px; color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:#fff; border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; min-height:42px}
.btn.ghost{background:#fff; color:var(--sage)} .btn.small{min-height:34px; padding:5px 12px; font-size:11px} .btn.danger{background:#fff; color:var(--alert); border-color:var(--alert)} .btn:disabled{opacity:.5; cursor:default}
.card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px} .card h3{font-size:22px; color:var(--sage); margin-bottom:6px} .card h4{font-size:18px; color:var(--sage-dark); margin:12px 0 4px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px} .grid>.card{margin:0}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px}
.tile{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px} .tile .v{font-family:var(--display); font-size:30px; line-height:1.05; color:var(--berry)} .tile .l{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70)} .tile .s{font-size:12px; color:var(--sage-70); margin-top:2px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.pill{display:inline-block; border-radius:99px; padding:2px 10px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--sage-10); color:var(--sage)}
.pill.ok{background:var(--good-bg); color:var(--good)} .pill.warn{background:var(--attn-bg); color:#7a5f36} .pill.bad{background:var(--alert-bg); color:var(--alert)} .pill.gold{background:#F3E9D6; color:#7a5f36}
.flags{background:var(--attn-bg); border:1px solid #E6D3AE; border-radius:var(--radius); padding:12px 16px; margin:14px 0; font-size:13.5px; color:#5c4a28} .flags b{display:block; margin-bottom:4px} .flags ul{margin:4px 0 0; padding-left:18px} .flags li{margin:3px 0}
.bar{height:10px; background:var(--sage-10); border-radius:99px; overflow:hidden; margin:6px 0 2px} .bar i{display:block; height:100%; background:var(--sage)} .bar.warn i{background:var(--attn)}
table.t{width:100%; border-collapse:collapse; font-size:14px} .t th{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70); text-align:left; padding:6px 8px; border-bottom:1px solid var(--mist)} .t td{padding:8px; border-bottom:1px solid var(--mist); vertical-align:top} .t td.n,.t th.n{text-align:right; white-space:nowrap} .tw{overflow-x:auto}
.kd{display:flex; gap:12px; padding:7px 0; border-top:1px solid var(--mist); font-size:14px} .kd:first-of-type{border-top:0} .kd .d{flex:0 0 118px; font-weight:700; color:var(--berry)} .kd .in{flex:0 0 auto; font-size:12px; color:var(--sage-70); white-space:nowrap}
.menu h5{font-family:var(--body); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--berry); margin:12px 0 4px; font-weight:700} .menu ul{margin:0; padding-left:18px} .menu li{margin:3px 0}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px} .chip{border:1px solid var(--celadon); background:#fff; border-radius:99px; padding:6px 12px; cursor:pointer; font-size:13px} .chip[aria-pressed="true"]{background:var(--sage); color:#fff; border-color:var(--sage)}
.obj{border-left:4px solid var(--berry)} .obj .oh{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap} .obj .oh h3{flex:1 1 220px; margin:0}
.act{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; padding:11px 0; border-top:1px solid var(--mist)} .act .tt{font-weight:600} .act .meta{font-size:12.5px; color:var(--sage-70); display:flex; gap:10px; flex-wrap:wrap; margin-top:2px} .act .upd{grid-column:1/-1; font-size:13px; background:var(--bone); border-radius:6px; padding:6px 10px} .act .btns{display:flex; gap:6px; flex-wrap:wrap; align-self:start}
.act.done .tt{text-decoration:line-through; color:var(--sage-70)} .due.over{color:var(--red); font-weight:700} .due.soon{color:var(--attn); font-weight:700}
.field{margin:0 0 12px} .field label{display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage-70); margin:0 0 4px; font-weight:700} .field input,.field select,.field textarea{width:100%; min-height:42px; padding:8px 11px; border:1px solid var(--celadon); border-radius:8px; background:#fff; font-size:15px} .field textarea{min-height:84px; resize:vertical}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px} .three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px} @media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.checks{display:flex; gap:6px 14px; flex-wrap:wrap} .checks label{display:flex; gap:6px; align-items:center; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:400; margin:0} .checks input{width:auto; min-height:0}
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.55); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto} .modal{background:#fff; border-radius:12px; box-shadow:var(--shadow); width:100%; max-width:560px; padding:20px 22px} .modal h3{font-size:24px; color:var(--berry); margin-bottom:10px}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; z-index:700; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw} .toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.empty{padding:40px 16px; text-align:center; color:var(--sage-70)} .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
@media(max-width:640px){ .pagehead h2{font-size:24px} .btn{min-height:44px} }

.ordcell{width:64px;text-align:center}.ordtick{width:20px;height:20px;accent-color:var(--sage);cursor:pointer}.dtxt,.dtxt b,.dtxt .tiny{color:#9a9a96!important;text-decoration:line-through}.dec-done .pill{opacity:.7}
.dgt.free{cursor:cell}.dgt.free:hover{background-color:#F4F0E4}
.dgb.rd{background:repeating-linear-gradient(45deg,#2F6DA3,#2F6DA3 8px,#4F8BBF 8px,#4F8BBF 16px);outline:2px dashed #fff;outline-offset:-3px}.dgkey.rd{background:#3B7BB5}.rdrow.done td{color:#9a9a96;text-decoration:line-through}.rdrow.done td.keep{text-decoration:none}
.dgb{cursor:grab;user-select:none;-webkit-user-select:none}.dgb.dragging{z-index:60;opacity:.88;cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.4)}.dgt.dgdrop{background-color:#E9F1E4}
.dgw{overflow-x:auto} .dgr{display:flex;border-bottom:1px solid var(--mist);min-height:36px} .dgr.hdr{position:sticky;top:0;background:#fff;z-index:3;min-height:26px;border-bottom:2px solid var(--gold)}
.dgn{flex:0 0 112px;width:112px;position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--mist);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;line-height:1.15} .dgn b{font-size:13px} .dgn span{font-size:11px;color:var(--sage-70)}
.dgt{position:relative;height:36px;background-image:linear-gradient(90deg,var(--mist) 1px,transparent 1px);background-size:34px 100%} .dgr.pace .dgt,.dgr.hdr .dgt{display:flex;background-image:none}
.dgh{flex:0 0 34px;font-size:10px;color:var(--sage-70);text-align:left;padding:6px 0 0 3px;border-left:1px solid var(--mist);height:26px} .dgh.hr{color:var(--ink);font-weight:700;font-size:11px}
.dgp{flex:0 0 34px;height:36px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-left:1px solid var(--mist)} .dgp.some{background:#E5EDE5;color:#2F5B31} .dgp.near{background:#F4EBCF;color:#7a5f36} .dgp.over{background:#F1D3CF;color:var(--red)}
.dgs{background:var(--sage-10);font-family:var(--display);font-size:16px;color:var(--berry);padding:5px 10px;position:sticky;left:0;border-bottom:1px solid var(--mist)}
.dgb{position:absolute;top:3px;height:30px;border:0;border-radius:6px;color:#fff;font-size:12px;padding:0 7px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.25)} .dgb.ok{background:#2F5B31} .dgb.wait{background:#B08D57} .dgb.lock{outline:2px solid var(--ink);outline-offset:-2px} .dgb:hover{filter:brightness(1.12)}
.dgkey{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px} .dgkey.ok{background:#2F5B31} .dgkey.wait{background:#B08D57}
</style>

<body>
<div id="gate"><div class="gatecard"><h1>Christmas</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div id="gerr" style="color:var(--alert);font-size:13px;margin-top:10px"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Christmas 2026<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span></div></div></header>
  <nav class="tabs"><div class="tabsin" id="tabsin" role="tablist"></div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div id="modalroot"></div><div class="toast" id="toast" role="status"></div>
<script src="content.js?v=20261020"></script>
<script>
const CFG = { URL:"https://safcrtrfdzsnftghibot.supabase.co", KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { dg:null, dgId:"", pre:{ events:null, id:"", data:null }, me:null, people:[], view:"", ts:null, tsTimer:null, day:null, plan:null, planFilter:"open", corp:null, decor:null, decorArea:"" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const TABS = [["events","Christmas events"],["dining","Festive dining"],["day","Christmas Day"],["preorders","Pre-orders"],["diary","Diary"],["corporate","Corporate events"],["decorations","To Order"],["actions","Action plan"]];
const staffEmail = () => { try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } };
const money = n => { n = Number(n) || 0; return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: Math.abs(n % 1) > 0.004 ? 2 : 0, maximumFractionDigits: 2 }); };
const londonToday = () => new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/London", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
const dayNum = iso => Math.round(new Date(iso + "T12:00:00Z").getTime() / 864e5);
const daysTo = iso => dayNum(iso) - dayNum(londonToday());
const fmtDay = iso => { try { return new Date(String(iso).slice(0,10) + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"short", day:"numeric", month:"short" }); } catch(e){ return iso; } };
const fmtDayY = iso => { try { return new Date(String(iso).slice(0,10) + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return iso; } };
const fmtDT = iso => { try { return new Date(iso).toLocaleString("en-GB", { timeZone:"Europe/London", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).replace(",", ""); } catch(e){ return ""; } };
const inWords = iso => { const n = daysTo(iso); return n < 0 ? Math.abs(n) + " day" + (n === -1 ? "" : "s") + " ago" : n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; };
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 5200 : 2400); }
async function post(fn, body){
  const r = await fetch(CFG.URL + "/functions/v1/" + fn, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.KEY, apikey:CFG.KEY }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const api = (action, p) => post("christmas-api", { action, staff_email: staffEmail(), ...(p || {}) });
const tsApi = (action, payload) => post("ticketsource-api", { action, payload:{ staff_email: staffEmail(), ...(payload || {}) } });
function openModal(html){ closeModal(); const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); }); $("#modalroot").appendChild(bg); }
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); }
const canEdit = () => !!(S.me && S.me.edit);
const flagsHtml = tab => { const f = XMAS.flags.filter(x => x.tab === tab); return f.length ? `<div class="flags"><b>On the website: to put right (read ${esc(XMAS.checked)})</b><ul>${f.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul></div>` : ""; };
const sourceNote = `<p class="tiny muted">From the website and the 2026 Christmas brochure, read ${esc(XMAS.checked)}. Prices are per person unless stated. Check the website for anything that has changed since.</p>`;
const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>`;
const siteLink = (path, text) => link(XMAS.site + path, text || "On the website");
const menuList = (sections) => `<div class="menu">${sections.map(s => `<h5>${esc(s.h)}</h5><ul>${s.i.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>`;

/* ====================================================================== events */
function keyDatesHtml(n){
  const up = XMAS.keyDates.filter(k => daysTo(k.d) >= 0).slice(0, n);
  return `<div class="card"><h3>Coming up</h3>${up.map(k => `<div class="kd"><span class="d">${esc(fmtDay(k.d))}</span><span style="flex:1">${esc(k.t)}</span><span class="in">${esc(inWords(k.d))}</span></div>`).join("") || `<p class="muted">Nothing left on the list.</p>`}</div>`;
}
function matchShow(e, dates){
  return (dates || []).filter(d => !d.cancelled && String(d.starts_at || "").slice(0, 10) === e.date && e.match.test(String(d.event_name || "")))[0] || null;
}
function showNumbers(d, e){
  if (!S.ts) return `<p class="small muted">Reading ticket sales…</p>`;
  if (S.ts.configured === false) return `<p class="small muted">Ticket numbers appear here once TicketSource is connected.</p>`;
  if (!d) return `<p class="small muted">Not found in the ticket sales yet (is the show on sale in TicketSource?).</p>`;
  const sold = Number(d.tickets_sold) || 0, cap = Number(d.capacity) || 0, pct = cap ? Math.min(100, Math.round(sold / cap * 100)) : 0;
  return `<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap"><div><div class="tile" style="box-shadow:none;padding:0;background:none"><div class="v">${sold}</div><div class="l">tickets sold</div></div></div>
    <div><div style="font-weight:700">${money(d.gross)}</div><div class="tiny muted">taken (${Number(d.bookings) || 0} booking${Number(d.bookings) === 1 ? "" : "s"})</div></div>
    ${cap ? `<div style="flex:1 1 160px"><div class="small"><b>${Math.max(0, cap - sold)}</b> left of ${cap}</div><div class="bar${pct >= 90 ? " warn" : ""}"><i style="width:${pct}%"></i></div></div>` : `<div class="tiny muted">No capacity set: add it in Ticket sales (Weddings and events) to see spaces left.</div>`}</div>`;
}
async function loadTs(view){
  clearTimeout(S.tsTimer);
  try {
    S.ts = await tsApi("tickets.list");
    if (S.view !== view) return;
    if (view === "events") renderEvents();
    if (S.ts.working) S.tsTimer = setTimeout(() => { if (S.view === view) loadTs(view); }, 8000);
  } catch(e){ if (S.view === view && view === "events") { S.ts = { configured:false, error:e.message, dates:[] }; renderEvents(); } }
}
function renderEvents(){
  const dates = (S.ts && S.ts.dates) || [], used = new Set();
  let sold = 0, taken = 0;
  const cards = XMAS.events.map(e => {
    const d = matchShow(e, dates); if (d) { used.add(d.date_id); sold += Number(d.tickets_sold) || 0; taken += Number(d.gross) || 0; }
    const past = daysTo(e.date) < 0;
    return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0">${esc(e.title)}</h3><div class="small"><b>${esc(fmtDay(e.date))}</b>, ${esc(e.time)} <span class="muted">· ${esc(inWords(e.date))}</span></div></div>${past ? `<span class="pill">Done</span>` : ""}</div>
      <p class="small" style="margin:8px 0">${esc(e.text)}</p>
      ${e.note ? `<p class="tiny muted" style="margin:0 0 8px">${esc(e.note)}</p>` : ""}
      ${showNumbers(d, e)}
      <div class="row small" style="margin-top:10px">${e.ticket ? link(e.ticket, "Tickets (TicketSource)") : ""}${e.page ? siteLink(e.page, "Website page") : ""}${e.menu ? link(XMAS.links[e.menu], "Food menu (PDF)") : ""}</div></div>`;
  }).join("");
  const other = dates.filter(d => !d.cancelled && !used.has(d.date_id) && /christmas|festive|wreath|party|nye|new year/i.test(String(d.event_name || "")) && !/christmas day/i.test(String(d.event_name || "")) && /^2026-1[12]/.test(String(d.starts_at || "").slice(0, 7)));
  const m = XMAS.market;
  $("#views").innerHTML = `<div class="pagehead"><h2>Christmas events</h2><span class="hint">Tickets sold come from TicketSource${S.ts && S.ts.finishedAt ? ", counted " + esc(fmtDT(S.ts.finishedAt)) : ""}${S.ts && S.ts.working ? " (updating…)" : ""}.</span><span class="spacer"></span><button class="btn ghost small" id="tsRefresh">Recount now</button></div>

/* ====================================================================== decorations */
const DEC_DONE = ["ordered","have","up","down"];
const DEC = { idea:["Idea",""], to_buy:["To buy","warn"], ordered:["Ordered","warn"], have:["Have it","ok"], up:["Up","ok"], down:["Taken down",""] };
const DEC_AREAS = ["Restaurant","Bar","Orchard Marquee","George Ridley Suite","Reception and entrance","Outside and courtyard","Rooms and cottages","Christmas trees","Table dressing","Christmas Market"];
async function viewDecor(){
  $("#views").innerHTML = `<div class="empty">Loading…</div>`;
  try { const d = await api("decor.list"); S.decor = d.rows; S.people = d.people; } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  renderDecor();
}
function renderDecor(){
  const rows = S.decor, areas = [...new Set([...DEC_AREAS.filter(a => rows.some(r => r.area === a)), ...rows.map(r => r.area)])];
  const shown = rows.filter(r => !S.decorArea || r.area === S.decorArea);
  const est = a => a.reduce((t, r) => t + (Number(r.est_cost) || 0), 0), cnt = s => rows.filter(r => r.status === s).length;
  const nm = e => (S.people.find(p => p.email === e) || {}).name || e || "";
  const grouped = areas.filter(a => shown.some(r => r.area === a)).map(a => `<div class="card"><h3>${esc(a)}</h3><div class="tw"><table class="t"><thead><tr><th title="Tick when it has been ordered">Ordered</th><th>Item</th><th class="n">Qty</th><th>Status</th><th class="n">Cost</th><th>Who / when</th><th></th></tr></thead><tbody>${shown.filter(r => r.area === a).map(r => { const dn = DEC_DONE.includes(r.status), dc = dn ? " dtxt" : ""; return `<tr class="${dn ? "dec-done" : ""}"><td class="ordcell"><input type="checkbox" class="ordtick" data-ord="${r.id}" ${dn ? "checked" : ""} ${canEdit() ? "" : "disabled"} aria-label="Ordered: ${esc(r.item)}" title="${dn ? "Ordered" + (r.ordered_by ? " by " + esc(r.ordered_by) : "") + (r.ordered_at ? " on " + esc(fmtDay(r.ordered_at.slice(0, 10))) : "") + ". Untick to put it back." : "Tick when it has been ordered"}"></td><td class="${dc}"><b>${esc(r.item)}</b>${r.supplier ? `<div class="tiny muted">${esc(r.supplier)}</div>` : ""}${r.notes ? `<div class="tiny">${esc(r.notes)}</div>` : ""}${r.hod_email && !dn ? `<div class="tiny muted">On ${esc(nm(r.hod_email))}'s HOD list</div>` : !dn && !r.hod_email && canEdit() ? `<div class="tiny muted">Not on a HOD list yet: give it to someone who has one</div>` : ""}</td><td class="n${dc}">${r.qty ?? ""}</td><td><span class="pill ${DEC[r.status][1]}">${DEC[r.status][0]}</span>${dn && r.ordered_by ? `<div class="tiny muted">by ${esc(r.ordered_by)}${r.ordered_at ? ", " + esc(fmtDay(r.ordered_at.slice(0, 10))) : ""}</div>` : ""}</td><td class="n${dc}">${r.est_cost != null ? money(r.est_cost) : ""}</td><td class="small${dc}">${esc(nm(r.owner_email))}${r.due_date ? `<div class="due ${daysTo(r.due_date) < 0 && !["have","up","down"].includes(r.status) ? "over" : ""}">${esc(fmtDay(r.due_date))}</div>` : ""}</td><td>${canEdit() ? `<button class="btn ghost small" data-dec="${r.id}">Edit</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div><p class="tiny muted" style="margin:6px 0 0">${money(est(shown.filter(r => r.area === a)))} estimated for this area</p></div>`).join("");
  $("#views").innerHTML = `<div class="pagehead"><h2>To Order</h2><span class="hint">What needs ordering for Christmas, where it goes, who has it and what it costs.</span><span class="spacer"></span>${canEdit() ? `<button class="btn" id="decAdd">Add an item</button>` : ""}</div>
    <div class="tiles"><div class="tile"><div class="v">${rows.length}</div><div class="l">items</div></div><div class="tile"><div class="v">${cnt("to_buy") + cnt("ordered")}</div><div class="l">still to get</div><div class="s">${cnt("to_buy")} to buy · ${cnt("ordered")} ordered</div></div><div class="tile"><div class="v">${cnt("have") + cnt("up")}</div><div class="l">ready or up</div></div><div class="tile"><div class="v">${money(est(rows))}</div><div class="l">estimated cost</div></div></div>
    ${areas.length ? `<div class="chips"><button class="chip" data-area="" aria-pressed="${!S.decorArea}">All areas</button>${areas.map(a => `<button class="chip" data-area="${esc(a)}" aria-pressed="${S.decorArea === a}">${esc(a)}</button>`).join("")}</div>` : ""}
    ${grouped || `<div class="card"><p class="muted" style="margin:0">Nothing listed yet. Add the items to order as they are decided, by area (restaurant, bar, Orchard Marquee, trees, tables, the market and so on).${canEdit() ? "" : " Ask for edit rights to add items."}</p></div>`}
    <p class="tiny muted">Key dates: everything up before the Christmas Fayre starts on 1 December; the Orchard Marquee dressed for Christmas Day; taken down in the new year. The matching tasks are on the Action plan.</p>`;
  if ($("#decAdd")) $("#decAdd").onclick = () => decorForm(null);
  $$("[data-area]").forEach(b => b.onclick = () => { S.decorArea = b.dataset.area; renderDecor(); });
  $$("[data-dec]").forEach(b => b.onclick = () => decorForm(S.decor.find(r => r.id === b.dataset.dec)));
  $$("[data-ord]").forEach(b => b.onchange = async () => {
    const want = b.checked; b.disabled = true;
    try { const d = await api("decor.order", { id: b.dataset.ord, ordered: want }); const i = S.decor.findIndex(r => r.id === d.row.id); if (i >= 0) S.decor[i] = d.row; toast(want ? "Marked as ordered." : "Put back to order."); renderDecor(); }
    catch(e){ b.checked = !want; b.disabled = false; toast(e.message); }
  });
}
function decorForm(r){
  r = r || { status:"idea", area: S.decorArea || "" };

function renderActions(){

/* ---- who has got how far: invited, opened the form, saved choices, sent back; the chips filter the bookings below to those stuck at each step ---- */

/* Dining time and table number, set by the team for each booking, so the table plans can be built from this list. */

async function preAct(act, btn){

async function preSend(ids, reminder, btn){

    for (let i = 0; i < ids.length; i += 10) {
      const r = await px("admin.send", { date_id: S.pre.id, booking_ids: ids.slice(i, i + 10), reminder });
      for (const x of r.results || []) { if (x.ok) sent++; else bad.push(x.ref + ": " + x.error); }
      if (ids.length > 10) toast("Sent " + sent + " of " + ids.length + "…");
    }
  } catch(e){ bad.push(e.message); }
  S.pre.note = sent ? `Sent ${sent} ${reminder ? "reminder" : "invitation"}${sent === 1 ? "" : "s"}.` + (bad.length ? ` ${bad.length} did not go: ${bad.slice(0, 5).join("; ")}.` : "") : "";

  await loadPre();
}

function addPeopleWire(f, id, again){
  const open = $("#apOpen"); if (!open) return;
  const day = f.event.key === "day", price = f.add_default || {}; let touched = false;
  const calc = () => { if (touched) return; const a = Number($("#apAd").value) || 0, c = day ? Number($("#apCh").value) || 0 : 0, v = (a + c) ? a * (price.adult || 0) + c * (price.child || 0) : Math.max(0, Number(f.pay && f.pay.balance) || 0); $("#apAmt").value = v ? v.toFixed(2) : ""; };
  open.onclick = () => { const b = $("#apBox"); b.style.display = b.style.display === "none" ? "" : "none"; calc(); };
  ["apAd", "apCh"].forEach(k => { const el = $("#" + k); if (el) el.oninput = calc; });
  $("#apAmt").oninput = () => { touched = true; };
  $("#apGo").onclick = async () => {
    const a = Number($("#apAd").value) || 0, c = day ? Number($("#apCh").value) || 0 : 0, amt = Number($("#apAmt").value);
    if (!(amt > 0)) { toast("Enter the amount to pay, as a number above zero.", true); return; }
    const go = $("#apGo"); go.disabled = true;
    try {
      const r = await px("admin.add_people", { booking_id:id, adults:a, children:c, amount:amt });
      $("#apOut").innerHTML = `<div class="note" style="margin-top:10px"><b>Payment page ready (${esc(r.what)}), ${money(r.amount)}.</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn small" href="${esc(r.url)}" target="_blank" rel="noopener" style="text-decoration:none">Open the payment page</a><button type="button" class="btn small ghost" id="apCopy">Copy the link</button><button type="button" class="btn small ghost" id="apChk">I have paid: check now</button></div><p class="small muted" style="margin:8px 0 0" id="apSt">Waiting for the payment. This checks every few seconds.</p></div>`;
      try { window.open(r.url, "_blank", "noopener"); } catch(e){}
      $("#apCopy").onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(r.url) : Promise.reject()).then(() => toast("Link copied."), () => window.prompt("Copy this link", r.url)); };
      let n = 0, busy = false, done = false;
      const check = async () => {
        if (busy || done) return; if (!$("#apSt")) { done = true; clearInterval(t); return; }
        busy = true;
        try {
          const c2 = await px("admin.add_people_check", { id:r.id });
          if (c2.status === "paid") { done = true; clearInterval(t); await again("Payment received and added to the booking."); return; }
          if (c2.status === "failed") { done = true; clearInterval(t); $("#apSt").textContent = "That payment did not go through, so nobody has been added. Press Take payment to try again."; go.disabled = false; return; }
          $("#apSt").textContent = "Waiting for the payment. This checks every few seconds.";
        } catch(e){ if ($("#apSt")) $("#apSt").textContent = e.message; }
        busy = false;
      };
      const t = setInterval(() => { if (++n > 120) { clearInterval(t); return; } check(); }, 5000);
      $("#apChk").onclick = check;
    } catch(e){ toast(e.message, true); go.disabled = false; }
  };
}

const DG = { COL:34, ROW:36, LEFT:112, START:12 * 60 };
const dgMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
async function dgDayId(){

  renderDiary();

function dgLanes(groups){   // bookings with no table yet: stack them into as few rows as fit
  const lanes = []; groups.slice().sort((a, b) => dgMin(a.time) - dgMin(b.time)).forEach(g => {
    const s = dgMin(g.time), e = dgMin(g.end); let i = lanes.findIndex(l => l.end <= s); if (i < 0) { lanes.push({ end:0, items:[] }); i = lanes.length - 1; }
    lanes[i].end = e; lanes[i].items.push(g);
  }); return lanes;
}
function dgBlock(g){
  const left = (dgMin(g.time) - DG.START) / 15 * DG.COL, width = (dgMin(g.end) - dgMin(g.time)) / 15 * DG.COL - 2;
  const cls = g.manual ? "dgb rd" : g.submitted ? "dgb ok" : "dgb wait";
  return `<button type="button" class="${cls}${g.locked ? " lock" : ""}" data-gid="${esc(g.gid)}" style="left:${left}px;width:${width}px" title="${esc(g.names)}, ${g.size} guest${g.size === 1 ? "" : "s"}, ${esc(g.time)} to ${esc(g.end)}${g.manual ? ". IN RESDIARY, NOT ON TICKETSOURCE. " + esc(g.note) : ""}"><b>${g.size}</b> ${esc(g.lead)}${g.linked ? " +" + (g.booking_ids.length - 1) : ""}${g.manual ? " (ResDiary)" : g.locked ? " &#128274;" : ""}</button>`;
}
function dgRows(side, d){
  const tables = d.sides[side].tables, placed = d.placed.filter(g => g.side === side);
  const total = (dgMin(d.day_end) - DG.START) / 15 * DG.COL;
  const mk = (name, sub, items, tbl) => `<div class="dgr"><div class="dgn"><b>${esc(name)}</b><span>${esc(sub)}</span></div><div class="dgt${tbl ? " free" : ""}" ${tbl ? `data-side="${side}" data-tbl="${esc(tbl.name)}" data-seats="${tbl.seats}" title="Click an empty space to put a booking here"` : ""} style="width:${total}px">${items.map(dgBlock).join("")}</div></div>`;
  const parts = tb => String(tb || "").split("+").map(x => x.trim()).filter(Boolean);
  let out = "", lastArea = null;
  tables.forEach(t => {
    if (side === "restaurant" && (t.area || "") !== lastArea) { lastArea = t.area || ""; if (lastArea) out += `<div class="dgs">${esc(lastArea)}</div>`; }
    out += mk(t.name, t.seats + " seats", placed.filter(g => parts(g.table).includes(t.name)), t);
  });
  const loose = placed.filter(g => !g.table || !parts(g.table).every(n => tables.some(t => t.name === n)));
  if (loose.length) out += dgLanes(loose).map((l, i) => mk("No table " + (i + 1), "to be set", l.items)).join("");
  if (!out) out = `<div class="small muted" style="padding:10px 12px">${side === "restaurant" ? "Nobody placed in the Restaurant yet." : "Nobody placed in the Marquee yet. Tables are made as the bookings are placed."}</div>`;
  return out;
}

    <div class="tiles"><div class="tile"><div class="v">${t.placed_covers}</div><div class="l">covers placed</div><div class="s">of ${t.covers} booked</div></div><div class="tile"><div class="v">${t.restaurant_covers}</div><div class="l">Restaurant</div></div><div class="tile"><div class="v">${t.marquee_covers}</div><div class="l">Marquee</div><div class="s">${d.sides.marquee.tables.length} tables so far</div></div><div class="tile"><div class="v">${t.waiting}</div><div class="l">not placed</div><div class="s">waiting for a pre-order or room</div></div></div>
    ${t.restaurant_tables_loaded ? "" : `<div class="flags"><b>The Restaurant's tables are not loaded yet</b>Until they are, Restaurant bookings are only held to the arrival limits and show without a table. Press <b>Restaurant tables</b> and paste the list from ResDiary (name and seats), and everything is placed again onto real tables.</div>`}
    <div class="card" style="padding:0;overflow:hidden"><div class="dgw"><div style="width:${DG.LEFT + total}px">
      <div class="dgr hdr"><div class="dgn"></div><div class="dgt" style="width:${total}px;display:flex">${hdr}</div></div>
      ${pace("restaurant")}${pace("marquee")}
      <div class="dgs">Restaurant</div>${dgRows("restaurant", d)}

(function dgDrag(){
  let st = null;

  const stop = () => { if (!st) return; st.el.style.transform = ""; st.el.classList.remove("dragging"); if (st.lane) st.lane.classList.remove("dgdrop"); st = null; };
  document.addEventListener("pointerdown", e => {
    if ((e.button || 0) > 0 || e.pointerType === "touch" || S.view !== "diary" || !S.dg || !canEdit()) return;
    const el = e.target.closest && e.target.closest(".dgb[data-gid]"); if (!el) return;
    const g = S.dg.placed.find(x => x.gid === el.dataset.gid); if (!g) return;
    st = { el, g, x0:e.clientX, y0:e.clientY, grab:e.clientX - el.getBoundingClientRect().left, on:false, lane:null };
  });

  const row = ({ g, score }) => `<tr data-q="${esc((g.names + " " + g.refs.join(" ")).toLowerCase())}"><td><b>${esc(g.names)}</b>${score ? ` <span class="pill ok">looks like it</span>` : ""}<div class="tiny muted">${esc(g.refs.join(", "))}</div></td><td class="n">${g.size}${g.size !== m.size ? `<div class="tiny" style="color:var(--attn)">ResDiary has ${m.size}</div>` : ""}</td><td class="small">${g.time ? "now " + esc(g.time) + (g.table ? ", table " + esc(g.table) : "") : "not placed"}</td><td><button class="btn small" data-pick="${esc(g.booking_ids[0])}">This is it</button></td></tr>`;
  openModal(`<h3 style="margin:0 0 2px">${esc(m.names)} is on TicketSource now?</h3><p class="small muted" style="margin:0 0 8px">Choose the TicketSource booking. It will be placed on ${m.side === "marquee" ? "the Marquee" : "the Restaurant"}${m.table ? " table " + esc(m.table) : ""} at ${esc(m.time)}, and the blue entry stops counting.</p>
    <input id="rdQ" placeholder="Search by name or booking reference" style="width:100%;margin:0 0 8px"><div style="max-height:46vh;overflow:auto"><table class="t"><tbody id="rdList">${all.map(row).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:10px"><button class="btn ghost" id="rdJust">Just tick it, I will place the booking myself</button><button class="btn ghost" data-close>Cancel</button></div>`);
  $("#rdQ").oninput = e => { const v = e.target.value.trim().toLowerCase(); $$("#rdList tr[data-q]").forEach(r => { r.style.display = !v || v.split(/\s+/).every(w => r.dataset.q.includes(w)) ? "" : "none"; }); };
  $$("[data-pick]").forEach(b => b.onclick = async () => { b.disabled = true; try { const r = await px("admin.manual_confirm", { date_id:S.dgId, id, booking_id:b.dataset.pick }); await dgReload("Ticked: " + (r.matched || "booking") + " now holds that table."); } catch(e){ toast(e.message, true); b.disabled = false; } });
  $("#rdJust").onclick = async () => { try { await px("admin.manual_confirm", { date_id:S.dgId, id }); await dgReload("Ticked. The blue entry no longer counts."); } catch(e){ toast(e.message, true); } };
}
async function dgOpen(gid){
  if (String(gid).indexOf("m:") === 0) return dgManualForm(S.dg.placed.find(x => x.gid === gid));
  const g = S.dg.placed.concat(S.dg.waiting).find(x => x.gid === gid); if (!g) return;
  return showFull(g.booking_ids[0], { gid });                 // the same booking screen as everywhere else, with the diary's own part on it
}

/* ---- the emails: a copy of every pre-order, and the weekly report */
async function preEmails(){
  let s; try { s = await px("admin.settings_get"); } catch(e){ toast(e.message, true); return; }
  openModal(`<h3 style="margin:0 0 8px">Emails</h3>
    <div class="field"><label>A copy of every pre-order, sent as it comes in (full answers, as a backup)</label><input type="text" id="emBk" value="${esc((s.backup_to || []).join(", "))}"></div>
    <div class="field"><label>The weekly report, Mondays at 8am (who has sent theirs in, who to chase)</label><input type="text" id="emWk" value="${esc((s.weekly_to || []).join(", "))}"></div>
    <label class="small" style="display:flex;gap:8px;align-items:center;margin:0 0 12px"><input type="checkbox" id="emOn" ${s.weekly_on ? "checked" : ""}> Send the weekly report</label>
    <p class="tiny muted" style="margin:0 0 10px">Separate several addresses with commas.${s.last_weekly_at ? " Last weekly report: " + esc(fmtDT(s.last_weekly_at)) + "." : ""}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn small ghost" id="emTest">Send me this week's report now</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="emSave">Save</button></div>`);
  $("#emSave").onclick = async () => { try { await px("admin.settings_set", { backup_to:$("#emBk").value, weekly_to:$("#emWk").value, weekly_on:$("#emOn").checked }); closeModal(); toast("Saved."); } catch(e){ toast(e.message, true); } };
  $("#emTest").onclick = async () => { const b = $("#emTest"); b.disabled = true; try { const r = await px("admin.weekly_send", { test_to:staffEmail() }); toast(r.sent ? `Sent to ${staffEmail()}: ${r.received} received, ${r.to_chase} to chase.` : "Could not send.", !r.sent); } catch(e){ toast(e.message, true); } b.disabled = false; };
}

/* ====================================================================== shell */
const VIEWS = { events: viewEvents, dining: viewDining, day: viewDay, preorders: viewPreorders, diary: viewDiary, corporate: viewCorporate, decorations: viewDecor, actions: viewActions };
function goView(v){
  clearTimeout(S.tsTimer); S.view = v;
  $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  window.scrollTo(0, 0); (VIEWS[v] || viewEvents)();
}
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="empty">Loading…</div>`;
  let d; try { d = await api("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.people = d.people; $("#whoname").textContent = S.me.name;
  const mine = TABS.filter(t => S.me.isAdmin || S.me.tabs.includes(t[0]));
  if (!mine.length) { $("#views").innerHTML = `<div class="empty">You do not have any tabs on Christmas yet. Ask the GM.</div>`; return; }
  $("#tabsin").innerHTML = mine.map(t => `<button class="tabbtn" role="tab" data-view="${t[0]}">${esc(t[1])}</button>`).join("");
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => goView(b.dataset.view)));
  goView(mine[0][0]);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
</script>
