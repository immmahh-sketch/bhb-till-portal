<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Christmas - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28; --bone:#F8F8F8; --celadon:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C1A51D;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --red:#B3261E; --good:#2F5B31; --good-bg:#EDF2ED; --attn:#B08D57; --attn-bg:#F7F0E4; --berry:#8C2F2F;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1000px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important} a{color:var(--sage)}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15} .gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 80px}
header.top{background:var(--berry); color:var(--white)} .topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:23px; line-height:1.1} .brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.8}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
nav.tabs{background:#6f2424} .tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.75); padding:12px 14px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:#fff; border-bottom-color:var(--gold)}
.pagehead{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin:22px 0 14px} .pagehead h2{font-size:28px; color:var(--berry)} .hint{font-size:13px; color:var(--sage-70)} .spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:#fff; border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; min-height:42px}
.btn.ghost{background:#fff; color:var(--sage)} .btn.small{min-height:34px; padding:5px 12px; font-size:11px} .btn.danger{background:#fff; color:var(--alert); border-color:var(--alert)} .btn:disabled{opacity:.5; cursor:default}
.card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px} .card h3{font-size:22px; color:var(--sage); margin-bottom:6px} .card h4{font-size:18px; color:var(--sage-dark); margin:12px 0 4px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px} .grid>.card{margin:0}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px}
.tile{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px} .tile .v{font-family:var(--display); font-size:30px; line-height:1.05; color:var(--berry)} .tile .l{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70)} .tile .s{font-size:12px; color:var(--sage-70); margin-top:2px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.pill{display:inline-block; border-radius:99px; padding:2px 10px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--sage-10); color:var(--sage)}
.pill.ok{background:var(--good-bg); color:var(--good)} .pill.warn{background:var(--attn-bg); color:#7a5f36} .pill.bad{background:var(--alert-bg); color:var(--alert)} .pill.gold{background:#F3E9D6; color:#7a5f36}
.flags{background:var(--attn-bg); border:1px solid #E6D3AE; border-radius:var(--radius); padding:12px 16px; margin:14px 0; font-size:13.5px; color:#5c4a28} .flags b{display:block; margin-bottom:4px} .flags ul{margin:4px 0 0; padding-left:18px} .flags li{margin:3px 0}
.bar{height:10px; background:var(--sage-10); border-radius:99px; overflow:hidden; margin:6px 0 2px} .bar i{display:block; height:100%; background:var(--sage)} .bar.warn i{background:var(--attn)}
table.t{width:100%; border-collapse:collapse; font-size:14px} .t th{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70); text-align:left; padding:6px 8px; border-bottom:1px solid var(--mist)} .t td{padding:8px; border-bottom:1px solid var(--mist); vertical-align:top} .t td.n,.t th.n{text-align:right; white-space:nowrap} .tw{overflow-x:auto}
.kd{display:flex; gap:12px; padding:7px 0; border-top:1px solid var(--mist); font-size:14px} .kd:first-of-type{border-top:0} .kd .d{flex:0 0 118px; font-weight:700; color:var(--berry)} .kd .in{flex:0 0 auto; font-size:12px; color:var(--sage-70); white-space:nowrap}
.menu h5{font-family:var(--body); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--berry); margin:12px 0 4px; font-weight:700} .menu ul{margin:0; padding-left:18px} .menu li{margin:3px 0}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px} .chip{border:1px solid var(--celadon); background:#fff; border-radius:99px; padding:6px 12px; cursor:pointer; font-size:13px} .chip[aria-pressed="true"]{background:var(--sage); color:#fff; border-color:var(--sage)}
.obj{border-left:4px solid var(--berry)} .obj .oh{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap} .obj .oh h3{flex:1 1 220px; margin:0}
.act{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; padding:11px 0; border-top:1px solid var(--mist)} .act .tt{font-weight:600} .act .meta{font-size:12.5px; color:var(--sage-70); display:flex; gap:10px; flex-wrap:wrap; margin-top:2px} .act .upd{grid-column:1/-1; font-size:13px; background:var(--bone); border-radius:6px; padding:6px 10px} .act .btns{display:flex; gap:6px; flex-wrap:wrap; align-self:start}
.act.done .tt{text-decoration:line-through; color:var(--sage-70)} .due.over{color:var(--red); font-weight:700} .due.soon{color:var(--attn); font-weight:700}
.field{margin:0 0 12px} .field label{display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--sage-70); margin:0 0 4px; font-weight:700} .field input,.field select,.field textarea{width:100%; min-height:42px; padding:8px 11px; border:1px solid var(--celadon); border-radius:8px; background:#fff; font-size:15px} .field textarea{min-height:84px; resize:vertical}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px} .three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px} @media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.checks{display:flex; gap:6px 14px; flex-wrap:wrap} .checks label{display:flex; gap:6px; align-items:center; font-size:14px; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:400; margin:0} .checks input{width:auto; min-height:0}
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.55); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto} .modal{background:#fff; border-radius:12px; box-shadow:var(--shadow); width:100%; max-width:560px; padding:20px 22px} .modal h3{font-size:24px; color:var(--berry); margin-bottom:10px}
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:8px; z-index:700; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw} .toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.empty{padding:40px 16px; text-align:center; color:var(--sage-70)} .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
@media(max-width:640px){ .pagehead h2{font-size:24px} .btn{min-height:44px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Christmas</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div id="gerr" style="color:var(--alert);font-size:13px;margin-top:10px"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Christmas 2026<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span></div></div></header>
  <nav class="tabs"><div class="tabsin" id="tabsin" role="tablist"></div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div id="modalroot"></div><div class="toast" id="toast" role="status"></div>
<script src="content.js?v=20261020"></script>
<script>
const CFG = { URL:"https://safcrtrfdzsnftghibot.supabase.co", KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { pre:{ events:null, id:"", data:null }, me:null, people:[], view:"", ts:null, tsTimer:null, day:null, plan:null, planFilter:"open", corp:null, decor:null, decorArea:"" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const TABS = [["events","Christmas events"],["dining","Festive dining"],["day","Christmas Day"],["preorders","Pre-orders"],["corporate","Corporate events"],["decorations","To Order"],["actions","Action plan"]];
const staffEmail = () => { try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } };
const money = n => { n = Number(n) || 0; return "£" + n.toLocaleString("en-GB", { minimumFractionDigits: Math.abs(n % 1) > 0.004 ? 2 : 0, maximumFractionDigits: 2 }); };
const londonToday = () => new Intl.DateTimeFormat("en-CA", { timeZone:"Europe/London", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
const dayNum = iso => Math.round(new Date(iso + "T12:00:00Z").getTime() / 864e5);
const daysTo = iso => dayNum(iso) - dayNum(londonToday());
const fmtDay = iso => { try { return new Date(String(iso).slice(0,10) + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"short", day:"numeric", month:"short" }); } catch(e){ return iso; } };
const fmtDayY = iso => { try { return new Date(String(iso).slice(0,10) + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return iso; } };
const fmtDT = iso => { try { return new Date(iso).toLocaleString("en-GB", { timeZone:"Europe/London", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).replace(",", ""); } catch(e){ return ""; } };
const inWords = iso => { const n = daysTo(iso); return n < 0 ? Math.abs(n) + " day" + (n === -1 ? "" : "s") + " ago" : n === 0 ? "today" : n === 1 ? "tomorrow" : "in " + n + " days"; };
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 5200 : 2400); }
async function post(fn, body){
  const r = await fetch(CFG.URL + "/functions/v1/" + fn, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.KEY, apikey:CFG.KEY }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const api = (action, p) => post("christmas-api", { action, staff_email: staffEmail(), ...(p || {}) });
const tsApi = (action, payload) => post("ticketsource-api", { action, payload:{ staff_email: staffEmail(), ...(payload || {}) } });
function openModal(html){ closeModal(); const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg"; bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); }); $("#modalroot").appendChild(bg); }
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); }
const canEdit = () => !!(S.me && S.me.edit);
const flagsHtml = tab => { const f = XMAS.flags.filter(x => x.tab === tab); return f.length ? `<div class="flags"><b>On the website: to put right (read ${esc(XMAS.checked)})</b><ul>${f.map(x => `<li>${esc(x.t)}</li>`).join("")}</ul></div>` : ""; };
const sourceNote = `<p class="tiny muted">From the website and the 2026 Christmas brochure, read ${esc(XMAS.checked)}. Prices are per person unless stated. Check the website for anything that has changed since.</p>`;
const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>`;
const siteLink = (path, text) => link(XMAS.site + path, text || "On the website");
const menuList = (sections) => `<div class="menu">${sections.map(s => `<h5>${esc(s.h)}</h5><ul>${s.i.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>`;

/* ====================================================================== events */
function keyDatesHtml(n){
  const up = XMAS.keyDates.filter(k => daysTo(k.d) >= 0).slice(0, n);
  return `<div class="card"><h3>Coming up</h3>${up.map(k => `<div class="kd"><span class="d">${esc(fmtDay(k.d))}</span><span style="flex:1">${esc(k.t)}</span><span class="in">${esc(inWords(k.d))}</span></div>`).join("") || `<p class="muted">Nothing left on the list.</p>`}</div>`;
}
function matchShow(e, dates){
  return (dates || []).filter(d => !d.cancelled && String(d.starts_at || "").slice(0, 10) === e.date && e.match.test(String(d.event_name || "")))[0] || null;
}
function showNumbers(d, e){
  if (!S.ts) return `<p class="small muted">Reading ticket sales…</p>`;
  if (S.ts.configured === false) return `<p class="small muted">Ticket numbers appear here once TicketSource is connected.</p>`;
  if (!d) return `<p class="small muted">Not found in the ticket sales yet (is the show on sale in TicketSource?).</p>`;
  const sold = Number(d.tickets_sold) || 0, cap = Number(d.capacity) || 0, pct = cap ? Math.min(100, Math.round(sold / cap * 100)) : 0;
  return `<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap"><div><div class="tile" style="box-shadow:none;padding:0;background:none"><div class="v">${sold}</div><div class="l">tickets sold</div></div></div>
    <div><div style="font-weight:700">${money(d.gross)}</div><div class="tiny muted">taken (${Number(d.bookings) || 0} booking${Number(d.bookings) === 1 ? "" : "s"})</div></div>
    ${cap ? `<div style="flex:1 1 160px"><div class="small"><b>${Math.max(0, cap - sold)}</b> left of ${cap}</div><div class="bar${pct >= 90 ? " warn" : ""}"><i style="width:${pct}%"></i></div></div>` : `<div class="tiny muted">No capacity set: add it in Ticket sales (Weddings and events) to see spaces left.</div>`}</div>`;
}
async function loadTs(view){
  clearTimeout(S.tsTimer);
  try {
    S.ts = await tsApi("tickets.list");
    if (S.view !== view) return;
    if (view === "events") renderEvents();
    if (S.ts.working) S.tsTimer = setTimeout(() => { if (S.view === view) loadTs(view); }, 8000);
  } catch(e){ if (S.view === view && view === "events") { S.ts = { configured:false, error:e.message, dates:[] }; renderEvents(); } }
}
function renderEvents(){
  const dates = (S.ts && S.ts.dates) || [], used = new Set();
  let sold = 0, taken = 0;
  const cards = XMAS.events.map(e => {
    const d = matchShow(e, dates); if (d) { used.add(d.date_id); sold += Number(d.tickets_sold) || 0; taken += Number(d.gross) || 0; }
    const past = daysTo(e.date) < 0;
    return `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3 style="margin:0">${esc(e.title)}</h3><div class="small"><b>${esc(fmtDay(e.date))}</b>, ${esc(e.time)} <span class="muted">· ${esc(inWords(e.date))}</span></div></div>${past ? `<span class="pill">Done</span>` : ""}</div>
      <p class="small" style="margin:8px 0">${esc(e.text)}</p>
      ${e.note ? `<p class="tiny muted" style="margin:0 0 8px">${esc(e.note)}</p>` : ""}
      ${showNumbers(d, e)}
      <div class="row small" style="margin-top:10px">${e.ticket ? link(e.ticket, "Tickets (TicketSource)") : ""}${e.page ? siteLink(e.page, "Website page") : ""}${e.menu ? link(XMAS.links[e.menu], "Food menu (PDF)") : ""}</div></div>`;
  }).join("");
  const other = dates.filter(d => !d.cancelled && !used.has(d.date_id) && /christmas|festive|wreath|party|nye|new year/i.test(String(d.event_name || "")) && !/christmas day/i.test(String(d.event_name || "")) && /^2026-1[12]/.test(String(d.starts_at || "").slice(0, 7)));
  const m = XMAS.market;
  $("#views").innerHTML = `<div class="pagehead"><h2>Christmas events</h2><span class="hint">Tickets sold come from TicketSource${S.ts && S.ts.finishedAt ? ", counted " + esc(fmtDT(S.ts.finishedAt)) : ""}${S.ts && S.ts.working ? " (updating…)" : ""}.</span><span class="spacer"></span><button class="btn ghost small" id="tsRefresh">Recount now</button></div>
    ${S.ts && S.ts.error ? `<div class="flags"><b>Ticket numbers</b>${esc(S.ts.error)}</div>` : ""}
    <div class="tiles"><div class="tile"><div class="v">${sold}</div><div class="l">tickets sold</div><div class="s">across the party nights and wreath making</div></div><div class="tile"><div class="v">${money(taken)}</div><div class="l">taken so far</div><div class="s">paid through TicketSource</div></div><div class="tile"><div class="v">${XMAS.events.length + 1}</div><div class="l">festive events</div><div class="s">plus Christmas Day dining</div></div></div>
    <div class="grid" style="margin-bottom:14px">${keyDatesHtml(6)}<div class="card"><h3>${esc(m.title)}</h3><div class="small"><b>${esc(fmtDay(m.date))}</b>, ${esc(m.time)} <span class="muted">· ${esc(inWords(m.date))}</span></div><p class="small" style="margin:8px 0 4px"><b>${esc(m.entry)}.</b> ${esc(m.text)}</p><p class="small" style="margin:0 0 8px">${esc(m.stall)}</p><div class="row small">${siteLink(m.page, "Event page")}${siteLink(m.apply, "Stallholder application")}</div></div></div>
    <div class="grid">${cards}</div>
    ${other.length ? `<div class="card" style="margin-top:14px"><h3>Other festive shows in TicketSource</h3>${other.map(d => `<div class="kd"><span class="d">${esc(fmtDay(d.starts_at))}</span><span style="flex:1">${esc(d.event_name)}</span><span>${Number(d.tickets_sold) || 0} sold · ${money(d.gross)}</span></div>`).join("")}</div>` : ""}
    ${flagsHtml("events")}${sourceNote}`;
  $("#tsRefresh").onclick = async () => { $("#tsRefresh").disabled = true; try { S.ts = await tsApi("tickets.refresh"); toast("Recounting. The numbers fill in over the next minute or two."); renderEvents(); loadTs("events"); } catch(e){ toast(e.message, true); $("#tsRefresh").disabled = false; } };
}
function viewEvents(){ S.ts = null; $("#views").innerHTML = `<div class="empty">Loading…</div>`; renderEvents(); loadTs("events"); }

/* ====================================================================== dining */
function viewDining(){
  const L = XMAS.links;
  $("#views").innerHTML = `<div class="pagehead"><h2>Festive dining</h2><span class="hint">What is on sale in the restaurant and bar this Christmas.</span></div>
    <div class="grid">${XMAS.dining.map(d => `<div class="card"><h3>${esc(d.title)}</h3><div class="small"><b>${esc(d.when)}</b></div>${d.price ? `<div style="margin:4px 0"><span class="pill gold">${esc(d.price)}</span></div>` : ""}<p class="small" style="margin:8px 0 0">${esc(d.text)}</p>
      ${Array.isArray(d.menu) ? `<div class="menu"><h5>Menu</h5><ul>${d.menu.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>` : ""}
      <div class="row small" style="margin-top:8px">${d.link ? link(L[d.link], "Menu (PDF)") : ""}${d.tab ? `<a href="#" data-goto="${d.tab}">Open the ${esc(TABS.find(t => t[0] === d.tab)[1])} tab</a>` : ""}</div></div>`).join("")}</div>

/* people on this action who work in the Marketing plan, when the action is not there and nobody has said no */
const mkAsk = a => (a.linked && (a.linked.marketing || a.linked.declined)) ? [] : (a.assignees || []).filter(e => e !== S.me.email && (S.people.find(p => p.email === e) || {}).marketing);

function renderActions(){

      }).join("")}</tbody></table></div></div>
      ${preDishes(d)}`;
  }
  $("#views").innerHTML = `<div class="pagehead"><h2>Pre-orders</h2><span class="hint">One page for each event: its own menu, deadline and emails.</span></div>${preEventCards()}${body}`;
  $$("[data-preev]").forEach(b => b.onclick = () => { if (b.dataset.preev !== S.pre.id) { S.pre.id = b.dataset.preev; S.pre.note = ""; loadPre(); } });
  $$("[data-copy]").forEach(b => b.onclick = () => { const v = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast("Link copied."), () => { window.prompt("Copy this link", v); }); });
  $$("[data-one]").forEach(b => b.onclick = () => preSend([b.dataset.one], b.dataset.rem === "1", b));
  $$("[data-act]").forEach(b => b.onclick = () => preAct(b.dataset.act, b));
}
async function preAct(act, btn){
  const d = S.pre.data; if (!d) return;
  if (act === "preview") return prePreview(d);
  if (act === "csv") return preCsv(d, btn);
  if (act === "test") {
    const to = ($("#preTo").value || "").trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { toast("Type your own email address first.", true); return; }
    btn.disabled = true;
    try { const r = await px("admin.send", { date_id: S.pre.id, booking_ids: [d.rows[0].booking_id], test_to: to }); const x = r.results[0]; if (x.ok) toast("Test sent to " + to + "."); else toast("The test did not go: " + x.error, true); } catch(e){ toast(e.message, true); }
    btn.disabled = false; return;
  }
  const rows = act === "invite" ? d.rows.filter(r => !r.invite_sent_at && r.email) : d.rows.filter(r => r.invite_sent_at && r.status !== "submitted" && r.email);
  if (!rows.length) return;
  const what = act === "invite" ? "invitation" : "reminder";
  if (!confirm("Send " + rows.length + " " + what + (rows.length === 1 ? "" : "s") + " for " + d.event.title + " now? Only this event's bookings will be emailed.")) return;
  preSend(rows.map(r => r.booking_id), act === "remind", btn);
}
async function preSend(ids, reminder, btn){
  if (btn) btn.disabled = true;
  let sent = 0; const bad = [];
  try {
    for (let i = 0; i < ids.length; i += 10) {
      const r = await px("admin.send", { date_id: S.pre.id, booking_ids: ids.slice(i, i + 10), reminder });
      for (const x of r.results || []) { if (x.ok) sent++; else bad.push(x.ref + ": " + x.error); }
      if (ids.length > 10) toast("Sent " + sent + " of " + ids.length + "…");
    }
  } catch(e){ bad.push(e.message); }
  S.pre.note = sent ? `Sent ${sent} ${reminder ? "reminder" : "invitation"}${sent === 1 ? "" : "s"}.` + (bad.length ? ` ${bad.length} did not go: ${bad.slice(0, 5).join("; ")}.` : "") : "";
  if (!sent && bad.length) toast("Nothing went: " + bad[0], true); else toast(S.pre.note);
  await loadPre();
}
async function prePreview(d){
  try {
    const first = d.rows[0]; const r = await px("admin.preview", { date_id: S.pre.id, booking_id: first.booking_id, reminder: false });
    openModal(`<h3 style="margin:0 0 4px">Email preview</h3><p class="small muted" style="margin:0 0 8px"><b>Subject:</b> ${esc(r.subject)}<br>Shown with the first booking's details (${esc(first.name)}).</p><iframe sandbox="" srcdoc="${esc(r.html)}" style="width:100%;height:520px;border:1px solid var(--mist);border-radius:8px;background:#fff"></iframe><div style="margin-top:12px;text-align:right"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  } catch(e){ toast(e.message, true); }
}
async function preCsv(d, btn){
  btn.disabled = true;
  try {
    const x = await px("admin.export", { date_id: S.pre.id }), e = d.event;
    const cell = v => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const time = t => (t === "none" ? "any time" : t || "");
    const cols = [["Booking ref", r => r.ref], ["Booked by", r => r.booked_by], ["Email", r => r.email], ["Table (linked bookings)", r => r.table], ["Guests at table", r => r.table_guests]]
      .concat(e.show_times ? [["Preferred time", r => time(r.preferred_time)]] : [])
      .concat([["Guest", r => r.guest], ["Type", r => r.kind], ["Name", r => r.name]])
      .concat(e.courses.map(c => [c[0].toUpperCase() + c.slice(1), r => r[c]]))
      .concat([["Pre-ordered", r => r.pre_ordered], ["Guest allergies", r => r.guest_dietary], ["Booking dietary", r => r.booking_dietary], ["Notes", r => r.notes]])
      .concat(e.show_under3 ? [["Under 3s", r => r.under3], ["High chairs", r => r.high_chairs]] : [])
      .concat([["Submitted", r => r.submitted]]);
    const csv = [cols.map(c => c[0])].concat((x.rows || []).map(r => cols.map(c => c[1](r)))).map(r => r.map(cell).join(",")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type:"text/csv" })); a.download = e.title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-preorders.csv";
    document.body.appendChild(a); a.click(); a.remove();
  } catch(e){ toast(e.message, true); }
  btn.disabled = false;
}

/* ====================================================================== shell */
const VIEWS = { events: viewEvents, dining: viewDining, day: viewDay, preorders: viewPreorders, corporate: viewCorporate, decorations: viewDecor, actions: viewActions };
function goView(v){
  clearTimeout(S.tsTimer); S.view = v;
  $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  window.scrollTo(0, 0); (VIEWS[v] || viewEvents)();
}
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="empty">Loading…</div>`;
  let d; try { d = await api("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.people = d.people; $("#whoname").textContent = S.me.name;
  const mine = TABS.filter(t => S.me.isAdmin || S.me.tabs.includes(t[0]));
  if (!mine.length) { $("#views").innerHTML = `<div class="empty">You do not have any tabs on Christmas yet. Ask the GM.</div>`; return; }
  $("#tabsin").innerHTML = mine.map(t => `<button class="tabbtn" role="tab" data-view="${t[0]}">${esc(t[1])}</button>`).join("");
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => goView(b.dataset.view)));
  goView(mine[0][0]);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else { $("#gate").hidden = false; } })();
</script>
