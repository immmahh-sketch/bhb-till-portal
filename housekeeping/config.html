<style>

  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1320px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.off{display:none!important}
a{color:var(--sage)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* gate + header */
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.78); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.tabbtn:focus-visible,.who button:focus-visible{outline:3px solid var(--gold); outline-offset:-3px}

/* controls */
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:42px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2}
.btn:hover{background:var(--sage-dark)} .btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#2b2415} .btn.gold:hover{background:#bb9657} .btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger:hover{background:var(--alert-bg)}
.btn.solid-danger{background:var(--red); border-color:var(--red); color:#fff} .btn.solid-danger:hover{background:var(--red-dark)}

.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px; min-height:36px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.chip i{font-style:normal; opacity:.75; margin-left:4px; font-size:12px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.empty{padding:36px 20px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:900; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.sechead{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:700; margin:22px 2px 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 8px}
.toolrow .sp{margin-left:auto}
.pagehead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 6px}
.pagehead h2{font-size:30px; color:var(--sage); line-height:1.1; margin-right:auto}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0}
.field label,.lbl{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)}
.field input,.field select,.field textarea,.ctl{border:1px solid var(--celadon); border-radius:8px; padding:9px 11px; background:#fff; width:100%; min-height:42px}
.field textarea{min-height:84px; resize:vertical}

.ferr{color:var(--red); font-size:12.5px; font-weight:600}
.hint{font-size:12.5px; color:var(--sage-70)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin:8px 0; font-size:14px}
.notice.bad{background:var(--red-bg); color:#6e1d17} .notice.good{background:var(--good-bg); color:var(--good)} .notice.info{background:var(--sage-10); color:var(--sage-dark)}
.notice b{font-weight:700}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* skeletons + spinner */
.sk{background:linear-gradient(90deg,#ececec 25%,#f7f7f7 50%,#ececec 75%); background-size:200% 100%; animation:shim 1.3s linear infinite; border-radius:6px}
@keyframes shim{to{background-position:-200% 0}}
.spin{width:22px; height:22px; border:3px solid var(--mist); border-top-color:var(--sage); border-radius:50%; animation:rot .9s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}

/* upload */

.drop{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:26px 18px; border:2px dashed var(--celadon); border-radius:var(--radius); margin:10px; cursor:pointer; background:#fcfdfb; transition:background .15s,border-color .15s}

.drop .dtitle{font-family:var(--display); font-size:30px; color:var(--sage); line-height:1.1}
.drop.compact{padding:14px 16px; flex-direction:row; flex-wrap:wrap; justify-content:center; gap:10px 16px}
.drop.compact .dtitle{font-size:22px}
.drop .dsub{font-size:14px; color:var(--sage-70); max-width:520px}
.drop-card .hint{padding:0 18px 12px; text-align:center}
.emptymsg{font-size:17px; font-family:var(--display); color:var(--sage); text-align:center; padding:18px 16px 0; font-weight:600}
.pvhead{display:flex; gap:12px; flex-wrap:wrap; align-items:baseline; justify-content:space-between}
.pvhead h3{font-size:26px; color:var(--sage)}
.counts{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0}
.counts span{background:var(--sage-10); border-radius:8px; padding:6px 12px; font-size:14px} .counts b{font-family:var(--display); font-size:22px; color:var(--sage); margin-right:6px}
.pv{border:1px solid var(--mist); border-radius:8px; overflow:hidden; margin-top:8px}
.pvrow{display:grid; grid-template-columns:70px 120px minmax(0,1.6fr) minmax(0,1fr); gap:4px 12px; padding:8px 12px; border-bottom:1px solid var(--mist); font-size:13.5px; align-items:start}

.pvrow.skip{color:var(--sage-70); background:#fafafa}
.pvrow b.rn{font-family:var(--display); font-size:22px; line-height:1; color:var(--sage)}
.pvrow > div{min-width:0; overflow-wrap:anywhere}
.pvscroll{max-height:460px; overflow:auto}
.pvnote{white-space:pre-line}

/* summary */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; min-width:0}
.stat .lbl{display:block}
.stat b{display:block; font-family:var(--display); font-size:34px; line-height:1.05; color:var(--sage); margin-top:2px}
.stat span.s{display:block; font-size:12.5px; color:var(--sage-70); line-height:1.3; margin-top:2px}
.daycard{display:grid; grid-template-columns:minmax(260px,320px) 1fr; gap:0 22px; align-items:start}
.daycard .two{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.by{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px}
.by li{background:var(--sage-10); border-radius:8px; padding:8px 12px; font-size:14px}
.by li b{font-weight:700}
.by li.un{background:var(--attention-bg); color:var(--attention-ink)}
.prog{font-size:15px; font-weight:600; color:var(--sage); margin:8px 2px 0}
.prog .bar{height:6px; border-radius:99px; background:var(--mist); margin-top:6px; overflow:hidden} .prog .bar i{display:block; height:100%; background:var(--gold)} .prog .bar i.ck{background:var(--sage)}

.rm.cl{border-left-color:var(--gold)} .rm.ck{border-left-color:var(--good)} .rm.gone{opacity:.62; border-left-style:dashed; border-left-color:#bdbdbd}
.rm > div{min-width:0}
.ml{display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--sage-70); margin-bottom:3px}
.rno{font-family:var(--display); font-size:34px; line-height:1; color:var(--sage); font-weight:700}
.rname{font-family:var(--display); font-size:22px; color:var(--ink); margin-left:6px}

.guest{font-size:14px; overflow-wrap:anywhere}

.guest.none{color:var(--sage-70)}
.rnote{font-size:13px; background:var(--attention-bg); color:var(--attention-ink); border-radius:6px; padding:6px 9px; margin-bottom:6px; white-space:pre-line; overflow-wrap:anywhere}
textarea.hknote{width:100%; min-height:60px; border:1px solid var(--celadon); border-radius:8px; padding:7px 9px; resize:vertical; font-size:14px; background:#fff}
.oth{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:7px; cursor:pointer; min-height:28px}

select.cs{width:100%; border:1px solid var(--celadon); border-radius:8px; padding:9px 10px; background:#fff; min-height:42px}
.stline{font-size:14.5px; font-weight:600}

.acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.sec{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px}
.sec>summary{cursor:pointer; padding:12px 18px; font-family:var(--display); font-size:22px; font-weight:600; color:var(--sage); list-style:none; display:flex; align-items:center; gap:10px}

@media (min-width:640px){

/* ------------------------------------------------------------- loading + auto refresh */
function applyData(d, quiet){
  S.today = d.today || S.today; S.date = d.date || S.date; S.day = d.day || null; S.tasks = d.tasks || []; S.plan = d.plan || null;
  S.cleaners = d.cleaners || []; S.all_staff = d.all_staff || []; S.planday = d.planday || {}; S.log = d.log || [];
  if (d.me) S.me = d.me;
  if (d.rooms) { S.rooms = d.rooms; if (!S.ui.roomsDirty) S.ui.roomsDraft = null; }
  if (!quiet) { S.loaded = true; S.loadErr = ""; S.ui.noteDirty = {}; S.ui.noteDraft = {}; S.ui.confirm = {}; S.ui.checkNote = {}; S.ui.other = {}; S.ui.dayDirty = false; renderToday(); }
  else {
    S.loaded = true; renderBar(); renderSummary(); renderDayForm(); renderBy(); renderBoardTop(); renderLog();
    if ($("#imp #drop") && !!$("#imp .emptymsg") === hasReport()) renderImp();
    patchList();
  }
  if (S.tab === "rooms") renderRooms();
}
function patchList(){
  const want = visibleTasks(), have = $$("#list .rm"), act = document.activeElement;
  const inList = !!(act && act.closest && act.closest("#list"));
  if (!S.tasks.length) { renderList(); return; }
  const same = want.length === have.length && want.every((t, i) => have[i].dataset.id === String(t.id));
  if (!same) { if (inList) { S.ui.stale = true; return; } renderList(); return; }
  let stale = false;
  want.forEach((t, i) => {
    const el = have[i]; if (el.dataset.sig === sigOf(t)) return;
    if (el.contains(act) || S.ui.confirm[t.id] || S.ui.noteDirty[t.id] || S.ui.checkNote[t.id]) { stale = true; return; }
    delete S.ui.other[t.id]; el.outerHTML = cardHtml(t);
  });
  S.ui.stale = stale;
}
async function load(quiet){
  const my = ++S.seq, asked = S.date, mut = S.mut;
  if (!quiet) { S.loaded = false; S.loadErr = ""; renderToday(); }
  try {
    const d = await call("config.bootstrap", asked ? { date:asked } : {});
    if (my !== S.seq) return;
    if (quiet && (S.mut !== mut || S.busy || asked !== S.date)) return;
    S.fetchedAt = Date.now(); S.refreshErr = false;
    applyData(d, quiet);
  } catch(e){
    if (my !== S.seq) return;
    if (quiet) { S.refreshErr = true; renderBar(); return; }
    S.loaded = false; S.loadErr = e.message; renderToday();
  }
}
function tick(){
  if (document.visibilityState !== "visible" || S.tab !== "today" || !S.me || S.ui.importing || S.ui.parsing) return;
  load(true);
}
setInterval(tick, 45000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.me && Date.now() - S.fetchedAt > 45000) tick(); });

async function guarded(fn, btn){

  try { return await fn(); }
  catch(e){ toast(e.message, true); if (btn && document.body.contains(btn)) btn.disabled = false; return null; }
  finally { S.busy--; }
}
function setTask(t){ if (!t) return; const i = S.tasks.findIndex(x => String(x.id) === String(t.id)); if (i >= 0) S.tasks[i] = t; else S.tasks.push(t); }

async function doImport(){
  const p = S.ui.parsed; if (!p || S.ui.importing) return;
  S.ui.importing = true; renderImp();
  const r = await guarded(() => call("report.import", { date:S.date, report_name:p.file || undefined, report_at:p.report_at || undefined, rooms:p.rows, roos:p.roos }));
  S.ui.importing = false;
  if (!r) { renderImp(); return; }
  S.tasks = r.tasks || S.tasks; S.plan = r.plan || S.plan; S.day = r.day || S.day; S.ui.parsed = null; S.ui.parseErr = ""; S.ui.noteDirty = {}; S.ui.noteDraft = {}; S.ui.confirm = {};
  S.ui.dayDirty = false; renderImp(); renderSummary(); renderDayForm(true); renderBy(); renderBoardTop(); renderList(); renderLog();
  toast(`Imported: ${r.added || 0} added, ${r.updated || 0} updated, ${r.unchanged || 0} unchanged${r.removed ? ", " + r.removed + " no longer on the report" : ""}${r.skipped ? ", " + r.skipped + " need no cleaning" : ""}.`);
  load(true);
}
async function saveNote(ta){
  const id = ta.dataset.note, t = S.tasks.find(x => String(x.id) === id); if (!t) return;
  const val = ta.value.trim();
  if (val === (t.note || "")) { delete S.ui.noteDirty[id]; return; }
  const r = await guarded(() => call("task.update", { id:t.id, note:val }));
  if (!r) return;
  delete S.ui.noteDirty[id]; delete S.ui.noteDraft[id];
  setTask(r.task || Object.assign({}, t, { note:val })); if (r.plan) S.plan = r.plan;
  const el = cardEl(id); if (el && r.task) el.dataset.sig = sigOf(r.task);
  toast("Note saved."); afterChange();
}
async function saveCleaner(sel){
  const id = sel.dataset.cs, t = S.tasks.find(x => String(x.id) === id); if (!t) return;
  const all = otherOn(t), list = all ? S.all_staff : S.cleaners, v = sel.value;
  let cleaner = null;
  if (v === "cur") return;
  if (v) {
    const c = list[+v.slice(1)]; if (!c) return;
    cleaner = { planday_id:c.planday_id ?? null, name:c.name, email:c.email || null, other:all && !S.cleaners.some(x => sameP(x, c)) };
  }
  const r = await guarded(() => call("task.update", { id:t.id, cleaner }), sel);
  if (!r) { keepFocus(() => { const el = cardEl(id); if (el) el.outerHTML = cardHtml(t); }); return; }
  sel.disabled = false; sel.focus({ preventScroll:true });
  setTask(r.task || Object.assign({}, t, { cleaner })); if (r.plan) S.plan = r.plan;
  const el = cardEl(id); if (el && r.task) el.dataset.sig = sigOf(r.task);
  toast(cleaner ? `Room ${t.room} assigned to ${cleaner.name}.` : `Room ${t.room} is unassigned.`); afterChange();
}
async function taskAction(act, id, btn){
  const t = S.tasks.find(x => String(x.id) === id); if (!t) return;
  const redraw = () => { renderList(); afterChange(); };
  if (act === "reopen-ask" || act === "remove-ask") { S.ui.confirm[t.id] = act === "reopen-ask" ? "reopen" : "remove"; const el = cardEl(id); if (el) { el.outerHTML = cardHtml(t); const n = cardEl(id).querySelector(".confirmbox button"); if (n) n.focus(); } return; }
  if (act === "confirm-cancel") { delete S.ui.confirm[t.id]; const el = cardEl(id); if (el) el.outerHTML = cardHtml(t); const n = cardEl(id) && cardEl(id).querySelector("[data-act$='-ask']"); if (n) n.focus(); return; }
  if (act === "check" || act === "uncheck") {
    const note = (S.ui.checkNote[t.id] || "").trim();
    const r = await guarded(() => call("task.check", { id:t.id, checked:act === "check", note:note || undefined }), btn);
    if (!r) return;
    delete S.ui.checkNote[t.id];
    setTask(r.task || Object.assign({}, t, act === "check" ? { checked_at:new Date().toISOString(), checked_by:S.me && S.me.name, check_note:note || null } : { checked_at:null, checked_by:null, check_note:null }));
    toast(act === "check" ? `Room ${t.room} checked.` : `Room ${t.room} is no longer marked as checked.`); keepFocus(redraw); return;
  }
  if (act === "reopen-yes") {
    const r = await guarded(() => call("task.reopen", { id:t.id }), btn);
    delete S.ui.confirm[t.id]; if (!r) { const el = cardEl(id); if (el) el.outerHTML = cardHtml(t); return; }
    setTask(r.task || Object.assign({}, t, { cleaned_at:null, cleaned_by:null, checked_at:null, checked_by:null, check_note:null }));
    toast(`Room ${t.room} sent back to the cleaner.`); redraw(); load(true); return;
  }
  if (act === "remove-yes") {
    const r = await guarded(() => call("task.remove", { id:t.id }), btn);
    delete S.ui.confirm[t.id]; if (!r) { const el = cardEl(id); if (el) el.outerHTML = cardHtml(t); return; }
    if (r.plan) S.plan = r.plan;
    if (!t.manual) t.gone = true; else S.tasks = S.tasks.filter(x => x !== t);
    toast(`Room ${t.room} removed.`); await load(true); redraw(); renderLog(); return;
  }
}
async function saveDay(){
  const start = $("#d_start").value, brk = $("#d_break").value.trim(), msg = $("#d_msg").value.trim(), err = $("#d_err");
  err.textContent = "";
  if (!/^\d{2}:\d{2}$/.test(start)) { err.textContent = "Enter the start time as hours and minutes, for example 09:00."; $("#d_start").focus(); return; }
  if (!/^\d+$/.test(brk) || +brk > 240) { err.textContent = "Break must be a whole number of minutes between 0 and 240."; $("#d_break").focus(); return; }
  const btn = $("#d_save");
  const r = await guarded(() => call("day.save", { date:S.date, message:msg, start_time:start, break_minutes:+brk }), btn);
  if (!r) return;
  btn.disabled = false; S.day = r.day || Object.assign({}, S.day, { message:msg, start_time:start, break_minutes:+brk }); if (r.plan) S.plan = r.plan; S.ui.dayDirty = false;
  renderSummary(); renderBy(); renderDayForm(true); toast("Saved.");
}
async function addRoom(){
  const room = $("#a_room").value, kind = $("#a_kind").value, note = $("#a_note").value.trim(), err = $("#a_err");
  err.textContent = "";
  if (!room) { err.textContent = "Choose a room to add."; $("#a_room").focus(); return; }
  const r = await guarded(() => call("task.add", { date:S.date, room, kind, note:note || undefined }), $("#a_go"));
  if (!r) return;
  if (r.task) setTask(r.task); if (r.plan) S.plan = r.plan;
  S.tasks.sort((a, b) => (S.rooms.findIndex(x => x.room === a.room) + 1 || 999) - (S.rooms.findIndex(x => x.room === b.room) + 1 || 999));
  S.ui.addOpen = false; renderAdd(); renderSummary(); renderBy(); renderBoardTop(); renderList(); renderDayForm();
  toast(`Room ${room} added.`);
}

/* ------------------------------------------------------------- rooms tab */
function roomsDraft(){
  if (!S.ui.roomsDraft) { S.ui.roomsDraft = S.rooms.map(r => Object.assign({}, r, { _key:r.room, _new:false })); S.ui.roomsDirty = false; S.ui.roomsErr = {}; }
  return S.ui.roomsDraft;
}
function renderRooms(force){
  const el = $("#v_rooms");
  if (!S.loaded) { el.innerHTML = `<div class="pagehead"><h2>Rooms</h2></div>${S.loadErr ? `<div class="card empty">${esc(S.loadErr)}<br><br><button class="btn" type="button" data-act="retry">Try again</button></div>` : skeletonBlock(3)}`; return; }
  if (!force && el.contains(document.activeElement) && el.firstChild) return;
  const d = roomsDraft(), E = S.ui.roomsErr;
  const f = (i, k, label, type, extra) => `<div><label class="ml" for="rf_${i}_${k}">${label}</label><input class="ctl" id="rf_${i}_${k}" data-fk="rf:${i}:${k}" data-ri="${i}" data-f="${k}" ${type}${extra || ""} aria-label="${label}, room ${esc(d[i].room || "new")}"${E[i + ":" + k] ? ' aria-invalid="true"' : ""}></div>`;
  el.innerHTML = `<div class="pagehead"><h2>Rooms</h2></div>
    <p class="muted" style="margin:4px 2px 10px">Cleaning time per room: 40 minutes unless set here; Rosemary and Huckleberry are 120.<br><span class="small">Stay over minutes are optional. Untick Active to hide a room from the Add a room list.</span></p>
    <div class="rrhead" aria-hidden="true"><div>Room</div><div>Name</div><div>Type</div><div>Minutes</div><div>Stay over minutes</div><div>Active</div></div>
    ${d.map((r, i) => `<div class="rr${r.active === false ? " inactive" : ""}" data-row="${i}">
      ${f(i, "room", "Room number", `value="${esc(r.room)}" maxlength="12"${r._new ? "" : " readonly"}`)}
      ${f(i, "name", "Name", `value="${esc(r.name || "")}" maxlength="60"`)}
      ${f(i, "room_type", "Type", `value="${esc(r.room_type || "")}" maxlength="40"`)}
      ${f(i, "minutes", "Minutes", `type="number" inputmode="numeric" min="1" max="600" value="${esc(r.minutes ?? "")}"`)}
      ${f(i, "stayover_minutes", "Stay over minutes", `type="number" inputmode="numeric" min="1" max="600" placeholder="Optional" value="${esc(r.stayover_minutes ?? "")}"`)}
      <div><span class="ml">Active</span><label class="actv"><input type="checkbox" data-ri="${i}" data-f="active" data-fk="rf:${i}:active"${r.active === false ? "" : " checked"}> Active</label></div>
      ${Object.keys(E).some(k => k.startsWith(i + ":")) ? `<div class="full ferr" role="alert">${esc(Object.keys(E).filter(k => k.startsWith(i + ":")).map(k => E[k]).join(" "))}</div>` : ""}
    </div>`).join("")}
    <div class="savebar"><button class="btn" type="button" data-act="rooms-save" id="rsave"${S.ui.roomsDirty ? "" : " disabled"}>Save</button><button class="btn ghost" type="button" data-act="rooms-add">Add a room</button><button class="btn ghost" type="button" data-act="rooms-discard"${S.ui.roomsDirty ? "" : " disabled"}>Discard changes</button><span class="muted small" id="rstate" role="status">${S.ui.roomsDirty ? "You have unsaved changes." : ""}</span></div>`;
}
async function saveRooms(){
  const d = roomsDraft(), E = {}; const seen = new Set();
  const out = d.map((r, i) => {
    const room = String(r.room || "").trim(), mins = Number(r.minutes), so = r.stayover_minutes === "" || r.stayover_minutes == null ? null : Number(r.stayover_minutes);
    if (!room) E[i + ":room"] = "Enter a room number."; else if (seen.has(room.toLowerCase())) E[i + ":room"] = `Room ${room} is listed twice.`; seen.add(room.toLowerCase());
    if (!Number.isInteger(mins) || mins < 1 || mins > 600) E[i + ":minutes"] = `Room ${room || "(new)"} needs whole minutes between 1 and 600.`;
    if (so !== null && (!Number.isInteger(so) || so < 1 || so > 600)) E[i + ":stayover_minutes"] = `Stay over minutes for room ${room || "(new)"} must be between 1 and 600, or left blank.`;
    return { room, name:String(r.name || "").trim() || room, room_type:String(r.room_type || "").trim() || null, minutes:mins, stayover_minutes:so, sort_order:r.sort_order, active:r.active !== false };
  });
  S.ui.roomsErr = E;
  if (Object.keys(E).length) { renderRooms(true); toast("Some rooms need fixing before saving.", true); const first = document.querySelector('#v_rooms [aria-invalid="true"]'); if (first) first.focus(); return; }
  const r = await guarded(() => call("rooms.save", { rooms:out }), $("#rsave"));
  if (!r) return;
  S.rooms = r.rooms || out; if (r.plan) S.plan = r.plan; S.ui.roomsDraft = null; S.ui.roomsDirty = false; S.ui.roomsErr = {};
  renderRooms(true); toast("Rooms saved."); load(true);
}

/* ------------------------------------------------------------- events */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === "refresh") { load(true).then(() => toast("Up to date.")); return; }
  if (a === "retry") { load(false); return; }
  if (a === "prev" || a === "next" || a === "todaybtn") { const d = a === "todaybtn" ? S.today : addDays(S.date || S.today, a === "prev" ? -1 : 1); if (d) changeDate(d); return; }
  if (a === "filter") { S.filter = b.dataset.k; renderBoardTop(); renderList(); const n = $$("#boardtop .chip").find(c => c.dataset.k === S.filter); if (n) n.focus(); return; }
  if (a === "addtoggle") { S.ui.addOpen = !S.ui.addOpen; S.ui.addErr = ""; renderBoardTop(); renderAdd(); if (S.ui.addOpen) { const s = $("#a_room"); if (s) s.focus(); } else { const n = $('#boardtop [data-act="addtoggle"]'); if (n) n.focus(); } return; }
  if (a === "import") { doImport(); return; }
  if (a === "impcancel") { S.ui.parsed = null; S.ui.parseErr = ""; renderImp(); return; }
  if (a === "switchdate") { const d = S.ui.parsed && S.ui.parsed.report_date; if (d) changeDate(d); return; }
  if (a === "rooms-save") { saveRooms(); return; }
  if (a === "rooms-discard") { S.ui.roomsDraft = null; S.ui.roomsDirty = false; S.ui.roomsErr = {}; renderRooms(true); return; }
  if (a === "rooms-add") {
    const d = roomsDraft(), max = d.reduce((m, r) => Math.max(m, +r.sort_order || 0), 0);
    d.push({ room:"", name:"", room_type:"", minutes:40, stayover_minutes:null, sort_order:max + 10, active:true, _new:true }); S.ui.roomsDirty = true; renderRooms(true);
    const n = document.getElementById("rf_" + (d.length - 1) + "_room"); if (n) { n.focus(); n.scrollIntoView({ block:"center" }); } return;
  }
  if (id !== undefined) taskAction(a, id, b);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "dform") saveDay();
  if (e.target.id === "addform") addRoom();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "datepick") { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) changeDate(t.value); else t.value = S.date; return; }
  if (t.id === "pdffile") { const f = t.files && t.files[0]; t.value = ""; handleFile(f); return; }
  if (t.dataset.cs !== undefined) { saveCleaner(t); return; }
  if (t.dataset.oth !== undefined) {
    const id = t.dataset.oth, task = S.tasks.find(x => String(x.id) === id); if (!task) return;
    S.ui.other[task.id] = t.checked;
    const sel = document.getElementById("cs_" + id); if (sel) { sel.innerHTML = cleanerOptions(task); if (t.checked && !task.cleaner) sel.focus(); }
    return;
  }
  if (t.dataset.ri !== undefined && t.type === "checkbox") { const d = roomsDraft(); d[+t.dataset.ri].active = t.checked; S.ui.roomsDirty = true; const row = t.closest(".rr"); if (row) row.classList.toggle("inactive", !t.checked); roomsDirtyUi(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.note !== undefined) { S.ui.noteDirty[t.dataset.note] = true; S.ui.noteDraft[t.dataset.note] = t.value; return; }
  if (t.dataset.cn !== undefined) { S.ui.checkNote[t.dataset.cn] = t.value; return; }
  if (t.hasAttribute("data-day")) { S.ui.dayDirty = true; return; }
  if (t.dataset.ri !== undefined && t.type !== "checkbox") {
    const d = roomsDraft(), r = d[+t.dataset.ri], k = t.dataset.f; r[k] = t.value; S.ui.roomsDirty = true;
    delete S.ui.roomsErr[t.dataset.ri + ":" + k]; t.removeAttribute("aria-invalid"); roomsDirtyUi();
  }
});
function roomsDirtyUi(){ const s = $("#rsave"), d = document.querySelector('[data-act="rooms-discard"]'), m = $("#rstate"); if (s) s.disabled = !S.ui.roomsDirty; if (d) d.disabled = !S.ui.roomsDirty; if (m) m.textContent = S.ui.roomsDirty ? "You have unsaved changes." : ""; }
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.note !== undefined) saveNote(t);
  if (S.ui.stale) setTimeout(() => { if (S.ui.stale && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#list"))) patchList(); }, 250);
});
document.addEventListener("toggle", e => { if (e.target.id === "logdet") S.ui.logOpen = e.target.open; }, true);
window.addEventListener("dragover", e => { if (!e.target.closest || !e.target.closest("#drop")) e.preventDefault(); });
window.addEventListener("drop", e => { if (!e.target.closest || !e.target.closest("#drop")) e.preventDefault(); });
function changeDate(d){
  if (!d || d === S.date) { renderBar(); return; }
  S.date = d; S.ui.addOpen = false; S.ui.parseErr = ""; S.ui.other = {}; load(false);
}
function setTab(name){
  S.tab = name === "rooms" ? "rooms" : "today";
  $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.tab ? "page" : "false"));
  $("#v_today").classList.toggle("off", S.tab !== "today"); $("#v_rooms").classList.toggle("off", S.tab !== "rooms");
  if (S.tab === "rooms") renderRooms(); else if (S.loaded) { renderBar(); }
  window.scrollTo(0, 0);
}
$$(".tabbtn").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.view === "rooms" ? "#/rooms" : "#/"; }));
window.addEventListener("hashchange", () => setTab(/^#\/rooms/.test(location.hash) ? "rooms" : "today"));

/* ------------------------------------------------------------- boot */
function openGate(msg){ $("#gate").style.display = "flex"; $("#app").classList.add("off"); if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").classList.remove("off");
  setTab(/^#\/rooms/.test(location.hash) ? "rooms" : "today");
  await load(false);
  if (S.me) $("#whoname").textContent = S.me.name || S.me.email || "";
}
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate(); })();
</script>
</body>
