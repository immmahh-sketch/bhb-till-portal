<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tell us about your visit — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28; --bone:#F8F8F8; --mist:#E3E3E3; --white:#fff; --ink:#262626; --olive:#CCCDB4; --brown:#3F2F28;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --attention-bg:#F7F0E4; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --radius:12px; --shadow:0 1px 2px rgba(38,38,38,.06),0 10px 30px rgba(38,38,38,.08);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
[hidden]{display:none !important}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0}
button,input,textarea{font:inherit; color:inherit}
header{background:var(--sage); color:var(--white); text-align:center; padding:24px 16px 20px; border-bottom:4px solid var(--olive)}
header img{display:block; margin:0 auto; width:230px; max-width:70%; height:auto}
main{max-width:680px; margin:0 auto; padding:22px 16px 60px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 22px; margin-bottom:16px}
h1{font-size:34px; color:var(--sage); line-height:1.1; margin-bottom:14px}
.open{white-space:pre-wrap}
.preview{background:var(--attention-bg); border:1px solid var(--olive); color:#6d5320; border-radius:10px; padding:10px 14px; font-size:14px; margin-bottom:14px}
.cat{font-family:var(--display); font-size:24px; color:var(--sage); margin:26px 0 8px}
.q{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:12px}
.q .ql{font-weight:600} .q .qh{font-size:13px; color:var(--sage-70); margin-top:2px}
.rate{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:10px}
.rate button,.nps button,.chips button,.na{border:1px solid var(--mist); background:var(--bone); border-radius:10px; cursor:pointer; min-height:48px}
.rate button{padding:8px 2px; font-size:12px; line-height:1.2} .rate button b{display:block; font-size:20px; color:var(--sage)}
.rate button:hover,.nps button:hover,.chips button:hover,.na:hover{background:var(--sage-10)}
.rate button[aria-pressed="true"],.nps button[aria-pressed="true"],.chips button[aria-pressed="true"],.na[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white)}
.rate button[aria-pressed="true"] b{color:var(--white)}
.na{margin-top:8px; padding:6px 14px; font-size:13px; min-height:38px}
.nps{display:grid; grid-template-columns:repeat(11,1fr); gap:4px; margin-top:10px} .nps button{padding:10px 0; font-size:16px}
.npslab{display:flex; justify-content:space-between; font-size:12px; color:var(--sage-70); margin-top:5px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px} .chips button{padding:10px 16px}
textarea,input[type=text],input[type=email]{width:100%; padding:12px 14px; border:1px solid var(--mist); border-radius:10px; background:var(--white); font-size:16px; margin-top:10px}
textarea{min-height:100px; resize:vertical}
label.f{display:block; font-weight:600}
.btn{display:inline-block; border:0; background:var(--sage); color:var(--white); border-radius:10px; padding:15px 26px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; cursor:pointer; text-decoration:none; min-height:50px}
.btn.alt{background:var(--white); color:var(--sage); border:2px solid var(--sage)}
.btn:disabled{opacity:.55}
.err{background:var(--alert-bg); color:var(--alert); border-radius:10px; padding:10px 14px; margin:12px 0; font-size:14px}
.thanks{text-align:center} .thanks h1{font-size:38px} .thanks p{white-space:pre-wrap; text-align:left}
.thanks .acts{display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:18px}
.progress{height:5px; background:var(--mist); border-radius:99px; overflow:hidden; margin:0 0 16px} .progress span{display:block; height:100%; background:var(--sage); width:0; transition:width .25s}
.foot{text-align:center; color:var(--sage-70); font-size:12.5px; margin-top:24px}
@media (max-width:520px){ h1{font-size:29px} .card,.q{padding:16px 14px} .nps{grid-template-columns:repeat(6,1fr)} .rate button{font-size:11px} }
</style>
</head>
<body>
<header><a href="https://www.blackhorsebeamish.co.uk" target="_blank" rel="noopener" style="display:inline-block"><img src="/app/logo-light.png" alt="Black Horse Beamish" width="230" height="68"></a></header>
<main id="main"><div class="card" style="text-align:center;color:var(--sage-70)">Loading…</div></main>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const params = new URLSearchParams(location.search), TOKEN = params.get("t") || "", KIND = params.get("kind") || (TOKEN ? "" : "guest");
const RATE = ["Poor","Fair","Good","Very good","Excellent"];
const S = { form:null, ans:{}, sent:false };
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/feedback-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, token:TOKEN || undefined, kind:KIND || undefined, ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || "Something went wrong. Please try again.");
  return d;
}
function para(t){ return esc(t); }
async function load(){
  try { S.form = await call("form.get"); } catch(e){ $("#main").innerHTML = `<div class="card"><h1>Sorry</h1><p>${esc(e.message)}</p></div>`; return; }
  if (S.form.already) { $("#main").innerHTML = `<div class="card thanks"><h1>${esc(S.form.title)}</h1><p style="text-align:center">${esc(S.form.message)}</p></div>`; return; }
  render();
}
const visible = q => !q.showIf || S.ans[q.showIf.id] === q.showIf.equals;      // a question that depends on an earlier answer (dined: Yes) shows only then
function render(){
  const f = S.form, qs = f.questions || [];
  document.title = f.title + " — Black Horse Beamish";
  let h = `${f.preview ? `<div class="preview"><b>Preview.</b> This is how the form looks. Nothing you enter is saved.</div>` : ""}
  <div class="card"><h1>${esc(f.title)}</h1><div class="open">${para(f.opening)}</div></div>
  <div class="progress"><span id="pgbar"></span></div>`;
  if (!f.guest_name) h += `<div class="q"><label class="f" for="gname">Your name <span style="font-weight:400;color:var(--sage-70)">(optional)</span></label><input type="text" id="gname" maxlength="100" autocomplete="name"></div>`;
  let cat = null;
  qs.forEach(q => {
    if (q.category && q.category !== cat) { cat = q.category; if (!["General","Comments","Recommend"].includes(cat) || qs.filter(x => x.category === cat).length > 1) h += `<div class="cat">${esc(cat)}</div>`; }
    h += `<div class="q" data-q="${esc(q.id)}"${visible(q) ? "" : ' style="display:none"'}><div class="ql">${esc(q.label)}${q.required ? "" : ' <span style="font-weight:400;color:var(--sage-70)">(optional)</span>'}</div>${q.hint ? `<div class="qh">${esc(q.hint)}</div>` : ""}`;
    if (q.type === "rating") h += `<div class="rate">${[1,2,3,4,5].map(n => `<button type="button" data-v="${n}" aria-pressed="false"><b>${n}</b>${RATE[n-1]}</button>`).join("")}</div>${q.na ? `<button type="button" class="na" data-na="1" aria-pressed="false">Not applicable / did not use</button>` : ""}`;
    else if (q.type === "nps") h += `<div class="nps">${Array.from({length:11}, (_,n) => `<button type="button" data-v="${n}" aria-pressed="false">${n}</button>`).join("")}</div><div class="npslab"><span>Not at all likely</span><span>Extremely likely</span></div>`;
    else if (q.type === "choice") h += `<div class="chips">${(q.options||[]).map(o => `<button type="button" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`;
    else h += `<textarea data-t="${esc(q.id)}" maxlength="3000" placeholder="Your comments"></textarea>`;
    h += `</div>`;
  });
  // a no-show who came from their own link: we already have their email, so there is no contact box
  if (!(f.kind === "noshow" && TOKEN)) h += `<div class="q"><label class="f" for="contact">Would you like us to get back to you? <span style="font-weight:400;color:var(--sage-70)">(optional)</span></label><div class="qh">Leave an email address or phone number. We will only use it to reply to this feedback.</div><input type="text" id="contact" maxlength="200" autocomplete="email"></div>`;
  h += `<div id="err" class="err" hidden></div><button class="btn" id="send">Send my feedback</button><div class="foot">Black Horse Beamish, Beamish, County Durham</div>`;
  $("#main").innerHTML = h;
  const bar = () => { const vq = qs.filter(q => visible(q) && q.required), done = vq.filter(q => S.ans[q.id] != null && S.ans[q.id] !== "").length; $("#pgbar").style.width = (vq.length ? done / vq.length * 100 : 100) + "%"; };
  const showHide = () => { qs.filter(q => q.showIf).forEach(q => { const el = document.querySelector(`.q[data-q="${q.id}"]`); if (!el) return; const on = visible(q); el.style.display = on ? "" : "none"; if (!on && S.ans[q.id] !== undefined) { delete S.ans[q.id]; el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false")); const t = el.querySelector("textarea"); if (t) t.value = ""; } }); };
  const mark = (q, root) => root.querySelectorAll("button").forEach(b => { const v = b.dataset.na ? "na" : b.dataset.o != null ? b.dataset.o : +b.dataset.v; b.setAttribute("aria-pressed", String(S.ans[q.id] === v)); });
  $$(".q[data-q]").forEach(el => {
    const q = qs.find(x => x.id === el.dataset.q);
    el.querySelectorAll("button").forEach(b => b.onclick = () => { const v = b.dataset.na ? "na" : b.dataset.o != null ? b.dataset.o : +b.dataset.v; S.ans[q.id] = S.ans[q.id] === v ? undefined : v; mark(q, el); showHide(); bar(); });
    const t = el.querySelector("textarea"); if (t) t.oninput = () => { S.ans[q.id] = t.value; bar(); };
  });
  $("#send").onclick = send;
}
async function send(){
  const f = S.form, qs = f.questions || [], err = $("#err"); err.hidden = true;
  const miss = qs.find(q => visible(q) && q.required && (q.type === "text" ? !String(S.ans[q.id] || "").trim() : (S.ans[q.id] == null || S.ans[q.id] === "")));
  if (miss) { err.textContent = "Please answer every question that is not marked optional."; err.hidden = false; document.querySelector(`[data-q="${miss.id}"]`).scrollIntoView({ block:"center", behavior:"smooth" }); return; }
  const b = $("#send"); b.disabled = true; b.textContent = "Sending…";
  try {
    const r = await call("form.submit", { answers:S.ans, contact:$("#contact") ? $("#contact").value : "", guest_name:$("#gname") ? $("#gname").value : "" });
    done(r);
  } catch(e){ err.textContent = e.message; err.hidden = false; b.disabled = false; b.textContent = "Send my feedback"; }
}
function done(r){
  let h = `<div class="card thanks"><h1>Thank you</h1><p>${esc(r.message || r.thanks)}</p><div class="acts">`;
  if (r.review_url) h += `<a class="btn" href="${esc(r.review_url)}" target="_blank" rel="noopener">Share your experience on TripAdvisor</a>`;
  if (r.google_url) h += `<a class="btn alt" href="${esc(r.google_url)}" target="_blank" rel="noopener">Or review us on Google</a>`;
  h += `</div></div>`;
  if (r.response_id) h += `<div class="q" id="late"><label class="f" for="lc">Would you like someone to contact you?</label><div class="qh">Leave an email address or phone number and a manager will get in touch.</div><input type="text" id="lc" maxlength="200"><div id="lerr" class="err" hidden></div><button class="btn" id="lsend" style="margin-top:12px">Send my details</button></div>`;
  $("#main").innerHTML = h; window.scrollTo(0, 0);
  if (r.response_id) $("#lsend").onclick = async () => {
    const e = $("#lerr"); e.hidden = true; const b = $("#lsend"); b.disabled = true;
    try { await call("form.contact", { response_id:r.response_id, contact:$("#lc").value }); $("#late").innerHTML = `<div class="ql">Thank you. We will be in touch.</div>`; }
    catch(x){ e.textContent = x.message; e.hidden = false; b.disabled = false; }
  };
}
load();
</script>
</body>
</html>
