<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Lunch — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28;
  --bone:#F8F8F8; --celadon:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --olive:#CCCDB4; --brown:#3F2F28;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:900px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--olive)}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:24px 0 16px}
.pagehead h2{font-size:26px; color:var(--sage)}
.pagehead .hint{font-size:13px; color:var(--sage-70)}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); border-color:var(--alert); color:var(--alert)}
.btn:disabled{opacity:.5; cursor:default}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:12px}
.field{margin-bottom:14px} .field label.l{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input[type=text],.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:90px; resize:vertical}
.notice{border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; font-size:15px}
.notice.bad{background:var(--alert-bg); color:var(--alert); border:1px solid #E5C9C4}
.notice.warn{background:var(--attention-bg); color:#6d5320; border:1px solid #E8D9BC}
.notice.good{background:var(--good-bg); color:var(--good); border:1px solid #CFE0CF}
.notice b{display:block; font-family:var(--display); font-size:21px; margin-bottom:4px}
.choice{display:flex; gap:14px; align-items:flex-start; border:2px solid var(--mist); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer; background:var(--white)}
.choice:hover{background:var(--sage-10)}
.choice.on{border-color:var(--sage); background:var(--sage-10)}
.choice input[type=radio]{width:22px; height:22px; margin:3px 0 0; accent-color:var(--sage); flex:none}
.choice .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.choice .v{font-family:var(--display); font-size:22px; color:var(--sage); line-height:1.2}
.choice .extra{margin-top:8px}
.choice .extra input{width:100%; padding:10px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
.testbox{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sage-70); margin:6px 0 14px}
.sum{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:6px}
.sum .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.sum .v{font-size:16px}
/* weekly menu */
.week{margin-bottom:22px}
.week h3{font-size:20px; color:var(--sage); margin:0 0 8px}
.day{display:grid; grid-template-columns:110px minmax(180px,1.3fr) auto minmax(150px,1fr) 62px; gap:10px 14px; align-items:center; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px 14px; margin-bottom:8px}
.day.today{outline:2px solid var(--celadon)}
.day.past{opacity:.55}
.day .d b{display:block; font-family:var(--display); font-size:19px; color:var(--sage); line-height:1.1}
.day .d span{font-size:12px; color:var(--sage-70)}
.day select,.day input[type=text]{width:100%; padding:9px 10px; border:1px solid var(--mist); border-radius:8px; font-size:15px; background:var(--white); min-height:40px}
.day .ticks{display:flex; gap:14px; flex-wrap:wrap}
.day .ticks label{display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer; white-space:nowrap}
.day .ticks input{width:20px; height:20px; accent-color:var(--sage)}
.day .soupbox[hidden]{display:none}
.day .st{font-size:12px; color:var(--good); text-align:right}
.day .st.bad{color:var(--alert)}
@media (max-width:760px){ .day{grid-template-columns:1fr 1fr} .day .d{grid-column:1/-1} .day .dsel{grid-column:1/-1} .day .soupbox{grid-column:1/-1} .day .st{grid-column:1/-1; text-align:left} }
/* dish bank */
.bank{display:flex; flex-direction:column; gap:6px}
.dish{display:flex; gap:10px; align-items:center; background:var(--white); border-radius:8px; box-shadow:var(--shadow); padding:8px 12px}
.dish .n{flex:1; min-width:0; overflow-wrap:anywhere}
.dish input[type=text]{flex:1; min-width:0; padding:8px 10px; border:1px solid var(--mist); border-radius:8px; font-size:15px}
.row2{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.row2 .field{flex:1; min-width:220px; margin:0}
.big{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; margin-bottom:14px}
.make{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; border-left:5px solid var(--sage)}
.make .k{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.make .n{font-family:var(--display); font-size:34px; line-height:1; color:var(--sage)}
.make .w{font-size:16px; margin-top:4px; overflow-wrap:anywhere}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{background:var(--white); border-radius:999px; box-shadow:var(--shadow); padding:6px 14px; font-size:13px}
.chip b{font-family:var(--display); font-size:17px; color:var(--sage)}
.ord{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 16px; margin-bottom:8px; display:grid; grid-template-columns:170px 1fr auto; gap:6px 16px; align-items:start}
.ord .who2{font-family:var(--display); font-size:20px; color:var(--sage); line-height:1.15}
.ord .t{font-size:12px; color:var(--sage-70)}
.ord .what b{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:600; margin-right:6px}
.ord .msg{margin-top:4px; padding:6px 10px; background:var(--attention-bg); border-radius:6px; font-size:14px}
.badge{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; background:var(--sage-10); color:var(--sage)}
.badge.wait{background:var(--attention-bg); color:#6d5320} .badge.done{background:var(--good-bg); color:var(--good)} .badge.test{background:var(--alert-bg); color:var(--alert)}
@media (max-width:640px){ .ord{grid-template-columns:1fr} }
.muted{color:var(--sage-70)} .empty{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px} .pagehead h2{font-size:22px} .btn{width:100%} .btn.small{width:auto} .dish .btn{width:auto} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Staff Lunch</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Staff Lunch<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist" id="tabs"></div></nav>
  <div class="shell"><div id="views"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { me:null, view:"order", dishes:[], days:[], today:"", order:null, pick:"", test:false, filter:"" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const minusMins = (t, m) => { const [h, mi] = t.split(":").map(Number), x = h * 60 + mi - m; return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };
const timeLabel = t => !t ? "Any time, 11:30am to 12:30pm" : t === "asap" ? "As soon as possible" : clock12(t);
const clock12 = t => { const [h, m] = String(t).split(":").map(Number); return (h > 12 ? h - 12 : h) + ":" + String(m).padStart(2, "0") + (h >= 12 ? "pm" : "am"); };
const longDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" });
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/staff-lunch-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

/* ------------------------------------------------------------- Order lunch */
async function viewOrder(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  let d; try { d = await call("order.status", { test: S.test }); } catch(e){ v.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  const head = `<div class="pagehead"><h2>Order lunch</h2><span class="hint">${esc(longDay(d.today))} · ${esc(clock12(d.time))}</span></div>`;
  const testBox = S.me.admin ? `<label class="testbox"><input type="checkbox" id="testmode" ${S.test ? "checked" : ""}> Test order (any time, no rota check, prints with a TEST banner)</label>` : "";
  let body = "";
  if (d.state === "ordered") {
    const o = d.order;
    body = `<div class="notice good"><b>Your lunch is ordered</b>The kitchen has your order for today.</div>
      <div class="card"><div class="sum">
        <div><div class="k">${o.choice === "soup" ? "Soup" : o.choice === "sandwich" ? "Sandwich" : "Main dish"}</div><div class="v">${esc(o.item)}</div></div>
        <div><div class="k">Time</div><div class="v">${esc(timeLabel(o.requested_time))}</div></div>
        ${o.message ? `<div><div class="k">Message to the kitchen</div><div class="v">${esc(o.message)}</div></div>` : ""}
      </div>${o.requested_time && o.requested_time !== "asap" && !o.print_queued_at ? `<p style="margin:14px 0 0;font-size:14px">Your order is saved. It goes to the kitchen at <b>${esc(clock12(minusMins(o.requested_time, d.lead || 15)))}</b>, ${d.lead || 15} minutes before your time.</p>` : ""}<p class="muted" style="margin:14px 0 0;font-size:13px">To change or cancel your order, please speak to the kitchen.</p></div>`;
  } else if (d.state === "closed") {
    body = `<div class="notice warn"><b>Lunch orders are closed</b>${esc(d.message)}</div>`;
  } else if (d.state === "not_eligible") {
    body = `<div class="notice bad"><b>You can't order lunch today</b>${esc(d.message)}</div>`;
  } else if (d.state === "unchecked") {
    body = `<div class="notice warn"><b>Couldn't check the rota</b>${esc(d.message)}</div><button class="btn ghost" id="retry">Try again</button>`;
  } else if (d.state === "no_menu") {
    body = `<div class="notice warn"><b>No menu yet</b>${esc(d.message)}</div>`;
  } else {
    const m = d.menu;
    const opts = [];
    if (m.main) opts.push(`<label class="choice" data-c="main"><input type="radio" name="c" value="main"><div><div class="k">Main dish</div><div class="v">${esc(m.main)}</div></div></label>`);
    if (m.soup) opts.push(`<label class="choice" data-c="soup"><input type="radio" name="c" value="soup"><div><div class="k">Soup</div><div class="v">${esc(m.soup_name || "Soup of the day")}</div></div></label>`);
    if (m.sandwiches) opts.push(`<label class="choice" data-c="sandwich"><input type="radio" name="c" value="sandwich"><div style="flex:1"><div class="k">Sandwiches</div><div class="v">What sandwich would you like?</div><div class="extra"><input type="text" id="sand" maxlength="150" placeholder="Type the sandwich you would like"></div></div></label>`);
    body = `${d.shift ? `<p class="muted" style="margin:0 0 12px">Your shift today: ${esc(d.shift)}</p>` : ""}
      <div class="card"><h3>What would you like?</h3>${opts.join("")}</div>
      <div class="card">
        <div class="field"><label class="l" for="rt">Request a time</label><div class="muted" style="font-size:13px;margin-bottom:6px">Pick a time more than 15 minutes away and your order is saved, then sent to the kitchen 15 minutes before it.</div><select id="rt"><option value="">Any time, 11:30am to 12:30pm</option><option value="asap">As soon as possible</option>${d.times.map(t => `<option value="${esc(t)}">${esc(clock12(t))}</option>`).join("")}</select></div>
        <div class="field" style="margin-bottom:0"><label class="l" for="msg">Message to the kitchen</label><textarea id="msg" maxlength="300" placeholder="Allergies, no butter, anything the kitchen should know"></textarea></div>
      </div>
      ${testBox}
      <button class="btn" id="place">Place my order</button>`;
  }
  v.innerHTML = head + (d.state === "can_order" ? "" : testBox) + body;
  const tb = $("#testmode"); if (tb) tb.addEventListener("change", () => { S.test = tb.checked; viewOrder(); });
  const rt = $("#retry"); if (rt) rt.addEventListener("click", viewOrder);
  $$(".choice").forEach(c => c.addEventListener("click", () => {
    const r = c.querySelector("input[type=radio]"); r.checked = true;
    $$(".choice").forEach(x => x.classList.toggle("on", x === c));
    if (c.dataset.c === "sandwich") { const s = $("#sand"); if (s && document.activeElement !== s) s.focus(); }
  }));
  const place = $("#place");
  if (place) place.addEventListener("click", async () => {
    const sel = $("input[name=c]:checked");
    if (!sel) return toast("Choose the main dish, the soup or a sandwich.", true);
    place.disabled = true;
    try {
      await call("order.place", { choice: sel.value, sandwich: $("#sand") ? $("#sand").value : "", requested_time: $("#rt").value, message: $("#msg").value, test: S.test });
      toast("Lunch ordered"); viewOrder();
    } catch(e){ toast(e.message, true); place.disabled = false; }
  });
}

/* ------------------------------------------------------------- Weekly Menu */
const dow = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"long" });
const dm = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", day:"numeric", month:"short" });
const weekLabel = (i, first) => i === 0 ? `This week · w/c ${dm(first)}` : i === 1 ? `Next week · w/c ${dm(first)}` : `Week commencing ${dm(first)}`;
async function viewMenu(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  let d; try { d = await call("menu.get"); } catch(e){ v.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  S.days = d.days; S.dishes = d.dishes; S.today = d.today;
  let h = `<div class="pagehead"><h2>Weekly Menu</h2><span class="hint">The next four weeks, this week included. Changes save as you make them.</span></div>`;
  if (!S.dishes.length) h += `<div class="notice warn"><b>The dish bank is empty</b>Add dishes on the Menu Upload tab, then choose them here.</div>`;
  for (let w = 0; w < 4; w++) {
    const wk = S.days.slice(w * 7, w * 7 + 7);
    h += `<div class="week"><h3>${esc(weekLabel(w, wk[0].date))}</h3>${wk.map(dayRow).join("")}</div>`;
  }
  v.innerHTML = h;
  $$(".day").forEach(row => {
    if (row.classList.contains("past")) return;
    const save = () => saveDay(row);
    row.querySelector("select").addEventListener("change", save);
    row.querySelector(".t-sand").addEventListener("change", save);
    row.querySelector(".t-soup").addEventListener("change", () => { const on = row.querySelector(".t-soup").checked; row.querySelector(".soupbox").hidden = !on; if (on) row.querySelector(".soupname").focus(); else save(); });
    row.querySelector(".soupname").addEventListener("change", save);
  });
}
function dayRow(r){
  const dis = r.past ? "disabled" : "";
  const known = S.dishes.some(x => x.id === r.dish_id);
  const opts = `<option value="">No main dish</option>` + S.dishes.map(x => `<option value="${esc(x.id)}" ${x.id === r.dish_id ? "selected" : ""}>${esc(x.name)}</option>`).join("")
    + (r.dish_id && !known ? `<option value="${esc(r.dish_id)}" selected>${esc(r.dish_name || "(removed dish)")}</option>` : "");
  return `<div class="day ${r.past ? "past" : ""} ${r.date === S.today ? "today" : ""}" data-date="${esc(r.date)}">
    <div class="d"><b>${esc(dow(r.date))}</b><span>${esc(dm(r.date))}${r.date === S.today ? " · today" : ""}</span></div>
    <div class="dsel"><select ${dis} aria-label="Main dish for ${esc(dow(r.date))} ${esc(dm(r.date))}">${opts}</select></div>
    <div class="ticks"><label><input type="checkbox" class="t-sand" ${r.sandwiches ? "checked" : ""} ${dis}> Sandwiches available</label><label><input type="checkbox" class="t-soup" ${r.soup ? "checked" : ""} ${dis}> Soup available</label></div>
    <div class="soupbox" ${r.soup ? "" : "hidden"}><input type="text" class="soupname" maxlength="120" placeholder="What is the soup?" value="${esc(r.soup_name)}" ${dis}></div>
    <div class="st"></div></div>`;
}
async function saveDay(row){
  const st = row.querySelector(".st"), soup = row.querySelector(".t-soup").checked, name = row.querySelector(".soupname").value.trim();
  if (soup && !name) { st.className = "st bad"; st.textContent = "Say what the soup is"; return; }
  st.className = "st"; st.textContent = "Saving…";
  try {
    await call("menu.set", { date: row.dataset.date, dish_id: row.querySelector("select").value || null, sandwiches: row.querySelector(".t-sand").checked, soup, soup_name: name });
    st.textContent = "Saved ✓"; setTimeout(() => { if (st.textContent === "Saved ✓") st.textContent = ""; }, 2500);
  } catch(e){ st.className = "st bad"; st.textContent = e.message; toast(e.message, true); }
}

/* ------------------------------------------------------------- Menu Upload (the dish bank) */
async function viewUpload(){
  const v = $("#views"); v.innerHTML = `<div class="loading">Loading…</div>`;
  try { S.dishes = (await call("dishes.list")).dishes; } catch(e){ v.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  v.innerHTML = `<div class="pagehead"><h2>Menu Upload</h2><span class="hint">The bank of dishes you choose from on the Weekly Menu.</span></div>
    <div class="card"><h3>Add a dish</h3>
      <div class="row2"><div class="field"><label class="l" for="one">Dish name</label><input type="text" id="one" maxlength="120" placeholder="e.g. Steak and ale pie with mash"></div><button class="btn" id="addone">Add dish</button></div>
    </div>
    <div class="card"><h3>Add a whole list</h3>
      <div class="field"><label class="l" for="many">One dish on each line (paste from a spreadsheet or document)</label><textarea id="many" style="min-height:140px" placeholder="Chicken and leek pie&#10;Beef lasagne&#10;Vegetable curry"></textarea></div>
      <button class="btn" id="addmany">Add all of these</button>
    </div>
    <div class="pagehead" style="margin-top:28px"><h2 style="font-size:22px">The bank <span class="muted" id="count" style="font-size:16px"></span></h2></div>
    <div class="field"><input type="text" id="find" placeholder="Search the bank" value="${esc(S.filter)}"></div>
    <div class="bank" id="bank"></div>`;
  $("#addone").addEventListener("click", () => addDishes($("#one").value, "#one"));
  $("#one").addEventListener("keydown", e => { if (e.key === "Enter") addDishes($("#one").value, "#one"); });
  $("#addmany").addEventListener("click", () => addDishes($("#many").value, "#many"));
  $("#find").addEventListener("input", e => { S.filter = e.target.value; renderBank(); });
  renderBank();
}
function renderBank(){
  const f = S.filter.trim().toLowerCase();
  const list = S.dishes.filter(d => !f || d.name.toLowerCase().includes(f));
  $("#count").textContent = `(${S.dishes.length} dish${S.dishes.length === 1 ? "" : "es"})`;
  $("#bank").innerHTML = list.length ? list.map(d => `<div class="dish" data-id="${esc(d.id)}"><span class="n">${esc(d.name)}</span><button class="btn ghost small" data-act="rename">Rename</button><button class="btn danger small" data-act="remove">Remove</button></div>`).join("")
    : `<div class="empty">${S.dishes.length ? "No dish matches that." : "No dishes yet. Add some above."}</div>`;
  $$("#bank .dish").forEach(row => row.addEventListener("click", e => {
    const act = e.target.dataset && e.target.dataset.act; if (!act) return;
    const dish = S.dishes.find(x => x.id === row.dataset.id);
    if (act === "rename") renameDish(row, dish); else removeDish(dish);
  }));
}
async function addDishes(text, sel){
  if (!String(text).trim()) return toast("Type a dish name, or paste a list.", true);
  try {
    const d = await call("dishes.add", { names: text });
    S.dishes = d.dishes; $(sel).value = "";
    toast(`${d.added} added${d.skipped.length ? `, ${d.skipped.length} already in the bank` : ""}`); renderBank();
  } catch(e){ toast(e.message, true); }
}
function renameDish(row, dish){
  row.innerHTML = `<input type="text" maxlength="120" value="${esc(dish.name)}"><button class="btn small" data-act="save">Save</button><button class="btn ghost small" data-act="cancel">Cancel</button>`;
  const input = row.querySelector("input"); input.focus(); input.select();
  const save = async () => { try { S.dishes = (await call("dishes.update", { id: dish.id, name: input.value, notes: dish.notes })).dishes; toast("Renamed"); renderBank(); } catch(e){ toast(e.message, true); } };
  row.addEventListener("click", e => { const a = e.target.dataset && e.target.dataset.act; if (a === "save") save(); if (a === "cancel") renderBank(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter") save(); if (e.key === "Escape") renderBank(); });
}
async function removeDish(dish){
  try {
    let d = await call("dishes.remove", { id: dish.id });
    if (d.needs_confirm) {
      if (!confirm(`"${dish.name}" is on the menu for ${d.days.length} day${d.days.length === 1 ? "" : "s"} still to come. Remove it from the bank and from those days?`)) return;
      d = await call("dishes.remove", { id: dish.id, force: true });
    }
    S.dishes = d.dishes; toast("Removed"); renderBank();
  } catch(e){ toast(e.message, true); }
}

/* ------------------------------------------------------------- Chef's tab */
const slotName = k => k === "any" ? "Any time" : k === "asap" ? "As soon as possible" : clock12(k);
const slotRank = k => k === "asap" ? "00" : k === "any" ? "01" : k;
const kindName = c => c === "soup" ? "Soup" : c === "sandwich" ? "Sandwich" : "Main dish";
async function viewChefs(date){
  const v = $("#views");
  const keep = date || (v.querySelector("#cday") ? v.querySelector("#cday").value : "");
  if (!$("#cday")) v.innerHTML = `<div class="loading">Loading…</div>`;
  let d; try { d = await call("chefs.day", { date: keep || undefined }); } catch(e){ v.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  const isToday = d.date === d.today;
  const order = d.orders.slice().sort((a, b) => {
    const ka = slotRank(a.requested_time || "any"), kb = slotRank(b.requested_time || "any");
    return ka < kb ? -1 : ka > kb ? 1 : String(a.created_at).localeCompare(String(b.created_at));
  });
  const make = d.totals.map(t => `<div class="make"><div class="k">${kindName(t.choice)}</div><div class="n">${t.count}</div><div class="w">${esc(t.item)}</div></div>`).join("");
  const chips = Object.keys(d.slots).sort((a, b) => slotRank(a) < slotRank(b) ? -1 : 1).map(k => `<span class="chip"><b>${d.slots[k]}</b> ${esc(slotName(k))}</span>`).join("");
  const state = o => o.is_test ? `<span class="badge test">Test</span> ` : "";
  const prn = o => o.print === "waiting" ? `<span class="badge wait">Prints at ${esc(clock12(o.prints_at))}</span>` : o.print === "printed" ? `<span class="badge done">Printed</span>` : `<span class="badge">Sent to printer</span>`;
  v.innerHTML = `<div class="pagehead"><h2>Chef's</h2><span class="hint">${esc(longDay(d.date))}${isToday ? " · today" : ""} · updates every 30 seconds</span></div>
    <div class="row2" style="margin-bottom:16px"><div class="field"><label class="l" for="cday">Day</label><input type="date" id="cday" value="${esc(d.date)}" style="width:100%;padding:10px 12px;border:1px solid var(--mist);border-radius:8px;font-size:16px;background:var(--white)"></div><button class="btn ghost" id="cnow">Refresh</button></div>
    ${d.total ? `<h3 style="color:var(--sage);font-size:20px;margin:0 0 8px">How much to make · ${d.total} order${d.total === 1 ? "" : "s"}</h3><div class="big">${make}</div><div class="chips">${chips}</div>` : `<div class="notice warn"><b>No orders yet</b>Nothing has been ordered for ${esc(longDay(d.date))}.</div>`}
    ${order.length ? `<h3 style="color:var(--sage);font-size:20px;margin:18px 0 8px">The orders</h3>` + order.map(o => `<div class="ord"><div><div class="who2">${esc(o.person_name)}</div><div class="t">${esc(timeLabel(o.requested_time))}</div></div>
      <div class="what"><b>${kindName(o.choice)}</b>${esc(o.item)}${o.message ? `<div class="msg">${esc(o.message)}</div>` : ""}</div><div>${state(o)}${prn(o)}</div></div>`).join("") : ""}`;
  $("#cday").addEventListener("change", e => viewChefs(e.target.value));
  $("#cnow").addEventListener("click", () => viewChefs());
  clearInterval(S.chefTimer);
  S.chefTimer = setInterval(() => { if (S.view === "chefs" && !document.hidden) viewChefs(); }, 30000);
}

/* ------------------------------------------------------------- shell */
const TABS = [["order", "Order lunch", m => m.canOrder], ["chefs", "Chef's", m => m.canChefs], ["menu", "Weekly Menu", m => m.canSetMenu], ["upload", "Menu Upload", m => m.canSetMenu]];
function goView(v){
  S.view = v;
  $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false"));
  clearInterval(S.chefTimer); if (v === "menu") viewMenu(); else if (v === "upload") viewUpload(); else if (v === "chefs") viewChefs(); else viewOrder();
  window.scrollTo(0, 0);
}
function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", ()=>{ try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; $("#whoname").textContent = S.me.name;
  const tabs = TABS.filter(t => t[2](S.me));
  $("#tabs").innerHTML = tabs.map(t => `<button class="tabbtn" data-view="${t[0]}">${t[1]}</button>`).join("");
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => goView(b.dataset.view)));
  if (!tabs.length) { $("#views").innerHTML = `<div class="empty">You don't have any Staff Lunch tabs yet.</div>`; return; }
  goView(tabs[0][0]);
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
</body>
