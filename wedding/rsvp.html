<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E5F4F">
<meta name="robots" content="noindex,nofollow">
<title>Reply to your invitation — Black Horse Beamish</title>

<!--
  The guest-facing RSVP page.

  Reached from the invitation email as rsvp.html?r=<32-hex token>. Guests
  have no login and never will — that token is the whole credential, and
  it only ever reaches wedding-rsvp, which can read and write exactly one
  guest row and nothing else.

  Assume a phone, opened from an email, by someone who has never seen this
  before and will use it once. Everything above the fold, no jargon, no
  account, no app to install.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/nzu1hbj.css" onerror="this.remove()">

<style>
:root{
  --sage:#4E5F4F; --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7;
  --white:#fff; --sage-70:#7B887C; --sage-10:#EDEFED;
  --attention:#B08D57; --attention-bg:#F7F0E4;
  --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --display:orpheus-pro,"Cormorant Garamond",Georgia,serif;
  --body:Raleway,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bone);color:var(--sage);font-family:var(--body);
  font-size:16px;line-height:1.6;letter-spacing:.02em;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 64px}
.hide{display:none!important}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;margin:0}
h1{font-size:2.125rem}
h2{font-size:1.25rem}
.label{font-size:.6875rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70)}
.muted{color:var(--sage-70)}
.center{text-align:center}

header{background:var(--sage);color:var(--bone);padding:22px 20px;text-align:center}
header .brand{font-family:var(--display);font-size:1.0625rem;letter-spacing:.16em;text-transform:uppercase}
header .sub{font-size:.625rem;letter-spacing:.2em;text-transform:uppercase;color:var(--celadon);margin-top:4px}

.hero{text-align:center;padding:40px 0 10px}
.hero .to{font-size:.6875rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-70)}
.hero .lede{font-family:var(--display);font-size:1.0625rem;margin:18px 0 14px;text-transform:none;letter-spacing:.02em}
.hero .names{font-family:var(--display);font-size:2.375rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.hero .amp{font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--sage-70);margin:4px 0}
.hero .date{margin-top:20px;padding-top:20px;border-top:1px solid var(--mist);
  font-family:var(--display);font-size:1.125rem;letter-spacing:.04em}
.hero .where{font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sage-70);margin-top:6px}
@media(max-width:480px){.hero .names{font-size:1.75rem}h1{font-size:1.625rem}}

.card{background:var(--white);border:1px solid var(--mist);padding:24px;margin-bottom:16px}
.times{margin:24px 0 0;padding:0;list-style:none}
.times li{display:flex;gap:14px;padding:5px 0;justify-content:center}
.times .t{font-variant-numeric:tabular-nums;color:var(--sage-70)}

.btn{display:inline-block;background:transparent;color:var(--sage);border:1px solid currentColor;
  border-radius:0;padding:15px 30px;font:500 .8125rem/1 var(--body);letter-spacing:.17em;
  text-transform:uppercase;cursor:pointer;transition:background .16s,color .16s;text-decoration:none}
.btn:hover{background:var(--sage);color:var(--bone)}
.btn--primary{background:var(--sage);color:var(--bone)}
.btn--primary:hover{background:#5D6D5E}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--block{display:block;width:100%;text-align:center}

/* The yes/no choice — the only thing on the page that really matters */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.choice button{
  background:var(--white);border:1px solid var(--mist);padding:20px 12px;cursor:pointer;
  font-family:var(--display);font-size:1.0625rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--sage);transition:border-color .16s,background .16s;
}
.choice button:hover{border-color:var(--sage)}
.choice button[aria-pressed="true"]{background:var(--sage);color:var(--bone);border-color:var(--sage)}
.choice button .sub{display:block;font-family:var(--body);font-size:.6875rem;letter-spacing:.14em;
  margin-top:6px;opacity:.75;text-transform:uppercase}

.field{margin-bottom:18px}
.field .label{display:block;margin-bottom:6px}
input,textarea,select{
  width:100%;background:var(--bone);color:var(--sage);border:1px solid var(--mist);
  border-radius:0;padding:12px 14px;font-family:var(--body);font-size:1rem;letter-spacing:.02em;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sage)}
textarea{min-height:76px;resize:vertical}

/* Meal options read as a list of dishes, not a dropdown */
.opts{display:block}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--mist);
  background:var(--white);margin-bottom:8px;cursor:pointer;transition:border-color .16s}
.opt:hover{border-color:var(--celadon)}
.opt input{width:18px;height:18px;flex:0 0 18px;margin:3px 0 0;accent-color:#4E5F4F}
.opt .n{font-family:var(--display);font-size:1.0625rem;letter-spacing:.03em}
.opt .d{font-size:.875rem;color:var(--sage-70);margin-top:2px}
.opt[data-on="1"]{border-color:var(--sage)}

.notice{padding:14px 16px;font-size:.9375rem;border:1px solid;margin-bottom:16px}
.notice--ok{background:var(--sage-10);border-color:var(--celadon)}
.notice--due{background:var(--attention-bg);border-color:var(--attention);color:#7a5f36}
.err{background:var(--alert-bg);border:1px solid var(--alert);color:var(--alert);
  padding:12px 15px;font-size:.9375rem;margin-bottom:16px}
.sheet{white-space:pre-wrap;font-family:var(--display);font-size:1.0625rem;line-height:1.7;
  font-style:italic;text-align:center}
footer{border-top:1px solid var(--mist);padding:26px 20px;text-align:center;
  font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-70)}
a{color:inherit}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--mist);
  border-top-color:var(--sage);border-radius:50%;animation:s .7s linear infinite;vertical-align:-4px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}*{transition:none!important}}
.tick{font-size:2.5rem;line-height:1;color:var(--sage)}
</style>
</head>
<body>

<header>
  <div class="brand">Black Horse Beamish</div>
  <div class="sub">Red Row Estate</div>
</header>

<div class="wrap">
  <div id="loading" class="center" style="padding:80px 0"><span class="spin"></span></div>
  <div id="fail" class="hide" style="padding:56px 0">
    <div class="card center">
      <h2 style="margin-bottom:12px">We couldn't open your invitation</h2>
      <p id="failMsg" class="muted" style="margin:0 0 18px"></p>
      <p class="muted" style="font-size:.875rem;margin:0">
        Do get in touch with the couple, or call the venue on
        <a href="tel:01207232569">01207 232 569</a>.
      </p>
    </div>
  </div>
  <div id="main" class="hide"></div>
</div>

<footer>
  Red Row Estate · Beamish · Co. Durham · DH9 0RW<br>
  <a href="tel:01207232569">01207 232 569</a>
</footer>

<script>
"use strict";

var CFG = {
  SUPABASE_URL: "https://safcrtrfdzsnftghibot.supabase.co",
  SUPABASE_KEY: "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU"
};

var S = { token:null, data:null, attending:null, choices:{} };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hhmm(iso){ return String(iso||"").slice(11,16); }
function ukDate(iso){
  var p = String(iso||"").slice(0,10).split("-"); if (p.length!==3) return "";
  return new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long",
    year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(+p[0],+p[1]-1,+p[2])));
}
function ukDateShort(iso){
  var p = String(iso||"").slice(0,10).split("-"); if (p.length!==3) return "";
  return new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"long",
    timeZone:"UTC"}).format(new Date(Date.UTC(+p[0],+p[1]-1,+p[2])));
}

async function call(action, payload){
  var r = await fetch(CFG.SUPABASE_URL + "/functions/v1/wedding-rsvp", {
    method:"POST",
    headers:{ "Content-Type":"application/json",
              Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY },
    body: JSON.stringify({ token:S.token, action:action, payload:payload||{} })
  });
  var data = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data;
}

function fail(msg){
  $("loading").classList.add("hide");
  $("main").classList.add("hide");
  $("failMsg").textContent = msg;
  $("fail").classList.remove("hide");
}

/* ---------- the invitation ---------- */
function render(){
  var d = S.data, g = d.guest, w = d.wedding;
  var name = [g.first_name, g.surname].filter(Boolean).join(" ");
  var already = g.rsvp === "attending" || g.rsvp === "declined";

  var h = '<section class="hero">' +
    '<div class="to">' + esc(name) + '</div>' +
    '<div class="lede">Together with our families, we would love you to ' +
      (g.invited_to === "evening" ? "join us for the evening" : "join us on our wedding day") +
      ' as we marry</div>' +
    '<div class="names">' + esc(w.partner1_name) + '</div>' +
    '<div class="amp">&amp;</div>' +
    '<div class="names">' + esc(w.partner2_name) + '</div>' +
    '<div class="date">' + esc(ukDate(w.wedding_date)) + '</div>' +
    '<div class="where">Red Row Estate, Beamish</div>';

  if (d.functions.length) {
    h += '<ul class="times">' + d.functions.map(function(f){
      return '<li><span class="t">' + esc(hhmm(f.start)) + '</span><span>' + esc(f.name) + '</span></li>';
    }).join("") + '</ul>';
  }
  h += '</section>';

  if (w.message) {
    h += '<div class="card"><div class="sheet">' + esc(w.message) + '</div></div>';
  }

  /* Already replied — say so warmly, and let them change it. */
  if (already && S.attending === null) {
    h += '<div class="notice notice--ok center">' +
      (g.rsvp === "attending"
        ? "<strong>You've told us you're coming.</strong> Lovely — we can't wait."
        : "<strong>You've let us know you can't make it.</strong> Thank you for saying.") +
      '<br><a href="#" onclick="change();return false" style="font-size:.875rem">Need to change your answer?</a></div>';

    if (g.rsvp === "attending" && (g.main_choice || g.starter_choice || g.dessert_choice)) {
      h += '<div class="card"><span class="label">What you chose</span><ul style="margin:10px 0 0;padding-left:18px">' +
        (g.starter_choice ? '<li>' + esc(g.starter_choice) + '</li>' : '') +
        (g.main_choice ? '<li>' + esc(g.main_choice) + '</li>' : '') +
        (g.dessert_choice ? '<li>' + esc(g.dessert_choice) + '</li>' : '') +
        '</ul>' +
        (g.allergies ? '<p class="muted" style="margin:12px 0 0;font-size:.875rem">Allergies noted: ' + esc(g.allergies) + '</p>' : '') +
        '</div>';
    }
    h += extras(w);
    $("main").innerHTML = h;
    return;
  }

  /* The reply */
  h += '<div class="card">' +
    '<h2 class="center" style="margin-bottom:16px">Can you join us?</h2>' +
    '<div id="err" class="err hide"></div>' +
    '<div class="choice">' +
      '<button type="button" id="yes" aria-pressed="' + (S.attending===true) + '" onclick="pick(true)">' +
        'Yes<span class="sub">Wouldn\'t miss it</span></button>' +
      '<button type="button" id="no" aria-pressed="' + (S.attending===false) + '" onclick="pick(false)">' +
        'No<span class="sub">Sadly can\'t</span></button>' +
    '</div>';

  if (S.attending === true) {
    if (d.menu.length) {
      h += '<div style="margin-top:26px">' + menuBlock("starter","To start") +
           menuBlock("main","Main course") + menuBlock("dessert","Pudding") + '</div>';
    }
    h += '<div class="field" style="margin-top:22px">' +
        '<span class="label">Any allergies we should know about?</span>' +
        '<input id="allergies" placeholder="Nuts, shellfish…" value="' + esc(g.allergies||"") + '">' +
        '<p class="muted" style="font-size:.8125rem;margin:6px 0 0">' +
        'This goes straight to the kitchen. Please tell us even if you\'ve mentioned it before.</p></div>' +
      '<div class="field">' +
        '<span class="label">Anything else about your meal?</span>' +
        '<input id="dietary" placeholder="Vegetarian, no pork…" value="' + esc(g.dietary||"") + '"></div>';
  }

  if (S.attending !== null) {
    h += '<button class="btn btn--primary btn--block" id="send" style="margin-top:10px" onclick="submit()">' +
      (S.attending ? 'Yes — count me in' : 'Send my reply') + '</button>';
  }

  if (w.rsvp_by && S.attending === null) {
    h += '<p class="muted center" style="font-size:.8125rem;margin:16px 0 0">' +
      'Please let us know by ' + esc(ukDateShort(w.rsvp_by)) + '.</p>';
  }

  h += '</div>' + extras(w);
  $("main").innerHTML = h;
}

function extras(w){
  if (!w.dress_code && !w.extra_info) return "";
  var h = '<div class="card">';
  if (w.dress_code) {
    h += '<span class="label">Dress code</span>' +
      '<p style="margin:4px 0 0">' + esc(w.dress_code) + '</p>';
  }
  if (w.extra_info) {
    h += '<span class="label" style="display:block;margin-top:' + (w.dress_code ? "18px" : "0") + '">Anything else</span>' +
      '<p style="margin:4px 0 0;white-space:pre-wrap">' + esc(w.extra_info) + '</p>';
  }
  return h + '</div>';
}

function menuBlock(course, heading){
  var opts = S.data.menu.filter(function(m){ return m.course === course; });
  if (!opts.length) return "";
  var chosen = S.choices[course] != null ? S.choices[course] : (S.data.guest[course + "_choice"] || null);
  S.choices[course] = chosen;
  return '<div style="margin-bottom:22px"><span class="label">' + esc(heading) + '</span>' +
    '<div class="opts" style="margin-top:8px">' + opts.map(function(o){
      var on = chosen === o.label;
      return '<label class="opt" data-on="' + (on?1:0) + '">' +
        '<input type="radio" name="' + course + '" ' + (on?"checked":"") +
        ' onchange="choose(\'' + course + '\',' + JSON.stringify(o.label).replace(/"/g,"&quot;") + ')">' +
        '<span><span class="n">' + esc(o.label) + '</span>' +
        (o.description ? '<span class="d">' + esc(o.description) + '</span>' : '') +
        '</span></label>';
    }).join("") + '</div></div>';
}

function pick(v){ S.attending = v; render(); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
function choose(course, label){ S.choices[course] = label; render(); }
function change(){ S.attending = S.data.guest.rsvp === "attending"; render(); }

async function submit(){
  var btn = $("send"), err = $("err");
  err.classList.add("hide");

  /* A sit-down guest with no main chosen is the thing the kitchen will
     chase later, so ask now rather than accepting a blank. */
  var needsMain = S.attending && S.data.menu.some(function(m){ return m.course === "main"; });
  if (needsMain && !S.choices.main) {
    err.textContent = "Please choose a main course so the kitchen knows what to prepare.";
    err.classList.remove("hide");
    err.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    await call("submit", {
      attending: S.attending,
      starter: S.choices.starter || null,
      main: S.choices.main || null,
      dessert: S.choices.dessert || null,
      allergies: $("allergies") ? $("allergies").value : null,
      dietary: $("dietary") ? $("dietary").value : null
    });
    done();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove("hide");
    btn.disabled = false;
    btn.textContent = S.attending ? "Yes — count me in" : "Send my reply";
  }
}

function done(){
  var w = S.data.wedding;
  $("main").innerHTML = '<section class="hero" style="padding-top:60px">' +
    '<div class="tick">' + (S.attending ? "✦" : "♥") + '</div>' +
    '<h1 style="margin-top:18px">' + (S.attending ? "See you there" : "Thank you") + '</h1>' +
    '<p style="margin:16px 0 0">' +
      (S.attending
        ? "Your reply is in — " + esc(w.salutation) + " will be delighted."
        : "We're sorry you can't make it, and thank you for letting us know. " + esc(w.salutation) + " will be in touch.") +
    '</p>' +
    (S.attending ? '<p class="muted" style="margin-top:12px">' + esc(ukDate(w.wedding_date)) +
      '<br>Red Row Estate, Beamish</p>' : '') +
    '<p class="muted" style="font-size:.8125rem;margin-top:26px">' +
      'Changed your mind or made a mistake? <a href="#" onclick="location.reload();return false">Reply again</a>.</p>' +
  '</section>';
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- start ---------- */
(function(){
  var m = /[?&]r=([0-9a-fA-F]{32})/.exec(location.search);
  if (!m) { fail("The link looks incomplete. Please open the button in your invitation email again."); return; }
  S.token = m[1].toLowerCase();

  call("get").then(function(d){
    S.data = d;
    $("loading").classList.add("hide");
    $("main").classList.remove("hide");
    render();
  }).catch(function(e){ fail(e.message); });
})();
</script>
</body>
</html>
