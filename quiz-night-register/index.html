<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quiz Night | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sage:#4D604F;--sage-deep:#34443A;--sage-soft:#EDEFED;--sage-mid:#7B887C;--brown:#3F2F28;--bone:#F8F8F8;--celadon:#CCCDB4;--white:#fff;--ink:#262626;--gold:#D9B64A;--gold-deep:#B08D57;--gold-soft:#F7F0E4;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#4F6B4F;--good-bg:#EDF2ED;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.logobar{background:var(--sage-deep);padding:12px 16px;text-align:center}
.logobar img{height:40px;width:auto;display:block;margin:0 auto}
main{max-width:660px;margin:0 auto;padding:16px 16px 70px}
body.embed .logobar,body.embed footer{display:none}
body.embed main{padding-top:4px;padding-bottom:20px}

/* the stage */
.stage{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 0%,#5C7360 0%,var(--sage) 45%,var(--sage-deep) 100%);color:var(--white);text-align:center;padding:42px 20px 34px;margin:0 0 18px;box-shadow:0 12px 34px rgba(38,38,38,.22)}
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;height:16px;background:radial-gradient(circle at 11px 8px,var(--gold) 0 3.2px,rgba(217,182,74,.25) 3.3px 6px,transparent 6.2px) 0 0/22px 16px repeat-x}
.stage::before{top:0}.stage::after{bottom:0}
.qm{position:absolute;font-family:var(--display);font-weight:700;color:rgba(217,182,74,.2);line-height:1;pointer-events:none;user-select:none;animation:bob 6s ease-in-out infinite}
.qm.a{left:5%;top:16%;font-size:64px;transform:rotate(-14deg)}
.qm.b{right:6%;top:12%;font-size:88px;transform:rotate(12deg);animation-delay:-2s}
.qm.c{left:12%;bottom:12%;font-size:48px;transform:rotate(10deg);animation-delay:-4s}
.qm.d{right:12%;bottom:8%;font-size:56px;transform:rotate(-8deg);animation-delay:-1s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
@media (prefers-reduced-motion:reduce){.qm{animation:none}}
.kick{position:relative;font-size:12px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.stage h1{position:relative;font-size:clamp(54px,15vw,92px);line-height:.95;margin:8px 0 6px;color:var(--white);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.stage h1 span{color:var(--gold)}
.when{position:relative;font-family:var(--display);font-size:clamp(22px,5.5vw,30px);font-weight:600;color:var(--celadon)}
.where{position:relative;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;color:rgba(255,255,255,.8)}
.master{position:relative;display:inline-flex;align-items:center;gap:12px;text-align:left;margin:22px auto 0;padding:10px 20px 10px 12px;background:rgba(0,0,0,.22);border:1px solid rgba(217,182,74,.55);border-radius:999px}
.master .av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--sage-deep);font-family:var(--display);font-weight:700;font-size:30px;line-height:46px;text-align:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.master small{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.master b{font-family:var(--display);font-size:22px;line-height:1.1}

.pitch{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);padding:22px 20px;margin:0 0 16px;border-top:4px solid var(--gold)}
.pitch h2{font-size:30px;color:var(--sage);margin-bottom:8px}
.pitch p{margin:0 0 12px}
.pitch p:last-child{margin:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:12px 12px 12px 54px;background:var(--sage-soft);border-radius:12px;font-size:15px;min-width:0}
.steps li::before{content:counter(s);position:absolute;left:12px;top:50%;translate:0 -50%;width:32px;height:32px;border-radius:50%;background:var(--sage);color:var(--gold);font-family:var(--display);font-weight:700;font-size:20px;line-height:32px;text-align:center}
.steps b{display:block;color:var(--sage)}

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 16px}
.board div{background:var(--sage-deep);color:var(--white);border-radius:12px;padding:12px 14px;text-align:center;border-bottom:4px solid var(--gold);min-width:0}
.board dt{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--celadon);margin:0 0 2px}
.board dd{margin:0;font-family:var(--display);font-size:28px;line-height:1.1;font-weight:700}
.deal{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border:2px dashed var(--gold-deep);border-radius:var(--radius);padding:14px 16px;margin:0 0 16px}
.deal .pc{flex:none;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;color:var(--gold-deep);text-align:center}
.deal .pc small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.deal p{margin:0}

.card{background:var(--white);border-radius:var(--radius);box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);padding:22px 20px;margin:0 0 16px;min-width:0}
.card h2{font-size:30px;color:var(--sage);margin-bottom:6px}
label.f{display:block;font-weight:600;margin:16px 0 6px}
.req{color:var(--alert);margin-left:3px}
.hint{font-size:14px;color:var(--sage-mid);margin:-2px 0 6px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;background:var(--white);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--sage);flex:0 0 auto}
.btn{display:inline-block;background:var(--gold);color:var(--sage-deep);border:0;border-radius:999px;padding:15px 34px;font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn:disabled{opacity:.6;cursor:default}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:14px 0 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.bad label.f{color:var(--alert)} .bad input,.bad select{border-color:var(--alert)}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--celadon);border-top-color:var(--sage);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.done{text-align:center}
.done .big{font-family:var(--display);font-size:clamp(40px,11vw,60px);line-height:1;color:var(--sage);margin:4px 0 10px}
.done .big span{color:var(--gold-deep)}
footer{max-width:660px;margin:0 auto;padding:0 16px 36px;font-size:14px;color:var(--sage-mid);text-align:center}
footer a{color:var(--sage)}
</style>
</head>
<body>
<div class="logobar"><a href="https://www.blackhorsebeamish.co.uk" target="_blank" rel="noopener"><img src="../app/logo-light.png" alt="Black Horse Beamish"></a></div>
<main>
  <section class="stage" aria-label="Quiz Night">
    <span class="qm a" aria-hidden="true">?</span><span class="qm b" aria-hidden="true">?</span><span class="qm c" aria-hidden="true">?</span><span class="qm d" aria-hidden="true">?</span>
    <div class="kick">Black Horse Beamish presents</div>
    <h1>Quiz <span>Night</span></h1>
    <div class="when" id="when">&nbsp;</div>
    <div class="where" id="where">The George Ridley</div>
    <div class="master"><div class="av">R</div><div><small>Your Quiz Master</small><b>Richard</b></div></div>
  </section>
  <div id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></div>
</main>
<footer>Need a hand? Phone 01207 232 569 or email <a href="mailto:events@blackhorsebeamish.co.uk">events@blackhorsebeamish.co.uk</a>.<br>Black Horse Beamish, Red Row, Beamish, DH9 0RW</footer>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/quiznight-api";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const EMBED = new URLSearchParams(location.search).get("embed") === "1";      // shown inside the website: no logo bar or footer, and it tells the page around it how tall it is
if (EMBED) document.body.classList.add("embed");
const tellHeight = () => { if (EMBED && parent !== window) parent.postMessage({ bhbHeight: document.documentElement.scrollHeight }, "*"); };
if (EMBED && window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const clock = t => { const [h, m] = String(t).split(":").map(Number); return (h > 12 ? h - 12 : h === 0 ? 12 : h) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); };
const longDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" });
let I = null;
async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
function pitch(n){
  return '<section class="pitch"><h2>Think you know it all?</h2>' +
    '<p>Pull a team together, pick a name worth shouting across the room, and find out who really knows their stuff. <b>Richard</b> is your Quiz Master, and the questions are pure general knowledge: no specialist subjects, no homework, just a lot of arguing over the answers.</p>' +
    '<p>It costs nothing to play. Bragging rights are on the house.</p>' +
    '<ol class="steps"><li><b>Gather your team</b>Up to ' + n.max_team + ' players</li><li><b>Come early</b>Drink and food from ' + clock(n.food_from) + '</li><li><b>Face Richard</b>Quiz starts at ' + clock(n.starts_at) + '</li></ol></section>' +
    '<dl class="board"><div><dt>Arrive from</dt><dd>' + clock(n.arrive_from) + '</dd></div><div><dt>Quiz starts</dt><dd>' + clock(n.starts_at) + '</dd></div><div><dt>Entry</dt><dd>Free</dd></div><div><dt>Team size</dt><dd>1 to ' + n.max_team + '</dd></div></dl>' +
    '<div class="deal"><div class="pc">20%<small>off food</small></div><p><b>Peckish? Get in early.</b> Enjoy 20% off food, ' + clock(n.food_from) + ' to ' + clock(n.food_to) + ', from our new menu. Brain food counts.</p></div>';
}
function render(){
  const n = I.night;
  if (!n) { $("#app").innerHTML = '<div class="card"><h2>No quiz night just now</h2><p>The next one has not been announced yet. Keep an eye on our socials, or phone us on ' + esc(I.phone) + '.</p></div>'; return; }
  $("#when").textContent = longDay(n.date); $("#where").textContent = n.venue;
  if (!n.open || n.full) {
    $("#app").innerHTML = pitch(n) + '<div class="card"><h2>' + (n.full ? "We are full" : "Sign-ups are closed") + '</h2><p style="margin:0">' + (n.full ? "Every place for this quiz is taken. " : "") + 'Phone us on ' + esc(I.phone) + ' and we will see what we can do.</p></div>';
    tellHeight(); return;
  }
  const opts = Array.from({ length: n.max_team }, (_, i) => i + 1).map(k => '<option value="' + k + '"' + (k === 4 ? " selected" : "") + '>' + k + '</option>').join("");
  $("#app").innerHTML = pitch(n) +
    '<form class="card" id="form" novalidate><h2>Enter your team</h2>' +
    '<p style="margin:0" class="hint">Free to enter. Tell us who is coming and we will save you a table.' + (n.places_left != null && n.places_left <= 12 ? ' <b>Only ' + n.places_left + ' places left, so be quick.</b>' : '') + '</p>' +
    '<div class="qrow"><label class="f" for="team">Team name<span class="req">*</span></label><p class="hint">Go on, make it a good one. A decent pun goes a long way.</p><input type="text" id="team" maxlength="60" autocomplete="off" placeholder="Quizzy Rascals"></div>' +
    '<div class="qrow"><label class="f" for="players">How many of you?<span class="req">*</span></label><select id="players">' + opts + '</select></div>' +
    '<div class="qrow"><label class="f" for="name">Team captain\'s name<span class="req">*</span></label><input type="text" id="name" maxlength="80" autocomplete="name"></div>' +
    '<div class="qrow"><label class="f" for="email">Email address<span class="req">*</span></label><input type="email" id="email" maxlength="120" autocomplete="email"></div>' +
    '<div class="qrow"><label class="f" for="phone">Phone number<span class="req">*</span></label><input type="tel" id="phone" maxlength="30" autocomplete="tel" inputmode="tel"></div>' +
    '<label class="chk"><input type="checkbox" id="eating"><span>We will be coming early to eat (' + clock(n.food_from) + ' to ' + clock(n.food_to) + ', 20% off).</span></label>' +
    '<label class="f" for="notes">Anything we should know?</label><textarea id="notes" maxlength="500"></textarea>' +
    '<div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>' +
    '<label class="chk"><input type="checkbox" id="consent"><span>I am happy for Black Horse Beamish to contact me about this quiz.</span></label>' +
    '<div id="msg"></div><p style="margin:22px 0 0;text-align:center"><button type="submit" class="btn" id="go">Count us in</button></p></form>';
  $("#form").addEventListener("submit", submit);
  tellHeight();
}
async function submit(ev){
  ev.preventDefault();
  const v = id => ($("#" + id).value || "").trim(), msg = $("#msg");
  document.querySelectorAll(".qrow").forEach(r => r.classList.remove("bad")); msg.innerHTML = "";
  let firstBad = null;
  [["team", v("team")], ["name", v("name")], ["email", v("email")], ["phone", v("phone")]].forEach(([k, val]) => { if (!val) { const r = $("#" + k).closest(".qrow"); r.classList.add("bad"); if (!firstBad) firstBad = r; } });
  if (firstBad) { msg.innerHTML = '<div class="err">Please fill in your team name, your name, email address and phone number.</div>'; firstBad.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  if (!$("#consent").checked) { msg.innerHTML = '<div class="err">Please tick the box to say we may contact you about the quiz.</div>'; return; }
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Sending...";
  try {
    const r = await call("register", { night_id:I.night.id, team_name:v("team"), contact_name:v("name"), email:v("email"), phone:v("phone"), players:Number($("#players").value), eating:$("#eating").checked, notes:v("notes"), consent:true, website:v("website") });
    window.scrollTo({ top:0, behavior:"smooth" }); if (EMBED && parent !== window) parent.postMessage({ bhbTop:true }, "*");
    const n = I.night;
    $("#app").innerHTML = '<div class="card done"><div class="big">You are <span>in!</span></div><div class="ok">Well done, ' + esc(v("name").split(/\s+/)[0]) + '. ' + esc(r.team.team_name) + ' is on the list' + (r.updated ? ' (your details are updated)' : '') + '. A confirmation is on its way to your inbox.</div>' +
      '<p style="margin:0 0 10px">See you on <b>' + esc(longDay(n.date)) + '</b> in ' + esc(n.venue) + '. Arrive from ' + clock(n.arrive_from) + ', quiz starts at ' + clock(n.starts_at) + '. Start swotting: Richard will be ready for you.</p>' +
      '<p style="margin:0">Plans changed? Reply to the email or phone us on ' + esc(I.phone) + '.</p></div>';
    tellHeight();
  } catch (e) { msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; btn.disabled = false; btn.textContent = "Count us in"; }
}
(async function(){
  try { I = await call("info"); render(); }
  catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; }
})();
</script>
</body>
</html>
