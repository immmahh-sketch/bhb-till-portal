<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venue FAQ — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:860px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.searchbar{position:sticky; top:0; z-index:20; background:var(--bone); padding:14px 0 10px}
.searchbox{position:relative}
.searchbox input{width:100%; padding:14px 44px 14px 16px; border:1px solid var(--celadon); border-radius:999px; font-size:17px; background:var(--white); box-shadow:var(--shadow)}
.searchbox input:focus{outline:2px solid var(--sage); outline-offset:1px}
.searchbox .x{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:40px; height:40px; border:0; background:transparent; cursor:pointer; font-size:22px; color:var(--sage-70)}
.toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0}
.spacer{margin-left:auto}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger.sure{background:var(--alert); color:var(--white)}
.btn.small{min-height:36px; padding:6px 12px; font-size:11px}
.btn:disabled{opacity:.5; cursor:default}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:7px 14px; cursor:pointer; font-size:13px; min-height:36px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--attention); border-color:var(--attention)}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:12px}
.muted{color:var(--sage-70)} .empty{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.count{font-size:12px; color:var(--sage-70); margin:4px 2px 10px}
.faq{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px; border-left:4px solid transparent; overflow:hidden}
.faq.needs{border-left-color:var(--attention)}
.faqhead{display:flex; gap:12px; align-items:flex-start; width:100%; background:transparent; border:0; text-align:left; cursor:pointer; padding:14px 16px; min-height:52px}
.faqhead:hover{background:var(--sage-10)}
.faqhead .qt{flex:1 1 auto; min-width:0; font-family:var(--display); font-size:21px; line-height:1.2; color:var(--sage); overflow-wrap:anywhere}
.faqhead .chev{flex:0 0 auto; margin-top:8px; width:10px; height:10px; border-right:2px solid var(--sage-70); border-bottom:2px solid var(--sage-70); transform:rotate(-45deg); transition:.15s}
.faqhead[aria-expanded="true"] .chev{transform:rotate(45deg)}
.faqbody{padding:0 16px 16px; border-top:1px solid var(--mist)}
.ans{white-space:pre-wrap; font-size:16px; margin:14px 0 10px; overflow-wrap:anywhere}
.ans.none{color:var(--attention); font-style:italic}
.meta{font-size:12px; color:var(--sage-70); display:flex; gap:6px 14px; flex-wrap:wrap; margin-top:8px}
.meta a{color:var(--sage)}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.cat{background:var(--celadon); color:var(--sage-dark)} .tag.needs{background:var(--attention-bg); color:#6d5320} .tag.old{background:var(--alert-bg); color:var(--alert)} .tag.ok{background:var(--good-bg); color:var(--good)}
.tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.note{margin:10px 0 0; padding:8px 12px; border-radius:8px; background:var(--attention-bg); font-size:13px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
mark{background:#F3E3B5; color:inherit; border-radius:3px; padding:0 1px}
.field{margin-bottom:14px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}
textarea{min-height:130px; resize:vertical}
.hist{font-size:13px; margin-top:10px; border-top:1px solid var(--mist)} .hist div{padding:8px 0; border-bottom:1px solid var(--mist)} .hist .h{color:var(--sage-70); font-size:12px}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
@media(max-width:560px){ .faqhead .qt{font-size:19px} .actions .btn{flex:1 1 40%} .shell{padding:0 14px 64px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Venue FAQ</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Venue FAQ<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist" id="tabs"></div></nav>
  <div class="shell">
    <div class="searchbar"><div class="searchbox"><input id="q" type="search" autocomplete="off" placeholder="Search every question and answer…" aria-label="Search the FAQ"><button class="x" id="qx" aria-label="Clear search" hidden>×</button></div></div>
    <div id="views"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
// S.me: { name, email, admin, canEdit }. items: every question this person may see.
const S = { me:null, cats:[], items:[], view:"", q:"", needsOnly:false, tag:"", open:{}, editing:null, draft:{}, sure:null, hist:{}, busy:false };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const catLabel = k => (S.cats.find(c => c.key === k) || {}).label || k;
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(bad?" bad":""); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className="toast";}, bad?5200:2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/faq-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const fmtDay = iso => { if(!iso) return ""; try { return new Date(iso).toLocaleDateString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric" }); } catch(e){ return String(iso).slice(0,10); } };
const nameOf = email => { const s = String(email || "").split("@")[0].replace(/[._]/g," "); return s.replace(/\b\w/g, c => c.toUpperCase()); };
const ageDays = iso => iso ? (Date.now() - new Date(iso).getTime()) / 864e5 : Infinity;
const isUrl = s => /^https?:\/\//i.test(String(s || ""));

/* ------------------------------------------------------------- search */
const words = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9£]+/).filter(Boolean);
function score(item, terms){
  const q = words(item.question).join(" "), a = words(item.answer).join(" "), t = (item.tags || []).join(" ").toLowerCase();
  let total = 0;
  for (const w of terms){
    let s = 0;
    if (q.includes(w)) s += 6 + (q.split(" ").some(x => x === w) ? 2 : 0);
    if (t.includes(w)) s += 4;
    if (a.includes(w)) s += 2 + (a.split(" ").some(x => x === w) ? 1 : 0);
    if (!s) return 0;           // every word has to be found somewhere
    total += s;
  }
  return total;
}
function hl(text){
  text = String(text ?? "");
  const terms = words(S.q).filter(w => w.length > 1);
  if (!terms.length) return esc(text);
  const re = new RegExp(terms.sort((a,b) => b.length-a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", last = 0, m;
  while ((m = re.exec(text))) { out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>"; last = m.index + m[0].length; if (!m[0].length) re.lastIndex++; }
  return out + esc(text.slice(last));
}
function visibleItems(){
  const terms = words(S.q);
  if (terms.length) return S.items.map(i => [i, score(i, terms)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1]).map(x => x[0]);
  let list = S.items.filter(i => i.category === S.view);
  if (S.needsOnly) list = list.filter(i => i.needs_answer);
  if (S.tag) list = list.filter(i => (i.tags || []).includes(S.tag));
  return list;
}

/* ------------------------------------------------------------- render */
function renderTabs(){
  $("#tabs").innerHTML = S.cats.map(c => `<button class="tabbtn" data-view="${esc(c.key)}" role="tab">${esc(c.label)}</button>`).join("");
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; S.q = ""; $("#q").value = ""; S.needsOnly = false; S.tag = ""; $("#qx").hidden = true; render(); window.scrollTo(0,0); }));
  markTab();
}
function markTab(){ $$(".tabbtn").forEach(b => b.setAttribute("aria-current", (!S.q && b.dataset.view === S.view) ? "page" : "false")); }
function itemHtml(i, showCat){
  const open = !!S.open[i.id], editing = S.editing === i.id;
  const old = i.answer && ageDays(i.last_checked_at) > 180;
  const checked = i.last_checked_at ? `Checked ${esc(fmtDay(i.last_checked_at))}${i.last_checked_by ? " by " + esc(nameOf(i.last_checked_by)) : ""}` : (i.answer ? "Not checked yet" : "");
  let body = "";
  if (open && editing) body = editForm(i);
  else if (open) {
    const h = S.hist[i.id];
    body = `<div class="faqbody">
      ${i.answer ? `<div class="ans">${hl(i.answer)}</div>` : `<div class="ans none">${S.me.canEdit ? "Nobody has written an answer yet. Add one below." : "No answer yet. Ask the GM."}</div>`}
      ${(i.tags || []).length ? `<div class="tags">${i.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      ${i.note ? `<div class="note"><b>To check:</b> ${esc(i.note)}</div>` : ""}
      <div class="meta">${checked ? `<span>${checked}</span>` : ""}${i.source ? (isUrl(i.source) ? `<span>Source: <a href="${esc(i.source)}" target="_blank" rel="noopener">${esc(i.source.replace(/^https?:\/\/(www\.)?/, "").slice(0,60))}</a></span>` : `<span>Source: ${esc(i.source)}</span>`) : ""}</div>
      <div class="actions">
        ${i.answer ? `<button class="btn ghost small" data-a="copy" data-id="${esc(i.id)}">Copy answer</button>` : ""}
        ${S.me.canEdit ? `<button class="btn ghost small" data-a="edit" data-id="${esc(i.id)}">${i.answer ? "Edit" : "Add answer"}</button>` : ""}
        ${S.me.canEdit && i.answer ? `<button class="btn ghost small" data-a="check" data-id="${esc(i.id)}">Still correct</button>` : ""}
        ${S.me.canEdit ? `<button class="btn ghost small" data-a="hist" data-id="${esc(i.id)}">History</button>` : ""}
        ${S.me.canEdit ? `<button class="btn danger small${S.sure === i.id ? " sure" : ""}" data-a="del" data-id="${esc(i.id)}">${S.sure === i.id ? "Tap again to delete" : "Delete"}</button>` : ""}
      </div>
      ${h ? `<div class="hist">${h.length ? h.map(x => `<div><div class="h">${esc(({create:"Added",edit:"Edited",delete:"Deleted",check:"Checked"})[x.action] || x.action)} by ${esc(nameOf(x.by_email))} · ${esc(fmtDay(x.at))}</div>${x.action === "edit" || x.action === "create" ? `<div>${esc((x.answer || "").slice(0,300)) || "<i>No answer</i>"}</div>` : ""}</div>`).join("") : "<div>No history yet.</div>"}</div>` : ""}
    </div>`;
  }
  return `<div class="faq${i.needs_answer ? " needs" : ""}"><button class="faqhead" data-a="toggle" data-id="${esc(i.id)}" aria-expanded="${open}">
    <span class="qt">${hl(i.question)}${showCat ? ` <span class="tag cat">${esc(catLabel(i.category))}</span>` : ""}${i.needs_answer ? ` <span class="tag needs">Needs an answer</span>` : ""}${old ? ` <span class="tag old">Check again</span>` : ""}</span><span class="chev"></span></button>${body}</div>`;
}
function editForm(i){
  const d = S.draft, isNew = !i.id;
  const v = (k, def) => (k in d) ? d[k] : (def ?? "");
  return `<div class="faqbody"><div style="padding-top:14px">
    <div class="field"><label>Category</label><select data-f="category">${S.cats.map(c => `<option value="${esc(c.key)}"${v("category", i.category) === c.key ? " selected" : ""}>${esc(c.label)}</option>`).join("")}</select></div>
    <div class="field"><label>Question</label><input data-f="question" maxlength="300" value="${esc(v("question", i.question))}" placeholder="How a guest would ask it"></div>
    <div class="field"><label>Answer</label><textarea data-f="answer" placeholder="What staff should say. Leave it empty to log a question that still needs an answer.">${esc(v("answer", i.answer))}</textarea></div>
    <div class="field"><label>Tags (separated by commas)</label><input data-f="tags" value="${esc(v("tags", (i.tags || []).join(", ")))}" placeholder="parking, dogs"></div>
    <div class="field"><label>Where the answer came from</label><input data-f="source" maxlength="300" value="${esc(v("source", i.source))}" placeholder="A web page address, or who confirmed it"></div>
    <div class="field"><label>Anything to double-check</label><input data-f="note" maxlength="500" value="${esc(v("note", i.note))}"></div>
    <div class="actions"><button class="btn" data-a="save" data-id="${esc(i.id || "")}"${S.busy ? " disabled" : ""}>${S.busy ? "Saving…" : isNew ? "Add question" : "Save"}</button><button class="btn ghost" data-a="cancel">Cancel</button></div></div></div>`;
}
function render(){
  markTab();
  const el = $("#views"), searching = words(S.q).length > 0;
  const list = visibleItems();
  const inCat = S.items.filter(i => i.category === S.view);
  const needs = inCat.filter(i => i.needs_answer).length;
  const tags = {}; for (const i of inCat) for (const t of (i.tags || [])) tags[t] = (tags[t] || 0) + 1;
  const topTags = Object.entries(tags).sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])).slice(0, 12);
  let html = "";
  if (!searching) {
    html += `<div class="toolrow">${S.me.canEdit ? `<button class="btn small" data-a="new">Add a question</button>` : ""}${needs ? `<button class="chip warn" data-a="needs" aria-pressed="${S.needsOnly}">Needs an answer (${needs})</button>` : ""}<span class="spacer"></span><span class="muted" style="font-size:12px">${S.me.canEdit ? "You can add and change answers" : "View only"}</span></div>`;
    if (topTags.length) html += `<div class="toolrow" style="margin-top:0">${topTags.map(([t,n]) => `<button class="chip" data-a="tag" data-t="${esc(t)}" aria-pressed="${S.tag === t}">${esc(t)} ${n}</button>`).join("")}</div>`;
  } else {
    html += `<div class="count">${list.length ? `${list.length} ${list.length === 1 ? "answer" : "answers"} for “${esc(S.q)}” across ${S.cats.length === 1 ? "your category" : "all categories"}` : ""}</div>`;
  }
  if (S.editing === "new") html += `<div class="faq">${editForm({ category:S.view })}</div>`;
  html += list.length ? list.map(i => itemHtml(i, searching)).join("") : `<div class="card empty">${searching ? `Nothing found for “${esc(S.q)}”.${S.me.canEdit ? `<br><br><button class="btn small" data-a="new">Add it as a question</button>` : ""}` : "No questions here yet."}</div>`;
  el.innerHTML = html;
  wire();
}
function wire(){
  $$("#views [data-a]").forEach(b => b.addEventListener("click", onAct));
  $$("#views [data-f]").forEach(f => { f.addEventListener("input", () => { S.draft[f.dataset.f] = f.value; }); });
}

/* ------------------------------------------------------------- actions */
async function onAct(ev){
  const b = ev.currentTarget, a = b.dataset.a, id = b.dataset.id;
  const item = S.items.find(i => i.id === id);
  try {
    if (a === "toggle") { S.open[id] = !S.open[id]; if (!S.open[id] && S.editing === id) { S.editing = null; S.draft = {}; } S.sure = null; return render(); }
    if (a === "needs") { S.needsOnly = !S.needsOnly; return render(); }
    if (a === "tag") { S.tag = S.tag === b.dataset.t ? "" : b.dataset.t; return render(); }
    if (a === "new") { S.editing = "new"; S.draft = { question: S.q && words(S.q).length ? S.q : "" }; S.q = ""; $("#q").value = ""; $("#qx").hidden = true; render(); const f = $('[data-f="question"]'); if (f) f.focus(); return; }
    if (a === "edit") { S.editing = id; S.draft = {}; S.sure = null; return render(); }
    if (a === "cancel") { S.editing = null; S.draft = {}; return render(); }
    if (a === "copy") {
      const text = item.answer;
      try { await navigator.clipboard.writeText(text); toast("Answer copied."); }
      catch(e){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Answer copied."); } catch(e2){ toast("Copy didn't work - select the text instead.", true); } ta.remove(); }
      return;
    }
    if (a === "check") { const d = await call("faq.check", { id }); replace(d.item); toast("Marked as checked."); return render(); }
    if (a === "hist") { if (S.hist[id]) { delete S.hist[id]; return render(); } const d = await call("faq.history", { id }); S.hist[id] = d.history; return render(); }
    if (a === "del") {
      if (S.sure !== id) { S.sure = id; render(); clearTimeout(onAct._t); onAct._t = setTimeout(() => { if (S.sure === id) { S.sure = null; render(); } }, 6000); return; }
      await call("faq.delete", { id }); S.items = S.items.filter(i => i.id !== id); S.sure = null; toast("Deleted."); return render();
    }
    if (a === "save") {
      if (S.busy) return;
      const base = id ? item : { category: S.view }, d = S.draft;
      const payload = { id: id || undefined, category: d.category ?? base.category, question: d.question ?? base.question, answer: d.answer ?? base.answer, tags: d.tags ?? (base.tags || []).join(", "), source: d.source ?? base.source, note: d.note ?? base.note };
      S.busy = true; render();
      try { const r = await call("faq.save", payload); replace(r.item); S.editing = null; S.draft = {}; S.open[r.item.id] = true; if (!id) { S.view = r.item.category; } toast(id ? "Saved." : "Question added."); }
      finally { S.busy = false; }
      return render();
    }
  } catch(e){ S.busy = false; toast(e.message, true); render(); }
}
function replace(it){ const n = S.items.findIndex(i => i.id === it.id); if (n >= 0) S.items[n] = it; else S.items.push(it); S.items.sort((a,b) => (a.category + (a.needs_answer ? "0" : "1") + a.question.toLowerCase()).localeCompare(b.category + (b.needs_answer ? "0" : "1") + b.question.toLowerCase())); }

/* ------------------------------------------------------------- boot */
let st;
$("#q").addEventListener("input", e => { S.q = e.target.value; $("#qx").hidden = !S.q; clearTimeout(st); st = setTimeout(render, 80); });
$("#qx").addEventListener("click", () => { S.q = ""; $("#q").value = ""; $("#qx").hidden = true; render(); $("#q").focus(); });
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); } });
function openGate(msg){ $("#gate").style.display = "flex"; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", ()=>{ try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading…</div>`;
  let d;
  try { d = await call("bootstrap"); } catch(e){ $("#views").innerHTML = `<div class="card empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  S.me = d.me; S.cats = d.categories; S.items = d.items; $("#whoname").textContent = S.me.name;
  if (!S.cats.length) { $("#views").innerHTML = `<div class="card empty">You don't have access to any FAQ category yet. Ask the GM.</div>`; return; }
  S.view = S.cats[0].key; renderTabs(); render();
}
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate(); })();
</script>
</body>
