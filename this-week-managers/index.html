<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>This Week - Managers — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4D604F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3F2F28;
  --bone:#F8F8F8; --celadon:#CCCDB4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --olive:#CCCDB4; --brown:#3F2F28;
  --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:900px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.days{background:var(--sage-dark)}
.daysin{max-width:var(--maxw); margin:0 auto; padding:8px 20px; display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:thin}
.daybtn{flex:0 0 auto; scroll-snap-align:center; background:transparent; border:1px solid rgba(255,255,255,.25); border-radius:8px; cursor:pointer; color:rgba(255,255,255,.8); padding:7px 14px; min-width:74px; min-height:52px; text-align:center; line-height:1.2}
.daybtn b{display:block; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase}
.daybtn span{display:block; font-size:12px; opacity:.85}
.daybtn[aria-current="page"]{background:var(--white); color:var(--sage-dark); border-color:var(--white)}
.pagehead{margin:26px 0 18px}
.pagehead h2{font-size:30px; color:var(--sage); line-height:1.15}
.pagehead .date{font-family:var(--display); font-size:24px; color:var(--ink); margin-top:2px}
.pagehead .hint{font-size:12px; color:var(--sage-70); margin-top:6px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.stat .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.stat .v{font-family:var(--display); font-size:38px; line-height:1.1; color:var(--sage); margin-top:2px}
.stat .v.none{color:var(--celadon)}
.row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--mist); width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left}
.row:first-of-type{border-top:0; padding-top:0}
button.row{cursor:pointer}
button.row:hover .t{text-decoration:underline}
.row .main{flex:1; min-width:0}
.row .t{font-weight:600; font-size:16px}
.row .m{font-size:13px; color:var(--sage-70)}
.row .go{color:var(--sage-70); font-size:20px}
.row .time{font-family:var(--display); font-size:24px; color:var(--sage); min-width:62px}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.marquee{background:#F7F2E4; color:#8A6D2B}
.tag.george{background:#E6ECF3; color:#3F5A7A}
.btn{border:1px solid var(--sage); background:var(--white); color:var(--sage); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn:hover{background:var(--sage-10)}
.dl{margin:0}
.dl .ans{padding:10px 0; border-top:1px solid var(--mist)}
.dl .ans:first-child{border-top:0; padding-top:0}
.dl .al{font-size:12px; color:var(--sage-70)}
.dl .av{font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere}
.dl a{color:var(--sage)}
.tag.draft{background:#F7F0E4; color:#6d5320}
.staff{padding-top:6px; padding-bottom:6px}
.stoggle{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; background:none; border:0; padding:0; cursor:pointer; text-align:left; font-family:var(--display); font-size:22px; font-weight:600; color:var(--sage)}
.stoggle .scount{font-family:var(--body); font-size:14px; font-weight:600; color:var(--sage-70)}
.stoggle .chev{margin-left:auto; font-family:var(--body); font-size:20px; color:var(--sage-70); transition:transform .15s}
.staff.open .stoggle .chev{transform:rotate(90deg)}
.staff .sbody{display:none; padding:2px 0 12px}
.staff.open .sbody{display:block}
.staff .sline{font-size:14px; color:var(--sage-70); padding:12px 0}
.staff .sline.plain{padding:14px 0}
.sdept{font-size:10px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:14px 0 2px}
.sdept:first-child{margin-top:4px}
.pp{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; padding:8px 0; border-top:1px solid var(--mist)}
.pp .pn{flex:1 1 170px; min-width:0; overflow-wrap:anywhere}
.pp .pn b{font-weight:600}
.pp .pn .pj{color:var(--sage-70); font-size:13px}
.pp .pt{font-family:var(--display); font-size:20px; color:var(--sage); white-space:nowrap}
.pp .tag{margin-left:4px; vertical-align:2px}
.soff{font-size:14px; padding-top:12px; margin-top:6px; border-top:1px solid var(--mist); overflow-wrap:anywhere}
.soff b{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-right:6px}
/* staffing timeline: time across the top, one row per job, a bar per shift */
.stool{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 10px}
.stool label{font-size:10px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.ssel{font:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--sage); border-radius:8px; background:var(--white); color:var(--sage); min-height:44px}
.tlwrap{overflow-x:auto; border-top:1px solid var(--mist); border-bottom:1px solid var(--mist)}
.tlr{display:flex; align-items:stretch; border-bottom:1px solid var(--mist)}
.tlr:last-child{border-bottom:0}
.tlab{flex:0 0 140px; position:sticky; left:0; z-index:3; background:var(--white); padding:6px 10px 6px 0; font-size:12.5px; font-weight:600; color:var(--sage); display:flex; align-items:center; border-right:1px solid var(--mist); line-height:1.25}
.tlab.sub{color:transparent}
.tlt{flex:1 1 auto; position:relative; min-height:34px; background-image:linear-gradient(to right, rgba(77,96,79,.24) 1px, transparent 1px), linear-gradient(to right, rgba(77,96,79,.09) 1px, transparent 1px); background-size:calc(100% / var(--h)) 100%, calc(100% / var(--n)) 100%}
.tlhead .tlt{min-height:30px}
.tlhead .hr{position:absolute; top:7px; padding-left:3px; font-size:11px; color:var(--sage-70); white-space:nowrap}
.tlcount .tlab{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.cseg{position:absolute; top:4px; bottom:4px; display:flex; align-items:center; justify-content:center; border-radius:5px; font-weight:700; font-size:13px; color:var(--sage)}
.tldh{position:sticky; left:0; width:max-content; padding:12px 0 4px; font-size:10px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.sbar{position:absolute; top:4px; bottom:4px; display:flex; align-items:center; padding:0 8px; border:0; border-radius:6px; background:var(--sage); color:#fff; font:inherit; font-size:12.5px; font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:default; text-align:left}
.sbar.mgr{background:var(--brown, #3F2F28)}
.sbar.draft{background:var(--sage-10); color:var(--sage); border:1px dashed var(--sage)}
.sbar:focus-visible{outline:2px solid var(--brown, #3F2F28); outline-offset:1px}
#sttip{position:fixed; z-index:50; display:none; max-width:300px; background:var(--brown, #3F2F28); color:#fff; padding:7px 11px; border-radius:8px; font-size:13px; line-height:1.4; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:900px){ .tl{min-width:calc(140px + var(--n) * 14px)} }
@media (max-width:640px){ .tlab{flex-basis:118px; font-size:12px} .tl{min-width:calc(118px + var(--n) * 14px)} }
.daybtn.sumbtn{border-style:dashed}
.sumt{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.sumt th{font-size:10px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); text-align:right; padding:6px 8px; border-bottom:1px solid var(--mist); white-space:nowrap}
.sumt th:first-child, .sumt td:first-child{text-align:left; padding-left:0; position:sticky; left:0; background:var(--white)}
.sumt td{padding:8px; text-align:right; border-bottom:1px solid var(--mist); white-space:nowrap}
.sumt tr.tot td{font-weight:700; color:var(--sage); border-bottom:0; border-top:2px solid var(--sage)}
.sumt td.nil{color:var(--celadon)}
.sumwrap{overflow-x:auto}
.row .when{font-size:12px; color:var(--sage-70); letter-spacing:.04em}
.atwarn{background:#F7F0E4; color:#6d5320; border-radius:8px; padding:10px 14px; font-size:13.5px; line-height:1.45; margin:0 0 12px}
.muted{color:var(--sage-70)} .empty{padding:14px 0; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.daysin{padding-left:12px;padding-right:12px} .pagehead h2{font-size:25px} .pagehead .date{font-size:21px} .stat .v{font-size:32px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>This Week - Managers</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">This Week - Managers<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="days" aria-label="Days"><div class="daysin" id="chips"></div></nav>
  <div class="shell"><div id="view"><div class="loading">Loading…</div></div></div>
</div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { data:null, idx:0, sr:null, view:"day", staff:{ state:"loading", byDate:{}, note:"" }, open:{}, staffDept:"all", sumDept:"all", sumPeriod:"this", last:null, from:null };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dateOf = iso => new Date(iso + "T12:00:00Z");
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
function longDay(iso){
  const d = dateOf(iso);
  const wd = d.toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"long" });
  const mo = d.toLocaleDateString("en-GB",{ timeZone:"UTC", month:"long" });
  return `${wd} ${ord(d.getUTCDate())} ${mo}`;
}
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/week-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
// Staffing comes from Planday through planday-api. It is extra: if it fails, everything else still works.
async function staffCall(payload){      // payload may carry actual:true for finished days (hours worked, not rostered)
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/planday-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action:"staffing.week", app_key:"this-week-managers", staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error || !Array.isArray(d.days)) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const num = v => (v === null || v === undefined) ? null : Math.round(v);

function chips(){
  const days = S.data.days;
  $("#chips").innerHTML = `<button class="daybtn sumbtn" data-sum="1" ${S.view === "summary" ? 'aria-current="page"' : ""}><b>Summary</b><span>The week</span></button>` + days.map((d,i) => {
    const dt = dateOf(d.date);
    const top = i === 0 ? "Today" : i === 1 ? "Tomorrow" : dt.toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"short" });
    const sub = `${dt.getUTCDate()} ${dt.toLocaleDateString("en-GB",{ timeZone:"UTC", month:"short" })}`;
    return `<button class="daybtn" data-i="${i}" ${S.view !== "summary" && i===S.idx?'aria-current="page"':""}><b>${top}</b><span>${sub}</span></button>`;
  }).join("");
  const cur = $("#chips .daybtn[aria-current]"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline:"center", block:"nearest" });
}

function stat(label, v){
  const n = num(v);
  return `<div class="stat"><div class="l">${esc(label)}</div><div class="v${n===null?" none":""}">${n===null?"–":n}</div></div>`;
}
function venueTag(v){ return `<span class="tag ${v==="Marquee"?"marquee":v==="George Ridley"?"george":""}">${esc(v)}</span>`; }

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
/* ---- staffing as a timeline ----
   Time runs across the top in 15 minute steps (07:00 to 23:00, wider if a shift needs it), with how many people are on shift under it.
   Each job has its own row, and people whose shifts do not overlap share a line. Bars carry the first name; hover (or tap) for the full name and times. */
const tmin = v => (+String(v).slice(0, 2)) * 60 + (+String(v).slice(3, 5));
const hm = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const BUCKET_RX = [["boh", /boh|kitchen|back of house/i], ["foh", /foh|front of house|bar|restaurant|floor/i], ["hk", /house ?keep|hk\b|rooms?\b/i], ["maint", /maint/i], ["office", /office|admin|management|reception/i]];
const bucketOf = n => { for (const [k, rx] of BUCKET_RX) if (rx.test(n)) return k; return "other"; };
// the order the rows run in, top to bottom, inside each department
const ROLE_ORDER = {
  foh: ["F&B Manager", "F&B Assistant Manager", "F&B Supervisor", "Team Member"],
  boh: ["Head Chef", "Sous Chef", "CDP", "Trainee Chef", "Kitchen Porter"],
  hk: ["Accommodations Manager", "Housekeeper"],
  maint: ["Maintenance Manager", "Maintenance Team Member"],
  office: ["General Manager", "Office Manager", "Wedding Coordinator"],
};
const MANAGERS = new Set(["F&B Manager", "F&B Assistant Manager", "Head Chef", "Sous Chef", "Accommodations Manager", "Maintenance Manager", "General Manager"]);
function roleLabel(job, bucket){
  const j = String(job || "").trim().toLowerCase();
  if (!j) return "Other";
  if (/agency/.test(j)) return "Agency";
  if (/food\s*(&|and)\s*bev/.test(j)) return "F&B Manager";
  if (/^bar manager/.test(j)) return "F&B Assistant Manager";
  if (/^supervisor/.test(j)) return "F&B Supervisor";
  if (/head chef/.test(j)) return "Head Chef";
  if (/sous/.test(j)) return "Sous Chef";
  if (/trainee/.test(j)) return "Trainee Chef";
  if (/kitchen porter/.test(j)) return "Kitchen Porter";
  if (/^cdp|chef de partie/.test(j)) return "CDP";
  if (/head house/.test(j)) return "Accommodations Manager";
  if (/^housekeep/.test(j)) return "Housekeeper";
  if (/^maint?enance.*manager/.test(j)) return "Maintenance Manager";
  if (/^maint?enance/.test(j)) return "Maintenance Team Member";
  if (/^gm$|general manager/.test(j)) return "General Manager";
  if (/^team member/.test(j)) return bucket === "boh" ? "CDP" : "Team Member";
  return String(job).trim();
}
function roleRank(label, bucket){
  if (label === "Agency") return 98;
  const own = (ROLE_ORDER[bucket] || []).indexOf(label); if (own >= 0) return own;
  for (const k in ROLE_ORDER) { const i = ROLE_ORDER[k].indexOf(label); if (i >= 0) return 20 + i; }
  return 50;
}
const deptLabel = n => (/^[A-Z]{5,}$/.test(n) ? n.charAt(0) + n.slice(1).toLowerCase() : n);      // MAINTENANCE -> Maintenance (FOH and BOH stay as they are)
const firstName = n => String(n || "").trim().split(/\s+/)[0] || "";

function timelineHtml(shown){
  const all = [];
  shown.forEach(dep => dep.people.forEach(p => {
    const s0 = tmin(p.start); let e0 = tmin(p.end); if (e0 <= s0) e0 += 1440;
    all.push({ dep: dep.dept_name, bucket: bucketOf(dep.dept_name), p, s: s0, e: e0 });
  }));
  if (!all.length) return "";
  const start = Math.min(7 * 60, Math.floor(Math.min(...all.map(x => x.s)) / 60) * 60);
  const end = Math.max(23 * 60, Math.ceil(Math.max(...all.map(x => x.e)) / 60) * 60);
  const total = end - start, n = total / 15, hrs = total / 60;
  const pc = m => ((m - start) / total * 100).toFixed(3);
  // how many are on shift between each pair of start/finish times, runs of the same number joined
  const cuts = [...new Set(all.flatMap(x => [x.s, x.e]))].sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i], b = cuts[i + 1], c = all.filter(x => x.s <= a && x.e >= b).length;
    if (segs.length && segs[segs.length - 1].c === c && segs[segs.length - 1].b === a) segs[segs.length - 1].b = b; else segs.push({ a, b, c });
  }
  const max = Math.max(1, ...segs.map(x => x.c));
  let h = `<div class="tlwrap"><div class="tl" style="--n:${n};--h:${hrs}">`;
  h += `<div class="tlr tlhead"><div class="tlab"></div><div class="tlt">${Array.from({ length: hrs }, (_, i) => `<span class="hr" style="left:${pc(start + i * 60)}%">${hm(start + i * 60)}</span>`).join("")}</div></div>`;
  h += `<div class="tlr tlcount"><div class="tlab">On shift</div><div class="tlt">${segs.filter(x => x.c > 0).map(x => `<div class="cseg" style="left:${pc(x.a)}%;width:${((x.b - x.a) / total * 100).toFixed(3)}%;background:rgba(77,96,79,${(0.1 + 0.4 * x.c / max).toFixed(2)})" title="${x.c} on shift, ${hm(x.a)} to ${hm(x.b)}">${x.c}</div>`).join("")}</div></div>`;
  shown.forEach(dep => {
    const mine = all.filter(x => x.dep === dep.dept_name); if (!mine.length) return;
    const bucket = bucketOf(dep.dept_name), groups = new Map();
    mine.forEach(x => { const l = roleLabel(x.p.job, bucket); if (!groups.has(l)) groups.set(l, []); groups.get(l).push(x); });
    if (shown.length > 1) h += `<div class="tldh">${esc(deptLabel(dep.dept_name))} · ${new Set(mine.map(x => x.p.name)).size}</div>`;
    [...groups.keys()].sort((a, b) => roleRank(a, bucket) - roleRank(b, bucket) || a.localeCompare(b)).forEach(label => {
      const lanes = [];
      groups.get(label).sort((a, b) => a.s - b.s || a.p.name.localeCompare(b.p.name)).forEach(x => {
        const lane = lanes.find(l => l.end <= x.s);

      });
      lanes.forEach((l, i) => {
        h += `<div class="tlr"><div class="tlab${i ? " sub" : ""}">${esc(label)}</div><div class="tlt">${l.items.map(x => {
          const tip = `${x.p.name} · ${label} · ${hm(x.s)}–${hm(x.e)}${x.p.draft ? " · not published yet" : ""}`;
          return `<button type="button" class="sbar${x.p.draft ? " draft" : MANAGERS.has(label) ? " mgr" : ""}" style="left:${pc(x.s)}%;width:${((x.e - x.s) / total * 100).toFixed(3)}%" data-tip="${esc(tip)}" aria-label="${esc(tip)}">${esc(firstName(x.p.name))}</button>`;
        }).join("")}</div></div>`;
      });
    });
  });
  return h + `</div></div>`;
}
function staffBlock(d){

/* Afternoon teas booked: from the ResDiary Booking Summary, which is a snapshot. The time it was taken is always shown, with a reminder to check ResDiary for changes since. */
function atCard(d){

  const srHtml = g => { const l = srList2(g); return l.length ? l.map(({ d, di, x, i }) => `<button class="row" data-sr="${g}:${i}" data-srd="${di}"><div class="time">${esc(x.time)}</div><div class="main"><div class="when">${dayTag(d)}</div><div class="t">${esc(x.name)}</div>${x.form_pending ? `<div class="m">Questionnaire not back yet</div>` : g === "w" ? `<div class="m">Drink: ${esc(x.drink || "not given")}</div><div class="m">Song: ${esc(x.song || "not given")}</div>` : `<div class="m">${esc(x.phone || x.email || "")}</div>`}</div><div class="go">›</div></button>`).join("") : `<div class="empty">${SRG[g].none}</div>`; };

        <div class="dl">
          ${line("Date", esc(longDay(d.date)))}
          ${line("Type", esc((x && x.type) || e.type))}
          ${line("Location", esc(loc))}
          ${line("Guests", esc(guests(x ? x.guests_day : e.guests, x ? x.guests_evening : e.evening_guests)))}
        </div>
      </div>
      <div class="card"><h3>Function sheet</h3>
        ${state === "loading" ? `<div class="empty">Loading the function sheet…</div>`
          : x && x.function_sheet ? `<div class="av" style="white-space:pre-wrap; overflow-wrap:anywhere">${esc(x.function_sheet)}</div>`
          : `<div class="empty">${esc((x && x.function_sheet_error) || (x && x.function_sheet_hidden ? "Nothing is left on the function sheet once the price and payment lines are hidden." : state === "none" ? "This function is not in the tracker, so there is no function sheet." : "There are no notes on the function sheet."))}</div>`}
        ${x && x.function_sheet_hidden ? `<div class="muted" style="font-size:12px;margin-top:10px">${x.function_sheet_hidden} line${x.function_sheet_hidden === 1 ? "" : "s"} about prices or payments ${x.function_sheet_hidden === 1 ? "is" : "are"} hidden. They show for people who also have the Weddings and events app.</div>` : ""}
      </div>`;
    window.scrollTo(0, 0);
  };
  if (!e.id) return draw(null, "none");
  draw(null, "loading");
  try { const x = await call("event", { id: e.id }); if (S.evTok === tok) draw(x, "done"); }
  catch (err) { if (S.evTok === tok) draw({ names: e.name, venue: e.venue, type: e.type, guests_day: e.guests, guests_evening: e.evening_guests, function_sheet: null, function_sheet_error: err.message || "The function sheet could not be loaded." }, "done"); }
}

function showround(ref){
  const g = String(ref).split(":")[0], i = +String(ref).split(":")[1];
  const d = curDays()[S.idx], s = srList(d, g)[i]; if (!s) return;
  S.sr = ref; S.view = "detail";
  const loc = s.location && (s.location.location || s.location.type) ? String(s.location.location || s.location.type) : "";
  const booked = s.booked_at ? new Date(s.booked_at).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : "";
  const line = (l, v) => v ? `<div class="ans"><div class="al">${esc(l)}</div><div class="av">${v}</div></div>` : "";
  $("#view").innerHTML = `
    <div class="pagehead"><button class="btn" id="back">‹ Back to ${S.from === "summary" ? "the summary" : esc(longDay(d.date))}</button></div>
    <div class="card">
      <h3>${esc(s.name)}</h3>
      <div class="dl">
        ${line("When", `${esc(longDay(d.date))}, ${esc(s.time)}${s.end_time ? " – " + esc(s.end_time) : ""}`)}
        ${line(g === "m" ? "Meeting" : "Tour", esc(s.event_name))}
        ${line("Drinks", esc(s.drink))}
        ${line("Phone", s.phone ? `<a href="tel:${esc(s.phone.replace(/\s+/g,""))}">${esc(s.phone)}</a>` : "")}
        ${line("Email", s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : "")}
        ${line("Location", esc(loc))}
        ${line("Booked", esc(booked))}
      </div>
    </div>
    <div class="card"><h3>Their answers</h3><div class="dl">
      ${s.questions.length ? s.questions.map(x => `<div class="ans"><div class="al">${esc(x.question)}</div><div class="av">${esc(x.answer)}</div></div>`).join("") : `<div class="empty">${s.form_pending ? "Waiting for their questionnaire" + (s.arranged_by ? " (arranged by " + esc(s.arranged_by) + ")" : "") + "." : "No answers recorded."}</div>`}
    </div></div>
    ${(s.reschedule_url || s.cancel_url) ? `<div class="muted" style="font-size:13px">${s.reschedule_url ? `<a href="${esc(s.reschedule_url)}" target="_blank" rel="noopener">Reschedule</a>` : ""}${s.reschedule_url && s.cancel_url ? " · " : ""}${s.cancel_url ? `<a href="${esc(s.cancel_url)}" target="_blank" rel="noopener">Cancel</a>` : ""}</div>` : ""}`;
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-staff]");
  if (t) {
    const date = t.dataset.staff, card = t.closest(".staff"), now = !card.classList.contains("open");
    S.open[date] = now; card.classList.toggle("open", now); t.setAttribute("aria-expanded", String(now)); return;
  }
  const c = e.target.closest(".daybtn"); if (c) { if (c.dataset.sum) { summary(); chips(); return; } S.idx = +c.dataset.i; S.from = null; day(); chips(); return; }
  const r = e.target.closest("[data-sr]"); if (r) { if (r.dataset.srd !== undefined) { S.idx = +r.dataset.srd; S.from = "summary"; } else S.from = null; showround(r.dataset.sr); return; }
  const v = e.target.closest("[data-ev]"); if (v) { if (v.dataset.evd !== undefined) { S.idx = +v.dataset.evd; S.from = "summary"; } else S.from = null; eventView(+v.dataset.ev); return; }
  if (e.target.closest("#back")) { if (S.from === "summary") { summary(); chips(); } else { day(); chips(); } }
});

/* the name tip: hover, keyboard focus or a tap */
function staffTip(el){
  let t = document.getElementById("sttip"); if (!t) { t = document.createElement("div"); t.id = "sttip"; t.setAttribute("role", "tooltip"); document.body.appendChild(t); }
  if (!el) { t.style.display = "none"; return; }
  t.textContent = el.dataset.tip; t.style.display = "block";
  const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
  t.style.top = (r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + "px";
}
document.addEventListener("mouseover", e => { const b = e.target.closest && e.target.closest(".sbar"); if (b) staffTip(b); });
document.addEventListener("mouseout", e => { if (e.target.closest && e.target.closest(".sbar")) staffTip(null); });
document.addEventListener("focusin", e => { const b = e.target.closest && e.target.closest(".sbar"); if (b) staffTip(b); });
document.addEventListener("focusout", () => staffTip(null));
document.addEventListener("click", e => { const b = e.target.closest(".sbar"); staffTip(b || null); });
document.addEventListener("scroll", () => staffTip(null), true);
document.addEventListener("change", e => { if (e.target && e.target.id === "sumperiod") { S.sumPeriod = e.target.value; if (S.sumPeriod === "last" && S.last && S.last.state !== "ok") S.last = null; summary(); const y = $("#sumperiod"); if (y) y.focus(); return; }
  if (e.target && e.target.id === "sumdept") { S.sumDept = e.target.value; summary(); const y = $("#sumdept"); if (y) y.focus(); return; }
   if (e.target && e.target.id === "staffdept") { S.staffDept = e.target.value; refreshStaff(); const x = $("#staffdept"); if (x) x.focus(); } });

function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false;
  try { S.data = await call("week"); }
  catch(e){ $("#view").innerHTML = `<div class="card">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  $("#whoname").textContent = S.data.me.name;
  chips(); day();
  loadStaffing();
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
