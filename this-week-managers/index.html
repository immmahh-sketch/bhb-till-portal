<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>This Week - Managers — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:900px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button{font:inherit; color:inherit}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.days{background:var(--sage-dark)}
.daysin{max-width:var(--maxw); margin:0 auto; padding:8px 20px; display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:thin}
.daybtn{flex:0 0 auto; scroll-snap-align:center; background:transparent; border:1px solid rgba(255,255,255,.25); border-radius:8px; cursor:pointer; color:rgba(255,255,255,.8); padding:7px 14px; min-width:74px; min-height:52px; text-align:center; line-height:1.2}
.daybtn b{display:block; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase}
.daybtn span{display:block; font-size:12px; opacity:.85}
.daybtn[aria-current="page"]{background:var(--white); color:var(--sage-dark); border-color:var(--white)}
.pagehead{margin:26px 0 18px}
.pagehead h2{font-size:30px; color:var(--sage); line-height:1.15}
.pagehead .date{font-family:var(--display); font-size:24px; color:var(--ink); margin-top:2px}
.pagehead .hint{font-size:12px; color:var(--sage-70); margin-top:6px}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px}
.stat{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 16px}
.stat .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70)}
.stat .v{font-family:var(--display); font-size:38px; line-height:1.1; color:var(--sage); margin-top:2px}
.stat .v.none{color:var(--celadon)}
.row{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--mist); width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left}
.row:first-of-type{border-top:0; padding-top:0}
button.row{cursor:pointer}
button.row:hover .t{text-decoration:underline}
.row .main{flex:1; min-width:0}
.row .t{font-weight:600; font-size:16px}
.row .m{font-size:13px; color:var(--sage-70)}
.row .go{color:var(--sage-70); font-size:20px}
.row .time{font-family:var(--display); font-size:24px; color:var(--sage); min-width:62px}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.marquee{background:#F7F2E4; color:#8A6D2B}
.tag.george{background:#E6ECF3; color:#3F5A7A}
.btn{border:1px solid var(--sage); background:var(--white); color:var(--sage); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase; min-height:44px}
.btn:hover{background:var(--sage-10)}
.dl{margin:0}
.dl .ans{padding:10px 0; border-top:1px solid var(--mist)}
.dl .ans:first-child{border-top:0; padding-top:0}
.dl .al{font-size:12px; color:var(--sage-70)}
.dl .av{font-size:15px; white-space:pre-wrap; overflow-wrap:anywhere}
.dl a{color:var(--sage)}
.tag.draft{background:#F7F0E4; color:#6d5320}
.staff{padding-top:6px; padding-bottom:6px}
.stoggle{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; background:none; border:0; padding:0; cursor:pointer; text-align:left; font-family:var(--display); font-size:22px; font-weight:600; color:var(--sage)}
.stoggle .scount{font-family:var(--body); font-size:14px; font-weight:600; color:var(--sage-70)}
.stoggle .chev{margin-left:auto; font-family:var(--body); font-size:20px; color:var(--sage-70); transition:transform .15s}
.staff.open .stoggle .chev{transform:rotate(90deg)}
.staff .sbody{display:none; padding:2px 0 12px}
.staff.open .sbody{display:block}
.staff .sline{font-size:14px; color:var(--sage-70); padding:12px 0}
.staff .sline.plain{padding:14px 0}
.sdept{font-size:10px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:14px 0 2px}
.sdept:first-child{margin-top:4px}
.pp{display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; padding:8px 0; border-top:1px solid var(--mist)}
.pp .pn{flex:1 1 170px; min-width:0; overflow-wrap:anywhere}
.pp .pn b{font-weight:600}
.pp .pn .pj{color:var(--sage-70); font-size:13px}
.pp .pt{font-family:var(--display); font-size:20px; color:var(--sage); white-space:nowrap}
.pp .tag{margin-left:4px; vertical-align:2px}
.soff{font-size:14px; padding-top:12px; margin-top:6px; border-top:1px solid var(--mist); overflow-wrap:anywhere}
.soff b{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-right:6px}
.muted{color:var(--sage-70)} .empty{padding:14px 0; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
@media (max-width:640px){ .shell{padding:0 12px 48px} .topin,.daysin{padding-left:12px;padding-right:12px} .pagehead h2{font-size:25px} .pagehead .date{font-size:21px} .stat .v{font-size:32px} }
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>This Week - Managers</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are and what you can see.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">This Week - Managers<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="days" aria-label="Days"><div class="daysin" id="chips"></div></nav>
  <div class="shell"><div id="view"><div class="loading">Loading…</div></div></div>
</div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const S = { data:null, idx:0, sr:null, view:"day", staff:{ state:"loading", byDate:{}, note:"" }, open:{} };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dateOf = iso => new Date(iso + "T12:00:00Z");
const ord = n => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
function longDay(iso){
  const d = dateOf(iso);
  const wd = d.toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"long" });
  const mo = d.toLocaleDateString("en-GB",{ timeZone:"UTC", month:"long" });
  return `${wd} ${ord(d.getUTCDate())} ${mo}`;
}
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/week-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
// Staffing comes from Planday through planday-api. It is extra: if it fails, everything else still works.
async function staffCall(payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/planday-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action:"staffing.week", app_key:"this-week-managers", staff_email: staffEmail(), ...(payload||{}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error || !Array.isArray(d.days)) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}
const num = v => (v === null || v === undefined) ? null : Math.round(v);

function chips(){
  const days = S.data.days;
  $("#chips").innerHTML = days.map((d,i) => {
    const dt = dateOf(d.date);
    const top = i === 0 ? "Today" : i === 1 ? "Tomorrow" : dt.toLocaleDateString("en-GB",{ timeZone:"UTC", weekday:"short" });
    const sub = `${dt.getUTCDate()} ${dt.toLocaleDateString("en-GB",{ timeZone:"UTC", month:"short" })}`;
    return `<button class="daybtn" data-i="${i}" ${i===S.idx?'aria-current="page"':""}><b>${top}</b><span>${sub}</span></button>`;
  }).join("");
  const cur = $("#chips .daybtn[aria-current]"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ inline:"center", block:"nearest" });
}

function stat(label, v){
  const n = num(v);
  return `<div class="stat"><div class="l">${esc(label)}</div><div class="v${n===null?" none":""}">${n===null?"–":n}</div></div>`;
}
function venueTag(v){ return `<span class="tag ${v==="Marquee"?"marquee":v==="George Ridley"?"george":""}">${esc(v)}</span>`; }

const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function personRow(p){
  return `<div class="pp"><div class="pn"><b>${esc(p.name)}</b>${p.job ? `<span class="pj">, ${esc(p.job)}</span>` : ""}${p.draft ? ` <span class="tag draft">Not published yet</span>` : ""}</div><div class="pt">${esc(p.start)}–${esc(p.end)}</div></div>`;
}
function staffBlock(d){
  const st = S.staff;
  if (st.state === "loading") return `<div class="card staff"><div class="sline plain">Loading staffing…</div></div>`;
  const sd = st.state === "ok" ? st.byDate[d.date] : null;
  if (!sd) return `<div class="card staff"><div class="sline plain">Staffing isn't available yet.</div></div>`;
  const open = S.open[d.date] !== undefined ? S.open[d.date] : d.date === S.data.days[0].date;
  const depts = sd.departments || [];
  const on = depts.filter(x => x.count > 0 || (x.people && x.people.length));
  const none = depts.filter(x => !on.includes(x)).map(x => x.dept_name);
  const off = (sd.off || []).map(o => esc(o.name) + (o.job ? ` (${esc(o.job)})` : "")).join(", ");
  const id = "staff-" + d.date;
  return `<div class="card staff${open ? " open" : ""}" data-date="${esc(d.date)}">
    <button class="stoggle" data-staff="${esc(d.date)}" aria-expanded="${open}" aria-controls="${id}"><span>Staffing</span><span class="scount">(${num(sd.total) ?? 0})</span><span class="chev" aria-hidden="true">›</span></button>
    <div class="sbody" id="${id}">
      ${on.length ? on.map(x => `<div class="sdept">${esc(x.dept_name)} · ${num(x.count) ?? 0}</div>${(x.people || []).map(personRow).join("")}`).join("") : `<div class="sline plain" style="padding-top:4px">Nobody rostered yet.</div>`}
      ${none.length && on.length ? `<div class="sline" style="padding-bottom:0">Nobody on: ${none.map(esc).join(", ")}.</div>` : ""}
      ${sd.open ? `<div class="sline" style="padding-bottom:0">${esc(plural(sd.open, "open shift has", "open shifts have"))} nobody assigned.</div>` : ""}
      <div class="soff"><b>Off</b>${off || '<span class="muted">nobody booked off</span>'}</div>
    </div>
  </div>`;
}
function refreshStaff(){
  const slot = $("#staffslot"); if (!slot || S.view !== "day") return;
  slot.innerHTML = staffBlock(S.data.days[S.idx]);
  const f = $("#staffnote"); if (f) f.textContent = S.staff.state === "ok" && S.staff.note ? S.staff.note : "";
}
async function loadStaffing(){
  try {
    const d = await staffCall({ from: S.data.days[0].date, days: S.data.days.length });
    const by = {}; d.days.forEach(x => { by[x.date] = x; });
    S.staff = { state:"ok", byDate:by, note: d.drafts_note || "" };
  } catch(e){ S.staff = { state:"off", byDate:{}, note:"" }; }
  refreshStaff();
}

function day(){
  S.sr = null; S.view = "day";
  const d = S.data.days[S.idx];
  const title = S.idx === 0 ? "Today at the Black Horse Beamish" : S.idx === 1 ? "Tomorrow at the Black Horse Beamish" : "At the Black Horse Beamish";
  const ev = d.events.length ? d.events.map((e,i) => {
    const g = e.guests !== null && e.guests !== undefined ? `${num(e.guests)} guests` : "Guests not set";
    const eve = e.evening_guests ? ` · ${num(e.evening_guests)} in the evening` : "";
    return `<button class="row" data-ev="${i}"><div class="main"><div class="t">${esc(e.name)}</div><div class="m">${esc(e.type ? e.type + " · " : "")}${g}${eve}</div></div>${venueTag(e.venue)}<div class="go">›</div></button>`;
  }).join("") : `<div class="empty">No events.</div>`;
  const sr = d.showrounds.length ? d.showrounds.map((s,i) =>
    `<button class="row" data-sr="${i}"><div class="time">${esc(s.time)}</div><div class="main"><div class="t">${esc(s.name)}</div><div class="m">Drink: ${esc(s.drink || "not given")}</div><div class="m">Song: ${esc(s.song || "not given")}</div></div><div class="go">›</div></button>`
  ).join("") : `<div class="empty">No show-rounds.</div>`;
  const when = S.idx === 0 ? "today" : S.idx === 1 ? "tomorrow" : "on " + longDay(d.date).split(" ")[0];
  $("#view").innerHTML = `
    <div class="pagehead"><h2>${title}</h2><div class="date">${longDay(d.date)}</div></div>
    <div class="grid">
      ${stat("Rooms to clean", d.rooms_to_clean)}
      ${stat("Rooms sold tonight", d.rooms_sold)}
      ${stat("Breakfast covers expected", d.breakfast)}
      ${stat("Lunch covers booked", d.lunch)}
      ${stat("Dinner covers booked", d.dinner)}
    </div>
    <div id="staffslot">${staffBlock(d)}</div>
    <div class="card"><h3>Events ${when}</h3>${ev}</div>
    <div class="card"><h3>Show-rounds ${when}</h3>${sr}</div>
    <div class="muted" style="font-size:12px;margin-bottom:6px" id="staffnote">${esc(S.staff.state === "ok" && S.staff.note ? S.staff.note : "")}</div>
    <div class="muted" style="font-size:12px">${S.data.forecast_updated ? "Rooms and covers last updated " + new Date(S.data.forecast_updated).toLocaleString("en-GB",{ timeZone:"Europe/London", weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }) + "." : "No forecast figures loaded yet."}</div>`;
}

function eventView(i){
  const d = S.data.days[S.idx], e = d.events[i]; if (!e) return;
  S.view = "detail";
  const log = e.notes_log || [];
  const when = iso => new Date(iso).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  const line = (l, v) => v ? `<div class="ans"><div class="al">${esc(l)}</div><div class="av">${v}</div></div>` : "";
  const g = e.guests !== null && e.guests !== undefined ? `${num(e.guests)}${e.evening_guests ? " day, " + num(e.evening_guests) + " evening" : ""}` : "";
  $("#view").innerHTML = `
    <div class="pagehead"><button class="btn" id="back">‹ Back to ${esc(longDay(d.date))}</button></div>
    <div class="card">
      <h3>${esc(e.name)}</h3>
      <div class="dl">
        ${line("When", esc(longDay(d.date)))}
        ${line("Type", esc(e.type))}
        ${line("Venue", esc(e.venue))}
        ${line("Guests", esc(g))}
        ${line("Status", esc(e.status))}
        ${line("Next action", esc(e.next_action))}
      </div>
    </div>
    <div class="card"><h3>Booking notes</h3><div class="dl">
      ${e.notes ? `<div class="ans"><div class="av">${esc(e.notes)}</div></div>` : ""}
      ${log.map(n => `<div class="ans"><div class="al">${esc(n.author || "Note")} · ${esc(when(n.at))}</div><div class="av">${esc(n.body)}</div></div>`).join("")}
      ${!e.notes && !log.length ? `<div class="empty">No notes on this booking.</div>` : ""}
    </div></div>`;
  window.scrollTo(0, 0);
}

function showround(i){
  const d = S.data.days[S.idx], s = d.showrounds[i]; if (!s) return;
  S.sr = i; S.view = "detail";
  const loc = s.location && (s.location.location || s.location.type) ? String(s.location.location || s.location.type) : "";
  const booked = s.booked_at ? new Date(s.booked_at).toLocaleString("en-GB",{ timeZone:"Europe/London", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) : "";
  const line = (l, v) => v ? `<div class="ans"><div class="al">${esc(l)}</div><div class="av">${v}</div></div>` : "";
  $("#view").innerHTML = `
    <div class="pagehead"><button class="btn" id="back">‹ Back to ${esc(longDay(d.date))}</button></div>
    <div class="card">
      <h3>${esc(s.name)}</h3>
      <div class="dl">
        ${line("When", `${esc(longDay(d.date))}, ${esc(s.time)}${s.end_time ? " – " + esc(s.end_time) : ""}`)}
        ${line("Tour", esc(s.event_name))}
        ${line("Drinks", esc(s.drink))}
        ${line("Phone", s.phone ? `<a href="tel:${esc(s.phone.replace(/\s+/g,""))}">${esc(s.phone)}</a>` : "")}
        ${line("Email", s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : "")}
        ${line("Location", esc(loc))}
        ${line("Booked", esc(booked))}
      </div>
    </div>
    <div class="card"><h3>Their answers</h3><div class="dl">
      ${s.questions.length ? s.questions.map(x => `<div class="ans"><div class="al">${esc(x.question)}</div><div class="av">${esc(x.answer)}</div></div>`).join("") : `<div class="empty">No answers recorded.</div>`}
    </div></div>
    ${(s.reschedule_url || s.cancel_url) ? `<div class="muted" style="font-size:13px">${s.reschedule_url ? `<a href="${esc(s.reschedule_url)}" target="_blank" rel="noopener">Reschedule</a>` : ""}${s.reschedule_url && s.cancel_url ? " · " : ""}${s.cancel_url ? `<a href="${esc(s.cancel_url)}" target="_blank" rel="noopener">Cancel</a>` : ""}</div>` : ""}`;
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-staff]");
  if (t) {
    const date = t.dataset.staff, card = t.closest(".staff"), now = !card.classList.contains("open");
    S.open[date] = now; card.classList.toggle("open", now); t.setAttribute("aria-expanded", String(now)); return;
  }
  const c = e.target.closest(".daybtn"); if (c) { S.idx = +c.dataset.i; chips(); day(); return; }
  const r = e.target.closest("[data-sr]"); if (r) { showround(+r.dataset.sr); return; }
  const v = e.target.closest("[data-ev]"); if (v) { eventView(+v.dataset.ev); return; }
  if (e.target.closest("#back")) day();
});

function openGate(msg){ $("#gate").hidden = false; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false;
  try { S.data = await call("week"); }
  catch(e){ $("#view").innerHTML = `<div class="card">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  $("#whoname").textContent = S.data.me.name;
  chips(); day();
  loadStaffing();
}
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
</body>
</html>
