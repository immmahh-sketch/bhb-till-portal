<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forecast — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --blue:#1F4E8C; --blue-bg:#E7EEF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
.shell{max-width:1500px; margin:0 auto; padding:0 20px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px}
#gate[hidden]{display:none}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:1500px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:1500px; margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; min-height:40px}
.btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.small{min-height:34px; padding:5px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:var(--ink)}
.btn:disabled{opacity:.5; cursor:default}
.linkbtn{background:none; border:0; padding:0; color:var(--sage); cursor:pointer; font-size:13px; font-weight:600; text-decoration:underline}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px}
.card h3{font-size:22px; color:var(--sage); margin-bottom:10px}
.muted{color:var(--sage-70)} .empty{padding:40px 20px; text-align:center; color:var(--sage-70)} .loading{padding:60px; text-align:center; color:var(--sage-70)}
.err{color:var(--alert)}
.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px; z-index:400; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.tag{display:inline-block; border-radius:999px; padding:3px 10px; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:var(--sage-10); color:var(--sage); white-space:nowrap}
.tag.warn{background:var(--attention-bg); color:#6d5320} .tag.good{background:var(--good-bg); color:var(--good)} .tag.blue{background:var(--blue-bg); color:var(--blue)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin:0 0 12px; font-size:14px}
.field{margin-bottom:12px} .field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:4px}
.field input,.field textarea,.field select{width:100%; padding:10px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white)}

.spacer{margin-left:auto}
.chips{display:flex; gap:6px 8px; flex-wrap:wrap; margin:0 0 12px; align-items:center}
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:12px}

/* ---- the grid ---- */
.gridwrap{overflow:auto; border:1px solid var(--mist); border-radius:var(--radius); background:var(--white); position:relative}
@media (min-width:900px){ .gridwrap{max-height:calc(100vh - 120px)} }
table.fg{border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed}
table.fg th, table.fg td{padding:4px 6px; border-bottom:1px solid #f0f0ee; border-right:1px solid #f4f4f2; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; background:var(--white); overflow:hidden; text-overflow:ellipsis}
table.fg thead th{position:sticky; top:0; z-index:3; background:var(--sage-10); font-size:11px; font-weight:700; color:var(--sage); line-height:1.25; cursor:default}
table.fg th.ln, table.fg td.ln{position:sticky; left:0; z-index:2; text-align:left; white-space:normal; border-right:2px solid var(--celadon); background:var(--white)}

table.fg thead th.d{cursor:pointer} table.fg thead th.d:hover{background:#dfe5df}
table.fg thead th.act{background:var(--attention-bg); box-shadow:inset 0 -3px 0 var(--gold)}
table.fg thead th.today{box-shadow:inset 0 -3px 0 var(--sage)}
table.fg thead th.agg{background:#dfe8df}
table.fg td.act{background:#fbf8f1}
table.fg td.agg{background:#f1f5f1; font-weight:600}
table.fg td.sep, table.fg th.sep{border-left:2px solid var(--celadon)}
table.fg td.ed{cursor:pointer} table.fg td.ed:hover{outline:2px solid var(--gold); outline-offset:-2px}
table.fg td.ov{color:var(--blue); font-weight:700; box-shadow:inset 3px 0 0 var(--blue)}
table.fg td.srcw{color:#3b483c; box-shadow:inset 3px 0 0 var(--celadon)}
table.fg td.pend{background:#fff3c4 !important; box-shadow:inset 3px 0 0 var(--attention)}
table.fg td.neg{color:var(--alert)}
table.fg tr.sec td{background:var(--sage); color:#fff; font-family:var(--display); font-size:16px; font-weight:600; text-align:left; padding:4px 10px; cursor:pointer; border-right:0}
table.fg tr.sec td.ln{background:var(--sage); overflow:visible}
table.fg tr.sec td.fill{padding:0}
table.fg tr.bold td{font-weight:700}
table.fg tr.line:hover td{background:#fbfbf6} table.fg tr.line:hover td.ln{background:#fbfbf6}
table.fg td input.cin{width:78px; padding:3px 5px; border:2px solid var(--gold); border-radius:5px; text-align:right; font-size:13px; font-variant-numeric:tabular-nums}
.lnin{display:flex; justify-content:space-between; gap:6px; align-items:center}
.pop{position:absolute; z-index:60; background:var(--white); border:1px solid var(--celadon); border-radius:8px; box-shadow:var(--shadow); padding:8px; display:flex; flex-direction:column; gap:6px; min-width:220px}
.pop .t{font-size:12px; color:var(--sage-70)}

/* ---- tables ---- */
table.dt{border-collapse:collapse; width:100%; font-size:14px}
table.dt th{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage); text-align:right; padding:6px 10px; border-bottom:2px solid var(--celadon); white-space:nowrap}
table.dt td{padding:7px 10px; border-bottom:1px solid var(--mist); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
table.dt th:first-child, table.dt td:first-child{text-align:left}
table.dt tr.tot td{font-weight:700; background:var(--sage-10)}
.scrollx{overflow-x:auto}
table.su input{width:70px; padding:6px 6px; border:1px solid var(--mist); border-radius:6px; text-align:right; font-size:14px}
table.su td, table.su th{padding:4px 5px; text-align:center; white-space:normal} table.su th{font-size:10px; max-width:96px; vertical-align:bottom}
table.su td:first-child{font-weight:700; text-align:left}
table.su td.ref input{background:var(--bone); color:var(--sage-70)}

/* ---- imports ---- */
.drop{border:2px dashed var(--celadon); border-radius:var(--radius); padding:26px 18px; text-align:center; background:var(--bone)}
.drop.over{border-color:var(--sage); background:var(--sage-10)}
.drop p{margin:0 0 12px; color:var(--sage-70)}
.drop input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.fcard{border:1px solid var(--mist); border-radius:8px; padding:10px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
.fcard .fn{font-weight:600; overflow-wrap:anywhere} .fcard .fd{font-size:13px; color:var(--sage-70)}
.fcard.bad{border-color:var(--alert); background:var(--alert-bg)}
.cols2{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px}

/* ---- workbook viewer ---- */
.wbbar{display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
.wbbar input[type=search]{padding:9px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; background:var(--white); width:220px; max-width:100%}
.xgwrap{overflow:auto; max-height:72vh; border:1px solid var(--mist); border-radius:var(--radius); background:#fff; position:relative}
@media (min-width:900px){ .xgwrap{max-height:calc(100vh - 270px); min-height:360px} }
table.xg{border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed}
table.xg th{background:#f1f1ee; color:var(--sage-70); font-weight:600; font-size:11px; text-align:center; border-right:1px solid #dcdcd8; border-bottom:1px solid #dcdcd8; padding:2px 4px; position:sticky; top:0; z-index:3; overflow:hidden}
table.xg th.rn{left:0; top:auto; z-index:2; text-align:right; width:46px; min-width:46px; padding-right:6px}
table.xg thead th.rn{top:0; z-index:5}
table.xg td{border-right:1px solid #ececea; border-bottom:1px solid #ececea; padding:2px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; height:23px; background:#fff; position:relative}
table.xg td.n{text-align:right} table.xg td.ng{color:var(--alert)} table.xg td.b{font-weight:700}
table.xg td.fz{position:sticky; left:46px; z-index:1; border-right:2px solid #cfcfca}
table.xg td.hit{background:#fff0a8 !important} table.xg td.hitcur{background:#ffc94d !important; box-shadow:inset 0 0 0 2px #b08d57}
.shtabs{display:flex; gap:4px; overflow-x:auto; padding:8px 2px 2px; margin-top:6px; border-top:1px solid var(--mist)}
.shtabs button{flex:0 0 auto; border:1px solid var(--mist); border-top:0; border-radius:0 0 8px 8px; background:#f3f3f1; padding:8px 14px; min-height:40px; cursor:pointer; font-size:13px; white-space:nowrap}
.shtabs button[aria-pressed="true"]{background:var(--white); color:var(--sage); font-weight:700; box-shadow:inset 0 -3px 0 var(--gold)}
@media (max-width:640px){
  .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px;padding-right:12px}
  .mbar h2{font-size:24px; min-width:0; flex:1}
  .btn{padding:9px 12px}
  table.fg th.ln, table.fg td.ln{min-width:150px; max-width:160px; font-size:12px}
}
</style>

<script type="module">
import { LINES, computeMonth, monthDates, WD, SETUP_COLS, addDays } from "./engine.js";
import { parseFile } from "./parse.js";
import { buildWorkbook, fmtOf, SETUP_NAMES } from "./export.js";

const CFG = { URL:"https://safcrtrfdzsnftghibot.supabase.co/functions/v1/forecast-api", KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU",
  SHEETJS:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", EXCELJS:"https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isNum = n => typeof n === "number" && isFinite(n);

const monthName = ym => MONTHS[+ym.slice(5) - 1] + " " + ym.slice(0, 4);
const addMonths = (ym, n) => { let y = +ym.slice(0, 4), m = +ym.slice(5) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + String(m + 1).padStart(2, "0"); };
const fmtDT = iso => { if (!iso) return ""; try { return new Date(iso).toLocaleString("en-GB", { timeZone:"Europe/London", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }).replace(",", ""); } catch (e) { return ""; } };
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 5200 : 2600); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch (e) { return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.URL, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.KEY, apikey:CFG.KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) });

/* ------------------------------------------------------------------ state */
const S = { me:null, tabs:null, view:"month", ym:"", data:null, range:null, pending:new Map(), collapsed:lsGet("fc_collapsed", { "Rooms detail":true, "Prior year":true, "Housekeeping":true, "Labour":true, "KPIs":false }),
  showWeekdays:lsGet("fc_wd", false), lockSnap:null, imp:{ files:[], busy:false, result:null }, log:null, wb:null, calcCache:{}, setupDraft:null, editing:null };

/* ------------------------------------------------------------------ data */
async function loadRange(ym){
  const from = addMonths(ym, -1), to = addMonths(ym, 14);

function inputFor(ym){

function calc(ym, withPending = true){

}
const srcOf = (day, key) => { if (S.pending.has(day + "|" + key)) return "pending"; const r = S.data.days.find(x => x.day === day); return r && r.ov && r.ov[key] !== undefined ? (r.ov_src && r.ov_src[key]) || "typed" : ""; };
const dayRow = day => S.data.days.find(x => x.day === day);

/* ------------------------------------------------------------------ formatting */
const FMTS = { n0:v => Math.round(v).toLocaleString("en-GB"), n1:v => (Math.round(v * 10) / 10).toLocaleString("en-GB", { minimumFractionDigits:1, maximumFractionDigits:1 }), n2:v => v.toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 }),

}
async function go(v){
  S.view = v; $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === v ? "page" : "false")); closePop(); window.scrollTo(0, 0);
  if (!S.data) return;
  if (v === "month") { await loadLock(); viewMonth(); }
  else if (v === "summary") viewSummary();
  else if (v === "imports") viewImports();
  else if (v === "setup") viewSetup();
  else if (v === "workbook") viewWorkbook();
}
const render = () => go(S.view);
function openGate(){ $("#gate").hidden = false; $("#app").hidden = true; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch (e) {} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<div class="loading">Loading the forecast…</div>`;
  try {
    const who = await call("whoami"); S.me = { name:who.name, admin:who.admin }; S.tabs = who.tabs; $("#whoname").textContent = who.name;
    $$(".tabbtn").forEach(b => { if (!S.tabs.includes(b.dataset.view)) b.remove(); });
    $$(".tabbtn").forEach(b => b.addEventListener("click", () => { if (S.pending.size && !confirm("You have changes that are not saved. Leave them behind?")) return; go(b.dataset.view); }));
    S.ym = todayYmd().slice(0, 7);
    await loadRange(S.ym);
  } catch (e) { $("#views").innerHTML = `<div class="empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  const first = $(".tabbtn"); go(first ? first.dataset.view : "month");
}
window.addEventListener("beforeunload", e => { if (S.pending && S.pending.size) { e.preventDefault(); e.returnValue = ""; } });
(function(){ if (staffEmail()) { $("#gate").hidden = true; boot(); } else openGate(); })();
</script>
</body>
</html>
