<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stock Control - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C; --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --alert:#8C4A3F; --alert-bg:#F6EAE8; --red:#B3261E; --good:#2F5B31; --good-bg:#EDF2ED; --attn:#B08D57; --attn-bg:#F7F0E4;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif; --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:1240px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important} a{color:var(--sage)}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15} .gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 80px}
header.top{background:var(--sage); color:var(--white)} .topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1} .brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9} .who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)} .tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 14px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2}
.btn:hover{background:var(--sage-dark)} .btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)} .btn.small{min-height:34px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.solid-danger{background:var(--red); border-color:var(--red)} .btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:8px 15px; cursor:pointer; font-size:14px; min-height:40px} .chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px} .card h3{font-size:24px; color:var(--sage); margin-bottom:4px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.pagehead{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:22px 0 6px} .pagehead h2{font-size:30px; color:var(--sage); line-height:1.1; margin-right:auto}
.lead{color:var(--sage-70); font-size:14px; margin:2px 0 14px; max-width:780px}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0} .field label,.lbl{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)}
.field input,.field select,.field textarea,.cell input,.cell select,input.in,select.in{border:1px solid var(--celadon); border-radius:8px; padding:10px 11px; background:#fff; width:100%; min-height:42px}
.grid{display:grid; gap:0 14px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:900; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.notice{background:var(--attn-bg); border-left:4px solid var(--attn); padding:10px 14px; border-radius:6px; font-size:13px; margin:0 0 12px} .notice.bad{background:var(--alert-bg); border-color:var(--red)}
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto} .modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:640px; padding:20px 22px}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
/* tables */
.tw{overflow:auto; border:1px solid var(--mist); border-radius:var(--radius); background:#fff; max-height:75vh}
table.t{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
table.t th{position:sticky; top:0; z-index:2; background:var(--sage-10); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sage); text-align:left; padding:9px 8px; white-space:nowrap; border-bottom:1px solid var(--mist); cursor:default}
table.t th.sortable{cursor:pointer} table.t td{padding:6px 8px; border-bottom:1px solid var(--mist); vertical-align:middle} table.t .n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.t td input,table.t td select{border:1px solid var(--celadon); border-radius:6px; padding:6px 8px; min-height:34px; background:#fff; width:100%; min-width:70px} table.t td input[type=checkbox]{width:20px; min-width:20px; min-height:20px}
table.t tr.cat td{background:var(--sage-10); font-family:var(--display); font-size:17px; color:var(--sage)} table.t .bad{color:var(--red); font-weight:700} table.t .good{color:var(--good); font-weight:700}
.stat{display:flex; gap:14px; flex-wrap:wrap; margin:0 0 14px} .stat .s{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 16px; flex:1 1 160px} .stat .l{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)} .stat .v{font-family:var(--display); font-size:28px; line-height:1.15; color:var(--sage)}
.tag{font-size:10px; letter-spacing:.08em; font-weight:700; padding:2px 6px; border-radius:4px; background:var(--sage-10); color:var(--sage-70); text-transform:uppercase}
/* counting */
.count{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 14px; padding:12px 14px; border-bottom:1px solid var(--mist); align-items:center}
.count .nm{font-weight:600} .count .sub{font-size:12px; color:var(--sage-70)} .count .ins{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.count input{width:92px; min-height:46px; font-size:18px; text-align:center; border:1px solid var(--celadon); border-radius:8px} .count .ok{color:var(--good); font-size:12px; font-weight:700; min-width:60px; text-align:right}
@media(max-width:700px){ .count{grid-template-columns:1fr} .count .ins{justify-content:flex-start} }
details.sec{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px} details.sec>summary{padding:14px 18px; cursor:pointer; font-family:var(--display); font-size:24px; color:var(--sage); list-style:none} details.sec>summary::-webkit-details-marker{display:none} details.sec>summary::before{content:"+ "; color:var(--gold)} details.sec[open]>summary::before{content:"- "} details.sec>.in{padding:0 18px 16px}
.chk{display:flex; gap:8px; align-items:center; font-size:14px; cursor:pointer}
</style>
</head>
<body>
<div id="gate"><div class="gatecard"><h1>Stock Control</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="notice bad" id="gerr" style="display:none;margin-top:12px"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Stock Control<small>Black Horse Beamish</small></div><div class="who"><span id="whoname"></span><button id="signout" type="button">Sign out</button></div></div></header>
  <nav class="tabs" aria-label="Sections"><div class="tabsin" id="tabs"></div></nav>
  <main class="shell" id="views"></main>
</div>
<div id="modalroot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filepick" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="parsers.js?v=20261012"></script>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const TABS = [["wastage", "Wastage"], ["rooms", "Rooms"], ["weddings", "Weddings / Events"], ["showrounds", "Showrounds / meetings"], ["admin", "Stocktake - Admin"], ["stocktake", "Stocktake"], ["report", "Stock report"]];
const DAILY = {
  wastage:    { title:"Wastage", lead:"Record any drink that is wasted today: breakages, spoilage, staff drinks. At cash up it is posted to the till at £0 so the stock comes off.", note:null },
  rooms:      { title:"Rooms", lead:"Anything complimentary to a bedroom today. It starts on Prosecco: change the product if it was something else.", note:"Room number (optional)", pref:/prosecco/i },
  weddings:   { title:"Weddings / Events", lead:"Bottles of Prosecco, house wine and bottled beer used at a wedding or event as part of a package.", note:"Which wedding or event", need:true },
  showrounds: { title:"Showrounds / meetings", lead:"Drinks given to couples on showrounds, or at meetings.", note:"Which couple or meeting", need:true },
};
const UOM = { unit:"Per unit", keg:"Kegs", bottle:"Bottles" };
const KIND_NAME = { wastage:"Wastage", rooms:"Rooms", weddings:"Wedding / event", showrounds:"Showround / meeting" };
const S = { me:null, boot:null, tab:null, products:[], areas:[], period:null, daily:null, area:"", q:"", all:false, counts:new Map(), casesMode:new Set(), rep:null, repSort:"value", repOnly:false, repPeriod:null, periods:[], M:null, plu:null, invs:null, adm:{ q:"" } };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fnum = (n, dp = 2) => n === null || n === undefined || n === "" ? "" : String(+Number(n).toFixed(dp));
const gbp = n => n === null || n === undefined ? "" : (n < 0 ? "-" : "") + "£" + Math.abs(n).toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 });
const ukDay = iso => iso ? new Date(String(iso).slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", day:"numeric", month:"short", year:"numeric" }).replace("Sept", "Sep") : "";
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 6000 : 2400); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/stock-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload || {}) }) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if ((!r.ok && r.status !== 409) || (d.error && r.status !== 409)) throw new Error(d.error || `Request failed (${r.status})`);
  d._status = r.status; return d;
}
function openModal(html){ closeModal(); const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg"; bg.innerHTML = `<div class="modal">${html}</div>`; bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); }); $("#modalroot").appendChild(bg); }
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); }
const productById = id => S.products.find(p => p.id === id);
const areaById = id => S.areas.find(a => a.id === id);
const beverageProducts = () => S.products.filter(p => p.active).sort((a, b) => (a.category || "~").localeCompare(b.category || "~") || a.name.localeCompare(b.name));

/* ------------------------------------------------------------- tabs */
function setTabs(){
  const mine = TABS.filter(([k]) => S.me.tabs.includes(k));
  if (!mine.some(([k]) => k === S.tab)) S.tab = mine[0] ? mine[0][0] : null;
  $("#tabs").innerHTML = mine.map(([k, l]) => `<button class="tabbtn" data-tab="${k}" aria-current="${k === S.tab ? "page" : "false"}">${l}</button>`).join("");
}
async function show(tab){
  S.tab = tab; setTabs(); window.scrollTo(0, 0);
  if (!tab) { $("#views").innerHTML = `<div class="card">You do not have any tabs in Stock Control yet. Ask the GM.</div>`; return; }
  $("#views").innerHTML = `<p class="muted" style="margin-top:24px">Loading…</p>`;
  try {
    if (DAILY[tab]) await showDaily(tab); else if (tab === "stocktake") await showCount(); else if (tab === "report") await showReport(); else await showAdmin();
  } catch(e){ $("#views").innerHTML = `<div class="card"><b>${esc(e.message)}</b></div>`; }
}
async function refreshBoot(){ S.boot = await call("bootstrap"); S.products = S.boot.products; S.areas = S.boot.areas; S.period = S.boot.period; }

/* ------------------------------------------------------------- daily tabs */
async function showDaily(kind){
  const d = DAILY[kind]; const r = await call("usage.list", { kind });
  S.daily = { kind, date:r.date, rows:r.rows, filter:"", product:"", qty:"", reason:"", note:"" };
  const pref = d.pref && beverageProducts().find(p => d.pref.test(p.name)); if (pref) S.daily.product = pref.id;
  renderDaily();
}
function productOptions(selected, filter){
  const f = (filter || "").toLowerCase().trim(); let cur = null, html = `<option value="">Choose a product…</option>`;
  for (const p of beverageProducts()) {
    if (f && !p.name.toLowerCase().includes(f) && p.id !== selected) continue;
    const c = p.category || "Other"; if (c !== cur) { if (cur !== null) html += `</optgroup>`; html += `<optgroup label="${esc(c)}">`; cur = c; }
    html += `<option value="${p.id}"${p.id === selected ? " selected" : ""}>${esc(p.name)}</option>`;
  }
  return html + (cur !== null ? `</optgroup>` : "");
}
function renderDaily(){
  const D = S.daily, d = DAILY[D.kind], keep = window.scrollY;
  const today = new Date(D.date + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone:"UTC", weekday:"long", day:"numeric", month:"long" });
  const none = !beverageProducts().length;
  $("#views").innerHTML = `<div class="pagehead"><h2>${esc(d.title)}</h2><span class="small muted">Today: ${esc(today)}</span></div><p class="lead">${esc(d.lead)}</p>
    ${none ? `<div class="notice">There are no products yet. The GM adds them in Stocktake - Admin.</div>` : ""}
    <div class="card"><div class="grid">
      <div class="field" style="grid-column:span 2"><label>Product</label><input class="in" id="d_filter" placeholder="Type to narrow the list…" value="${esc(D.filter)}" style="margin-bottom:6px"><select class="in" id="d_product" size="1">${productOptions(D.product, D.filter)}</select></div>
      <div class="field"><label>Quantity</label><input class="in" id="d_qty" type="number" min="0.5" step="0.5" inputmode="decimal" value="${esc(D.qty)}" placeholder="How many"></div>
      ${D.kind === "wastage" ? `<div class="field"><label>Reason</label><select class="in" id="d_reason"><option value="">Choose…</option>${S.boot.reasons.map(r => `<option${D.reason === r ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></div>` : ""}
      ${d.note ? `<div class="field"><label>${esc(d.note)}</label><input class="in" id="d_note" maxlength="200" value="${esc(D.note)}"></div>` : ""}
    </div><div class="row-actions" style="margin-top:0"><button class="btn" data-act="add">Add</button></div></div>
    <div class="card"><h3>Today's lines</h3>${D.rows.length ? `<div class="tw"><table class="t"><thead><tr><th>Time</th><th>Product</th><th class="n">Qty</th><th>${D.kind === "wastage" ? "Reason" : "Details"}</th><th>Added by</th><th>Till</th><th></th></tr></thead><tbody>${D.rows.map(r => {
      const p = productById(r.product_id), time = new Date(r.created_at).toLocaleTimeString("en-GB", { timeZone:"Europe/London", hour:"2-digit", minute:"2-digit" });
      return `<tr><td>${time}</td><td><b>${esc(p ? p.name : "?")}</b></td><td class="n"><b>${fnum(r.qty)}</b></td><td>${esc([r.reason, r.note].filter(Boolean).join(": "))}</td><td>${esc(r.created_by)}</td><td>${r.posted_at ? `<span class="good">Posted &#10003;</span>` : `<span class="muted">Waiting for cash up</span>`}</td><td class="n">${r.posted_at ? "" : `<button class="btn small danger" data-act="del" data-id="${r.id}">Remove</button>`}</td></tr>`;
    }).join("")}</tbody></table></div>` : `<p class="muted">Nothing recorded today yet.</p>`}
    <p class="tiny muted" style="margin:8px 0 0">These lines appear in the totals at cash up, where each is posted to the till at a price of £0 and confirmed.</p></div>`;
  window.scrollTo(0, keep);
}

/* ------------------------------------------------------------- stocktake: counting */
async function showCount(){
  const r = await call("count.load", {}); S.counts = new Map(r.counts.map(c => [c.area_id + "|" + c.product_id, c])); S.period = r.period;
  S.casesMode = new Set(r.counts.filter(c => c.cases !== null).map(c => c.area_id + "|" + c.product_id));
  if (!S.area || !areaById(S.area)) S.area = S.areas[0] ? S.areas[0].id : "";
  renderCount();
}
function renderCount(keepFocus){
  const a = areaById(S.area), q = S.q.toLowerCase().trim();
  const inArea = beverageProducts().filter(p => S.all || p.areas.includes(S.area));
  const shown = inArea.filter(p => !q || p.name.toLowerCase().includes(q) || (p.category || "").toLowerCase().includes(q));
  const done = inArea.filter(p => S.counts.has(S.area + "|" + p.id)).length;
  let cat = null, rows = "";
  for (const p of shown) {
    if ((p.category || "Other") !== cat) { cat = p.category || "Other"; rows += `<div class="count" style="background:var(--sage-10)"><b style="font-family:var(--display);font-size:18px;color:var(--sage)">${esc(cat)}</b><span></span></div>`; }
    const key = S.area + "|" + p.id, c = S.counts.get(key), cm = S.casesMode.has(key) && p.case_size;
    rows += `<div class="count" data-key="${key}"><div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(UOM[p.uom])}${p.case_size ? ` · case of ${p.case_size}` : ""}${!p.areas.includes(S.area) ? " · not normally kept here" : ""}${c ? ` · counted ${fnum(c.units)} by ${esc(c.counted_by || "?")}` : ""}</div></div>
      <div class="ins">${p.case_size ? `<button class="chip" data-act="cases" data-key="${key}" aria-pressed="${!!cm}" style="min-height:40px">${cm ? "Counting in cases" : "Count in cases"}</button>` : ""}
      ${cm ? `<input data-f="cases" inputmode="decimal" placeholder="cases" value="${c && c.cases !== null ? fnum(c.cases) : ""}" aria-label="Cases of ${esc(p.name)}"><span class="sub">cases +</span><input data-f="loose" inputmode="decimal" placeholder="loose" value="${c && c.loose !== null ? fnum(c.loose) : ""}" aria-label="Loose units of ${esc(p.name)}">`
        : `<input data-f="loose" inputmode="decimal" placeholder="${esc(UOM[p.uom].toLowerCase())}" value="${c ? fnum(c.units) : ""}" aria-label="Count of ${esc(p.name)}">`}<span class="ok" data-ok></span></div></div>`;
  }
  $("#views").innerHTML = `<div class="pagehead"><h2>Stocktake</h2><span class="small muted">${esc(S.period ? S.period.name : "")}</span></div>
    <p class="lead">Pick an area, find a product and enter what is there. A count saves as soon as you leave the box. Counting the same product again replaces the earlier count for that area.</p>
    <div class="card"><div class="row-actions" style="margin:0 0 12px">${S.areas.map(x => `<button class="chip" data-act="area" data-id="${x.id}" aria-pressed="${x.id === S.area}">${esc(x.name)}</button>`).join("")}</div>

    for (const y of [...lines.keys()].sort((a, b) => b - a)) {

      rows.push(cells);

  const w = Math.max(...rows.map(r => r.length)); return rows.map(r => Array.from({ length:w }, (_, i) => r[i] || ""));
}

    if (a === "rc_cancel") { S.rc.edit = null; S.openSec = openState(); return renderAdmin(); }
    if (a === "rc_save" || a === "rc_remove") {
      const lines = a === "rc_remove" ? [] : S.rc.draft.filter(d => d.product_id && Number(d.portions) > 0).map(d => ({ product_id:d.product_id, portions:Number(d.portions) }));
      if (a === "rc_save" && !lines.length) return toast("Add at least one product with a number of portions.", true);
      if (a === "rc_remove" && !confirm("Remove this recipe? Its sales will go back to being unmatched.")) return;
      await call("recipe.save", { plu:S.rc.edit, lines }); S.rc.edit = null; S.openSec = openState(); toast(a === "rc_save" ? "Recipe saved." : "Recipe removed."); return showAdmin();
    }
    if (a === "pick") { S.pickKind = b.dataset.kind; S.pickSupplier = b.dataset.supplier; const fp = $("#filepick"); fp.accept = ".csv,.xlsx,.xls,.pdf,.txt"; fp.value = ""; return fp.click(); }
    if (a === "m_cancel") { S.M = null; S.openSec = openState(); return renderAdmin(); }
    if (a === "m_import") return runImport(b);
    if (a === "plu_del") { if (!confirm("Remove this PLU report from the stock period?")) return; await call("plu.delete", { id:b.dataset.id }); S.openSec = openState(); return showAdmin(); }
    if (a === "m_create") {
      const items = S.pmap.filter(r => !r.product_id && !r.ignored && !S.rcSet.has(r.plu)).map(r => ({ plu:r.plu, name:r.name, category:r.grp, sell_price:r.qty ? Math.round(r.value / r.qty * 100) / 100 : null }));
      if (!confirm(`Create ${items.length} new product${items.length === 1 ? "" : "s"} from the unmatched till buttons? Tick "Not stock" on any food or non-drink lines first.`)) return;
      const r = await call("plu.products.create", { items }); await refreshBoot(); S.openSec = openState(); toast(`${r.made} products created.`); return showAdmin();
    }
    if (a === "inv_toggle") { S.invOpen = S.invOpen === b.dataset.id ? null : b.dataset.id; S.openSec = openState(); return renderAdmin(); }
    if (a === "inv_del") { if (!confirm("Remove this invoice? Its quantities come out of the delivered stock.")) return; await call("invoice.delete", { id:b.dataset.id }); S.openSec = openState(); return showAdmin(); }
  } catch(err){ toast(err.message || "Something went wrong.", true); if (b) b.disabled = false; }
});
$("#filepick").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    toast("Reading the file…"); let rows = await fileToRows(f), meta = null; if (!rows.length) return toast("There was nothing readable in that file.", true);
    if (S.pickKind === "plu") rows = StockParsers.foldSections(rows);
    else { const n = StockParsers.invoiceRows(S.pickSupplier, rows); if (n) { rows = n.rows; meta = n.meta; } }
    const saved = (await call("profile.get", { kind: S.pickKind === "plu" ? "plu" : "invoice:" + S.pickSupplier })).mapping;
    startMapper(S.pickKind, rows, f, S.pickSupplier, saved, meta);
  } catch(err){ toast("Could not read that file: " + (err.message || err), true); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (S.tab && DAILY[S.tab] && S.daily) {
    const D = S.daily;
    if (t.id === "d_filter") { D.filter = t.value; const sel = $("#d_product"); sel.innerHTML = productOptions(D.product, D.filter); return; }
    if (t.id === "d_qty") D.qty = t.value; if (t.id === "d_note") D.note = t.value;
  }
  if (t.id === "rc_q") { S.rc.q = t.value; S.openSec = openState(); S.openSec.recipes = true; renderAdmin(); const n = $("#rc_q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } return; }
  if (t.id === "c_q") { S.q = t.value; renderCount(true); }
  if (t.id === "p_q") { S.adm.q = t.value; const wrap = t.closest(".in"); S.openSec = openState(); renderAdmin(); const n = $("#p_q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
});
document.addEventListener("change", async e => {
  { const t = e.target;
    if (t.id === "rc_filter") { S.rc.filter = t.value; S.rc.q = ""; S.openSec = openState(); S.openSec.recipes = true; return renderAdmin(); }
    if (t.id === "rc_copy" && t.value) { S.rc.draft = rcLinesFor(t.value); S.openSec = openState(); return renderAdmin(); }
    const row = t.closest && t.closest("tr[data-rci]");
    if (row && t.dataset.rc) { const d = S.rc.draft[Number(row.dataset.rci)]; if (t.dataset.rc === "product") d.product_id = t.value; else d.portions = t.value; S.openSec = openState(); return renderAdmin(); } }
  const t = e.target;
  try {
    if (S.tab && DAILY[S.tab] && S.daily) { if (t.id === "d_product") S.daily.product = t.value; if (t.id === "d_reason") S.daily.reason = t.value; }
    if (t.id === "c_all") { S.all = t.checked; return renderCount(); }
    const crow = t.closest(".count[data-key]"); if (crow && t.matches("input")) return saveCount(crow);
    if (t.id === "r_period") { S.repPeriod = t.value; return loadReport(); }
    if (t.id === "r_sort") { S.repSort = t.value; return renderReport(); }
    if (t.id === "r_only") { S.repOnly = t.checked; return renderReport(); }
    if (t.dataset.note !== undefined && t.dataset.note) { await call("report.note", { period_id:S.repPeriod, product_id:t.dataset.note, note:t.value }); const r = S.rep.rows.find(x => x.product_id === t.dataset.note); if (r) { r.note = t.value.trim(); r.note_by = S.me.name; } t.style.borderColor = ""; toast("Saved."); return; }
    // admin: product rows
    const prow = t.closest("tr[data-prod]");
    if (prow && t.dataset.pa) { await call("product.area", { product_id:prow.dataset.prod, area_id:t.dataset.pa, on:t.checked }); const p = productById(prow.dataset.prod); p.areas = t.checked ? [...new Set([...p.areas, t.dataset.pa])] : p.areas.filter(x => x !== t.dataset.pa); return toast("Saved."); }
    if (prow && t.dataset.pf) {
      const g = f => { const el = prow.querySelector(`[data-pf="${f}"]`); return el.type === "checkbox" ? el.checked : el.value; }; const p = productById(prow.dataset.prod);
      await call("product.save", { id:p.id, name:g("name"), category:g("category"), sell_price:g("sell_price"), cost_price:g("cost_price"), uom:g("uom"), case_size:g("case_size"), portions_per_unit:g("portions_per_unit") || 1, active:g("active") });
      await refreshBoot(); return toast("Saved.");
    }
    if (t.id === "m_all") { S.matchAll = t.checked; S.openSec = openState(); return renderAdmin(); }
    const mrow = t.closest("tr[data-plu]");
    if (mrow && t.dataset.mf) {
      const g = f => { const el = mrow.querySelector(`[data-mf="${f}"]`); return el.type === "checkbox" ? el.checked : el.value; };
      await call("plu.map.save", { rows:[{ plu:mrow.dataset.plu, name:mrow.dataset.name, product_id:g("product_id") || null, portion_size:Number(g("portion_size")) || 1, ignored:g("ignored") }] });
      const r = S.pmap.find(x => x.plu === mrow.dataset.plu); if (r) { r.product_id = g("product_id") || null; r.portion_size = Number(g("portion_size")) || 1; r.ignored = g("ignored"); } return toast("Saved.");
    }
    const lrow = t.closest("tr[data-line]");
    if (lrow && t.dataset.lf) {
      const pid = lrow.querySelector('[data-lf="product_id"]').value, cs = lrow.querySelector('[data-lf="in_cases"]').checked;
      const r = await call("invoice.line.match", { id:lrow.dataset.line, product_id:pid || null, in_cases:cs }); S.openSec = openState(); await showAdmin(); return toast(`Saved (${fnum(r.units)} units).`);
    }
    // mapper
    const mp = t.dataset.mp, M = S.M;
    if (M && mp) {
      if (mp === "hi") { M.hi = Number(t.value); M.groups = null; autoMap(M); } else if (mp === "col") { if (t.value === "") delete M.map[t.dataset.f]; else M.map[t.dataset.f] = Number(t.value); if (t.dataset.f === "grp") M.groups = null; }
      else if (mp === "from") M.from = t.value; else if (mp === "to") M.to = t.value; else if (mp === "invno") M.inv.no = t.value; else if (mp === "invdate") M.inv.date = t.value;
      else if (mp === "grp") { if (t.checked) M.groups.add(t.value); else M.groups.delete(t.value); }
      if (["hi", "col"].includes(mp)) { S.openSec = openState(); renderAdmin(); }
    }
  } catch(err){ toast(err.message || "Could not save that.", true); }
});
function openGate(msg){ $("#gate").style.display = "flex"; $("#app").hidden = true; if (msg) { const g = $("#gerr"); g.textContent = msg; g.style.display = ""; } }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = `<p class="muted" style="margin-top:24px">Loading…</p>`;
  try { await refreshBoot(); } catch(e){ $("#views").innerHTML = `<div class="card"><b>${esc(e.message)}</b><p class="muted">Open this from the Staff Portal so it knows who you are.</p></div>`; return; }
  S.me = S.boot.me; $("#whoname").textContent = S.me.name; await show((TABS.find(([k]) => S.me.tabs.includes(k)) || [])[0] || null);
}
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate(); })();
</script>
</body>
