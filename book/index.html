<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--berry:#8A1C2B;--pine:#24402F;--brown:#3F2F28;--muted:#7A6A68;--soft:#F6EBEC;--bone:#F8F8F8;--celadon:#CCCDB4;--white:#fff;--ink:#262626;--gold:#C1A51D;--gold-soft:#F4EFD3;
 --alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#4F6B4F;--good-bg:#EDF2ED;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;position:relative}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;color:var(--brown);letter-spacing:.01em}
.hero{position:relative;overflow:hidden;border-radius:0 0 18px 18px;color:var(--white);text-align:center;padding:46px 18px 34px;background:linear-gradient(rgba(24,43,31,.62),rgba(24,43,31,.84)),url(img/hero.jpg) center/cover var(--pine)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;background:radial-gradient(circle at 12% 30%,#fff 0 1.6px,transparent 2.4px),radial-gradient(circle at 38% 72%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 64% 22%,#fff 0 1.8px,transparent 2.6px),radial-gradient(circle at 86% 64%,#fff 0 1.3px,transparent 2.1px),radial-gradient(circle at 24% 88%,#fff 0 1px,transparent 1.8px),radial-gradient(circle at 74% 92%,#fff 0 1.5px,transparent 2.3px);background-size:260px 190px}
.lights{position:absolute;left:0;right:0;top:0;height:30px;z-index:1;background:linear-gradient(#0f1c14,#0f1c14) 0 7px/100% 2px no-repeat,radial-gradient(circle at 12px 20px,#e24b3f 0 5px,transparent 6px) 0 0/96px 30px repeat-x,radial-gradient(circle at 36px 20px,#f0c640 0 5px,transparent 6px) 0 0/96px 30px repeat-x,radial-gradient(circle at 60px 20px,#4fa56a 0 5px,transparent 6px) 0 0/96px 30px repeat-x,radial-gradient(circle at 84px 20px,#f6f1e4 0 5px,transparent 6px) 0 0/96px 30px repeat-x;filter:drop-shadow(0 0 5px rgba(255,214,120,.7));animation:glow 3.2s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.78}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.lights{animation:none}}
.hero > *{position:relative;z-index:2}
.hero > .lights{position:absolute}
.hero img.logo{display:block;margin:0 auto 12px;height:44px;width:auto}
.hero .brand{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hero h1{font-size:clamp(30px,6vw,42px);line-height:1.1;margin:8px 0 0;color:var(--white)}
.orn{width:92px;height:22px;color:var(--gold)}
.hero .orn{display:block;margin:12px auto 0}
.card .orn{display:block;margin:2px auto 12px}
.card.mid{text-align:center}
.card.mid label.f,.card.mid select{text-align:left}
.card h2.c,.card .tag.c{text-align:center}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:10px;margin:18px 0 6px}
.tile{flex:0 0 calc((100% - 40px)/5);max-width:112px;border:0;background:none;padding:0;font:inherit;cursor:pointer;text-align:center;color:var(--brown)}
.tile img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:3px solid var(--white);box-shadow:0 2px 10px rgba(38,38,38,.18);transition:transform .15s}
.tile span{display:block;margin-top:7px;font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15}
.tile:hover img{transform:translateY(-2px)}
.tile.on img{border-color:var(--gold);box-shadow:0 0 0 2px var(--berry),0 4px 14px rgba(138,28,43,.35)}
.pics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 16px}
.pics img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px}
.pics.one{grid-template-columns:1fr}
.pics.poster{grid-template-columns:minmax(0,340px);justify-content:center}
.pics.poster img{aspect-ratio:1/1}
@media (max-width:520px){.pics{grid-template-columns:1fr}.tile{flex-basis:88px}.tile span{font-size:15px}}
main{max-width:720px;margin:0 auto;padding:22px 14px 90px}
.card{background:var(--white);border-radius:var(--radius);border-top:3px solid var(--berry);box-shadow:0 1px 2px rgba(38,38,38,.06),0 10px 28px rgba(38,38,38,.07);padding:22px 20px;margin:0 0 18px}
.card h2{font-size:28px;margin-bottom:6px}
.card h3{font-size:22px;margin:0 0 6px}
.lead{margin:0 0 8px;color:var(--muted)}
.tag{font-family:var(--display);font-size:19px;color:var(--berry);margin:0 0 10px}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:13px 15px;font-size:15px;margin:14px 0}
.warn{background:var(--alert-bg);border-left:4px solid var(--berry);border-radius:10px;padding:13px 15px;font-size:15px;margin:12px 0}
label.f{display:block;font-weight:600;margin:18px 0 6px}
.req{color:var(--alert);margin-left:3px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--celadon);border-radius:9px;background:var(--white);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
select:disabled{background:#F1F1EC;color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--berry);outline-offset:1px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cols.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:520px){.cols{grid-template-columns:1fr}.cols.two{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--celadon);border-radius:9px;margin:0 0 8px;cursor:pointer;background:var(--white)}
.opt.on{border-color:var(--berry);background:var(--soft)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--berry);flex:0 0 auto}
.chk{display:flex;gap:10px;align-items:flex-start;margin:20px 0 4px}
.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--berry);flex:0 0 auto}
.btn{display:inline-block;background:var(--berry);color:var(--white);border:0;border-radius:9px;padding:14px 28px;font:inherit;font-weight:700;letter-spacing:.05em;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:var(--white);color:var(--berry);border:1px solid var(--berry)}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:14px 0;font-weight:600}
.bad label.f{color:var(--alert)}
.bad input,.bad select{border-color:var(--alert)}
.inc{margin:8px 0 6px;padding-left:20px}
.inc li{margin:0 0 4px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:13px 15px;margin:18px 0 0}
.total b{font-family:var(--display);font-size:28px;color:var(--berry)}
.sum{width:100%;border-collapse:collapse;margin:12px 0}
.sum td{padding:8px 4px;border-bottom:1px solid #E3E5DE;vertical-align:top}
.sum td:last-child{text-align:right;font-weight:600}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--celadon);border-top-color:var(--berry);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.embed footer,body.embed .hero img.logo{display:none}
body.embed .hero{border-radius:16px}
body.embed main{padding-top:16px;padding-bottom:20px}
footer{max-width:720px;margin:0 auto;padding:0 14px 36px;font-size:14px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="holly" viewBox="0 0 92 22"><g fill="currentColor"><path d="M46 11C41 3 31 2 24 6c4 6 12 8 22 5z"/><path d="M46 11c5-8 15-9 22-5-4 6-12 8-22 5z"/></g><g fill="#B3202F"><circle cx="43" cy="14" r="3.2"/><circle cx="49" cy="14" r="3.2"/><circle cx="46" cy="17.5" r="3.2"/></g><path d="M2 11h14M76 11h14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol></svg>
<div class="hero"><div class="lights"></div><a href="https://www.blackhorsebeamish.co.uk" target="_blank" rel="noopener" style="display:block"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"></a><div class="brand">Black Horse Beamish</div><h1>Christmas at the Black Horse</h1><svg class="orn" aria-hidden="true"><use href="#holly"/></svg></div>
<main id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></main>
<footer>Need a hand? Phone 01207 232 569 or email <a href="mailto:events@blackhorsebeamish.co.uk">events@blackhorsebeamish.co.uk</a>.<br>Black Horse Beamish, Red Row, Beamish, DH9 0RW</footer>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/xmas-api";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const Q = new URLSearchParams(location.search);
const PAID = Q.get("paid") || "";
const EMBED = Q.get("embed") === "1";      // shown inside the website: no header or footer, and it tells the page around it how tall it is
if (EMBED) document.body.classList.add("embed");
const tellHeight = () => { if (EMBED && parent !== window) parent.postMessage({ bhbHeight: document.documentElement.scrollHeight }, "*"); };
if (EMBED && window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const gbp = n => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const timeLabel = t => { const [h, m] = t.split(":").map(Number); return (h > 12 ? h - 12 : h) + (m ? ":" + String(m).padStart(2, "0") : "") + (h >= 12 ? "pm" : "am"); };
const nums = (lo, hi, sel) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).map(n => '<option value="' + n + '"' + (n === sel ? " selected" : "") + '>' + n + '</option>').join("");
let I = null, EV = null, OPTS = [], BUSY = false;

async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const ph = I => I.contact.phone;
const PHOTOS = {
  "Christmas Day": { imgs: ["xmasday-1", "xmasday-2"], alt: "Christmas Day roast at the Black Horse" },
  "Wreath Making": { imgs: ["wreath-1", "wreath-2"], alt: "Wreath making in the Orchard Marquee" },
  "Hits of the 90s": { imgs: ["hits"], poster: true, alt: "Hits of the 90s poster" },
  "Flash Freddie": { imgs: ["freddie"], poster: true, alt: "Flash Freddie poster" },
  "The Stevie D Party Band": { imgs: ["stevie"], poster: true, alt: "The Stevie D Party Band poster" }
};
const ORN = '<svg class="orn" aria-hidden="true"><use href="#holly"/></svg>';
function pics(e){
  const p = PHOTOS[e.title]; if (!p) return "";
  return '<div class="pics ' + (p.poster ? "poster" : p.imgs.length === 1 ? "one" : "") + '">' + p.imgs.map(n => '<img src="img/' + n + '.jpg" alt="' + esc(p.alt + ", " + e.short) + '" loading="lazy" onload="tellHeight()">').join("") + '</div>';
}
function tiles(){
  const seen = [], out = [];
  I.events.forEach(e => {
    if (!PHOTOS[e.title] || seen.includes(e.title)) return; seen.push(e.title);
    const first = I.events.find(x => x.title === e.title && x.state === "open") || e;
    out.push('<button type="button" class="tile" data-id="' + esc(first.date_id) + '" data-title="' + esc(e.title) + '"><img src="img/' + PHOTOS[e.title].imgs[0] + '.jpg" alt=""><span>' + esc(e.title) + '</span></button>');
  });
  return out.length ? '<div class="tiles">' + out.join("") + '</div>' : "";
}

function picker(){
  return '<div class="card mid"><h2>What would you like to book?</h2>' + ORN + '<p class="lead">Pick an event below, or choose it from the list, to see what is included and to book.</p>' + tiles() +
    '<label class="f" for="ev">Event</label><select id="ev"><option value="">Choose an event...</option>' + I.events.map(e => '<option value="' + esc(e.date_id) + '">' + esc(e.title) + ' - ' + esc(e.short) + (e.state !== "open" ? " (not available)" : "") + '</option>').join("") + '</select></div>' +
    '<div id="detail"></div>';
}
function infoCard(e){
  const p = e.prices;
  const price = e.kind === "day" ? gbp(p.adult) + ' per adult, ' + gbp(p.child) + ' per child (under 12). Under 3s are free when eating from adults\' plates, or ' + gbp(p.infant) + ' for their own main course.' : gbp(p.adult) + ' per ticket.';
  return '<div class="card"><h2 class="c">' + esc(e.title) + '</h2>' + ORN + '<p class="tag c">' + esc(e.tagline) + '</p>' + pics(e) + e.info.map(t => '<p style="margin:0 0 10px">' + esc(t) + '</p>').join("") +
    (e.includes.length ? '<p style="margin:14px 0 2px"><b>' + (e.kind === "day" ? "Included" : "Your ticket includes") + '</b></p><ul class="inc">' + e.includes.map(t => '<li>' + esc(t) + '</li>').join("") + '</ul>' : "") +
    '<div class="note"><b>Price:</b> ' + esc(price) + ' You pay in full when you book.</div>' +
    (e.few ? '<div class="warn"><b>Only ' + e.few + ' place' + (e.few === 1 ? "" : "s") + ' left.</b></div>' : "") + '</div>';
}
function closedCard(e){
  return '<div class="card mid"><h3>' + (e.state === "soldout" ? "Sold out" : "Not taking bookings at the moment") + '</h3><p class="lead" style="margin:0 0 12px">' + esc(e.message) + '</p>' +
    (e.waiting_url ? '<p style="margin:0"><a class="btn" href="' + esc(e.waiting_url) + '" target="_top">Join the waiting list</a></p>' : '<p style="margin:0">Phone us on <b>' + esc(ph(I)) + '</b>.</p>') + '</div>';
}
function formCard(e){
  const day = e.kind === "day";
  const who = day
    ? '<label class="f">Who is coming?</label><div class="cols">' +
        '<div><label for="adults" style="font-size:14px">Adults</label><select id="adults">' + nums(1, e.max, 2) + '</select></div>' +
        '<div><label for="children" style="font-size:14px">Children (under 12)</label><select id="children">' + nums(0, e.max, 0) + '</select></div>' +
        '<div><label for="infants" style="font-size:14px">Under 3s eating (' + gbp(e.prices.infant) + ' each)</label><select id="infants">' + nums(0, 10, 0) + '</select></div></div>' +
      '<p class="hint" style="margin-top:6px">Under 3s who are not having their own meal are free: you do not need to count them. For a party of more than ' + e.max + ', please phone us on ' + esc(ph(I)) + '.</p>'
    : '<label class="f" for="adults">How many tickets?</label><select id="adults">' + nums(1, e.max, 2) + '</select>';
  const when = day
    ? '<label class="f">Does anyone in your party have accessibility needs?<span class="req">*</span></label><p class="hint">For example someone who uses a wheelchair or walking aid, or who finds steps difficult. One of our rooms has steps, so this decides which tables we show you.</p>' +
      '<label class="opt"><input type="radio" name="access" value="no"><span>No</span></label><label class="opt"><input type="radio" name="access" value="yes"><span>Yes</span></label>' +
      '<label class="f" for="slot">Arrival time<span class="req">*</span></label><p class="hint" id="slothint">Answer the question above and we will show the times we can give a party of your size.</p><select id="slot" disabled><option value="">Choose a time...</option></select><div id="slotmsg"></div>'
    : "";
  return '<form class="card" id="form" novalidate><h2>Your booking</h2>' + who + when +
    '<div class="qrow"><label class="f" for="name">Your name<span class="req">*</span></label><input type="text" id="name" maxlength="80" autocomplete="name"></div>' +
    '<div class="qrow"><label class="f" for="email">Email address<span class="req">*</span></label><p class="hint">Your confirmation is sent here.</p><input type="email" id="email" maxlength="120" autocomplete="email"></div>' +
    '<div class="qrow"><label class="f" for="phone">Phone number<span class="req">*</span></label><input type="tel" id="phone" maxlength="30" autocomplete="tel" inputmode="tel"></div>' +
    '<label class="f" for="notes">Anything else we should know?</label><p class="hint">For example a special occasion' + (day ? ", or high chairs." : ".") + ' Allergies and meal choices come later, on the form we email you.</p><textarea id="notes" maxlength="600"></textarea>' +
    '<div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>' +
    '<label class="chk"><input type="checkbox" id="consent"><span>I am happy for Black Horse Beamish to use these details to look after my booking.</span></label>' +
    '<div class="total"><span>Total to pay now</span><b id="total"></b></div>' +
    '<p class="hint" style="margin:8px 0 0">' + (day ? 'Your table is held for ' + I.hold_minutes + ' minutes while you pay. ' : '') + 'You pay by card on SumUp\'s secure page, and we email your confirmation straight away.</p>' +
    '<div id="msg"></div><p style="margin:18px 0 0"><button type="submit" class="btn" id="go">Pay and book</button></p></form>';
}
function val(id){ const el = $("#" + id); return el ? (el.value || "").trim() : ""; }
function counts(){ return { adults: Number(val("adults")) || 0, children: EV.kind === "day" ? Number(val("children")) || 0 : 0, infants: EV.kind === "day" ? Number(val("infants")) || 0 : 0 }; }
function total(){ const c = counts(), p = EV.prices; return c.adults * p.adult + c.children * (p.child || 0) + c.infants * (p.infant || 0); }
function paintTotal(){ const t = $("#total"); if (t) t.textContent = gbp(total()); const g = $("#go"); if (g) g.textContent = "Pay " + gbp(total()) + " and book"; }
function accessNow(){ const r = document.querySelector('input[name="access"]:checked'); return r ? r.value === "yes" : null; }

let TIMES_SEQ = 0;
async function loadTimes(){
  if (EV.kind !== "day") return;
  const sel = $("#slot"), hint = $("#slothint"), msg = $("#slotmsg"), c = counts(), acc = accessNow(), keep = val("slot"), seq = ++TIMES_SEQ;
  msg.innerHTML = "";
  if (acc === null) { sel.disabled = true; sel.innerHTML = '<option value="">Choose a time...</option>'; return; }
  sel.disabled = true; sel.innerHTML = '<option value="">Checking times...</option>';
  try {
    const r = await call("web.times", { date_id: EV.date_id, adults: c.adults, children: c.children, access: acc });
    if (seq !== TIMES_SEQ) return;
    OPTS = r.options;
    if (!OPTS.length) { sel.innerHTML = '<option value="">No times available</option>'; hint.textContent = ""; msg.innerHTML = '<div class="warn"><b>We have nothing left for a party of ' + r.size + (acc ? ' that needs step-free access' : '') + ' at the moment.</b> You could try a different number of guests, join the waiting list, or phone us on ' + esc(ph(I)) + '.' + (EV.waiting_url ? ' <a href="' + esc(EV.waiting_url) + '" target="_top">Join the waiting list</a>' : '') + '</div>'; tellHeight(); return; }
    hint.textContent = acc ? "These tables are all step-free." : "Tables are shown with where they are. We can only show times that are free right now.";
    sel.innerHTML = '<option value="">Choose a time...</option>' + OPTS.map(o => '<option value="' + esc(o.value) + '"' + (o.value === keep ? " selected" : "") + '>' + timeLabel(o.time) + ' - ' + esc(o.where) + (o.steps ? " (has steps)" : "") + '</option>').join("");
    sel.disabled = false; slotChanged();
  } catch (e) { if (seq !== TIMES_SEQ) return; sel.innerHTML = '<option value="">Choose a time...</option>'; msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; }
  tellHeight();
}
function slotChanged(){
  const o = OPTS.find(x => x.value === val("slot")), m = $("#slotmsg"); if (!m) return;
  m.innerHTML = o && o.steps ? '<div class="warn"><b>Please note: this table is in the George Ridley Room, which has steps.</b> It is not suitable for anyone with accessibility needs. If that is you or someone in your party, change your answer above and we will show you step-free tables only.</div>' : "";
  tellHeight();
}
function pickEvent(id){
  EV = I.events.find(e => e.date_id === id) || null; OPTS = [];
  const evSel = $("#ev"); if (evSel && evSel.value !== id) evSel.value = id;
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", !!EV && t.dataset.title === EV.title));
  const d = $("#detail"); if (!EV) { d.innerHTML = ""; tellHeight(); return; }
  d.innerHTML = infoCard(EV) + (EV.state === "open" ? formCard(EV) : closedCard(EV));
  if (EV.state === "open") {
    const f = $("#form");
    f.addEventListener("submit", submit);
    f.addEventListener("change", e => {
      if (e.target.name === "access") document.querySelectorAll('input[name="access"]').forEach(r => r.closest(".opt").classList.toggle("on", r.checked));
      if (["adults", "children", "infants"].includes(e.target.id)) { paintTotal(); if (e.target.id !== "infants") loadTimes(); }
      if (e.target.name === "access") loadTimes();
      if (e.target.id === "slot") slotChanged();
    });
    paintTotal();
  }
  tellHeight();
}
async function submit(ev){
  ev.preventDefault(); if (BUSY) return;
  const msg = $("#msg"); msg.innerHTML = "";
  document.querySelectorAll(".qrow").forEach(r => r.classList.remove("bad"));
  let firstBad = null; [["name"], ["email"], ["phone"]].forEach(([k]) => { if (!val(k)) { const r = $("#" + k).closest(".qrow"); r.classList.add("bad"); if (!firstBad) firstBad = r; } });
  if (firstBad) { msg.innerHTML = '<div class="err">Please fill in your name, email address and phone number.</div>'; firstBad.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  if (EV.kind === "day") {
    if (accessNow() === null) { msg.innerHTML = '<div class="err">Please tell us whether anyone in your party has accessibility needs.</div>'; return; }
    if (!val("slot")) { msg.innerHTML = '<div class="err">Please choose your arrival time.</div>'; $("#slot").scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  }
  if (!$("#consent").checked) { msg.innerHTML = '<div class="err">Please tick the box to say we may use your details to look after your booking.</div>'; return; }
  const btn = $("#go"); BUSY = true; btn.disabled = true; btn.textContent = "One moment...";
  try {
    const c = counts();
    const r = await call("web.start", { date_id: EV.date_id, name: val("name"), email: val("email"), phone: val("phone"), adults: c.adults, children: c.children, infants: c.infants, slot: val("slot"), access: accessNow(), notes: val("notes"), website: val("website"), consent: true });
    if (!r.url) { BUSY = false; return; }
    $("#app").innerHTML = '<div class="card" style="text-align:center"><h2>Taking you to the payment page</h2><p class="lead">' + (EV.kind === "day" ? 'Your table is held for ' + I.hold_minutes + ' minutes. ' : '') + 'If nothing happens, press the button.</p><p><a class="btn" id="paygo" href="' + esc(r.url) + '" target="_top">Pay ' + gbp(r.amount) + ' now</a></p></div>';
    window.scrollTo({ top:0 }); if (EMBED && parent !== window) parent.postMessage({ bhbTop:true, bhbPay:r.url }, "*"); else location.href = r.url;
  } catch (e) {
    BUSY = false; btn.disabled = false; paintTotal(); msg.innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    if (/just been taken|have just been taken/i.test(e.message)) loadTimes();
  }
}
async function paidView(){
  $("#app").innerHTML = '<div class="card" style="text-align:center"><span class="spin"></span><p class="lead">Checking your payment...</p></div>';
  let d; try { d = await call("web.check", { t: PAID }); } catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; return; }
  const sum = '<table class="sum"><tr><td>Booking reference</td><td>' + esc(d.ref || "") + '</td></tr><tr><td>' + esc(d.event) + '</td><td>' + esc(d.when) + '</td></tr><tr><td>' + (d.kind === "day" ? "Your party" : "Tickets") + '</td><td>' + esc(d.party) + '</td></tr>' + (d.arrival ? '<tr><td>Arrival</td><td>' + esc(d.arrival) + '</td></tr>' : "") + '<tr><td>Paid</td><td>' + gbp(d.amount) + '</td></tr></table>';
  if (d.status === "paid") {
    $("#app").innerHTML = '<div class="card"><h2>Thank you, ' + esc(d.first) + '</h2><div class="ok">Your payment has been received and your booking is confirmed.</div>' + sum +
      (d.steps ? '<div class="warn"><b>Please note: your table is in the George Ridley Room, which has steps.</b> If anyone in your party finds steps difficult, phone us on ' + esc(d.contact.phone) + ' and we will move you.</div>' : "") +
      '<p class="lead">We have emailed your confirmation to <b>' + esc(d.email) + '</b>. Please look in your junk folder if you cannot see it.</p>' +
      (d.form_url ? '<div class="note"><b>One more thing: choose your meals.</b> The email has a link to your pre-order form, or you can go straight there now.</div><p><a class="btn" href="' + esc(d.form_url) + '" target="_top">Choose your meals</a></p>' : "") + '</div>';
  } else if (d.status === "pending" && d.pay_url) {
    $("#app").innerHTML = '<div class="card"><h2>Your payment has not gone through yet</h2><p class="lead">' + esc(d.event) + ', ' + esc(d.party) + (d.arrival ? ', arriving ' + esc(d.arrival) : "") + ', ' + gbp(d.amount) + '.</p><p class="lead">We are still holding your booking for a few minutes. Press the button to try the payment again.</p><p><a class="btn" href="' + esc(d.pay_url) + '" target="_top">Pay ' + gbp(d.amount) + '</a></p><p class="lead">If your card is declined, phone us on ' + esc(d.contact.phone) + ' and we will help.</p></div>';
  } else {
    $("#app").innerHTML = '<div class="card"><h2>This booking was not completed</h2><p class="lead">We did not receive a payment in time, so nothing has been booked and your card has not been charged. Any table we were holding has been released.</p><p><a class="btn" href="' + esc(location.pathname + (EMBED ? "?embed=1" : "")) + '">Start again</a></p><p class="lead">If you think you were charged, phone us on ' + esc(d.contact.phone) + ' and we will sort it out.</p></div>';
  }
}
(async function(){
  try {
    if (PAID) { await paidView(); return; }
    I = await call("web.info");
    if (!I.events.length) { $("#app").innerHTML = '<div class="card"><h2>Bookings are closed at the moment</h2><p class="lead">Please phone us on ' + esc(I.contact.phone) + ' or email ' + esc(I.contact.email) + '.</p></div>'; return; }
    $("#app").innerHTML = picker();
    $("#ev").addEventListener("change", e => pickEvent(e.target.value));
    document.querySelectorAll(".tile").forEach(t => t.addEventListener("click", () => pickEvent(t.dataset.id)));
    const pre = Q.get("event"); if (pre && I.events.some(e => e.date_id === pre)) { $("#ev").value = pre; pickEvent(pre); }
  } catch (e) { $("#app").innerHTML = '<div class="card"><div class="err">' + esc(e.message) + '</div></div>'; }
})();
</script>
