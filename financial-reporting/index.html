<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/auth.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financial Reporting — Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================ tokens
   Same values as every other app in this portal. */
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626;
  --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4;
  --alert:#8C4A3F;     --alert-bg:#F6EAE8;
  --good:#4F6B4F;      --good-bg:#EDF2ED;
  --display:"Cormorant Garamond",Georgia,serif;
  --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em;
  --radius:10px;
  --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);
  --maxw:1320px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); color:var(--ink); background:var(--bone);
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--sage)}
.shell{max-width:var(--maxw); margin:0 auto; padding:0 20px 64px}

/* ============================================================ gate */
#gate{
  position:fixed; inset:0; background:var(--sage); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.gatecard{
  background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
  width:100%; max-width:380px; padding:32px 28px; text-align:center;
}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{
  font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase;
  color:var(--sage-70); margin:6px 0 22px;
}
.gatecard input{
  width:100%; padding:12px 14px; border:1px solid var(--mist);
  border-radius:8px; background:var(--bone); margin-bottom:10px; text-align:center;
}
.gatecard button{
  width:100%; padding:12px; border:0; border-radius:8px; cursor:pointer;
  background:var(--sage); color:var(--white); font-weight:600;
  letter-spacing:var(--track-label); text-transform:uppercase; font-size:12px;
}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}

/* ============================================================ header */
header.top{background:var(--sage); color:var(--white)}
.topin{
  max-width:var(--maxw); margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{
  display:block; font-family:var(--body); font-size:10px;
  letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75;
}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{
  background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white);
  border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px;
  letter-spacing:.06em; text-transform:uppercase;
}

nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 20px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{
  background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72);
  padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap;
  letter-spacing:var(--track-label); text-transform:uppercase;
  border-bottom:3px solid transparent;
}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}

/* ============================================================ layout */
.page{display:none; padding-top:26px}
.page.on{display:block}
.pagehead{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.pagehead h2{font-size:26px; color:var(--sage)}
.pagehead .hint{font-size:13px; color:var(--sage-70)}
.spacer{margin-left:auto}

.btn{
  border:1px solid var(--sage); background:var(--sage); color:var(--white);
  border-radius:8px; padding:9px 16px; cursor:pointer; font-size:12px;
  font-weight:600; letter-spacing:var(--track-label); text-transform:uppercase;
  min-height:44px;
}
.btn.ghost{background:var(--white); color:var(--sage)}
.btn.ghost:hover{background:var(--sage-10)}
.btn:disabled{opacity:.5; cursor:default}

/* ============================================================ tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:26px}
.tile{
  background:var(--white); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow); border-left:4px solid var(--celadon);
}
.tile .n{font-family:var(--display); font-size:30px; line-height:1; color:var(--sage)}
.tile .l{font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-top:6px}
.tile .d{font-size:12px; margin-top:4px; font-weight:600}
.tile.warn{border-left-color:var(--attention)} .tile.warn .n{color:var(--attention)}
.tile.bad{border-left-color:var(--alert)}      .tile.bad  .n{color:var(--alert)}
.tile.ok{border-left-color:var(--good)}        .tile.ok   .n{color:var(--good)}

/* ============================================================ form */
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block; font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%; padding:11px 12px; border:1px solid var(--mist); border-radius:8px; background:var(--white);
  font-size:16px; min-height:44px;
}
.field textarea{min-height:0}
.field input[type=checkbox]{width:auto; padding:0; border:0; min-height:0}
.row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px}
/* No spin buttons on the denomination/money fields - a phone keyboard is
   how these get filled in, not the tiny up/down arrows, and the arrows are
   an easy mis-tap on a touchscreen. */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=number]{ -moz-appearance:textfield; }
/* Portrait list, not a grid - counting cash is a top-to-bottom habit, and
   Tab/Enter both need to land on the next denomination down, not sideways.
   16px font and a 44px-tall field throughout are both for touch: under
   16px, iOS Safari auto-zooms in on focus, which is exactly what you don't
   want mid-count on a phone. */
.denomlist{display:flex; flex-direction:column; gap:10px; max-width:380px; margin-bottom:10px}
.denomrow{display:flex; align-items:center; gap:14px}
.denomrow .dlabel{
  width:44px; flex:none; font-size:12px; letter-spacing:var(--track-label);
  text-transform:uppercase; color:var(--sage-70);
}
.denomrow input{flex:1; text-align:center; min-height:48px; font-size:17px}
.denomrow .lineval{
  width:92px; flex:none; text-align:right; color:var(--sage-70);
  font-variant-numeric:tabular-nums; font-size:13px;
}

/* ============================================================ table */
.tablewrap{overflow-x:auto}
table.grid{width:100%; border-collapse:collapse; font-size:14px}
table.grid th{
  text-align:left; padding:11px 12px; background:var(--sage-10); color:var(--sage);
  font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase;
  font-weight:700; white-space:nowrap;
}
table.grid th.num{text-align:right}
table.grid td{padding:10px 12px; border-top:1px solid var(--mist); vertical-align:top; white-space:nowrap}
table.grid td.num{text-align:right; font-variant-numeric:tabular-nums}
/* the Cash Up history has twelve columns: a wider frame on a big screen, tighter cells and two-line headings so the whole row is in view */
body.widepage{--maxw:1800px} body.widepage #kiosk{max-width:var(--maxw)}
.noteBtn{position:relative; border:1px solid var(--mist); background:var(--white); border-radius:8px; width:36px; height:32px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--sage-70); padding:0}
.noteBtn:hover{background:var(--sage-10); color:var(--sage)} .noteBtn.has{color:var(--sage); border-color:var(--celadon)}
.noteBtn.need{color:var(--alert); border-color:var(--alert); background:var(--alert-bg)}
.noteBtn b{position:absolute; top:-7px; right:-7px; min-width:17px; height:17px; border-radius:9px; background:var(--sage); color:#fff; font-size:10px; line-height:17px; text-align:center; padding:0 4px}
.noteBtn.need b{background:var(--alert)}
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:150; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto}
.modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:640px; padding:22px 24px}
.modal h2{font-size:24px; margin:0 0 4px; color:var(--sage)} .modal .sub{font-size:13px; color:var(--sage-70); margin:0 0 12px}
.modal .warn{background:var(--alert-bg); border-left:4px solid var(--alert); padding:10px 12px; border-radius:6px; margin:0 0 14px; font-size:15px}
.modal h3{font-size:12px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage); margin:18px 0 6px}
.modal .nt{border-top:1px solid var(--mist); padding:8px 0} .modal .nt .h{font-size:12px; color:var(--sage-70)} .modal .nt .b{white-space:pre-wrap; margin-top:2px}
.modal textarea{width:100%; min-height:84px; padding:10px 12px; border:1px solid var(--mist); border-radius:8px; font-size:16px; margin-top:8px}
.modal .acts{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
table.grid.cuh{font-size:13px} table.grid.cuh th{white-space:normal; line-height:1.25; padding:9px 7px; font-size:9.5px; letter-spacing:.1em; vertical-align:bottom} table.grid.cuh td{padding:9px 7px}
table.grid.cuh th:first-child, table.grid.cuh td:first-child{padding-left:12px} table.grid.cuh th:last-child, table.grid.cuh td:last-child{padding-right:12px}
@media (max-width:1100px){ table.grid.cuh{font-size:12px} table.grid.cuh td, table.grid.cuh th{padding-left:5px; padding-right:5px} }
table.grid tr.dayrow td{background:var(--sage-10); border-top:2px solid var(--celadon); font-weight:600}
table.grid tr.grp{cursor:pointer} table.grid tr.grp:hover td{background:var(--sage-10)}
table.grid tr.grpsub td{background:var(--bone); font-size:13px; color:var(--sage-dark)} table.grid tr.grpsub td:first-child{padding-left:28px}
.chev{display:inline-block; width:14px; color:var(--sage-70)} .part{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:var(--attention-bg); color:#6d5320; border-radius:999px; padding:2px 8px; margin-left:6px}
.linkbox{border-left:4px solid var(--gold); background:var(--attention-bg)} .linkbox h3{margin:0 0 6px; font-size:18px} .linkbox table{width:100%; border-collapse:collapse} .linkbox td{padding:4px 0} .linkbox td.n{text-align:right; font-variant-numeric:tabular-nums} .linkbox tr.tot td{border-top:1px solid var(--celadon); font-weight:700; padding-top:8px}
.donecard{text-align:center} .donecard .opts2{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px}
.muted{color:var(--sage-70)}
.strong{font-weight:600}
.up{color:var(--good)} .down{color:var(--alert)}

.subnav{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 18px}
.subnav button{
  background:var(--white); border:1px solid var(--mist); color:var(--sage);
  border-radius:999px; padding:7px 16px; cursor:pointer; font-size:12px; font-weight:600;
}
.subnav button.on{background:var(--sage); border-color:var(--sage); color:var(--white)}

.empty{padding:40px 20px; text-align:center; color:var(--sage-70)}
.loading{padding:60px; text-align:center; color:var(--sage-70)}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px);
  background:var(--ink); color:var(--white); padding:12px 20px; border-radius:8px;
  z-index:200; opacity:0; transition:.2s; pointer-events:none; font-size:14px; max-width:90vw;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
.toast.bad{background:var(--alert)}

/* ============================================================ signature */
.sigpad{border:1px dashed var(--sage-70); border-radius:8px; background:var(--white); position:relative; touch-action:none}
.sigpad canvas{display:block; width:100%; height:150px; border-radius:8px}
.sigpad .sighint{position:absolute; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; color:var(--sage-70); font-size:13px; pointer-events:none}
.sigpad.has .sighint{display:none}
.sigtools{display:flex; gap:10px; align-items:center; margin-top:6px; font-size:12px; color:var(--sage-70)}
.sigtools button{background:transparent; border:1px solid var(--mist); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:11px; color:var(--sage)}
/* Floats & Tills strip */
.ftstrip{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px}
.ftcol h3{font-size:12px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin-bottom:8px}
.fttill{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; background:var(--white); border:1px solid var(--mist); border-radius:8px; padding:10px 12px; margin-bottom:6px; cursor:pointer; font-size:14px; min-height:44px}
.fttill.done{border-color:var(--good); background:var(--good-bg)}
.fttill.locked{opacity:.55; cursor:not-allowed}
.fttill .st{font-size:11px; color:var(--sage-70); white-space:nowrap}
.fttill.done .st{color:var(--good); font-weight:600}
.ftlock{background:var(--attention-bg); color:var(--attention); border-radius:8px; padding:12px 14px; margin-bottom:14px; font-size:14px}
.ftlock.open{background:var(--good-bg); color:var(--good)}
@media (max-width:480px){ .ftstrip{grid-template-columns:1fr} }

/* ============================================================ kiosk */
#kiosk{max-width:640px; margin:0 auto; padding:20px}
#kiosk header.top{border-radius:var(--radius) var(--radius) 0 0}
.checklist{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.checkpill{
  border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600;
  background:var(--sage-10); color:var(--sage-70);
}
.checkpill.done{background:var(--good-bg); color:var(--good)}

@media (max-width:760px){
  .shell{padding:0 14px 48px}
  .topin,.tabsin{padding-left:14px; padding-right:14px}
  .pagehead h2{font-size:22px}
  table.grid td, table.grid th{padding:8px 8px}
}
/* Phone - this is where the Daily Cash Up / Safe Count / Float Count kiosk
   tiles actually get used, standing at the till. One column throughout,
   bigger tap targets, everything reachable with a thumb. */
@media (max-width:480px){
  #kiosk{padding:14px}
  .card{padding:16px}
  .row{grid-template-columns:1fr}
  .denomrow{gap:10px}
  .denomrow .dlabel{width:36px; font-size:11px}
  .denomrow .lineval{width:60px; font-size:12px}
  .btn{width:100%}
  .checklist{gap:6px}
  .checkpill{font-size:11px; padding:6px 11px}
}
.cuLines{margin-top:12px; border-top:1px solid var(--mist)} .cuLines>div{display:flex; justify-content:space-between; gap:12px; padding:7px 2px; font-size:15px}
.cuLines .tot{border-top:1px solid var(--mist); font-weight:700; font-size:16px} .cuLines .tot.big{font-size:20px; background:#EDF2ED; padding:10px 8px; border-radius:8px; margin-top:6px; border-top:0} .cuLines b.bad{color:#b3261e}
.cuTable{width:100%; border-collapse:collapse; font-size:14px} .cuTable th{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sage-70); text-align:left; padding:6px 6px; border-bottom:1px solid var(--mist)}
.cuTable td{padding:9px 6px; border-bottom:1px solid var(--mist); vertical-align:top} .cuTable .n{text-align:right; white-space:nowrap} .cuTable tr.tot td{font-weight:700; border-top:2px solid var(--celadon)}
.cuTable .ok{color:#2F5B31; font-weight:700} .cuTable .bad{color:#b3261e; font-weight:700} .cuTable tr.doneRow td{background:#F3F7F3} .okTag{color:#2F5B31; font-weight:700; font-size:13px}
.cuBank{border:2px solid var(--celadon)}
</style>
</head>

<script>
/* ==================================================================
   Financial Reporting
   Replaces the Excel/VBA workbook in the GM's OneDrive "Financial
   Reporting System" folder. One physical page, reached through four
   Staff Portal tiles: the full app (Accounts), and three kiosk deep
   links (?view=cashup under FOH, ?view=safe / ?view=float under

   fin_* tables have RLS on with no public policies - every call goes
   through the financial-api edge function with the service role.
   staff_email (injected by the portal into sessionStorage, same as
   every other app here) is the real access check; the page password
   below is just the door, same as till-reports/restaurant-ordering.
   ================================================================== */

const CFG = {
  SUPABASE_URL: "https://safcrtrfdzsnftghibot.supabase.co",
  SUPABASE_KEY: "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU",
  PORTAL_PASSWORD: "F1nancial#26",
  KEY: "bhb_financial_ok",
};

const VIEW = new URLSearchParams(location.search).get("view"); // null | "cashup" | "safe" | "float"

const S = {
  view: "dashboard", tills: [], staff: [], pettyCategories: [],
  safeFloatSub: "safe",

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => "£" + (Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const round2 = n => Math.round(((Number(n)||0) + Number.EPSILON) * 100) / 100;
function todayIso(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/London"}).format(new Date()); }
function ukDate(iso){
  const p = String(iso||"").slice(0,10).split("-"); if (p.length!==3) return "";
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function toast(msg, bad){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(toast._t);

async function call(action, payload){
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/financial-api", {
    method: "POST",
    headers: { "Content-Type":"application/json", Authorization:"Bearer "+CFG.SUPABASE_KEY, apikey: CFG.SUPABASE_KEY },
    body: JSON.stringify({ action, staff_email: staffEmail(), ...(payload||{}) }),
  });
  let d = {};
  try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) throw new Error(d.error || `Request failed (${r.status})`);
  return d;
}

/* ------------------------------------------------------------- CSV export
   Client-side only, no server round-trip - matches forecast-dashboard's
   downloadCsv/csvCell exactly, the established pattern in this codebase. */
function csvCell(v){
  if (v === null || v === undefined) return "";
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCsv(filename, columns, rows){
  if (!rows || !rows.length){ toast("Nothing to export.", true); return; }
  const header = columns.map(c => csvCell(c.label)).join(",");
  const body = rows.map(r => columns.map(c => csvCell(typeof c.value==="function" ? c.value(r) : r[c.value])).join(",")).join("\n");
  const blob = new Blob([header + "\n" + body], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------ denominations
   Fixed UK cash/coin set, largest first - mirrors the DENOMS constant in
   financial-api itself. Not a lookup table; these don't change. */
const DENOMS = [
  { key:"qty_50",  label:"£50",  value:50   },
  { key:"qty_20",  label:"£20",  value:20   },
  { key:"qty_10",  label:"£10",  value:10   },
  { key:"qty_5",   label:"£5",   value:5    },
  { key:"qty_2",   label:"£2",   value:2    },
  { key:"qty_1",   label:"£1",   value:1    },
  { key:"qty_50p", label:"50p",  value:0.5  },
  { key:"qty_20p", label:"20p",  value:0.2  },
  { key:"qty_10p", label:"10p",  value:0.1  },
  { key:"qty_5p",  label:"5p",   value:0.05 },
  { key:"qty_2p",  label:"2p",   value:0.02 },
  { key:"qty_1p",  label:"1p",   value:0.01 },
];
function denomGridHtml(prefix){
  return `<div class="denomlist">` + DENOMS.map(d => `
    <div class="denomrow">
      <span class="dlabel">${d.label}</span>
      <input type="number" min="0" step="0.01" inputmode="decimal" autocomplete="off" id="${prefix}_${d.key}" value="0"
             oninput="updateDenomTotal('${prefix}')"
             onkeydown="denomKeydown(event)" onfocus="this.select()">
      <span class="lineval" id="${prefix}_line_${d.key}">0 × ${d.label}</span>
    </div>`).join("") + `</div>
    <p class="muted" style="margin:4px 0 0">Total counted: <strong id="${prefix}_total">£0.00</strong></p>`;
}
// Enter moves to the next denomination down, same as Tab, so a count can be
// keyed in top to bottom without reaching for the mouse. On the last line
// it hands off to whatever field comes right after the list (e.g. Notes).
function denomKeydown(e){
  if (e.key !== "Enter") return;
  e.preventDefault();
  const list = Array.from(document.querySelectorAll(".denomlist input"));
  const i = list.indexOf(e.target);
  if (i === -1) return;
  if (i < list.length - 1) { list[i+1].focus(); return; }
  const all = Array.from(document.querySelectorAll("input, select, textarea, button"));
  const j = all.indexOf(e.target);
  if (j > -1 && j < all.length - 1) all[j+1].focus();
}
// Each box holds the POUNDS counted in that denomination (5.00 in the 20p
// box = £5.00 = 25 coins). The API still takes whole-coin quantities, so the
// amount is divided back down; an amount that isn't a whole number of that
// note/coin (e.g. £5.10 of 20p) is reported in `bad` and blocks the save.
function denomQty(d, raw){
  const amt = Math.max(0, Number(raw) || 0);
  const qty = Math.round(amt / d.value);
  const ok = Math.abs(qty * d.value - amt) < 0.005;
  return { amt, qty, ok };
}
function readDenoms(prefix){
  const out = {}; const bad = []; let total = 0;
  DENOMS.forEach(d => {
    const r = denomQty(d, $(`#${prefix}_${d.key}`)?.value);
    out[d.key] = r.qty; total += r.qty * d.value;
    if (!r.ok) bad.push(d.label);
  });
  return { values: out, total: Math.round(total * 100) / 100, bad };
}
function denomsBad(prefix){
  const { bad } = readDenoms(prefix);
  if (!bad.length) return false;
  toast(`Check ${bad.join(", ")}: the amount isn't a whole number of those notes/coins.`, true);
  return true;
}
function updateDenomTotal(prefix){
  DENOMS.forEach(d => {
    const inp = $(`#${prefix}_${d.key}`);
    const r = denomQty(d, inp?.value);
    const el = $(`#${prefix}_line_${d.key}`);
    if (el) { el.textContent = r.ok ? `${r.qty} × ${d.label}` : "not a whole no."; el.style.color = r.ok ? "" : "#b3261e"; }
  });
  const { total } = readDenoms(prefix);
  const t = $(`#${prefix}_total`); if (t) t.textContent = money(total);
  return total;
}

/* ============================================================ Cash Up */
const CU = { opening:null, standard:0, counted:false, stock:[], pending:0, ready:false };
const numv = id => { const v = Number(($(`#${id}`) || {}).value); return isFinite(v) ? v : 0; };
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const signed = n => (n < -0.004 ? "-" : n > 0.004 ? "+" : "") + money(Math.abs(n));
function viewCashUpEntry(){

/* The live sums: totals, how the count compares with the till, what to bank. Everything is worked out again on every keystroke. */
function cuRecalc(){
  if (!$("#cuForm")) return;
  updateDenomTotal("cu");
  const { total: notes } = readDenoms("cu"), petty = r2(numv("cu_petty")), cash = r2(notes + petty);
  const pdq = 0;   // cards are counted once for the whole day, not per till
  const expCash = r2(numv("cu_exp_cash")), expCard = r2(numv("cu_exp_card")), vouch = r2(numv("cu_vouchers")), room = r2(numv("cu_room")), expTotal = r2(expCash + expCard + vouch + room);
  $("#cu_l_notes").textContent = money(notes); $("#cu_l_petty").textContent = money(petty); $("#cu_l_cash").textContent = money(cash);
  $("#cu_l_exp").textContent = money(expTotal);
  const opening = CU.opening !== null ? CU.opening : CU.standard, std = CU.standard;
  const takings = r2(cash - opening), cashDiff = r2(takings - expCash), cardDiff = 0, totalDiff = cashDiff;
  const cls = d => Math.abs(d) < 0.005 ? "ok" : "bad";
  const row = (label, got, want, d) => `<tr><td>${label}</td><td class="n">${money(got)}</td><td class="n">${money(want)}</td><td class="n ${cls(d)}">${Math.abs(d) < 0.005 ? "Level" : signed(d)}</td></tr>`;
  $("#cu_check").innerHTML = `<h3 style="margin-bottom:10px;font-size:18px">Check against the till</h3>
    <table class="cuTable"><thead><tr><th></th><th class="n">Counted</th><th class="n">Till expects</th><th class="n">Difference</th></tr></thead><tbody>
      ${row("Cash taken today <span class='muted'>(total cash less this morning's float)</span>", takings, expCash, cashDiff)}
      <tr><td>Cards <span class='muted'>(checked once for the whole day, against Worldpay)</span></td><td class="n"></td><td class="n">${money(expCard)}</td><td class="n"></td></tr>
      <tr><td>Vouchers and room charge</td><td class="n" colspan="2">${money(vouch + room)}</td><td class="n"></td></tr>
</tbody></table>
    ${expTotal === 0 && cash === 0 ? `<p class="hint" style="margin:8px 0 0">Fill in the cash and the till's figures above and this shows whether they agree.</p>` : ""}`;
  { const L = CU.linked, me = S.tills.find(t => t.key === $("#cu_till").value);
    if (L) {
      const others = L.parts.filter(p => p.till_key !== $("#cu_till").value);
      const done = others.filter(p => p.done), waiting = others.filter(p => !p.done);
      const comb = r2(totalDiff + done.reduce((a, p) => a + p.variance, 0));
      $("#cu_check").innerHTML += `<div class="linkbox card" style="margin:14px 0 0"><h3>${esc(L.label)} are checked together</h3>
        <table><tbody>${done.map(p => `<tr><td>${esc(p.label)} (already cashed up)</td><td class="n ${cls(p.variance)}">${signed(p.variance)}</td></tr>`).join("")}
        <tr><td>${esc(me ? me.label : "This till")} (this count)</td><td class="n ${cls(totalDiff)}">${signed(totalDiff)}</td></tr>
        ${waiting.length ? "" : `<tr class="tot"><td>Combined difference</td><td class="n ${cls(comb)}">${Math.abs(comb) < 0.005 ? "Level" : signed(comb)}</td></tr>`}</tbody></table>
        ${waiting.length ? `<p class="hint" style="margin:8px 0 0">${waiting.map(p => esc(p.label)).join(" and ")} still to be cashed up. The combined difference shows once both are done.</p>` : ""}</div>`;
    } }
  const toBank = r2(cash - std), diff = r2(opening - std);
  let why = "";
  if (!CU.counted) why = `No float count was recorded for this till this morning, so its standard float of ${money(std)} is assumed.`;
  else if (Math.abs(diff) < 0.005) why = `This morning's float was ${money(opening)}, exactly right.`;
  else if (diff > 0) why = `This morning's float was ${money(opening)}, which is ${money(diff)} over ${money(std)}. Taking this amount out leaves exactly ${money(std)}, so the extra ${money(diff)} goes to the bank.`;
  else why = `This morning's float was ${money(opening)}, which is ${money(-diff)} short of ${money(std)}. Taking this amount out leaves exactly ${money(std)}, so ${money(-diff)} less goes to the bank.`;
  $("#cu_bank").innerHTML = `<h3 style="margin-bottom:10px;font-size:18px">Cash to bank</h3>
    <div class="cuLines"><div><span>Total cash (notes, coins and petty cash receipts)</span><b>${money(cash)}</b></div>
      <div><span>Float to leave in the till</span><b>- ${money(std)}</b></div>
      <div class="tot big"><span>Cash to bank</span><b class="${toBank < 0 ? "bad" : ""}">${money(toBank)}</b></div></div>
    <p class="hint" style="margin:10px 0 0">${why}</p>
    ${toBank < 0 ? `<p class="hint" style="margin:6px 0 0;color:#b3261e">There is not enough cash to leave the float. Check the count.</p>` : ""}`;
  // saving is held until every stock line has been posted to the till and confirmed
  const blocked = CU.pending > 0;
  $("#cu_block").textContent = blocked ? `${CU.pending} stock line${CU.pending === 1 ? "" : "s"} still need${CU.pending === 1 ? "s" : ""} posting to the till at £0 and confirming above before this can be saved.` : "";
  $("#cu_save").disabled = blocked;
}
async function cuLoadContext(){
  const date = $("#cu_date") && $("#cu_date").value, till = $("#cu_till") && $("#cu_till").value; if (!date || !till) return;
  try {
    const c = await call("cashup.context", { business_date:date, till_key:till });
    CU.standard = Number(c.standard_float) || 0; CU.counted = !!c.float_counted; CU.opening = c.opening_float === null ? null : Number(c.opening_float); CU.linked = c.linked || null;
  } catch(e) {
    const t = S.tills.find(x => x.key === till); CU.standard = t ? Number(t.float_amount) || 0 : 0; CU.counted = false; CU.opening = null; CU.linked = null;
  }
  cuRecalc();
}
const STOCK_KIND = { wastage:"Wastage", rooms:"Rooms", weddings:"Wedding / event", showrounds:"Showround / meeting" };
async function cuLoadStock(){
  const date = $("#cu_date") && $("#cu_date").value, box = $("#cu_stock"); if (!date || !box) return;
  try {
    const d = await call("stock.pending", { business_date:date });

  } catch(e) { CU.stock = []; CU.pending = 0; box.style.display = "none"; cuRecalc(); return; }

  box.innerHTML = `<h3 style="margin-bottom:4px;font-size:18px">Stock to post to the till</h3>
    <div class="hint" style="margin-bottom:10px">Ring each of these through the till at a price of <b>£0</b> (override the price) so the stock comes off, then press Confirm. The cash up cannot be saved until every line is confirmed.</div>
    <table class="cuTable"><thead><tr><th>Type</th><th>Product</th><th class="n">Qty</th><th>Details</th><th></th></tr></thead><tbody>
    ${CU.stock.map((g, i) => `<tr class="${g.posted ? "doneRow" : ""}"><td>${esc(STOCK_KIND[g.kind] || g.kind)}${g.usage_date !== date ? `<div class="hint">${esc(ukDate(g.usage_date))}</div>` : ""}</td><td><b>${esc(g.product)}</b></td><td class="n"><b>${g.qty}</b> ${esc(g.unit || "")}</td><td class="hint">${esc(g.notes.join("; "))}${g.by.length ? `<div>${esc(g.by.join(", "))}</div>` : ""}</td>
      <td class="n">${g.posted ? `<span class="okTag">Posted &#10003;${g.posted_by ? " " + esc(g.posted_by) : ""}</span>` : `<button class="btn small" data-cu-confirm="${i}">Confirm posted to till</button>`}</td></tr>`).join("")}
    </tbody></table>`;
  box.querySelectorAll("[data-cu-confirm]").forEach(b => b.addEventListener("click", async () => {
    const g = CU.stock[Number(b.dataset.cuConfirm)]; b.disabled = true;
    try { await call("stock.confirm", { ids:g.ids, till_key:$("#cu_till").value }); toast("Confirmed."); await cuLoadStock(); }
    catch(e) { toast(e.message, true); b.disabled = false; }

  cuRecalc();
}
function wireCashUpEntry(){
  CU.opening = null; CU.counted = false; CU.pending = 0; CU.linked = null;
  const t = S.tills.find(x => x.key === $("#cu_till").value); CU.standard = t ? Number(t.float_amount) || 0 : 0;
  $("#cuForm").addEventListener("input", cuRecalc);
  const reload = () => { cuLoadContext(); cuLoadStock(); };
  $("#cu_till").addEventListener("change", reload); $("#cu_date").addEventListener("change", reload);
  $("#cu_save").addEventListener("click", saveCashUp);

}

async function saveCashUp(){
  const btn = $("#cu_save");
  if (denomsBad("cu")) return;
  if (CU.pending > 0) { toast("Confirm the stock lines first.", true); return; }
  const { values } = readDenoms("cu");
  const expCash = r2(numv("cu_exp_cash")), expCard = r2(numv("cu_exp_card")), vouch = r2(numv("cu_vouchers")), room = r2(numv("cu_room"));
  const payload = {
    business_date: $("#cu_date").value,
    till_key: $("#cu_till").value,
    ...values,
    petty_cash_receipts: $("#cu_petty").value,
    opening_float: CU.opening !== null ? CU.opening : CU.standard,
    float_retained_for_tomorrow: CU.standard,
    day_cards: true,   // cards are counted once for the day, when the last till is in
    vouchers_total: vouch,
    room_charge_total: room,
    expected_cash: expCash,
    expected_card: expCard,
    zread_reported_total: r2(expCash + expCard + vouch + room),

    notes: $("#cu_notes").value,
  };
  if (VIEW === "floatstills") {
    // Name comes from the portal login; the signature is required.

  btn.disabled = true; btn.textContent = "Saving…";

/* The day's cards: one total from Worldpay for every till together, compared with what the tills said they took in cards. Asked for when the last till with a float is cashed up. */
function dayResultHtml(d){
  const cls = x => Math.abs(x) < 0.005 ? "ok" : "bad", vt = x => Math.abs(x) < 0.005 ? "Level" : signed(x);
  const row = (a, b, c) => `<tr><td style="padding:3px 18px 3px 0; text-align:left">${a}</td><td style="text-align:right; font-variant-numeric:tabular-nums" ${c ? `class="${c}"` : ""}>${b}</td></tr>`;
  return `<table style="margin:0 auto; border-collapse:collapse">
    ${row("Cash variance, all tills", vt(d.cash_variance), cls(d.cash_variance))}
    ${row("Cards the tills expected", money(d.expected_card))}
    ${row("Cards from Worldpay", money(d.cards.total))}
    ${row("Cards variance", vt(d.card_variance), cls(d.card_variance))}
    <tr style="border-top:1px solid var(--celadon); font-weight:700"><td style="padding:8px 18px 0 0; text-align:left">Full day variance</td><td class="${cls(d.total_variance)}" style="text-align:right; padding-top:8px">${vt(d.total_variance)}</td></tr></table>`;
}
function cardsStep(box, date, day, finish){
  const el = document.createElement("div"); el.className = "card"; el.id = "dcCard"; box.appendChild(el);
  const was = (day && day.cards) || {};
  const exp = day ? day.expected_card : 0;
  const fld = (id, label, v) => `<div class="field"><label>${label}</label><input type="number" step="0.01" min="0" inputmode="decimal" autocomplete="off" id="${id}" value="${v || 0}" onfocus="this.select()"></div>`;
  el.innerHTML = `<h3 style="margin:0 0 4px;font-size:18px">Cards from Worldpay</h3>
    <div class="hint" style="margin-bottom:10px">${day && day.pending && day.pending.length ? `Still to cash up: ${esc(day.pending.join(", "))}. ` : "Every till with a float is cashed up. "}The card machines give one total for all of them. Enter the day's total from the Worldpay report.</div>
    <div class="row">${fld("dc_visa", "Visa", was.visa)}${fld("dc_mc", "Mastercard", was.mastercard)}${fld("dc_amex", "Amex", was.amex)}</div>
    <div class="cuLines"><div><span>Cards the tills expected</span><b>${money(exp)}</b></div><div><span>Cards from Worldpay</span><b id="dc_tot">£0.00</b></div><div class="tot"><span>Difference</span><b id="dc_diff">£0.00</b></div></div>
    <div class="opts2" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px"><button class="btn" id="dc_save">Save the day's cards</button><button class="btn ghost" id="dc_skip">Skip for now</button></div>`;
  const calc = () => { const t = r2(numv("dc_visa") + numv("dc_mc") + numv("dc_amex")), d = r2(t - exp); $("#dc_tot").textContent = money(t); const b = $("#dc_diff"); b.textContent = Math.abs(d) < 0.005 ? "Level" : signed(d); b.className = Math.abs(d) < 0.005 ? "ok" : "bad"; };
  el.addEventListener("input", calc); calc();
  $("#dc_skip").addEventListener("click", finish);
  $("#dc_save").addEventListener("click", async () => {
    const b = $("#dc_save"); b.disabled = true; b.textContent = "Saving…";
    try {
      const out = await call("daycards.save", { business_date:date, visa:$("#dc_visa").value, mastercard:$("#dc_mc").value, amex:$("#dc_amex").value });
      toast("Day's cards saved.");
      el.className = "card donecard"; el.innerHTML = `<h3 style="margin:0 0 10px">The full day</h3>${dayResultHtml(out.day)}<div class="opts2" style="display:flex; justify-content:center; margin-top:14px"><button class="btn" id="dc_done">Done</button></div>`;
      $("#dc_done").addEventListener("click", finish);
      const thr = Number(out.note_threshold) || 20; if (Math.abs(out.day.total_variance) > thr) largeVariancePrompt(date, "day", "Full day", out.day.total_variance, true);
    } catch(e) { toast(e.message, true); b.disabled = false; b.textContent = "Save the day's cards"; }
  });
}

/* Linked tills (Bar + Restaurant, Marquee 1 + 2): after a save, ask about the other till, and once both are in show the difference across the pair. */
function cuAfterSave(out){
  const finish = () => { if (VIEW === "floatstills") ftBack(); else afterSave("cashup", "cashup-history"); };
  const L = out.linked, box = $("#ft") || $("#kioskForm"), thr = Number(out.note_threshold) || 20;
  const askNotes = (v, key, label, isGroup) => { if (Math.abs(v) > thr) largeVariancePrompt(out.cashup.business_date, key, label, v, isGroup); };
  const needCards = !!(out.day && out.day.needs_cards) && !!box;
  if (!L && !needCards) { const lbl = tillLabel(out.cashup.till_key); finish(); askNotes(Number(out.cashup.variance) || 0, out.cashup.till_key, lbl, false); return; }
  if (!L) {
    const v = Number(out.cashup.variance) || 0;
    box.innerHTML = `<div class="card donecard"><h3 style="margin:0 0 6px">Saved</h3><div>${esc(tillLabel(out.cashup.till_key))}: cash ${Math.abs(v) < 0.005 ? "level" : esc(signed(v))}</div></div>`;
    askNotes(v, out.cashup.till_key, tillLabel(out.cashup.till_key), false);
    cardsStep(box, out.cashup.business_date, out.day, finish); return;
  }
  if (!box) { finish(); if (L.complete) askNotes(L.total_variance, L.link_key, L.label, true); return; }
  const cls = d => Math.abs(d) < 0.005 ? "ok" : "bad", vtxt = d => Math.abs(d) < 0.005 ? "Level" : signed(d);
  const thisKey = out.cashup.till_key, waiting = L.parts.filter(p => !p.done && p.till_key !== thisKey);
  const split = `<table style="margin:0 auto; border-collapse:collapse">${L.parts.filter(p => p.done).map(p => `<tr><td style="padding:3px 18px 3px 0; text-align:left">${esc(p.label)}</td><td class="${cls(p.variance)}" style="text-align:right; font-variant-numeric:tabular-nums">${vtxt(p.variance)}</td></tr>`).join("")}
    ${L.complete ? `<tr style="border-top:1px solid var(--celadon); font-weight:700"><td style="padding:8px 18px 0 0; text-align:left">${esc(L.label)} together</td><td class="${cls(L.total_variance)}" style="text-align:right; padding-top:8px">${vtxt(L.total_variance)}</td></tr>` : ""}</table>`;
  box.innerHTML = `<div class="card donecard"><h3 style="margin:0 0 10px">Saved</h3>${split}
    ${L.complete ? `<p class="hint" style="margin:12px 0 0">The difference that counts is the ${esc(L.label)} total above. Cash ${vtxt(L.cash_variance)}${out.day && out.day.all_day_cards ? "" : `, cards ${vtxt(L.card_variance)}`}.</p>` : ""}
    ${waiting.length ? `<p style="margin:16px 0 0; font-size:17px"><b>Are you now cashing up ${waiting.map(p => esc(p.label)).join(" and ")}?</b></p><div class="opts2"><button class="btn" id="cuNextYes">Yes, cash up ${esc(waiting[0].label)}</button><button class="btn ghost" id="cuNextNo">No, not now</button></div>`
      : `<div class="opts2"><button class="btn" id="cuNextNo">Done</button></div>`}</div>`;
  window.scrollTo(0, 0);
  if (L.complete) askNotes(L.total_variance, L.link_key, L.label, true);
  if (needCards) { const nb = $("#cuNextNo"); if (nb && !$("#cuNextYes")) nb.closest(".opts2").remove(); cardsStep(box, out.cashup.business_date, out.day, finish); return; }
  $("#cuNextNo").addEventListener("click", finish);
  const yes = $("#cuNextYes");
  if (yes) yes.addEventListener("click", () => {
    const next = waiting[0].till_key;
    if (VIEW === "floatstills") { ftOpen("cashup", next); return; }
    afterSave("cashup", "cashup-history");
    const sel = $("#cu_till"); if (sel) { sel.value = next; sel.dispatchEvent(new Event("change")); }
  });
}

function tillGroup(key){ const t = S.tills.find(x => x.key === key); return t && t.link_key ? { key:t.link_key, label:t.link_label || t.link_key } : { key:null, label:"" }; }

async function wirePettyCashEntry(){
  await ensurePettyCategories();
  $("#pc_category").innerHTML = categoryOptions();
  $("#pc_save").addEventListener("click", savePettyCash);
  const file = $("#pc_file");
  $("#pc_scan").addEventListener("click", ()=> file.click());

  file.addEventListener("ds-cancel", showPettyReceipt);
}
function showPettyReceipt(){
  const f = $("#pc_file").files[0], box = $("#pc_rbox");
  if (box.dataset.url) { URL.revokeObjectURL(box.dataset.url); box.dataset.url = ""; }
  if (!f){
    box.innerHTML = `<button type="button" class="btn ghost" id="pc_scan">Scan the receipt</button>
      <span class="muted" style="font-size:12px">Lay it flat - it is straightened and saved as a black and white copy against this entry.</span>`;
    $("#pc_scan").addEventListener("click", ()=> $("#pc_file").click());
    return;
  }
  const url = URL.createObjectURL(f); box.dataset.url = url;
  box.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Scanned receipt" style="height:84px;border:1px solid var(--line,#ddd);border-radius:6px;vertical-align:middle"></a>
    <span class="checkpill done">Receipt scanned</span>
    <button type="button" class="btn ghost" id="pc_rescan">Scan again</button>
    <button type="button" class="btn ghost" id="pc_rdel">Remove</button>`;
  $("#pc_rescan").addEventListener("click", ()=> $("#pc_file").click());
  $("#pc_rdel").addEventListener("click", ()=>{ $("#pc_file").value = ""; showPettyReceipt(); });
}
async function putReceipt(url, file){
  const r = await fetch(url, { method:"PUT", headers:{ "Content-Type": file.type || "image/png", "x-upsert":"true" }, body: file });
  if (!r.ok) throw new Error("upload " + r.status);
}
async function savePettyCash(){
  const btn = $("#pc_save");
  const payload = {
    business_date: $("#pc_date").value, category_key: $("#pc_category").value,
    description: $("#pc_desc").value, amount: $("#pc_amount").value,
    staff_name: $("#pc_staff").value.trim(),
  };
  if (!payload.category_key){ toast("Pick a category.", true); return; }
  if (!payload.staff_name){ toast("Type the name of the person spending the cash.", true); $("#pc_staff").focus(); return; }
  const receipt = $("#pc_file").files[0] || null;
  if (!receipt && !confirm("No receipt scanned. Save this entry without one?")) return;
  if (receipt){ payload.with_receipt = true; payload.receipt_ext = /jpe?g/i.test(receipt.type) ? "jpg" : "png"; }
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    const saved = await call("pettycash.save", payload);
    if (receipt){
      btn.textContent = "Uploading receipt…";
      let url = saved.receipt_upload_url, ok = false;
      for (let i = 0; i < 3 && !ok; i++){
        try {
          if (!url) url = (await call("pettycash.receipt_sign", { id: saved.entry.id })).receipt_upload_url;
          await putReceipt(url, receipt); ok = true;
        } catch(e) { url = null; }
      }
      if (!ok) toast("Entry saved, but the receipt did not upload. Please tell the GM - keep the paper receipt.", true);
      else toast("Saved with receipt - thank you.");
    } else toast("Saved - thank you.");
    if (VIEW === "pettycash") {
      // Kiosk: clear the form for the next entry and refresh today's list.
      $("#pc_amount").value = "0"; $("#pc_desc").value = ""; $("#pc_file").value = ""; showPettyReceipt();
      refreshKioskChecklist("pettycash");
    } else {
      goView("pettycash-history");
    }
  } catch(e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = "Save entry"; }
}

function pcModal(html){
  const old = $("#pcModal"); if (old) old.remove();

  m.addEventListener("mousedown", e => { if (e.target === m) m.remove(); }); document.body.appendChild(m); return m;
}
const pcClose = () => { const m = $("#pcModal"); if (m) m.remove(); };
async function pettyEditForm(r){
  if (!r) return;
  await ensurePettyCategories();
  const m = pcModal(`<h2>Edit petty cash entry</h2><p class="sub">Changes are recorded with who made them. The balance and the safe's expected total follow.</p>
    <div class="row"><div class="field"><label>Date</label><input type="date" id="pe_date" value="${esc(String(r.business_date).slice(0,10))}"></div>
      <div class="field"><label>Category</label><select id="pe_cat">${categoryOptions(r.category_key)}</select></div>
      <div class="field"><label>Amount</label><input type="number" step="0.01" min="0" id="pe_amount" value="${esc(r.amount)}"></div></div>
    <div class="field"><label>Description</label><input type="text" id="pe_desc" value="${esc(r.description||"")}"></div>
    <div class="field"><label>Spent by</label><input type="text" id="pe_staff" maxlength="60" value="${esc(r.staff_name||"")}"></div>
    ${r.receipt_path ? `<p class="muted" style="font-size:13px">A scanned receipt is attached.</p>` : `<label style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><input type="checkbox" id="pe_paper"${r.has_receipt ? " checked" : ""}> The paper receipt is kept (no scan)</label>`}
    <div class="acts"><button class="btn" id="pe_save">Save changes</button><button class="btn ghost" id="pe_cancel">Cancel</button><button class="btn ghost" id="pe_del" style="margin-left:auto;color:var(--alert,#8C4A3F);border-color:var(--alert,#8C4A3F)">Delete this entry</button></div>
    <div id="pe_msg" style="margin-top:8px;font-size:14px;color:var(--alert,#8C4A3F)"></div>
    <h3>History of this entry</h3><div id="pe_hist" class="muted" style="font-size:13px">Loading…</div>`);
  $("#pe_cancel").onclick = pcClose;
  $("#pe_save").onclick = async () => {
    try {
      const res = await call("pettycash.update", { id: r.id, business_date: $("#pe_date").value, category_key: $("#pe_cat").value, amount: $("#pe_amount").value, description: $("#pe_desc").value, staff_name: $("#pe_staff").value, has_receipt: $("#pe_paper") ? $("#pe_paper").checked : undefined });
      pcClose(); toast(res.unchanged ? "Nothing changed." : "Saved."); loadPettyCashHistory();
    } catch(e){ $("#pe_msg").textContent = e.message; }
  };
  $("#pe_del").onclick = () => {
    const reason = prompt("Delete this entry? It drops out of the balance and the safe's expected total, and stays on record (Show deleted).\n\nWhy is it being deleted? (optional)");
    if (reason === null) return;
    call("pettycash.delete", { id: r.id, reason }).then(() => { pcClose(); toast("Deleted."); loadPettyCashHistory(); }).catch(e => { $("#pe_msg").textContent = e.message; });
  };
  try {
    const a = await call("pettycash.audit", { id: r.id }), lab = { business_date: "Date", category_key: "Category", amount: "Amount", description: "Description", staff_name: "Spent by", has_receipt: "Paper receipt kept", receipt: "Receipt" };
    const val = (k, v) => v == null || v === "" ? "blank" : k === "business_date" ? ukDate(v) : k === "category_key" ? categoryLabel(v) : k === "amount" ? money(v) : String(v);
    $("#pe_hist").innerHTML = a.events.length ? a.events.map(e => `<div style="padding:4px 0;border-top:1px solid var(--mist,#eee)"><b>${esc(e.by_name||"")}</b> ${esc(new Date(e.at).toLocaleString("en-GB",{timeZone:"Europe/London",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}: ${e.action === "edit" ? Object.entries(e.changes||{}).map(([k, v]) => `${esc(lab[k]||k)} ${esc(val(k, v[0]))} → ${esc(val(k, v[1]))}`).join("; ") : e.action === "receipt" ? "receipt added" : e.action === "delete" ? "deleted" + (e.changes && e.changes.reason ? " (" + esc(e.changes.reason) + ")" : "") : "restored"}</div>`).join("") : "Never changed since it was entered.";
  } catch(e){ $("#pe_hist").textContent = e.message; }
}
async function pettyAddReceipt(id){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment"); inp.setAttribute("data-scan", "receipt"); inp.hidden = true; document.body.appendChild(inp);
  const done = () => setTimeout(() => inp.remove(), 500);
  inp.addEventListener("ds-cancel", done);
  inp.addEventListener("change", async () => {
    const file = inp.files[0]; if (!file) return done();
    try {
      const saved = await call("pettycash.receipt_add", { id, receipt_ext: /jpe?g/i.test(file.type) ? "jpg" : "png" });
      let url = saved.receipt_upload_url, ok = false;
      for (let i = 0; i < 3 && !ok; i++){
        try { if (!url) url = (await call("pettycash.receipt_sign", { id })).receipt_upload_url; await putReceipt(url, file); ok = true; } catch(e) { url = null; }
      }
      toast(ok ? "Receipt added." : "The receipt did not upload. Try Add receipt again, and keep the paper one.", !ok);
    } catch(e){ toast(e.message, true); }
    done(); loadPettyCashHistory();
  });
  inp.click();
}

/* ---------- Rezlynx Period End parsing (client-side, via SheetJS) ----------
   Same label/code-search approach as the Excel system's own VBA importer:
   search for text labels and codes rather than trust fixed cell addresses,
   so Rezlynx adding or removing a payment/department code later doesn't
   break this. */
function cellStr(v){ return v==null ? "" : String(v).trim(); }
function findLabelSameRow(rows, label){
  for (let r=0; r<rows.length; r++){
    const row = rows[r] || [];
    for (let c=0; c<row.length; c++){
      if (cellStr(row[c]) === label){
        for (let c2=c+1; c2<row.length; c2++){
          if (cellStr(row[c2]) !== "") return row[c2];
        }
      }
    }
  }
  return null;
}
function findCodeRows(rows, code){
  const out = [];
  rows.forEach((row,r)=>{ if (row && cellStr(row[0]) === code) out.push(r); });
  return out;
}
function numAt(rows, r, c){
  const row = rows[r] || [];
  const v = row[c];
  if (typeof v === "number") return v;
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
// Payment codes (Z_CASH etc.) - Gross Total sits in whichever of two
// candidate columns (Ledger / Non Ledger CC Gross Total) is populated.
function codeValue(rows, code){
  const idxs = findCodeRows(rows, code);
  if (!idxs.length) return 0;
  const j = numAt(rows, idxs[0], 9), l = numAt(rows, idxs[0], 11);
  return Math.abs(j || l);
}
// Deposit codes - single Gross Total column, kept as-is (not abs()'d),
// matching Rezlynx's own sign convention. Informational only.
function depositCodeValue(rows, code){
  const idxs = findCodeRows(rows, code);
  return idxs.length ? numAt(rows, idxs[0], 12) : 0;
}
// Revenue category codes appear twice - a header row, then a Total row.
// The second occurrence is the one with the real figure.
function categoryTotalGross(rows, code){
  const idxs = findCodeRows(rows, code);
  if (!idxs.length) return 0;
  return numAt(rows, idxs[idxs.length > 1 ? 1 : 0], 12);
}
function revenueGrandTotalGross(rows){
  let headerRow = -1;
  for (let r=0; r<rows.length; r++){
    if (cellStr((rows[r]||[])[0]) === "Analysis Codes Revenue"){ headerRow = r; break; }
  }
  if (headerRow === -1) return 0;
  for (let r=headerRow+1; r<rows.length; r++){
    if (cellStr((rows[r]||[])[0]) === "Totals") return numAt(rows, r, 12);
  }
  return 0;
}
// "02/08/2026 05:20:14" (UK, DD/MM/YYYY) -> a plain ISO string. Informational
// timestamps only, so no timezone handling beyond that.
function parseRezlynxDateTime(s){
  if (!s) return null;
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if (!m) return null;
  const [, d, mo, y, h, mi, se] = m;
  return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}T${h.padStart(2,"0")}:${mi}:${se}`;
}
function parseRezlynxWorkbook(rows){
  const periodId = findLabelSameRow(rows, "Period ID");
  const periodOpenedIso = parseRezlynxDateTime(findLabelSameRow(rows, "Period Opened"));
  const periodClosedIso = parseRezlynxDateTime(findLabelSameRow(rows, "Period Closed"));
  const accom = categoryTotalGross(rows, "ACCOM");
  const grand = revenueGrandTotalGross(rows);
  const depBfwd = depositCodeValue(rows, "DEP_BFWD");
  const depRecvd = depositCodeValue(rows, "DEP_RECVD");
  const depRefud = depositCodeValue(rows, "DEP_REFUD");
  return {
    period_id: periodId ? String(periodId) : null,
    period_opened: periodOpenedIso, period_closed: periodClosedIso,
    fnb_events_revenue: round2(grand - accom),
    accommodation_revenue: round2(accom),
    epos_cash: round2(codeValue(rows, "Z_CASH")),
    epos_card: round2(codeValue(rows,"Z_VISA") + codeValue(rows,"Z_MASTER") + codeValue(rows,"Z_AMEX")),
    epos_vouchers: round2(codeValue(rows, "Z_VOUCHER")),
    deposit_brought_forward: round2(depBfwd),
    deposit_received: round2(depRecvd),
    deposit_refunded: round2(depRefud),
    deposit_closing_balance: round2(depBfwd + depRecvd - depRefud),
    grand_total: round2(grand),
    business_date: periodOpenedIso ? periodOpenedIso.slice(0,10) : todayIso(),
  };
}

async function onRezlynxFileChosen(ev){
  const file = ev.target.files && ev.target.files[0];

    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"" });

// Section A. Two possible sources for a date's Rezlynx row: the End of Day
// "Combined" report pushed by push_forecast_dashboard.ps1 (revenue by
// department, nett, no EPOS split) or a full Period End uploaded here
// (gross, with the EPOS split). Say which one it is - they're different
// bases and the variance checks read differently against each.
function rezImportedHtml(rez){
  if (!rez) return `<p class="muted" style="font-size:13px;margin:0">No End of Day report has been pushed for this date yet - press <strong>Update Forecast Portal</strong> in the forecast workbook once that day's report has been processed.</p>`;
  const raw = rez.raw_parse_json || {};
  const isEod = raw.source === "eod_combined";
  const row = (label, val) => `<tr><td>${label}</td><td class="num">${val}</td></tr>`;
  // GRATUITY arrives as a department row in the file but isn't revenue -
  // the report itself totals it separately, so show it separately below.
  // jsonb doesn't keep object key order, so sort here: biggest first.
  const depts = isEod && raw.departments
    ? Object.keys(raw.departments).filter(k => k !== "GRATUITY")
        .sort((a, b) => (Number(raw.departments[b])||0) - (Number(raw.departments[a])||0))
        .map(k => row(esc(k), money(raw.departments[k]))).join("")
    : "";
  return `
    <p class="muted" style="font-size:12px;margin:0 0 8px">
      ${isEod
        ? `Imported from End of Day report <strong>${esc(rez.source_filename||"")}</strong> · nett (ex VAT) · revenue only`
        : `Imported from Period End upload <strong>${esc(rez.source_filename||"")}</strong> · gross · includes EPOS split`}
    </p>
    <div class="tablewrap"><table class="grid"><tbody>
      ${depts}
      ${row("<strong>Accommodation</strong>", `<strong>${money(rez.accommodation_revenue)}</strong>`)}
      ${row("<strong>F&amp;B / Events (everything except accommodation)</strong>", `<strong>${money(rez.fnb_events_revenue)}</strong>`)}
      ${row("<strong>Revenue total</strong>", `<strong>${money(rez.grand_total)}</strong>`)}
      ${isEod && raw.gratuity_total != null ? row("Gratuity (not revenue)", money(raw.gratuity_total)) : ""}
      ${!isEod ? row("EPOS Cash", money(rez.epos_cash)) + row("EPOS Card", money(rez.epos_card)) + row("EPOS Vouchers", money(rez.epos_vouchers)) : ""}
    </tbody></table></div>`;
}

/* ------------------------------------------------------ signature pad
   A finger on a phone or a mouse on a PC; stored as a small PNG with the
   count it signs for. Pointer events cover both. */
function sigPadHtml(prefix){
  return `<div class="field"><label>Signature</label>
    <div class="sigpad" id="${prefix}_sigpad"><canvas id="${prefix}_sig"></canvas><div class="sighint">Sign here</div></div>
    <div class="sigtools"><span id="${prefix}_signame"></span><span class="spacer"></span><button type="button" onclick="sigClear('${prefix}')">Clear</button></div></div>`;
}
function wireSigPad(prefix, name){
  const c = $(`#${prefix}_sig`); if (!c) return;
  const pad = c.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = Math.round((rect.width || 320) * dpr); c.height = Math.round(150 * dpr);
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#262626";
  let drawing = false, has = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.addEventListener("pointerdown", e => { drawing = true; try { c.setPointerCapture(e.pointerId); } catch(_){} const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); e.preventDefault(); });
  c.addEventListener("pointermove", e => { if (!drawing) return; const [x,y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); has = true; pad.classList.add("has"); e.preventDefault(); });
  const up = () => { drawing = false; };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up); c.addEventListener("pointerleave", up);
  c._has = () => has;
  c._reset = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); has = false; pad.classList.remove("has"); };
  const nm = $(`#${prefix}_signame`); if (nm && name) nm.textContent = `Signed by ${name}`;
}
function sigClear(prefix){ const c = $(`#${prefix}_sig`); if (c && c._reset) c._reset(); }
function sigData(prefix){ const c = $(`#${prefix}_sig`); if (!c || !c._has || !c._has()) return null; return c.toDataURL("image/png"); }

/* ------------------------------------------------------ Floats & Tills
   The day's cash handling in order. Floats are a morning check - open
   07:00-12:00 London, otherwise locked until the GM unlocks the day - and
   a till can only be cashed up once its float is in. Nothing is typed about
   who: the portal login's name goes on the record, with a signature. */
const FT = { tab:null, till:null, status:null };
function viewFloatsTills(){ return `<div id="ft"><div class="loading">Loading…</div></div>`; }
async function wireFloatsTills(){ await loadFloatsTills(); }

    ]);
    FT.status = { w, floats: fl.done || [], cashups: cu.done || [], day: cu.day || null };
    renderFloatsTills();
  } catch(e){ box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function renderFloatsTills(){
  const box = $("#ft"); if (!box || !FT.status) return;
  const st = FT.status, w = st.w;
  const floatDone = new Set(st.floats.map(r => r.till_key)), cuDone = new Set(st.cashups.map(r => r.till_key));
  const isAdmin = w.me && w.me.role === "admin";
  const canFloat = w.open || isAdmin;
  if (FT.tab === "float" && FT.till) {
    box.innerHTML = `<p><button class="btn ghost" style="min-height:38px" onclick="ftBack()">&larr; Back to today's list</button></p>` + viewFloatEntry() + sigPadHtml("fl");
    ftPrepForm("fl", FT.till); wireFloatEntry(); wireSigPad("fl", w.me.name); return;
  }
  if (FT.tab === "cashup" && FT.till) {
    box.innerHTML = `<p><button class="btn ghost" style="min-height:38px" onclick="ftBack()">&larr; Back to today's list</button></p>` + viewCashUpEntry() + sigPadHtml("cu");
    ftPrepForm("cu", FT.till); wireCashUpEntry(); wireSigPad("cu", w.me.name); return;
  }
  if (FT.tab === "cards") {
    box.innerHTML = `<p><button class="btn ghost" style="min-height:38px" onclick="ftBack()">&larr; Back to today's list</button></p><div id="cardsHost"></div>`;
    cardsStep($("#cardsHost"), todayIso(), st.day, ftBack); return;
  }
  const when = w.unlocked && w.unlock ? new Date(w.unlock.unlocked_at).toLocaleTimeString("en-GB", { timeZone:"Europe/London", hour:"2-digit", minute:"2-digit" }) : "";
  const lock = w.open
    ? `<div class="ftlock open">Floats are open${w.in_window ? ` until ${esc(w.end)}` : ""}${w.unlocked && w.unlock ? ` - unlocked by ${esc(w.unlock.unlocked_by_name)} at ${when}` : ""}.${isAdmin && w.unlocked ? ` <button class="btn ghost small" onclick="ftUnlock(true)">Lock again</button>` : ""}</div>`
    : `<div class="ftlock">Floats are counted between ${esc(w.start)} and ${esc(w.end)} - it's ${esc(w.now)}. ${isAdmin ? `<button class="btn small" onclick="ftUnlock(false)">Unlock today</button>` : "Ask the GM to unlock today if a float still needs counting."}</div>`;
  const tillBtn = (t, kind) => {
    const done = kind === "float" ? floatDone.has(t.key) : cuDone.has(t.key);
    const ready = kind === "float" ? canFloat : (floatDone.has(t.key) || isAdmin);
    const label = done ? (kind === "float" ? "Counted ✓" : "Cashed up ✓") : (ready ? (kind === "float" ? "Count float" : "Cash up") : (kind === "float" ? "Locked" : "Float first"));
    return `<button class="fttill${done ? " done" : ""}${!ready && !done ? " locked" : ""}" ${!ready && !done ? "disabled" : ""} onclick="ftOpen('${kind}','${esc(t.key)}')"><span>${esc(t.label)}</span><span class="st">${label}</span></button>`;
  };
  box.innerHTML = lock + `<div class="ftstrip">
      <div class="ftcol"><h3>1. Morning floats</h3>${S.tills.map(t => tillBtn(t, "float")).join("")}</div>
      <div class="ftcol"><h3>2. Cash up</h3>${S.tills.map(t => tillBtn(t, "cashup")).join("")}</div>
    </div>
    ${(() => { const d = st.day; if (!d || !d.all_day_cards) return ""; const ready = d.complete || isAdmin; return `<div class="ftstrip" style="margin-top:14px"><div class="ftcol"><h3>3. Cards from Worldpay</h3>
      <button class="fttill${d.cards ? " done" : ""}${!ready && !d.cards ? " locked" : ""}" ${!ready && !d.cards ? "disabled" : ""} onclick="ftOpen('cards','day')"><span>The day's cards</span><span class="st">${d.cards ? "Entered ✓ " + money(d.cards.total) : (ready ? "Enter cards" : "After every till")}</span></button></div></div>`; })()}
    <p class="muted" style="font-size:12px">Every count is recorded with your name (${esc(w.me.name)}) and your signature. Count again to correct one - the latest count is the one that stands.</p>`;
}
function ftPrepForm(prefix, tillKey){
  const hide = el => { const f = el && el.closest(".field"); if (f) f.style.display = "none"; };
  const dateEl = $(`#${prefix}_date`), tillEl = $(`#${prefix}_till`), staffEl = $(`#${prefix}_staff`);
  if (dateEl){ dateEl.value = todayIso(); hide(dateEl); }
  if (tillEl){ tillEl.value = tillKey; hide(tillEl); }
  if (staffEl) hide(staffEl);
  const h = $("#ft .pagehead h2"); if (h) h.textContent = (prefix === "fl" ? "Float: " : "Cash up: ") + tillLabel(tillKey);
}
function ftOpen(kind, till){ FT.tab = kind; FT.till = till; renderFloatsTills(); window.scrollTo(0, 0); }
function ftBack(){ FT.tab = null; FT.till = null; loadFloatsTills(); }
async function ftUnlock(lock){
  try { await call("floats.unlock", { business_date: todayIso(), lock: !!lock }); toast(lock ? "Locked again." : "Unlocked for today."); loadFloatsTills(); }
  catch(e){ toast(e.message, true); }
}
async function refreshPettyKiosk(){
  try {
    const t = todayIso();
    const d = await call("pettycash.list", { start:t, end:t });
    const rows = d.entries || [];
    const spent = rows.reduce((s, r) => s + (Number(r.amount)||0), 0);
    $("#kioskChecklist").innerHTML = rows.length
      ? rows.map(r => `<span class="checkpill done">${esc(categoryLabel(r.category_key))} ${money(r.amount)}${r.staff_name?" · "+esc(r.staff_name):""}</span>`).join("") +
        `<span class="checkpill">Today: ${rows.length} entr${rows.length===1?"y":"ies"}, ${money(spent)} · balance ${money(d.current_balance)}</span>`
      : `<span class="checkpill">Nothing entered today yet · balance ${money(d.current_balance)}</span>`;
  } catch(e) { /* the strip is a nicety */ }
}
async function bootKiosk(view){
  const k = KIOSK[view];
  if (view === "cashuphistory") document.body.classList.add("widepage");
  $("#kioskTitle").innerHTML = `${esc(k.title)}<small>Black Horse Beamish</small>`;
  const body = $("#kiosk");
  body.innerHTML = `<div id="kioskChecklist" class="checklist"></div><div id="kioskForm"></div>`;
  body.querySelector("#kioskForm").innerHTML = k.entry();
  k.wire();
  await refreshKioskChecklist(view);
}
async function refreshKioskChecklist(view){
  if (view === "pettycash") return refreshPettyKiosk();
  if (view === "floatstills") return loadFloatsTills();
  const k = KIOSK[view];
  if (!k.statusAction) return;
  try {
    const out = await call(k.statusAction, { business_date: todayIso() });
    const doneKeys = new Set((out.done||[]).map(r => r[k.doneKey]));
    const items = k.checklistOver().map(t => {
      const done = doneKeys.has(t.key);
      return `<span class="checkpill${done?' done':''}">${esc(k.doneLabel(t.key))}${done?' ✓':''}</span>`;
    }).join("");
    $("#kioskChecklist").innerHTML = items;
  } catch(e) { /* the checklist is a nicety, a failure here shouldn't block entry */ }
}

/* -------------------------------------------------------------- init */
(function init(){
  let saved = "";
  try { saved = sessionStorage.getItem(CFG.KEY); } catch(e){}
  if (saved === "1") { $("#gate").style.display = "none"; boot(); }
  else { openGate(); }
})();
</script>
</body>
</html>
