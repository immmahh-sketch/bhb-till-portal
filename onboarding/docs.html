<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<meta charset="utf-8">

<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --ink-2:#4a4f4a; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --alert:#8C4A3F; --alert-bg:#F6EAE8; --good:#4F6B4F; --good-bg:#EDF2ED;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07);
  --ink-pen:#14213d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);background:var(--bone);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.005em}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- frame: header, progress, scrolling slide, fixed bottom bar ---- */
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bone)}
.ph{background:var(--sage);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{font-family:var(--display);font-size:21px;line-height:1.1;flex:1;min-width:0;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:10px;letter-spacing:var(--track-label);text-transform:uppercase;opacity:.75}
#savestat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px;min-height:20px;opacity:0;transition:opacity .25s}
#savestat.on{opacity:1}
#savestat .tick{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#2b2415;font-size:11px}
.bar{height:5px;background:rgba(0,0,0,.08);flex:none}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.pb{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-padding:16px 0 90px}
.pin{max-width:560px;margin:0 auto;padding:18px 16px 110px}
.pf{background:#fff;border-top:1px solid var(--mist);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;flex:none}
.pf .btn{flex:1.5;font-size:13px;letter-spacing:.1em;padding:10px 12px}
.pf .btn.ghost{flex:.8}
.pf.compact{padding-top:6px;padding-bottom:6px}
#banner{flex:none;background:var(--alert-bg);color:var(--alert);border-top:3px solid var(--alert);padding:10px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
#banner .btn{min-height:40px;padding:8px 14px;flex:none}
#banner.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}

.btn{border:1px solid var(--sage);background:var(--sage);color:#fff;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:hover{background:var(--sage-dark)}
.btn.ghost{background:#fff;color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b2415}
.btn.small{min-height:44px;padding:8px 14px;font-size:12px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.btn.busy{pointer-events:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- a slide ---- */
.slide{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--sage);margin:0 0 4px}
.title{font-size:34px;line-height:1.05;margin:0 0 10px;text-wrap:balance;outline:none}
.lead{font-weight:600;font-size:17px;line-height:1.45;color:var(--ink-2);margin:0 0 16px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.muted{color:var(--sage-70)}
.small{font-size:14px}
p{margin:0 0 12px}
.ticklist{list-style:none;padding:0;margin:8px 0}
.ticklist li{position:relative;padding:6px 0 6px 32px}
.ticklist li::before{content:'';position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:50%;background:var(--sage-10)}
.ticklist li::after{content:'✓';position:absolute;left:4px;top:8px;color:var(--sage);font-weight:800;font-size:14px;line-height:22px}
.callout{background:var(--attention-bg);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;margin:12px 0;font-weight:600;font-size:15px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{font-size:11px;letter-spacing:var(--track-label);text-transform:uppercase;font-weight:700;color:var(--sage-70);padding-top:3px}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}

/* ---- fields ---- */
.field{margin:0 0 16px;border:0;padding:0;min-width:0}
.field>label:not(.tick):not(.plan),.field>legend,.lbl{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin:0 0 6px;padding:0}
.field .opt-tag{font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--sage-70)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=number],.field input[type=search],.field select,.field textarea{
  width:100%;border:1.5px solid var(--celadon);border-radius:10px;padding:12px 14px;background:#fff;font-size:17px;min-height:50px;line-height:1.3;-webkit-appearance:none;appearance:none}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%234E5F4F' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(201,165,107,.55)}
.field input:disabled{background:var(--sage-10);color:var(--sage-70)}
.field [aria-invalid="true"]{border-color:var(--alert);background:#fffafa}
.hint{font-size:14px;color:var(--sage-70);margin:6px 0 0;line-height:1.4}
.ferr{color:var(--alert);font-size:14px;font-weight:700;margin:6px 0 0;display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.ferr::before{content:'!';flex:none;width:18px;height:18px;border-radius:50%;background:var(--alert);color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:8px}
.tick{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#fff;border:1.5px solid var(--celadon);border-radius:10px;cursor:pointer;min-height:50px;font-weight:600;line-height:1.35}
.tick input{flex:none;width:24px;height:24px;margin:1px 0 0;accent-color:var(--sage)}
.tick:has(input:checked){border-color:var(--sage);background:var(--sage-10)}
.tick:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}

/* ---- big choice buttons (training skin: .opt / .tfrow) ---- */
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow.one{grid-template-columns:1fr}
.opt{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;text-align:center;background:#fff;border:2px solid var(--mist);border-radius:12px;padding:14px;min-height:62px;cursor:pointer;font-size:19px;line-height:1.3;font-weight:800;position:relative}
.opt:hover{border-color:var(--celadon)}
.opt.sel{border-color:var(--sage);background:var(--sage-10);color:var(--sage-dark)}
.opt.sel::after{content:'✓';display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sage);color:#fff;font-size:14px;flex:none}
.opt.left{justify-content:flex-start;text-align:left;font-size:17px;font-weight:700}
.opt.skip{grid-column:1 / -1;min-height:48px;font-size:15px;font-weight:600;color:var(--ink-2)}
.opt.bad.sel{border-color:var(--sage)}
.plan{display:flex;gap:14px;align-items:flex-start;background:#fff;border:2px solid var(--mist);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.plan input{flex:none;width:26px;height:26px;margin:2px 0 0;accent-color:var(--sage)}
.plan b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.plan small{display:block;font-size:14px;color:var(--ink-2);line-height:1.4;margin-top:3px}
.plan:has(input:checked){border-color:var(--sage);background:var(--sage-10)}
.plan:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}

/* ---- health questions ---- */
.q{border:0;margin:0 0 22px;padding:0;min-width:0}
.q legend{padding:0;font-family:var(--display);font-size:25px;line-height:1.2;font-weight:700;margin:0 0 6px}
.q .hint{margin:0 0 10px}
.q .more{margin-top:12px}
.q .more label{display:block;font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.q .more textarea{width:100%;border:1.5px solid var(--celadon);border-radius:10px;padding:12px 14px;font-size:17px;min-height:96px;background:#fff}
.q .more textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(201,165,107,.55)}
.minicard{background:#fff;border:1.5px solid var(--celadon);border-radius:12px;padding:14px 14px 4px;margin-bottom:12px}
.minicard h4{font-size:19px;margin-bottom:10px;color:var(--sage)}
.rev{display:grid;gap:10px;margin:8px 0 16px}
.rev .item{background:#fff;border-left:4px solid var(--gold);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.rev .item b{font-family:var(--display);font-size:19px;line-height:1.2;display:block}
.rev .item p{margin:6px 0 0;font-size:15px;color:var(--ink-2);white-space:pre-line;overflow-wrap:anywhere}
.rev .item button{margin-top:8px}
.linkbtn{background:none;border:0;color:var(--sage);font-weight:700;text-decoration:underline;padding:10px 4px;min-height:44px;cursor:pointer;font-size:15px}
.decl{border-left:4px solid var(--sage);background:#fff;border-radius:0 10px 10px 0;padding:14px 16px;font-family:var(--display);font-size:20px;line-height:1.35;font-weight:600;margin:0 0 16px;box-shadow:var(--shadow)}

/* ---- signature pad ---- */
.sigwrap{position:relative;border:2px dashed var(--celadon);border-radius:12px;background:#fff;height:190px;overflow:hidden}
.sigwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.sigwrap .base{position:absolute;left:18px;right:18px;bottom:44px;border-bottom:1.5px solid var(--celadon);pointer-events:none}
.sigwrap .base::before{content:'✕';position:absolute;left:0;bottom:2px;color:var(--sage-70);font-size:16px}
.sigwrap .ph2{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--sage-70);font-size:14px;pointer-events:none;font-weight:600}
.sigwrap.has .ph2{display:none}
.sigrow{display:flex;gap:10px;margin-top:8px;align-items:center;justify-content:space-between}
.sigthumb{background:#fff;border:1.5px solid var(--celadon);border-radius:12px;padding:10px;text-align:center;min-height:90px;display:grid;place-items:center}
.sigthumb img{max-width:100%;max-height:110px;display:block}
.sigthumb.saved{color:var(--sage);font-weight:700}
.signed{display:flex;gap:12px;align-items:center;background:var(--good-bg);border-left:4px solid var(--good);border-radius:8px;padding:14px 16px;font-weight:700;color:var(--good)}
.signed::before{content:'✓';display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;flex:none}

/* ---- contract document ---- */
.rhint{position:sticky;top:8px;z-index:5;background:var(--sage);color:#fff;border-radius:999px;padding:8px 16px;margin:0 auto 10px;width:max-content;max-width:100%;font-size:13px;font-weight:700;letter-spacing:.06em;box-shadow:0 4px 14px rgba(38,38,38,.25)}
.doc{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px 26px;margin-bottom:16px;font-size:15.5px;line-height:1.55;border-top:4px solid var(--gold)}
.doc p{margin:0 0 10px}
.c-cover{text-align:center;font-family:var(--display);font-size:21px;font-weight:600;margin:0 0 10px!important}
.c-title{text-align:center;font-size:34px;line-height:1.05;margin:20px 0 18px;color:var(--sage)}
.c-h{display:grid;grid-template-columns:42px 1fr;gap:0 4px;font-size:22px;line-height:1.2;margin:22px 0 8px;color:var(--sage-dark)}
.c-c,.c-s{display:grid;grid-template-columns:42px 1fr;gap:0 4px}
.c-c .n,.c-s .n{color:var(--sage-70);font-weight:700;font-variant-numeric:tabular-nums}
.c-s{margin-left:42px;grid-template-columns:34px 1fr}
.c-p{white-space:pre-line}
.c-p.b{font-weight:800}
.c-p.i{margin-left:42px}
.card h3,.card h2{line-height:1.15}
.doc .t,.doc .c-p,.doc .c-cover,.doc .c-title,.c-h span{overflow-wrap:anywhere;white-space:pre-line}

/* ---- states ---- */
.center{text-align:center;padding:48px 12px}
.center .big{font-family:var(--display);font-size:56px;line-height:1;color:var(--sage);margin-bottom:6px}
.centerspin{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;color:var(--sage-70);text-align:center;font-weight:600}
.centerspin .spin{width:34px;height:34px;border-width:3px;color:var(--sage)}
.done-badge{width:84px;height:84px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-size:44px;margin:10px auto 16px;box-shadow:0 8px 24px rgba(78,95,79,.35)}
.recap{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.recap li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;font-weight:700}
.recap .ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:#fff;font-size:15px}
.recap .ck.no{background:var(--attention-bg);color:var(--attention);border:2px solid var(--gold)}
.recap li span.grow{flex:1;min-width:0}
.recap li small{display:block;color:var(--sage-70);font-weight:600}

/* ---- documents + modal ---- */
.upcard h3{font-size:23px;margin-bottom:4px}
.upcard .hint{margin:0 0 10px}
.files{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;background:var(--sage-10);border-radius:10px;padding:6px 6px 6px 8px;min-height:56px}
.chip .th{flex:none;width:44px;height:44px;border-radius:8px;background:#fff;border:1px solid var(--celadon);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--sage);overflow:hidden}
.chip .th img{width:100%;height:100%;object-fit:cover;display:block}
.chip .nm{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .nm small{display:block;font-weight:500;color:var(--sage-70);font-size:12px}
.chip .x{flex:none;width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--alert);font-size:26px;line-height:1;cursor:pointer}
.chip .x:hover{background:var(--alert-bg)}
.pbar{display:block;height:5px;border-radius:99px;background:var(--mist);overflow:hidden;margin-top:4px;position:relative}
.pbar i{position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--gold);border-radius:99px;animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{to{left:60%}}
.upcard .btn{width:100%}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mback{position:absolute;inset:0;background:rgba(38,38,38,.55)}
.mbox{position:relative;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:22px 20px 20px;max-width:420px;width:100%;border-top:5px solid var(--gold);animation:in .2s ease both}
.mbox h2{font-size:30px;line-height:1.1;margin-bottom:10px;color:var(--sage-dark)}
.mbox p{font-weight:600;color:var(--ink-2)}
.mbox .btn{width:100%;margin-top:6px}
.bring{background:var(--attention-bg);border-left:5px solid var(--gold);border-radius:8px;padding:14px 16px;margin:0 0 16px}
.bring h3{font-size:24px;margin-bottom:6px}
.bring p{margin:0 0 8px;font-weight:600}
.bring p:last-child{margin:0}
@media (max-width:360px){.title{font-size:30px}.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1 / -1}.q legend{font-size:23px}}
@media (min-width:700px){.title{font-size:42px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.spin{animation:none;border-style:dotted}}

.req{margin:0 0 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--sage-70)}
.req.must{color:var(--alert)}
.pf .btn.done{flex:1}
#sum li{padding:4px 0}
</style>
</head>

<script>
(function(){
'use strict';
/* Existing team members: upload right to work documents. The token in the link is the key.
   window.__MOCK_API__(body) -> Promise<{status, body}> replaces fetch when set before this script runs. */
const CFG = { URL:'https://safcrtrfdzsnftghibot.supabase.co/functions/v1/onboarding-api', KEY:'sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU' };
const $ = (s, r) => (r || document).querySelector(s);

const S = { token:'', starter:{}, submitted:false, uploads:[], pend:{ rtw:[], ni:[] }, upErr:{ rtw:[], ni:[] }, thumbs:{}, busy:false, more:false };

}
const main = () => $('#main');
function showBanner(msg, retry){ const b = $('#banner'); b.innerHTML = '<span>' + esc(msg) + '</span>' + (retry ? '<button type="button" class="btn small ghost" data-act="retry">Try again</button>' : ''); b.hidden = false; }
function hideBanner(){ const b = $('#banner'); b.hidden = true; b.innerHTML = ''; }
function showFatal(kind){
  const msgs = {
    expired:['This link has run out', 'Ask Black Horse Beamish to send you a new one.'],
    cancelled:['This link is no longer in use', 'If you think that is a mistake, please contact Black Horse Beamish.'],
    notfound:['We cannot find this link', 'Please check you opened the whole link from your email. If it still does not work, ask Black Horse Beamish to send you a new one.']
  };
  const m = msgs[kind] || msgs.notfound;
  closeModal(false); $('#foot').hidden = true; hideBanner();
  main().innerHTML = '<section class="center slide"><div class="big" aria-hidden="true">\u2766</div><h1 class="title" id="ttl" tabindex="-1">' + m[0] + '</h1><p class="lead">' + m[1] + '</p></section>';
  const h = $('#ttl'); if (h) h.focus({ preventScroll:true });
}
function showRetry(msg, fn){
  $('#foot').hidden = true; hideBanner();
  main().innerHTML = '<section class="center slide"><div class="big" aria-hidden="true">\u2766</div><h1 class="title" id="ttl" tabindex="-1">We could not load this page</h1><p class="lead">' + esc(msg) + '</p><button type="button" class="btn" id="retrybtn">Try again</button></section>';
  $('#retrybtn').onclick = function(){ if (this.classList.contains('busy')) return; this.classList.add('busy'); fn(); };
  const h = $('#ttl'); if (h) h.focus({ preventScroll:true });
}
function showLoading(text){ $('#foot').hidden = true; main().innerHTML = '<div class="centerspin" role="status"><span class="spin" aria-hidden="true"></span><span id="ltext">' + esc(text) + '</span></div>'; clearTimeout(showLoading.t); showLoading.t = setTimeout(() => { const l = $('#ltext'); if (l) l.textContent = text + ' (slow connection, please wait)'; }, 7000); }

/* ---------------------------------------------------------------- uploads (same as the new starter page) */
const UPKINDS = [
  { k:'rtw', title:'Proof of your right to work', req:true, hint:'Your passport, or the share code letter or screenshot if you have a visa or BRP, or your birth certificate together with proof of your National Insurance number.' },
  { k:'ni', title:'Proof of your National Insurance number', req:false, hint:'A P60, a payslip, a letter from HMRC or your National Insurance card.' }
];
const MAXFILES = 5, MAXBYTES = 6 * 1024 * 1024;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function upCard(u){
  const mine = S.uploads.filter(f => f.kind === u.k), pend = S.pend[u.k], errs = S.upErr[u.k], full = mine.length + pend.length >= MAXFILES;
  return '<div class="card upcard" id="up-' + u.k + '"><h3>' + esc(u.title) + '</h3><p class="req' + (u.req ? ' must' : '') + '">' + (u.req ? 'Needed' : 'Optional') + '</p><p class="hint">' + esc(u.hint) + '</p>'
    + ((mine.length || pend.length) ? '<ul class="files" aria-label="Files added">'
      + mine.map(f => '<li class="chip"><span class="th" aria-hidden="true">' + (S.thumbs[f.id] ? '<img alt="" src="' + esc(S.thumbs[f.id]) + '">' : (/\.pdf$/i.test(f.name) ? 'PDF' : 'IMG')) + '</span><span class="nm">' + esc(f.name) + '<small>' + (f.size ? esc(fmtSize(f.size)) + ' \u00b7 ' : '') + 'Uploaded</small></span><button type="button" class="x" data-act="rmfile" data-id="' + esc(f.id) + '" aria-label="Remove ' + esc(f.name) + '">\u00d7</button></li>').join('')
      + pend.map(f => '<li class="chip pend"><span class="th" aria-hidden="true"><span class="spin"></span></span><span class="nm">' + esc(f.name) + '<small>' + esc(f.msg || 'Uploading') + '</small><span class="pbar" role="progressbar" aria-label="Uploading"><i></i></span></span></li>').join('') + '</ul>' : '')
    + '<button type="button" class="btn ghost" data-act="pickfile" data-kind="' + u.k + '"' + (full ? ' disabled' : '') + '>Take a photo or choose a file</button>'
    + '<input type="file" class="sr" tabindex="-1" aria-hidden="true" id="file-' + u.k + '" data-up="' + u.k + '" accept="image/*,application/pdf" multiple>'
    + (full ? '<p class="hint">That is the most you can add here (' + MAXFILES + '). Remove one to add another.</p>' : '')
    + '<div aria-live="polite">' + errs.map(m => '<div class="ferr">' + esc(m) + '</div>').join('') + '</div></div>';
}

function refreshCard(k){ const el = document.getElementById('up-' + k), u = UPKINDS.find(x => x.k === k); if (el && u) el.outerHTML = upCard(u); updateDone(); updateSummary(); }
const userErr = m => Object.assign(new Error(m), { user:true });
const readB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read')); r.readAsDataURL(blob); });
function loadImg(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(userErr('We could not read "' + file.name + '". Please try another photo, or take a new one.')); }; im.src = url; }); }
const toBlob = (cv, q) => new Promise(res => cv.toBlob(res, 'image/jpeg', q));
async function prepareFile(f){
  const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  if (isPdf) {
    if (f.size > MAXBYTES) throw userErr('"' + f.name + '" is bigger than 6 MB. Please choose a smaller file, or bring it on the day.');
    return { name:f.name, data:await readB64(f) };
  }
  if (!/^image\//.test(f.type) && !/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)) throw userErr('"' + f.name + '" is not a photo or a PDF. Please choose a photo or a PDF.');
  const im = await loadImg(f), w0 = im.naturalWidth || im.width, h0 = im.naturalHeight || im.height, sc = Math.min(1, 2000 / Math.max(w0, h0));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w0 * sc)); cv.height = Math.max(1, Math.round(h0 * sc));
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
  const blob = await toBlob(cv, 0.85); if (!blob) throw userErr('We could not read "' + f.name + '". Please try another photo.');
  if (blob.size > MAXBYTES) throw userErr('"' + f.name + '" is still bigger than 6 MB. Please try a different photo.');
  const t = document.createElement('canvas'), ts = Math.min(1, 96 / Math.min(cv.width, cv.height)); t.width = Math.max(1, Math.round(cv.width * ts)); t.height = Math.max(1, Math.round(cv.height * ts));
  t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
  return { name:(f.name || 'photo').replace(/\.[^.]*$/, '') + '.jpg', data:await readB64(blob), thumb:t.toDataURL('image/jpeg', 0.7) };
}
async function addFiles(kind, list){
  let files = Array.from(list || []); S.upErr[kind] = [];
  if (!files.length) return refreshCard(kind);
  const room = MAXFILES - S.uploads.filter(f => f.kind === kind).length - S.pend[kind].length;
  if (room <= 0) { S.upErr[kind].push('You already have ' + MAXFILES + ' files here. Remove one to add another.'); return refreshCard(kind); }
  if (files.length > room) { S.upErr[kind].push('You can add up to ' + MAXFILES + ' files here, so we have only taken the first ' + room + '.'); files = files.slice(0, room); }
  const items = files.map(f => ({ f:f, name:f.name || 'photo', msg:'Waiting' })); items.forEach(it => S.pend[kind].push(it)); refreshCard(kind);
  for (const it of items) {
    it.msg = 'Getting it ready'; refreshCard(kind);
    try {
      const prep = await prepareFile(it.f); it.msg = 'Uploading'; refreshCard(kind);
      const r = await api('p.upload', { kind:kind, name:prep.name, data:prep.data });
      if (r.file) { S.uploads.push(r.file); if (prep.thumb) S.thumbs[r.file.id] = prep.thumb; }
    } catch(e) {
      if (e.code === 'expired' || e.code === 'cancelled' || e.code === 'notfound') { S.pend[kind] = []; return showFatal(e.code); }
      S.upErr[kind].push(e.user ? e.message : e.network ? 'We could not upload "' + it.name + '". Please check your signal and try again.' : (e.message || 'We could not upload "' + it.name + '".'));
    }
    S.pend[kind] = S.pend[kind].filter(x => x !== it); refreshCard(kind);
  }
}
async function removeFile(id){
  const f = S.uploads.find(x => String(x.id) === String(id)); if (!f || f.removing) return; f.removing = true; S.upErr[f.kind] = [];
  try { await api('p.upload_remove', { file_id:f.id }); S.uploads = S.uploads.filter(x => x !== f); }
  catch(e) { f.removing = false; if (e.code === 'expired' || e.code === 'cancelled' || e.code === 'notfound') return showFatal(e.code); S.upErr[f.kind].push(e.network ? 'We could not remove "' + f.name + '". Please check your signal and try again.' : (e.message || 'We could not remove that file.')); }
  refreshCard(f.kind);
}

const count = k => S.uploads.filter(f => f.kind === k).length;
function summaryHTML(){
  const r = count('rtw'), i = count('ni'), pl = c => c + (c === 1 ? ' photo or file' : ' photos or files');
  const rows = [];
  if (r) rows.push('Right to work: ' + pl(r)); if (i) rows.push('National Insurance number: ' + pl(i));
  return rows.length ? '<ul class="ticklist" id="sum">' + rows.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<p id="sum" class="muted">Nothing uploaded yet.</p>';
}
function updateSummary(){ const el = document.getElementById('sum'); if (el) el.outerHTML = summaryHTML(); }
function bringPanel(){
  return '<div class="bring"><h3>Bring your originals</h3><p>Please also bring your original documents next time you are working, so a manager can check them in person. Uploading photos just saves time.</p></div>';
}
function updateDone(){
  const b = document.getElementById('donebtn'); if (!b) return;
  const ok = count('rtw') > 0; if (ok) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true');
  const n = document.getElementById('donenote'); if (n) n.hidden = ok;
}

/* ---------------------------------------------------------------- pop-up */
function showPopup(){
  if (document.getElementById('modal')) return;
  const m = document.createElement('div'); m.id = 'modal'; m.className = 'modal';
  m.innerHTML = '<div class="mback"></div><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mtext"><h2 id="mt">Please bring your originals</h2><p id="mtext">Whether or not you upload photos here, please also bring your original documents next time you are working, so a manager can check them in person. Uploading just saves time.</p><button type="button" class="btn" id="mok">OK, I understand</button></div>';
  document.body.appendChild(m);
  const app = $('#app'); app.setAttribute('aria-hidden', 'true'); try { app.inert = true; } catch(e){}
  const ok = $('#mok'); ok.focus();
  m.onkeydown = e => { if (e.key === 'Escape') { e.preventDefault(); closeModal(true); } else if (e.key === 'Tab') { e.preventDefault(); ok.focus(); } };
  ok.onclick = () => closeModal(true);
  $('.mback', m).onclick = () => closeModal(true);
}
function closeModal(focus){
  const m = document.getElementById('modal'); if (!m) return; m.remove();
  const app = $('#app'); app.removeAttribute('aria-hidden'); try { app.inert = false; } catch(e){}
  if (focus) { const h = $('#ttl'); if (h) h.focus({ preventScroll:true }); }
}

/* ---------------------------------------------------------------- the page */
function render(){
  const s = S.starter, name = esc(s.first_name || 'there'), cards = UPKINDS.map(upCard).join('');
  if (S.submitted) {
    main().innerHTML = '<section class="slide" aria-labelledby="ttl"><h1 class="title" id="ttl" tabindex="-1">Thanks ' + name + '</h1>'
      + '<div class="center" style="padding:6px 0 0"><div class="done-badge" aria-hidden="true">\u2713</div></div>'
      + '<p class="lead">Please bring your originals next time you are working so we can check them.</p>'
      + '<div class="card"><h3 style="font-size:22px;margin-bottom:4px">What you uploaded</h3>' + summaryHTML() + '</div>' + bringPanel()
      + '<div id="morewrap"' + (S.more ? ' hidden' : '') + '><button type="button" class="btn ghost" style="width:100%" data-act="more">Add another file</button></div>'
      + '<div id="cardswrap"' + (S.more ? '' : ' hidden') + '>' + cards + '</div></section>';
    $('#foot').hidden = true;
  } else {
    main().innerHTML = '<section class="slide" aria-labelledby="ttl"><h1 class="title" id="ttl" tabindex="-1">Hello ' + name + '</h1>'
      + '<p class="lead">We are making sure our staff records are complete. This takes about two minutes.</p>' + cards + bringPanel() + '</section>';
    const f = $('#foot'); f.hidden = false;
    f.innerHTML = '<button type="button" class="btn done" id="donebtn" data-act="done"' + (count('rtw') ? '' : ' aria-disabled="true"') + '>Done</button>';
    main().insertAdjacentHTML('beforeend', '<p class="muted small" id="donenote" style="text-align:center"' + (count('rtw') ? ' hidden' : '') + '>Add a photo of your right to work document to finish.</p>');
  }
  const h = $('#ttl'); if (h) h.focus({ preventScroll:true });
}
async function onDone(){
  if (S.busy) return;
  hideBanner();
  if (S.pend.rtw.length || S.pend.ni.length) return showBanner('Please wait for your photos to finish uploading.', false);
  if (!count('rtw')) { showBanner('Please add a photo of your right to work document first.', false); const c = document.getElementById('up-rtw'); if (c) c.scrollIntoView({ block:'center' }); return; }
  S.busy = true; const b = $('#donebtn'); if (b) { b.classList.add('busy'); b.innerHTML = '<span class="spin" aria-hidden="true"></span>Sending'; }
  try { await api('p.docs_done'); S.submitted = true; S.busy = false; render(); $('#pb').scrollTop = 0; }
  catch(e) {
    S.busy = false; if (b) { b.classList.remove('busy'); b.textContent = 'Done'; }
    if (e.code === 'expired' || e.code === 'cancelled' || e.code === 'notfound') return showFatal(e.code);
    showBanner(e.message || 'Something went wrong. Please try again.', !!e.network);
  }
}
function notForYou(){
  $('#foot').hidden = true;
  main().innerHTML = '<section class="center slide"><div class="big" aria-hidden="true">\u2766</div><h1 class="title" id="ttl" tabindex="-1">This link is for current team members</h1><p class="lead">This page is only for people who already work with us. Your new starter onboarding is on a different page, so please carry on there.</p>'
    + '<a class="btn" style="text-decoration:none" href="start.html?t=' + encodeURIComponent(S.token) + '">Go to my onboarding</a></section>';
  const h = $('#ttl'); if (h) h.focus({ preventScroll:true });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'done') return onDone();
  if (act === 'retry') { hideBanner(); return onDone(); }
  if (act === 'more') { S.more = true; $('#morewrap').hidden = true; $('#cardswrap').hidden = false; $('#cardswrap').scrollIntoView({ block:'start', behavior:'auto' }); return; }
  if (act === 'pickfile') { const i = document.getElementById('file-' + b.dataset.kind); if (i) i.click(); return; }
  if (act === 'rmfile') return removeFile(b.dataset.id);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.up) { const files = Array.from(t.files || []); t.value = ''; addFiles(t.dataset.up, files); }
});
document.addEventListener('focusin', e => {
  const t = e.target; if (!t.matches || !t.matches('input:not([type=checkbox]):not([type=file]),textarea,select')) return;
  setTimeout(() => { if (document.activeElement === t) t.scrollIntoView({ block:'center' }); }, 320);
});
function fitFrame(){ const vv = window.visualViewport, app = $('#app'); if (!vv) return; app.style.height = vv.height + 'px'; app.style.top = vv.offsetTop + 'px'; $('#foot').classList.toggle('compact', vv.height < 520); }
if (window.visualViewport) { visualViewport.addEventListener('resize', fitFrame); visualViewport.addEventListener('scroll', fitFrame); fitFrame(); }

async function boot(){
  showLoading('Opening your page');
  S.token = (new URLSearchParams(location.search).get('t') || '').trim();
  if (!S.token) return showFatal('notfound');
  let o;
  try { o = await api('p.open'); }
  catch(e) { if (e.code === 'expired' || e.code === 'cancelled' || e.code === 'notfound') return showFatal(e.code); return showRetry(e.message || 'Something went wrong.', boot); }
  S.starter = o.starter || {}; S.submitted = !!o.submitted;
  S.uploads = (Array.isArray(o.uploads) ? o.uploads : []).filter(f => f.kind === 'rtw' || f.kind === 'ni');
  if (S.starter.kind !== 'existing') return notForYou();
  render(); showPopup();
}
boot();
})();
</script>
</body>
