<!DOCTYPE html>
<html lang="en-GB" data-brand="bhb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Onboarding - Black Horse Beamish</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#4E5F4F; --sage-70:#7B887C; --sage-10:#EDEFED; --sage-dark:#3B483C;
  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --attention-ink:#6d5320;
  --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --red:#B3261E; --red-bg:#FCECEA; --red-dark:#5E1414;
  --good:#4F6B4F; --good-bg:#EDF2ED; --blue:#35607F; --blue-bg:#E8EFF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:980px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important}
.off{display:none!important}
a{color:var(--sage)}

/* gate + header */
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}

/* controls */
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:42px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2}
.btn:hover{background:var(--sage-dark)} .btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#2b2415} .btn.small{min-height:34px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger:hover{background:var(--alert-bg)}
.btn.solid-danger{background:var(--red); border-color:var(--red)} .btn.solid-danger:hover{background:var(--red-dark)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px; min-height:34px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.empty{padding:36px 20px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:900; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.sechead{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:700; margin:24px 2px 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 8px}
.toolrow .sp{margin-left:auto}
.pagehead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 6px}
.pagehead h2{font-size:30px; color:var(--sage); line-height:1.1; margin-right:auto}
.pagehead h2.sm{font-size:26px}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0}
.field label,.lbl{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)}
.field input,.field select,.field textarea{border:1px solid var(--celadon); border-radius:8px; padding:10px 11px; background:#fff; width:100%; min-height:42px}
.field textarea{min-height:84px; resize:vertical}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--red); background:var(--red-bg)}
.field input:disabled,.field select:disabled{background:var(--sage-10); color:var(--sage-70)}
.ferr{color:var(--red); font-size:12.5px; font-weight:600; min-height:0}
.hint{font-size:12.5px; color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.pay{position:relative} .pay .cur{position:absolute; left:11px; top:31px; color:var(--sage-70); pointer-events:none} .pay input{padding-left:24px}
.pick{display:flex; gap:6px; flex-wrap:wrap}
.pick label{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--mist); background:var(--bone); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:14px; letter-spacing:0; text-transform:none; color:var(--ink); margin:0; font-weight:500; min-height:38px}
.pick label.on{background:var(--sage); color:#fff; border-color:var(--sage)}
.pick input{width:auto; margin:0; min-height:0; accent-color:var(--gold)}
.bigchoice{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
.bigchoice label{display:flex; flex-direction:column; gap:2px; border:2px solid var(--mist); background:#fff; border-radius:12px; padding:14px; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--ink); font-size:16px; font-weight:700; min-height:74px}
.bigchoice label small{font-weight:400; font-size:12.5px; color:var(--sage-70)}
.bigchoice label.on{border-color:var(--sage); background:var(--sage-10)}
.bigchoice input{position:absolute; opacity:0; width:1px; height:1px}
.bigchoice label:focus-within{outline:3px solid var(--gold); outline-offset:2px}
.switch{display:flex; gap:12px; align-items:flex-start; cursor:pointer}
.switch input{width:20px; height:20px; margin-top:2px; accent-color:var(--sage); flex:none; min-height:0}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* badges */
.badge{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--sage-10); color:var(--sage); white-space:nowrap; display:inline-block}
.badge.st-draft{background:var(--mist); color:#5c635c} .badge.st-link_sent,.badge.st-in_progress,.badge.st-signed{background:var(--blue-bg); color:var(--blue)}
.badge.st-submitted{background:var(--attention-bg); color:var(--attention-ink)} .badge.st-in_planday,.badge.st-complete{background:var(--good-bg); color:var(--good)}
.badge.st-cancelled{background:var(--mist); color:#777}
.badge.risk{background:var(--red); color:#fff} .badge.flags{background:var(--attention-bg); color:var(--attention-ink)} .badge.kind{background:#fff; border:1px solid var(--celadon); color:var(--sage)}
.badge.exp{background:var(--red-bg); color:var(--red)} .badge.excl{background:var(--red-dark); color:#fff}

/* skeletons */
.sk{background:linear-gradient(90deg,#ececec 25%,#f7f7f7 50%,#ececec 75%); background-size:200% 100%; animation:shim 1.3s linear infinite; border-radius:6px}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* list cards */
a.scard{display:block; text-decoration:none; color:inherit; padding:14px 16px 12px; border-left:4px solid var(--celadon)}
a.scard:hover{box-shadow:0 1px 2px rgba(38,38,38,.08),0 10px 28px rgba(38,38,38,.11)}
a.scard.hasrisk{border-left-color:var(--red)} a.scard.done{border-left-color:var(--good)} a.scard.cx{opacity:.75}
.scard .r1{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.scard h3{font-size:23px; line-height:1.15; color:var(--sage); overflow-wrap:anywhere}
.scard .sub{font-size:13.5px; color:var(--sage-70); overflow-wrap:anywhere}
.badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px}
.strip{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; list-style:none; margin:12px 0 4px; padding:0}
.strip li{text-align:center; font-size:10px; line-height:1.2; color:var(--sage-70); min-width:0; overflow-wrap:normal}
@media (max-width:430px){.strip{gap:3px} .strip li{font-size:9px; letter-spacing:-.01em} .strip li.done,.strip li.cur{font-weight:500}}
.strip li i{display:block; height:6px; border-radius:99px; background:var(--mist); margin-bottom:5px}
.strip li.done i{background:var(--sage)} .strip li.cur i{background:var(--gold)} .strip li.done,.strip li.cur{color:var(--ink); font-weight:600}
.strip.cx li i{background:var(--mist)!important}
.scard .foot{font-size:12.5px; color:var(--sage-70); margin-top:4px}
.scard .foot.bad{color:var(--red); font-weight:600}

/* detail */
.back{background:none; border:0; color:var(--sage); font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; font-size:12px; cursor:pointer; padding:14px 0 4px}
.dhead h2{font-size:34px; color:var(--sage); line-height:1.1; overflow-wrap:anywhere}
.kvs{display:block; margin:0}
.kv{display:grid; grid-template-columns:minmax(100px,38%) 1fr auto; gap:4px 10px; align-items:start; padding:8px 0; border-bottom:1px solid var(--mist); font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--sage-70); font-size:13px; margin:0} .kv dd{margin:0; overflow-wrap:anywhere; min-width:0}
.kv .copy{min-height:30px; padding:3px 10px}
.kv.nocopy{grid-template-columns:minmax(100px,38%) 1fr}
.sub-h{font-family:var(--display); font-size:20px; color:var(--sage); margin:14px 0 2px}
.sub-h:first-child{margin-top:0}
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:22px 1fr; gap:10px; padding:7px 0; position:relative; font-size:14.5px}
.tl li::before{content:""; position:absolute; left:10px; top:28px; bottom:-8px; width:2px; background:var(--mist)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px; height:22px; border-radius:50%; background:var(--mist); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800}
.tl li.done .dot{background:var(--sage)} .tl li.done::before{background:var(--sage)}
.tl .when{font-size:12.5px; color:var(--sage-70)} .tl li.todo{color:var(--sage-70)}

/* flag banners */
.flagbox{border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; border:2px solid; box-shadow:var(--shadow)}
.flagbox h3{font-size:25px; line-height:1.15; margin-bottom:4px; font-family:var(--display); font-weight:700}
.flagbox.risk{background:var(--red-bg); border-color:var(--red); color:#3b0f0c} .flagbox.risk h3{color:var(--red)}
.flagbox.review{background:var(--attention-bg); border-color:var(--attention); color:#3d3017} .flagbox.review h3{color:var(--attention-ink)}
.flagbox.exclusion{background:var(--red-dark); border-color:var(--red-dark); color:#fff} .flagbox.exclusion h3{color:#fff; font-size:27px}
.flagbox .lead{font-size:14px; margin:0 0 10px}
.fl{background:rgba(255,255,255,.75); border-radius:8px; padding:10px 12px; margin-top:8px; color:var(--ink)}
.flagbox.exclusion .fl{background:rgba(255,255,255,.95)}
.fl b.t{display:block; font-size:15.5px; overflow-wrap:anywhere}
.fl .ans{font-size:14px; margin-top:3px; overflow-wrap:anywhere} .fl .ans q{quotes:"\201C" "\201D"; font-style:italic}
.fl .note{font-size:13px; color:#5b4b2b; margin-top:3px}
.fl .why{font-size:12.5px; color:var(--sage-70); margin-top:3px}
.hz{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.hz span{font-size:11.5px; background:var(--red-bg); border:1px solid #e5b9b4; color:#6e1d17; padding:2px 8px; border-radius:99px; line-height:1.4}
.flagbox.review .hz span{background:var(--attention-bg); border-color:#e0cea8; color:var(--attention-ink)}
.hzall{margin-top:12px; padding-top:10px; border-top:1px dashed #d9a39d}
.hzall .lbl{color:#7a2a24}
.conf{font-size:12.5px; color:var(--sage-70); margin:6px 2px; display:flex; gap:6px}
.conf::before{content:"\1F512"; font-size:11px; margin-top:2px}
.rbox{border-top:1px solid var(--mist); margin-top:12px; padding-top:12px}

/* answers */
.q{padding:9px 0; border-bottom:1px solid var(--mist); display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:14.5px}
.q:last-child{border-bottom:0}
.q .qt{min-width:0; overflow-wrap:anywhere} .q .qa{font-weight:700; white-space:nowrap}
.q .qd{grid-column:1 / -1; background:var(--attention-bg); border-left:3px solid var(--attention); padding:6px 10px; border-radius:4px; font-size:14px; overflow-wrap:anywhere}
.q.yes{background:#fffaf0} .q.yes .qa{color:var(--attention-ink)}
.q.l-risk .qa,.q.l-exclusion .qa{color:var(--red)} .q.l-risk .qd{background:var(--red-bg); border-left-color:var(--red)}
.q.l-exclusion .qd{background:var(--red-bg); border-left-color:var(--red-dark)}
.q .lv{font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-left:6px; vertical-align:2px}
.q .qh{font-size:12.5px; color:var(--sage-70)}
details.sec{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px}
details.sec>summary{cursor:pointer; padding:14px 18px; font-family:var(--display); font-size:22px; font-weight:600; color:var(--sage); list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"\25B8"; font-size:15px; transition:transform .15s} details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>.in{padding:0 18px 16px}
.rows{display:grid; gap:8px}
.frow{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--mist)}
.frow:last-child{border-bottom:0} .frow .fn{font-weight:600; overflow-wrap:anywhere; min-width:0}
.frow .fm{font-size:12.5px; color:var(--sage-70)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin:8px 0; font-size:14px}
.notice.bad{background:var(--red-bg); color:#6e1d17} .notice.good{background:var(--good-bg); color:var(--good)} .notice.info{background:var(--sage-10); color:var(--sage-dark)}
.notice ul{margin:6px 0 0; padding-left:20px}
.linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
.linkbox input{flex:1 1 220px; min-width:0; border:1px solid var(--celadon); border-radius:8px; padding:9px 10px; background:var(--sage-10); font-size:13px}
.confirmbox{background:var(--red-bg); border:1px solid var(--red); border-radius:8px; padding:12px 14px; margin-top:12px}
.confirmbox.neutral{background:var(--attention-bg); border-color:var(--attention)}
.log{list-style:none; margin:0; padding:0; font-size:13.5px}
.log li{display:grid; grid-template-columns:150px 1fr; gap:2px 12px; padding:6px 0; border-bottom:1px solid var(--mist)}
.log li:last-child{border-bottom:0} .log .at{color:var(--sage-70); font-size:12.5px} .log .wh{overflow-wrap:anywhere}

/* modal */
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto}
.modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:760px; padding:20px 22px 18px}
.modal h3{font-size:25px; color:var(--sage); margin-bottom:10px}
.contract{max-height:62vh; overflow:auto; border:1px solid var(--mist); border-radius:8px; padding:16px 18px; background:#fffefb; font-family:Georgia,"Times New Roman",serif; font-size:14px; line-height:1.55; color:#222}
.contract p{margin:0 0 9px; overflow-wrap:anywhere}
.contract .cover{text-align:center; font-size:15px} .contract .ttl{text-align:center; font-size:21px; font-weight:700; margin:20px 0}
.contract .hd{font-weight:700; margin-top:16px; display:grid; grid-template-columns:44px 1fr}
.contract .cl{display:grid; grid-template-columns:44px 1fr} .contract .sc{display:grid; grid-template-columns:44px 1fr; margin-left:32px}
.contract .b{font-weight:700} .contract .ind{margin-left:44px}
.contract .sig{margin-top:18px; border-top:1px solid #ccc; padding-top:10px}

@media (max-width:640px){
  .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px; padding-right:12px}
  .pagehead h2{font-size:25px} .dhead h2{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .card{padding:14px 14px}
  details.sec>summary{padding:12px 14px; font-size:20px} details.sec>.in{padding:0 14px 14px}
  .kv,.kv.nocopy{grid-template-columns:1fr auto; gap:2px 8px} .kv dt{grid-column:1 / -1}
  .kv.nocopy dd{grid-column:1 / -1}
  .log li{grid-template-columns:1fr}
  .modal{padding:16px 14px 14px}
  .row-actions .btn,.formbtns .btn{flex:1 1 100%}
  .bigchoice label{padding:12px}
  .pagehead .btn:not(.small){flex:1 1 100%}
}

/* documents */
.regtable{overflow-x:auto; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow)}
.regtable table{border-collapse:collapse; width:100%; font-size:14px}
.regtable th,.regtable td{padding:9px 8px; border-bottom:1px solid var(--mist); text-align:center; vertical-align:middle}
.regtable thead th{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--sage-70); background:var(--sage-10); position:sticky; top:0}
.regtable .nm{text-align:left; min-width:190px; font-weight:600}
.regtable .nm a{color:var(--sage); text-decoration:none; font-family:var(--display); font-size:19px; line-height:1.1} .regtable .nm a:hover{text-decoration:underline}
.regtable .nm .tiny{font-weight:400}
.regtable tbody tr{cursor:pointer} .regtable tbody tr:hover{background:#fbfbf9}
.regtable tr.warnrow th.nm{box-shadow:inset 4px 0 0 var(--attention)}
.regtable td.warn{background:var(--attention-bg)} .regtable td.warn .dash{color:var(--attention-ink); font-weight:800}
.tick{color:var(--good); font-weight:800; font-size:16px} .tick small{font-size:11px; margin-left:2px; color:var(--sage-70)}
.dash{color:var(--sage-70)} .dash.quiet{color:#c9cec9}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.badge.ok{background:var(--good-bg); color:var(--good); font-size:9.5px; padding:2px 7px; margin-top:2px}
.regcards{display:none}
.chipsx{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}

.chipx.ok{background:var(--good-bg); color:var(--good)} .chipx.warn{background:var(--attention-bg); color:var(--attention-ink); font-weight:600}
a.scard.warnc{border-left-color:var(--attention)}
@media (max-width:760px){ .regtable{display:none} .regcards{display:block} }
.checks .chk{padding:10px 0; border-top:1px solid var(--mist)} .checks .chk:first-of-type{border-top:0}
.checks.remind{border:2px solid var(--attention); background:#fffdf8}
.chk.done{color:var(--good)} .chk.done b{color:var(--ink)}

.frow .row-actions{flex-wrap:nowrap} .frow .row-actions .btn{flex:0 0 auto}

.teamcard{border:2px solid var(--sage); background:#fcfdfb}

.stat{background:var(--sage-10); border-radius:8px; padding:8px 6px; text-align:center} .stat b{display:block; font-family:var(--display); font-size:28px; line-height:1; color:var(--sage)} .stat span{font-size:11.5px; color:var(--sage-70); line-height:1.2; display:block; margin-top:2px}
.subpanel{background:var(--bone); border:1px solid var(--mist); border-radius:10px; padding:14px; margin-top:14px} .subpanel h4{font-family:var(--display); font-size:21px; color:var(--sage); margin-bottom:6px}
.candlist{max-height:320px; overflow:auto; background:#fff; border:1px solid var(--mist); border-radius:8px}
.candrow{display:flex; gap:10px; align-items:flex-start; padding:8px 10px; border-bottom:1px solid var(--mist); cursor:pointer; font-size:14px} .candrow:last-child{border-bottom:0} .candrow input{margin-top:4px; width:18px; height:18px; accent-color:var(--sage); flex:none} .candrow span{min-width:0; overflow-wrap:anywhere}
.chipx.info{background:var(--blue-bg); color:var(--blue)}
.na{font-size:11px; color:#b6bcb6; font-style:italic}
.spin{width:22px; height:22px; border:3px solid var(--mist); border-top-color:var(--sage); border-radius:50%; animation:rot .9s linear infinite; margin-bottom:8px} @keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){ .stats{grid-template-columns:repeat(3,1fr)} .teamcard .row-actions .btn{flex:1 1 100%} }
.formbtns{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px}

<body>
<div id="gate"><div class="gatecard"><h1>Onboarding</h1><div class="sub">Black Horse Beamish</div>
  <p style="margin:0 0 16px;font-size:14px;color:var(--sage-70)">This opens from the Staff Portal, which knows who you are.</p>
  <a href="https://app.blackhorsebeamish.co.uk/portal/app.html" style="display:block;padding:12px;border-radius:8px;background:var(--sage);color:#fff;text-decoration:none;font-weight:600;letter-spacing:var(--track-label);text-transform:uppercase;font-size:12px">Open the Staff Portal</a>
  <div class="gateerr" id="gerr"></div></div></div>
<div id="app" hidden>
  <header class="top"><div class="topin"><div class="brand">Onboarding<small>Black Horse Beamish</small></div>
    <div class="who"><span id="whoname"></span><button id="signout">Sign out</button></div></div></header>
  <nav class="tabs"><div class="tabsin" role="tablist" id="tabs">
    <button class="tabbtn" role="tab" data-view="starters" aria-current="page">New starters</button>
    <button class="tabbtn" role="tab" data-view="documents" aria-current="false">Documents</button>
    <button class="tabbtn off" role="tab" data-view="settings" aria-current="false" id="tab_settings">Settings</button>
  </div></nav>
  <div class="shell"><div id="views" aria-live="polite"></div></div>
</div>
<div id="modalroot"></div>
<div class="toast" id="toast" role="status"></div>
<script>
const CFG = { SUPABASE_URL:"https://safcrtrfdzsnftghibot.supabase.co", SUPABASE_KEY:"sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU" };
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const S = { reg:null, regSig:"", regFilter:"all", regFind:"", me:null, settings:{}, planday:{}, templates:[], health:null, filter:"open", list:null, listSig:"", d:null, ui:{}, route:{ name:"list" }, fetchedAt:0, seq:0 };

/* ------------------------------------------------------------- plumbing */
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = "toast"; }, bad ? 5600 : 2800); }
function staffEmail(){ try { return sessionStorage.getItem("bhb_staff_email") || ""; } catch(e){ return ""; } }
async function call(action, payload){
  const body = { action, staff_email: staffEmail(), ...(payload || {}) };
  if (typeof window.__MOCK_API__ === "function") {
    const r = await window.__MOCK_API__(action, JSON.parse(JSON.stringify(body)));
    return JSON.parse(JSON.stringify(r === undefined ? {} : r));
  }
  const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/onboarding-api", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + CFG.SUPABASE_KEY, apikey:CFG.SUPABASE_KEY }, body: JSON.stringify(body) });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (!r.ok || d.error) { const err = new Error(d.error || `Request failed (${r.status})`); err.fields = d.fields || null; throw err; }
  return d;
}
const LON = "Europe/London";
const fixMonth = s => s.replace(/\bSept\b/, "Sep");
const fmtDay = v => { if (!v) return ""; try { return fixMonth(new Date(v).toLocaleDateString("en-GB", { timeZone:LON, day:"numeric", month:"short", year:"numeric" })); } catch(e){ return String(v).slice(0, 10); } };
const fmtDT = v => { if (!v) return ""; try { return fixMonth(new Date(v).toLocaleString("en-GB", { timeZone:LON, day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" })); } catch(e){ return String(v); } };
const money = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? "" : "£" + (+v).toLocaleString("en-GB", { minimumFractionDigits:2, maximumFractionDigits:2 });
const daysTo = iso => Math.ceil((new Date(iso).getTime() - Date.now()) / 864e5);
const human = k => { const s = String(k).replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
const yn = v => v === true || v === "true" || v === "yes" ? "Yes" : v === false || v === "false" || v === "no" ? "No" : "";
const fullName = s => `${s.first_name || ""} ${s.last_name || ""}`.trim();
const STATUS = { draft:"Draft", link_sent:"Link sent", in_progress:"Started", signed:"Contract signed", submitted:"Submitted", in_planday:"In Planday", complete:"Complete", cancelled:"Cancelled" };
const CONTRACT = { hourly:"Hourly paid", salaried:"Salaried" };
const STEPS = ["Link sent", "Opened", "Signed", "Submitted", "In Planday", "Complete"];
const RISK = [["required", "Needed"], ["in_progress", "In progress"], ["done", "Done"], ["not_needed", "Not needed"]];
const KINDS = { contract:"Signed contract", health:"Health questionnaire", wtd:"48-hour opt-out", payroll:"Payroll starter form", rtw:"Right to work", ni:"Proof of National Insurance", risk:"Completed risk assessment", other:"Other document" };
const KIND_ORDER = ["contract", "health", "wtd", "payroll", "rtw", "ni", "risk", "other"];
const KIND_SHORT = { contract:"Contract", health:"Health", wtd:"48h", payroll:"Payroll form", rtw:"Right to work", ni:"NI proof", risk:"Risk assessment", other:"Other" };
const GENERATED = ["contract", "health", "wtd", "payroll"], UPLOADED = ["rtw", "ni", "risk", "other"];
const CHECKS = { rtw:"Right to work", ni:"National Insurance" };
const SIGNED_PLUS = ["submitted", "in_planday", "complete"];
const LOCKED = ["submitted", "in_planday", "complete", "cancelled"];
function stepsDone(s){
  const m = { draft:0, link_sent:1, in_progress:2, signed:3, submitted:4, in_planday:5, complete:6, cancelled:0 }[s.status] || 0;
  let t = 0; if (s.link_sent_at) t = 1; if (s.first_opened_at) t = 2; if (s.signed_at) t = 3; if (s.submitted_at) t = 4; if (s.planday_id) t = 5;
  return s.status === "cancelled" ? t : Math.max(m, t);
}
const needsRisk = s => !!s.risk_required && !["done", "not_needed"].includes(s.risk_status);
// what a person is missing that matters, from a register row or a list row
function missingFor(p){
  const docs = p.docs || {}, ch = p.checks || {}, m = [];
  if (p.kind === "existing") { if (!docs.rtw && !ch.rtw) m.push("rtw"); return m; }
  GENERATED.forEach(k => { if (SIGNED_PLUS.includes(p.status) && !docs[k]) m.push(k); });
  ["rtw", "ni"].forEach(k => { if (!docs[k] && !ch[k]) m.push(k); });
  if (needsRisk(p) && !docs.risk) m.push("risk");
  return m;
}
const sizeText = n => !n ? "" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const csvCell = v => { let s = String(v ?? ""); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext !== false) { await navigator.clipboard.writeText(text); return true; } } catch(e){}
  try { const t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;left:-9999px;top:0"; document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok; } catch(e){ return false; }
}

/* ------------------------------------------------------------- modal */
function openModal(html){
  closeModal();
  const bg = document.createElement("div"); bg.className = "modalbg"; bg.id = "modalbg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); });
  $("#modalroot").appendChild(bg); document.documentElement.style.overflow = "hidden";
  const f = bg.querySelector("button"); if (f) f.focus();
}
function closeModal(){ const m = $("#modalbg"); if (m) m.remove(); document.documentElement.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalbg")) closeModal(); });

/* ------------------------------------------------------------- routing */
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, "").split("/");
  if (h[0] === "new") return { name:"form", id:null };
  if (h[0] === "s" && h[1]) return h[2] === "edit" ? { name:"form", id:h[1] } : { name:"detail", id:h[1] };
  if (h[0] === "settings") return { name:"settings" };
  if (h[0] === "documents") return { name:"docs" };
  return { name:"list" };
}
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener("hashchange", () => route());
function setTabs(){
  const cur = S.route.name === "settings" ? "settings" : S.route.name === "docs" || (S.route.name === "detail" && S.d && S.d.starter.kind === "existing") ? "documents" : "starters";
  $$(".tabbtn").forEach(b => b.setAttribute("aria-current", b.dataset.view === cur ? "page" : "false"));
  const admin = !!(S.me && S.me.admin) && (!Array.isArray(S.me.tabs) || S.me.tabs.includes("settings"));
  $("#tab_settings").classList.toggle("off", !admin);
  const st = $('.tabbtn[data-view="starters"]'); st.classList.toggle("off", Array.isArray(S.me && S.me.tabs) && !S.me.tabs.includes("starters"));
}
$$(".tabbtn").forEach(b => b.addEventListener("click", () => go(b.dataset.view === "settings" ? "#/settings" : b.dataset.view === "documents" ? "#/documents" : "#/")));
async function route(){
  S.route = parseRoute(); closeModal(); setTabs();
  if (S.route.name === "settings" && !(S.me && S.me.admin)) { S.route = { name:"list" }; location.replace("#/"); }
  window.scrollTo(0, 0);
  try {
    if (S.route.name === "list") await showList();
    else if (S.route.name === "detail") await showDetail(S.route.id);
    else if (S.route.name === "form") await showForm(S.route.id);
    else if (S.route.name === "docs") await showDocs();
    else showSettings();
  } catch(e){ $("#views").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; }
}

/* ------------------------------------------------------------- starters list */
function skeletonList(){ return Array.from({ length:3 }, () => `<div class="card" aria-hidden="true"><div class="sk" style="height:24px;width:55%"></div><div class="sk" style="height:14px;width:80%;margin-top:10px"></div><div class="sk" style="height:10px;width:100%;margin-top:18px"></div></div>`).join(""); }
function stripHtml(s){
  const n = stepsDone(s), cx = s.status === "cancelled";
  return `<ol class="strip${cx ? " cx" : ""}" aria-label="Progress: ${n} of 6 steps done">${STEPS.map((l, i) => `<li class="${cx ? "" : i < n ? "done" : i === n ? "cur" : ""}"><i></i>${l}</li>`).join("")}</ol>`;
}
function expiryText(s){
  if (!["link_sent", "in_progress", "signed"].includes(s.status) || !s.link_expires_at) return null;
  const n = daysTo(s.link_expires_at);
  return n < 0 ? { t:"Link expired", bad:true } : n === 0 ? { t:"Link expires today", bad:false } : { t:`Link expires in ${n} day${n === 1 ? "" : "s"}`, bad:false };
}
function cardHtml(s){
  const ex = expiryText(s), risk = needsRisk(s);
  const cls = ["scard", "card"]; if (risk) cls.push("hasrisk"); else if (s.status === "complete" || s.status === "in_planday") cls.push("done"); if (s.status === "cancelled") cls.push("cx");
  return `<a class="${cls.join(" ")}" href="#/s/${encodeURIComponent(s.id)}">
    <div class="r1"><div><h3>${esc(fullName(s))}</h3><div class="sub">${esc(s.job_title || "No job title")}${s.department_name ? " &middot; " + esc(s.department_name) : ""}</div></div><span class="badge st-${esc(s.status)}">${esc(STATUS[s.status] || s.status)}</span></div>
    <div class="badges"><span class="sub">${s.start_date ? "Starts " + esc(fmtDay(s.start_date)) : "No start date"}</span><span class="badge kind">${esc(CONTRACT[s.contract_type] || s.contract_type || "")}</span>
      ${risk ? `<span class="badge risk">Risk assessment needed</span>` : ""}${s.flags > 0 ? `<span class="badge flags">${s.flags} flag${s.flags === 1 ? "" : "s"}</span>` : ""}${["submitted", "in_planday"].includes(s.status) ? ["rtw", "ni"].filter(k => !(s.checks || {})[k]).map(k => `<span class="badge flags">${k === "rtw" ? "Right to work" : "NI proof"} not checked</span>`).join("") : ""}</div>
    ${stripHtml(s)}${ex ? `<div class="foot${ex.bad ? " bad" : ""}">${ex.t}</div>` : ""}</a>`;
}
function renderList(){
  const keepY = window.scrollY, L = S.list;
  const chips = [["open", "Open"], ["all", "All"], ["cancelled", "Cancelled"]].map(([k, l]) => `<button class="chip" data-act="filter" data-k="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("");
  const body = L === null ? skeletonList()
    : L.length ? L.map(cardHtml).join("")
    : `<div class="card empty">${S.filter === "open" ? "No new starters yet. Press New starter when someone accepts a job." : S.filter === "cancelled" ? "No cancelled starters." : "No starters yet. Press New starter when someone accepts a job."}</div>`;
  $("#views").innerHTML = `<div class="pagehead"><h2>New starters</h2><button class="btn small ghost" data-act="refresh">Refresh</button><button class="btn" data-act="new">New starter</button></div>
    <div class="toolrow" style="margin-top:6px" role="group" aria-label="Show">${chips}</div>${body}
    <p class="muted tiny" style="margin-top:14px">Updates itself every minute${S.fetchedAt ? ". Last checked " + esc(new Date(S.fetchedAt).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" })) : ""}.</p>`;
  window.scrollTo(0, keepY);
}
async function loadList(quiet){
  const my = ++S.seq;
  try {
    const d = await call("starters.list", { filter:S.filter });
    if (my !== S.seq && !quiet) return;
    S.fetchedAt = Date.now();
    const sig = JSON.stringify(d.starters);
    if (quiet && sig === S.listSig && S.list) return;
    S.list = d.starters; S.listSig = sig;
    if (S.route.name === "list") renderList();
  } catch(e){
    if (quiet) return;
    S.list = S.list || []; renderList(); toast(e.message, true);
  }
}
async function showList(){ if (S.list === null || S.listFilter !== S.filter) S.list = null; S.listFilter = S.filter; renderList(); await loadList(); }

/* ------------------------------------------------------------- form */
function fieldVal(s, k, d){ return s && s[k] !== undefined && s[k] !== null ? s[k] : d; }
async function showForm(id){
  $("#views").innerHTML = `<div class="pagehead"><h2>${id ? "Edit starter" : "New starter"}</h2></div>${skeletonList()}`;
  let s = null;
  if (id) {
    if (S.d && S.d.starter && S.d.starter.id === id) s = S.d.starter;
    else { S.d = await call("starter.get", { id }); s = S.d.starter; }
    if (LOCKED.includes(s.status)) {
      $("#views").innerHTML = `<button class="back" data-act="back">&larr; Back</button><div class="card"><h3 style="font-size:24px">${esc(fullName(s))} can't be edited now</h3><p class="muted">${s.status === "cancelled" ? "This starter has been cancelled." : "Editing stops once the starter has submitted, because their contract and forms have been made from what was entered."} If something is wrong, make the change in Planday, or cancel and start again.</p></div>`;
      return;
    }
  }
  const pd = S.planday || {}, depts = pd.departments || [], groups = pd.groups || [];
  const signed = !!(s && s.signed_at), ct = fieldVal(s, "contract_type", "hourly");
  const sel = (items, curId, curName, idf, label) => {
    const has = items.some(i => String(i.id) === String(curId));
    return `<select id="f_${idf}" name="${idf}"><option value="">Choose...</option>${items.map(i => `<option value="${esc(i.id)}"${String(i.id) === String(curId) ? " selected" : ""}>${esc(i.name)}</option>`).join("")}${curName && !has ? `<option value="${esc(curId || "")}" selected>${esc(curName)}</option>` : ""}</select>`;
  };
  const dis = signed ? " disabled" : "";
  const pickTwo = (name, cur, opts) => `<div class="pick">${opts.map(([v, l]) => `<label class="${cur === v ? "on" : ""}"><input type="radio" name="${name}" value="${v}"${cur === v ? " checked" : ""}> ${l}</label>`).join("")}</div>`;
  $("#views").innerHTML = `<button class="back" data-act="back">&larr; ${id ? "Back to " + esc(fullName(s)) : "Back to the list"}</button>
    <div class="pagehead"><h2>${id ? "Edit starter" : "New starter"}</h2></div>
    <form id="sform" novalidate autocomplete="off" data-id="${esc(id || "")}">
    <div class="card"><h3 style="font-size:23px;margin-bottom:8px">Who is starting</h3>
      <div class="grid2"><div class="field"><label for="f_first_name">First name</label><input id="f_first_name" value="${esc(fieldVal(s, "first_name", ""))}" autocomplete="off"><div class="ferr" data-err="first_name"></div></div>
      <div class="field"><label for="f_last_name">Last name</label><input id="f_last_name" value="${esc(fieldVal(s, "last_name", ""))}" autocomplete="off"><div class="ferr" data-err="last_name"></div></div>
      <div class="field"><label for="f_email">Email</label><input id="f_email" type="email" inputmode="email" value="${esc(fieldVal(s, "email", ""))}" autocomplete="off"><div class="hint">The link to their forms is sent here.</div><div class="ferr" data-err="email"></div></div>
      <div class="field"><label for="f_mobile">Mobile (optional)</label><input id="f_mobile" type="tel" inputmode="tel" value="${esc(fieldVal(s, "mobile", ""))}" autocomplete="off"><div class="ferr" data-err="mobile"></div></div></div></div>
    <div class="card"><h3 style="font-size:23px;margin-bottom:8px">The job</h3>
      <div class="grid2"><div class="field"><label for="f_job_title">Job title</label><input id="f_job_title" value="${esc(fieldVal(s, "job_title", ""))}"><div class="ferr" data-err="job_title"></div></div>
      <div class="field"><label for="f_start_date">Start date</label><input id="f_start_date" type="date" value="${esc(String(fieldVal(s, "start_date", "")).slice(0, 10))}"><div class="ferr" data-err="start_date"></div></div>
      <div class="field"><label for="f_department">Department</label>${depts.length ? sel(depts, fieldVal(s, "department_id", ""), fieldVal(s, "department_name", ""), "department") : `<input id="f_department" value="${esc(fieldVal(s, "department_name", ""))}" placeholder="For example Kitchen">`}${depts.length ? "" : `<div class="hint">Planday is not connected, so type the department.</div>`}</div>
      <div class="field"><label for="f_group">Job role / group</label>${groups.length ? sel(groups, fieldVal(s, "group_id", ""), fieldVal(s, "group_name", ""), "group") : `<input id="f_group" value="${esc(fieldVal(s, "group_name", ""))}" placeholder="For example Kitchen team">`}<div class="hint">Needed to create them in Planday.</div></div>
      <div class="field"><label for="f_work_location">Work location</label><input id="f_work_location" value="${esc(fieldVal(s, "work_location", "Black Horse Beamish"))}"></div></div></div>
    <div class="card"><h3 style="font-size:23px;margin-bottom:8px">Contract</h3>
      <div class="bigchoice" role="radiogroup" aria-label="Contract type">
        <label class="${ct === "hourly" ? "on" : ""}"><input type="radio" name="ct" value="hourly"${ct === "hourly" ? " checked" : ""}${dis}>Hourly paid<small>Paid by the hour</small></label>
        <label class="${ct === "salaried" ? "on" : ""}"><input type="radio" name="ct" value="salaried"${ct === "salaried" ? " checked" : ""}${dis}>Salaried<small>Annual salary, set hours</small></label></div>
      <div class="hint" style="margin-bottom:10px">This fills the contract they will read and sign.${signed ? " They have already signed, so the contract details are locked." : ""}</div>
      <div class="ferr" data-err="contract_type"></div>

      <div class="field pay ${ct === "salaried" ? "" : "off"}" id="w_sal"><label for="f_salary">Annual salary</label><span class="cur">£</span><input id="f_salary" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(fieldVal(s, "salary", ""))}"${dis}><div class="ferr" data-err="salary"></div></div>

/* ---- uploads: shrink photos in the browser, send PDFs as they are */
const MAXB = 6 * 1048576;
function readB64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("That file could not be read.")); r.readAsDataURL(blob); }); }
function loadImage(f){ return new Promise((res, rej) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("That photo could not be read here. Try a JPEG or PNG, or a PDF.")); }; i.src = u; }); }
async function prepUpload(f){
  if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
    if (f.size > MAXB) throw new Error(`That PDF is ${sizeText(f.size)}. The limit is 6 MB, so try a smaller scan.`);
    return { name:f.name, data:await readB64(f) };
  }
  if (!/^image\//.test(f.type)) throw new Error("Please choose a photo (JPEG or PNG) or a PDF.");
  const img = await loadImage(f), long = Math.max(img.naturalWidth, img.naturalHeight), k = long > 2000 ? 2000 / long : 1;
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  if (!blob) throw new Error("That photo could not be prepared. Try a PDF instead.");
  if (blob.size > MAXB) throw new Error(`That photo is still ${sizeText(blob.size)} after shrinking. The limit is 6 MB.`);
  return { name:f.name.replace(/\.[^.]+$/, "") + ".jpg", data:await readB64(blob) };
}

    <div class="card"><p style="margin-top:0">A new starter gets one link. On their phone, in their own time, they:</p>
      <ol style="margin:0 0 10px;padding-left:20px"><li>enter their payroll details and bank details</li><li>answer the HMRC starter checklist (the tax questions)</li><li>complete a confidential health questionnaire and sign it</li><li>choose whether to opt out of the 48-hour working week, and sign</li><li>read and sign their contract</li></ol>
      <p class="small muted">When they submit, the signed PDFs are made and the people above are told. The link can be re-sent at any time while it is open.</p>
      <div class="sub-h" style="margin-top:16px">What the flags mean</div>
      <p class="small muted" style="margin:0 0 6px">Their health answers are checked automatically. Anything that needs attention shows at the top of their record.</p>
      <div class="flagbox exclusion" style="margin-top:8px;padding:10px 14px"><h3 style="font-size:19px">${esc(lv.exclusion || "Do not handle food or start work until clear")}</h3><div class="small">Sickness or diarrhoea in the last 48 hours. They need to be symptom free for 48 hours before handling food.</div></div>
      <div class="flagbox risk" style="padding:10px 14px"><h3 style="font-size:19px">${esc(lv.risk || "A personal risk assessment is needed")}</h3><div class="small">A condition that could be affected by the job, such as asthma, diabetes, a back problem or pregnancy. Do the individual risk assessment with them. The hazards to think about are listed.</div></div>
      <div class="flagbox review" style="padding:10px 14px;margin-bottom:0"><h3 style="font-size:19px">${esc(lv.review || "Manager to read and consider")}</h3><div class="small">Worth knowing, such as allergies or medicines. No formal assessment is needed.</div></div>
      <div class="row-actions" style="margin-top:14px"><a class="btn small ghost" href="forms/Individual_Health_Risk_Assessment.docx" target="_blank" rel="noopener">Open the risk assessment form</a></div>
      <div class="conf">Health information is confidential: only share what the manager of this person needs.</div></div>`;
  initSigPad();
}
/* The employer's signature pad (Settings). Draws on a transparent canvas; saved as a PNG that is printed above the signatory's name on each contract. */
function initSigPad(){
  const c = $("#sigpad"); if (!c) return;
  const g = c.getContext("2d"); g.lineWidth = 3.2; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#1d2a44";
  let down = false, last = null; S.sigInk = false;
  const pt = e => { const r = c.getBoundingClientRect(); return { x:(e.clientX - r.left) * c.width / r.width, y:(e.clientY - r.top) * c.height / r.height }; };
  c.onpointerdown = e => { e.preventDefault(); down = true; last = pt(e); c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(last.x + 0.01, last.y + 0.01); g.stroke(); S.sigInk = true; };
  c.onpointermove = e => { if (!down) return; e.preventDefault(); const p = pt(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; };
  const up = () => { down = false; };
  c.onpointerup = up; c.onpointercancel = up; c.onpointerleave = up;
}
async function saveSignature(remove){
  let png = "";
  if (!remove) {
    const c = $("#sigpad"); if (!c || !S.sigInk) return toast("Draw the signature first.", true);
    // trim the empty margin so it prints at a sensible size
    const g = c.getContext("2d"), d = g.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const pad = 8, w = Math.min(c.width, x1 - x0 + 2 * pad), h = Math.min(c.height, y1 - y0 + 2 * pad), t = document.createElement("canvas"); t.width = w; t.height = h;
    t.getContext("2d").drawImage(c, Math.max(0, x0 - pad), Math.max(0, y0 - pad), w, h, 0, 0, w, h); png = t.toDataURL("image/png");
  }
  const r = await call("settings.save", { signatory_signature: png });
  S.settings = r.settings || S.settings; toast(remove ? "Signature removed." : "Signature saved. It will print on contracts signed from now on."); showSettings();
}
async function saveSettings(){
  const emails = $("#s_notify").value.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean), bad = emails.filter(x => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
  const days = Math.round(+$("#s_days").value);
  $("#e_notify").textContent = bad.length ? `Check ${bad.join(", ")}: not a valid email address.` : "";
  $("#e_days").textContent = !(days >= 1 && days <= 90) ? "Enter a number of days from 1 to 90." : "";
  if (bad.length || !(days >= 1 && days <= 90)) return;
  const r = await call("settings.save", { notify_emails:emails, link_valid_days:days, auto_planday:$("#s_auto").checked, hourly_signatory:$("#s_hs").value.trim(), hourly_signatory_title:$("#s_ht").value.trim(), salaried_signatory:$("#s_ss").value.trim(), salaried_signatory_title:$("#s_st").value.trim() });
  S.settings = r.settings || S.settings; toast("Settings saved."); showSettings();
}

/* ------------------------------------------------------------- actions */
async function afterAction(){ await loadDetail(S.route.id); S.list = null; }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;

    if (a === "teamadd") return teamOpenAdd();
    if (a === "teamhand") { S.team.mode = "hand"; S.team.err = ""; return renderTeam(); }
    if (a === "teamclose") { if (S.team.busy) return; S.team.mode = null; S.team.err = ""; return renderTeam(); }
    if (a === "sendask") { S.team.mode = "confirm"; return renderTeam(); }
    if (a === "sendyes") { return teamSend(); }
    if (a === "candall" || a === "candnone") { candVisible().forEach(c => { if (a === "candall") S.team.sel.add(candKey(c)); else S.team.sel.delete(candKey(c)); }); return renderTeam(); }
    if (a === "candadd") {
      const T = S.team, people = T.cand.people.filter(c => T.sel.has(candKey(c))).map(c => { const n = splitName(c.name); return { first_name:n.first, last_name:n.last, email:c.email, job_title:c.job_title || undefined, department:c.department || undefined, hired_date:c.hired_date || undefined, planday_id:c.planday_id || undefined }; });
      if (!people.length) return toast("Tick at least one person.", true);
      return teamAdd(people);
    }
    if (a === "handadd") {
      const h = S.team.hand, em = h.email.trim();
      if (!h.first.trim() || !h.last.trim()) { S.team.err = "Enter their first and last name."; return renderTeam(); }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { S.team.err = "Enter a valid email address."; return renderTeam(); }
      return teamAdd([{ first_name:h.first.trim(), last_name:h.last.trim(), email:em, job_title:h.job.trim() || undefined }]);
    }
    if (a === "go") { if (e.target.closest("a")) return; return go(b.dataset.h); }
    if (a === "regfilter") { S.regFilter = b.dataset.k; $$("[data-act=regfilter]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === S.regFilter))); return renderRegBody(); }
    if (a === "regrefresh") { b.disabled = true; await loadRegister(); b.disabled = false; return toast("Up to date."); }
    if (a === "regcsv") { if (!S.reg) return; const n = exportCsv(); return toast(`Exported ${n} ${n === 1 ? "person" : "people"}.`); }
    if (a === "delask") { S.ui.delFile = b.dataset.id; return renderDetail(); }
    if (a === "delno") { S.ui.delFile = null; return renderDetail(); }
    if (a === "delyes") { busy(true); await call("file.delete", { file_id:b.dataset.id }); S.ui.delFile = null; toast("Document deleted."); return afterAction(); }
    if (a === "upload") {
      const up = S.ui.up || { kind:"rtw", label:"", file:null };
      if (up.kind === "other" && !up.label.trim()) return toast("Give the document a label first.", true);
      if (!up.file) return toast("Choose a file first.", true);
      busy(true); toast("Uploading...");
      const p = await prepUpload(up.file);
      await call("file.upload", { starter_id:sid, kind:up.kind, label:up.kind === "other" ? up.label.trim() : undefined, name:p.name, data:p.data });
      S.ui.up = { kind:up.kind, label:"", file:null }; toast("Uploaded.");
      return afterAction();
    }
    if (a === "check") {
      const k = b.dataset.k, v = (S.ui.chk && S.ui.chk[k]) || {};
      if (!(v.document || "").trim()) return toast("Say which document you saw, for example UK passport.", true);
      busy(true); await call("starter.check", { id:sid, what:k, checked:true, document:v.document.trim(), expiry:v.expiry || undefined, note:(v.note || "").trim() || undefined });
      if (S.ui.chk) S.ui.chk[k] = {}; toast(CHECKS[k] + " check recorded."); return afterAction();
    }
    if (a === "uncheck") { busy(true); await call("starter.check", { id:sid, what:b.dataset.k, checked:false }); toast("Check removed."); return afterAction(); }
    if (a === "filter") { S.filter = b.dataset.k; S.list = null; return showList(); }
    if (a === "refresh") { b.disabled = true; await loadList(); toast("Up to date."); return; }
    if (a === "new") return go("#/new");
    if (a === "back") { if (S.route.name === "detail" && S.d && S.d.starter.kind === "existing") return go("#/documents"); if (S.route.name === "form" && S.route.id) return go("#/s/" + encodeURIComponent(S.route.id)); return go("#/"); }
    if (a === "closemodal") return closeModal();
    if (a === "preview") { busy(true); try { await previewContract(); } finally { busy(false); } return; }
    if (a === "save" || a === "savesend") { busy(true); try { await saveForm(a === "savesend"); } finally { if (document.body.contains(b)) busy(false); } return; }
    if (a === "savesettings") { busy(true); try { await saveSettings(); } finally { busy(false); } return; }
    if (a === "sigclear") { const c = $("#sigpad"); if (c) { c.getContext("2d").clearRect(0, 0, c.width, c.height); S.sigInk = false; } return; }
    if (a === "sigsave") { busy(true); try { await saveSignature(false); } finally { busy(false); } return; }
    if (a === "sigremove") { busy(true); try { await saveSignature(true); } finally { busy(false); } return; }
    if (a === "copy") { const ok = await copyText(b.dataset.v); return toast(ok ? "Copied." : "Could not copy. Select the text and copy it by hand.", !ok); }
    if (a === "copyfield") { const f = $("#linkfield"); const ok = await copyText(f.value); if (!ok) { f.focus(); f.select(); } return toast(ok ? "Link copied." : "Press Ctrl+C (or hold and copy) to copy the link.", !ok); }
    if (a === "send") {
      busy(true); const r = await call("starter.send", { id:sid });
      S.ui.link = { link:r.link }; S.ui.sendNote = r.emailed ? null : { error:r.email_error || "The email could not be sent." };
      toast(r.emailed ? `Link emailed to ${S.d.starter.email}.` : "The email did not go. Copy the link and send it yourself.", !r.emailed);
      return afterAction();
    }
    if (a === "copylink") { busy(true); const r = await call("starter.link", { id:sid }); S.ui.link = { link:r.link, expires_at:r.expires_at }; S.ui.sendNote = null; renderDetail(); const ok = await copyText(r.link); return toast(ok ? "Link copied." : "Here is the link. Select it and copy.", !ok); }
    if (a === "cancelask") { S.ui.confirm = "cancel"; return renderDetail(); }
    if (a === "cancelno") { S.ui.confirm = null; return renderDetail(); }
    if (a === "cancelyes") { busy(true); await call("starter.cancel", { id:sid }); S.ui.confirm = null; S.ui.link = null; if (S.d && S.d.starter.kind === "existing") { toast("Removed from the register."); S.regSig = ""; S.d = null; return go("#/documents"); } toast("Starter cancelled."); return afterAction(); }
    if (a === "riskstat") { S.ui.riskStatus = b.dataset.k; S.ui.riskDirty = true; S.ui.riskFor = sid; return renderDetail(); }
    if (a === "risksave") {
      const s = S.d.starter, status = S.ui.riskStatus || s.risk_status, note = ($("#risknote") || {}).value || "";
      busy(true); await call("starter.risk", { id:sid, status, note }); S.ui.riskDirty = false; S.ui.riskStatus = null; S.ui.riskNote = null; toast("Risk assessment saved."); return afterAction();
    }
    if (a === "openfile") {
      const w = window.open("", "_blank"); busy(true);
      try { const r = await call("file.url", { file_id:b.dataset.id }); if (w) { w.opener = null; w.location.href = r.url; } else { toast("Your browser blocked the new tab. Allow pop-ups for this page and try again.", true); } }
      catch(err){ if (w) w.close(); throw err; } finally { busy(false); }
      return;
    }
    if (a === "pdpreview") { busy(true); const r = await call("planday.preview", { id:sid }); S.ui.pd = r; renderDetail(); return; }
    if (a === "pdask") { S.ui.confirm = "planday"; return renderDetail(); }
    if (a === "pdno") { S.ui.confirm = null; return renderDetail(); }
    if (a === "pdyes") {
      busy(true);
      try { const r = await call("planday.create", { id:sid }); S.ui.confirm = null; S.ui.pd = null; toast("Created in Planday."); }
      catch(err){ S.ui.confirm = null; await loadDetail(sid); throw err; }
      return afterAction();
    }
    if (a === "markdone" || a === "markcomplete") { busy(true); await call("starter.complete", { id:sid, done:true }); toast("Marked complete."); return afterAction(); }
    if (a === "reopen") { busy(true); await call("starter.complete", { id:sid, done:false }); toast("Reopened."); return afterAction(); }
  } catch(err){ toast(err.message, true); if (b && document.body.contains(b)) b.disabled = false; }
});
document.addEventListener("input", e => {
  const id = e.target.id || "";
  if (id === "candfind") { S.team.find = e.target.value; $("#candlist").innerHTML = candListHtml(); return; }
  if (id.startsWith("th_")) { S.team.hand[{ th_first:"first", th_last:"last", th_email:"email", th_job:"job" }[id]] = e.target.value; return; }
  if (id === "regfind") { S.regFind = e.target.value; return renderRegBody(); }
  if (id.startsWith("chk_")) { const [, f, k] = id.split("_"); S.ui.chk = S.ui.chk || {}; (S.ui.chk[k] = S.ui.chk[k] || {})[f] = e.target.value; return; }

});
document.addEventListener("change", async e => {

  if (t.id === "up_kind") { S.ui.up = S.ui.up || { kind:"rtw", label:"", file:null }; S.ui.up.kind = t.value; $("#w_uplabel").classList.toggle("off", t.value !== "other"); return; }

  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.tagName === "DETAILS" && d.dataset.key) { S.ui.open = S.ui.open || {}; S.ui.open[d.dataset.key] = d.open; } }, true);

/* ------------------------------------------------------------- auto refresh */
async function tick(force){
  if (document.visibilityState !== "visible" || $("#modalbg")) return;
  if (S.route.name === "list") return loadList(true);
  if (S.route.name === "docs") return loadRegister(true);
  if (S.route.name === "detail" && S.d) {
    try {
      const d = await call("starters.list", { filter:"all" }), mine = d.starters.find(x => x.id === S.route.id), sig = detailSig(mine);
      S.list = null;
      if (mine && S.detailSig && sig !== S.detailSig) { S.detailSig = sig; await loadDetail(S.route.id, true); }
      else if (mine && !S.detailSig) S.detailSig = sig;
    } catch(e){}
  }
}
setInterval(() => tick(), 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - S.fetchedAt > 60000) tick(); });

async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = skeletonList();

    const [d, hj] = await Promise.all([call("bootstrap"), fetch("health.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)]);

  } catch(e){ $("#views").innerHTML = `<div class="card empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }

}
