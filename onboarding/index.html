<!DOCTYPE html>

<head>

<style>
:root{

  --bone:#F7F7F7; --celadon:#C1C8B4; --mist:#E7E7E7; --white:#fff; --ink:#262626; --gold:#C9A56B;
  --attention:#B08D57; --attention-bg:#F7F0E4; --attention-ink:#6d5320;
  --alert:#8C4A3F; --alert-bg:#F6EAE8;
  --red:#B3261E; --red-bg:#FCECEA; --red-dark:#5E1414;
  --good:#4F6B4F; --good-bg:#EDF2ED; --blue:#35607F; --blue-bg:#E8EFF5;
  --display:"Cormorant Garamond",Georgia,serif; --body:Raleway,"Helvetica Neue",Arial,sans-serif;
  --track-label:.18em; --radius:10px; --shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.07); --maxw:980px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:var(--body); color:var(--ink); background:var(--bone); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; letter-spacing:.01em}
button,input,textarea,select{font:inherit; color:inherit}
[hidden]{display:none!important}
.off{display:none!important}
a{color:var(--sage)}

/* gate + header */
.shell{max-width:var(--maxw); margin:0 auto; padding:0 16px 64px}
#gate{position:fixed; inset:0; background:var(--sage); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px}
.gatecard{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:380px; padding:32px 28px; text-align:center}
.gatecard h1{font-size:26px; color:var(--sage); line-height:1.15}
.gatecard .sub{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); margin:6px 0 22px}
.gateerr{color:var(--alert); font-size:13px; min-height:18px; margin-top:8px}
header.top{background:var(--sage); color:var(--white)}
.topin{max-width:var(--maxw); margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.brand{font-family:var(--display); font-size:21px; line-height:1.1}
.brand small{display:block; font-family:var(--body); font-size:10px; letter-spacing:var(--track-label); text-transform:uppercase; opacity:.75}
.who{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; opacity:.9}
.who button{background:transparent; border:1px solid rgba(255,255,255,.4); color:var(--white); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:11px; letter-spacing:.06em; text-transform:uppercase}
nav.tabs{background:var(--sage-dark)}
.tabsin{max-width:var(--maxw); margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto}
.tabbtn{background:transparent; border:0; cursor:pointer; color:rgba(255,255,255,.72); padding:12px 16px; font-size:12px; font-weight:600; white-space:nowrap; letter-spacing:var(--track-label); text-transform:uppercase; border-bottom:3px solid transparent}
.tabbtn[aria-current="page"]{color:var(--white); border-bottom-color:var(--gold)}

/* controls */
.btn{border:1px solid var(--sage); background:var(--sage); color:var(--white); border-radius:8px; padding:10px 18px; cursor:pointer; font-size:12px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; min-height:42px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2}
.btn:hover{background:var(--sage-dark)} .btn.ghost{background:var(--white); color:var(--sage)} .btn.ghost:hover{background:var(--sage-10)}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#2b2415} .btn.small{min-height:34px; padding:6px 12px; font-size:11px}
.btn.danger{background:var(--white); color:var(--alert); border-color:var(--alert)} .btn.danger:hover{background:var(--alert-bg)}
.btn.solid-danger{background:var(--red); border-color:var(--red)} .btn.solid-danger:hover{background:var(--red-dark)}
.btn:disabled{opacity:.5; cursor:default}
.btn:focus-visible,.chip:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.chip{border:1px solid var(--mist); background:var(--white); border-radius:999px; padding:6px 13px; cursor:pointer; font-size:13px; min-height:34px}
.chip:hover{background:var(--sage-10)} .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:var(--white); font-weight:600}
.card{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px}
.muted{color:var(--sage-70)} .small{font-size:13px} .tiny{font-size:12px}
.empty{padding:36px 20px; text-align:center; color:var(--sage-70)}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:900; max-width:90vw}
.toast.on{opacity:1; transform:translate(-50%,0)} .toast.bad{background:var(--alert)}
.sechead{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; color:var(--sage-70); font-weight:700; margin:24px 2px 8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.toolrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 8px}
.toolrow .sp{margin-left:auto}
.pagehead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:18px 0 6px}
.pagehead h2{font-size:30px; color:var(--sage); line-height:1.1; margin-right:auto}
.pagehead h2.sm{font-size:26px}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0}
.field label,.lbl{font-size:11px; letter-spacing:var(--track-label); text-transform:uppercase; font-weight:700; color:var(--sage-70)}
.field input,.field select,.field textarea{border:1px solid var(--celadon); border-radius:8px; padding:10px 11px; background:#fff; width:100%; min-height:42px}
.field textarea{min-height:84px; resize:vertical}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--red); background:var(--red-bg)}
.field input:disabled,.field select:disabled{background:var(--sage-10); color:var(--sage-70)}
.ferr{color:var(--red); font-size:12.5px; font-weight:600; min-height:0}
.hint{font-size:12.5px; color:var(--sage-70)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}
.pay{position:relative} .pay .cur{position:absolute; left:11px; top:31px; color:var(--sage-70); pointer-events:none} .pay input{padding-left:24px}
.pick{display:flex; gap:6px; flex-wrap:wrap}
.pick label{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--mist); background:var(--bone); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:14px; letter-spacing:0; text-transform:none; color:var(--ink); margin:0; font-weight:500; min-height:38px}
.pick label.on{background:var(--sage); color:#fff; border-color:var(--sage)}
.pick input{width:auto; margin:0; min-height:0; accent-color:var(--gold)}
.bigchoice{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px}
.bigchoice label{display:flex; flex-direction:column; gap:2px; border:2px solid var(--mist); background:#fff; border-radius:12px; padding:14px; cursor:pointer; text-transform:none; letter-spacing:0; color:var(--ink); font-size:16px; font-weight:700; min-height:74px}
.bigchoice label small{font-weight:400; font-size:12.5px; color:var(--sage-70)}
.bigchoice label.on{border-color:var(--sage); background:var(--sage-10)}
.bigchoice input{position:absolute; opacity:0; width:1px; height:1px}
.bigchoice label:focus-within{outline:3px solid var(--gold); outline-offset:2px}
.switch{display:flex; gap:12px; align-items:flex-start; cursor:pointer}
.switch input{width:20px; height:20px; margin-top:2px; accent-color:var(--sage); flex:none; min-height:0}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* badges */
.badge{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--sage-10); color:var(--sage); white-space:nowrap; display:inline-block}
.badge.st-draft{background:var(--mist); color:#5c635c} .badge.st-link_sent,.badge.st-in_progress,.badge.st-signed{background:var(--blue-bg); color:var(--blue)}
.badge.st-submitted{background:var(--attention-bg); color:var(--attention-ink)} .badge.st-in_planday,.badge.st-complete{background:var(--good-bg); color:var(--good)}
.badge.st-cancelled{background:var(--mist); color:#777}
.badge.risk{background:var(--red); color:#fff} .badge.flags{background:var(--attention-bg); color:var(--attention-ink)} .badge.kind{background:#fff; border:1px solid var(--celadon); color:var(--sage)}
.badge.exp{background:var(--red-bg); color:var(--red)} .badge.excl{background:var(--red-dark); color:#fff}

/* skeletons */
.sk{background:linear-gradient(90deg,#ececec 25%,#f7f7f7 50%,#ececec 75%); background-size:200% 100%; animation:shim 1.3s linear infinite; border-radius:6px}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* list cards */
a.scard{display:block; text-decoration:none; color:inherit; padding:14px 16px 12px; border-left:4px solid var(--celadon)}
a.scard:hover{box-shadow:0 1px 2px rgba(38,38,38,.08),0 10px 28px rgba(38,38,38,.11)}
a.scard.hasrisk{border-left-color:var(--red)} a.scard.done{border-left-color:var(--good)} a.scard.cx{opacity:.75}
.scard .r1{display:flex; gap:10px; align-items:flex-start; justify-content:space-between}
.scard h3{font-size:23px; line-height:1.15; color:var(--sage); overflow-wrap:anywhere}
.scard .sub{font-size:13.5px; color:var(--sage-70); overflow-wrap:anywhere}
.badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px}
.strip{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; list-style:none; margin:12px 0 4px; padding:0}
.strip li{text-align:center; font-size:10px; line-height:1.2; color:var(--sage-70); min-width:0; overflow-wrap:normal}
@media (max-width:430px){.strip{gap:3px} .strip li{font-size:9px; letter-spacing:-.01em} .strip li.done,.strip li.cur{font-weight:500}}
.strip li i{display:block; height:6px; border-radius:99px; background:var(--mist); margin-bottom:5px}
.strip li.done i{background:var(--sage)} .strip li.cur i{background:var(--gold)} .strip li.done,.strip li.cur{color:var(--ink); font-weight:600}
.strip.cx li i{background:var(--mist)!important}
.scard .foot{font-size:12.5px; color:var(--sage-70); margin-top:4px}
.scard .foot.bad{color:var(--red); font-weight:600}

/* detail */
.back{background:none; border:0; color:var(--sage); font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; font-size:12px; cursor:pointer; padding:14px 0 4px}
.dhead h2{font-size:34px; color:var(--sage); line-height:1.1; overflow-wrap:anywhere}
.kvs{display:block; margin:0}
.kv{display:grid; grid-template-columns:minmax(100px,38%) 1fr auto; gap:4px 10px; align-items:start; padding:8px 0; border-bottom:1px solid var(--mist); font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--sage-70); font-size:13px; margin:0} .kv dd{margin:0; overflow-wrap:anywhere; min-width:0}
.kv .copy{min-height:30px; padding:3px 10px}
.kv.nocopy{grid-template-columns:minmax(100px,38%) 1fr}
.sub-h{font-family:var(--display); font-size:20px; color:var(--sage); margin:14px 0 2px}
.sub-h:first-child{margin-top:0}
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:22px 1fr; gap:10px; padding:7px 0; position:relative; font-size:14.5px}
.tl li::before{content:""; position:absolute; left:10px; top:28px; bottom:-8px; width:2px; background:var(--mist)}
.tl li:last-child::before{display:none}
.tl .dot{width:22px; height:22px; border-radius:50%; background:var(--mist); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800}
.tl li.done .dot{background:var(--sage)} .tl li.done::before{background:var(--sage)}
.tl .when{font-size:12.5px; color:var(--sage-70)} .tl li.todo{color:var(--sage-70)}

/* flag banners */
.flagbox{border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; border:2px solid; box-shadow:var(--shadow)}
.flagbox h3{font-size:25px; line-height:1.15; margin-bottom:4px; font-family:var(--display); font-weight:700}
.flagbox.risk{background:var(--red-bg); border-color:var(--red); color:#3b0f0c} .flagbox.risk h3{color:var(--red)}
.flagbox.review{background:var(--attention-bg); border-color:var(--attention); color:#3d3017} .flagbox.review h3{color:var(--attention-ink)}
.flagbox.exclusion{background:var(--red-dark); border-color:var(--red-dark); color:#fff} .flagbox.exclusion h3{color:#fff; font-size:27px}
.flagbox .lead{font-size:14px; margin:0 0 10px}
.fl{background:rgba(255,255,255,.75); border-radius:8px; padding:10px 12px; margin-top:8px; color:var(--ink)}
.flagbox.exclusion .fl{background:rgba(255,255,255,.95)}
.fl b.t{display:block; font-size:15.5px; overflow-wrap:anywhere}
.fl .ans{font-size:14px; margin-top:3px; overflow-wrap:anywhere} .fl .ans q{quotes:"\201C" "\201D"; font-style:italic}
.fl .note{font-size:13px; color:#5b4b2b; margin-top:3px}
.fl .why{font-size:12.5px; color:var(--sage-70); margin-top:3px}
.hz{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.hz span{font-size:11.5px; background:var(--red-bg); border:1px solid #e5b9b4; color:#6e1d17; padding:2px 8px; border-radius:99px; line-height:1.4}
.flagbox.review .hz span{background:var(--attention-bg); border-color:#e0cea8; color:var(--attention-ink)}
.hzall{margin-top:12px; padding-top:10px; border-top:1px dashed #d9a39d}
.hzall .lbl{color:#7a2a24}
.conf{font-size:12.5px; color:var(--sage-70); margin:6px 2px; display:flex; gap:6px}
.conf::before{content:"\1F512"; font-size:11px; margin-top:2px}
.rbox{border-top:1px solid var(--mist); margin-top:12px; padding-top:12px}

/* answers */
.q{padding:9px 0; border-bottom:1px solid var(--mist); display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:14.5px}
.q:last-child{border-bottom:0}
.q .qt{min-width:0; overflow-wrap:anywhere} .q .qa{font-weight:700; white-space:nowrap}
.q .qd{grid-column:1 / -1; background:var(--attention-bg); border-left:3px solid var(--attention); padding:6px 10px; border-radius:4px; font-size:14px; overflow-wrap:anywhere}
.q.yes{background:#fffaf0} .q.yes .qa{color:var(--attention-ink)}
.q.l-risk .qa,.q.l-exclusion .qa{color:var(--red)} .q.l-risk .qd{background:var(--red-bg); border-left-color:var(--red)}
.q.l-exclusion .qd{background:var(--red-bg); border-left-color:var(--red-dark)}
.q .lv{font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; margin-left:6px; vertical-align:2px}
.q .qh{font-size:12.5px; color:var(--sage-70)}
details.sec{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:12px}
details.sec>summary{cursor:pointer; padding:14px 18px; font-family:var(--display); font-size:22px; font-weight:600; color:var(--sage); list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"\25B8"; font-size:15px; transition:transform .15s} details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>.in{padding:0 18px 16px}
.rows{display:grid; gap:8px}
.frow{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--mist)}
.frow:last-child{border-bottom:0} .frow .fn{font-weight:600; overflow-wrap:anywhere; min-width:0}
.frow .fm{font-size:12.5px; color:var(--sage-70)}
.notice{background:var(--attention-bg); border-radius:8px; padding:10px 14px; margin:8px 0; font-size:14px}
.notice.bad{background:var(--red-bg); color:#6e1d17} .notice.good{background:var(--good-bg); color:var(--good)} .notice.info{background:var(--sage-10); color:var(--sage-dark)}

.linkbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
.linkbox input{flex:1 1 220px; min-width:0; border:1px solid var(--celadon); border-radius:8px; padding:9px 10px; background:var(--sage-10); font-size:13px}
.confirmbox{background:var(--red-bg); border:1px solid var(--red); border-radius:8px; padding:12px 14px; margin-top:12px}
.confirmbox.neutral{background:var(--attention-bg); border-color:var(--attention)}
.log{list-style:none; margin:0; padding:0; font-size:13.5px}
.log li{display:grid; grid-template-columns:150px 1fr; gap:2px 12px; padding:6px 0; border-bottom:1px solid var(--mist)}
.log li:last-child{border-bottom:0} .log .at{color:var(--sage-70); font-size:12.5px} .log .wh{overflow-wrap:anywhere}

/* modal */
.modalbg{position:fixed; inset:0; background:rgba(38,38,38,.5); z-index:600; display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto}
.modal{background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); width:100%; max-width:760px; padding:20px 22px 18px}
.modal h3{font-size:25px; color:var(--sage); margin-bottom:10px}
.contract{max-height:62vh; overflow:auto; border:1px solid var(--mist); border-radius:8px; padding:16px 18px; background:#fffefb; font-family:Georgia,"Times New Roman",serif; font-size:14px; line-height:1.55; color:#222}

.contract .cover{text-align:center; font-size:15px} .contract .ttl{text-align:center; font-size:21px; font-weight:700; margin:20px 0}

.contract .sig{margin-top:18px; border-top:1px solid #ccc; padding-top:10px}

@media (max-width:640px){
  .shell{padding:0 12px 48px} .topin,.tabsin{padding-left:12px; padding-right:12px}
  .pagehead h2{font-size:25px} .dhead h2{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .card{padding:14px 14px}
  details.sec>summary{padding:12px 14px; font-size:20px} details.sec>.in{padding:0 14px 14px}
  .kv,.kv.nocopy{grid-template-columns:1fr auto; gap:2px 8px} .kv dt{grid-column:1 / -1}
  .kv.nocopy dd{grid-column:1 / -1}
  .log li{grid-template-columns:1fr}
  .modal{padding:16px 14px 14px}
  .row-actions .btn,.formbtns .btn{flex:1 1 100%}
  .bigchoice label{padding:12px}
  .pagehead .btn:not(.small){flex:1 1 100%}
}
.formbtns{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 6px}
</style>
</head>

        const rows = flatten(P.payload, "", []);
        h += `${P.already ? `<div class="notice">This person was already created in Planday.</div>` : ""}${P.missing && P.missing.length ? `<div class="notice bad"><b>Still missing, so it cannot be created yet:</b><ul>${P.missing.map(m => `<li>${esc(m)}</li>`).join("")}</ul>The record cannot be edited after it is submitted, so create ${esc(s.first_name)} in Planday by hand and use the button below.</div>` : `<div class="notice good">Nothing is missing.</div>`}
          <dl class="kvs" style="margin-top:8px">${rows.map(([l, v]) => `<div class="kv nocopy"><dt>${esc(l)}</dt><dd>${v === "" || v === null || v === undefined ? '<span class="muted">Not set</span>' : esc(typeof v === "boolean" ? (v ? "Yes" : "No") : v)}</dd></div>`).join("")}</dl>`;
      }
      if (S.ui.confirm === "planday") h += `<div class="confirmbox neutral" role="alertdialog" aria-label="Create employee in Planday"><b>Create ${esc(fullName(s))} in Planday now?</b><div class="small" style="margin:4px 0 10px">This adds a real employee record to your Planday account.</div><div class="row-actions"><button class="btn small" data-act="pdyes">Yes, create the employee</button><button class="btn small ghost" data-act="pdno">Not yet</button></div></div>`;
      h += `<hr style="border:0;border-top:1px solid var(--mist);margin:16px 0"><div class="small muted">Prefer to do it by hand in Planday?</div><div class="row-actions" style="margin-top:6px"><button class="btn small ghost" data-act="markdone">I've created them in Planday myself</button></div>`;
    } else {
      h += `<div class="notice info" style="margin-top:0">${pd.configured ? "Planday is connected, but not with permission to create employees yet." : "Planday is not connected to this page yet."} That is fine: the details above are everything you need. Create ${esc(s.first_name)} in Planday by hand, upload their PDFs, then tell us here.${pd.error ? ` <span class="tiny">(${esc(pd.error)})</span>` : ""}</div>
        <div class="row-actions"><button class="btn" data-act="markdone">I've created them in Planday myself</button></div>`;
    }
    return h;
  }
  if (st === "in_planday") h += `<div class="notice good" style="margin-top:0"><b>${esc(s.first_name)} is in Planday.</b> ${s.planday_id ? "Planday ID " + esc(s.planday_id) + "." : ""} ${s.planday_at ? "Created " + esc(fmtDT(s.planday_at)) + "." : ""}</div><p class="small">Once their documents are uploaded and you have checked everything, mark this complete.</p><div class="row-actions"><button class="btn" data-act="markcomplete">Mark complete</button></div>`;
  if (st === "complete") h += `<div class="notice good" style="margin-top:0"><b>Complete.</b> ${s.planday_id ? "Planday ID " + esc(s.planday_id) + "." : "Created in Planday by hand."}</div><div class="row-actions"><button class="btn small ghost" data-act="reopen">Reopen</button></div>`;
  return h;
}
function logHtml(log){
  const rows = (log || []).slice().sort((a, b) => new Date(b.at) - new Date(a.at));
  return rows.length ? `<ul class="log">${rows.map(l => `<li><span class="at">${esc(fmtDT(l.at))}</span><span class="wh"><b>${esc(l.who || "")}</b> ${esc(l.what || "")}</span></li>`).join("")}</ul>` : `<p class="muted" style="margin:0">Nothing recorded yet.</p>`;
}
function renderDetail(){
  if (!S.d || S.route.name !== "detail") return;
  const keepY = window.scrollY, ae = document.activeElement, aeId = ae && ae.id, aePos = ae && ae.selectionStart;
  const d = S.d, s = d.starter, flags = (s.health_flags || []).length, h = s.health || {};
  const hasPayroll = s.details && Object.keys(s.details).length;
  const sec = (key, title, inner, dflt, badge) => `<details class="sec" data-key="${key}"${openKey(key, dflt) ? " open" : ""}><summary>${title}${badge || ""}</summary><div class="in">${inner}</div></details>`;
  $("#views").innerHTML = `<button class="back" data-act="back">&larr; All starters</button>
    <div class="card dhead"><div style="display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap"><div><h2>${esc(fullName(s))}</h2>
      <div class="muted">${esc(s.job_title || "")}${s.department_name ? " &middot; " + esc(s.department_name) : ""}</div>
      <div class="muted small">Starts ${esc(s.start_date ? fmtDay(s.start_date) : "(no date)")} &middot; ${esc(CONTRACT[s.contract_type] || "")}${s.contract_type === "hourly" && s.hourly_rate ? " at " + esc(money(s.hourly_rate)) + " an hour" : ""}${s.contract_type === "salaried" && s.salary ? " at " + esc(money(s.salary)) + " a year, " + esc(s.hours) + " hours a week" : ""}</div></div>
      <div class="badges" style="margin:0"><span class="badge st-${esc(s.status)}">${esc(STATUS[s.status] || s.status)}</span>${needsRisk(s) ? `<span class="badge risk">Risk assessment needed</span>` : ""}</div></div>
      <div class="muted small" style="margin-top:6px">${esc(s.email || "")}${s.mobile ? " &middot; " + esc(s.mobile) : ""}</div>
      ${headerActions(s, d)}</div>
    ${flagsBanner(s, h)}
    ${flags || s.risk_required || (s.risk_status && s.risk_status !== "none") ? riskBox(s) : ""}
    ${flags ? `<div class="conf">Health information is confidential: only share what the manager of this person needs.</div>` : ""}
    <div class="sechead">Progress</div><div class="card">${timelineHtml(s, d)}</div>
    ${sec("health", "Health questionnaire", `<div class="conf" style="margin-top:0">Health information is confidential: only share what the manager of this person needs.</div>${healthHtml(s)}`, flags > 0, flags ? `<span class="badge flags">${flags} flag${flags === 1 ? "" : "s"}</span>` : "")}
    ${sec("payroll", "Payroll details", `<div class="conf" style="margin-top:0">This is confidential: bank and personal details. Use Copy to paste into Planday or Xero, and do not share it further.</div>${payrollHtml(s)}<div class="sub-h" style="margin-top:20px">Tax checklist</div>${checklistHtml(s)}`, !!hasPayroll && s.status === "submitted")}
    ${sec("files", "Contract and forms", filesHtml(s, d.files), true, d.files && d.files.length ? `<span class="badge kind">${d.files.length}</span>` : "")}
    ${sec("planday", "Planday", plandayHtml(s), ["submitted", "in_planday"].includes(s.status))}
    ${sec("log", "Activity", logHtml(d.log), false)}
    <p class="muted tiny" style="margin:14px 2px">Opening this record is logged against your name, as it holds personal and health information.</p>`;
  window.scrollTo(0, keepY);
  if (aeId) { const n = document.getElementById(aeId); if (n && n.focus) { n.focus({ preventScroll:true }); try { if (aePos !== null && aePos !== undefined) n.setSelectionRange(aePos, aePos); } catch(e){} } }
}

/* ------------------------------------------------------------- settings */
function showSettings(){
  const st = S.settings || {}, lv = (S.health && S.health.levels) || {}, pd = S.planday || {};
  const f = (id, l, v, ph) => `<div class="field"><label for="${id}">${l}</label><input id="${id}" value="${esc(v || "")}" placeholder="${esc(ph || "")}"></div>`;
  $("#views").innerHTML = `<div class="pagehead"><h2>Settings</h2></div>
    <div class="card"><h3 style="font-size:23px;margin-bottom:8px">Notifications and links</h3>
      <div class="field"><label for="s_notify">Who is told when someone submits</label><textarea id="s_notify" placeholder="name@example.com">${esc((st.notify_emails || []).join("\n"))}</textarea><div class="hint">One email address per line, or separated by commas.</div><div class="ferr" id="e_notify"></div></div>
      <div class="field" style="max-width:240px"><label for="s_days">Link valid for (days)</label><input id="s_days" type="number" min="1" max="90" value="${esc(st.link_valid_days || 14)}"><div class="hint">After this a new link has to be sent.</div><div class="ferr" id="e_days"></div></div>
      <label class="switch"><input type="checkbox" id="s_auto"${st.auto_planday ? " checked" : ""}><span><b>Create the Planday employee automatically when a starter submits</b><br><span class="hint">Off by default. When it is off, you preview and create each employee yourself from their record, which lets you check the details first. ${pd.can_create ? "" : "Planday cannot create employees yet, so this has no effect until it can."}</span></span></label></div>
    <div class="card"><h3 style="font-size:23px;margin-bottom:2px">Who signs the contract for the employer</h3><div class="hint" style="margin-bottom:10px">Shown at the end of each contract.</div>
      <div class="grid2">${f("s_hs", "Hourly contracts: name", st.hourly_signatory)}${f("s_ht", "Hourly contracts: job title", st.hourly_signatory_title)}${f("s_ss", "Salaried contracts: name", st.salaried_signatory)}${f("s_st", "Salaried contracts: job title", st.salaried_signatory_title)}</div></div>
    <div class="formbtns"><button class="btn" data-act="savesettings">Save settings</button></div>
    <div class="sechead">How it works</div>
    <div class="card"><p style="margin-top:0">A new starter gets one link. On their phone, in their own time, they:</p>
      <ol style="margin:0 0 10px;padding-left:20px"><li>enter their payroll details and bank details</li><li>answer the HMRC starter checklist (the tax questions)</li><li>complete a confidential health questionnaire and sign it</li><li>choose whether to opt out of the 48-hour working week, and sign</li><li>read and sign their contract</li></ol>
      <p class="small muted">When they submit, the signed PDFs are made and the people above are told. The link can be re-sent at any time while it is open.</p>
      <div class="sub-h" style="margin-top:16px">What the flags mean</div>
      <p class="small muted" style="margin:0 0 6px">Their health answers are checked automatically. Anything that needs attention shows at the top of their record.</p>
      <div class="flagbox exclusion" style="margin-top:8px;padding:10px 14px"><h3 style="font-size:19px">${esc(lv.exclusion || "Do not handle food or start work until clear")}</h3><div class="small">Sickness or diarrhoea in the last 48 hours. They need to be symptom free for 48 hours before handling food.</div></div>
      <div class="flagbox risk" style="padding:10px 14px"><h3 style="font-size:19px">${esc(lv.risk || "A personal risk assessment is needed")}</h3><div class="small">A condition that could be affected by the job, such as asthma, diabetes, a back problem or pregnancy. Do the individual risk assessment with them. The hazards to think about are listed.</div></div>
      <div class="flagbox review" style="padding:10px 14px;margin-bottom:0"><h3 style="font-size:19px">${esc(lv.review || "Manager to read and consider")}</h3><div class="small">Worth knowing, such as allergies or medicines. No formal assessment is needed.</div></div>
      <div class="row-actions" style="margin-top:14px"><a class="btn small ghost" href="forms/Individual_Health_Risk_Assessment.docx" target="_blank" rel="noopener">Open the risk assessment form</a></div>
      <div class="conf">Health information is confidential: only share what the manager of this person needs.</div></div>`;
}
async function saveSettings(){
  const emails = $("#s_notify").value.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean), bad = emails.filter(x => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
  const days = Math.round(+$("#s_days").value);
  $("#e_notify").textContent = bad.length ? `Check ${bad.join(", ")}: not a valid email address.` : "";
  $("#e_days").textContent = !(days >= 1 && days <= 90) ? "Enter a number of days from 1 to 90." : "";
  if (bad.length || !(days >= 1 && days <= 90)) return;
  const r = await call("settings.save", { notify_emails:emails, link_valid_days:days, auto_planday:$("#s_auto").checked, hourly_signatory:$("#s_hs").value.trim(), hourly_signatory_title:$("#s_ht").value.trim(), salaried_signatory:$("#s_ss").value.trim(), salaried_signatory_title:$("#s_st").value.trim() });
  S.settings = r.settings || S.settings; toast("Settings saved."); showSettings();
}

/* ------------------------------------------------------------- actions */
async function afterAction(){ await loadDetail(S.route.id); S.list = null; }
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, sid = S.route.id;
  if (b.disabled) return;
  const busy = v => { b.disabled = v; };
  try {
    if (a === "filter") { S.filter = b.dataset.k; S.list = null; return showList(); }
    if (a === "refresh") { b.disabled = true; await loadList(); toast("Up to date."); return; }
    if (a === "new") return go("#/new");
    if (a === "back") { if (S.route.name === "form" && S.route.id) return go("#/s/" + encodeURIComponent(S.route.id)); return go("#/"); }
    if (a === "closemodal") return closeModal();
    if (a === "preview") { busy(true); try { await previewContract(); } finally { busy(false); } return; }
    if (a === "save" || a === "savesend") { busy(true); try { await saveForm(a === "savesend"); } finally { if (document.body.contains(b)) busy(false); } return; }
    if (a === "savesettings") { busy(true); try { await saveSettings(); } finally { busy(false); } return; }
    if (a === "copy") { const ok = await copyText(b.dataset.v); return toast(ok ? "Copied." : "Could not copy. Select the text and copy it by hand.", !ok); }
    if (a === "copyfield") { const f = $("#linkfield"); const ok = await copyText(f.value); if (!ok) { f.focus(); f.select(); } return toast(ok ? "Link copied." : "Press Ctrl+C (or hold and copy) to copy the link.", !ok); }
    if (a === "send") {
      busy(true); const r = await call("starter.send", { id:sid });
      S.ui.link = { link:r.link }; S.ui.sendNote = r.emailed ? null : { error:r.email_error || "The email could not be sent." };
      toast(r.emailed ? `Link emailed to ${S.d.starter.email}.` : "The email did not go. Copy the link and send it yourself.", !r.emailed);
      return afterAction();
    }
    if (a === "copylink") { busy(true); const r = await call("starter.link", { id:sid }); S.ui.link = { link:r.link, expires_at:r.expires_at }; S.ui.sendNote = null; renderDetail(); const ok = await copyText(r.link); return toast(ok ? "Link copied." : "Here is the link. Select it and copy.", !ok); }
    if (a === "cancelask") { S.ui.confirm = "cancel"; return renderDetail(); }
    if (a === "cancelno") { S.ui.confirm = null; return renderDetail(); }
    if (a === "cancelyes") { busy(true); await call("starter.cancel", { id:sid }); S.ui.confirm = null; S.ui.link = null; toast("Starter cancelled."); return afterAction(); }
    if (a === "riskstat") { S.ui.riskStatus = b.dataset.k; S.ui.riskDirty = true; S.ui.riskFor = sid; return renderDetail(); }
    if (a === "risksave") {
      const s = S.d.starter, status = S.ui.riskStatus || s.risk_status, note = ($("#risknote") || {}).value || "";
      busy(true); await call("starter.risk", { id:sid, status, note }); S.ui.riskDirty = false; S.ui.riskStatus = null; S.ui.riskNote = null; toast("Risk assessment saved."); return afterAction();
    }
    if (a === "openfile") {
      const w = window.open("", "_blank"); busy(true);
      try { const r = await call("file.url", { file_id:b.dataset.id }); if (w) { w.opener = null; w.location.href = r.url; } else { toast("Your browser blocked the new tab. Allow pop-ups for this page and try again.", true); } }
      catch(err){ if (w) w.close(); throw err; } finally { busy(false); }
      return;
    }
    if (a === "pdpreview") { busy(true); const r = await call("planday.preview", { id:sid }); S.ui.pd = r; renderDetail(); return; }
    if (a === "pdask") { S.ui.confirm = "planday"; return renderDetail(); }
    if (a === "pdno") { S.ui.confirm = null; return renderDetail(); }
    if (a === "pdyes") {
      busy(true);
      try { const r = await call("planday.create", { id:sid }); S.ui.confirm = null; S.ui.pd = null; toast("Created in Planday."); }
      catch(err){ S.ui.confirm = null; await loadDetail(sid); throw err; }
      return afterAction();
    }
    if (a === "markdone" || a === "markcomplete") { busy(true); await call("starter.complete", { id:sid, done:true }); toast("Marked complete."); return afterAction(); }
    if (a === "reopen") { busy(true); await call("starter.complete", { id:sid, done:false }); toast("Reopened."); return afterAction(); }
  } catch(err){ toast(err.message, true); if (b && document.body.contains(b)) b.disabled = false; }
});
document.addEventListener("input", e => {
  if (e.target.id === "risknote") { S.ui.riskNote = e.target.value; S.ui.riskDirty = true; S.ui.riskFor = S.route.id; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "ct" || t.name === "employment_type" || t.name === "term") {
    $$(`input[name="${t.name}"]`).forEach(r => r.closest("label").classList.toggle("on", r.checked));
    if (t.name === "ct") { $("#w_rate").classList.toggle("off", t.value !== "hourly"); $("#w_sal").classList.toggle("off", t.value !== "salaried"); $("#w_hours").classList.toggle("off", t.value !== "salaried"); }
  }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.tagName === "DETAILS" && d.dataset.key) { S.ui.open = S.ui.open || {}; S.ui.open[d.dataset.key] = d.open; } }, true);

/* ------------------------------------------------------------- auto refresh */
async function tick(force){
  if (document.visibilityState !== "visible" || $("#modalbg")) return;
  if (S.route.name === "list") return loadList(true);
  if (S.route.name === "detail" && S.d) {
    try {
      const d = await call("starters.list", { filter:"all" }), mine = d.starters.find(x => x.id === S.route.id), sig = detailSig(mine);
      S.list = null;
      if (mine && S.detailSig && sig !== S.detailSig) { S.detailSig = sig; await loadDetail(S.route.id, true); }
      else if (mine && !S.detailSig) S.detailSig = sig;
    } catch(e){}
  }
}
setInterval(() => tick(), 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - S.fetchedAt > 60000) tick(); });

/* ------------------------------------------------------------- boot */
function openGate(msg){ $("#gate").style.display = "flex"; $("#app").hidden = true; if (msg) $("#gerr").textContent = msg; }
$("#signout").addEventListener("click", () => { try { sessionStorage.removeItem("bhb_staff_email"); } catch(e){} openGate(); });
async function boot(){
  $("#app").hidden = false; $("#views").innerHTML = skeletonList();
  try {
    const [d, hj] = await Promise.all([call("bootstrap"), fetch("health.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null)]);
    S.me = d.me; S.settings = d.settings || {}; S.planday = d.planday || {}; S.templates = d.templates || []; S.health = hj;
  } catch(e){ $("#views").innerHTML = `<div class="card empty">${esc(e.message)}<br><br><span class="muted">Open this from the Staff Portal so it knows who you are.</span></div>`; return; }
  $("#whoname").textContent = S.me.name || S.me.email || "";
  await route();
}
(function(){ if (staffEmail()) { $("#gate").style.display = "none"; boot(); } else openGate(); })();
</script>
</body>
</html>
