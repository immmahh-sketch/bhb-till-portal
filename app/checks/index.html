<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#141414" />
<title>Black Horse Checks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Conservative CSS on purpose — some tablets run a stock Android 5.1
     WebView: no var(), no inset, no #rgba hex, no flex gap. See shared.js. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;
    background:#f0efe9;color:#141414;-webkit-user-select:none;user-select:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select{font:inherit}
  body{min-height:100vh;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    -webkit-justify-content:center;justify-content:center;padding:24px}
  .card{background:#f7f6f1;border:1px solid rgba(26,26,26,.14);border-radius:18px;padding:32px;max-width:420px;width:100%;margin:0 auto}
  .logobar{background:#141414;border-radius:10px;padding:14px 18px;text-align:center;margin:0 0 18px}
  .logobar img{height:30px;display:inline-block}
  .card h1{font-family:"Playfair Display",Georgia,serif;font-size:22px;text-align:center;margin:0 0 6px}
  .card p.sub{text-align:center;color:rgba(0,0,0,.5);font-size:13px;margin:0 0 20px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#5c6b52;font-weight:700;margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:12px;border:1px solid rgba(26,26,26,.14);border-radius:10px;background:#fff;font-size:16px}
  .btn{width:100%;padding:15px;border-radius:12px;background:#96402f;color:#fff;font-size:16px;font-weight:800}
  .err{color:#96402f;font-size:13px;min-height:16px;text-align:center;margin-top:4px}
</style>
</head>
<body>

<div class="card">
  <div class="logobar"><img src="./assets/logo.png" alt="Black Horse Beamish"></div>
  <h1>Checks</h1>
  <p class="sub">Choose what you'd like to do</p>
  <div class="fld">
    <label>What do you need?</label>
    <select id="dest">
      <option value="log">Log a check</option>
      <option value="portal">Portal</option>
    </select>
  </div>
  <div class="fld">
    <label>Password</label>
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
  </div>
  <div class="err" id="err"></div>
  <button id="go" class="btn">Continue</button>
</div>

<script src="./shared.js"></script>
<script>
"use strict";
function $(id){ return document.getElementById(id); }
function go(){
  var dest = $("dest").value;
  var pw = $("pw").value;
  if(dest === "log"){
    if(CFG.PASSWORD_LOG.indexOf(pw) > -1){
      try{ localStorage.setItem("checksUnlocked","1"); }catch(e){}
      location.href = "./log/";
      return;
    }
  } else {
    if(pw === CFG.PASSWORD_PORTAL){
      try{ sessionStorage.setItem("checksAdminOk","1"); }catch(e){}
      location.href = "./admin/";
      return;
    }
  }
  $("err").textContent = "Incorrect password";
}
$("go").onclick = go;
$("pw").addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });
</script>
</body>
</html>
