<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Winter Menu | The Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--brown:#3F2F28;--olive:#CCCDB4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:"Raleway",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
body.embed{min-height:0;background:transparent}
header{padding:22px 16px 8px;text-align:center}
header img{width:150px;display:block;margin:0 auto}
body.embed header{display:none}
main{width:100%;max-width:1320px;padding:12px 16px 20px}
body.embed main{padding:0 0 12px;max-width:none}
.stage{position:relative;width:min(100%,calc((100vh - 210px) * 1.414));min-width:300px;margin:0 auto;aspect-ratio:297/210;background:#0b0b0b;border-radius:3px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
body.embed .stage{width:100%;min-width:0;background:transparent;box-shadow:none}
#book{width:100%;height:100%;min-width:0!important;min-height:0!important}   /* the library sets a minimum width from minWidth (set high on purpose so it always shows one page): undo it */
.stf__parent{margin:0 auto}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--olive)}
.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:9px 18px;border-radius:30px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint.off{opacity:0}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.bar button,.bar a{appearance:none;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:500 10px/1 "Raleway",sans-serif;letter-spacing:.24em;text-transform:uppercase;padding:11px 16px;border-radius:30px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
.bar button:hover,.bar a:hover{background:rgba(255,255,255,.12);border-color:#fff}
.bar button:disabled{opacity:.3;cursor:default}
.bar button:focus-visible,.bar a:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.count{min-width:86px;text-align:center;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--olive)}
.rot{display:none;text-align:center;margin-top:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--olive)}
@media(max-width:600px) and (orientation:portrait){.rot{display:block}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:600px){.bar{gap:8px}.bar button,.bar a{padding:10px 12px;font-size:9px;letter-spacing:.18em}.hint{font-size:9px;letter-spacing:.16em;padding:8px 14px}}
body:fullscreen,body.fs{background:#000}
</style>
</head>
<body>
<header><img src="img/logo-white.png" alt="The Black Horse Beamish"></header>
<main>
  <div class="stage" id="stage">
    <div id="book" aria-label="The Black Horse Beamish Winter Menu 2026, a flip book of 16 pages"></div>
    <div class="loading" id="loading">Opening the menu</div>
    <div class="hint" id="hint">Click or drag a page corner to turn</div>
  </div>
  <div class="bar">
    <button id="prev" type="button" aria-label="Previous page">&#8592; Previous</button>
    <span class="count" id="count" aria-live="polite">01 / 16</span>
    <button id="next" type="button" aria-label="Next page">Next &#8594;</button>
  </div>
  <div class="bar">
    <button id="full" type="button">Full screen</button>
    <a id="pdf" href="Black-Horse-Beamish-Winter-Menu-2026.pdf" target="_blank" rel="noopener">Download PDF</a>
  </div>
  <p class="rot">Turn your phone sideways for a larger page</p>
  <ol class="sr" id="alts"></ol>
  <noscript><p style="margin-top:20px;text-align:center"><a style="color:#fff" href="Black-Horse-Beamish-Winter-Menu-2026.pdf">Open the menu as a PDF</a></p></noscript>
</main>
<script src="page-flip.browser.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const EMBED = Q.get("embed") === "1";                 // inside the website: no header, and it tells the page around it how tall it is
if (EMBED) document.body.classList.add("embed");
const tellHeight = () => { if (EMBED && parent !== window) parent.postMessage({ bhbHeight: document.documentElement.scrollHeight }, "*"); };
if (EMBED && window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);

const PAGES = [
  "Cover: The Winter Menu",
  "Welcome to the Black Horse Beamish, from the General Manager",
  "Lunch: hot sandwiches",
  "Lunch: cold sandwiches",
  "While you wait: focaccia, almonds, olives, cornichons, chorizo and duck gyoza",
  "Starters",
  "Pub classics: steak and ale pie, fish and chips, Forester's chicken",
  "Pub classics, continued: Cumberland ring, bacon chop, linguine and burgers",
  "Winter warmers",
  "The Grill: steaks and the Butcher's Block",
  "The Grill: hand-carved sirloin, sides and sauces",
  "Desserts",
  "Beamish and beyond: things to do in County Durham",
  "Stay and celebrate",
  "Visit us",
  "Back cover"
];
const N = PAGES.length;
const url = i => "pages/p" + String(i + 1).padStart(2, "0") + ".webp";
document.getElementById("alts").innerHTML = PAGES.map((t, i) => "<li>Page " + (i + 1) + ". " + t.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</li>").join("");

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const flip = new St.PageFlip($("book"), {
  width: 1188, height: 840, size: "stretch",
  minWidth: 2400, maxWidth: 3600, minHeight: 100, maxHeight: 3000,   // minWidth above any screen: one landscape page at a time
  usePortrait: true, showCover: false, drawShadow: true, maxShadowOpacity: .45,
  flippingTime: Math.min(+Q.get("ft") || 850, 8000), showPageCorners: true, mobileScrollSupport: false, swipeDistance: 24, autoSize: true
});
flip.loadFromImages(PAGES.map((_, i) => url(i)));

const show = i => {
  $("count").textContent = pad(i + 1) + " / " + pad(N);
  $("prev").disabled = i <= 0; $("next").disabled = i >= N - 1;
  $("hint").classList.add("off");
};
flip.on("init", () => { $("loading").remove(); show(0); setTimeout(() => $("hint").classList.add("off"), 6000); tellHeight(); });
flip.on("flip", e => show(e.data));
$("prev").onclick = () => flip.flipPrev();
$("next").onclick = () => flip.flipNext();
addEventListener("keydown", e => { if (e.key === "ArrowRight") flip.flipNext(); if (e.key === "ArrowLeft") flip.flipPrev(); });
$("full").onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => window.open(location.href.replace(/[?&]embed=1/, ""), "_blank"));
  else window.open(location.href.replace(/[?&]embed=1/, ""), "_blank");
};
document.addEventListener("fullscreenchange", () => { document.body.classList.toggle("fs", !!document.fullscreenElement); setTimeout(() => flip.update(), 150); });
</script>
</body>
</html>
