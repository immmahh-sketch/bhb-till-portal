<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Winter Menu | The Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--olive:#CCCDB4;--bar:84px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:"Raleway",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 14px 0}
/* the page fills the screen: as large as the height and width allow, always the brochure's 297 x 210 shape */
.stage{position:relative;width:min(100%,calc((100vh - var(--bar) - 14px) * 1.4142));width:min(100%,calc((100dvh - var(--bar) - 14px) * 1.4142));aspect-ratio:297/210;background:#0b0b0b;box-shadow:0 18px 60px rgba(0,0,0,.55)}
#book{width:100%;height:100%;min-width:0!important;min-height:0!important}   /* the library sets a minimum width from minWidth (set high on purpose so it always shows one page): undo it */
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--olive)}
.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(0,0,0,.62);padding:9px 18px;border-radius:30px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#fff;pointer-events:none;transition:opacity .6s;white-space:nowrap;font-weight:500}
.hint.off{opacity:0}
.bar{height:var(--bar);display:flex;align-items:center;justify-content:center;gap:16px;padding:0 14px}
.bar a{display:inline-flex;align-items:center;justify-content:center;min-width:170px;padding:15px 26px;border-radius:40px;border:1px solid rgba(255,255,255,.55);color:#fff;text-decoration:none;font:600 11px/1 "Raleway",sans-serif;letter-spacing:.26em;text-transform:uppercase;transition:background .2s,border-color .2s}
.bar a:hover{background:rgba(255,255,255,.14);border-color:#fff}
.bar a.primary{background:var(--green);border-color:var(--green)}
.bar a.primary:hover{background:#5d735f;border-color:#5d735f}
.bar .arrow{appearance:none;flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s}
.bar .arrow:hover:not(:disabled){background:rgba(255,255,255,.14);border-color:#fff}
.bar .arrow:disabled{opacity:.3;cursor:default}
.bar .arrow:focus-visible,.bar a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.bar a:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
@media(max-width:600px){.bar{gap:10px}.bar a{min-width:0;flex:1;padding:14px 10px;font-size:10px;letter-spacing:.18em}.hint{font-size:9px;letter-spacing:.16em;padding:8px 14px}}
/* phone held upright: no page, just a prompt to turn it (the stage stays laid out, hidden, so the book sizes itself correctly when the phone turns) */
.turn{display:none;text-align:center;padding:0 30px}
.turn svg{width:78px;height:78px;margin:0 auto 26px;display:block;animation:turn 3.2s ease-in-out infinite}
.turn b{display:block;font:600 13px/1.6 "Raleway",sans-serif;letter-spacing:.3em;text-transform:uppercase}
.turn span{display:block;margin-top:12px;font:500 11px/1.7 "Raleway",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}
@keyframes turn{0%,18%{transform:rotate(0)}50%,82%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media(max-width:700px) and (orientation:portrait){
  .stage{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none}
  .turn{display:block}
  .bar .arrow{display:none}
  .bar{gap:10px}.bar a{min-width:0;flex:1;padding:15px 10px;font-size:10.5px;letter-spacing:.16em}
}
/* phone turned sideways (or any short window): the page takes the whole height; the buttons sit in the side margins */
@media(max-height:520px) and (orientation:landscape){
  :root{--bar:0px}
  main{padding:6px}
  .bar{position:fixed;inset:0;height:auto;padding:0;pointer-events:none}
  .bar>*{pointer-events:auto;position:absolute}
  .bar .arrow{top:50%;margin-top:-24px;width:44px;height:44px;background:rgba(0,0,0,.55)}
  .bar #prev{left:max(10px,env(safe-area-inset-left))}.bar #next{right:max(10px,env(safe-area-inset-right))}
  .bar a{min-width:0;bottom:10px;padding:11px 14px;font-size:9px;letter-spacing:.16em;background:rgba(0,0,0,.55)}
  .bar a.primary{background:var(--green);right:max(10px,env(safe-area-inset-right))}
  .bar a:not(.primary){left:max(10px,env(safe-area-inset-left))}
  .hint{font-size:9px;padding:7px 14px;bottom:3%}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <div id="book" aria-label="The Black Horse Beamish Winter Menu 2026, a flip book of 16 pages"></div>
    <div class="loading" id="loading">Opening the menu</div>
    <div class="hint" id="hint">Click or drag a page corner to turn</div>
  </div>
  <div class="turn" role="status"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="19" y="6" width="26" height="52" rx="5"/><path d="M28 52h8"/></svg><b>Turn your phone sideways</b><span>The menu opens in landscape</span></div>
</main>
<nav class="bar" aria-label="Menu">
  <button id="prev" class="arrow" type="button" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <a href="https://www.blackhorsebeamish.co.uk/" target="_top">Homepage</a>
  <a class="primary" href="https://www.blackhorsebeamish.co.uk/booking" target="_top">Book a table</a>
  <button id="next" class="arrow" type="button" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>
<ol class="sr" id="alts"></ol>
<noscript><p style="text-align:center;padding:20px"><a style="color:#fff" href="Black-Horse-Beamish-Winter-Menu-2026.pdf">Open the menu as a PDF</a></p></noscript>
<script src="page-flip.browser.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const PAGES = [
  "Cover: The Winter Menu",
  "Welcome to the Black Horse Beamish, from the General Manager",
  "Lunch: hot sandwiches",
  "Lunch: cold sandwiches",
  "While you wait: focaccia, almonds, olives, cornichons, chorizo and duck gyoza",
  "Starters",
  "Pub classics: steak and ale pie, fish and chips, Forester's chicken",
  "Pub classics, continued: Cumberland ring, bacon chop, linguine and burgers",
  "Winter warmers",
  "The Grill: steaks and the Butcher's Block",
  "The Grill: hand-carved sirloin, sides and sauces",
  "Desserts",
  "Beamish and beyond: things to do in County Durham",
  "Stay and celebrate",
  "Visit us",
  "Back cover"
];
const N = PAGES.length;
const url = i => "pages/p" + String(i + 1).padStart(2, "0") + ".webp";
document.getElementById("alts").innerHTML = PAGES.map((t, i) => "<li>Page " + (i + 1) + " of " + N + ". " + t.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</li>").join("");

const $ = id => document.getElementById(id);
const flip = new St.PageFlip($("book"), {
  width: 1188, height: 840, size: "stretch",
  minWidth: 2400, maxWidth: 3600, minHeight: 100, maxHeight: 3000,   // minWidth above any screen: one landscape page at a time
  usePortrait: true, showCover: false, drawShadow: true, maxShadowOpacity: .45,
  flippingTime: Math.min(+Q.get("ft") || 850, 8000), showPageCorners: true, mobileScrollSupport: false, swipeDistance: 24, autoSize: true
});
flip.loadFromImages(PAGES.map((_, i) => url(i)));
const upd = () => { const i = flip.getCurrentPageIndex(); $("prev").disabled = i <= 0; $("next").disabled = i >= flip.getPageCount() - 1; };
flip.on("init", () => { $("loading").remove(); setTimeout(() => $("hint").classList.add("off"), 6000); upd(); });
flip.on("flip", () => { $("hint").classList.add("off"); upd(); });
$("prev").onclick = () => flip.flipPrev();
$("next").onclick = () => flip.flipNext();
matchMedia("(orientation:portrait)").addEventListener("change", () => setTimeout(() => flip.update(), 300));
addEventListener("keydown", e => { if (e.key === "ArrowRight") flip.flipNext(); if (e.key === "ArrowLeft") flip.flipPrev(); });
</script>
</body>
</html>
