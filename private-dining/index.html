<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your private dining event | Black Horse Beamish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#4D604F;--green-dark:#3F4F41;--brown:#3F2F28;--olive:#8A8F5F;--grey:#F4F4F1;--bone:#F8F8F8;--mist:#E3E5DE;--celadon:#CCCDB4;--white:#fff;--ink:#262626;--muted:#6B746C;--gold:#C9A56B;--gold-soft:#F6EFE0;--alert:#8C4A3F;--alert-bg:#F6EAE8;--good:#3F6B4A;--good-bg:#E8F1EA;
 --display:"Orpheus Pro","Cormorant Garamond",Georgia,serif;--body:Raleway,"Helvetica Neue",Arial,sans-serif;--radius:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;color:var(--brown);letter-spacing:.01em}
header.top{background:var(--green);color:var(--white);padding:24px 16px 26px;text-align:center;border-bottom:4px solid var(--gold)}
header.top .in{max-width:880px;margin:0 auto}
header.top img.logo{display:block;margin:0 auto 12px;height:48px;width:auto}
header.top .brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#E6D7B8;font-weight:600}
header.top .sub{font-family:var(--display);font-size:30px;line-height:1.15;margin-top:8px}
header.top .when{color:#E9EFE9;margin-top:6px;font-size:15px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--mist);display:flex;justify-content:center;gap:4px;padding:0 8px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--green);border-bottom-color:var(--gold)}
nav.tabs .badge{display:inline-block;background:var(--gold);color:var(--brown);border-radius:999px;font-size:11px;padding:1px 8px;margin-left:6px;letter-spacing:0}
main{max-width:880px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--white);border-radius:var(--radius);border-top:3px solid var(--green);box-shadow:0 1px 2px rgba(38,38,38,.06),0 8px 24px rgba(38,38,38,.06);padding:22px 20px;margin:0 0 18px}
.card h2{font-size:28px;margin-bottom:6px}
.card h3{font-size:21px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 8px}
.pill{display:inline-block;background:var(--gold-soft);color:var(--brown);border:1px solid var(--gold);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;margin:2px 6px 2px 0}
.pill.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:15px;margin:12px 0}
.err{background:var(--alert-bg);color:var(--alert);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
.ok{background:var(--good-bg);color:var(--good);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;margin:12px 0;font-weight:600}
label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--white);border:1px solid var(--celadon);border-radius:9px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--green);color:var(--white);border:0;border-radius:9px;padding:13px 24px;font-weight:700;letter-spacing:.05em;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{background:var(--green-dark)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);box-shadow:none}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.guest{border:1px solid var(--mist);border-left:4px solid var(--green);border-radius:var(--radius);padding:14px;margin:12px 0;background:#FCFCFA}
.guest .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.guest .head b{font-family:var(--display);font-size:19px;color:var(--green);flex:0 0 auto;min-width:62px}
.guest .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.guest .grid>div{min-width:0}
.guest .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--green);border-top:3px solid var(--gold);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:30}
.bar .btn{background:var(--gold);color:var(--brown)}
.bar .btn.ghost{background:transparent;color:var(--white);border:1px solid #fff}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--mist);text-align:left;vertical-align:top;font-size:15px}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.big{font-family:var(--display);font-size:42px;line-height:1.1;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:10px 0 6px}
.stat{background:var(--grey);border-radius:10px;padding:12px 14px}
.stat .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--display);font-size:28px;color:var(--brown)}
.stat.due .v{color:var(--green)}
pre.sheet{white-space:pre-wrap;word-wrap:break-word;font:inherit;background:var(--grey);border-radius:10px;padding:14px;margin:8px 0 0;max-height:520px;overflow:auto}
.muted{color:var(--muted)}.small{font-size:14px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid var(--celadon);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(38,38,38,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .box{background:var(--white);border-radius:var(--radius);border-top:3px solid var(--gold);max-width:460px;width:100%;padding:22px 20px}
footer{max-width:880px;margin:0 auto;padding:0 16px 120px;font-size:14px;color:var(--muted);text-align:center}
footer a{color:var(--green)}
@media (max-width:520px){header.top .sub{font-size:25px}.big{font-size:36px}}
</style>
</head>
<body>
<header class="top"><div class="in"><img class="logo" src="../app/logo-light.png" alt="Black Horse Beamish"><div class="brand">Private dining at Black Horse Beamish</div><div class="sub" id="evName">Your event</div><div class="when" id="evWhen"></div></div></header>
<nav class="tabs" id="tabs" role="tablist" hidden></nav>
<main id="app"><div class="card" style="text-align:center"><span class="spin"></span></div></main>
<footer id="foot"></footer>
<div class="modal" id="sendModal" role="dialog" aria-modal="true" aria-labelledby="smTitle"><div class="box">
<h2 id="smTitle" style="font-size:26px;margin-bottom:8px">Send your pre-order?</h2>
<p style="margin:0 0 14px" id="smText"></p>
<div style="display:grid;gap:10px"><button type="button" class="btn" id="smGo">Yes, send it</button><button type="button" class="btn ghost" id="smNo">Not yet, go back</button></div>
</div></div>
<script>
const API = "https://safcrtrfdzsnftghibot.supabase.co/functions/v1/dining-api";
const KEY = "sb_publishable_RGaIB8W145BFCWzOxamQvA_7VIkTHMU";
const T = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const gbp = n => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COURSES = ["starter", "main", "dessert"];
const S = { d:null, guests:[], notes:"", tab:"menu", payMsg:null, dirty:false };

async function call(action, payload){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer " + KEY, apikey:KEY }, body:JSON.stringify(Object.assign({ action, t:T }, payload || {})) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
  return j;
}
const ukDate = iso => new Intl.DateTimeFormat("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"Europe/London" }).format(new Date(String(iso).slice(0, 10) + "T12:00:00Z"));
const shortDate = iso => new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"short", year:"numeric", timeZone:"Europe/London" }).format(new Date(String(iso).slice(0, 10) + "T12:00:00Z"));
const menuOf = kind => S.d.menu[kind === "child" && S.d.menu.has_child_menu ? "child" : "adult"];
const coursesFor = kind => COURSES.filter(c => menuOf(kind)[c].length);
const hasMenu = () => COURSES.some(c => S.d.menu.adult[c].length);

async function load(keepTab){
  if (!/^[0-9a-f]{32}$/.test(T)) return fail("This link does not look right. Please use the link in your email, or contact us.");
  try {
    const d = await call("get"); S.d = d;
    document.title = d.event.name + " | Black Horse Beamish";
    $("#evName").textContent = d.event.name; $("#evWhen").textContent = ukDate(d.event.date) + (d.event.guests ? " · " + d.event.guests + " guests" : "");
    S.guests = d.guests.map(g => Object.assign({}, g)); S.notes = d.notes || "";
    if (!S.guests.length && hasMenu()) addGuests(Math.min(d.event.guests || 1, 60), true);
    if (!keepTab) S.tab = new URLSearchParams(location.search).get("paid") ? "pay" : "menu";
    render();
  } catch(e){ fail(e.message); }
}
function fail(m){ $("#tabs").hidden = true; $("#app").innerHTML = '<div class="card"><h2>Sorry</h2><p>' + esc(m) + '</p></div>'; foot(); }
function foot(){ const c = (S.d && S.d.contact) || { phone:"01207 232 569", whatsapp:"07455 850424", email:"events@blackhorsebeamish.co.uk" }; $("#foot").innerHTML = 'Need a hand? Phone ' + esc(c.phone) + ', <a href="https://wa.me/447455850424">WhatsApp ' + esc(c.whatsapp) + '</a> or email <a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>.<br>Black Horse Beamish, Red Row Estate'; }

function addGuests(n, silent){
  let seq = S.guests.reduce((m, g) => Math.max(m, g.seq), 0);
  for (let i = 0; i < n && S.guests.length < 200; i++) S.guests.push({ seq:++seq, name:"", kind:"adult", starter:"", main:"", dessert:"", allergies:"", dietary:"" });
  if (!silent) S.dirty = true;
}

/* ---------------------------------------------------------------- tabs */
function render(){
  const d = S.d, bal = d.balance;
  const tabs = [["menu", "Your menu"], ["event", "Your event"], ["pay", "Balance and payments"]];
  const nav = $("#tabs"); nav.hidden = false;
  nav.innerHTML = tabs.map(([k, l]) => '<button role="tab" data-tab="' + k + '" aria-selected="' + (S.tab === k) + '">' + l + (k === "pay" && bal && bal.outstanding > 0 ? '<span class="badge">' + gbp(bal.outstanding) + '</span>' : "") + (k === "menu" && !d.submitted_at && hasMenu() ? '<span class="badge">To do</span>' : "") + '</button>').join("");
  $("#app").innerHTML = S.tab === "menu" ? menuHtml() : S.tab === "event" ? eventHtml() : payHtml();
  foot();
  const bar = document.getElementById("bar"); if (bar) bar.remove();
  if (S.tab === "menu" && hasMenu() && !d.closed) document.body.insertAdjacentHTML("beforeend", '<div class="bar" id="bar"><button type="button" class="btn ghost" id="draft">Save and finish later</button><button type="button" class="btn" id="final">Send my pre-order</button></div>');
}
document.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); } });

/* ---------------------------------------------------------------- the menu */
function guestHtml(g, i){
  const cs = coursesFor(g.kind), mn = menuOf(g.kind), lock = S.d.closed ? " disabled" : "";
  const sel = c => '<div><label class="f" for="g' + g.seq + c + '">' + c[0].toUpperCase() + c.slice(1) + '</label><select id="g' + g.seq + c + '" data-seq="' + g.seq + '" data-f="' + c + '"' + lock + '><option value="">Choose</option>' + mn[c].map(x => '<option' + (g[c] === x ? " selected" : "") + ' value="' + esc(x) + '">' + esc(x) + '</option>').join("") + '</select></div>';
  return '<div class="guest" id="guest' + g.seq + '"><div class="head"><b>Guest ' + (i + 1) + '</b>' +
    '<div style="flex:1 1 180px"><label class="f" style="margin:0" for="n' + g.seq + '">Name</label><input type="text" id="n' + g.seq + '" data-seq="' + g.seq + '" data-f="name" value="' + esc(g.name) + '" maxlength="80" placeholder="e.g. Sam Jones"' + lock + '></div>' +
    '<div style="flex:0 0 130px"><label class="f" style="margin:0" for="k' + g.seq + '">Adult or child</label><select id="k' + g.seq + '" data-seq="' + g.seq + '" data-f="kind"' + lock + '><option value="adult"' + (g.kind === "adult" ? " selected" : "") + '>Adult</option><option value="child"' + (g.kind === "child" ? " selected" : "") + '>Child</option></select></div></div>' +
    '<div class="grid">' + cs.map(sel).join("") + '</div>' +
    '<div class="grid"><div><label class="f" for="a' + g.seq + '">Allergies (please be specific)</label><input type="text" id="a' + g.seq + '" data-seq="' + g.seq + '" data-f="allergies" value="' + esc(g.allergies) + '" maxlength="300" placeholder="e.g. nuts, shellfish"' + lock + '></div>' +
    '<div><label class="f" for="d' + g.seq + '">Dietary needs</label><input type="text" id="d' + g.seq + '" data-seq="' + g.seq + '" data-f="dietary" value="' + esc(g.dietary) + '" maxlength="300" placeholder="e.g. vegetarian, gluten free"' + lock + '></div></div>' +
    (S.d.closed ? "" : '<div class="tools">' + (i > 0 ? '<button type="button" class="btn ghost small" data-copy="' + g.seq + '">Same choices as the guest above</button>' : "") + '<button type="button" class="btn ghost small" data-del="' + g.seq + '">Remove this guest</button></div>') + '</div>';
}
function menuHtml(){
  const d = S.d;
  if (!hasMenu()) return '<div class="card"><h2>Your menu</h2><p class="lead">Your menu is not ready to choose from yet. We will email you as soon as it is, and you can come back to this page then. In the meantime you can see your event details and your balance above.</p></div>';
  const done = S.guests.filter(g => coursesFor(g.kind).every(c => g[c])).length;
  return '<div class="card"><h2>Choose your menu</h2><p class="lead">Please choose a ' + coursesFor("adult").join(", ").replace(/, ([^,]*)$/, " and $1") + ' for each guest, and tell us about any allergies. You can save and come back to this page as often as you like until the deadline.</p>' +
    '<p style="margin:10px 0 0">' + (d.submitted_at ? '<span class="pill ok">Sent to us ' + esc(shortDate(d.submitted_at)) + '</span>' : '<span class="pill">Not sent yet</span>') + (d.deadline_text ? '<span class="pill">Please choose by ' + esc(d.deadline_text) + '</span>' : "") + '<span class="pill">' + done + ' of ' + S.guests.length + ' guests chosen</span></p>' +
    (d.closed ? '<div class="err">The pre-order closed on ' + esc(d.deadline_text) + '. To change anything, please contact us.</div>' : "") + '<div id="topMsg"></div></div>' +
    S.guests.map(guestHtml).join("") +
    (d.closed ? "" : '<div class="card"><h3>Add more guests</h3><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div style="flex:0 0 120px"><label class="f" for="addN" style="margin-top:0">How many?</label><input type="number" id="addN" min="1" max="100" value="1" inputmode="numeric"></div><button type="button" class="btn ghost" id="addBtn">Add guests</button></div></div>') +
    '<div class="card"><h3>Anything else for the kitchen?</h3><label class="f" for="notes">Notes (optional)</label><textarea id="notes" maxlength="2000" placeholder="e.g. a birthday cake is coming, wheelchair access, a guest who needs their meal first"' + (d.closed ? " disabled" : "") + '>' + esc(S.notes) + '</textarea><div id="saveMsg"></div></div>';
}
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || !t.dataset.seq) return;
  const g = S.guests.find(x => x.seq === Number(t.dataset.seq)); if (!g) return; g[t.dataset.f] = t.value; S.dirty = true;
  if (t.dataset.f === "kind") { for (const c of COURSES) if (g[c] && !menuOf(g.kind)[c].includes(g[c])) g[c] = ""; const y = window.scrollY; render(); window.scrollTo(0, y); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.seq && (t.dataset.f === "name" || t.dataset.f === "allergies" || t.dataset.f === "dietary")) { const g = S.guests.find(x => x.seq === Number(t.dataset.seq)); if (g) { g[t.dataset.f] = t.value; S.dirty = true; } }
  if (t.id === "notes") { S.notes = t.value; S.dirty = true; }
});
const msg = (id, cls, text) => { const el = $(id); if (el) el.innerHTML = text ? '<div class="' + cls + '">' + esc(text) + '</div>' : ""; };
const payloadOf = final => ({ final, notes:S.notes, guests:S.guests.map(g => ({ seq:g.seq, name:g.name, kind:g.kind, starter:g.starter, main:g.main, dessert:g.dessert, allergies:g.allergies, dietary:g.dietary })) });
async function save(final, btn){
  msg("#saveMsg", "", "");
  if (final) {
    const missing = S.guests.find(g => coursesFor(g.kind).some(c => !g[c]));
    if (!S.guests.length) { msg("#saveMsg", "err", "Please add at least one guest."); return; }
    if (missing) { const i = S.guests.indexOf(missing); msg("#saveMsg", "err", "Please choose a " + coursesFor(missing.kind).filter(c => !missing[c]).join(" and ") + " for guest " + (i + 1) + (missing.name ? " (" + missing.name + ")" : "") + "."); const el = $("#guest" + missing.seq); if (el) el.scrollIntoView({ behavior:"smooth", block:"center" }); return; }
  }
  if (btn) btn.disabled = true;
  try {
    const r = await call("save", payloadOf(final)); S.dirty = false;
    if (final) S.d.submitted_at = r.submitted_at || new Date().toISOString();
    render();
    msg("#topMsg", "ok", final ? "Thank you. Your pre-order has been sent to us. You can come back to this page and change it until the deadline." : "Saved. Come back to this page whenever you are ready to finish.");
    window.scrollTo({ top:0, behavior:"smooth" });
  } catch(e){ msg("#saveMsg", "err", e.message); const el = $("#saveMsg"); if (el) el.scrollIntoView({ behavior:"smooth", block:"center" }); }
  if (btn) btn.disabled = false;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "draft") return save(false, b);
  if (b.id === "final") {
    const need = S.guests.filter(g => coursesFor(g.kind).some(c => !g[c])).length;
    if (need) return save(true, b);
    $("#smText").textContent = "You have chosen for all " + S.guests.length + " guest" + (S.guests.length === 1 ? "" : "s") + ". You can still come back and change it until " + (S.d.deadline_text || "the deadline") + ".";
    $("#sendModal").classList.add("on"); return;
  }
  if (b.id === "smNo") { $("#sendModal").classList.remove("on"); return; }
  if (b.id === "smGo") { $("#sendModal").classList.remove("on"); return save(true, $("#final")); }
  if (b.id === "addBtn") { const n = Math.max(1, Math.min(100, Number($("#addN").value) || 1)); addGuests(n); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (b.dataset.del) { if (!confirm("Remove this guest?")) return; S.guests = S.guests.filter(g => g.seq !== Number(b.dataset.del)); S.dirty = true; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (b.dataset.copy) {
    const i = S.guests.findIndex(g => g.seq === Number(b.dataset.copy)); if (i < 1) return; const from = S.guests[i - 1], to = S.guests[i];
    for (const c of COURSES) to[c] = menuOf(to.kind)[c].includes(from[c]) ? from[c] : ""; S.dirty = true;
    const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (b.id === "payBtn") return startPay(b);
});
window.addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---------------------------------------------------------------- the event */
function eventHtml(){
  const d = S.d, ev = d.event;
  const fns = d.functions.length ? '<table class="tbl"><thead><tr><th>Function</th><th>When</th><th class="n">Guests</th></tr></thead><tbody>' + d.functions.map(f => '<tr><td><b>' + esc(f.name) + '</b><div class="small muted">' + esc(f.status) + '</div></td><td>' + esc(shortDate(f.date)) + '<br>' + esc(f.start) + ' to ' + esc(f.end) + '</td><td class="n">' + esc(f.guests) + '</td></tr>').join("") + '</tbody></table>' : '<p class="muted">No functions to show yet.</p>';
  return '<div class="card"><h2>Your event</h2><p style="margin:6px 0"><span class="pill">' + esc(ukDate(ev.date)) + '</span>' + (ev.status ? '<span class="pill ' + (/confirm/i.test(ev.status) ? "ok" : "") + '">' + esc(ev.status) + '</span>' : "") + (ev.guests ? '<span class="pill">' + esc(ev.guests) + ' guests</span>' : "") + '<span class="pill">Booking ' + esc(ev.ref) + '</span></p>' +
    (ev.coordinator ? '<p class="small muted" style="margin:6px 0 0">Your events co-ordinator is ' + esc(ev.coordinator) + '.</p>' : "") + '</div>' +
    '<div class="card"><h3>The day</h3>' + fns + '</div>' +
    (d.whats_included ? '<div class="card"><h3>What is included</h3><pre class="sheet">' + esc(d.whats_included) + '</pre></div>' : "") +
    (d.function_sheet ? '<div class="card"><h3>Your function sheet</h3><p class="small muted" style="margin:0">This is the running order and the details we hold for your event. If anything is wrong or missing, please tell us.</p><pre class="sheet">' + esc(d.function_sheet) + '</pre></div>' : "") +
    '<div class="card"><h3>Something not right?</h3><p class="small muted" style="margin:0 0 10px">Tell us and we will put it right.</p><a class="btn ghost small" style="text-decoration:none;display:inline-block" href="' + esc(waLink("the details of my event")) + '" target="_blank" rel="noopener">Message us on WhatsApp</a></div>';
}
function waLink(about){ const e = S.d.event; return "https://wa.me/447455850424?text=" + encodeURIComponent("Hello, I have a question about " + about + " for " + e.name + " on " + shortDate(e.date) + " (" + e.ref + ")."); }

/* ---------------------------------------------------------------- balance and payments */
function payHtml(){
  const d = S.d, b = d.balance;
  const msgHtml = S.payMsg ? '<div class="' + S.payMsg.cls + '">' + esc(S.payMsg.text) + '</div>' : "";
  if (!b) return '<div class="card"><h2>Balance and payments</h2>' + msgHtml + '<p class="lead">We cannot reach the booking system to show your balance just now. Please try again in a few minutes, or contact us.</p></div>';
  const rows = d.ledger.map(l => ({ when:l.when, what:l.what, amount:l.amount })).concat(d.app_payments.filter(p => !p.posted).map(p => ({ when:p.when, what:"Paid online (being added to your booking)", amount:p.amount })));
  rows.sort((a, c) => String(a.when).localeCompare(String(c.when)));
  const pay = b.outstanding >= 1 ? '<div style="margin-top:16px"><label class="f" for="payAmt">How much would you like to pay?</label><div style="display:flex;gap:10px;flex-wrap:wrap"><div style="flex:1 1 160px"><input type="text" id="payAmt" inputmode="decimal" value="' + b.outstanding.toFixed(2) + '" aria-label="Amount in pounds"></div><button type="button" class="btn" id="payBtn">Pay by card</button></div><p class="small muted" style="margin:8px 0 0">You can pay any amount up to your balance. You will be taken to our secure card payment page and brought back here afterwards, and we will email you a receipt. If a large payment is declined, please phone us on ' + esc(d.contact.phone) + '.</p></div>' : "";
  return '<div class="card"><h2>Balance and payments</h2>' + msgHtml +
    '<div class="stats"><div class="stat"><div class="l">Total</div><div class="v">' + gbp(b.total) + '</div></div><div class="stat"><div class="l">Paid so far</div><div class="v">' + gbp(b.paid) + '</div></div><div class="stat due"><div class="l">Still to pay</div><div class="v">' + gbp(b.outstanding) + '</div></div></div>' +
    (b.fullyPaid ? '<div class="ok">Your booking is paid in full. There is nothing more to pay.</div>' : "") + pay + '</div>' +
    '<div class="card"><h3>Payments received</h3>' + (rows.length ? '<table class="tbl"><tbody>' + rows.map(r => '<tr><td>' + esc(shortDate(r.when)) + '</td><td>' + esc(r.what) + '</td><td class="n">' + gbp(r.amount) + '</td></tr>').join("") + '</tbody></table>' : '<p class="muted" style="margin:0">No payments yet.</p>') +
    '<p class="small" style="margin:12px 0 0"><a href="' + esc(waLink("the balance and payments")) + '" target="_blank" rel="noopener">Something doesn’t look right?</a></p></div>';
}
async function startPay(btn){
  const amt = Number(String($("#payAmt").value).replace(/[^0-9.]/g, "")), out = S.d.balance.outstanding;
  if (!isFinite(amt) || amt < 1) { S.payMsg = { cls:"err", text:"The smallest payment we can take is £1." }; return render(); }
  if (amt > out + 0.005) { S.payMsg = { cls:"err", text:"That is more than your balance of " + gbp(out) + "." }; return render(); }
  btn.disabled = true; btn.textContent = "One moment…";
  try { try { if (S.dirty) await call("save", payloadOf(false)); S.dirty = false; } catch(e){} const r = await call("pay.start", { amount:Math.round(amt * 100) / 100 }); location.href = r.url; }
  catch(e){ S.payMsg = { cls:"err", text:e.message }; render(); }
}
async function backFromPayment(){
  const id = new URLSearchParams(location.search).get("paid"); if (!id) return;
  try { history.replaceState(null, "", location.pathname + "?t=" + T); } catch(e){}
  S.payMsg = { cls:"note", text:"Checking your payment…" }; S.tab = "pay"; render();
  try {
    let c = await call("pay.check", { id });
    for (let i = 0; i < 4 && c.status === "pending"; i++) { await new Promise(r => setTimeout(r, 2500)); c = await call("pay.check", { id }); }
    await load(true); S.tab = "pay";
    S.payMsg = c.status === "succeeded" ? { cls:"ok", text:"Thank you. We have received your payment of " + gbp(c.amount) + ". A receipt is on its way to your email." }
      : c.status === "failed" ? { cls:"err", text:"That payment did not go through, so nothing has been taken. You can try again below, or phone us." }
      : { cls:"note", text:"Your payment is still being confirmed. If you were charged, please do not pay again: refresh this page in a minute." };
  } catch(e){ S.payMsg = { cls:"err", text:e.message }; }
  render();
}
load().then(backFromPayment);
</script>
</body>
</html>
